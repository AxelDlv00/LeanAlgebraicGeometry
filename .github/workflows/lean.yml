name: Lean CI

on:
  pull_request:
  push:
    branches: [palimpsest/main, main]

# Cancel superseded runs on the same PR/branch so the queue does not pile up.
concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lake-build:
    name: lake-build
    runs-on: ubuntu-latest
    # GitHub-hosted jobs cannot exceed six hours, so the cold path below must
    # remain within this bound even when no Actions cache service is available.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compute cache week
        id: cache-week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore elan toolchains
        id: elan-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.elan/toolchains
          key: ajcr-elan-${{ runner.os }}-${{ hashFiles('MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lean-toolchain', 'MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lake-manifest.json') }}

      - name: Restore Lake packages
        id: lake-packages-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .lake-packages
          key: ajcr-lake-packages-${{ runner.os }}-${{ hashFiles('MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lean-toolchain', 'MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lake-manifest.json') }}

      - name: Restore project build outputs
        id: project-build-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: MainProjects/Algebraic-Jacobian-Challenge-Rebuild/.lake/build
          key: ajcr-project-build-${{ runner.os }}-${{ hashFiles('MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lean-toolchain', 'MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lake-manifest.json') }}-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            ajcr-project-build-${{ runner.os }}-${{ hashFiles('MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lean-toolchain', 'MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lake-manifest.json') }}-

      - name: Build AJCR
        working-directory: MainProjects/Algebraic-Jacobian-Challenge-Rebuild
        shell: bash
        run: |
          # Remote mathlib oleans (mathlib4 cache server). Safe to fail open.
          lake exe cache get || true

          # AJCR's transitive imports make Lake's temporary setup files several
          # gigabytes on a cold build. Remove restored copies up front, then
          # unlink each setup file after its corresponding olean is complete.
          setup_roots=(./.lake/build/ir)
          for package_ir in ../../.lake-packages/*/.lake/build/ir; do
            if [[ -d "$package_ir" ]]; then
              setup_roots+=("$package_ir")
            fi
          done

          cleanup_finished_setups() {
            local setup prefix suffix olean
            while IFS= read -r -d '' setup; do
              if [[ "$setup" == */.lake/build/ir/*.setup.json ]]; then
                prefix="${setup%%/.lake/build/ir/*}"
                suffix="${setup#"$prefix/.lake/build/ir/"}"
                olean="$prefix/.lake/build/lib/lean/${suffix%.setup.json}.olean"
                if [[ -f "$olean" && "$olean" -nt "$setup" ]]; then
                  rm -f -- "$setup"
                fi
              fi
            done < <(
              find "${setup_roots[@]}" -type f -name '*.setup.json' -print0 2>/dev/null
            )
            return 0
          }

          find "${setup_roots[@]}" -type f -name '*.setup.json' -delete 2>/dev/null || true

          set +e
          lake build &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            cleanup_finished_setups
            sleep 15
          done
          wait "$build_pid"
          build_status=$?
          set -e
          cleanup_finished_setups
          exit "$build_status"

      - name: Save elan toolchains
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/palimpsest/main' && steps.elan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.elan/toolchains
          key: ajcr-elan-${{ runner.os }}-${{ hashFiles('MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lean-toolchain', 'MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lake-manifest.json') }}

      - name: Save Lake packages
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/palimpsest/main' && steps.lake-packages-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .lake-packages
          key: ajcr-lake-packages-${{ runner.os }}-${{ hashFiles('MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lean-toolchain', 'MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lake-manifest.json') }}

      - name: Save project build outputs
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/palimpsest/main' && steps.project-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: MainProjects/Algebraic-Jacobian-Challenge-Rebuild/.lake/build
          key: ajcr-project-build-${{ runner.os }}-${{ hashFiles('MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lean-toolchain', 'MainProjects/Algebraic-Jacobian-Challenge-Rebuild/lake-manifest.json') }}-${{ steps.cache-week.outputs.week }}
