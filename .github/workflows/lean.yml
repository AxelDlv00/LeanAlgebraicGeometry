name: Lean CI

on:
  pull_request:
  push:
    branches: [palimpsest/main, main]

# Cancel superseded runs on the same PR/branch so the queue does not pile up.
concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lake-build:
    name: lake-build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain', '**/lean-toolchain', 'lake-manifest.json', '**/lake-manifest.json') }}
          restore-keys: |
            elan-${{ runner.os }}-

      - name: Cache Lake packages and build
        uses: actions/cache@v4
        with:
          # Mathlib oleans + package builds dominate wall clock when cold.
          path: |
            .lake
            .lake-packages
            MainProjects/Algebraic-Jacobian-Challenge-Rebuild/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', '**/lake-manifest.json', 'lean-toolchain', '**/lean-toolchain', 'lakefile.lean', '**/lakefile.lean', 'lakefile.toml', '**/lakefile.toml') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: Build AJCR
        working-directory: MainProjects/Algebraic-Jacobian-Challenge-Rebuild
        run: |
          # Remote mathlib oleans (mathlib4 cache server). Safe to fail open.
          lake exe cache get || true
          lake build
