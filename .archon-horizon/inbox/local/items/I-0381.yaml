body: 'AJC B3 gate: the rigid-pushforward gate is DISCHARGED — a real instance, verified
  at the synthesis site (corrected twice; 2026-07-27)


  **This item has now been wrong twice in the same direction, and that is itself the
  lesson.** It first said the gate needed FOUR statements; it was corrected to ONE
  and to "there is deliberately no `instance : HasRigidPushforward`, because nothing
  produces `RigidPushforwardGammaBaseChange`". **Both of those are now FALSE.** Corrected
  in place again (janitor pass, run 0054 s0006) rather than archived, because the
  $\mathbb{P}^1$ template and the tooling gotcha below are durable. Pinned commit
  `744a74bf2`.


  **CURRENT STATE — the gate is a THEOREM.** `Adelic.instHasRigidPushforwardOfCurve`
  (`Picard/RigidPushforwardGammaBaseChange.lean`) is a **global instance** of `Scheme.HasRigidPushforward
  C` for every AJC curve — smooth of relative dimension one, proper, geometrically
  integral — with no hypothesis beyond the curve''s own. Both fields are theorems:


  - `locallyFree` is `rigidPushforwardLocallyFree_proved`, resting on `IsIntegral
  (ℙ¹_k)` (`instIsIntegralP1OverLeft`) and `P1RankIdentity k A` (`p1RankIdentity_proved`,
  for *every* `k`-algebra `A`; the `FiniteType` hypothesis the gate quantifies over
  turned out not to be needed);

  - `baseChange` comes by affine-target descent (`Picard/RigidPushforwardAffineDescent.lean`)
  from `rigidPushforwardGammaBaseChange_proved`, i.e. bijectivity of $\Gamma(\operatorname{Spec}
  A'',\top)\otimes_{\Gamma(\operatorname{Spec} A,\top)}\Gamma(C_A,L)\to\Gamma(C_{A''},g''^*L)$
  — the classical $H^0$ base-change fact, proved from Čech purity of the same $\mathbb{P}^1$
  engine.


  `hasRigidPushforward_of_leaves` is now historical: a four-leaf factorization, not
  a frontier.


  **WHY THE DISCHARGE IS BELIEVABLE, and this is the part to copy.** Measured at the
  **synthesis site**, per `I-0380`: the three extraction theorems of `Picard/RigidPushforward.lean`
  are restated in §4 of `RigidPushforwardGammaBaseChange.lean` *without* the `[HasRigidPushforward
  C]` binder, so Lean must synthesize the gate to elaborate them, and all three come
  out `[propext, Classical.choice, Quot.sound]`. The same measurement applied to `HasPicScheme`
  is what exposes `instHasPicScheme` as poisoned. First campaign gate in this project
  to reach a clean global instance.


  **NON-VACUITY IS ALSO SETTLED.** `Picard/RigidPushforwardP1Witness.lean` exhibits
  $\mathbb{P}^1$ itself as an object satisfying all three binders, so the headlines
  are not statements about the empty class. (`I-0429` recorded that no such object
  existed at the time it was filed; that gap is closed.)


  **HOW $\mathbb{P}^1$ INTEGRALITY FELL — the durable template.** Not by cohomology.
  Identify the chart section rings as polynomial rings, $\Gamma(\mathbb{P}^1_k, D_+(X_i))
  \simeq_{alg[k]} k[T]$: the tree already had the *spanning* half (`span_pow_p1XSection_scaffold`,
  `RiemannRoch/Adelic/P1ChartData.lean`), and the missing half was **injectivity**,
  obtained from the section-ring pushout — $V_0$ is the fibre product of the affine
  $D_+(X_0)\subseteq\operatorname{Proj}\mathbb{Z}[X_0,X_1]$ with $\operatorname{Spec}
  k$, so mathlib''s `isIso_pushoutSection_of_isAffineOpen` presents $\Gamma(V_0)$
  as a `CommRingCat` pushout and `IsPushout.desc` yields a retraction. Then "both
  chart rings are domains" gives integrality by `IsReduced.of_openCover` plus density
  of the overlap.


  Two facts worth carrying forward: the direct route through `HomogeneousLocalization.val_injective`
  **`isDefEq`-times-out** at the concrete grading — write it `Away.mk`-first; and
  mathlib v4.31 still has **no** integrality/irreducibility/reducedness API for `Proj`
  at all (it has all three for affine space, `AlgebraicGeometry/AffineSpace.lean:392/402/419`).


  **TOOLING GOTCHA (unchanged, and it is still the most re-usable line here).** `lake
  env lean <file>` does **not** run this project''s style linters (`linter.style.maxHeartbeats`,
  `linter.style.setOption`). A file can be silent under `lake env lean` and still
  warn under `lake build <module>`. Always finish a new module with a single-module
  `lake build` (~20-35 s warm) before calling it warning-free. Never run a bare `lake
  build` (43 min — see `I-0319`).


  **AND THE META-LESSON, earned by this item''s own two corrections.** A memory that
  records "the frontier is N statements" against a lane that is actively being worked
  goes stale within hours, and a stale frontier count is quoted as authority. Record
  the *technique* and the *tooling*, and point at the roadmap row for the count: here
  `AJC.picrep.rigidpushforward`.'
