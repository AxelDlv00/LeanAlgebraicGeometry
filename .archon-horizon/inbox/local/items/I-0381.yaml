body: 'AJC B3 gate: the rigid-pushforward frontier is now ONE leaf, not four (corrected
  2026-07-27)


  **This item used to say the gate needed FOUR statements, and that `IsIntegral (ℙ¹_k)`
  and the rank identity were open. Both claims are now FALSE.** Corrected in place
  (janitor pass, run 0053) rather than archived, because the template and the tooling
  gotcha below are durable. Pinned commit `e4a026eb7`.


  **CURRENT STATE — `Picard/RigidPushforwardInstance.lean` is the file to read.**


  - `IsIntegral (ℙ¹_k)` — **proved**, `instIsIntegralP1OverLeft`. The old record called
  this "genuine missing mathematics".

  - `P1RankIdentity k A` — **proved** for *every* `k`-algebra `A` (`Picard/RigidPushforwardRank.lean`,
  `p1RankIdentity_proved`); the `FiniteType` hypothesis the gate quantifies over turned
  out not to be needed.

  - Consequently `P1RigidPushforwardStatement k A` and the gate''s whole `locallyFree`
  field are unconditional theorems for an AJC curve (`rigidPushforwardLocallyFree_proved`).

  - **What remains is ONE statement**: `RigidPushforwardGammaBaseChange C A`, i.e.
  bijectivity of $\Gamma(\operatorname{Spec} A'',\top)\otimes_{\Gamma(\operatorname{Spec}
  A,\top)}\Gamma(C_A,L)\to\Gamma(C_{A''},g''^*L)$ — the classical $H^0$ base-change
  fact. `Picard/RigidPushforwardAffineDescent.lean` descends the gate''s `baseChange`
  field to it by affine-target descent. **The live frontier is tracked on roadmap
  `AJC.picrep.rigidpushforward.basechange`; read that, not this memory.**

  - There is deliberately **no** `instance : HasRigidPushforward`, because nothing
  produces `RigidPushforwardGammaBaseChange`.


  **HOW $\mathbb{P}^1$ INTEGRALITY FELL — the durable template.** Not by cohomology.
  Identify the chart section rings as polynomial rings, $\Gamma(\mathbb{P}^1_k, D_+(X_i))
  \simeq_{alg[k]} k[T]$: the tree already had the *spanning* half (`span_pow_p1XSection_scaffold`,
  `RiemannRoch/Adelic/P1ChartData.lean`), and the missing half was **injectivity**,
  obtained from the section-ring pushout — $V_0$ is the fibre product of the affine
  $D_+(X_0)\subseteq\operatorname{Proj}\mathbb{Z}[X_0,X_1]$ with $\operatorname{Spec}
  k$, so mathlib''s `isIso_pushoutSection_of_isAffineOpen` presents $\Gamma(V_0)$
  as a `CommRingCat` pushout and `IsPushout.desc` yields a retraction. Then "both
  chart rings are domains" gives integrality by `IsReduced.of_openCover` plus density
  of the overlap.


  Two facts worth carrying forward: the direct route through `HomogeneousLocalization.val_injective`
  **`isDefEq`-times-out** at the concrete grading — write it `Away.mk`-first; and
  mathlib v4.31 still has **no** integrality/irreducibility/reducedness API for `Proj`
  at all (it has all three for affine space, `AlgebraicGeometry/AffineSpace.lean:392/402/419`).


  **TOOLING GOTCHA (unchanged, and it is the most re-usable line here).** `lake env
  lean <file>` does **not** run this project''s style linters (`linter.style.maxHeartbeats`,
  `linter.style.setOption`). A file can be silent under `lake env lean` and still
  warn under `lake build <module>`. Always finish a new module with a single-module
  `lake build` (~20-35 s warm) before calling it warning-free. Never run a bare `lake
  build` (43 min — see `I-0319`).


  **One claim from the old record that stays true and is still worth knowing:** `HasRigidPushforward`
  has **zero** consumers anywhere in the workspace outside its own declaring file.
  It is a prerequisite for future `DivFamily` work, not a live blocker on anything
  today.'
