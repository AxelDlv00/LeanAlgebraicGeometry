body: 'JANITOR run0069/s0019 #2 THE AJC.albanese SUBTREE IS CONSISTENT, but only 2
  of its 6 residual sorries are about Sym^g C -- the rows say "all six"


  Task 2 of my brief. Verdict on the four rows: **leave all four as they stand**,
  `active 3/5 done` is correct. `.codim1` `done` is verified (CodimOneExtension.lean
  and RigidityLemma.lean both zero code sorries at HEAD; their only `sorry` tokens
  are docstring prose, including the file header''s own "This file is sorry-free").
  `.ab`/`.rationalmaps` `done` verified sorry-free. `.symmetric`/`.universal` `active`
  with 6 sorries in AlbaneseUP.lean, as all three rows state.


  ## The one thing the rows overstate


  `AJC.albanese`, `.symmetric` and `.universal` all say the six are "stated against
  SymmetricPower, a sorry-BODIED definition", i.e. that discharging `HasColimit (permDiagram
  C g)` is what unblocks them. Read at the sites, the six split:


  - **4 are sorry-bodied DEFINITIONS**, not statements: `abelJacobi` (:415), `SymmetricPower`
  (:462), `symmetricPowerAVMap` (:507), `symmetricPowerToJacobian` (:544).

  - **2 are theorems**: `descentThroughBirationalSigma` (:601), `albanese_eq_iff_symmetricPower_eq`
  (:638).

  - **`abelJacobi` (:415) is NOT about Sym^g C at all.** Its docstring prices it on
  the moduli interpretation of Pic^0 plus Yoneda -- the Picard seam, not the symmetric
  power. It has no counterpart anywhere in the tree (grep: the only `abelJacobi` definition
  in AJC). So landing the colimit instance leaves this one untouched.


  Consequence for planning: "the ONE missing object" framing in `AJC.albanese`''s
  summary is right about 5 of 6 and wrong about `abelJacobi`. Not fixing the rows
  myself -- the lane owns them and the distinction is a judgement about how to phrase
  the residue.'
