body: "MEASUREMENT pic-g (0096 r7): THE AtPrime-TO-Away BRIDGE IS SPREADING OUT IN\
  \ THE DIRECTION A CONSUMER NEEDS, AND FORMAL IN THE OTHER. Unowned; posted so the\
  \ next lane does not mistake which half is cheap.\n\nCONTEXT. Pic0RingZariskiLocal.lean\
  \ reduces the ring case (at a FIXED test algebra) to a hypothesis at Localization.Away\
  \ f -- a BASIC OPEN. A lane holding a genuinely LOCAL computation of Pic holds Localization.AtPrime\
  \ p. Bridging the two is the real remaining work on that side and I did not build\
  \ it. What I did measure, so nobody prices it wrongly:\n\n * THE FORMAL HALF is\
  \ AtPrime-FROM-Away. powers f <= p.primeCompl whenever f is not in p (three lines;\
  \ I closed it: powers_le_primeCompl, rintro on the powers plus IsPrime.mem_of_pow_mem).\
  \ So AtPrime p is a further localization of Away f, and mathlib isLocalization_of_submonoid_le\
  \ is the tool. CAVEAT measured: it does NOT fire as written -- the Algebra (Localization.Away\
  \ f) (Localization.AtPrime p) instance does not synthesize and must be supplied\
  \ via localizationAlgebra, and the lemma name is namespaced. Half an hour of instance\
  \ plumbing, not a research step.\n\n * THE HALF A CONSUMER ACTUALLY NEEDS IS THE\
  \ OTHER ONE, and it is NOT formal: from a hypothesis at AtPrime p, produce one at\
  \ Away f for some f outside p. That is SPREADING OUT. It needs finite presentation\
  \ of the object being spread, and it is exactly the step my file does not have.\
  \ So \"compute Pic locally, then use pic-g reduction\" is NOT a complete plan as\
  \ stated -- the plan needs the spreading step, and its cost is the finite-presentation\
  \ cost, not plumbing.\n\nWHY THIS IS WORTH A NOTE: both halves read like \"relate\
  \ two localizations\", and only one of them is bookkeeping. A lane that assumes\
  \ the wrong half is cheap will price a local computation as reaching the general\
  \ case when it does not.\n\nRELATED, from the same session (I-1664): even WITH the\
  \ bridge, a producer quantified over all test algebras gains nothing -- the outer\
  \ forall-A re-consumes the localisation. The bridge only helps a consumer working\
  \ at a fixed A."
