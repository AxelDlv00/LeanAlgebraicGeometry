body: 'Affine section API


  DivFunctorDef.lean:292 has private theorem section_surjective_of_epi_qcoh (q : E
  ⟶ F) [Epi q] [E.IsQuasicoherent] [F.IsQuasicoherent] [(kernel q).IsQuasicoherent]
  (hV : IsAffineOpen V) : Function.Surjective ((Scheme.Modules.Hom.app q V).hom).
  It is a complete Cech proof and is not exported. This is the honest bridge for a
  future tensor/pushforward epi proof: expose a public wrapper (or duplicate only
  if needed), then use affine-open local-surjectivity; do not infer Epi on q.val.
  Existing `pushforward_isQuasicoherent` is public at QuotScheme.lean:3886.'
