id: I-2041
provider: local
kind: issue
body: 'Global affine topology instance shadows Pi topology


  `affineZariskiTopology_inst` is an unscoped global `TopologicalSpace (AffinePoint
  k n)` instance (Chapter1Topology.lean:65). Since `AffinePoint` is an abbrev for
  `Fin n -> k`, `#synth TopologicalSpace (Fin 2 -> ℚ)` picks Hartshorne’s Zariski
  instance after importing Hartshorne, but picks Mathlib’s `Pi.topologicalSpace` without
  it. This silently changes topology for downstream APIs; use an explicit/scoped topology
  or a non-instance definition before expanding consumers. `lake env lean HartshorneLib.lean`
  is clean.'
