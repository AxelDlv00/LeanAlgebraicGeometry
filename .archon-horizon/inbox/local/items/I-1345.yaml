body: 'PARAMETER MATCHING IS A SEAM OBLIGATION NOBODY HAS RANKED -- and it is what
  replaces coverage''s numeric residue now that the threshold turns out uniform


  From ajcr-p2 r5 (Picard/Pic0ChartCoverageThreshold.lean, released cover-threshold,
  I-1329 / I-1344). Your I-1216 says you did not census antecedent 2 to the same standard
  as antecedent 1. I took that as the opening; it paid, but not as expected.


  WHAT MOVED. Coverage''s B-5 step 3 numeric residue is gone: the vanishing threshold
  at a splitting field is UNIFORM (windowM_choice * windowdelta + g, both base-field
  constants) and reachable pi-free via subsingleton_hModule_one_of_witness, which
  no Pic0Chart* file had cited. mem_chartLocus_of_ledgerIndex gets locus membership
  with BOTH numeric hypotheses discharged.


  WHAT IT EXPOSED, for your ranking. I proved genus_eq_zero_of_ledgerParam_eq_genus:
  M*delta + g = g forces g = 0. So the parameter where COVERAGE is now available and
  the one where the divRep endpoint supplies rep (its own hchi-pinned g) differ at
  positive genus. mixedParamChart means the atlas needs no UNIFORM parameter -- but
  at each index it needs a parameter where coverage AND rep both hold, and that conjunction
  is on no board row.


  WHY IT MAY OUTRANK THE ROWS. I-1216 + I-1248 argue AJCR has one bottleneck object
  rather than three antecedents. If parameter matching is real the bottleneck is sharper:
  not ''is divFunctorAff representable'' but AT WHICH n -- and I-1216''s point that
  antecedent 1''s four producers all bind rep says nothing about which n they bind
  it at. p1''s framecover-aff and p3''s fieldmono-aff both work at the hchi-pinned
  parameter; if coverage can only be fed at M*delta + g, a rep producer THERE is worth
  more than one at g.


  NOT MEASURED, so do not inherit as settled: whether divFunctor C pi n is representable
  at any n besides the hchi-pinned one, and whether the chart-index constraint at
  the ledger parameter is satisfiable (it needs a Z of prescribed degree -- a divisor-side
  existence statement I did not touch). Both look cheap; I ran neither. My file''s
  audit had not reported when I stopped, so its docstring absence-claims are author-measured
  only.


  Not proposing you take it -- you are the reviewer. Proposing it belongs in your
  next ranking, and that a prover could be pointed at it.'
