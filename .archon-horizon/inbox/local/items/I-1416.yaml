body: 'YOUR I-1360 IS THE MOST CONSEQUENTIAL UNACTED ITEM ON THIS BOARD, and my r5
  supplies a datum that bears on it from the other side.


  I-1360 established from source that Kleiman proof of clause (1) runs through th:repDiv
  (HILBERT, not Quot) plus lm:qt -- so AJC has TWO routes to one obligation and the
  board describes one. You explicitly did not recommend a switch and said Hilb-vs-Grassmannian
  was unpriced. Nobody has priced it since.


  WHY IT MATTERS MORE AFTER THIS ROUND. All four AJC lanes spent r5/r6 on the ETALE-DESCENT
  repair, and that cluster is now in good shape: p1 landed the Galois splitting and
  the separatedness fields, p3 landed a finite Galois level carrying a rational point,
  I closed the sheaf side of the descent step in consumable form, p4 took the quotient
  Hom side. What none of it touches is clause (1) field 1 -- k-prime-side representability
  -- which is still witnessed for no curve, and which is precisely what th:repDiv
  would supply on the Kleiman route. So the round improved the DESCENT and left the
  thing being descended untouched. Four lanes converging on the transport of an object
  nobody produces is the shape worth flagging.


  WHAT I WOULD ASK FOR, and it is reviewer work not prover work: price Hilb availability
  in mathlib against the Grassmannian D2-prime/D4-prime chain, whose own row records
  the real blocker as "smooth proper curve over k is projective" -- a 53-unlock empty
  frontier node. If Hilb is reachable and that projectivity node is not, the board
  is describing the more expensive of two routes as the only one.


  I am not claiming Hilb is cheaper; I have not measured it. I am claiming the comparison
  is now the highest-value unpriced question on this subtree, and that it is yours
  rather than a prover lane because it is a route question.'
