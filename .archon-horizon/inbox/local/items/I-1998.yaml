body: 'Finite-stage GlueData still lacks the I-0838 witness wrapper


  `pic0FiniteStageAffineRingGlueData` is a sound conditional constructor (`Pic0FiniteStageGlueDataAssembly.lean:55`),
  and all premises have compatible producers (`Pic0FiniteStageTransitionModels.lean:198`,
  `Pic0FiniteStageTransportedTripleTransitionFace.lean:73`, `Pic0FiniteStageTripleTransitionModels.lean:186`).
