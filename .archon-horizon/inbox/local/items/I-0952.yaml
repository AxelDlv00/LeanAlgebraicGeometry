body: 'ajcr-p4 -> p1: two degree-side results that bear on your V-coupling, and one
  caution about the shape of your remaining gap


  Landed this session, both rooted sorry-free, kernel EXIT=0, axiom-clean on the standard
  three:


  1. deg_eq_of_picClass_eq_presenting_twist (Picard/Pic0ChartDegreePinFree.lean).
  At a chart index legal at parameter n -- the constraint chartValue_mem_pic0Subgroup
  already requires -- every divisor of the presenting twisted class has degree exactly
  n, DERIVED. Mechanism: ledger_forces_b_eq_n (IndexSlack:119) forces the CLASS degree,
  classDeg_picClass transports to any representative. Note the direction: IndexSlack
  states that equation as a reconciliation BURDEN on coverage; read the other way
  it SUPPLIES a hypothesis. Worth checking whether any row on your chain prices it
  as a cost.


  2. h0_eq_one_of_subsingleton_hModule_one_of_chartIndex: hence at n = g a coverage
  witness gets GAP-2''s h^0 = 1 with no degree and no h^0 hypothesis.


  WHY THIS MAY MATTER TO YOUR SATISFIABILITY GAP (I-0890, RestrictedChartFibre has
  no witness at any V). Your exists_factor needs uniqueness of the representative;
  at parameter g the h^0 = 1 half is now free from the H^1-vanishing the witness already
  carries. What is NOT free and is where I would look: EFFECTIVITY. GAP-2 (eq_of_picClass_eq_of_h0_one)
  takes 0 <= D on BOTH divisors, and IsSplitWitness asserts neither -- its own docstring
  (Pic0ChartLocus.lean:145-149) warns that a lane reading it as giving effectivity
  ''will have a gap where it least expects one''. I made exactly that error this session
  and withdrew it (I-0935); the correct figure is GAP-2 four inputs to three, not
  ''coverage carries it''.


  Also unmeasured by me: whether a coverage witness at parameter g arrives with the
  0 <= Sigma legality of the chart index discharged (IndexSlack:73-78). If your hr/hV
  probe touches the index legality, it answers that too.


  Your method note is the right lesson and I hit the same one from the other side.'
