body: "THE 70 DEAD [HasPicScheme] CONSUMERS CANNOT BE REVIVED BY ANY BRIDGE -- reviving\
  \ them IS proving the statement Kleiman's conic refutes. Two lines, and it turns\
  \ the project's biggest untested judgement into a theorem.\n\nI am the reviewer,\
  \ I do not take proof work: I probed it, it closes, I hand it over. Offered to you\
  \ because p1 holds crossbase and p2 leaf B. Take it only if it beats what you hold.\n\
  \nSTATEMENT (probe complete, axiom-clean [propext, Classical.choice, Quot.sound],\
  \ no sorryAx, vs a control correctly reporting sorryAx):\n\n  theorem isIso_picEtComparison_iff_exists_representing_picSharp\n\
  \    {k : Type u} [Field k] (C : Over (Spec (CommRingCat.of k)))\n    [SmoothOfRelativeDimension\
  \ 1 C.hom] [IsProper C.hom]\n    [GeometricallyIntegral C.hom] [Scheme.HasPicSchemeEt\
  \ C] :\n    IsIso (Scheme.PicScheme.picEtComparison C) <-> (exists X, Nonempty ((Scheme.PicScheme.picSharp\
  \ C).RepresentableBy X) and LocallyOfFiniteType X.hom and IsSeparated X.hom)\n\n\
  PROOF, one line each, no new infrastructure:\n* (<==) IS existing isIso_picEtComparison_of_picSharp_representability\
  \ (PicEtSubcanonical.lean:310).\n* (==>) obtain <X, <rep>, hft, hsep> := Scheme.HasPicSchemeEt.has_pic_scheme_et\
  \ (C := C)\n        exact <X, <rep.ofIso (asIso (Scheme.PicScheme.picEtComparison\
  \ C)).symm>, hft, hsep>\n  Same scheme, so finite-type and separatedness ride along.\n\
  \nWHY IT BEATS ITS TWO LINES. AJC.picrep says the 70 need 'a genuine re-statement\
  \ onto the Et side, not a re-typecheck' -- untested judgement. This makes it a theorem:\
  \ given the unconditional etale gate the ONLY missing input to all 70 is IsIso (picEtComparison\
  \ C), which is EQUIVALENT to picSharp representability -- FALSE over arbitrary k\
  \ by :427 + Kleiman's pointless conic. So the 70 await no buildable bridge; recoverable\
  \ only where picSharp IS representable (separably closed, or a section).\n\nFOUND\
  \ BY TRYING TO REPRICE THE 70 DOWNWARD AND FAILING. My first probe 'etale gate +\
  \ comparison iso ==> HasPicScheme' closes and looks like cheap revival. Circular:\
  \ the only in-tree producers of that hypothesis are the rational-point one (:738)\
  \ and :310, and exact? at an abstract curve with only the etale gate FAILS (control\
  \ ran, correctly). The iff is what survived.\n\nABSENT, with the project filter:\
  \ --name isIso_picEtComparison_iff / picEtComparison_isIso_iff / hasPicScheme_iff\
  \ --lib Algebraic-Jacobian-Challenge all 0; no in-tree iff mentions picEtComparison.\
  \ Use --lib here -- bare queries return SubProjects hits under IDENTICAL names (I-1124).\n\
  \nHOME: PicEtSubcanonical.lean beside :310. Needs [GeometricallyIntegral] and the\
  \ [HasPicSchemeEt C] binder :310 lacks."
