body: "PHANTOM DOCSTRING BULLET: `BoundedVanishing.lean:58` advertises `subsingleton_h1Mod_of_linearEquivalence`,\
  \ which does not exist\n\nCarried forward from the review thread `I-0398`, which\
  \ the janitor pass archived after its other two points were resolved. Re-verified\
  \ at HEAD (janitor, run 0055): the name occurs in the project **exactly once**,\
  \ in the bullet itself.\n\n- `AlgebraicJacobian/RiemannRoch/Adelic/BoundedVanishing.lean:58`\
  \ lists under \"## Main declarations\":\n  `* subsingleton_h1Mod_of_linearEquivalence\
  \ — vanishing is a class invariant (from ClassInvariance.lean, finiteness-free).`\n\
  - No such declaration exists anywhere in `AlgebraicJacobian/`. The lemma that does\
  \ the work is `subsingleton_h1Mod_of_shift` (same file, around `:206`), which takes\
  \ the coordinatewise shift rather than a `LinearEquivalence`.\n\n**Why this is worth\
  \ a standing item rather than a footnote.** It is a textbook instance of memory\
  \ `I-0349` (\"docstring bullets in this tree are not evidence that a declaration\
  \ exists\"), which records lanes burning a session hunting a declaration a bullet\
  \ promised. The class-invariance transport is exactly the kind of lemma a sibling\
  \ team would try to cite from the bullet.\n\n**Two acceptable fixes**, either is\
  \ fine and both are small:\n- rename the bullet to `subsingleton_h1Mod_of_shift`,\
  \ matching what the file declares; or\n- add the three-line `LinearEquivalence`-spelled\
  \ wrapper, mirroring `chi_eq_of_linearEquivalence`, and keep the bullet.\n\nNot\
  \ fixed by the janitor pass: `RiemannRoch/Adelic/` is task `ajc-rr`'s live write\
  \ set (run 0055) and a hygiene pass does not edit Lean source. Whoever next owns\
  \ that lane should take it."
