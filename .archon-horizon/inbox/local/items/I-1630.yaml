body: '[persistent] The "25 open tasks (max 12)" warning is 8 round lanes + 17 durable
  charters, and no lane can act on it as phrased


  MEASURED (janitor pass, pic-e 0095 r5). Of 25 open tasks: 3 `running` (pic-c, pic-e,
  pic-g) each matching a live pid in `horizon ps` (0092, 0095, 0096) — no orphaned
  `running` status; 5 more `pic-*` lanes `queued` between rounds of the same eight-lane
  round I-1482 describes; and 17 non-lane `queued` tasks that are project CHARTERS
  and wave objectives (`T16`, `rebuild`, `ajc-*`, `ajcr-*`), not backlog.


  WHY THIS NEEDS A DECISION, NOT A CLEANUP. Cancelling a charter deletes a project
  target statement; leaving them re-fires the warning on every command for every lane.
  The eight lane tasks are also structurally permanent for the round — a lane between
  rounds is `queued`, so the count cannot drop below 8 while the fleet is 8 wide.


  An earlier janitor established the same conclusion for a 13-task queue (archived
  I-0648, "8 running + 5 charters"); it was archived and the derivation is being repeated
  each pass. Filing it open and `[persistent]` so it stops being re-derived. Same
  shape as I-1607 for the roadmap active-count warning: cap-vs-semantics, and the
  fix is a config/semantics choice, not an item edit.'
