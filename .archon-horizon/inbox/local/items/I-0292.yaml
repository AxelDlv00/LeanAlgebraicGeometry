body: "redesign seedUniv revision + fibre-cutter BUILD — the ann-based fibre-cutter\
  \ ENGINE + the redesigned seed's DIRECT isGenerator landed (all keystones green,\
  \ axiom-clean, committed). The concrete seedUniv' value + RD-N pinned (blocked on\
  \ brick-1 carve wiring hsub_seedUniv, I-0290).\n\n=== COMMITS (this lane) ===\n\
  - 1682735d8  DD-4 redesign: the ann-based fibre-cutter engine (h z in ann(N z))\
  \ + DIRECT hdvd. New file Picard/DivSchemeRedesignFibreCut.lean (160 L).\n- e82a876cd\
  \  DD-4 redesign: the redesigned seed's isGenerator from the ann-cutter. New file\
  \ Picard/DivSchemeRedesignSeed.lean (83 L).\nBoth single-module LEAN_NUM_THREADS=1\
  \ lake build GREEN under the mkdir lock (7.4s / 6.6s, 8661/8665 jobs). Root: HEAD-blob\
  \ + only my import lines (after DivSchemeRedesignAchiever, then DivSchemeRedesignFibreCut);\
  \ sibling working-tree PicEtCrossBaseGraph add + Hinj/Achiever removals NOT swept.\
  \ Zero sorries, zero new warnings (Pic.lean show + Challenge.lean sorries pre-existing).\n\
  \n=== THE FIBRE-CUTTER: I-0288 fact 2 DISSOLVED (h z NO LONGER algebraMap f) ===\n\
  The old h z = algebraMap f (base-only) made D(h z) the WHOLE fibre chart (I-0288),\
  \ so hle demanded achievement everywhere. The redesign's h z in ann(N z) is a GENUINE\
  \ relative fibre-cutter: on D(h z) the base ideal J z collapses to <read sec z>,\
  \ so hdvd is DIRECT. Probe (I-0289 §2) confirmed NO in-tree relative fibre-cutter\
  \ existed; ann(N z) via mathlib Module.support is the route, built here.\n\n===\
  \ KEYSTONES (VERBATIM; namespace AlgebraicGeometry, R = abstract test ring) ===\n\
  \n(1) exists_mem_annihilator_notMem_of_notMem_support {A} [CommRing A] (N) [AddCommGroup\
  \ N] [Module A N] [Module.Finite A N] {p : PrimeSpectrum A} (hp : p not-in Module.support\
  \ A N) : exists h : A, h in Module.annihilator A N and h not-in p.asIdeal\n  — the\
  \ pure CA core (Module.mem_support_iff_of_finite + SetLike.not_le_iff_exists).\n\
  \n(2) IsAffineOpen.exists_mem_basicOpen_forall_smul_eq_zero {X : Scheme} {V : X.Opens}\
  \ (hV : IsAffineOpen V) (N) [AddCommGroup N] [Module Gamma(X,V) N] [Module.Finite\
  \ Gamma(X,V) N] {z : X} (hz : z in V) (hsupp : hV.primeIdealOf <z,hz> not-in Module.support\
  \ Gamma(X,V) N) : exists h : Gamma(X,V), z in X.basicOpen h and forall n : N, h\
  \ . n = 0\n  — the fibre-cutter EXISTENCE: z not-in supp(N z) (= RD-N) gives the\
  \ ann cutter h with z in D(h). Point->prime via IsAffineOpen.primeIdealOf / fromSpec_primeIdealOf\
  \ / fromSpec_preimage_basicOpen.\n\n(3) Scheme.resHom_mem_span_singleton_of_mul_mem\
  \ {X : Scheme} {U : X.Opens} (h e s : Gamma(X,U)) (hmul : h*s in Ideal.span {e})\
  \ : X.resHom (X.basicOpen_le h) s in Ideal.span {X.resHom (X.basicOpen_le h) e}\n\
  \  — the DIRECT-hdvd engine: h unit on D(h) (Scheme.isUnit_resHom_of_eq_basicOpen)\
  \ => the cofactor divides through.\n\n(4) ThetaGeneratorSeed.hdvd_of_forall_smul_relThetaResSide_mem_span\
  \ (D) (hann : forall z {psi}, psi in K -> D.h z * relThetaResSide a (D.side z) le_rfl\
  \ psi in Ideal.span {relThetaResSide a (D.side z) le_rfl (D.sec z)}) : forall z\
  \ {psi}, psi in K -> relThetaResSide a (D.side z) (D.piece_le z) psi in Ideal.span\
  \ {D.eqn z}\n  — the seed-shaped DIRECT hdvd: the ann containment per point IS the\
  \ hdvd clause of isGenerator_of_fibre_ne_zero, via resHom_relThetaResSide.\n\n(5)\
  \ ThetaGeneratorSeed.isGenerator_of_ann_cutter (D) [SmoothOfRelativeDimension 1\
  \ C.hom] [GeometricallyIrreducible C.hom] (hann : the (4) ann containment) (hfib\
  \ : achiever fibrewise nonvanishing, the isGenerator_of_fibre_ne_zero shape) : D.IsGenerator\n\
  \  = D.isGenerator_of_fibre_ne_zero (D.hdvd_of_forall_smul_relThetaResSide_mem_span\
  \ hann) hfib\n  — the redesigned isGenerator_seedUniv: SIMPLER finale (DivSchemeSeed:188),\
  \ NOT the fibrewise-ker-span capstone; DIRECT hdvd, no per-fibre hfield.\n\n===\
  \ RESIDUAL — the concrete seedUniv' + RD-N (next lane) ===\n1. seedUniv' VALUE:\
  \ mirror the old seedUniv (DivSchemeSeedUnivGen.lean Classical.choose per point),\
  \ swap sec := exists_relThetaWindowEquiv_mem_divUniversalSeedK_achieves_seedPrime\
  \ (brick 2, I-0291), h := the ann-cutter (2). The h field needs, per z, the premise\
  \ 'z not-in supp(N z)' over Gamma(chart) — i.e. RD-N. seedUniv'.IsGenerator is then\
  \ isGenerator_of_ann_cutter (hann from the ann-cutter's smul_eq_zero -> mul-in-span,\
  \ hfib from the achiever windowCompare!=0 span bridge, exactly as old seedUniv's\
  \ hfib).\n2. RD-N (read_sec_generates_stalk, spec §1.3): span{read sec z} = J z\
  \ at stalk O_z, equivalently hV.primeIdealOf z not-in Module.support Gamma(chart)\
  \ (N z). Inputs: (i) read sec z in J z; (ii) achiever generates J-bar_p at z (brick\
  \ 2); (iii) J z R_Z-flat (brick 1, forall_flat_colength_quotient_of_hspan, I-0290,\
  \ but its hsub_seedUniv carve wiring is the UNBUILT XL residual). Proof shape: flat\
  \ => J cap pGamma = pJ (no Tor_1), J-bar_p = J/pJ, Nakayama over O_z. The k[eps]\
  \ guard (I-0231) lives here: MUST route through flatness. To feed the fibre-cutter\
  \ (2), bridge Module.support Gamma(chart) at primeIdealOf z to the stalk O_z via\
  \ hV.isLocalization_stalk.\n3. hann from smul: the cutter (2) gives 'forall n :\
  \ N z, h . n = 0' with N z = image of readings mod <read sec z>; that yields 'h\
  \ z * read psi in <read sec z>' (hann shape of (4)/(5)) once N z is set up as the\
  \ chart-level sideColengthSubmodule analog (over the chart V, le_rfl, not the piece)."
