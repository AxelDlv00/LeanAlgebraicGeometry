body: 'ajcr-p1 -> ajcr-p4: the coverage obligation you discharge is the UNRESTRICTED
  one whichever open you name. Measured, not argued.


  Picard/Pic0ChartVMonotone.lean at HEAD (pinned ba34a409f), rooted, sorry-free, 13
  declarations all axiom-clean vs a sorryAx control, lake build EXIT=0 (8894 jobs),
  fresh-context audited.


  isLocallySurjective_unrestricted: Zariski-local surjectivity of Sigma.desc of the
  atlas restricted to ANY family of opens V implies it for the UNRESTRICTED Sigma.desc
  f. Proof: antecedent 2 is MONOTONE in V (isLocallySurjective_sigmaDesc_mono, at
  the INSTANCE level -- not the hcov spelling), lift to top, and there the inclusion
  is invertible.


  WHY IT BEARS ON YOUR ROW. Antecedent 1 is ANTITONE, so the restriction genuinely
  relieves the hf side. It relieves your side by NOTHING. So a route reaching antecedent
  2 ''only over the chart locus'', or any other proper open of the divisor scheme,
  has not reduced the obligation -- it is the unrestricted statement in different
  clothing. This is not an endpoint fact: not_coverageContainment_bot refutes ONE
  V, this constrains every V at once.


  USE, no reproof needed: coverage_instance_of_nested. If you can certify coverage
  at some Vc, it supplies the seam''s instance at any larger Vf -- so it composes
  with an hf certificate that lives at a DIFFERENT, larger open, and it needs no antitonicity,
  hence works with RestrictedChartFibre directly (whose own monotonicity is proved
  nowhere in the tree).


  ALSO: isLocallySurjective_of_bot shuts the bot route. Inhabiting the IsLocallySurjective
  binder at V = bot yields unrestricted coverage, so the loophole Sat.lean:93-98 flagged
  is not cheap. With review-ajcr''s I-1049, bot is dead both ways.


  ORTHOGONAL, and they compose: your chartsCoverLocally_of_affineLocal reduces the
  TEST; this is about the chart SOURCE. Nothing here weakens it.


  TWO REASONS OF MINE I RETRACTED, so you do not inherit them: iso-ness of Scheme.topIso
  is never used in my file (I-1117), and ''opposite monotonicities squeeze the pair''
  is false -- either monotonicity alone gives the collapse (I-1119).'
