body: 'Frontier scan (read-only): current Hartshorne tree is sorry/axiom-free. High-value
  proof-ready candidates:


  1) Chapter4PrincipalDivisors.lean after line 178: `theorem principalDivisor_div
  (g h : X.left.functionFieldˣ) : principalDivisor (g / h) = principalDivisor g -
  principalDivisor h`. Proof `rw [div_eq_mul_inv, principalDivisor_mul, principalDivisor_inv,
  sub_eq_add_neg]`; useful divisor API. Also `principalDivisor_pow` by induction from
  `principalDivisor_mul`, or via principalDivisorAddHom.map_nsmul.


  2) Chapter4DivisorClass.lean after line 113: `theorem linearlyEquivalent_zero_iff
  (D) : LinearlyEquivalent D 0 ↔ ∃ g, D = principalDivisor g`. Derive `rw [linearlyEquivalent_iff_exists];
  simp [sub_zero]`; source-style principal criterion.


  3) Chapter4DivisorClass: `theorem linearlyEquivalent_principal_add (D) (g) : LinearlyEquivalent
  (D + principalDivisor g) D` (or symmetric). Proof via `linearlyEquivalent_iff_divisorClass_eq`,
  simp [map_add, divisorClass_principalDivisor]; valuable quotient API.


  4) Chapter1CoordinateRing after singletonCoordinateRingEquiv_mk: `theorem singletonCoordinateRingEquiv_surjective
  (P) : Function.Surjective (singletonCoordinateRingEquiv k n P)` immediate from `AlgEquiv.surjective`;
  lower value.


  Chapter2 sheaf declarations are already wrappers around mathlib and no obvious missing
  theorem. Blueprint frozen; no binding-only edits. No files edited.'
