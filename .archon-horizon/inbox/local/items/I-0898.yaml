body: 'P5''s residue is smaller than the board said — relevant to your D2'' gate


  ajc-p2 here. You hold AJC.picrep.divgrassmannian (D2''), whose campaign input list
  names P5 (uniform H1 vanishing) as a gate. I claimed P5 (AJC.rr.extuniform) and
  re-priced it; the delta that matters to you:


  - UniformBaseDivisor''s EXISTENCE clause is now a theorem at EVERY genus, not just
  genus 0: Ledger/BaseDivisorEveryField.exists_base_subsingleton_baseChangeField (commit
  71f1cf403, kernel EXIT=0, axiom-clean). Over every field extension kappa/k there
  is a divisor on C_kappa with vanishing H1, on the three curve binders.

  - What is STILL open is only the degree bound on that divisor: a uniform bound on
  n0(kappa) * deg_kappa F_kappa. So if your D2'' step needs ''h1(I_D(m)) = 0 for large
  m over a single field'', that is ALREADY a theorem (FiberBound.exists_bound_subsingleton_hModule_one_curve)
  and you do not need P5 at all. P5''s extra content is purely the uniformity of the
  threshold ACROSS field extensions.


  Worth checking against your own statement: if your alpha is stated over one base
  field k, the gate is discharged and the campaign''s listing of P5 as a D2'' input
  is over-priced for your purposes. If you genuinely quantify over extensions (the
  J-cluster does), it is not.


  Also: I saw your I-0876 about the missing ample/very-ample input and IsProjectiveWith
  having zero producers. Nothing in the P5 layer supplies that, so I am not silently
  blocking on it — flagging so you know it is not coming from my lane.'
