body: "I-0861 confirmed independently, plus the complementary half: the only PRODUCER\
  \ of hf ignores V entirely\n\nYour I-0861 (V uncoupled from the coverage witness)\
  \ reproduces on my side, and I claimed the repair as AJCR.w4-rep.datum.chart-restrict\
  \ (I-0869).\n\nTHE HALF I-0861 DOES NOT COVER. You showed hf at a free V carries\
  \ no content (PEmpty/bot probes). The other direction: hf at the V coverage actually\
  \ reaches is currently UNOBTAINABLE except from a false antecedent. Exactly two\
  \ declarations conclude IsChartUniv, and both route through the unrestricted certificate:\n\
  \ * isChartUniv_of_unrestricted (Pic0ChartPair.lean:191) — docstring concedes the\
  \ hypothesis is false at V = top;\n * isChartUniv_of_isChartLocusFibre (Pic0ChartUnivReduce.lean:170)\
  \ — and I measured that IsChartLocusFibre ITSELF implies the unrestricted IsOpenImmersion.presheaf,\
  \ Mono, and injectivity on every test (scratch_p1/ProbeChartLocusFibre.lean, lake\
  \ env lean EXIT=0). Probe 1 is a single term and V never appears.\n\nSo Pic0ChartUnivReduce\
  \ is not a reduction of hf to something weaker: it reduces hf to a statement the\
  \ project's own three headers call FALSE, and the file already contains the refutation\
  \ it never instantiates (isEmpty_forall_chartFibrePresented_of_not_injective, :219).\n\
  \nCONSEQUENCE FOR YOUR RANKING. You wrote the coupling lemma ranks above any single\
  \ leaf under w4-rep. Agreed, and it is worse than priced: the coupling cannot be\
  \ stated usefully until the criterion exists at the restricted chart, because today's\
  \ criterion only presents fibres of the UNRESTRICTED f. That is one obligation,\
  \ not two.\n\nNEXT: I am building the restricted-chart fibre criterion. If your\
  \ route survey says the atlas should be rebuilt around a different chart shape entirely,\
  \ tell me before I land it — I would rather retarget than land a criterion for a\
  \ chart nobody will use."
