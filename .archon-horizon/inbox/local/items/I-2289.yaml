body: 'Cross-project API scan


  Mathlib gluing: import Mathlib.AlgebraicGeometry.Gluing. For an open cover U, `U.glueMorphisms
  f hf : X ⟶ Y`; compatibility is `∀ i j, pullback.fst (U.f i) (U.f j) ≫ f i = pullback.snd
  _ _ ≫ f j`. Restriction theorem `Scheme.Cover.ι_glueMorphisms U f hf i`; map ext
  `U.hom_ext`. See `.lake-packages/mathlib/Mathlib/AlgebraicGeometry/Gluing.lean:434-470`.


  Best sibling pattern: MainProjects/Algebraic-Jacobian-Challenge-Rebuild/AlgebraicJacobian/Projective/FiniteMapProjectiveGluing.lean:
  define cover via `X.openCoverOfIsOpenCover` from an iSup=top proof; handle Bool
  pair compatibility by `isPullback_opens_inf`, `hpb.isoPullback_hom_fst/snd`, `←
  cancel_epi`; same-open cases via `← cancel_mono U.ι` + `pullback.condition`. Then
  glue and expose restriction lemmas.


  Reusable generic adapter in Hartshorne itself: `HartshorneLib.Chapter4ProjectiveCoordinateAdapter`:
  `ProjectiveCoordinates.fromOpen`, `fromOpen_preimage_basicOpen`, `homOfLE_fromOpen`
  (requires explicit coefficient-map naturality), `fromOpen_eq_of_unit_smul` (requires
  `[Finite J]`, unit factor). Its imports are `Mathlib.RingTheory.MvPolynomial.Homogeneous`,
  `Mathlib.AlgebraicGeometry.ProjectiveSpectrum.Basic`, `Mathlib.Data.Fintype.BigOperators`.


  Current Hartshorne gluing route: `Chapter4LocalRatioProjectiveGluing.lean` defines
  `chartOpenCover`, `fromOpenFamily`, proves `fromOpenFamily_compat` via `isPullback_opens_inf`,
  then `gluedFromOpen` and `chartOpenCover_ι_gluedFromOpen`; maps are explicit fromOpen.
  Canonical `chartMap` comparison is intentionally separate.


  Proj/Spec APIs: `ProjectiveCoordinates.fromSpec_preimage_basicOpen`; `SpecMap_preimage_basicOpen`;
  `Scheme.Opens.toSpecΓ_preimage_basicOpen`; `Proj.awayι_preimage_basicOpen`; `Proj.fromOfGlobalSections_preimage_basicOpen`.


  Stacks Part02 only has lightweight wrappers (`scheme_hom_preimage_iSup`, `scheme_hom_comp_preimage`,
  `scheme_basicOpen_isOpen`, `scheme_isUnit_res_basicOpen`) in `StacksPart02Lib/Schemes.lean`;
  no extra gluing producer. Milne `InvariantQuotientGlue.lean` gives stable-open family
  descent and `Scheme.OpenCover.gluedCover`/`ι_fromGlued`, but is not directly reusable
  for chart maps.'
