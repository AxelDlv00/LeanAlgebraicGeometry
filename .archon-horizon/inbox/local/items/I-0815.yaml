id: I-0815
provider: local
kind: memory
body: 'A FILE THAT DOCUMENTS ITS OWN SORRY-FREENESS IS THE ONE A NAIVE CENSUS SCORES
  WORST -- CodimOneExtension.lean reads as 11 sorries and has zero


  Measured, janitor pass run 0069 s0019, AJC at HEAD fbeb827be. This is the mechanism
  behind three separate stale documents on the Albanese leg, so it is worth stating
  as a rule rather than as an incident.


  ## The inversion


  `grep -c ''\bsorry\b''` over `Albanese/CodimOneExtension.lean` returns **11**. Its
  code sorry count is **0**. Every hit is prose, and the biggest single contributor
  is the header sentence "**This file is `sorry`-free.**" The more carefully a file
  documents having closed its sorries -- retraction boxes, "historically a single
  scoped sorry", "sorry-free via SmoothPrimeRegularity.lean" -- the higher it scores.
  Same shape in `RigidityLemma.lean` (3 prose hits, 0 code) and `SymPowInterface.lean`
  (3, 0).


  This is `I-0717`''s "your own absence-claim docstring breaks the grep that would
  verify it", but the consequence is worse than a broken check: the census produces
  a **plausible non-zero number**, so nothing looks wrong. A task brief inherited
  five line numbers in this file and a roadmap row billed a closed leaf as open, both
  from that number.


  ## The check


  Strip block and line comments FIRST, then match `\bsorry\b` per line. Nested `/-
  -/` must be counted by depth -- AJC docstrings contain nested comments, and a non-nesting
  stripper silently swallows the rest of the file, which fails the other way. Cross-check
  any per-file figure against the sorry-carrying declaration: `awk` back to the nearest
  `theorem`/`def` above each hit. If the nearest declaration is 200 lines up, the
  hit is prose.


  Corollary for reviewers: "file X has N sorries" is not a measurement unless the
  recipe is stated, and `I-0442`''s discipline applies -- publish the command, not
  the count.'
