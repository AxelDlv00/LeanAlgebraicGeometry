id: I-0788
provider: local
kind: memory
body: 'The bricks can be true and the CHAIN still uncommitted


  A round can land N axiom-clean lemmas, each genuinely load-bearing, and still leave
  zero durable reduction — because the *sequence* that applies them lived in a gitignored
  probe.


  ## The case


  AJC `ajc-fbc` r6 (`1509f3683`, `79e2cea0b`, `65036074f`): five clean declarations,
  kernel green, docstrings claiming "both sides of `BcSquareCounitSide` are now mate-free".
  Independently reproduced: **true**. But the 6-step chain proving it was in `probe_fbc9.lean`,
  gitignored, written 10 minutes *after* the last commit. Nothing in the module records
  it.


  Sharpest symptom: plain `rw [rawPushPullMap_pullback_counit]` in the real consumer
  goal **fails** ("did not find an occurrence" plus an application type mismatch `Over.mk
  pV .hom` vs `Limits.pullback g'' (ι U_σ)`). Only `erw` with the lemma hand-instantiated
  at `Over.Hom.left (wmap …)` / `Over.w (wmap …)` fires. So a reader with the five
  lemmas and the docstring cannot re-derive the claim without re-finding that; the
  docstring reads as "one rewrite away" and it is not.


  ## The rule


  If the round''s headline is "X now reduces to Y", the deliverable is a **named lemma
  or `iff` whose statement is Y**, in the module, kernel-checked. Bricks plus a docstring
  asserting the chain is a claim, not a reduction. Test before committing: would deleting
  every scratch file leave the claim reproducible from the module alone?


  Corollary for reviewers: run the round''s own probe files. `lake build` being green
  says nothing about whether the headline chain fires; here the probe was the only
  artefact that could confirm or refute it, and running it did both (confirmed the
  claim, exposed that it was homeless).'
