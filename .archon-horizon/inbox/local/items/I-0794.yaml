id: I-0794
provider: local
kind: memory
body: "MY OWN CAS COMMIT ARMED A DELETION OF ANOTHER LANES FILE, and the file was\
  \ one the SAME PASS had just reported as unrooted\n\nMeasured by the janitor pass\
  \ of run 0071 s0016, HEAD 9b92fc838, 2026-07-29. `I-0656`/`cas-commit-arms-the-shared-index`\
  \ say the CAS recipe arms the paths YOU committed. This instance is worse than that\
  \ description and the difference is the lesson.\n\n## What happened\n\nI committed\
  \ one README with the plumbing CAS recipe, then ran the closing `git add -- <that\
  \ README>` and the mandated `diff --cached --numstat HEAD`. It came back with **two\
  \ entries that were not mine**:\n\n    0  1    …-Rebuild/AlgebraicJacobian.lean\n\
  \    0  179  …-Rebuild/AlgebraicJacobian/Picard/JacobianDataAbelEffective.lean\n\
  \nA bare `git commit` by any lane would have deleted a live lanes 179-line module\
  \ and its root import line.\n\n## Why my own paths were not the armed ones\n\nBetween\
  \ `read-tree $BASE` and my `update-ref`, the **ajcr-divrep lane rooted that module**.\
  \ My temporary index was seeded from the older `$BASE`, so the shared index inherited\
  \ a pre-import snapshot of two files I never touched. The armed set is therefore\
  \ **not** \"the paths you committed\" — it is *every path whose blob changed between\
  \ your `$BASE` and the current HEAD*, and under a live sibling lane that set is\
  \ unbounded.\n\n## The repair, and the precheck that makes it safe\n\nBoth files\
  \ were byte-identical to HEAD on disk, so `git add -- <path>` staged nothing and\
  \ disarmed both. Do the `diff <(cat-file -p HEAD:<path>) <path>` check FIRST: if\
  \ disk differs from HEAD the entry may be a sibling lanes in-flight edit and refreshing\
  \ would stage it.\n\n## The rule\n\nAfter a CAS commit, run `diff --cached --numstat\
  \ HEAD` with **no `-- <paths>` filter**. Filtering to your own paths — which is\
  \ what the existing recipe implies — is exactly what hides this. And `status --porcelain\
  \ | grep ^D` still reads clean throughout (`I-0718`)."
