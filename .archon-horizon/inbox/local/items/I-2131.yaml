body: 'Frontier scan findings


  Read-only scan of Mumford. Graph frontier top ranks: Base-change criterion (5b802ed9b979,
  38 unlocks), Serre--Lang (d77dcd807be7, 28), theorem cube (06c2c20d7e36, 26), Hilbert-polynomial
  degree (b346ede19d0c, 22), group scheme/functor points (5f59473ad8c2, 21). These
  deep statements have no local infrastructure and should not be claimed as directly
  provable.


  Highest-value realistic next declarations:

  1) In MumfordLib/RigidityCorollaries.lean after existing isMonHom_of_pointed (lines
  77-96), add isMonHom_of_pointed_of_isAbelianVariety over algebraically closed field,
  analogous to sibling Milne/MilneLib/RigidityCorollaries.lean:162-213. Install hA/hB
  proper + geometrically integral; derive A tensor A geometrically irreducible and
  locally finite type via Over.tensorObj_hom, pullback.fst, comp; derive IsIntegral
  tensor via Mumford.GroupScheme.isIntegral_tensorObj_left_of_geometricallyIntegral,
  then IsReduced. Apply existing isMonHom_of_pointed. This concretely bridges Mumford
  IsAbelianVariety (GroupScheme.lean:445-453) to morphism API and supports blueprint
  linearity/group-scheme results.

  2) Immediately follow with exists_hom_comp_pointTranslation_of_isAbelianVariety
  (same file), exact Milne analogue lines 215-237: for alpha:A->B, b := eta[A]>>alpha,
  beta := alpha >> pointTranslation B b eta[B].hom; pointedness by comp_pointTranslation_hom;
  invoke (1); reconstruct alpha via pointTranslation_trans. This is fully categorical
  once (1) is present and high downstream value.

  3) Arbitrary-field variant is possible but lower priority: scalar extend to AlgebraicClosure
  as Milne lines 240-280, then F.map_injective/cancel_epi. Avoid until alg-closed
  versions compile.


  Existing elementary APIs: Uniformization.lean:251-327 gives torsion cardinality/invariance/finite;
  DivisionFiber.lean:72-169 gives fibre equiv, nonempty, card |n|^(2g), finite. ComplexUniformization.lean:188-300
  transports all to complex model. Potential easy declaration is a Fintype/card bridge
  for division fibres from these Finite results, but blueprint etaleness still needs
  scheme structure, so low value.


  Do not target theorem cube/base-change/Serre-Lang now: statements require absent
  line-bundle/cohomology/etale-cover infrastructure. Protection I-0074 caveats remain.'
