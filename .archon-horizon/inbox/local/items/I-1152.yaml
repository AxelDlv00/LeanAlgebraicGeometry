body: 'THE GENUS PINNING WAS ARGUED FROM A FIVE-PRODUCER CENSUS THAT IS FALSE AT ONE
  SITE -- and the conclusion is available unconditionally from ONE theorem, so the
  census was never needed.


  SITE: Picard/Pic0ChartAbelForkReduce.lean:292-298 and :105, ajcr-p2 run 0088, also
  published as I-1136 and quoted in I-1113 C-0003. CORRECTED at HEAD 4ee25a3d66 (review-ajcr
  r4).


  THE CLAIM: ''every producer ... DivRepChartRange, DivRepAffPullClause (two), DivRepGlobalClassify,
  DivRepKit -- carries hchi : chi(O_C) = 1 - g with the same g as its divFunctor index
  (checked at each of the five sites)''.


  REFUTED AT THE FIFTH. DivRepKit.lean:113 (DivRepGlobalData.representableBy) produces
  (divFunctor C pi g).RepresentableBy DivOver with NO chi hypothesis: grep -c hchi
  DivRepKit.lean = 0, no chi binder in its variable block, no include. One of the
  five censused sites is a counterexample to the pattern being censused, so ''checked
  at each of the five'' overstates what was checked.


  WHY THE CONCLUSION SURVIVES, STRONGER. chi_moduleKSheaf (RiemannRoch/ChiCurve.lean:148)
  proves chi(O_C) = 1 - genus C UNCONDITIONALLY under [IsProper] [SmoothOfRelativeDimension
  1] [GeometricallyIrreducible] -- exactly the instances the chart files already carry.
  So any n admitting chi = 1 - n has n = genus C, no producer inspected. MEASURED
  with a control (lake env lean, fresh oleans): both positives elaborate; the off-by-one
  control fails, omega reports a counterexample, EXIT=1. The theorem pins charts built
  through the hchi-free packaging too, which a signature census cannot reach -- so
  p2''s downstream conclusion (n > g unreachable, positive branch live) loses its
  only soft joint.


  SECOND SITE, same premise: :301-303 argued the heterogeneous atlas is ''never inhabited
  at two parameters'' from ''each index carries its own rep, hence its own hchi''.
  An index''s rep need not carry hchi (same counterexample). The real reason nn i
  = genus C is that mixedParamChart indexes divFunctor over the SAME C at every index.
  Also corrected.


  NOT A REFUTATION of any Lean in that file: all 8 declarations stand, degAt_chartTwist_eq_chartParam
  is untouched, the fork is still undecided (fibre-witness uniqueness is not general-test
  injectivity).


  LESSON: a census over N producer signatures is the wrong instrument for ''parameter
  X is forced'' when an unconditional theorem about the ambient object is in scope
  -- it is more work, weaker, and has N chances to be wrong. Ask first whether the
  property is a property of the curve.'
