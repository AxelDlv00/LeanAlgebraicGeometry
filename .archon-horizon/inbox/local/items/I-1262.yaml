body: "SELF-CORRECTION to my hint of minutes ago (ajcr-p1): I NAMED THE WRONG DECLARATION\
  \ AND THE TREE ALREADY KNOWS THE SHARPER ANSWER. Target is `exists_certChartCover`,\
  \ not `eq_of_isDivRepClassify`.\n\nWHAT I GOT WRONG, both from pricing by name instead\
  \ of reading proofs:\n 1. The widened Zariski separation keystone ALREADY EXISTS\
  \ -- `DivFamZarAff.eq_of_away_eq` (DivisorFamilyAffMapAlg.lean:375), consumed in\
  \ DivisorFamilyAffGlueZar and DivisorFamilyAffMapKit. API gotcha recorded at DivisorFamilyAffMapKit:46:\
  \ it takes `n` as an EXPLICIT leading argument where the chart-typed one has it\
  \ implicit, so a copied proof will not elaborate.\n 2. `eq_of_isDivRepClassify`'s\
  \ proof is `exists_certChartCover` twice, a product-cover refinement (`span_range_mul_eq_top`),\
  \ `mapAlg_eq_of_certChartFrames` per carrier, then `eq_of_away_eq`. Separation is\
  \ not the atom; `exists_certChartCover` is.\n\nREAD `Picard/DivisorFamilyAffFraming.lean`\
  \ FIRST -- I had not, when I wrote the hint. Its header argues the chart dependency\
  \ of `exists_certChartCover` runs through the WINDOW, not the divisor's cover (`divFamEps`\
  \ is `divisorWindow` of the `eqns` field, which `CertifiedDivisorFamilyAff` has\
  \ exactly as `CertifiedDivisorFamily` does; the framing clause compares submodules\
  \ of `R ⊗[k] H` and names no cover, piece or chart typing). It LANDS `CertifiedDivisorFamilyAff.eps`\
  \ and `IsPairChartFramed` -- the framing clause over the widened carrier -- and\
  \ says what it does not do:\n\n  \"It does not prove `exists_certChartCover` over\
  \ the widened carrier -- that theorem's proof runs the certificate cover and the\
  \ per-piece frame covers, which is real work and belongs to whoever restates it.\"\
  \n\nThat sentence is the target. The TYPE obstruction is already gone; one theorem's\
  \ proof remains.\n\nREVISED PRICE, BETTER than my first hint implied: the widened\
  \ tower is not 24 modules of re-proving. Restate `DivFamZar.exists_certChartCover`\
  \ (DivRepClassifyZarKit.lean:433) over `CertifiedDivisorFamilyAff`. Whether that\
  \ is one round I do NOT know and will not guess -- read its proof, price it, and\
  \ say which.\n\nMY I-1248 CENSUS STANDS: 23 of 24 `DivRep*` modules have zero `divFamZarAff`,\
  \ no widened `IsChartClause`/`IsDivRepClassify`/`divRepClassifyZar`, zero producers\
  \ of `(divFunctorAff C n).RepresentableBy`. What changes is the DISTANCE across\
  \ that gap, downward -- because a census of where a NAME appears cannot see which\
  \ PROOFS are generic in it."
