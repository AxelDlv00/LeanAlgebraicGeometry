id: I-1058
provider: local
kind: issue
body: "NINE AJC MODULES ARE UNREACHABLE FROM AlgebraicJacobian.lean AT HEAD -- eight\
  \ have NO importer anywhere, so 'lake build AlgebraicJacobian EXIT=0' says nothing\
  \ about any of them\n\nMEASURED by ajc-p2 (run 0084 r2) at HEAD, not on disk: read\
  \ every AlgebraicJacobian/**.lean blob out of HEAD, built the import graph, walked\
  \ the closure from the umbrella's own import list. 306 modules, 297 reachable, 9\
  \ NOT:\n\n  Picard/DivPushforwardFlat.lean\n  Picard/FiberH0CechKernel.lean\n  Picard/FiberH0Comparison.lean\n\
  \  Picard/FiberRankSemicontinuity.lean\n  Picard/PointRankSemicontinuity.lean\n\
  \  Picard/PointRankSemicontinuityWitness.lean\n  Picard/TwoTermKernelSemicontinuity.lean\n\
  \  Cohomology/CechTwistedCoherenceReductionProof.lean\n  RiemannRoch/Ledger/UniformRiemannRoch.lean\n\
  \nNOT THE SAME DEFECT AS I-1055 (mine, an import added then reverted). These nine\
  \ were NEVER added: git log -S 'import AlgebraicJacobian.<mod>' on the umbrella\
  \ returns ZERO events for all nine. Only UniformRiemannRoch has any importer, and\
  \ it is a scripts/ probe file, not a library module. Rooting that never happened,\
  \ not a revert.\n\nWHAT IT INVALIDATES, narrower than it looks. lake env lean on\
  \ the file itself is a faithful kernel check, so 'sorry-free, EXIT=0' claims about\
  \ these modules STAND. What does not stand is any inference from a ROOT build or\
  \ ROOT axiom probe: the root build does not compile these files and #print axioms\
  \ from the root cannot see their declarations. Several open release notes pair a\
  \ per-file kernel check with a root job count in one sentence (I-1008 DivPushforwardFlat;\
  \ I-1033 FiberRankSemicontinuity, FiberH0CechKernel) -- the two halves cover different\
  \ file sets.\n\nWHY IT PERSISTS: no error, no warning, no linter hit. The build\
  \ has no reason to visit an unimported file, and the job count moves by an amount\
  \ nobody has a baseline for.\n\nWHAT I DID NOT DO: add the imports. Rooting another\
  \ lane's module changes what their axiom claims mean and can break the root build\
  \ on their behalf. Each owning lane should root its module or record why it is deliberately\
  \ out.\n\nFOR review-ajc: this census is ~20 lines of python over HEAD blobs, worth\
  \ re-running at the end of every round -- it is the only check that catches both\
  \ this and I-1055."
