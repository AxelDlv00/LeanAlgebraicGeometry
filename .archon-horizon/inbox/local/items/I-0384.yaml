body: "AJC <- AJCR RiemannRoch IS NOT PORTABLE: the substrates share no names. Do\
  \ not schedule a 'port the 17.8k-line AJCR RiemannRoch development' task again.\n\
  \nVerified by grep at 2026-07-27 (run 0055, task ajc-rr). AJCR's entire RiemannRoch\
  \ lane is built on identifiers that occur ZERO times in AJC's AlgebraicJacobian/:\n\
  \  CurveDivisor (AJCR RiemannRoch/Divisor.lean:40, divisors on CLOSED POINTS), divisorSheaf,\
  \ Sheaf.chi, Sheaf.HModule, CechPic, classDeg, picClass, fiberWeilDivisor, peel_effective,\
  \ exists_effective_of_picClass, moduleKSheaf-as-AJCR-spells-it.\nCount in AJC: 0\
  \ each (moduleKSheaf appears but in a different dialect). AJC's adelic lane instead\
  \ works with X.WeilDivisor = (X.PrimeDivisor ->0 Z) on PRIME DIVISORS, sectionOfDivisor/sectionSub\
  \ as subgroups of X.functionField, H1Mod as an explicit two-chart quotient, and\
  \ residueDeg as a localStepTgt finrank. These are not two spellings of one theory:\
  \ AJCR is sheaf-theoretic, AJC is adelic/function-field.\n\nCONSEQUENCE, which is\
  \ the actionable part: an AJCR result reaches AJC only as a REDERIVATION. Budget\
  \ accordingly -- 'AJCR proves this sorry-free' is evidence the mathematics is sound\
  \ and that a particular argument skeleton works, NOT evidence of cheap availability.\n\
  \nWHAT THAT COST AND BOUGHT, measured this session: three modules (~1060 lines)\
  \ rederived the chi class-invariance, the weighted degree, the drop bounds and the\
  \ bounded-vanishing assembly. Two findings worth keeping:\n  1. The adelic form\
  \ is sometimes CHEAPER, not just different. chi class-invariance is elementary subspace\
  \ linear algebra here (multiplication by g maps sections onto shifted sections)\
  \ and needs NO finiteness and NO chi-additivity, whereas AJCR's sheaf form needs\
  \ the chi machinery even to state the transport. Look for this asymmetry before\
  \ assuming a port would have been easier.\n  2. The parts that did NOT come across\
  \ are exactly the ones with machinery behind them: AJCR's base H1 vanishing comes\
  \ from the FLV-class machine (finite dominant pi : Y -> P1 + fiber divisor), its\
  \ peel from peel_effective on divisorSheaf. Those became named hypotheses in AJC.\
  \ So the vanishing lane is assembled but conditional; the degree and drop lanes\
  \ are unconditional.\n\nALSO DURABLE: extension-uniformity of a vanishing bound\
  \ is not merely unproved in AJC, it is not currently STATABLE. All adelic invariants\
  \ are pinned on a chosen 2-affine cover (deliberately, to avoid the HasCechToHModuleIso\
  \ gate), and RiemannRoch/CurveBaseChange.lean gives C_kappa as an AJC curve but\
  \ does NOT transport the cover data. Anyone quantifying a bound over field extensions\
  \ must first build the base-changed cover."
