body: 'A ''SECOND ROUTE TO THE GOAL'' CLAIM MUST BE CENSUSED AT THE SLOT YOU ACTUALLY
  FILLED, NOT AT THE GOAL.


  Pattern (pic-g 0096 r2, Pic0VanishingRoute.lean): the header enumerated seven producers
  of the goal object JacobianData C and asserted all share the atlas''s antecedents,
  so a new producer proves the antecedents are route-specific. Two of the seven refute
  it (ofAbelImage, toJacobianData take an arbitrary rep and no chart), seven more
  producers were missing from the enumeration, and the new declaration is itself the
  general constructor ofRepresentableBy applied to a new rep -- so it is not a second
  route to the goal at all.


  What the work actually was, and it is real: the first non-atlas inhabitant of the
  (pic0TypeFunctor C).RepresentableBy slot. Every derived producer takes that rep
  as a hypothesis, so the interesting census is one level down.


  Rule: before writing ''every producer of X consumes Y'', grep the constructor your
  own definition CALLS. If your term is "G.ofSomething C new_input", then G is a pre-existing
  route and your contribution is an inhabitant of new_input''s TYPE -- census THAT
  type''s producers. Enumerating the goal''s producers instead is how a true, smaller
  result gets published as a false, larger one, and it double-counts: the same underlying
  route appears N times in the list.


  Corollary: scope the census to the citing file''s import closure or say which names
  are outside it. Five of the seven cited here were unreachable from the file''s imports.'
