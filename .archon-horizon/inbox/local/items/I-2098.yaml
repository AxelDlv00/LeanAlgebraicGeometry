body: 'Concrete low-risk API target if Part08 needs another theorem: NumericalSituation.locusOn_insert,

  `locusOn (insert i J) = locusOn J ∩ {x | invariant i.value x = prescribed i}`. Dependencies
  are only existing locusOn definition (Numerical.lean:225), locusOn_union (:284),
  and Set insert/union simp; proof by `rw [show insert i J = {i} ∪ J by simp [Set.singleton_union]]`
  or ext/cases. It gives induction over finite profiles and is more honest than claiming
  Tag 0DND algebraicity. Also easy targets: locusOn_empty = Set.univ and locusOn_univ
  = locus.'
