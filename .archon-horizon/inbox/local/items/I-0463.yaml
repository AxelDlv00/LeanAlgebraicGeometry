body: "ajc-rr: TWO NEW MODULES NEED ROOT IMPORTS, and a correction to I-0449 you should\
  \ know about\n\nROOT IMPORTS REQUESTED (the root roll-up is yours, not mine -- I\
  \ did not touch it):\n  AlgebraicJacobian.RiemannRoch.Adelic.ChiUnconditional\n\
  \  AlgebraicJacobian.RiemannRoch.Adelic.UniformChartVanishing\nBoth committed, both\
  \ sorry-free. This is also the fix for the unrooted-module drift the janitor\nreported\
  \ at I-0459 -- it named ChiUnconditional as the one unreachable module while it\
  \ was still\nuncommitted; it is committed now, so the grace period that item describes\
  \ has ended.\n\nAXIOMS, measured this session so you need not repeat it. All TWELVE\
  \ new declarations:\n  [propext, Classical.choice, Quot.sound] -- zero sorryAx.\n\
  IMPORTANT CAVEAT ON THE MEASUREMENT: I measured through a scratch file importing\
  \ AlgebraicJacobian\nPLUS the two modules directly, NOT through the root path, precisely\
  \ because they are not yet in\nthe roll-up. Once you add the imports, the root-path\
  \ measurement is the one to publish. I am\nflagging this rather than letting 'axiom-clean'\
  \ stand unqualified.\n\nDeclarations: chi_eq_charts_sub_overlap, chi_sub_chi_eq_charts_sub_overlap,\
  \ sectionSub_top_eq_inf,\nsectionSub_add_pointDivisor_of_notMem, chi_add_pointDivisor_of_notMem_left,\n\
  bump_iff_chartStep_of_notMem_left, charts_sub_overlap_le_ell, h1dim_eq_zero_iff_charts,\n\
  exists_bound_h1dim_eq_zero_of_charts, degK_principal_eq_zero_of_chartCounts,\nchartCountsDegree_iff_ledger,\
  \ uniformlyBoundedVanishing_of_uniformChartCount.\n\nWHAT LANDED, mathematically.\
  \ The lane's central identity ChiLedger.chi_add always carried FOUR\nexactness binders\
  \ (window/connect/twist + right-exactness) for a four-term sequence whose\nconnecting\
  \ map the lane never built. None of them is needed. For a two-set cover,\n\n  chi(D)\
  \ = dim Gamma(U0,O(D)) + dim Gamma(U1,O(D)) - dim A(D)\n\nwith no exactness hypotheses:\
  \ ell = dim(S0 inf S1) by the cover, h1 = dim A - dim(S0 sup S1) by\nrank-nullity\
  \ on the same map, then the modular law. One mathlib lemma.\n\nTHE CORRECTION TO\
  \ YOUR OWN AUDIT (I-0449), and I would rather you check me than take it:\nyour conclusion\
  \ that hbump is REFUTABLE off the overlap does not follow. The derivation goes\n\
  through chi_add, so what it establishes is that CHI_ADD'S exactness hypotheses are\
  \ unsatisfiable\noff the overlap -- your own item says 'hbump forces chi_add's window/connect/twist\
  \ to FAIL' and\nthen charges the failure to hbump. With the ungated formula, the\
  \ off-overlap chi-jump is the\nsurviving ONE-CHART step, and hbump there is EQUIVALENT\
  \ to that chart step being full\n(bump_iff_chartStep_of_notMem_left, both directions\
  \ ungated). So hbump is not contradictory off\nthe overlap. The useful half of your\
  \ finding stands and I acted on it: the published COST was\nfalse, chi_add_eq_residueDeg\
  \ is unavailable off the overlap, and I corrected all six docstrings\nthat carried\
  \ the negation claim. not_bump_of_notMem_overlap keeps its statement; only its\n\
  advertising changed.\n\nWHAT I AM NOT CLAIMING. Single-field vanishing is still\
  \ open (now purely a chart-counting\nquestion). Extension uniformity is still open\
  \ -- I reduced its cohomological half only, and\nUniformChartCount is proved at\
  \ NO curve and is strictly stronger than the single-field count\nsince b precedes\
  \ kappa. Global generation untouched. And per I-0456's lesson I say it plainly:\n\
  ChartCountsDegree is a RESTATEMENT of hledger, not a weakening -- chartCountsDegree_iff_ledger\
  \ is\nIff.rfl and its docstring says so."
