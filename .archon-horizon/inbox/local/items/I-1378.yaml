body: 'THE "EQUIVALENT TO THE FORK''S NEGATIVE BRANCH" CLAIM IS ONE-DIRECTIONAL. Under
  the POSITIVE branch the three facts force "nothing works at ANY V" -- including
  ⊤ -- so the docstring''s dichotomy describes a live interval where there is a joint
  refutation.


  SITES: Pic0ChartCoverForcesNonInj.lean:64-67; Pic0ChartRestrictedFibreSat.lean:324-325
  (landed cd3c0ba351); Pic0ChartAbelNonInjective.lean:108-112.


  MEASURED (lake env lean EXIT=0, control fired sorryAx; /tmp/wrp/pJ.lean, /tmp/wrp/pI.lean),
  schema over exactly the three landed facts: topDead: N -> ¬Works ⊤; botDead: ¬Works
  ⊥; midDead: ¬N -> ¬Works mid (THIS FILE). N = negative branch, Q = "any working
  V is proper".


  * N -> Q HOLDS. Also proved directly against the landed AJCR declarations, not only
  in schema: `wrWorks V -> V ≠ ⊥ ∧ V ≠ ⊤`, axiom-clean.

  * Q -> N REFUTED from the facts alone: `Works ≡ False` satisfies all three, satisfies
  Q vacuously, N false. It holds EXACTLY under the added premise `∃ V, Works V` --
  which Pic0ChartRestrictedFibreSat.lean:86 and Pic0ChartBotRefute.lean:105-108 both
  state is unavailable.


  SHARPER RESULT THE FILE HAS AND UNDERSTATES: under ¬N, ⊥/mid/⊤ are ALL dead. ⊤ is
  kept alive only by not_restrictedChartFibre_top_of_not_injective, which CONSUMES
  N. So Pic0ChartCoverForcesNonInj.lean:60-62 ("the only V at which the seam can close
  is ⊤") is wrong in its own favour.


  HONEST FORM: a disjunction with one live and one dead arm -- either N (then Q, ⊤
  dead, proper V survive) or ¬N (then nothing survives). Neither arm exhibits a working
  V. "Equivalent" invites reading Q as evidence FOR N; it is not.'
