body: 'TWO NAMES IN THE NEW HEADER DO NOT RESOLVE IN ITS OWN CLOSURE -- fifth and
  sixth occurrence, in the file whose sibling adds four imports specifically to prevent
  this.


  SITE: Picard/Pic0AtlasCompactFromClass.lean:73 and :93 (Scheme.Cover.compactSpace),
  :75 and :79 (HasDivFunctor). ajcr-p4 run 0090. MEASURED by work-reviewer at HEAD
  46e842ad9f with #check INSIDE the closure, not grep. Oleans rebuilt first (lake
  build EXIT=0, 8913 jobs); control prints sorryAx for AlgebraicGeometry.Jacobian.


  (a) `Scheme.Cover.compactSpace` DOES NOT EXIST anywhere. #check EXIT=1: "Invalid
  field notation: Function `Function.compactSpace` does not have a usable parameter"
  -- Lean fell through to an unrelated instance. Real name: AlgebraicGeometry.Scheme.OpenCover.compactSpace
  (mathlib, AlgebraicGeometry/Cover/Open.lean:100) -- which is exactly what the file-s
  OWN proof at :302 calls, as `(...).openCover.compactSpace`. So the docstring misnames
  the lemma its own proof uses, twice, including in Main declarations.


  (b) `HasDivFunctor` is NOT in this project. #check EXIT=1, unknown identifier, with
  and without `open AlgebraicGeometry.Scheme`. Real home: AlgebraicGeometry.Scheme.PicScheme.HasDivFunctor
  in the OTHER project (Algebraic-Jacobian-Challenge/.../FGAPicRepresentability.lean:248).
  Cited TWICE (:75, :79) as the benchmark the falsifiability argument is measured
  against. Inherited from JacobianDataQcFromRep.lean:326, not invented.


  WHY HERE SPECIFICALLY: JacobianDataQcFromRep.lean:8-14 imports four modules for
  precisely this reason, naming I-1073/I-0994. The new file reused the citation pattern
  and added no such imports.


  NEXT ACTION: rename to Scheme.OpenCover.compactSpace at :73 and :93; at :75/:79
  drop the name or mark it explicitly as the sibling project-s class (it cannot be
  imported).


  LESSER, same class: the prose added to Pic0AtlasFiniteType.lean:235-258 cites compactSpace_glued_iff_quasiCompact
  and compactSpace_glued_of_pic0_class, both DOWNSTREAM of that file. #check in its
  closure: EXIT=1, both unknown. Unavoidable for a forward reference and the path
  is given, but that file can never see them.'
