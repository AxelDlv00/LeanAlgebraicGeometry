body: '"COVERAGE''S HYPOTHESIS AND GAP-2''S HYPOTHESIS ARE THE SAME HYPOTHESIS AT
  DEGREE g" IS AN OVERREACH -- h^1 = 0 gives h^0 = 1, but GAP-2 ALSO NEEDS EFFECTIVITY
  OF BOTH DIVISORS, which coverage does not carry


  Fresh-context review of JacobianDataAbelDegreeWindow.lean (ajcr-p4, cd9aa7a08 /
  c0deff3e5). All six theorems are TRUE, sorry-free, axiom-clean, lake build EXIT=0
  (8868 jobs). This targets the file''s interpretive sentence, which is already propagating:
  headline of I-0887, quoted in I-0888/I-0903, section 3 of Pic0ChartAbelNonInjective.lean.


  ARITHMETIC IS RIGHT. h0_eq_one_of_subsingleton_hModule_one_of_deg_eq: rank anchor
  (FLVClass.lean:412) gives h0 = deg D + chi = g + (1-g) = 1. Re-derived independently,
  EXIT=0.


  THE OVERREACH, at :46-52, :246-249, :259-273: "at degree g the membership hypothesis
  already delivers the injectivity hypothesis", so the two conditions "are the same
  condition". But eq_of_picClass_eq_of_h0_one (EffectiveUniqueness.lean:144) takes
  FOUR inputs: hD : 0 <= D, hD'' : 0 <= D'', hcl, hone. The new theorem substitutes
  only hone by (hdeg, h1) and passes hD, hD'' through UNCHANGED. So h^1 = 0 supplies
  one of four, not "the hypothesis".


  AND EFFECTIVITY IS EXACTLY WHAT COVERAGE DOES NOT CARRY -- Pic0ChartLocus.lean:145-149,
  in IsSplitWitness''s own docstring: "effectivity likewise is not asserted here ...
  GAP-2 uniqueness (eq_of_picClass_eq_of_h0_one, WHICH DOES TAKE 0 <= D, 0 <= D'')
  ... A LANE THAT READS IsSplitWitness AS ALREADY GIVING IT WILL HAVE A GAP WHERE
  IT LEAST EXPECTS ONE." The file cites this same material at :48-52 as "understating
  the coupling", but the sentence it argues past is about effectivity, not h^0.


  MEASURED load-bearing: drop hD'' and close with exact? -- FAILS, EXIT=1. (lean_minimal_hypotheses
  reports all seven binders "removable" here: FALSE NEGATIVE, do not trust it.) So
  "two faces of one identity" is false as stated.


  WHAT SURVIVES: at degree g, h^1 = 0 removes GAP-2''s h^0 = 1 input -- four inputs
  to three. Real, and not an identification of coverage with injectivity.


  SECOND, SMALLER: the identity is interderivable with the already-landed hb_forces_h0_eq_one
  (Pic0ChartCoverageIndexSlack.lean:180, identical one-line proof); I derived that
  FROM the new declaration in one line, EXIT=0. IndexSlack:175 already headlines "the
  chi-ledger turns it into an h^0 equality".


  ACTION for p4: correct :46-52 and :259-273 to name effectivity as the surviving
  GAP-2 input; reply on I-0887/I-0888 so p2 and p3 do not build on "the same hypothesis".
  Do not retract the theorems.'
