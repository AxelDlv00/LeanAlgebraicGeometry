body: 'CHART-U(b) partial — datum-level witness-locus openness + transport(ii) topological
  half LANDED (fresh start, predecessor died in survey)


  FILE: MainProjects/Algebraic-Jacobian-Challenge-Rebuild/AlgebraicJacobian/Picard/Pic0ChartLocusOpen.lean
  (137 L). Commits: 9469ecd63 (core), 461da4972 (transport). Root-wired (HEAD-blob
  + only my line, protocol s4). Zero sorries; every keystone axiom-clean [propext,
  Classical.choice, Quot.sound]; single-module LEAN_NUM_THREADS=1 lake green under
  mkdir lock (8864 jobs); zero warnings in my file.


  KEYSTONE 1 (verbatim) — the datum-level heart of CHART-U(b), engine-open in the
  chartLocus witness form:

  theorem BasicOpenCocycleDatum.isOpen_setOf_exists_witness_h1_vanishing (D : BasicOpenCocycleDatum
  C B π) (hπ : π ≫ P1.structureMap k = C.hom) : IsOpen {q : PrimeSpectrum B | ∃ W
  : ((C ⊗ overSpec k q.asIdeal.ResidueField).left).CurveDivisor, Scheme.CurveDivisor.picClass
  q.asIdeal.ResidueField W = Scheme.CechPic.map (relCurveMap C B q.asIdeal.ResidueField)
  D.cechPicClass ∧ Subsingleton (Sheaf.HModule ((C ⊗ overSpec k q.asIdeal.ResidueField).left.divisorSheaf
  q.asIdeal.ResidueField W) 1)}

  Proof = datumRigidEngine_isOpen_vanishing (Noetherian-free engine, dat-d s3.5) read
  through C1''s two-way dictionary BasicOpenCocycleDatum.subsingleton_h1_tensor_iff_exists_witness
  (GAP-6): the engine complex-form fibre cond Subsingleton(H1(pair D) ⊗[B] κ(q)) is
  pointwise the effective-witness/h1=0 cond. Class-intrinsic. Context: [IsFinite π][SmoothOfRelativeDimension
  1 C.hom][IsProper C.hom][GeometricallyIrreducible C.hom].


  KEYSTONE 2/3 (verbatim) — CHART-U(b) transport (ii) topological half, the ''one
  IsOpenMap application'' of w4-datb s1.6:

  theorem isOpen_of_isOpen_preimage_of_isOpenMap_surjective {X Y : Type*} [TopologicalSpace
  X] [TopologicalSpace Y] {f : X → Y} (hcont : Continuous f) (hopen : IsOpenMap f)
  (hsurj : Function.Surjective f) {V : Set Y} (hV : IsOpen (f ⁻¹'' V)) : IsOpen V

  theorem isOpen_of_isOpen_comap_preimage {R S : Type u} [CommRing R] [CommRing S]
  (f : R →+* S) (hopen : IsOpenMap (PrimeSpectrum.comap f)) (hsurj : Function.Surjective
  (PrimeSpectrum.comap f)) {V : Set (PrimeSpectrum R)} (hV : IsOpen (PrimeSpectrum.comap
  f ⁻¹'' V)) : IsOpen V

  Proof = mathlib IsOpenMap.isQuotientMap + IsQuotientMap.isOpen_preimage (+ PrimeSpectrum.continuous_comap).


  AMENDMENT COMPLIANCE (I-0248 / I-0251): built against the DAT-C frozen interface
  AS AMENDED. (a-amendment, split predicate for arbitrary plus classes): honored —
  the witness locus is stated in the effective-witness/h1=0 (dimension/witness) form;
  no reliance on chartValue-collapse, so it covers arbitrary plus classes. (b-amendment,
  pinned openness chain): the chain is realized as pinned — extraction→(shifted datum)→RE-5-free
  engine (C1 made the engine Noetherian-free, so the RE-5/transport-(i) descent is
  OBVIATED for openness; recorded) → witness-form openness (keystone 1) → transport
  (ii) topological (keystones 2/3). NOTE for orchestrator: the C1 landing made datumRigidEngine_isOpen_vanishing
  Noetherian-free, so transport (i) (Spec B→Spec B0 RE-5 preimage) is NOT needed on
  the openness path — one fewer unlanded link than the worksheet chain lists.


  REMAINING GAPS (the wall — two links, honest): (1) the shifted-datum CONSTRUCTOR''s
  class arithmetic: form the honest carrier class c=λ|_B collapse (picEtAffineEquiv→PicEtAff.mk
  E x→étale field-cofinality), then the shifted CechPic c·θ^m·[Σ]⁻¹ (theta layer cechPicClass_thetaChartDatum
  + C0 GAP-1 inverse datum DivisorAdaptation.divisorDatum/.inv), then extract via
  exists_cechPicClass_eq to instantiate keystone 1''s D. The class-multiply-and-extract
  shell is a thin wrapper over exists_cechPicClass_eq; the genuine content is the
  Σ/θ naturality proving the datum''s fibre class at κ(t) equals λ_t·θ^m·(−Σ) — DAT-C-owned
  vocab (chartValue, ThetaShift), risk of getting the shift wrong is why it is left
  as a pinned wall not a guess. (2) transport (ii) HARD half — the fibre-field invariance
  identifying (PrimeSpectrum.comap f)⁻¹(chartLocus over A) = chartLocus over the étale
  carrier B: κ(q)/κ(p) separable ⟹ h1-vanishing of the fibre class is preserved; landed
  avatar for the AWAY case is C1''s DivFamZar.isH1VanishingAt_comap_away_iff — the
  general étale-carrier analogue is the residue-field base-change seam (H1BaseFieldInvariance
  is imported/available). Plus: chartLocus itself is not yet DEFINED (DAT-C C9 unshipped)
  — B-4''s a-amendment split predicate should be the definition; I did not define
  it to avoid a wrong freeze before C9 lands.


  NOTES FOR C9 (DAT-C) consumer: to assemble isOpen_chartLocus, reduce openness on
  the test T to affine opens Spec A (openness is local, mathlib), collapse λ|_A to
  PicEtAff.mk E x on the étale carrier B=E.Carrier, apply the shifted-datum constructor
  to get D over B, invoke KEYSTONE 1 for the open witness locus over Spec B, then
  KEYSTONE 3 (isOpen_of_isOpen_comap_preimage) with f = A→B to push it to Spec A after
  discharging the fibre-field-invariance preimage identity (gap 2). Etale ⟹ IsOpenMap(comap)
  + surjective(cover) supply hopen/hsurj. Transition opens between charts are 01JJ''s
  (no brick).

  NOTES FOR B-5 (DAT-B coverage): the split-predicate collapse lemma (plus class→honest
  class over finite separable L; w4-datb s6 risk) is SHARED with B-4''s gap-1 collapse
  — state it once as a named lemma with a characterizing property (DegreeSeam.lean:67-107
  template); both consume it. B-5''s pointwise cover pic0_chartLocus_cover targets
  the same witness/h1=0 predicate keystone 1 opens over.'
