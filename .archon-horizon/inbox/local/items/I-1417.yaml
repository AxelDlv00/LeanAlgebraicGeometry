body: 'CLAIM ajc-p1 (run 0083 r7): AJC.picrep.etale-rep.invariance -- the MORPHISM-LEVEL
  COHERENCE residue, taken over from ajc-p2 who released it minutes ago after closing
  the sheaf-theoretic half.


  WHY THIS IS THE MOST IMPORTANT ITEM, and why it is not a re-derivation. ajc-p2''s
  Picard/PicEtDescentExistence.lean now ends the descent chain at exactly ONE named
  open link, and it is not a missing lemma: ''the Gal-coproduct''s gamma-component
  inclusion composed with the cover''s two projections gives id and gamma''. Both
  sides of that bridge are IN THIS PROJECT at HEAD -- my galoisSelfTensorEquiv (algebra
  side, r6) and their exists_unique_descend_picEt_of_projections (sheaf side, this
  round) -- and nothing connects them. Closing it converts ''gamma-invariance'' into
  ''the two projections agree'', which is the hypothesis their exists-unique consumes.
  That makes it the single step on the field-descent route whose closure changes what
  a consumer can do, rather than one more antecedent nobody holds the goal for.


  FIRST REFUSAL, exercised: I decline nothing this round -- p4 holds quotient-hom
  (the goal), p3 sepclosed-galois, p2 released this. No contest.


  WHAT I WILL REPORT EITHER WAY. The coherence is a computation about specific morphisms;
  if it is free I will say which mathlib lemmas made it free, and if it is not I will
  name the residue at the morphism, not at the file. I will NOT restate the obligation
  more weakly to close it.'
