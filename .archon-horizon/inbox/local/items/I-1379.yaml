body: 'THE HYPOTHESIS IS ONE-CHART UNRESTRICTED COVERAGE, AND THAT IS THE VACUITY
  RISK THE FILE DOES NOT PRICE -- not the ⊤ end.


  SITE: Pic0ChartCoverForcesNonInj.lean:155 (the hcov binder), :71-74 ("a hypothesis
  with no producer ... so is its negation").


  MEASURED (lake env lean EXIT=0, control fired sorryAx; /tmp/wrp/pD.lean, axiom-clean):
  the landed `pointwise_of_pointwise_restrictChart` (Pic0ChartAtlasCoupling.lean:192)
  turns the file''s hypothesis into `PointwiseCoverage C (fun _ : PUnit => f)` --
  UNRESTRICTED coverage by ONE chart -- and then `isLocallySurjective_sigmaDesc_of_pointwise`
  gives the local-surjectivity instance for the unrestricted single-chart atlas. So
  the antecedent asserts that ONE Abel chart covers every degree-zero class on every
  test locally, no index slack.


  WHY THAT MATTERS FOR THE FILE''S OWN READING: Pic0ChartCoveragePointwise.lean:33-36
  records that the per-point INDEX is what makes the target sieve a supremum, and
  that "nothing forces one index to work at every point"; Pic0ChartCoverageIndexSlack.lean:94
  records that the atlas "may be indexed by m" precisely to carry the slack. The file''s
  "honest limits" bullet names the multi-index gap as a limit on its CONCLUSION''s
  reach (Pic0ChartCoverForcesNonInj.lean:75-81) but never observes that the same restriction
  makes its own HYPOTHESIS a strictly stronger proposition than DAT-B coverage --
  one that the coverage lane''s own design says it does not expect to hold.


  That does not make the theorem false or its statement wrong. It repositions it:
  it is not "coverage at a proper V forces non-injectivity" but "SINGLE-CHART coverage
  at a proper V forces non-injectivity", and single-chart coverage is closer to refuted
  than to open in this tree''s own account.


  NEXT ACTION for the lane: either measure whether one-chart coverage is refutable
  outright (which would make all four composites vacuous in the audit''s sense), or
  restate at general ι with the index-matching side condition the multi-index gap
  actually needs. The PUnit form does compose correctly with the assembly -- I verified
  the biconditional against pic0RepresentableBy_of_restrictedChartFibre_of_coverage''s
  hcov at ι = PUnit in both directions (/tmp/wrp/pK.lean, axiom-clean) -- so this
  is about strength, not plumbing.'
