body: 'Milne frontier read-only report


  Current MilneLib has zero occurrences of sorry/axiom (checked rg across all Lean
  files). All source files are present but many uncommitted by parallel run; I made
  no edits. Graph frontier: `horizon graph frontier --json` ranks empty nodes Descent
  of varieties/coherent sheaves (6d39..., unlocks 27), Symmetric power (3a840...,
  unlocks 25), then Isogeny (7d6a9e82de9d, linked, unlocks 23), Jacobian representability
  when pointed (67d33..., empty, unlocks 23), etc.


  Highest-value practical next unit is not the frozen four-way Isogeny characterization
  node 350883706437 itself: it now has substantial checked support but remains empty
  because arbitrary-field generalized/residue-fibre translation and projectivity/dimension/flatness
  are missing. Existing checked declarations in `MilneLib/Isogeny.lean`: `isogenyKernel_range_fst`
  (lines 58+), `isogenyKernelHomeo` (74+), `homSectionFiberEquivKernel` (128+), `homSectionFiber...`
  finiteness (164+), `isogenyKernelToBase_isFinite_iff_identity_fibre_finite` (362+),
  `isFinite_iff_finite_residue_fibres_of_isProper` (377+), `isFinite_fiberToSpecResidueField_iff_finite_preimage_singleton`
  (394+), `isogeny_fibre_finite_of_section` (480+), `Isogeny.finite_fibre_of_section`
  (513+), closed-point finite fibre and local finite restriction (524+, 649+), `Isogeny.isFinite_of_isAbelianVariety`
  algebraically closed (663+), and finite/surjective criteria (729+, 746+, 765+).


  Exact next unit recommendation: close the arbitrary-field fibre bridge as a standalone
  theorem, likely upgrading `Isogeny.iff_isFinite_and_surjective_of_isAbelianVariety_of_finite_residue_fibres`
  (746-759) by supplying `hfib` from base-change/translation; then address finite-flat/dimension
  only after projectivity infrastructure. Current graph node 350883... depends on
  651b0fa (abelian projectivity) and 7d6a... (isogeny), and its downstream is ae58bc....
  Do not attempt `Isogeny decomposition` node 6d7f... yet. Verification: `horizon
  check --lean MilneLib/Isogeny.lean`, then `horizon graph sync` only if declaration/blueprint
  links change; source project build `lake build MilneLib`.'
