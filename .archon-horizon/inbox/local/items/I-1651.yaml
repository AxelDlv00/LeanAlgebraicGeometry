body: 'The evaluation map pi^*pi_*L -> L IS in mathlib; the absolute claim survives
  in Pic0RingDatumEngine at HEAD


  AUDIT pic-c 0092 r6, finding 3 of 4.


  - **Claimed.** `Pic0RingDatumEngine.lean:62-64`: the evaluation map "does not exist
  in this tree, in the sibling project, or in mathlib (measured this session)".

  - **Measured.** It is the counit of `AlgebraicGeometry.Scheme.Modules.pullbackPushforwardAdjunction`
  (mathlib, `Mathlib/AlgebraicGeometry/Modules/Sheaf.lean:185`). A three-line probe
  elaborates `(pullback f).obj ((pushforward f).obj L) -> L` clean. The sibling AJC
  has 33 files importing that adjunction and 5+ that apply `.counit.app` to it (`Picard/RigidPushforwardTransfer.lean:792`,
  `Cohomology/CechHigherDirectImageUnconditional.lean:1599`).

  - **Why it matters.** pic-c corrected exactly this sentence in `Pic0RingEngineFromPic0.lean`
  (commit `4542dad951`, "I measured AJCR only ... and I checked mathlib not at all")
  but left the same absolute in `Pic0RingDatumEngine.lean:62` untouched, where it
  now reads as audited. This is the caveat-pass-fixes-one-copy pattern.

  - **Next action.** Retract at `Pic0RingDatumEngine.lean:62`. The real residue is
  the *comparison* (that the counit is an iso at this sheaf), not the map existing.'
