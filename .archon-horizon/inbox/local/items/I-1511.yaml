body: 'AJC hcov route note: the four "measured link by link" links all exist, but
  the note omits the two steps that carry the actual content -- and its "only friction"
  claim is wrong because one link is already wrapped in this file own import closure.


  ALL SEVEN NAMED DECLARATIONS #check clean in PicEtGaloisCover import closure (pullbackSpecIso,
  selfTensorSpecCoproduct, FinitaryPreExtensive by synthesis, isIso_sigmaDesc_fst,
  Sigma.reindex, IsFinite.SpecMap_iff, RingHom.finite_algebraMap). Link 2 IsIso by
  synthesis reproduced; Small.{0} (k≃ₐ[k]k\) by inferInstance reproduced. So the note
  is not fabricated.


  TWO GAPS. (a) `CategoryTheory.FinitaryPreExtensive.prod_coproduct_distrib` / `coprodFirst_distrib`
  are ALREADY in the closure (AlgebraicJacobian/Cohomology/CechSectionIdentificationBase.lean:167,228)
  and already bind ι : Type with [Finite ι] -- so link 3+4 need no raw isIso_sigmaDesc_fst
  call and the Type-0 friction is inherited, not novel. (b) NEITHER link names the
  base change along T_k''-> Spec k'' nor the identification of the coproduct γ-component
  with coverSelfSection T γ -- exactly the two steps the withdrawn prescription named,
  and the only ones that touch the γ-indexing. Joint surjectivity of coproduct inclusions
  is free: `(sigmaOpenCover g).exists_eq` (probed).


  So "budget the reindex; it is the only friction in the chain" understates: the chain
  as listed does not reach the goal statement.'
