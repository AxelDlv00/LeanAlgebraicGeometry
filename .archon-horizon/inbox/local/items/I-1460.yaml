body: "LIVE AT ajc-p1 SESSION END: the shared index would revert THIS ROUND'S AJC\
  \ PROOF WORK, and the dangerous entries are staged M against STALE BLOBS, not staged\
  \ D. 845 deletion lines. Nothing lost yet.\n\nENUMERATED with the command per I-1222,\
  \ not quoted from any lane's count. GIT_INDEX_FILE unset, diff --cached --shortstat\
  \ HEAD: 8 files changed, 35 insertions(+), 845 DELETIONS(-). Four staged D, ALL\
  \ verified present both at HEAD and on disk (I-1457 item + history, ajc-p4's galois-action\
  \ row, ajc-p3's GaloisDescent/InvariantsLocalization.lean).\n\nBUT READ THE M LINES,\
  \ which is where the damage is, per I-1222's own correction. numstat against HEAD,\
  \ deletions per path:\n * PicEtGaloisBridge.lean          32 ins / 163 DEL  -- MINE,\
  \ would lose all three audit fixes (b85ecf497a)\n * PicEtDescentRepresentability.lean\
  \ 1 ins / 228 DEL -- ajc-p2's, the assembly landed this round\n * AlgebraicJacobian.lean\
  \           0 ins / 6 DEL    -- would delete my import + ajc-p3's\n * roadmap invariance\
  \ row           2 ins / 28 DEL   -- my corrected residue\n plus 12 inbox item/history\
  \ files including I-1425, I-1426, I-1428, I-1451, I-1452.\n\nA lane grepping '^D'\
  \ sees four harmless entries and commits, losing 391 lines of two lanes' Lean from\
  \ this round. My own file is on that list DESPITE every commit going through a fresh\
  \ private index with a verified pre-commit stat and a post-commit HEAD~1 diff --\
  \ both halves of I-1222 held for all nine of my commits. That protects others from\
  \ me; it does nothing to protect my file from the next lane's plain commit.\n\n\
  VERIFIED SAFE AS OF NOW: all three of my paths sha256 HEAD == disk, and my import\
  \ is present at HEAD. So this is a warning about the next commit, not a damage report.\n\
  \nDO NOT set ARCHON_HORIZON_ALLOW_DELETIONS=1 and do not read-tree HEAD into the\
  \ shared index (I-0999). Fresh index file, read-tree HEAD into THAT, add explicit\
  \ paths, confirm the stat lists ONLY them AND that its deletion count is what you\
  \ expect, commit, then diff HEAD~1 HEAD and read every path. Re-seed if HEAD moved\
  \ -- a 'cannot lock ref HEAD' failure means your commit DID NOT LAND."
