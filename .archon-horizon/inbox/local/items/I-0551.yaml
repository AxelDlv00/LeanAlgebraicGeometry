body: 'THE INBOX WARNING CANNOT BE CLEARED BY CLEANING: eight lanes file faster than
  a janitor can archive, and the 30-item limit is below the fleet''s steady state


  Filed by the janitor hygiene pass of run 0074 (lane `ajc-rr`). A **threshold/process
  finding, not a backlog**; I am reporting rather than forcing the count down, which
  would cost live lanes their context.


  ## Measurement, this pass


  - Open non-protection items at start: **56**; recommended maximum **30**.

  - Items created **by other lanes during the ~40 minutes of this pass**: `I-0543`-`I-0550`
  — eight, every one a substantive unresolved finding (a leanok-audit defect, `SymPowData`
  under-specification, the roadmap/task coupling firing again, two porting lessons,
  a tooling hazard).

  - Items I could justifiably archive: **one** (`I-0541`, a verification receipt for
  an already-archived item).


  Net effect of a full pass: the count went **up**.


  ## Why the backlog is not the problem


  I read all open local items. The 28 issues are live, machine-verified findings against
  code still being written — I re-checked two at HEAD and both hold (`I-0531`''s duplicate
  `one_le_coheight_of_ne_genericPoint` at `RiemannRoch/WeilDivisor.lean:149` vs `Albanese/Milne33TransportLocal.lean:66`;
  `I-0534`''s vacuous `PicScheme.ClassDegree`). The 26 memories have already been
  consolidated hard by four earlier passes today: `I-0442`, `I-0349`, `I-0397`, `I-0483`,
  `I-0529`, `I-0512`, `I-0480` each absorbed one to three siblings. The survivors
  are distinct, mostly `[persistent]`.


  ## The arithmetic


  Eight lanes, each running fresh-context reviews *designed* to produce findings,
  generate roughly one durable item per lane-round. `AdvisoryHealthLimits` (`open_inbox=30`,
  `open_memories=10`, `active_roadmap=8`) is sized for one or two lanes. At this fleet
  size the warnings fire permanently, which trains agents to scroll past **all** advisory
  warnings, including the ones that matter.


  ## Next action, for the human to choose


  1. **Scale limits with the fleet** (e.g. `open_inbox ≈ 8 x lanes`, `open_memories
  ≈ 3 x lanes`); or

  2. **accept them as permanent** at eight lanes and say so in `CLAUDE.md`, so janitors
  stop trying to satisfy them; or

  3. **reduce fleet size** — a throughput decision, not a hygiene one.


  Related: `I-0509` reaches the same conclusion for the roadmap active-count warning;
  four consecutive passes measured it and all four found every active row legitimate.'
