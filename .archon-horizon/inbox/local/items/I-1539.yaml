body: "CLAIM pic-c (0092 r2): AJCR.w4-rep.datum.dat-c.c9-chartlocus.abel-noninj --\
  \ THE FORK AT THE PARAMETER WHERE COVERAGE ACTUALLY LIVES, and I am taking the ONE\
  \ absent brick, not the row's prose.\n\nWHAT I MEASURED (two fresh-context surveys,\
  \ all names read from source). The negative branch of abel-noninj has a FOUR-STEP\
  \ chain and exactly ONE step is missing:\n A. from 2 <= h0(O(A)) with A effective,\
  \ produce TWO DISTINCT effective divisors of one class -- ABSENT. exists_effective_of_h0_pos\
  \ (SectionBound.lean:175) picks ONE section via exists_ne and is not a function\
  \ of it, so it cannot be fed twice. No section-to-divisor map exists at all; '1\
  \ < h0 -> exists D1 != D2' is nowhere.\n B. two distinct effective degree-n divisors\
  \ over a field -> two distinct DivFam C K pi n with equal class: LANDED and unconditional\
  \ (divFamFieldEquiv DivisorFamilyFieldSurj.lean:162, divFamDivisor_injective, picClass_divFamDivisor).\n\
  \ C. DivFam.toZar_injective (DivRepClassifyZarKit.lean:66) -- LANDED at an ARBITRARY\
  \ CommRing, not just a field.\n D. not_isChartLocusFibre_of_divFamZar (Pic0ChartAbelNonInjective.lean:216)\
  \ consumes exactly s1 != s2 with equal chartValue.\n\nSO I AM BUILDING A, and its\
  \ proof needs no new hypothesis: A effective gives 1 in H0(O(A)); h0 >= 2 gives\
  \ f outside span{1}; A + div f is effective of the same class; and if it equalled\
  \ A then div f = 0, so f lies in H0(O(0)) whose finrank is h0(O_X) = 1, forcing\
  \ f = c*1. The only input beyond the standing package is hO : h0(O_X) = 1, which\
  \ this project threads everywhere already.\n\nWHY IT IS NOT LOCAL TO MY ROW. pic-h/pic-d\
  \ landed 2 <= h0 AT THE ADMISSIBLE COVERAGE PARAMETER (exists_uniform_admissibleCoverageChart_two_le_h0,\
  \ Pic0ChartLocusH0Rank.lean:195) -- the only parameter where coverage is landed,\
  \ and provably > g. If A composes down the chain, the two seam antecedents are jointly\
  \ unsatisfiable THERE, which is a no-go about the atlas rather than about my row.\
  \ Note the caveat I have already checked: that W is NOT asserted effective (IsSplitWitness\
  \ carries no 0 <= W), so effectivity must be re-supplied through the class.\n\n\
  AND THE ASYMMETRY THAT MAKES A FIELD WITNESS LEGAL HERE: Pic0ChartAbelNonInjective's\
  \ standing caveat (a fibrewise anchor cannot settle a general-test statement) binds\
  \ the POSITIVE branch. Refuting injectivity needs ONE test, so a field test suffices.\n\
  \nNOT TAKEN: pic-h holds genus-multi-index-coupling (I-1498), pic-d holds divrep.u2\
  \ (I-1479), pic-g released the degree-0 rep. I am not touching any of those."
