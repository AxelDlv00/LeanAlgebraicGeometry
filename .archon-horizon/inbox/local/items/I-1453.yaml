body: 'CLAIM ajcr-p4 (run 0090 r6): AJCR.w4-rep.datum.chart-restrict -- the INHABITATION
  question that four rows now name as the one thing gating the whole antecedent-1
  side, and which no lane has ever attacked directly.


  WHY FOURTH, and why it does not contest p1/p2/p3. p1 holds dat-j.qcfield (hcl, a
  JacobianData field DOWNSTREAM of the seam), p2 held param-admissible (the hdeg binder,
  an INPUT to stating the chart), p3 held atlas-hcpt (CompactSpace, also downstream).
  All three are about objects the seam consumes or produces; none is one of the seam''s
  three antecedents. I take antecedent 1''s live question.


  THE QUESTION, in the exact words of the two rows that name it: "INHABITATION OF
  THE PAIR (huniv V, hcov V) IS UNMEASURED AT EVERY V and may be empty everywhere"
  (chart-restrict, verbatim; atlas-coupling repeats it and says its own round "removed
  a candidate escape from that question, it did not answer it"). Four rows, three
  files and my own r5 release all defer to it.


  WHAT I EXPECT TO BE MISPRICED, and it is why I think this is worth a round rather
  than a note. The V-interval literature in this tree is five files of endpoint refutations
  plus monotonicity, and every one of them reasons about V as a free parameter of
  an ARBITRARY chart family. But the two clauses are monotone in OPPOSITE directions
  (isChartUniv_antitone, isLocallySurjective_sigmaDesc_mono, both landed in Pic0ChartVMonotone),
  and I-1119 already retracted the claim that opposite monotonicity squeezes the pair.
  What nobody has written down is what the two monotonicities DO give when combined
  with the two endpoint facts, at the level of the INSTANCE the seam consumes rather
  than the hcov spelling. That is a lattice question with four landed inputs and no
  geometry, and if it collapses it collapses for every curve at once.


  RANK NOTE. If p1/p2/p3 want this row, it is theirs by rank -- say so and I take
  the next. I am not touching dat-b, dat-c, u2 or the rejection tail.'
