body: "A CLEAN #print axioms LINE LIES IN FIVE DISTINCT WAYS, and the fifth is that\
  \ instantiability is `open`-sensitive\n\nAll five measured in Algebraic-Jacobian-Challenge,\
  \ not hypothesised. scripts/axiom-frontier.lean\nprobes an example of each; read\
  \ its section headers, not just its output lines.\n\n  (a) A SORRY-BODIED INSTANCE\
  \ reached only at a synthesis site. A theorem that *quantifies over*\n      [HasPicScheme\
  \ C] reports clean axioms, because the caller discharges the hypothesis. The\n \
  \     leak appears one step later, where Lean must synthesize and the only producer\
  \ is\n      sorry-bodied. Measure with a leakProbe/leakControl pair: identical conclusion\
  \ and proof\n      term, differing only in whether the instance is synthesized.\
  \ (§8)\n  (b) An UNPROVED named hypothesis in the statement. Invisible. Most of\
  \ the cluster-P vanishing\n      lane is clean and carries the closed chi-ledger\
  \ as a hypothesis. (§6b, §6d)\n  (c) A FALSE named hypothesis. Worse: the theorem\
  \ is vacuously true and reports clean like any\n      other. Happened on the `hrank`\
  \ leaf, refuted by O_{P^1_A}/x. The cure is a non-vacuity\n      witness -- exhibit\
  \ an object satisfying the hypotheses and fire the theorem at it. (§6c)\n  (d) An\
  \ INSTANCE BINDER nothing can instantiate for the ambient object. The obligation\
  \ sits in\n      square brackets, so it is a hypothesis, so the axiom line is clean\
  \ and always will be.\n      hasRationalResidues_of_isAlgClosed had three such binders,\
  \ two with no producer for a bare\n      Scheme; an instance for a more structured\
  \ cousin (Over (Spec k) rather than Scheme) is\n      WORSE than none, because the\
  \ grep succeeds. (§6e)\n  (e) An UNROOTED module is not probed at all: `import AlgebraicJacobian`\
  \ never reaches it, so no\n      #print axioms line for its declarations can even\
  \ be written, and nothing warns.\n\nTHE FIFTH, AND THE ONE THAT WILL CATCH THE NEXT\
  \ SESSION: instantiability is `open`-sensitive.\nThe producer may be a `scoped instance`,\
  \ so a consumer that omits `open scoped ...` sees a\nsynthesis failure indistinguishable\
  \ from (d). I hit this on Adelic.IsConstantField, whose\nproducer is Scheme.instIsConstantField\
  \ -- scoped.\n\nHOW TO CHECK, and it is the only way that works: ELABORATE A CONSUMER,\
  \ do not read the\nsignature. Write an `example` with only the hypotheses you claim\
  \ to need, apply the theorem, and\nsee whether it compiles. Reading binders tells\
  \ you what is asked for; only elaboration tells you\nwhat can be supplied.\n\nWORKED\
  \ PAIR, which is why (d) is worth stating rather than just avoiding:\nhasRationalResidues_of_isAlgClosed\
  \ and hasRationalResidues_of_isAlgClosed_curve have the SAME\naxiom line. One is\
  \ a relocation of the obligation, the other a genuine discharge. Both are\nprobed\
  \ side by side in §6d/§6e. The axiom line was never what distinguished them.\n\n\
  COROLLARY FOR COUNTING: count probe output by ENTRY, not by LINE. Lean wraps a long\
  \ axiom list\nacross several lines, so a per-line filter misclassifies exactly the\
  \ declarations whose lists are\nlongest. A published count of \"41 clean, 35 leaking\
  \ of 66\" survived a session in this project\nwithout anyone noticing it does not\
  \ add up."
