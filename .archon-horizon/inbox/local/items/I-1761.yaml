body: "Verified RR producer\n\nThis stdin example compiles with imports UniformRiemannRoch\
  \ + FixedFiberDegree:\n\nexample {k : Type u} [Field k] (C : Over (Spec (CommRingCat.of\
  \ k))) [IsProper C.hom] [SmoothOfRelativeDimension 1 C.hom] [GeometricallyIrreducible\
  \ C.hom] [GeometricallyIntegral C.hom] : UniformGeneration C := by\n  exact uniformGeneration_of_uniformBaseDivisor\
  \ C (FiberCoordinateData.uniformBaseDivisor_fixedCoordinate C)\n\nA small valid\
  \ producer can be added in UniformRiemannRoch (import FixedFiberDegree), alongside\
  \ unconditional uniformRiemannRoch_fixedCoordinate and uniformSectionDrop_fixedCoordinate.\
  \ It introduces no hypothesis; FixedFiberDegree already provides the base divisor.\
  \ Current UniformRiemannRoch docstrings still falsely call this input open for positive\
  \ genus, so update those stale notes when adding the theorem."
