id: I-1356
provider: local
kind: issue
body: 'UNUSED-HYP: locallyOfFiniteType_of_baseChange carries [Algebra.IsSeparable
  k k''] and [Module.Finite k k''] and consumes NEITHER -- so PicEtSeparated.lean''s
  headline contrast (''field 2 descends freely at the real cover, for k''/k finite
  separable'') is measured at a generality the theorem does not have.


  MEASURED by work-reviewer (AJC vacuity census of the six Picard seam files), lake
  env lean EXIT=0. Picard/PicEtSeparated.lean:276.


  PROBE: the body verbatim with BOTH instance binders deleted from the signature elaborates,
  EXIT=0. Independently confirmed by lean_minimal_hypotheses, which also reports the
  explicit (k'' : Type u) binder ''removable'' and h ''load-bearing''. CONTROL in
  the same run: with h dropped, ''LocallyOfFiniteType X.hom'' by infer_instance FAILS
  (synthInstanceFailed) -- so the environment discriminates and this is not the stale-import
  artifact of I-1057.


  WHY: surjectivity of Spec.map (algebraMap k k'') holds for ANY field extension (spectra
  of fields, both one-point), Flat is free because k is a field, QuasiCompact is free
  on affines. None of the three needs separability or finiteness. The theorem is TRUE
  for an arbitrary field extension; the binders make it read as a statement about
  the route''s finite separable cover.


  Fix the docstring, not the proof. This is the SAME error the seam docstring already
  corrected at input 2 (''the theorem needs neither hypothesis and holds for an arbitrary
  field extension ... Finite-separability is item 1''s constraint and was double-counted
  here''). It has now been double-counted a second time, one file over.


  PLANNING CONSEQUENCE: the finite-separability binder belongs to input 1 -- EtaleFieldCover''s
  picEt_ext_of_pullback_agrees genuinely requires [Algebra.IsSeparable] and [Module.Finite]
  (measured: deleting them there gives synthInstanceFailed). Field 2 does not pay
  it. A costing that reads PicEtSeparated.lean as written budgets separability twice.'
