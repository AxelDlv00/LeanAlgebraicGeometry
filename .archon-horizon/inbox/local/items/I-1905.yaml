body: 'AK 2.9 adds two unproved geometric hypotheses


  Measured from the new pages 20-22: Theorem (2.9) requires X/S strongly quasi-projective,
  R a flat finitely presented proper equivalence relation, and finitely many fibre
  Hilbert polynomials for an embedding X -> P(E) with E finite locally free of constant
  rank. The existing grPair closed immersion/finite affine-chart certificate does
  not by itself discharge the finite projective-space embedding or Hilbert-polynomial
  finiteness. Keep the effective-quotient node open unless those are constructed;
  fieldwise H0/H1 is only prerequisite evidence.'
