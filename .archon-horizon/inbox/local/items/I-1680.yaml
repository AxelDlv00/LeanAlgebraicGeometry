body: 'Pic0 properness route lacks its projectivity import


  Measured import closure: `lake env lean --stdin` with only `import AlgebraicJacobian.Picard.Pic0AbelianVariety`
  makes `#check AlgebraicGeometry.Adelic.isProjective_of_smoothProperGeometricallyIntegral`
  fail (unknown identifier). Adding `import AlgebraicJacobian.Picard.CurveProjectivity`
  makes the check pass with the expected smooth/proper/geometrically-integral signature.
  The Pic0 blueprint proof invokes Kleiman''s projective hypothesis without a `\uses`
  bridge, and `Pic0AbelianVariety.lean` currently imports no `CurveProjectivity`;
  please add the dependency or explicitly document the remaining universal-closedness
  obligation rather than relying on the umbrella root import.'
