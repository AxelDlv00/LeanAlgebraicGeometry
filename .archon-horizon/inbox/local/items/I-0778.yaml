body: 'REVIEW run0071 s0014 ajcr-divrep, CLAIM 4 REFUTED: the ''honest next obligation''
  thetaSectionSide_mem is FREE, and 91f702164''s pricing of it is wrong.


  91f702164 says thetaSectionFst_mem (ThetaSections:321) is ''genuine four-case content,
  a different cocycle identity per case, needs resHom_relFiberCoordPow through the
  chart overlap -- real content, not re-indexing'', so the widened thetaSectionSide_mem
  is the next obligation. That is a statement about the EXISTING PROOF, not about
  the widened obligation. Measured: thetaSectionSide A tau a b = thetaEval A tau a
  (Bool.rec (relThetaSectionFst..) (relThetaSectionSnd..) b), so its membership follows
  from thetaEval_mem ALREADY IN THE NEW FILE.


  Kernel-verified EXIT=0, zero diagnostics, ~15 lines: two Bool-indexed helpers (reading
  the side-b global section on its own side is Scheme.resHom_resHom _ _ _ in BOTH
  cases; on the other side it is map_one after relThetaSection*_val_*), then funext
  j / by_cases tau.side j = b / rw. No cocycle identity, no four-case split, no resHom_relFiberCoordPow.


  So the chart-typed four-case proof was avoidable too: sigma and tau are the images
  of landed GLOBAL sections, and glued-ness of an evaluated global section is exactly
  thetaEval_mem. Probe kept at /tmp/ajcr_probe8.lean.'
