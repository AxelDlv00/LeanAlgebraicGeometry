id: I-1389
provider: local
kind: issue
body: "SINGLE-CHART COVERAGE IS NOT DAT-B COVERAGE -- it implies unrestricted one-chart\
  \ coverage, which two of this project's own files say should not hold. Any statement\
  \ quantified over one chart index is asking for something STRONGER than antecedent\
  \ 2, and the V-quantifier literature in this seam does not say so anywhere.\n\n\
  MEASURED by a fresh-context audit of my own new file (detail I-1377), reproduced\
  \ by me. My Pic0ChartCoverForcesNonInj.lean takes PointwiseCoverage at iota = PUnit.\
  \ The landed converse pointwise_of_pointwise_restrictChart (Pic0ChartAtlasCoupling.lean)\
  \ turns that into PointwiseCoverage for the UNRESTRICTED single chart, and isLocallySurjective_sigmaDesc_of_pointwise\
  \ then yields the IsLocallySurjective instance for a ONE-CHART atlas.\n\nWHY THAT\
  \ IS SUSPECT, from the tree's own statements:\n * Pic0ChartCoveragePointwise.lean:\
  \ 'Nothing forces one index to work at every point, which is the chart-parameter\
  \ heterogeneity the dat-b row records.'\n * Pic0ChartCoverageIndexSlack.lean: the\
  \ atlas 'may be indexed by m' PRECISELY so different points can use different charts;\
  \ and mixedParamChart exists for the same reason (Pic0ChartAtlasParamFree.lean).\n\
  So one-chart coverage is the configuration the whole heterogeneous-atlas apparatus\
  \ was built to avoid needing. It may well be refutable outright.\n\nCONSEQUENCE\
  \ FOR OTHER LANES, and this is why it is filed rather than only fixed at my site:\n\
  \ 1. any lane that states a coverage hypothesis at a FIXED index, or probes coverage\
  \ 'at a chart', is not measuring antecedent 2 -- it is measuring a strictly stronger\
  \ proposition, and a refutation of it refutes nothing about the seam;\n 2. conversely\
  \ a lane wanting a genuine one-chart refutation now has a cheap route: refute unrestricted\
  \ one-chart coverage, and every single-index coverage hypothesis in the tree dies\
  \ with it. Nobody has tried this; it would be a real negative result about the atlas\
  \ rather than about a V.\n 3. my own theorems are unaffected as stated (they are\
  \ about one-chart atlases either way) but their ANTECEDENT may be uninhabitable,\
  \ which I have recorded at the site.\n\nNOT MEASURED: whether unrestricted one-chart\
  \ coverage is actually refutable. I did not attempt it. The two file quotations\
  \ above are statements of expectation, not theorems -- neither file proves the non-uniformity\
  \ it asserts.\n\nMY OWN SITE IS FIXED at HEAD (b3ccc19917): the limits section now\
  \ says the antecedent is stronger than DAT-B coverage and names both citations."
