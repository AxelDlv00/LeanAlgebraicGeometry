body: "HasRigidPushforward gate: axiom frontier update from run 0053 (task ajc-gate)\n\
  \nThree new sorry-free modules landed in the rigid-pushforward cone; all declarations\
  \ #print axioms as exactly [propext, Classical.choice, Quot.sound]:\n  Picard/RigidPushforwardP1Constants.lean\n\
  \  Picard/RigidPushforwardGate.lean\n  (plus in-flight Picard/RigidPushforwardFiberChart.lean,\
  \ Picard/RigidPushforwardP1Sheaf.lean)\nNone of them is imported by the root roll-up.\
  \ If you want them in AlgebraicJacobian.lean, RigidPushforwardGate.lean is the single\
  \ entry point (it transitively pulls the other two).\n\nThe gate itself is STILL\
  \ NOT instantiated: hasRigidPushforward_of_leaves (RigidPushforwardGate.lean) derives\
  \ it from four named, exactly-stated leaves, none of which is proved. So nothing\
  \ in the axiom frontier changes for the Jacobian headline yet -- please do not record\
  \ the gate as closed.\n\nTwo corrections you may care about for the truth ledger:\n\
  1. HasFiniteMapToP1 (RiemannRoch/Adelic/P1BaseCase.lean:153) is NOT an open gate.\
  \ Its own docstring at :146-150 says 'The class carries no instance' -- that is\
  \ STALE. It synthesizes unconditionally for an AJC curve ([SmoothOfRelativeDimension\
  \ 1][IsProper][GeometricallyIntegral]) through hasFiniteMapToP1_of_existsNonconstantMapToP1\
  \ (Adelic/FiniteMapToP1.lean:457) -> existsNonconstantMapToP1_of_existsNonconstantMapToProjInt\
  \ (Adelic/NonconstantToP1.lean:139) -> existsNonconstantMapToProjInt_of_ajc (Adelic/NonconstantToP1.lean:1067,\
  \ PROVED). Verified by elaborating 'example ... : HasFiniteMapToP1 C := inferInstance';\
  \ all four are sorry-free with clean axioms.\n2. HasRigidPushforward has ZERO consumers\
  \ anywhere in the workspace outside its own declaring file (only the three extraction\
  \ theorems in Picard/RigidPushforward.lean use it, and only pushforward_locallyFree_of_h1_vanishing\
  \ is used, by pushforward_isLocallyTrivial_of_h1_vanishing at :498). Any claim that\
  \ it 'feeds seven downstream obligations' is prospective, not present.\nAlso flagged\
  \ in passing: AlgebraicGeometry.cech_flatBaseChange (Cohomology/CechHigherDirectImageUnconditional.lean:1799)\
  \ is itself sorry-tainted -- #print axioms includes sorryAx, from the pullback_preservesFiniteLimits\
  \ sorry at :163 in the same file. That may matter for your leak analysis."
