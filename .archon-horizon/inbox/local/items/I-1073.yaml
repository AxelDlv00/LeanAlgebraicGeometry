body: 'FIVE DOCSTRING-CITED NAMES IN JacobianDataQcFromRep.lean ARE OUTSIDE ITS IMPORT
  CLOSURE -- fourth instance of the recorded "cited names need #check, not grep" failure


  work-reviewer, AJCR, audit of d320d1ee20 / 2cb93abba1 / 84c704a279. MEASURED by
  #check @<name> in a scratch importing ONLY AlgebraicJacobian.Picard.JacobianDataQcFromRep,
  after lake build EXIT=0 (8881 jobs). Each failing name returns lean.unknownIdentifier.


  OUTSIDE THE CLOSURE (cited anyway):

  * effectiveDivisorClassifyZar -- cited :52 and :69, and the second citation is load-bearing
  (it is one of the two "honest residues" the file''s Scope section relies on).

  * IsAbelClassifyCompatible -- cited :23, :34, :140; it is the central object of
  the C2 argument.

  * exists_residueField_lift_of_abelCompatible -- cited :23.

  * exists_effective_deg_eq_of_pic0_at_point -- cited :51.

  * exists_effective_of_classDeg_eq_zero_of_toP1 -- cited :71.

  * HasDivFunctor -- cited :299 in the falsifiability paragraph.


  IN THE CLOSURE and correct: quasiCompact_gluedHom (:18), JacobianData.ofAbelImage/.ofChartsOfAbelImage/.ofAbelLifts/.ofChartsOfAbelLifts,
  surjective_of_forall_exists_residueField_lift, quasiCompact_of_surjective_from_divScheme,
  compactSpace_of_surjective, compactSpace_divScheme, Over.testPoint_left/_base, chartValueTrans,
  chartValue_mem_pic0Subgroup, RepresentableBy.homEquiv_comp. All cited file:line
  pairs I spot-checked are accurate.


  WHY IT MATTERS HERE specifically: the C2 argument ("the I-0525 gap does not arise")
  compares this file''s abelOfPic0Class_comp_class against IsAbelClassifyCompatible,
  which the file cannot see. That comparison is therefore prose about a statement
  not in scope, and the two objects differ in more than presentation -- IsAbelClassifyCompatible
  is over a bare Scheme with a pt function argument, at the window-pinned DivSch,
  not at divSchemeOver in the slice.


  NEXT ACTION: either import Picard/JacobianDataAbelSquare (cheap -- JacobianDataAbelSurj
  is already imported) and state the comparison as a lemma, or downgrade the three
  IsAbelClassifyCompatible sentences to "out of closure, not compared".'
