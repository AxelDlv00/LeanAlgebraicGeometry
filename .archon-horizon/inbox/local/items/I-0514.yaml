id: I-0514
provider: local
kind: issue
body: "chartTwist IS TWISTED THE WRONG WAY: chartLocus tests degree -g, so it is EMPTY\
  \ for g >= 1 (kernel-checked)\n\nReviewer finding on ajcr-charts run 0072. `chartTwist`\
  \ (Picard/Pic0ChartLocus.lean:147) is\n\n  chartTwist C m Z T lam := lam * sigmaFamily\
  \ C Z T * (thetaFamily C (thetaCechClass C) T ^ m)⁻¹\n\ni.e. it applies THE SAME\
  \ twist as `chartValue` (DivSchemeAbel.lean:351), not its inverse.\nThe worksheets\
  \ say the locus tests `λ·θ^m·(−Σ)`, whose Lean spelling is\n`lam * θ^m * (sigmaFamily)⁻¹`\
  \ — the `θ` factor UP and the `Σ` factor DOWN. The Lean has both\nfactors in the\
  \ `chartValue` direction. Consequences, all kernel-checked against HEAD:\n\n(1)\
  \ `chartTwist` does NOT invert `chartValue`. Verified:\n      chartTwist C m Z T\
  \ (chartValue C π n m Z T s)\n        = abelDiv C π n T s * (sigmaFamily C Z T)^2\
  \ * (θ^m)⁻¹^2\n    whereas `chartValue C π n m Z T s * θ^m * (sigmaFamily C Z T)⁻¹\
  \ = abelDiv C π n T s`\n    (proved by `group`). So the correct untwist is the OTHER\
  \ one.\n\n(2) The degree ledger is self-consistent but points the wrong way. `degAt_chartTwist`\
  \ gives\n    `deg Z − m·d₁`, which under the chart-index constraint `deg Z = m·d₁\
  \ − g` is **−g**, not +g.\n    The docstring at Pic0ChartLocus.lean:151-155 states\
  \ this openly (\"With the chart-index\n    constraint this is −g\") and calls it\
  \ agreement with `degAt_chartValue` at n = 0 — but\n    `chartValue` at n = 0 is\
  \ the WRONG comparison point: the chart index is calibrated at n = g.\n    At n\
  \ = g, `degAt_chartValue = 0` (that is `chartValue_mem_pic0Subgroup`) and the class\
  \ that\n    should be tested for an effective degree-g witness is the Abel class\
  \ `abelDiv`, of degree +g.\n\n(3) THEREFORE `chartLocus` IS EMPTY for g >= 1. Kernel-checked\
  \ chain:\n    * `witness_deg_eq_of_mem_chartLocus`: membership + the `IsSplitWitness`\
  \ class equation\n      forces a witness divisor `W` over the splitting field with\
  \ `deg L W = degAt (chartTwist …) = −g`.\n      (Proof: `degAff_unit` + `relPicDeg_relPicMk`\
  \ + `classDeg_picClass` on the class equation,\n      then `degAt_chartTwist`. Needs\
  \ one true-but-unlanded lemma, degAff invariance under\n      `PicEtAff.map` to\
  \ a finite separable extension; verified on the unit case, which is all\n      the\
  \ class equation produces.)\n    * `deg_ge_of_h1_vanishing`: `Subsingleton (HModule\
  \ (divisorSheaf K W) 1)` forces\n      `deg K W >= −χ(\U0001D4AA) = g − 1`. Proved\
  \ outright from the landed\n      `h0_eq_deg_add_chi_of_subsingleton_hModule_one`\
  \ (RiemannRoch/FLVClass.lean:412) plus\n      `h0 >= 0`.\n    * `−g >= g − 1` is\
  \ false for `g >= 1`.\n\nSo CHART-U(a) as landed is a vacuous locus, and CHART-U(b)'s\
  \ openness of it is the trivial\nopenness of the empty set. Every DAT-B/DAT-C consumer\
  \ written against `chartLocus` inherits\nthe vacuity: coverage (\"every pic^0 point\
  \ is locally a chart point\") becomes UNPROVABLE against\nit, not merely unproved.\n\
  \nTHE FIX is one character-level change plus its ledger: `chartTwist := lam * (θ^m)\
  \ * (sigmaFamily)⁻¹`,\nwith `degAt_chartTwist = m·d₁ − deg Z` = `+g`, and the docstring's\
  \ agreement claim restated\nagainst `degAt_chartValue` at **n = g**, not n = 0.\
  \ Nothing else in the five files depends on\nthe direction (`picEtMap_chartTwist`\
  \ is direction-agnostic; `IsSplitWitness`, `chartLocus`,\n`IsChartDatumPresentation`\
  \ and the Pic0ChartPair layer never compute a degree).\n\nNOTE this is NOT the same\
  \ finding the lane posted to I-0494 on 2026-07-28T05:12. That post\nsays the witness\
  \ predicate omits effectivity and `deg = g`, and asserts the degree \"is supplied\n\
  externally, from the chart-index constraint through degAt_chartTwist -- the twisted\
  \ fibre degree\nis then exactly -g\". That sentence is the bug, stated as if it\
  \ were the ledger working. -g is\nthe wrong sign; the lane checked the arithmetic\
  \ and then read the wrong conclusion off it."
