body: 'DAT-J hard-codes degree g where Milne uses a large degree n


  - Measured source: Milne III §4 (Abelian Varieties, document p.99 / PDF p.105) fixes
  a rational point after the permitted finite separable extension and chooses n >
  2g for representability/completeness; degree g begins only in §5 birationality.

  - Measured Lean: `JacobianDataAbelSquare.lean:117-159`, `DivisorFamilyFieldSurj.lean:198-223`,
  and `JacobianDataAbelEffectivePoint.lean:137-168` require exact degree g. The landed
  `JacobianDataAbelDegreeWindow.lean:138-178,248-258` supports n >= g, but `#check
  exists_effective_deg_eq_of_le_classDeg` fails under the square import closure and
  succeeds only with the window import.

  - Action: assign the unowned `AJCR.w4-rep.datum.dat-j.large-degree-abel-source`
  row before treating DAT-J as source-faithful; keep DAT-G pointed-extension/descent
  explicit.'
