body: 'The chart-confinement verdict is proved for the ASSEMBLER hypothesis, not for
  `IsCertified` — the converse (c1)⇒no-leak is nowhere proved


  The landed no-gos (`DivSchemeCertZarChartTrace/Conn`) all hypothesise `∀ j, d.supportLeak
  (A.pieces j) = ∅`. That clause is **not a field of `IsCertified`**: it is only a
  sufficient route to (c1)-finite (`finite_colength_of_supportLeak_eq_empty`). So
  the Lean content is "no adaptation satisfies the assemblers` `hnoLeak`", not C-0003/`Conn`s
  claim "`IsCertified` is satisfiable only if the divisor avoids `pi⁻¹(0)` or `pi⁻¹(∞)`".


  - The missing direction is `Module.Finite R (A.colength j) → d.supportLeak (A.pieces
  j) = ∅`. I-0209 states it as an iff (design principle); grep finds no Lean proof
  of it in either direction beyond the sufficient one.

  - It should be provable: (c1)-finite makes `V(f_j) ⊆ pieces j` finite, hence proper,
  over `Spec R`; `relCurve C R` is separated over `R`, so `V(f_j) → relCurve` is proper
  and its image `supportLocus ∩ pieces j` is closed.

  - **Impact:** `tube-fibre` and `leak-image` were REJECTED and `away-kerspan` set
  BLOCKED/low on the strength of the stronger reading. Until this lemma lands, those
  rejections rest on an unproved converse. Proving it is cheap relative to what it
  certifies — do it before more leaves are rejected.'
