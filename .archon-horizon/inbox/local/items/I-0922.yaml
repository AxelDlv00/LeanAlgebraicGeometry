body: "RELEASE ajc-p2: AJC.rr.extuniform (P5) — owner cleared. The degree clause is\
  \ NOT closed. What the next lane should not re-derive.\n\nDO NOT REDO, it is landed\
  \ and axiom-clean (Ledger/BaseDivisorEveryField.lean; 71f1cf403, fd811e5fd, 8decce128):\n\
  \ * A vanishing divisor exists on C_kappa for EVERY field extension, at EVERY genus,\
  \ on the three curve binders. Carrier verified by machine: UniformBaseDivisor C\
  \ d follows from it plus a hypothesis containing only deg kappa D0 <= d, no vanishing\
  \ content.\n * finrank_stabilisationAmbient_eq_h1: the quotient in which n0 is chosen\
  \ has dimension h1(O(D + n*F)).\n\nDO NOT REDO the pricing work either: GenusFieldInvariance.lean's\
  \ 'missing production from geometry, genus 0 only' index is WRONG and corrected\
  \ in-tree (6618d6979). The genus-0 ceiling belonged to VanishingFieldDescent's unit-sheaf\
  \ route, not to the obligation. See I-0897.\n\nHONEST LABEL, from an audit I accepted\
  \ (I-0914, 8decce128): the theorems add no new mathematics — they derive at the\
  \ parent, the proof body is FiberBound's with one 'exact' renamed, and uniformBaseDivisor_of_exists_deg_le\
  \ is the identity. The round's real content is the pricing correction plus the one\
  \ measurement. Do not read the module as progress on the degree clause.\n\nWHERE\
  \ I STOPPED, and the one thing to try next: bound n0 by genus C. The ambient has\
  \ dimension genus (base-field-invariant), so n0 <= genus C would close the clause\
  \ with d := genus C * deg_kappa F_kappa. MISSING: strictness of the fibre-lattice\
  \ chain below the top — a monotone chain in a g-dimensional space may repeat a term.\
  \ Do not cite n0 <= genus as available.\n\nTWO DEAD ENDS, measured: (a) Serre duality\
  \ / absolute deg >= 2g-1 vanishing is absent from BOTH projects; (b) DegreeVanishing's\
  \ threshold is relative to a base divisor already in hand, so bounding deg D0 by\
  \ it is circular.\n\nCROSS-PROJECT: AJCR has NO extension-uniform statement (grep\
  \ for UniformVanishing/UniformBaseDivisor returns zero defs), and its RiemannRoch/UniformVanishing.lean:71\
  \ pre-brick is already present in AJC under the same name (FiberBound.lean:113).\
  \ The 'port from next door' route is a no-op — see I-0906, and the reviewer withdrew\
  \ it in I-0904."
