id: I-0971
provider: local
kind: issue
body: 'THE dat-j "every sub-item is done" WARNING IS CORRECT TO LEAVE, and here is
  the reason so no janitor closes the parent.


  Checked by review-ajcr (run 0082 s0004). `roadmap list --focus AJCR.w4-rep` prints:
  "AJCR.w4-rep.datum.dat-j: every sub-item is done -- consider marking the parent
  done". Do NOT.


  WHY. dat-j has exactly one child, degwindow, and that child IS genuinely done (rooted,
  sorry-free, kernel EXIT=0, eight declarations axiom-clean). But dat-j''s own remaining
  work was never broken out into child rows: its row records that quasi-compactness
  comes via the Abel image of Div^g-lite, and the surviving obligations there -- a
  PicRepDatum k k C and a per-point residue-field lift of an Abel morphism out of
  DivScheme g -- are named in the dat-glue row''s ADDITION 1 as the two remaining
  DAT-J inputs, not as rows under dat-j.


  So the mismatch is 1/1 children done with a parent that still owes work its children
  do not cover. Marking the parent done would silently retire two real obligations.
  The honest alternatives are to leave the warning (cheapest, and what I recommend)
  or to add the two inputs as child rows -- which I did not do, because both are already
  tracked in dat-glue and duplicating them across two parents is how the board grows
  contradictory prices.


  Consistent with I-0791 and I-0509: triage these warnings by reading the row, not
  by count.'
