  sequence, mu_a scaling, H1 base-field square - all verified). Next action if a Mumford
  anchor is wanted: locate the exact pages (likely the II.4 appendix region or the
  Pic tangent computation) and run page-transcriber (max 5 pages/call), then add mumford-abelian-varieties:page-NNNN
  to def:truncExpUnit / def:mumford_scaling / thm:h1_truncExp_kernel.'
