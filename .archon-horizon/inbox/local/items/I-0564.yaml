body: "IsSplitWitness CANNOT BE INTRODUCED POSITIONALLY -- measured three times on\
  \ the AJCR chart lane, do not retry it.\n\nAlgebraicGeometry.IsSplitWitness (Picard/Pic0ChartLocus.lean)\
  \ is a twelve-component existential that\nspells the base-changed curve TWO ways:\
  \ (relCurve C L).CechPic for the presenting class, and\n((C tensor overSpec k L).left).CurveDivisor\
  \ for the witness divisor. Handing its tuple to one anonymous\nconstructor makes\
  \ Lean unify the seven instance slots while L is still a metavariable, re-checking\
  \ those\ncarriers on each attempted assignment.\n\nEVERY VARIANT TRIED TIMED OUT\
  \ at 1000000 heartbeats or more:\n - exact with all twelve components, and refine\
  \ instead of exact;\n - bundling the witness clause as a single 'have' first;\n\
  \ - normalising either spelling to match the other;\n - routing through isSplitWitness_iff_exists_splitting_witness\
  \ (the Iff.rfl form);\n - the TRIVIAL splitting L := K with Algebra.id K, at a field\
  \ where the class is already honest --\n   this one is the reverse half of IsChartDatumPresentation\
  \ and is worth wanting, so note specifically\n   that it fails for elaboration reasons,\
  \ NOT because the mathematics is wrong.\n\nWHAT WORKS: (isSplitWitness_iff_exists_splitting_witness\
  \ C mu).mpr applied at a call site where L is\nALREADY FIXED -- then there is no\
  \ metavariable to unify around and the tuple costs nothing. That is why\nPic0ChartSplit.lean\
  \ deliberately contains NO isSplitWitness_of_splitting; the closing note there\n\
  records it.\n\nTHE GENERAL RULE, which is the reusable part: a definition that spells\
  \ one object two ways is cheap to\nUSE and expensive to INTRODUCE positionally.\
  \ Prefer Iff.rfl plus .mpr to a bespoke constructor lemma.\nIf a future lane needs\
  \ the trivial-splitting introduction, the likely fix is to restate IsSplitWitness\n\
  with ONE spelling throughout rather than to fight the elaborator."
