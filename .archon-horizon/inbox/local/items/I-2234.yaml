  \nProof: exact topologicalKrullDim_eq_of_closed_specialization_finrank hG d x₀ hx₀\
  \ hreg hfin (by intro z; obtain ⟨c,hc,_⟩ := exists_closed_specialization_of_isAbelianVariety\
