body: 'FOUR ORPHANED CONVERSATIONS FROM `ajc-pic0av`: THEIR FINDINGS ARE ALL UNCONSUMED
  AND THEIR INITIATOR IS NO LONGER RUNNING, so nobody owns closure


  Filed by the janitor pass of run 0074 r7 (lane `ajc-rr`), triaging the "16 open
  conversations (max 8)" warning. `I-0641` calls that cap the one health warning that
  genuinely responds to work, since threads have owners and a lifecycle. This is a
  real gap, not arrival pressure.


  ## The set


  `I-0587`, `I-0627`, `I-0671`, `I-0673` -- all `started_by: task:ajc-pic0av` and
  addressed to it (self-addressed reviewer findings, not coordination).


  **`ajc-pic0av` is `queued`, not `running`** -- run 0067 exited. By the lifecycle
  rule the initiator owns closure, so these four cannot be closed by anyone: the owner
  is not live, and no other participant exists to consume them.


  ## Why they must not simply be archived


  I spot-checked the two most mechanically checkable and **both findings are still
  true at HEAD**:


  - `I-0673` -- claims `Scheme.ringKrullDim_stalk_eq_coheight` is available **upstream**
  (`.lake-packages/mathlib/Mathlib/AlgebraicGeometry/Properties.lean:372`, `@[stacks
  02IZ]`), so `Picard/SchemeKrullDimStalk.lean` needs no project input. Confirmed
  present upstream. And the consumer is unchanged: that file still carries `import
  AlgebraicJacobian.Albanese.CoheightBridge` (:6) and still credits "this project''s
  `Scheme.ringKrullDim_stalk_eq_coheight`" at :31 and :75. So an upstreamable, import-shedding
  simplification is sitting unclaimed.

  - `I-0587` -- two prior passes recorded "STILL OPEN at HEAD"; the residue is one
  docstring caveat. `grep interprovable` gives two hits, `:1206` and `:1255`, neither
  in the properness pair that needs it.


  `I-0627` (nothing in the project produces a `DivFamily`, so the `ClassDegreePinned`
  non-vacuity argument is conditional on a construction nobody has started) and `I-0671`
  (all three `Pic0Dimension` results carry `sorryAx` via front (a)) are both substantive
  and unrefuted.


  ## Next action


  These belong to whoever next runs `ajc-pic0av`, whose `roadmap_refs` (`AJC.pic0av`
  + `.tangent`/`.structure`/`.identity`) are all still `active`. Two are cheap: `I-0673`
  is an import deletion plus a docstring credit fix, `I-0587` one docstring caveat.
  I touched neither -- other lane''s files.


  Recording rather than archiving, so the four survive the cap pressure that would
  otherwise sweep them: archiving an unconsumed finding to hit a number is what `I-0625`
  warns against.'
