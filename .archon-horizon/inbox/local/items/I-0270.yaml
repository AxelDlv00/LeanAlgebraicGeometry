body: "DAT-G0 mountain PARTIAL — the delta-scheme colimit Spec K_s = lim S LANDED\
  \ (green, axiom-clean); the mountain Pic0PreservesFilteredBaseColimit is NOT discharged\
  \ (still the M-L residual, now with concrete affine substrate + avatars pinned).\
  \ Commit 3c034b6e1139920429ada7d9ddad917abf860f88.\n\n=== IS Pic0PreservesFilteredBaseColimit\
  \ DISCHARGED? NO. ===\nThe mountain proper remains the pinned M-L residual in Picard/PicRepColimitCompat.lean\
  \ (c9df8d479), unchanged. This session landed (a) the delta-SCHEME colimit Spec\
  \ K_s = lim S (deliverable 1, S-M) and (b) the connecting theorem showing that system\
  \ plugs into the residual, and pinned the finite-presentation core with avatars.\
  \ divRep-free. Zero sorries.\n\n=== WHAT LANDED (new AlgebraicJacobian/Picard/PicRepColimitMountain.lean,\
  \ 257 L, + root import) ===\nBuilt green (8704 jobs). Keystones axiom-clean [propext,\
  \ Classical.choice, Quot.sound] (verified deltaIsColimit, preservesColimit_deltaScheme_of_residual).\
  \ Native IntermediateField k-algebra/tower instances only (I-0255). Root committed\
  \ HEAD-blob + only my import line (protocol §4); sibling PicEtCrossBaseGraph line\
  \ NOT swept.\n\nKEYSTONES (VERBATIM, namespace AlgebraicGeometry.DatG0; {k K : Type\
  \ u} [Field k] [Field K] [Algebra k K]):\n - noncomputable def deltaRingDiagram\
  \ : FinSubext k K ⥤ CommRingCat.{u}\n - noncomputable def deltaCocone : Cocone deltaRingDiagram\n\
  \ - noncomputable def deltaIsColimit [Algebra.IsAlgebraic k K] : IsColimit deltaCocone\
  \   -- K = colim k'' (ring level): forget CommRingCat reflects the filtered colimit\
  \ + Types.FilteredColimit.isColimitOf' with joint-surjectivity = coe_iSup_finSubext\n\
  \ - noncomputable def deltaSchemeMap {L1 L2 : FinSubext k K} (h : L1.1 ≤ L2.1) :\
  \ overSpec k L2.1 ⟶ overSpec k L1.1\n - noncomputable def deltaSchemeDiagram : (FinSubext\
  \ k K)ᵒᵖ ⥤ Over (Spec (.of k))   -- = S, S.obj (op k'') = overSpec k k''\n - instance\
  \ deltaSchemeMap_isAffineHom : IsAffineHom (deltaSchemeMap h).left\n - instance\
  \ deltaSchemeDiagram_compactSpace / _quasiSeparatedSpace (L) : CompactSpace / QuasiSeparatedSpace\
  \ (deltaSchemeDiagram.obj L).left\n - lemma deltaScheme_forget_eq : deltaSchemeDiagram\
  \ ⋙ Over.forget (Spec (.of k)) = deltaRingDiagram.op ⋙ Scheme.Spec   -- rfl bridge\n\
  \ - noncomputable instance : HasLimit deltaSchemeDiagram   -- Spec K = lim S: Over.forget\
  \ creates connected limits, Scheme.Spec (Γ⊣Spec) preserves the ring colimit\nWith\
  \ (C : Over (Spec (.of k))) [SmoothOfRelativeDimension 1 C.hom] [IsProper C.hom]\
  \ [GeometricallyIrreducible C.hom] (K) [.. IsAlgebraic]:\n - theorem preservesColimit_deltaScheme_of_residual\
  \ (h : Pic0PreservesFilteredBaseColimit C) : PreservesColimit (deltaSchemeDiagram\
  \ (k:=k) (K:=K)).op (pic0TypeFunctor C)   -- S plugs into the residual ⟹ beta1-at-K_s:\
  \ colim_{k''} pic0(Spec k'') -> pic0(Spec K_s)\n\n=== THE MOUNTAIN, PINNED (for\
  \ the next lane) ===\nPic0PreservesFilteredBaseColimit C = pic0TypeFunctor C (fixed\
  \ base k) is locally of finite presentation as a functor. On affine tests overSpec\
  \ k A this is PicEtAff C A commuting with filtered colimits of A, riding finite\
  \ presentation of C/k: C.hom is SmoothOfRelativeDimension 1 (⟹ LocallyOfFiniteType/LocallyOfFinitePresentation)\
  \ and IsProper (⟹ qcqs), so C.hom finitely presented (the ride; grep landed LocallyOfFiniteType\
  \ (relCurve C K ↘ Spec K), e.g. DivSchemeSeedUnivFields.lean:81). Avatars (mathlib\
  \ v4.31.0): CommRingCat.preservesColimit_coyoneda_of_finitePresentation (Ring/FinitePresentation.lean:144);\
  \ RingHom.EssFiniteType.exists_eq_comp_ι_app_of_isColimit (:81) / exists_comp_map_eq_of_isColimit\
  \ (:45); Scheme.exists_π_app_comp_eq_of_locallyOfFinitePresentation (AffineTransitionLimit.lean:1177)\
  \ + exists_hom_hom_comp_eq_comp_of_locallyOfFiniteType (:686) + exists_isAffineOpen_preimage_eq\
  \ (:1058) / exists_isOpenCover_and_isAffine (:1078) to spread affine opens+sections\
  \ of S_{K_s}=lim S_{k''} to a finite stage. NOT a one-session proof.\n\nNet: DAT-G0\
  \ moves further pinned→landed — the delta SCHEME substrate (Spec K_s = lim S, all\
  \ residual hypotheses discharged) is now green in-tree and demonstrably a legal\
  \ residual input; the mountain is the single remaining theorem."
