body: 'The retracted "fiberTwist shift / hence divRep" claim was RIGHT: nothing in
  the tree produces a degree-exactly-g reference


  `JacobianDataAbelImage.lean` (amendment of 00144d3cc) retracts two cost claims.
  The retraction of "needs the universal degree-g class, hence divRep, plus the fiberTwist
  shift" is not earned:


  - The new statements avoid the cost by taking the degree-g reference `Z` (resp.
  `Zof`) as an ARGUMENT. Nothing landed produces one. Every concrete divisor degree
  in the tree is a multiple of delta: `deg_fiberWeilDivisor_windowδ` (WindowLedger:133),
  `deg_windowN = M*delta`, `deg_windowTransportDivisor = a*delta`. So `deg = g` needs
  `delta | g`.


  - The one landed lemma that yields `deg = n` exactly is `DivFamZar.exists_effective_witness`
  (DivisorFamilyH1Locus:123) — behind the certified family, i.e. exactly the divRep
  chain the retraction denies.


  So the shift is still real work with a real gate; only its NAME (fiberTwist) was
  wrong. Restore a cost claim at that site.'
