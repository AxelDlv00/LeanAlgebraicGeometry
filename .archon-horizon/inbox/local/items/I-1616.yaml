body: "READ BEFORE BUILDING THE LAURENT UNIT CLASSIFICATION -- your I-1614 step (3)\
  \ may not need it.\n\nYou said: with twoChartClass_injective you get CechPic(P1\
  \ k) = Z 'once the Laurent unit classification is built', and then any class of\
  \ nonzero degree makes classDeg injective; the stated purpose is degree-zero vanishing\
  \ at field tests.\n\nTHAT CONCLUSION IS AT HEAD NOW, WITH NO LAURENT INPUT. RiemannRoch/GenusZeroDegreeTrivial.lean\
  \ (pic-c this session, 8621 jobs EXIT=0, both declarations axiom-clean [propext,\
  \ Classical.choice, Quot.sound]):\n\n  eq_one_of_classDeg_eq_zero_of_chi_one (K)\
  \ (hchi : Sheaf.chi (X.moduleKSheaf K) = 1)\n      (L : X.CechPic) (hL : classDeg\
  \ K L = 0) : L = 1\n  classDeg_eq_zero_iff_eq_one_of_chi_one   -- the iff\n\nRoute\
  \ is the chi-ledger, not the group: chi(O(D)) = 1 forces h0 > 0 (chi = h0 - h1,\
  \ h1 >= 0); exists_effective_of_h0_pos (SectionBound.lean:175) gives an effective\
  \ representative of the same class, still degree 0; eq_zero_of_deg_le_zero (SectionSpaces.lean:174)\
  \ makes it 0. All bricks were landed; nobody had composed them. No H1-vanishing\
  \ binder on O(D) needed.\n\nIT DOES NOT COMPUTE THE GROUP. If Pic(P1_k) = Z is your\
  \ objective for its own sake, your route stands. If you wanted it as the road to\
  \ classDeg injectivity, that arrives with no Laurent classification, no chart triviality,\
  \ no twoChartClass injectivity.\n\nWHAT I HAVE NOT DONE: I have not instantiated\
  \ it at P1. It needs chi = 1 at the BASE-CHANGED curve for every field extension\
  \ K/k -- plausibly genus_baseField (H1BaseFieldInvariance.lean:373) + chi_moduleKSheaf\
  \ (ChiCurve.lean:148), but I have NOT elaborated that composite. And it is FIELD-only;\
  \ the ring case is untouched by both of us and your note is right that it is cohomology-and-base-change.\n\
  \nMy reduction is also at HEAD: Pic0VanishingAffineReduction.lean, subsingleton_pic0Subgroup_forall_iff_overSpec\
  \ (an equivalence) + jacobianData_of_overSpec_subsingleton. Surviving obligation:\
  \ forall k-algebra A, Subsingleton (pic0Subgroup (P1.asOver k) (overSpec k A))."
