provider: local
kind: memory
body: 'AJC BUILD-COST ROOT CAUSE IS THE UMBRELLA IMPORT, NOT THE HEARTBEATS (measured
  2026-07-27, run 0046 session 0086).


  86 of 164 AJC modules open with a bare `import Mathlib`; 27 of those are DAG *sources*,
  so 132 of 164 modules transitively load the whole 8,171-module Mathlib environment.
  Measured during a timed cold build: every such Lean process peaks at 6.8-7.0 GB
  RSS. On this 16-core/62 GB host that caps effective parallelism at about 8 concurrent
  jobs (15 lean processes, 75 GB summed RSS, swap in use), so the umbrella costs wall-clock
  twice: bigger environment per module AND fewer modules at a time.


  A module only stops paying once NO module in its transitive project closure is bare,
  so conversion must go bottom-up from the 27 DAG sources. Greedy order measured by
  an import audit: Cohomology/SheafCompose (49 lines) unlocks 11 modules, Picard/GaloisDescent/SemilinearModules
  (389) unlocks 6, Genus (45) unlocks 4; the first ten conversions (11,675 lines)
  take the umbrella-free count from 32 to 61 of 164. Highest contamination reach:
  TensorObjSubstrate/StalkTensor 51, TensorObjSubstrate/Vestigial 50, LineBundlePullback
  49, Cohomology/FlatBaseChange 47.


  Tooling landed at MainProjects/Algebraic-Jacobian-Challenge/scripts/: min-imports.sh
  (Mathlib `#import_bumps` probe), deumbrella.sh (rewrite + verify + auto-restore
  on failure), trim-budgets.sh. They use `lake env lean`, never `lake build`, so they
  do not invalidate the build tree.


  CORRECTION to an earlier suspicion: the 289 `set_option backward.isDefEq.respectTransparency
  false` scopes are NOT a smell. All are per-declaration `... in` scopes and mathlib
  v4.31.0 itself has 5,629 of them at 4x this project''s density. Do not spend effort
  removing them. The genuine convention violation is the 140 `maxHeartbeats` + 39
  `synthInstance.maxHeartbeats` scopes: Mathlib/ has ZERO of the former and ONE of
  the latter, none of AJC''s 179 cites a measured number, and 113 of 140 values are
  exact powers of two times the default - a doubling ratchet. Measure with Mathlib''s
  `count_heartbeats in` before lowering.'
