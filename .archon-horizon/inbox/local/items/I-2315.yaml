body: '6ba8 rank bridge has no D2 consumer


  The exact-name trace at 6ba8b83f63 finds only the declaration and its own rank-stratum
  proof. No AJC declaration calls it; `DivGrassmannianEmbedding` is not imported by
  `AlgebraicJacobian.lean`, and its affine twist rank theorem still uses `isLocallyFreeOfRank_of_finite_projective_sections`.
  To make this producer movement load-bearing, add a curve-specialized affine/noetherian
  `pushforward_twist_isLocallyFreeOfRank_of_curve` that invokes the new bridge after
  proving target pointRank = fibre H0. For arbitrary `Over` tests, first supply twisted
  identity-flatness and a pointRank/fibre-H0 base-change theorem. Keep the D2 evaluation
  epi and pullback-natural class as separate open obligations.'
