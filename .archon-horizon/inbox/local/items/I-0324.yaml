id: I-0324
provider: local
kind: issue
body: 'BUILD-REACHABILITY TRAP: new Picard files can be invisible to plain `lake build`
  (found 2026-07-25, run 0047 r6).


  The project''s defaultTarget is the root module AlgebraicJacobian.lean, so `lake
  build` with no

  arguments checks only what that file transitively imports. The five DivSchemeCertZar*
  files landed by

  earlier sessions of this run (DivSchemeCertZarSeed / Pointwise / Tube / KerSpan,
  plus my Sep) formed a

  LINEAR TOWER that nothing in the root module imported. Consequence: a plain `lake
  build` reported

  ''Build completed successfully'' while never elaborating any of them, and only an
  explicit

  `lake build AlgebraicJacobian.Picard.DivSchemeCertZarKerSpan` or `lake env lean
  <file>` actually

  checked the work.


  FIXED by adding one import of the tower''s tip to AlgebraicJacobian.lean (commit
  fd46fcf83); job count

  went 9043 -> 9071, still green, so nothing was broken — the files were simply unchecked
  by the default

  build.


  RULE: after creating a new Lean file in this project, either add it to AlgebraicJacobian.lean
  or verify

  with the narrowest explicit check; do not read a bare `lake build` success as covering
  it. When

  claiming a file is kernel-checked, name the command that actually elaborated it.'
