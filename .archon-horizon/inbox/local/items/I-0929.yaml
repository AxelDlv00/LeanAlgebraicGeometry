body: "THE \"HONEST RESIDUE\" deg = g OF eq_of_picClass_eq_of_deg_eq_of_subsingleton_hModule_one\
  \ IS FREE AT CHART PARAMETER n = g -- the chart ledger already forces it, so the\
  \ theorem can be stated with no degree hypothesis\n\nPositive finding from the fresh-context\
  \ review of JacobianDataAbelDegreeWindow.lean (ajcr-p4, cd9aa7a08 / c0deff3e5).\
  \ MEASURED, lake env lean EXIT=0.\n\nWHAT THE FILE SAYS, :271-273: \"provided the\
  \ witness has degree g, which is the hypothesis IsSplitWitness does NOT impose and\
  \ a consumer must supply. That remaining deg = g pin is the honest residue.\"\n\n\
  IT IS NOT A RESIDUE at the parameter that matters. ledger_forces_b_eq_n (Pic0ChartCoverageIndexSlack.lean:154)\
  \ already proves that at a chart index legal at parameter n -- i.e. deg_k Z = m*d1\
  \ - n -- the twisted presenting class has classDeg = n. Compose with classDeg_picClass\
  \ and any divisor W in that class has deg W = n on the nose. So at n = g the degree\
  \ pin is DERIVED, not supplied.\n\nPROBE, EXIT=0 (two theorems, no sorry):\n  probe_degree_pin_free:\
  \ from hlam : degAt lam t = 0, hM0, hZ : deg_k Z = m*d1 - g, and hW : picClass L\
  \ W = M0 * map (chartTwistClass C m Z), concludes deg L W = g. Proof: classDeg_picClass\
  \ then ledger_forces_b_eq_n then omega.\n  probe_h0_one_no_degree_hyp: same binders\
  \ plus hchi and h1 : Subsingleton H^1, concludes h0 = 1 with NO deg hypothesis,\
  \ by feeding probe_degree_pin_free into h0_eq_one_of_subsingleton_hModule_one_of_deg_eq.\n\
  \nWHY IT MATTERS. The file's own honest-limits paragraph identifies the wrong residue\
  \ for the chart consumer. The genuine surviving GAP-2 input at n = g is EFFECTIVITY\
  \ of both divisors (see the companion issue), not the degree. A p4 follow-up should\
  \ land the degree-free form at the chart carrier, which turns the h^0 = 1 delivery\
  \ into a statement whose only remaining input is 0 <= D and 0 <= D'.\n\nCAVEAT,\
  \ unmeasured: my probe assumes the chart-index legality constraint hZ in the shape\
  \ ledger_forces_b_eq_n takes. Whether a coverage witness at parameter g comes with\
  \ that constraint discharged is the 0 <= Sigma legality question IndexSlack:73-78\
  \ leaves open. So this is a re-pricing of the pin, not a discharge of coverage."
