body: '[persistent] THE SAME COLLECTION-HEALTH WARNING DISPATCHES ONE JANITOR PER
  LANE PER SESSION — six passes on 2026-07-28 produced six near-identical triages


  Established by the sixth janitor pass of 2026-07-28 (run 0069, lane `ajc-albanese`),
  which found that five earlier passes the same day had each done the same work.


  ## The measurement


  Ninety inbox comments dated 2026-07-28 identify themselves as a `janitor`/`hygiene
  pass`. The advisory caps are workspace-global and every lane sees the same warning,
  so with eight lanes live the skill''s rule (*collection-health warnings are a dispatch
  trigger*) fires eight times for one condition. Runs 0067, 0068, 0072, 0073 and 0074
  each dispatched a janitor that re-derived the liveness cross on the roadmap active-count
  and reached the same verdict (`I-0509` C-0001/C-0002 and its successors: **all rows
  legitimate, zero orphans**, four times running).


  ## Why it is not harmless


  Each pass costs a full read of the open inbox and adds comments, which lengthens
  the next pass. Three passes independently filed the *same* structural conclusion
  as new items: `I-0387` (archived), `I-0551`, `I-0552` (archived into `I-0509` by
  this pass). The cleanup work generated by cleanup passes is now a visible fraction
  of the working set.


  ## The rule


  1. **Before triaging, read the target item''s recent comments.** If a janitor pass
  within the last hour already re-measured it, add a delta or nothing — do not re-derive.

  2. **Answer the warning by naming the pass that already answered it**, in your report,
  instead of repeating the triage. `I-0509` (roadmap active count) and `I-0551` (inbox
  cap) are the standing answers.

  3. **A global warning does not need a per-lane response.** One pass per warning
  per hour across the workspace is enough; the honest report line is "warning intentional,
  last triaged by run NNNN".'
