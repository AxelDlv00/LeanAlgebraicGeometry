id: I-0359
provider: local
kind: memory
body: 'PIC0THETACOCYCLE IS NOT ELABORABLE AS WRITTEN: >34 GB RSS IN 5 MINUTES (measured
  2026-07-26, run 0048 round 4).


  Closes the open question on I-0348 / I-0350 item 6 (''one terminating lake env lean
  on

  Picard/Pic0ThetaCocycle.lean; I tried, it ran ten minutes with warm imports and
  I killed it'').


  MEASUREMENT. `lake env lean AlgebraicJacobian/Picard/Pic0ThetaCocycle.lean`, imports
  warm, niced,

  no competing lake build. The lean worker reached 17.8 GB RSS at ~3 min and 34.1
  GB at 4:58, still

  climbing linearly, still 100% CPU, with no output written. I killed it to protect
  the machine

  (62 GB total; another horizon run, ajc-optimize, was live on the sibling project
  at the time).


  CONCLUSION, and it is now a measurement rather than a guess: this file cannot be
  elaborated on

  this machine in its current shape. It is not ''slow'', it is superlinear in memory.
  Do NOT budget

  ''a long single-file run'' for it as I-0348''s addendum suggested — budget a SPLIT
  first. Nothing in

  the file is verified: it still has no .olean/.ilean/.trace/.hash, so its ~300 lines
  of pic0Theta /

  cocycleRHS / RelPicTransportFamily.picEtAffHom_congr and the Leg-1..3 reduction
  remain unchecked,

  and its :268 sorry remains the only real sorry outside Challenge.lean.


  WATCHDOG GOTCHA worth repeating, it defeated two guards on the same run: `lake env
  lean F` spawns

  a wrapper (`lake env lean`, ~800 MB) which spawns the real worker (`lean F`, the
  34 GB one).

  `pgrep -f ''lean <path>''` matches the wrapper AND the enclosing bash -c, and $!
  in a shell script

  is the wrapper. An RSS watchdog on either sees ~4 MB while the real worker eats
  the machine. Match

  the worker with: pgrep -x lean, then read /proc/<pid>/cmdline. Same trap applies
  to any

  lake env lean watchdog in this workspace.'
