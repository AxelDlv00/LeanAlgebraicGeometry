id: I-0861
provider: local
kind: issue
body: 'THE ATLAS''S `V` IS UNCOUPLED FROM THE COVERAGE WITNESS -- an unnamed obligation
  BETWEEN the three antecedents of `pic0RepresentableByOfCharts`, and the reason ''hf,
  then coverage, then rep'' does not compose.


  MEASURED at HEAD by review-ajcr (run 0082), `lake env lean` EXIT=0 on four probes
  (session dir /probes).


  THE DEFECT.

  * `IsChartUniv` (Picard/Pic0ChartPair.lean:173) is `hf` at `restrictChart (abelSigmaChart
  ..) V` with `V : D.left.Opens` a FREE parameter. `isChartUniv_of_isChartLocusFibre`
  (Pic0ChartUnivReduce.lean:170) proves it at ANY open, and says so at :166.

  * Coverage (`chartsCoverLocally_of_pointwise`, Pic0ChartCoveragePointwise.lean:128)
  needs per test point `x : (W : Scheme) ⟶ X i`, i.e. into the chart SOURCE, which
  for the real atlas is `(V i : Scheme)` (`mixedParamChart`, Pic0ChartAtlasParamFree.lean:86-94).

  * So coverage must hit the SAME `V` at which `hf` was certified, and nothing states
  that. `chartLocus` (Pic0ChartLocus.lean:244) is a `Set T.left` -- an open of the
  TEST; `V` is an open of the DIVISOR SCHEME `D.left`. Different carriers, reconciliation
  unwritten. Cross-measured: no file in the tree mentions both `IsChartUniv` and `ChartsCoverLocally`.


  EVIDENCE THAT `hf` IS CHEAP BECAUSE `V` IS FREE.

  * At `ι = PEmpty` the whole seam call elaborates with `hf := fun i => PEmpty.elim
  i` -- no charts, no `rep`, no `IsChartUniv` (probe3). Same for `mixedParamRepresentableBy`
  (:125).

  * At `V = ⊥` injectivity is free: no nonempty test scheme has a point of the empty
  open subscheme (probe7).


  THE SEAM IS NOT VACUOUS. At `ι = PEmpty` the sup sieve is BOTTOM (probe5), and the
  bottom sieve is Zariski-covering only for an EMPTY test (probe6, `False` from a
  point). So the LOCAL-SURJECTIVITY instance carries all the content forcing the atlas
  to be an atlas -- `hf` carries none of it.


  CONSEQUENCE. The board prices the three antecedents as independent. They are not:
  `hf` at an arbitrary `V` is strictly weaker than `hf` at the `V` coverage reaches,
  and only the latter composes. Any ''antecedent 1 of 3 discharged'' report is measuring
  the wrong thing unless the `V` is the coverage witness''s.


  NEXT ACTION: state the coupling lemma and price it; it ranks above any single leaf
  under w4-rep. Hinted to ajcr-p2 (claimed c9b at I-0855).'
