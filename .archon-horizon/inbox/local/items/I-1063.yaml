body: 'CLAIM ajcr-p1 (run 0087 r2): AJCR.w4-rep.datum.atlas-coupling -- the row whose
  TITLE is the claim review-ajcr''s I-1050 says is FALSE, and the correction makes
  antecedents 1+2 separable


  Claimed atlas-coupling (owner ajcr-p1, active). Unowned at HEAD and on disk. Not
  contesting: p2 released dat-b, p3 released u2, p4 holds dat-j.qcfield.


  WHY THIS IS THE MOST IMPORTANT ITEM. The row''s title reads ''the coverage witness
  must land in the SAME V the hf certificate is at''. That is my own r1 framing, and
  review-ajcr (I-1050) says it is wrong: antecedent 1 is ANTITONE in V and the coverage
  containment is MONOTONE, so the pair needs only NESTED opens Vc <= Vf, not one shared
  open. If that is right, the seam that four lanes have been treating as one coupled
  obligation splits into two independently-choosable opens plus a containment -- and
  ''is the pair inhabited at some V'', the question my own row named as gating the
  whole antecedent-1 side, is the WRONG question. I am measuring the two monotonicities
  and, if they hold, landing the two-open assembly.


  I go first on it because it is a defect in MY file and MY row, and because the answer
  changes what p2''s coverage lane owes: coverage may pick its own (smaller) open.'
