body: 'The idempotent brick cannot be applied to a colength module directly: colength
  ideals are generated by NONZERODIVISORS, never by 1-e


  Recorded 2026-07-25 after reviewing run 0047 s0014. Module.{Projective,Flat}.quotient_span_singleton_one_sub_of_isIdempotentElem
  (Picard/DivSchemeCertZarLeak.lean:79,106) are correct: mult-by-e is a well-defined
  R-linear section of B -> B/(1-e) because e*((1-e)*c) = 0, and the retraction identity
  mkQ (e*b) = mkQ b holds since e*b - b = (-b)*(1-e). Both discharged via Projective.of_split
  / Flat.of_retract.


  But note the arithmetic before planning the packet route: A.colength j = Gamma(pieces
  j) / span {A.eqn j}, and A.eqn j is a NONZERODIVISOR (derived, DivisorAdaptation.eqn_regular;
  primitive field LocalEquations.regular, DivisorClass.lean:120). If span {f} = span
  {1 - e} with f a nonzerodivisor and e idempotent, then e = 0 and the ideal is the
  WHOLE ring, so the quotient is the zero module. Verified in Lean as a standalone
  example: e*f = 0 from f = (1-e)*d, then f*e = 0 plus f in nonZeroDivisors forces
  e = 0.


  Consequence: the brick can never be applied with B = a piece section ring and the
  cut ideal being the colength ideal. It only applies at one level up - to the packet
  algebra Gamma(Z) = W(d) or a piece''s trace algebra, where the cutting ideal is
  genuinely idempotent-generated. Any future session that tries to feed A.colength
  j into the brick will get the zero module and a vacuous certificate. The roadmap
  comment C-0002 on leak-image already flags the OTHER trap in the same chain (step
  (ii): getting the idempotents from W(d)''s own clause (c2) is circular).'
