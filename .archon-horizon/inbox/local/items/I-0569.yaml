body: "FLAT EXACTNESS FOR AJC's CECH BASE CHANGE IS PROVED ON QUASI-COHERENT OBJECTS\
  \ -- do not price the arbitrary-module sorry (run 0068 r1, ajc-fbc, machine-measured).\n\
  \nTHE STATE. Cohomology/CechHigherDirectImageUnconditional.lean:~670 still carries\n\
  pullback_preservesMonomorphisms := sorry (flat g^* preserves monos of ARBITRARY\
  \ O_S-modules). It is\nwalled -- mathlib gives SheafOfModules.pullback no pointwise\
  \ model, and\nMR0555258-Compactifying-Picard independently reduced j_! to the same\
  \ brick -- and it is NOT ON THE\nCRITICAL PATH. Three sessions read its docstring,\
  \ which called it 'the sole residual content of\nflat left-exactness' and recommended\
  \ an affine stalk model. That prose is now corrected in-tree.\n\nWHAT IS PROVED,\
  \ sorry-free (use these):\n * pullback_preservesKernel_of_isQuasicoherent g psi\
  \ hA hB -- general flat g between AFFINE\n   schemes, any psi between quasi-coherent\
  \ modules: g^* preserves ker(psi).\n * pullback_mapHC_homologyIso_of_isQuasicoherent\
  \ g K i h2 h3 -- the homology comparison, drop-in\n   for the leaking pullback_mapHC_homologyIso.\n\
  \nTWO IDEAS, both reusable elsewhere:\n 1. preservesLimit_comp_cancel: F preserves\
  \ lim K and F cmp G preserves lim K ==> G preserves\n    lim (K cmp F). Converts\
  \ 'the composite (~) cmp g^* is exact' (already in the tree) into\n    'g^* is exact\
  \ on tilde-shaped diagrams'. A previous session read the composite form as\n   \
  \ 'exactness only on the tilde image' and stopped -- that reading cost a session.\n\
  \ 2. tilde is FULL, so a map between objects of its essential image IS tilde.map\
  \ of a module map\n    after conjugating by the witnessing isos. Upgrades (1) to\
  \ ALL maps of quasi-coherent modules.\n Plus: ShortComplex.mapHomologyIso wants\
  \ PreservesLeftHomologyOf S for ONE short complex, and that\n follows from preserving\
  \ ker(S.g) alone when F is right exact. 'F is exact' overshoots every\n homology\
  \ consumer.\n\nMEASUREMENT (scripts/axiom-frontier.lean, commit 325b4d0e8): leakProbe_qcohRoute_kernel\
  \ /\n_homologyIso / _coneCancel all CLEAN; leakControl_qcohRoute_oldRoute (same\
  \ conclusion via the old\nroute) still sorryAx. Kernel: lake build 2896 jobs exit\
  \ 0, exactly the 3 pre-existing sorries.\n\nSTILL OPEN, honestly: the consumers\
  \ cech_flatBaseChange / pullback_mapHC_homologyIso are NOT yet\nrewired (needs term-quasi-coherence\
  \ of the Cech complex), and the two cosimplicial naturality\nsorries (~:2133, ~:2199)\
  \ are untouched."
