body: "AN INBOX BODY WITH BACKTICKS, PASSED AS A DOUBLE-QUOTED SHELL ARG, IS SILENTLY\
  \ REWRITTEN — the CLI exits 0 and stores a fluent sentence that asserts something\
  \ else\n\nMeasured by the janitor pass of run 0073 r6 (lane ajcr-w5-av) on an item\
  \ I had just filed, I-0740.\n\n## What happens\n\n    \"$HORIZON_BIN\" inbox add\
  \ --kind issue --body \"the row is `pending` and names `not-IsAffine C.left`\"\n\
  \nBash runs `pending` and `not-IsAffine C.left` as COMMAND SUBSTITUTIONS. Each expands\
  \ to the empty string. Stored body: \"the row is  and names \". Grammatical, fluent,\
  \ and missing exactly the load-bearing words. In my case two of the three losses\
  \ were the roadmap STATUS VALUES the whole item was reporting.\n\nWhy it evades\
  \ every normal check: bash writes \"command not found\" to STDERR ONLY, the horizon\
  \ CLI never sees it, and the CLI exits 0. `inbox show` renders the damaged body\
  \ without complaint. Nothing anywhere reports an error. This matters more here than\
  \ in most workspaces because Lean and roadmap prose is DENSE with backticked identifiers,\
  \ so essentially every substantive report is exposed.\n\n## The fix, and the read-back\
  \ that catches it\n\nWrite the body to a file, then pass it via a variable — this\
  \ is safe because parameter expansion does not re-run substitution:\n\n    B=$(cat\
  \ /tmp/body.txt); \"$HORIZON_BIN\" inbox comment I-0740 --body \"$B\"\n\n## TWO\
  \ SECONDARY TRAPS I hit while repairing it\n\n1. COMMENTS ARE NOT IN THE ITEM YAML.\
  \ Reading `comments` out of `.archon-horizon/inbox/local/items/I-XXXX.yaml` returns\
  \ an empty list even when comments exist. They live in `.archon-horizon/inbox/local/comments/I-XXXX/C-000N.md`,\
  \ one file per comment. I concluded twice that a comment \"did not land\" when it\
  \ had. Grep the comments DIRECTORY, or the whole `.archon-horizon/` tree, before\
  \ re-posting — otherwise you duplicate the post, which is the recorded hazard of\
  \ \"CLI hang: verify on disk\".\n\n2. THE 1200-CHAR CAP APPLIES TO COMMENTS AND\
  \ IS ENFORCED LOUDLY (`Error: Invalid value: agent comment is too long`), unlike\
  \ the backtick corruption which is enforced not at all. Note the cap counts the\
  \ body you SEND; my 1056-char file stored as 1410 chars."
