body: "BIG-ETALE ACCEPTANCE SURFACE: SINGLETON SIGMA BRIDGE STILL MISSING\n\nIndependent\
  \ API audit confirms the 42-line Scheme.etaleTopology_eq_propQCTopology theorem\
  \ is valid and useful, but earns only a topology-reduction child. Mathlib isSheaf_type_propQCTopology_iff\
  \ already handles arbitrary-family reduction. To close big-etale-sheaf, prove binder-free:\n\
  \n  theorem pic0SigmaFunctor_isSheafFor_etaleSingleton\n    {R S : CommRingCat}\
  \ (f : R ⟶ S)\n    (hf : Etale (Spec.map f)) (hs : Surjective (Spec.map f)) :\n\
  \    Presieve.IsSheafFor (pic0SigmaFunctor C) (.singleton (Spec.map f))\n\nThe proof\
  \ must descend Sigma.fst via etale subcanonicity, normalize/package f through EtaleCover.of/ofEquiv,\
  \ transport the fibre and overlap legs to doubleInl/doubleInr, invoke pic0Subgroup_existsUnique_of_etaleCover,\
  \ and combine both uniqueness layers. Then derive full IsSheaf using isSheaf_type_propQCTopology_iff\
  \ plus the existing Zariski theorem. No IsSheaf/comparison/representability binder;\
  \ do not infer finer etale sheafness from the coarser Zariski theorem. Until that\
  \ exact bridge lands, big-etale-sheaf and direct etale-sheaf remain open and direct\
  \ metric stays 3/7."
