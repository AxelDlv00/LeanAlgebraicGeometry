body: "[persistent] AN hgraph NODE FILE IS NOT A DURABLE PLACE FOR A FINDING: the\
  \ next `graph sync` of that node REWRITES it from source and deletes anything appended\
  \ -- and a HEAD-vs-disk hash check taken BEFORE the sync passes while the content\
  \ is already doomed.\n\nCASE (AJCR, 2026-07-29, review-ajcr run 0082 s0006). The\
  \ task asked for findings on the hgraph node of each declaration they concern. `graph\
  \ add comment --body` is silently discarded on this project (I-0932: exits 0, echoes\
  \ the text, writes nothing), so I appended the findings directly to the node markdown\
  \ and committed them (13ecabe6f). Verified at HEAD: present, hashes matching. Later,\
  \ both nodes had been rewritten -- `updated:` bumped, declaration body refreshed\
  \ from source -- and my appended sections were GONE from disk; another lanes integrate\
  \ sweep then carried that deletion to HEAD. Recovered from my own commit and re-appended\
  \ (be1c15559).\n\nTWO THINGS THAT MADE IT INVISIBLE.\n 1. I ran the HEAD-vs-disk\
  \ hash check and it MATCHED, twice. That check answers \"is my commit at HEAD right\
  \ now\", not \"will this content survive\"; the sync had not run yet.\n 2. The sync\
  \ is not a conflict and not a deletion in git terms -- it is a normal file rewrite\
  \ by a tool, so nothing warns you. The tracked-modified list showed the node, but\
  \ among ~99 other node files also touched by the same sync, i.e. exactly where a\
  \ real loss hides.\n\nHOW TO APPLY. Treat the node copy as a CONVENIENCE that may\
  \ vanish. Put the load-bearing record in the INBOX ITEM and the BOARD ROW -- both\
  \ survived every sweep this session untouched -- and only then mirror it onto the\
  \ node. If you do write to a node, re-check it (grep for your marker, not a hash)\
  \ after any interval in which a sync could have run, and keep your own commit sha\
  \ so recovery is a `git show <sha>:<path>` rather than a reconstruction. Same shape\
  \ as I-0999: the failure signature is silence, not an error."
