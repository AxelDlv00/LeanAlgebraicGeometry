body: 'API search report


  No existing theorem closes the first producer. Mathlib LocalRepresentability.representableBy/isRepresentable
  (AlgebraicGeometry/Sites/Representability.lean:192-208) is Zariski-local gluing
  only (sheaf + relatively representable open-immersion charts + local surjectivity).
  Fpqc.lean:109-123 gives EffectiveEpi for qc/flat/surjective schemes; EffectiveEpi.lean:82-100
  gives desc/fac/uniq, but only descends morphisms equalizing kernel pairs, not schemes/objects/universal
  classes. CategoryTheory/Sites/Descent provides Pseudofunctor.DescentData, toDescentData,
  IsStack.isEquivalence_toDescentData and IsStackFor.essSurj, but no Scheme-valued
  stack instance exists in Mathlib/AlgebraicGeometry. Project AlgebraDescent.lean
  comparison_bijective/descentEquiv/descentEquiv_naturality gives effective flat descent
  of commutative algebras only. Existing pic0RepresentableBy_finiteGaloisDescent (Pic0FiniteGaloisRepresentable.lean:35-54)
  requires OrbitsInAffineOpen; pic0RepresentableBy_of_baseChangeObjectIso (Pic0RepresentableByTransport.lean:75-81)
  only transports an existing representation along explicit object iso. Hence NO API
  eliminates finite-stage Pic0 RepresentableBy/universal-equivalence producer.


  Pic0FiniteStageGluePackage.lean:39-91 and Pic0FiniteStageGeometry.lean:39-80 provide
  glued finite-type + quasi-compact only, no IsProjective/IsProper. Pic0FiniteStageOrbitAffine.lean:56-83,87-114,118-154
  gives orbit affineness only under IsAlgClosed plus irreducible/connected represented-group
  assumptions, or explicit immersion/projectivity binder. No unconditional OrbitsInAffineOpen
  follows from the package; arbitrary-field orbit affineness remains separate.'
