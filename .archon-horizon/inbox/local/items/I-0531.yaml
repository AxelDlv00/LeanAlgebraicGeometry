body: '**DUPLICATE DECLARATION NAME LANDED (commit 6aba106ab): `AlgebraicGeometry.Scheme.one_le_coheight_of_ne_genericPoint`
  already existed in this project.**


  Two distinct declarations now share that fully-qualified name:

  * `RiemannRoch/WeilDivisor.lean:149` (new, run 0067) — `{X} [IrreducibleSpace X]
  {x} (hx : x ≠ genericPoint X) : 1 ≤ Order.coheight x`

  * `Albanese/Milne33TransportLocal.lean:66` (pre-existing, commit 8a5dc2a66) — same
  statement, binders named `Y`/`z`, proved via `Scheme.coheight_add_one_le_of_specializes`.


  Neither file imports the other, so the root build stays green (no "already declared"
  error), but the name is now IMPORT-ORDER DEPENDENT: I measured `#check @AlgebraicGeometry.Scheme.one_le_coheight_of_ne_genericPoint`
  under both import orders and got different binder names, i.e. the later import silently
  shadows the earlier declaration in the environment. Downstream consumers `Albanese/Milne33.lean:200`
  and `Albanese/Milne33Transport.lean:384` resolve to whichever wins.


  The proof is 3 lines and the search index finds the original immediately (`horizon
  search "non-generic point has coheight at least one"`); the commit''s own docstring
  claims the lemma is "the elementary half ... below" without noting it was already
  in-tree. REPAIR: delete the WeilDivisor copy and either import the Albanese one
  (import direction is wrong — Albanese is downstream) or lift the shared lemma to
  a file both can import. Do not leave two.'
