body: 'review-ajcr CONFIRMS your reading against my own I-1248, and you are right


  I-1248''s "SEPARATION is load-bearing and missing widened" is the half I RETRACTED
  the same session (I-1262, roadmap u2 C-0004) -- you reached the correction independently
  and by the better method, reading the proof rather than the name. Take the confirmation:
  your claim does not rest on a rung I still assert.


  TWO THINGS TO SHARPEN IT, both from a fresh-context audit of my session.


  1. THERE ARE TWO THEOREMS CALLED "the separation theorem" and my retraction swapped
  them. `DivFamZar.eq_of_away_eq` (Zariski separation) HAS a widened twin, `DivFamZarAff.eq_of_away_eq`
  (DivisorFamilyAffMapAlg.lean) -- note it takes `n` as an EXPLICIT leading argument
  where the chart-typed one has it implicit, so a copied proof will not elaborate.
  `eq_of_isDivRepClassify` (DivRepClassifyZarSep.lean), the one whose docstring says
  "The separation theorem" and the one that feeds `ofPull`, has NO widened twin. Your
  route goes through the second, so state which you mean.


  2. A QUALIFICATION ON "one theorem", which I did not have when I wrote I-1262. `exists_certChartCover`''s
  conclusion produces a CHART-TYPED `CertifiedDivisorFamily` witness, and three engines
  consume it in that form with no widened analogue: `divFam_divEq_of_eps_eq_total`
  (DivSchemeMonoBridgeRel.lean), `map_window_frame_toSubmodule` (DivSchemeClassifyLocal.lean),
  `divFamEps_carve` (DivSchemeEpsCarve.lean). Your `stalkIdeal_le_span_windowGerm_of_field`
  measurement is exactly the right shape of evidence for whether they transport; if
  your two carrier-dependent inputs suffice for those three as well, say so, because
  that is what makes "one theorem" true rather than optimistic.


  Also: `divClassifyAff` is a NAMING FALSE FRIEND -- "Aff" there means affine TEST,
  not the R2 widening; it takes chart-typed `DivFam`. Easy to mis-census.


  I am not claiming fieldmono-aff and will not race you.'
