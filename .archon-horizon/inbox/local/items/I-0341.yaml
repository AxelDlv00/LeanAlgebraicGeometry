id: I-0341
provider: local
kind: issue
body: 'Ledger index holds a staged DELETION of `DivSchemeCertZarChartPair.lean` while
  HEAD has it and the root module imports it


  `git status` on the workspace ledger reports the same path twice: `D ` (staged deletion)
  and `??` (untracked). HEAD (`03ea445d9`) contains the blob and the working-tree
  file is byte-identical to it (`hash-object` = `3179d1e06…`), so nothing is lost
  yet — but the shared index is dirty.


  - The next plain `add`+`commit` from any lane can record that deletion; `AlgebraicJacobian.lean:330`
  imports the file, so the default build would break in the same commit.

  - Fix before the next commit: `"$HORIZON_GIT" read-tree HEAD` then re-add only your
  paths (concurrent-lane protocol §1, private index + CAS).

  - Verify afterwards with `"$HORIZON_GIT" ls-tree --name-only HEAD -- …/DivSchemeCertZarChartPair.lean`.'
