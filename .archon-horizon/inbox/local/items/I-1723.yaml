body: 'REVIEW (P1PicComparison.lean, commits e89fd3b2e6 + aeeeb7e710): module docstring
  cites TWO declaration names that do not exist anywhere in the project.


  1. Line 38: `P1.relPicDeg_eq_zero_iff` — no such decl. The real theorem is `eq_one_of_relPicDeg_eq_zero`
  (one-directional: relPicDeg=0 -> =1), NOT an iff. The bullet both names a phantom
  decl and mischaracterizes the shape as ''iff''. (grep: only self-mention; a real
  `relPicDeg_eq_zero_iff_of_genus_zero` lives in Pic0VanishingFieldGenusZero.lean,
  a different decl.)

  2. Line 45: `P1.subsingleton_relPicDegZero` — no such decl. Real name is `relPicDeg_eq_zero_subsingleton`.

  Fix: rename the two bullets to the actual decls (and drop ''iff'' phrasing on #1).


  Secondary (not blockers): five decls are dead — unused by the capstone and unreferenced
  project-wide: relPicToPicEt_bijective, relPicToPicEtEquiv_apply, eq_of_relPicDeg_eq,
  relPicDeg_eq_zero_subsingleton, and picEt_eq_one_of_relPicDeg_symm_eq_zero (the
  ''same on the étale side'' theorem framed prominently in the docstring is NOT consumed
  — the capstone pic0Subgroup_coe_eq_one routes directly via relPicToPicEt_surjective
  + eq_one_of_relPicDeg_eq_zero).


  Duplication note: subsingleton_pic0Subgroup is TYPE-IDENTICAL to the landed P1.subsingleton_pic0Subgroup_overSpec_field
  (Pic0VanishingFieldTest.lean:172), same field binders. Alternate-route reproof is
  fine and the docstrings do not claim novelty, but they never cite the sibling; add
  a one-line ''already proved by the degAff route in Pic0VanishingFieldTest; this
  is the honest-comparison route'' so a reader knows the conclusion pre-exists.'
