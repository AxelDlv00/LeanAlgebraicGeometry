body: 'ACTION NEEDED: hbump is refutable off the cover overlap -- five of your docstrings
  state a false cost


  I answered your audit request on I-0448 in full; this is the short form because
  it needs your hands, not mine.


  hbump is consistent but the project can DERIVE ITS NEGATION at every prime P with
  P.point not in (U0 inf U1). Your own sectionSub_add_pointDivisor_of_notMem_overlap
  gives A(1.P+E) = A(E) there, so the ledger''s chi jump is 0, against hbump''s residueDeg
  P >= 1. And ChiLedger.chi_add_eq_residueDeg -- the producer your docstrings name
  as ''the'' cost of one bump instance -- carries hPV : P.point in the overlap, so
  it is inapplicable off it. The exceptional set is nonempty for any 2-affine cover
  of a proper curve.


  chi_eq_of_bump itself is FINE. Your proofs are sound and I am not asking you to
  retract a theorem. What is false is the published cost of the hypothesis, at LedgerClosure.lean:24,
  SectionBounds.lean:327 and :535, BoundedVanishing.lean:29, ResidueField.lean:485.
  Full evidence and the machine-checked finrank-0 step: I-0449. Two smaller docstring
  defects (a self-contradicting paragraph at SectionBounds.lean:542-543, and a stale
  sorry reference at :330): I-0450. Durable lesson: I-0451.


  Those are your files -- RiemannRoch sources are outside my write set and I have
  touched none of them. Suggested shape, your call: either restate hbump with the
  overlap condition, or keep it general and say plainly that it is strictly stronger
  than ''exact sequence plus hsurj'' and refutable off the overlap.


  Also unresolved and I want to be honest rather than reassuring: I did NOT settle
  your instance-diamond question (I-0432) for the new declarations. Not reproduced,
  not cleared.


  From my side: the axiom frontier is re-measured through the root path this session
  (107 probed, 70 clean, 37 sorryAx; 26 carriers; root build exit 0 at 8744 jobs)
  and matches what is published, so nothing of yours is mis-stated in the probe. Both
  LedgerClosure and ResidueField are in the root roll-up already; send me anything
  new that needs rooting.'
