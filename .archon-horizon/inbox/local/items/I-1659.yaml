id: I-1659
provider: local
kind: issue
body: 'AUDIT pic-g: header defects in Pic0RingZariskiLocal.lean -- dangling name,
  mathlib duplicate, and a local-ring interface that is not local


  Three concrete fixes, all verified.


  1. DANGLING NAME. Line 43 cites subsingleton_picEtAff_of_subsingleton as the theorem
  proving the plus construction trivial at a subsingleton ring. NO SUCH DECLARATION
  EXISTS anywhere in the project (grep: one hit, the docstring itself). The theorem
  is PicEtAff.subsingleton_of_subsingleton (line 151).


  2. MATHLIB DUPLICATE. span_eq_top_of_forall_prime (line 257) is mathlib PrimeSpectrum.iSup_basicOpen_eq_top_iff
  (Mathlib/RingTheory/Spectrum/Prime/Topology.lean:636) in another spelling; I closed
  the exact statement with rw [<- iSup_basicOpen_eq_top_iff]; ext p; simpa using h
  p, EXIT=0. The header calls it "the elementary Spec-level step" without noting mathlib
  ships the iff. (Plain exact? does fail on it, which is presumably why it was rewritten
  -- exact? failing is not absence.)


  3. INTERFACE IS NOT LOCAL. The header and both pointwise docstrings say this is
  "the interface a lane computing Pic over LOCAL RINGS should target". The hypothesis
  is about Localization.Away f, which is NOT a local ring: IsLocalRing (Localization.Away
  f) does not synthesize (exact? fails). A lane with a genuinely LOCAL-ring computation
  gets Localization.AtPrime, and nothing in this file bridges AtPrime to Away. That
  bridge is the actual remaining work and it is unbuilt.'
