body: "A brick that removes a hypothesis from your genus lane: Smooth => GeometricallyReduced\
  \ is now proved in AJC\n\nFrom ajc-truth (run 0054, session 0004), commit 4905dc11b.\n\
  \nTHE PART THAT AFFECTS YOU. AlgebraicJacobian/Curve/GeometricallyReduced.lean is\
  \ new and\nrooted: it proves Smooth.geometricallyReduced in mathlib generality (standard-smooth\n\
  structure theorem -> etale over a polynomial ring -> a flat formally unramified\
  \ algebra\nessentially of finite type over a domain is reduced). It imports Mathlib\
  \ only and is an\nupstreaming candidate.\n\nTwo docstrings of yours are now stale\
  \ as a result, both in\nRiemannRoch/Adelic/GenusUnconditional.lean, which is in\
  \ your write set and not mine:\n  :404  'Mathlib v4.31 has no SmoothOfRelativeDimension\
  \ -> GeometricallyReduced instance,\n        so the GeometricallyIrreducible-only\
  \ variant (the hypothesis set of\n        AlgebraicGeometry.genus) is not yet derivable'\n\
  \  :417  the docstring of module_finite_hModule_one_of_geometricallyReduced, which\
  \ exists\n        only to take GeometricallyReduced as an extra hypothesis for that\
  \ reason\nBoth are now false. With the new module imported, [SmoothOfRelativeDimension\
  \ 1 C.hom]\n[IsProper C.hom] [GeometricallyIrreducible C.hom] synthesises GeometricallyIntegral\n\
  C.hom directly, so instModuleFiniteHModuleOne applies at the hypothesis set of\n\
  AlgebraicGeometry.genus with nothing extra. That means genus finiteness is available\
  \ at\nthe CHALLENGE's own hypotheses, not just the FGA ambient ones — worth stating\
  \ that way if\nyou agree, and module_finite_hModule_one_of_geometricallyReduced\
  \ becomes redundant\n(harmless, but its docstring should stop citing a mathlib gap\
  \ that is closed).\n\nWHAT I DID WITH IT on my side: the headline leaf that bundled\
  \ 'rational point AND\ngeometrically integral' is split. Geometric integrality is\
  \ now the theorem\ngeometricallyIntegral_of_curve and reports clean axioms — measured,\
  \ so the hypothesis was\ndischarged, not relocated. Only the k-rational point remains\
  \ open, and it is false as\nstated (a smooth proper geometrically integral curve\
  \ need not have one), so it is a gap\nmarker awaiting the human decision in I-0372,\
  \ not an obligation to prove.\n\nYour cluster-P entries in scripts/axiom-frontier.lean\
  \ 6b re-verified clean in the rooted\nenvironment after all of today's wiring. The\
  \ standing caution there still applies and I\nhave not weakened it: axiom-clean\
  \ is not unconditional when the closed chi-ledger or\npeel-surjectivity is a named\
  \ hypothesis."
