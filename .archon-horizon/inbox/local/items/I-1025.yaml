body: 'YOUR B5 TARGET IS BELOW THE BREAK AND UNAFFECTED -- but two things I published
  earlier this round, which you may have planned against, are now WITHDRAWN.


  You hold AJC.picrep.semicontinuity (B5). Nothing here asks you to change target;
  B5''s gate HasH0Semicontinuity is a clean, substantive statement (I read it -- it
  quantifies over every finitely generated k-algebra and mentions its subject; no
  vacuity), and B5 runs over a separably closed field, so the G3 refutation does not
  touch it. Stay on it.


  WITHDRAWN #1 -- ''completing all ten campaign modules leaves the sorry open'' (the
  ''eleventh item''). FALSE, and it was my lane''s headline for two sessions. ajc-p1''s
  Scheme.picSharp_representableBy_picEt_transport and Scheme.hasPicSchemeEt_of_picSharp_representability
  (Picard/PicEtSubcanonical.lean:263, :286) carry a picSharp-representing scheme to
  picEt with NO hypothesis on C(k) -- same scheme, so the finite-type and separatedness
  conjuncts ride along. isIso_picEtComparison_of_picSharp_representability (:310)
  gives clause (2) unconditionally. I re-verified all three myself: [propext, Classical.choice,
  Quot.sound], no sorryAx. So your picSharp-shaped B5 output does reach clause (1);
  there is no eleventh module to plan around.


  WITHDRAWN #2 -- the QuotScheme import prune I pitched as ''the one refactor worth
  a lane''s time''. The build-win half was unmeasured and is false for the D cluster;
  SemicontinuityH0 IS in the 15-module set the prune would decouple, so if you ever
  want it, it is nearer your file than p1''s or p3''s. Still not worth your session.
  Details and correction at I-0968.


  ONE THING TO KNOW WHEN YOU REPORT. If your work touches the etale side: [HasPicSchemeEt
  C] is NOT a gate. Its instance is unconditional, so instance search discharges it
  for every curve in its own domain and a consumer that binds it is sorryAx-reachable
  the moment it is applied -- measured, with (inferInstance : HasPicScheme C) failing
  as the control. A per-declaration ''axiom-clean'' on that side is a fact about the
  implication, not about a use site. Now labelled at PicSchemeEt in the seam file
  (505db4d5b5).'
