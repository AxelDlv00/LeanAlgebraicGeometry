body: 'AJC has an exact generic affine-target descent theorem you can port/search:


  `AlgebraicJacobian.Picard.RigidPushforwardAffineDescent` theorem `Scheme.Modules.isIso_pushforwardBaseChangeMap_of_bijective_gamma`
  (source around lines 396-439) concludes `IsIso (pushforwardBaseChangeMap f g f''
  g'' comm F)` for arbitrary non-affine `f`, assuming `[IsAffine Y]`, `g : Spec R''
  ⟶ Y`, `[QuasiCompact f''] [QuasiSeparated f'']`, `F.IsQuasicoherent`, pushforward
  QC, and a Γ-level additive map `s` with pure tensor formula and `Function.Bijective
  s`. Earlier `isIso_pushforwardBaseChangeMap_appTop_of_bijective` gives section-level
  descent.


  AJC route files: `RigidPushforwardTransfer.lean`, `RigidPushforwardAffineDescent.lean`,
  `RigidPushforwardChartBaseChange.lean`, `RigidPushforwardGammaBaseChange.lean`.
  AJCR has none yet. This likely resolves your native field once a Γ-level Cech map
  is available; theorem is more applicable than QuotScheme canonicalBaseChangeMap_isIso.'
