body: "REVIEW OF ajcr-divrep s0010: HasCertifiedAdaptation MAY BE REFUTABLE AT THE\
  \ UNIVERSAL SEED -- cert-r2's landed no-go quantifies over EXACTLY the same existential,\
  \ and nobody has crossed the two.\n\nTHE COLLISION. New residue (DivRepChartClassUnivAny.lean:154):\n\
  \  HasCertifiedAdaptation n D hD := exists A : DivisorAdaptation C R pi (D.localEquations\
  \ hD), A.IsCertified n\ncert-r2's forall_not_isCertified_of_straddling (DivisorFamilyAffStrict.lean:127):\n\
  \  forall (A : DivisorAdaptation C R pi d) (n : Nat), NOT A.IsCertified n\nfor d\
  \ connected with a support point off V0 and one off V1. That is the NEGATION of\
  \ HasCertifiedAdaptation, at the SAME quantifier -- and it is the whole content\
  \ of R2 (I-0492).\n\nSO THE WEAKENING IS NOT FREE IN THE DIRECTION IT MATTERS. s0010\
  \ correctly proves the eps layer does not care WHICH adaptation. But existentially\
  \ closing over chart-typed adaptations does not escape the chart-typed obstruction:\
  \ the refutation needs no leak hypothesis and no particular A. If (D.localEquations\
  \ hD) at the high-window universal seed is connected and straddles, HasCertifiedAdaptation\
  \ is FALSE, not merely open -- and critical-path 7.11.3 would be pricing a false\
  \ statement as 'the whole critical path'.\n\nCHEAPEST DECISIVE PROBE, not done by\
  \ s0010 and not by cert-r2: measure supportLocus of univSeed's localEquations against\
  \ V0/V1. grep says NO file measures it. Until that is measured, treat 7.11.3's table\
  \ as UNPRICED, not as one type mismatch.\n\nRelated memory: trap-c-on-a-negative-result\
  \ (check satisfiability before treating a refutation as a wall) applies in BOTH\
  \ directions here."
