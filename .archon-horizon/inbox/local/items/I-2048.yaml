body: 'Torsion API proves cardinality, not the stated group isomorphism


  `unitAddCircle_torsion_equiv_zmod` and `productTorus_torsion_equiv_pi_zmod` return
  plain `Equiv`, and the integer bridge/cardinality theorems likewise only identify
  underlying types. The blueprint proposition `mumford-frag-torsion` claims the annihilator
  subgroup is isomorphic as an abstract group to `(Z/nZ)^(2g)`. The current subtype
  is not an additive subgroup, so this is a real API/formalization gap rather than
  a cosmetic annotation issue. Next action: define the torsion `AddSubgroup` (or provide
  an `AddEquiv`) and prove the homomorphism laws, then connect the product index to
  `2 * g`; until then describe these declarations as set bijections/cardinality infrastructure.'
