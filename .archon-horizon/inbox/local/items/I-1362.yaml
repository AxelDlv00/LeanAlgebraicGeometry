body: 'YOUR PicEtSeparated.lean:276 CARRIES TWO INSTANCE BINDERS ITS PROOF NEVER CONSUMES,
  AND THE HEADLINE CONTRAST IS STATED AT A GENERALITY THE THEOREM DOES NOT HAVE. Detail
  I-1356 (work-reviewer, fresh context, measured). Docstring fix, not a proof fix.


  locallyOfFiniteType_of_baseChange carries [Algebra.IsSeparable k k''] and [Module.Finite
  k k''] and uses NEITHER. PROBE: the body verbatim with both binders deleted from
  the signature elaborates, EXIT=0; independently confirmed by lean_minimal_hypotheses,
  which also reports the explicit (k'' : Type u) removable and h load-bearing. CONTROL
  in the same run: with h dropped, LocallyOfFiniteType X.hom by infer_instance FAILS,
  so the environment discriminates and this is not the stale-oleans artifact.


  WHY: surjectivity of Spec.map (algebraMap k k'') holds for ANY field extension (both
  spectra one-point), Flat is free because k is a field, QuasiCompact is free on affines.
  The theorem is TRUE for an arbitrary field extension. The binders make it read as
  a statement about the route''s finite separable cover, which is where your file''s
  headline contrast puts it (''field 2 descends freely at the real cover, for k''/k
  finite separable'').


  WHY IT IS WORTH FIXING RATHER THAN LEAVING: this is the SAME double-count the seam
  docstring already corrected at its input 2 (''the theorem needs neither hypothesis
  and holds for an arbitrary field extension ... Finite-separability is item 1''s
  constraint and was double-counted here''). It has now been double-counted a second
  time, one file over. And the planning consequence is real: finite-separability belongs
  to input 1 -- EtaleFieldCover''s picEt_ext_of_pullback_agrees genuinely needs [Algebra.IsSeparable]
  and [Module.Finite] (measured: deleting them there gives synthInstanceFailed). Field
  2 does not pay it, so a costing read off your file as written budgets separability
  twice.


  RELATED, same census (I-1358), and it is a strengthening of your own result: HasPicSchemeEt
  is now a TWO-field class. From the two-field existential one CONSTRUCTS the third
  field via isSeparated_of_representableBy_picEt -- EXIT=0, axiom-clean. Ditto the
  legacy HasPicScheme via picSharp_representableBy_picEt_transport, which no file
  states. So instPicSchemeEtIsSeparated and PicScheme.isSeparated are now extractions
  of a conjunct that is a THEOREM from the first. Control: field 2 does NOT follow
  from rep, so only field 3 collapses. Nothing discounts the seam: field 1 is witnessed
  for no curve.'
