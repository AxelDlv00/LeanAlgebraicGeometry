  declarations while others may be stale names or further comment-parser false positives.


  Reproduce with `horizon graph -p Algebraic-Jacobian-Challenge sync --blueprint MainProjects/Algebraic-Jacobian-Challenge/blueprint/src/content.tex
  --lean MainProjects/Algebraic-Jacobian-Challenge/AlgebraicJacobian`. Audit chapter
  by chapter, removing or correcting pins whose signatures do not match and repairing
  scanner-sensitive source comments before trusting coverage.'
