body: 'F4 DivRepClassifyZar LANDED (backward Zar assembly)


  F4 (w4-ddr9 SS2.1 steps 1,3,5,6) LANDED, commits a5102f011 (Kit) + b1e4cae2d (Compat)
  + 9d216b142 (keystone), each private-index CAS with root = HEAD blob + only my line.
  Three files: Picard/DivRepClassifyZarKit.lean (503L), Picard/DivRepClassifyZarCompat.lean
  (420L), Picard/DivRepClassifyZar.lean (277L). All 17 public declarations axiom-clean
  [propext, Classical.choice, Quot.sound]; zero sorries; single-module lake env lean
  green per file; no new warnings.


  KEYSTONE (F6 consumes these VERBATIM): divRepClassifyZar hpi g hO hchi r1 r2 b1
  b2 S : DivFamZar C S pi g -> (overSpec k S ⟶ divSchemeOver k (s•Fbar) (M•Fbar) g
  r1 r2 b1 (b2.map (windowShiftEquiv hpi g).symm)) — noncomputable, choice-packaged.


  THE CHARACTERIZING CLAUSE (the load-bearing design decision): def IsDivRepClassify
  (F0) (v : Spec S ⟶ DivScheme!) : Prop := forall (T : Type u) [CommRing T] [Algebra
  k T] [Algebra S T] [IsScalarTower k S T] (G : CertifiedDivisorFamily C T pi g),
  (DivFam.mk G).toZar = DivFamZar.mapAlg T g F0 -> forall i j (w : PairChartRing i
  j ->a[k] T), hw1(framing of eps(DivFam.mk G).1 via b1) -> hw2(mirror .2 via b2)
  -> Spec.map(algebraMap S T) >> v >> divSchemeIota! = Spec.map w >> pairChartMap
  i j. NO localization hypothesis on T and NO fixed representative — quantifying over
  ALL tower tests and ALL certified representatives makes refinement-stability and
  representative-independence DEFINITIONAL (nothing to re-prove on a common refinement).
  Deliverables: divClassifyZar (exists-unique form), divRepClassifyZar_isDivRepClassify
  (the clause at .left — Law 1 fires it at the forward map''s pieces: T := Away (f
  t), G := mapAlg of divUniversalFamily, hG from the forward construction, framing
  from U2+G-2), divRepClassifyZar_eq_of_isDivRepClassify (ANY Over-hom whose .left
  satisfies the clause IS divRepClassifyZar F0 — Law 2''s uniqueness input; Over.OverMorphism.ext),
  isDivRepClassify_unique (scheme-level), exists_isDivRepClassify, exists_overHom_isDivRepClassify.


  REUSABLE SEAMS: (Kit) DivFam.toZar_injective; DivFamZar.exists_certified_away_rep
  (step 1 public — certified reps on canonical Away (h l) restricting F0); DivFam.mapAlg_eq_mapAlg_of_toZar_restrict
  (two reps of one Zar class agree after any common base change); DivClassifyClause
  (the divClassify exists-unique body, NAMED — definitionally equal so (divClassify
  ..).exists choose-specs assign directly); specMap_chart_overlap_tower + pullback_chartMap_compat_tower
  (the ClassifyGlobal W3 conjugation at ARBITRARY k/S-tower tests T,T'' — the landed
  proofs used no localization fact); DivClassifyClause.extend (clause transport: the
  clause fires at ANY tower test with a framing — Cover.hom_ext over pullback1 of
  the frame cover, W3 per piece; the engine both overlap lemmas and the clause proof
  run on); DivFamZar.exists_certChartCover (composite certificate x frame cover on
  CANONICAL carriers Localization.Away (num*h) — numerator trick + IsLocalization.algEquiv
  transport of the framing via map_window_frame_toSubmodule). (Compat) specMap_eq_of_divClassifyClauses,
  pullback_divClassifyClause_compat, pullback_chart_divClassifyClause_compat.


  LEAN GOTCHAS (memory-worthy): (a) do NOT letI Algebra S0 (Localization.Away x) for
  a two-level tower — mathlib''s AMBIENT OreLocalization instance (Algebra R0 R[S-inv],
  OreLocalization/Ring.lean:112) already IS the composite (algebraMap = numeratorRingHom.comp
  (algebraMap R0 R)); a letI creates an SMul diamond with OreLocalization.instSMulOfIsScalarTower
  and IsScalarTower haveIs fail with mismatched SMul fields. The towers are IsScalarTower.of_algebraMap_eq''
  rfl (S0-B-Loc, k-B-Loc) + one rw chain through IsScalarTower.algebraMap_eq for k-S0-Loc.
  (b) map_window_frame_toSubmodule / DivClassifyClause.extend applications need set_option
  maxRecDepth 8000 (divFamEps/DivFam.window defeq unfolding — the I-0239 precedent).
  (c) DivFam.mapAlg_id takes n explicitly: DivFam.mapAlg_id g F. (d) Function.Surjective.range_comp
  needs its g explicit against a sigma-reindexing lambda (higher-order unification
  fails on ?g o e). (e) universe: Fin-indexed certificate covers must be ULifted to
  Type u before span_range_num_mul_eq_top (its iota : Type u); reindex to Fin (Fintype.card
  ..) for the final statement so divSchemeOverHomMk (Fin-based) applies.


  REMAINS (not this lane): F5 (forward divRepPullAt, gated on G-4 DDR9-U closing U1/U2
  — SeedUniv 1/2+2/2 landed while this lane ran) and F6 (divRepAff Equiv + Laws +
  naturality, consumes this keystone verbatim + F5).'
