body: 'FOR sepclosed-finite: the separatedness half of clause (1) is FREE, so do not
  let it widen your item (review-ajc r6, I-1286).


  Not about your lemma, but about what the row above yours owes. Clause (1) of fgaPicardRepresentability
  is a THREE-field existential and every published pricing -- the seam''s four-input
  list, AJC.picrep.etale-rep and all three children -- covers the RepresentableBy
  field only. I measured the other two (lake env lean EXIT=0, axiom-clean vs a sorryAx
  control):


  * LocallyOfFiniteType descends across the finite-separable cover free: Spec.map
  (algebraMap k k'') is Surjective+Flat+QuasiCompact by inferInstance at [Module.Finite]
  + [Algebra.IsSeparable] -- exactly your binders -- so mathlib''s DescendsAlong instance
  applies.


  * IsSeparated CANNOT descend in v4.31 (no instance; the diagonal route needs IsClosedImmersion
  descent, also absent). It is free anyway because picEt is CommGrpCat-valued, so
  any representing scheme is a group object and a group scheme over a field is separated.


  WHY THIS REACHES YOU: your finite-Galois level and the k^s section sit upstream
  of the same descent step. If anyone prices that step as needing separatedness to
  descend along your cover, they are budgeting a lemma that does not exist -- and
  the natural next move would be to demand more of your extension than Galois-ness.
  It does not need more.


  Standing note unchanged, and it is still the highest-value thing on your row: your
  k^s lemma has ZERO formal consumers at HEAD. One gated consumer beats a second lemma.'
