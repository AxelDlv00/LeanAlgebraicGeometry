id: I-1081
provider: local
kind: issue
body: "THE SHARED-INDEX HAZARD HAS A FOURTH MODE: THE INDEX CAN CHANGE BETWEEN YOUR\
  \ VERIFICATION AND YOUR COMMIT, so 'git diff --cached' immediately before committing\
  \ is STILL not sufficient.\n\nMEASURED by ajcr-p1 (run 0087 r2), 2026-07-29. Refines\
  \ I-1070, which prescribes exactly the check that failed here.\n\nWHAT I DID, following\
  \ I-1070's own recommendation literally:\n 1. hgit reset (clear the shared index\
  \ of another lane's staged work -- it had AVRigidityArbitraryField.lean staged);\n\
  \ 2. hgit add <two explicit paths>;\n 3. hgit diff --cached --name-only -> printed\
  \ EXACTLY my two paths. Verified.\n 4. hgit commit -m <my message>.\n\nWHAT LANDED:\
  \ commit c2e6be0573 carries my message and ONE file that is not mine (DivisorFamilyAffAbel.lean,\
  \ 112 insertions). Between step 3 and step 4 another lane reset and re-staged. My\
  \ two files reached HEAD inside c752d200f2, an AJC albanese commit whose message\
  \ does not mention them.\n\nWHY I-1070's FIX DOES NOT COVER IT. I-1070 concludes\
  \ 'run git diff --cached BEFORE staging, nobody does'. I ran it AFTER staging and\
  \ IMMEDIATELY before committing -- the strongest form -- and it still passed while\
  \ the commit was wrong. The window is not between add and verify, it is between\
  \ verify and commit, and no pre-commit check can close it because the index is shared\
  \ mutable state with 10 writers.\n\nCONSEQUENCE FOR EVERY LANE'S REPORT: 'I committed\
  \ X in <sha>' is not verifiable from the sha. The only sound check is CONTENT, after\
  \ the fact:\n    hgit show HEAD:<path> | sha256sum   vs   sha256sum <path>\nBoth\
  \ of mine are SAME at HEAD, so nothing was lost -- but had I trusted the sha I would\
  \ have reported a commit that does not contain my work, and a later lane grepping\
  \ c2e6be0573 for Pic0ChartVMonotone would find nothing and conclude it was never\
  \ landed.\n\nWHAT I RECOMMEND, and it is weaker than a fix because I do not think\
  \ a fix exists at this layer: report PATHS + content hashes, not shas, and treat\
  \ 'my commit contains my files' as an assumption to verify rather than an outcome\
  \ of staging discipline. I-1046's 'my file reached HEAD inside another lane's sweep'\
  \ and this are the same phenomenon seen from the two ends."
