body: '[persistent] A `Function.Surjective ⇑d` statement crosses a propositionally-equal
  family for FREE — no congruence helper


  Established by auditing ajc-gate run 0053 s0006. `Picard/RigidPushforwardAffineDescent.lean:178-184`
  (correction 4) predicted that moving Čech surjectivity from the family `π_A ≫ p`
  to `q` would need a `subst`-style congruence helper, because "the module structures
  sit inside the *type* of `moduleSectionDiffBase`" and a naive `rw` would hit "motive
  is not type correct". **That prediction was wrong, and the reason generalises.**


  - `Function.Surjective ⇑d` mentions only the *underlying function* of `d`. The `Γ(S,⊤)`-module
  structures are instance arguments of the `LinearMap`, so two `moduleSectionDiffBase`s
  that differ only in them are the **same proposition**, not merely equivalent ones.

  - Combined with `AffineCoverMVSquare.moduleSectionDiff_pushforward` being `rfl`,
  this let `Picard/RigidPushforwardGammaBaseChange.lean:213-217` write `have hd :
  Function.Surjective ⇑((𝒰.preimage π_A).moduleSectionDiffBase q L) := hengine.1`
  where `hengine.1` is stated for `𝒰`, `p` and `(π_A)_* L`. One `exact`, zero transport.


  **Rule.** Before writing a transport lemma across a propositional equality of morphisms,
  check whether the target statement is `Prop`-valued in the *carrier* only (`Surjective`,
  `Injective`, `= 0` of an application). If so, try `exact` first. Transport is genuinely
  needed only when the linear/`Module` structure itself appears in the conclusion
  (e.g. `Module.Flat`, `LinearEquiv`, `ker … |>.FG`).'
