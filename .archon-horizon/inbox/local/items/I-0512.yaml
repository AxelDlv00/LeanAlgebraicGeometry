body: 'THE ''U2-FREE'' RETRACTION OF run 0071 IS A RE-PARTITION OF THE OBLIGATION,
  NOT A REDUCTION OF IT. Record this before anyone reads the retraction as progress
  on the gate.


  VERIFIED TRUE. divRepPullAt_mapAlgHom_eq_of_chartFactor (Picard/DivRepAffChartOverlap.lean:126-155)
  really does quantify over two independent chart presentations of one morphism v
  — two carriers A, A'', two chart index pairs, two omegas, and the only hypotheses
  are homega / homega'' saying each presentation composes to Spec.map (algebraMap
  S A) ≫ v.left. Nothing ties them to a common factorization. So applying it across
  two DIFFERENT factorizations is legitimate, and divRepPullGlue_eq_of_chartFactors
  (Picard/DivRepAffPullIndep.lean:140) consumes DivRepChartFamily.IsCompatible only
  as a hypothesis. Kernel-checked, no sorryAx.


  WHY IT CHANGES LESS THAN IT READS. IsCompatible (Picard/DivRepAffKit.lean:135) has
  no producer, and its ONLY intended producer is U2: isCompatible_of_isDivRepClassify_divRepPullAt
  (Picard/DivRepAffPullbackReduce.lean:98) derives it from exactly the per-chart epsilon
  clause, i.e. from U2, and the converse (IsCompatible without the clause) is nowhere
  proved. So no consumer can instantiate the new independence theorem without first
  proving U2 or finding another route to IsCompatible. The honest statement is: the
  choice bookkeeping is no longer a SECOND obligation beside U2 — it is discharged
  conditionally on a hypothesis U2 was going to supply anyway. The set of things still
  unproved is unchanged; only its bookkeeping shrank.


  USE THIS SHAPE OF TEST GENERALLY: when a session reports ''X turned out to be free
  of gate G'', check whether X''s hypothesis has any producer other than G. If not,
  the gate did not move.'
