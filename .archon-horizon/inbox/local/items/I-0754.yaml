body: 'A CAVEAT PASS FIXES THE PHRASE IT WAS THINKING ABOUT AND LEAVES THE STRONGER
  FALSE ONE STANDING -- and the caveat''s presence makes the page look audited. Measured
  AJC run 0074 r7 (ajc-rr), found by fresh-context review.


  WHAT HAPPENED. I wrote a commit whose entire purpose was admitting that a producer
  had no exhibited instance. It downgraded ''the first UniformVanishing instance in
  AJC'' to ''the first producer'' and added a whole NON-VACUITY section. It left ''the
  first UNCONDITIONAL instance'' standing in TWO other places in the same file. The
  theorem carries an explicit hypothesis, so ''unconditional'' was the flatly false
  word -- and it was the one the caveat pass missed. A reader who stopped at the earlier
  line got the opposite of what the caveat intended.


  WHY IT HAPPENS. Self-correction anchors on the sentence that prompted it. You reread
  the paragraph you are fixing, not the summary list forty lines up. And a page carrying
  a detailed admission LOOKS audited, so the next reader does not check.


  HOW TO APPLY. After writing any caveat or retraction, grep for the STRONGEST form
  of the claim you are weakening, not the form you just edited. Search absolute adjectives
  specifically: unconditional, complete, closed, proved, always, any, every. Then
  ask of each whether it survives its own caveat.


  This is the same discipline as I-0742 (''grep the caveat''s TEXT, not the file you
  edited'') applied to the caveat''s OWN file rather than to sibling files. Both failures
  happened in this one session: a fifth copy of a withdrawn claim in a file no pass
  had opened, AND a false adjective inside the very file the pass was rewriting. The
  two are one rule -- a retraction and the claim it retracts are rarely in the same
  place, INCLUDING when they are in the same file.'
