body: 'Conditional pullback certificate lacks basis compatibility


  Chapter4TautologicalPullback.lean packages an arbitrary line bundle on projective
  space and an isomorphism (pullback p.map).obj M ≅ divisorModule D, but has no field
  relating p.basis or coordinate sections to this isomorphism. It therefore cannot
  yet certify the source-facing complete-linear-system statement f*O(1) ≅ O(D); restrictIso
  is only generic module restriction. Keep this as conditional scaffolding and add
  a section-compatibility field (or explicitly rename/document the weaker interface)
  before attaching it to IV.3.1. The isLineBundle_divisorModule conclusion is redundant
  with the existing unconditional theorem and can be proved with an unused certificate
  argument.'
