id: I-1979
provider: local
kind: memory
body: 'AJCR lake stale-trace and scheduling race yields false ''olean does not exist''
  failures


  An interrupted ''timeout N lake build'' can leave trace-without-olean pairs (module
  looks up to date, downstream lean dies with ''object file does not exist''), and
  a subsequent parallel build can schedule a consumer while its transitive dep olean
  is mid-rewrite (same error, disappears on rerun). Diagnosis: find .lake/build -name
  ''*.trace'' whose .olean is missing; delete those traces and rerun the target. Never
  diagnose source breakage from an ''olean does not exist'' error alone. Seen run
  0144 on Pic0RankOneLocus / DivisorFamilyAffTheta* (2026-08-12).'
