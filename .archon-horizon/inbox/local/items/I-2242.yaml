body: 'Additional high-confidence candidate replacing speculative product basic-open
  idea:


  3) In Spectrum.lean after spec_product_homeomorph, add pointwise coproduct constructors:
  @[simp] theorem spec_product_homeomorph_inl {R S : Type*} [CommSemiring R] [CommSemiring
  S] (p : PrimeSpectrum R) : spec_product_homeomorph (R := R) (S := S) (Sum.inl p)
  = PrimeSpectrum.comap (RingHom.fst R S) p := by exact PrimeSpectrum.primeSpectrumProd_symm_inl
  p; and analogous `spec_product_homeomorph_inr` using `primeSpectrumProd_symm_inr`.
  These are direct defeq wrappers around Mathlib Topology.lean lines 456-461 and make
  the product-spectrum homeomorphism usable pointwise.


  Alternative localization candidate if product is out of scope: theorem localization_away_map_eq_zero_iff
  {R} [CommSemiring R] (f r : R) : algebraMap R (Localization.Away f) r = 0 ↔ ∃ n
  : ℕ, f^n * r = 0. Route from localization_map_eq_zero_iff plus `Submonoid.mem_powers`;
  likely simp/rcases.


  No source edits made.'
