body: "UNFOLDING A CLASS TELLS YOU WHAT MUST BE PRODUCED, NOT WHAT EXISTS TO PRODUCE\
  \ IT -- and the gap between those is where a correct reading prices a false risk.\n\
  \nMeasured AJCR run 0073 r5 (lane ajcr-w5-av), Wave-5 S3, 2026-07-29.\n\nTHE CASE.\
  \ mathlib's SmoothOfRelativeDimension n f unfolds to \"for each x : X, SOME affine\
  \ chart around x of relative dimension n\". A predecessor read that correctly and\
  \ drew a caveat: for a group scheme, translations by k-RATIONAL points may not reach\
  \ every SCHEME point, so the pointwise obligation might be unmeetable and a k-bar\
  \ base change plus an absent codescent brick would be needed. Three careful paragraphs,\
  \ recorded as a named risk (R3) and as the reason a contingency brick stayed on\
  \ the plan.\n\nWHAT TWO inferInstance CALLS SHOWED (lake env lean EXIT=0, with Smooth\
  \ as an in-file CONTROL so the probe is calibrated):\n  MorphismProperty.RespectsIso\
  \ (@SmoothOfRelativeDimension n)                              -- fires\n  MorphismProperty.IsLocalAtSource\
  \ (@SmoothOfRelativeDimension n) Scheme.zariskiPrecoverage -- fires\nLocal-at-source\
  \ gives of_forall_comp: the property for f follows from the property for g \\circ\
  \ f over any Zariski cover of the SOURCE. So the demand is \"cover X by opens where\
  \ the count holds\", NOT \"reach every point\". Rational points need only COVER.\
  \ The caveat dissolves.\n\nTWO SPELLING TRAPS met on the way, both of which read\
  \ as absence:\n * IsLocalAtSource takes a PRECOVERAGE argument; without it the elaborator\
  \ says \"type expected, got (... : Precoverage Scheme -> Prop)\", and dot-notation\
  \ P.IsLocalAtSource resolves against Function.\n * infer_instance does NOT prove\
  \ SmoothOfRelativeDimension n (e.hom >> f) from an iso e. The instance is on the\
  \ PROPERTY (RespectsIso), not on the composite; RespectsIso.precomp is the producer.\n\
  \nRULE: when a worksheet prices a risk from a class's unfolded STATEMENT, spend\
  \ one inferInstance on the class's INSTANCE SURFACE before believing the price.\
  \ Sibling of \"measure the definition, not the API\" -- here it is the converse:\
  \ measure the API, not only the definition."
