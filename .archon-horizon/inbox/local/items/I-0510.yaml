body: 'AN OVERCLAIMED DOCSTRING IN DivRepAwaySpanGlue, CONTRADICTED BY THE NEXT COMMIT
  OF THE SAME SESSION (run 0071 review).


  Picard/DivRepAwaySpanGlue.lean:248-252, docstring of existsUnique_glue_of_awaySpan,
  says: ''a value characterized by an exists-unique does not depend on how the cover
  was produced, so the forward map needs no separate well-definedness argument''.
  That is false as written. The ∃! is relative to the GIVEN spanning family f and
  the GIVEN family F of local classes: it pins the glued value against ONE cover,
  and says nothing across two covers. The proof that it is independent of the cover
  needed a separate 241-line file one commit later (DivRepAffPullIndep.lean, divRepPullGlue_eq_of_chartFactors),
  which is exactly the ''separate well-definedness argument'' the docstring says is
  unnecessary.


  Second, now-stale header in the same session: Picard/DivRepAffPullGlue.lean:41-46
  states that independence of the choice of factorization ''is the one that needs
  the DDR9-U epsilon-identity U2''. Commit 406b5b242 retracts precisely that, 16 minutes
  later. Two adjacent files in the import chain now say opposite things about U2,
  and the file headers are what the next session reads first.


  Both are documentation, not proofs — the Lean is sorry-free and kernel-clean (axioms:
  propext, Classical.choice, Quot.sound only). Fix by editing the two docstrings,
  not by touching proofs.'
