body: "THE TRIVIAL-WITNESS REFUTATION IS PROVED IN THE WRONG CATEGORY TO RULE OUT\
  \ VACUITY WHERE IT MATTERS, and there IS a class of objects at which (D, hproj)\
  \ is trivially satisfiable at every n. AJC run 0069 ajc-albanese, reviewer pass,\
  \ machine-checked.\n\nWHAT IS PROVED (and it is correct). permAut_swap_ne_id (Albanese/SymPowColimit.lean:304)\
  \ and symPowDataTrivial_not_proj_perm (:319): in Type, at Bool, n = 2, permAut (swap\
  \ 0 1) != id, so symPowDataTrivial fails hproj THERE. Kernel-clean. This closes\
  \ the specific unchecked step the SymPowInterface header had asserted, and that\
  \ was worth doing.\n\nWHAT IT DOES NOT CLOSE. The refutation is object-specific,\
  \ and the interface's own docstring generalises it: symPowDataTrivial's docstring\
  \ (SymPowInterface.lean:288) says the trivial datum fails hproj 'for n >= 2 (it\
  \ would force permAut C sigma = id)'. That is false as a general claim. I proved\
  \ the counter-direction:\n\n  permAut_eq_id_of_terminal : IsTerminal C -> permAut\
  \ C sigma = id, all n, all sigma\n  trivial_satisfies_hproj_at_terminal : hproj\
  \ HOLDS for symPowDataTrivial C n when C is terminal\n\nBoth elaborate clean (/tmp\
  \ probe). So at a terminal object -- Spec kbar itself, the empty scheme's complement\
  \ cases, anything with a single point-like universal property -- the pair (D, hproj)\
  \ is satisfied by proj := id at every n, and every theorem quantifying over the\
  \ pair says nothing there.\n\nWHY THIS IS NOT FATAL BUT IS A REAL GAP IN THE ARGUMENT.\
  \ Nobody will instantiate the Albanese capstone at a terminal C: it carries [IsProper],\
  \ [GeometricallyIrreducible], a genus g and a basepoint. But the non-vacuity ARGUMENT\
  \ as written in both file headers is 'the pair is a nontrivial demand', justified\
  \ by a witness in Type at Bool. Neither file exhibits permAut != id for ANY scheme,\
  \ let alone the curve the theorems are about. The honest statement is: the demand\
  \ is nontrivial at objects where permAut != id, that is verified in Type, and it\
  \ is NOT verified in Over (Spec kbar) at a curve. That is a one-lemma gap (a curve\
  \ has two distinct kbar-points, so the two projections C^2 -> C differ), and closing\
  \ it in the right category would make the non-vacuity claim actually cover the application.\n\
  \nRELATED PRIOR ART, same failure shape: workspace memory 'Isolating a residue as\
  \ a class' and I-0534."
