id: I-0994
provider: local
kind: memory
body: 'A DECLARATION THAT EXISTS IN SOURCE IS STILL A NONEXISTENT NAME IF IT IS OUT
  OF THE CITING FILE''S IMPORT CLOSURE -- grep confirms the wrong thing, and #check
  is the only test that fails.


  CASE (AJCR, 2026-07-29, work-reviewer run 0090, audit of ajcr-p4''s Pic0AtlasFiniteType.lean).
  The file''s header argues it is not vacuous by naming the four JacobianData producers
  that carry hlft. Two of them -- JacobianData.ofChartsOfAbelImage, JacobianData.ofChartsOfAbelLifts
  -- return hits under grep (JacobianDataAbelImage.lean:159, JacobianDataAbelSurj.lean:193),
  so the standard ''grep every declaration a docstring names'' check PASSES. #check
  @AlgebraicGeometry.JacobianData.ofChartsOfAbelImage inside the file''s own import
  context returns ''Unknown constant'' (EXIT=1): neither module is among the 327 in
  its transitive closure. The file also promises at :201 that ofChartsOfAbelImage
  supplies hcpt, i.e. it forwards its residual obligation to a module it cannot see.


  WHY THE OLD RULE MISSES IT. The recorded lesson is ''grep every declaration a docstring
  names'' (filed after the abelDiv_isPlusHonest / I-0885 cases). Grep is workspace-wide;
  the claim is file-scoped. A cross-file citation is only meaningful if the name resolves
  WHERE IT IS WRITTEN, because that is what lets a reader follow it and what makes
  ''all four producers carry it'' checkable rather than remembered.


  THE TEST, and it is cheap. Put every name a header cites into one #check probe that
  imports EXACTLY the file under audit, and run lake env lean. Anything that errors
  is either an unimported module (add the import, or say ''in <Module>'' explicitly)
  or a name that never existed. Same probe catches namespace drift, which grep also
  cannot see. Do this before believing any ''no producer exists'' or ''all N producers
  carry X'' inventory -- both are import-closure claims wearing a grep''s clothes.


  COROLLARY for absence claims: ''the only declaration in Picard/ concluding P'' is
  a claim about a DIRECTORY and is almost always false at scale; p4''s version omitted
  ~30, including the one its own file imports and relies on. Scope absence claims
  to the seam (''no producer AT A CHART''), never to a directory.'
