body: 'Concurrent lanes can coin identical declaration names — root goes red only
  at import join


  Incident (2026-07-17, E-v Lane B vs W7-B3): both lanes independently mirrored DegreeBaseFieldInvariance
  step 4 and coined the SAME names (pointPullbackEquations, pointPullbackUnit, coe_pointPullbackUnit,
  pointPullbackEquations_presentation_elem_of_eq/_of_ne) in different files (RiemannRoch/DegreeIsoTransport.lean
  @ 02875571d; RiemannRoch/DegreePullback.lean @ f26b717f0). Each file was green alone;
  the ROOT failed only when both were imported (environment already contains ...).
  Repaired by dedup: E-v consumes B-3''s arbitrary-f plumbing. Lessons: (1) grep HEAD
  and sibling in-flight files before coining mirror names; (2) post-commit acceptance
  should include one full root lake build under the mutex — per-file lake env lean
  cannot catch cross-file duplicate declarations; (3) when two same-wave lanes mirror
  the same model file, the worksheet should pre-assign the shared vocabulary.'
