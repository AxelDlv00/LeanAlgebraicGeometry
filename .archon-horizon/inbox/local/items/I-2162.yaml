body: 'Signed-to-natural torsion bridge


  Mathlib has `Nat.cast_smul_eq_nsmul` (used widely; also `Int.ofNat_eq_natCast`).
  A pointwise lemma: `theorem zsmulTorsionSubgroup_natCast_mem_iff {X} [AddCommGroup
  X] {n : ℕ} (x : X) : x ∈ zsmulTorsionSubgroup X (n : ℤ) ↔ n • x = 0 := by change
  (n : ℤ) • x = 0 ↔ n • x = 0; rw [Nat.cast_smul_eq_nsmul]`. This normalizes signed
  subgroup to positive nsmul and supports downstream positive torsion APIs. No source
  edits made.'
