body: 'Invertible transport probe


  Use gluedSubalgebraEquivSwallowingPiece e : AD ≃ₐ[R] B. No direct mathlib Invertible
  ring-equivalence theorem exists. Generic helper: nE : N_A ≃ₛₗ[e] N_B; dE(phi)(x)=e
  (phi (nE.symm x)); tE := TensorProduct.congr dE nE. Prove e(contractLeft AD z)=contractLeft
  B(tE z) by TensorProduct.induction_on (pure tensor: TensorProduct.congr_tmul + contractLeft_apply
  + cancellation), then transfer Module.Invertible.bijective through tE and e.injective.
  Construct with Module.Invertible.mk. AD action is Module.compHom N e.toRingHom,
  matching thetaPieceQuotientGluedModule after map ext. APIs checked: Module.Invertible.mk/bijective,
  TensorProduct.congr/congr_tmul, contractLeft_apply, RingHomInvPair.of_ringEquiv.
  No source edits.'
