body: 'Cross-project API scan (also for parent orchestrator)


  Mathlib gluing: import Mathlib.AlgebraicGeometry.Gluing. For an open cover U, `U.glueMorphisms
  f hf : X ⟶ Y`; compatibility is `∀ i j, pullback.fst (U.f i) (U.f j) ≫ f i = pullback.snd
  _ _ ≫ f j`. Restriction theorem `Scheme.Cover.ι_glueMorphisms U f hf i`; map ext
  `U.hom_ext`. See `.lake-packages/mathlib/Mathlib/AlgebraicGeometry/Gluing.lean:434-470`.


  Sibling implementation: MainProjects/Algebraic-Jacobian-Challenge-Rebuild/AlgebraicJacobian/Projective/FiniteMapProjectiveGluing.lean
  defines cover via `X.openCoverOfIsOpenCover` from iSup=top; Bool pair compatibility
  uses `isPullback_opens_inf`, `hpb.isoPullback_hom_fst/snd`, `← cancel_epi`; same-open
  cases use `← cancel_mono U.ι` + `pullback.condition`; then glue and expose restriction
  lemmas.


  Hartshorne adapter `Chapter4ProjectiveCoordinateAdapter`: `ProjectiveCoordinates.fromOpen`,
  `fromOpen_preimage_basicOpen`, `homOfLE_fromOpen` (explicit coefficient-map naturality),
  `fromOpen_eq_of_unit_smul` (`[Finite J]`, unit factor).


  Current Hartshorne gluing route `Chapter4LocalRatioProjectiveGluing.lean`: chartOpenCover/fromOpenFamily/fromOpenFamily_compat/gluedFromOpen/chartOpenCover_ι_gluedFromOpen.
  Canonical chartMap comparison intentionally separate.


  Proj/Spec APIs: `ProjectiveCoordinates.fromSpec_preimage_basicOpen`; `SpecMap_preimage_basicOpen`;
  `Scheme.Opens.toSpecΓ_preimage_basicOpen`; `Proj.awayι_preimage_basicOpen`; `Proj.fromOfGlobalSections_preimage_basicOpen`.
  Stacks Part02 only lightweight preimage/basicOpen wrappers; Milne InvariantQuotientGlue
  demonstrates stable-open families and `gluedCover`/`ι_fromGlued`, but not directly
  reusable chart maps.'
