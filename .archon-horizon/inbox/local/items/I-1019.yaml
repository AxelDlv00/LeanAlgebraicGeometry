id: I-1019
provider: local
kind: issue
body: 'FGAPicRepresentability.lean:606-621 STILL DESCRIBES picEtComparison_isIso_of_hasRationalPoint
  AS "a hypothesis class that a consumer must supply", THREE PARAGRAPHS AFTER :100
  ADMITS NO SUCH CLASS EXISTS. Read at HEAD by work-reviewer; grep --include=*.lean
  over AlgebraicJacobian/ for PicEtComparisonIso returns exactly one hit, the :100
  retraction itself -- zero declarations.


  WHAT :606-614 SAYS. "it is deliberately not given a sorry-bodied carrier of its
  own ... What

  is recorded here instead is the *shape* of the bridge, AS A HYPOTHESIS CLASS THAT
  A CONSUMER

  MUST SUPPLY EXPLICITLY AT THE USE SITE -- the same discipline HasSmoothProperQuotient
  follows

  ... so it BELONGS AT THE USE SITE RATHER THAN IN A GLOBAL INSTANCE." Then :618-619:
  "a

  consumer wanting the picSharp shape must EITHER SUPPLY THIS CLASS or be restated
  against

  picEt."


  WHAT IT ACTUALLY IS. A theorem, :622-628, body `(fgaPicardRepresentability C).2

  inferInstance`, binding [HasRationalPoint C]. There is no class here to supply.
  The

  HasSmoothProperQuotient analogy is exactly backwards: that one IS a real class with
  a real

  (vacuous, and labelled so at :910-925) field. This one is a plain theorem whose

  rational-point hypothesis is a normal instance binder, so a consumer does not "supply
  the

  class" -- it supplies [HasRationalPoint C] and the theorem fires. #print axioms
  on it is

  [propext, sorryAx, Classical.choice, Quot.sound]: it calls the line-481 sorry directly,
  which

  is the opposite of "not given a sorry-bodied carrier of its own".


  WHY IT MATTERS RATHER THAN BEING A WORDING NIT. The paragraph is the seams account
  of what

  the etale route COSTS, and it prices the cost as "one class a consumer must name".
  The real

  price is "clause (2) of the line-481 sorry". A lane reading :606-621 looks for a
  class to

  instantiate, finds none, and I-1015 records that this exact slot has already produced
  one

  round of wrong-name work (the four PicEtComparisonIso citations retracted at :100).
  This is

  the same slot failing a second time in a different way -- the names were fixed,
  the sentence

  describing the mechanism was not.


  FIX IS DOCSTRING-ONLY: say plainly that the bridge is the theorem below, that its
  hypothesis

  is the instance binder [HasRationalPoint C], and that it reports sorryAx via clause
  (2). Drop

  the HasSmoothProperQuotient parallel or state that the parallel is only "true under
  a

  section, false without", not "is a class".'
