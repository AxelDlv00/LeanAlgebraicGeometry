body: 'REMOVING ONE OF TWO SYMMETRIC HYPOTHESES CAN BE FREE, AND IT IS WORTH PROBING
  BEFORE YOU PRICE THE GENERAL STATEMENT


  Established AJC run 0083 (ajc-p1), commits 71ea0b839 / 03be5f1be, all kernel-checked
  EXIT=0 and axiom-clean.


  THE SHAPE. A project had two statements about the same comparison map: a sorried
  general one (Modules.pullbackTensorMap_isIso, QuotFunctorDef.lean:458, ''f^*(A(x)B)
  ≅ f^*A(x)f^*B'' for arbitrary A,B) and a proved one requiring BOTH factors locally
  trivial (pullbackTensorIsoOfLocallyTrivial). My consumer needed the asymmetric middle:
  an arbitrary first factor, a line bundle second. Prose everywhere treated that as
  ''the general case, so blocked on the sorry''.


  It was not. The proved two-sided base case pullbackTensorMap_isIso_of_base_unit
  works by feeding two trivialisations into a NATURALITY square, and naturality (pullbackTensorMap_natural)
  is UNCONDITIONAL. Substituting the identity morphism for the first trivialisation
  goes through verbatim — the second hypothesis was doing all the work and the first
  was doing none. That gave the one-sided theorem in ~15 lines, sorry-free, from bricks
  that already existed.


  WHY THIS GENERALISES. When a proved lemma carries two hypotheses of the same kind
  and its proof routes through a naturality/functoriality square, try replacing one
  hypothesis with an identity BEFORE pricing the general statement or the gap between
  them. The cost of the probe is one lake env lean run. The workspace''s failure mode
  is the opposite: read ''the general statement is sorried'', conclude the asymmetric
  case is blocked, and either bind the sorried leaf or build a hypothesis you did
  not need.


  SECOND HALF, equally reusable. Where the reduction does NOT close, sharpen the residual
  to an EQUATION and prove the invertibility half separately. Here both sides of the
  residual were canonically the same object via unitors, so unitorRoute_isIso proves
  the target composite is an iso with no hypothesis at all, leaving exactly one coherence
  identity. A residual stated as ''prove this equation, the IsIso half is done'' is
  a much smaller ask than ''prove this IsIso'', and it also tells the next lane what
  NOT to try — record the tactics that fail (here rfl, dsimp only; rfl, simp, aesop_cat)
  since that is the part nobody re-measures.


  Related: [[reprice-the-prescription-before-paying-it]], [[prescriptions-need-auditing-like-measurements]],
  [[goals-measure-difficulty-not-ingredients]].'
