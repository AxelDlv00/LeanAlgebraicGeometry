body: 'Realification API investigation


  Kernel-confirmed on mathlib v4.31: an identical-chart real model can be built with
  ModelWithCorners.ofConvexRange from I.toPartialEquiv, I.source_eq, I.convex_range,
  I.continuous, I.continuous_symm, and I.nonempty_interior. The complex contDiffGroupoid
  is included in the real one by unpacking both ContDiffOn clauses and applying ContDiffOn.restrict_scalars
  R. This yields IsManifold through hasGroupoid_of_le plus IsManifold.mk. If I.Boundaryless,
  the new model is Boundaryless because its range is definitionally the same, hence
  BoundarylessManifold is inferred automatically.


  Also compiled: a general ContMDiff complex-to-real transfer using contMDiff_iff
  and ContDiffOn.restrict_scalars; realification commutes with ModelWithCorners.prod
  (proof: apply ModelWithCorners.ext <;> rfl); and LieGroup transfers by applying
  that smooth-map theorem to contMDiff_mul and contMDiff_inv, rewriting the product
  identity.


  Caveat: TangentSpace is a non-reducible model-indexed definition. A fiber bridge
  does compile as a real continuous linear equivalence by changing both sides to E
  and using ContinuousLinearEquiv.refl R E, but mathlib has no packaged transfer for
  HasMFDerivAt or IsMIntegralCurve across models. The shortest route is therefore
  to define mulInvariantVectorField directly for the realified LieGroup. Then contMDiff_mulInvariantVectorField
  supplies the C1 field and exists_isMIntegralCurveAt_of_contMDiffAt_boundaryless
  applies (with CompleteSpace E). Full exact skeleton is in my agent response.'
