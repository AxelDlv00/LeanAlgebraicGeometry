body: 'Sibling scan report


  Hartshorne principal-divisor APIs: Chapter4PrincipalDivisors.lean defines principalDivisor,
  principalDivisor_mul/one/inv/div, principalDivisorAddHom, principalDivisors, mem_principalDivisors_iff.
  Chapter4PrincipalDivisorDegree.lean gives degree_principalDivisor_mul/one/inv/div/pow,
  degree_principalDivisor_eq_sum_orderZAt, principalDivisorDegreeHom (+ apply/zero/add),
  principalDivisor_eq_zero_of_orderZAt_eq_one and iff, degree_principalDivisor_eq_zero_of_orderZAt_eq_one,
  principalDivisor_globalUnit and degree...globalUnit. Chapter4DegreeClass.lean isolates
  PrincipalDivisorsHaveDegreeZero and degreeClass descent. Chapter4DivisorSheafMul.lean
  has chi_divisorSheaf_sub_principalDivisor and chi_divisorSheaf_eq_of_linearlyEquivalent.
  Chapter2Chi.lean defines Sheaf.chi and chi_congr.


  AJCR: RiemannRoch/WeilDivisor.lean defines Scheme.WeilDivisor, degree, principal,
  LinearEquivalence, and principal_degree_zero (proper smooth geometrically irreducible
  alg-closed curve). Adelic/ResidueField.lean has degree_principal_eq_zero_of_isAlgClosed_curve
  and residueDeg_eq_one reduction. SectionBounds.lean has degK_principal_eq_zero and
  degK_eq_of_linearEquivalence. ClassInvariance.lean has chi_eq_of_principal_shift
  and chi/ell/h1dim invariance under linear equivalence. Different APIs/weighted degree
  require translation. Read-only scan, no edits.'
