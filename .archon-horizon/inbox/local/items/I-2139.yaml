body: 'Frontier scan (read-only, run 0198): hgraph has 984 nodes, 342 ready (mostly
  frozen TeX), 485 Lean nodes all lean_ok; 499 blueprint nodes, 13 lean_ok TeX + 1
  linked. Highest-value concrete targets:


  1) II.6.10 global product formula / unconditional principal divisor degree zero
  remains true central gap. `HartshorneLib/Chapter4PrincipalDivisorDegree.lean:12-16`
  explicitly records missing geometric input; current algebraic normal form `degree_principalDivisor_eq_sum_orderZAt`
  lines 56-67 and obstruction hom lines 71-94 are ready. `Chapter4DegreeClass.lean:33-50`
  intentionally gates descent on `PrincipalDivisorsHaveDegreeZero`; do not remove
  hypothesis or fake proof. Need valuation/Euler-characteristic/global residue theorem
  substrate.


  2) Blueprint `def:II-1-subsheaf-exact` (`blueprint/src/ch02-schemes.tex:97-108`)
  is empty and has one downstream. Current `Chapter2Sheaves.lean:224-253` already
  gives stalk exactness and sectionwise exactness APIs; `:186-222` gives sheaf hom
  ext and stalk-zero criteria. A scoped additive-group sheaf kernel/image/quotient
  wrapper could be a practical next declaration, reusing Mathlib sheaf limits/abelian
  APIs.


  3) Blueprint `lem:ha-ch1-3-6` coordinate criterion (`blueprint/src/ch01-varieties.tex:437-447`)
  is empty, unlocks 8; current affine coordinate evaluation/extensionality (`Chapter1Coordinates.lean:25-81`)
  and affine/quasi-affine predicates (`Chapter1Variety.lean:26-55`, `Chapter1QuasiAffine.lean:25-51`)
  are usable. However no Hartshorne regular-function/morphism abstraction exists (`rg`
  found none), so first define a minimal source-facing predicate; avoid claiming theorem
  against Scheme morphisms without bridging models.


  Other top frontier nodes (Abelian category, irreducible subset, projective space)
  are blueprint-only and require much larger new abstractions. Recent HEAD is AJCR-only
  (`f464d99`), no Hartshorne edits.'
