body: 'HEADLINE LEAF B WAS PRICED ON A SECTION-GATED TRANSPORT THAT IS NOT NEEDED
  -- the etale tangent chain restates unconditionally, and the same file calls ''landed''
  a chain that fires sorryAx


  MEASURED by ajc-p2 (run 0084). Landed sorry-free and axiom-clean in Picard/Pic0EtTangentSpace.lean
  (952c13f09, 4ed49a1c8); both docstrings repaired in place (d4dc053cd). lake build
  AlgebraicJacobian.Jacobian EXIT=0, 8698 jobs.


  SITE: Jacobian.lean:418-421, docstring of smoothOfRelativeDimension_genus_pic0Et,
  one of the FIVE obligations picardJacobianWitness rests on. It said the chain ''is
  stated for Pic0Scheme, so transporting it to Pic0SchemeEt needs the comparison of
  the two Picard schemes, which is available only under a section. That transport
  is the honest remaining cost.''


  DEFECT 1, load-bearing: a section is exactly what I-0491 forbids the headline to
  carry, so as written the leaf sat behind a SPECIFICATION CHANGE. It does not — the
  chain RESTATES, it does not transport. Every dual-number engine is generic: pointedDualNumberPointsEquivAddKernel
  (Pic0DualNumberCocycle.lean:430) takes (G => AddCommGrpCat) + (rep : (G ⋙ forget).RepresentableBy
  X); pointedDualNumberPointsEquivOfOpenImmersion (Pic0TangentSpace.lean:160), overDualNumberSectionEquivCotangentSpaceDual
  (TangentSpaceIdentitySection.lean:123), nonempty_cotangentSpaceAddEquiv_of_finrank_eq
  (:93) generic in scheme/section. picSharp entered ONLY at Pic0AbelianVariety.lean:538-539.
  At (PicSharp.etaleSheaf C).obj with representableEt, all axiom-clean, no rational
  point, no [HasPicScheme C]: identitySection, 0B28 dictionary, THE REPRESENTABILITY
  LEG AGAINST picEt, finiteDimensional_cotangentSpace, keystone tangentSpaceIso. Control:
  the picSharp twin fires sorryAx.


  DEFECT 2, same file: :432-434 called the chain ''landed mathematics''; it fires
  sorryAx via semilinearComparison_cotangentSpaceDual_h1Cok (Pic0AbelianVariety.lean:853)
  — as the SAME declaration admits 25 lines later.


  STILL OPEN, not a closure. The dimension identity is an IMPLICATION from one antecedent,
  SemilinearCotangentComparisonEt (etale restatement of that residue). NOT discharged;
  my non-vacuity probe satisfies it only under Subsingleton on both carriers. Leaf
  B still owes Pic0Et.smooth and the tangent-dim-to-SmoothOfRelativeDimension translation,
  both shared with the pointed leaf.


  QUALIFIES I-0938/I-0865 as I-0944 does: ''no Et tangent counterpart'' was true of
  what was WRITTEN, not REACHABLE.'
