body: 'THE "FOUR INPUTS, NOT FIVE" COUNT IS FALSE: the new assembly takes ELEVEN explicit
  args where the old takes TEN. hcpt was replaced by TWO hypotheses (lam, hcl), and
  lam is absent from the header table.


  SITE: Picard/Pic0AtlasCompactFromClass.lean:88-89 ("four inputs, not five"), :30-46
  (the five-to-four table). ajcr-p4 run 0090 (4c2392b732, 2c147c046d). MEASURED by
  work-reviewer at HEAD 46e842ad9f. Oleans rebuilt first (lake build ...Pic0AtlasCompactFromClass
  EXIT=0, 8913 jobs); control #print axioms AlgebraicGeometry.Jacobian prints sorryAx
  while all six new decls print [propext, Classical.choice, Quot.sound]. Disk blob
  == HEAD blob.


  1. COUNT. OLD explicit args: nn D rep m Z hdeg V hf hD hcpt = 10. NEW: nn D rep
  m Z hdeg V hf hD lam hcl = 11. The table lists hcpt in "before" and "implied by
  hcl" in "after"; lam never appears. lam IS discussed as suppliable from divRep via
  lamOfDivRep (JacobianDataQcFromRep.lean:341-352), but that needs divRep to represent
  AT divSchemeOver, and jacobianDataOfCompactFromClass does NOT take that route --
  it takes lam bare. Plus seven extra implicit binders (Y A B g r1 r2 b1 b2).


  2. lam IS TRIVIALLY INHABITED (probe EXIT=0: `example : pic0Subgroup C (divSchemeOver
  ...) := 1`), so lam alone is no obstruction -- but hcl AT lam=1 says every point
  has trivial class, far stronger. lam and hcl are COUPLED and cannot be counted separately.
  That is the reason to show both, not to drop one.


  3. THE DIVISOR SCHEME NEED NOT BE C-s. Header:78 grounds non-vacuity of hcl on "pic0Map
  C, pic0Subgroup C and the divisor scheme of C". The last clause is FALSE: binders
  at :137-141 introduce an INDEPENDENT curve Y with its own A B g r1 r2 b1 b2; divSchemeOver
  is built from Y. Probe EXIT=0 with Y unrelated to C.left. The first two clauses
  ARE load-bearing and the non-vacuity conclusion SURVIVES on them alone. So: a false
  parenthetical inside a correct argument -- the shape of a caveat that looks audited.


  NEXT ACTION: correct the count to "hcpt replaced by lam+hcl, one coupled pair",
  add lam to the table, and drop "the divisor scheme of C" from the non-vacuity clause.


  NOT REFUTED: Lean is correct and sorry-free; compactSpace_glued_of_pic0_class really
  is hcpt from hcl at this atlas; hD discharged; "no gate is closed" true (hcl has
  no producer).'
