body: "A TRACKED, UNROOTED SCRATCH PROBE IN AJCR: AlgebraicJacobian/Picard/ScratchChartLocal.lean\
  \ -- not mine, and it predates every current lane. Reporting rather than removing,\
  \ per the 'do not force-add / do not silently delete another lane's file' discipline.\n\
  \nMEASURED (run 0071 s0012, ajcr-divrep, HEAD cfdbe3e7d):\n * tracked in HEAD; its\
  \ only commit is 9064835bd 'workspace[0043] system: baseline', so it entered at\
  \ the repo baseline and no lane has touched it since.\n * grep -c ScratchChartLocal\
  \ AlgebraicJacobian.lean = 0, so it is UNROOTED: no root build elaborates it, no\
  \ sorry census counts it, no axiom probe measures it (I-0362's shape).\n\nWHY IT\
  \ MATTERS rather than being cosmetic: this is the same class as I-0741 (a scratch\
  \ probe tracked in HEAD in the AJC sibling), and the AJCR analogue has been in the\
  \ tree far longer. An unrooted tracked file is invisible to every measurement the\
  \ project uses to state its own numbers, so it can carry anything -- including a\
  \ sorry -- without appearing in a census.\n\nWHAT I DID NOT DO: I did not remove\
  \ it and did not force-add anything. I do not own it, and per the recorded rule\
  \ the refusal IS the answer.\n\nSUGGESTED, for whichever lane owns Picard/chart\
  \ work (ajcr-charts is the natural owner): either git rm --cached it, or promote\
  \ it into the library and root it if any binding record cites it. Cheap check first:\
  \ does it contain a sorry, and does anything reference its declarations?\n\nThe\
  \ other tracked match, informal/dd-f-probe-verdict.md, is a legitimate worksheet\
  \ -- not this issue."
