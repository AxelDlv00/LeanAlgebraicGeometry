body: "RELEASE ajcr-p3: AJCR...divrep.abel-widened -- LANDED, not a gate closure.\
  \ Owner cleared, pinned 850624c64c. One pricing of mine is REFUTED; do not inherit\
  \ it.\n\nDO NOT REDO -- Picard/DivisorFamilyAffAbel.lean, rooted at AlgebraicJacobian.lean:627.\
  \ 10 declarations, sorry-free, ALL axiom-clean [propext, Classical.choice, Quot.sound]\
  \ vs a control firing sorryAx; lake build EXIT=0 (8958 jobs). Census, non-vacuity\
  \ and hdegAff's load-bearing status CONFIRMED by fresh-context audit (I-1098/I-1099/I-1100).\
  \ Commits eb72ffe94c / 9f57a2b326 / 93259ae1ae (middle content also rode c2e6be0573,\
  \ another lane's sweep).\n * abelDivAffPlus + _mapAlgHom -- unit . relPicMk . DivFamZarAff.picClass,\
  \ naturality in the test algebra;\n * abelDivAffPlus_toAff -- agreement with the\
  \ chart-typed hook, so this EXTENDS the Abel layer along divFunctorToAff rather\
  \ than forking it (NOT rfl -- plain rfl fails on a type mismatch);\n * abelDivAff'\
  \ / picEtMap_abelDivAff' -- widened Abel value at arbitrary tests + naturality;\n\
  \ * chartValueAff / picEtMap_chartValueAff / chartValueAff_mem_pic0Subgroup -- the\
  \ degree-zero twist, FREE (sigmaFamily/thetaFamily are cover-blind Cech classes);\n\
  \ * degAt_abelDivAff'_toAff -- hdegAff's inhabitation witness. 8 of 10 are pi-FREE.\n\
  \nTHE GAP FILLED. DivFamZarAff (mandated by I-0492) had picClass, divFunctorAff,\
  \ divFunctorToAff -- and ZERO declarations reaching PicEtAff/picEt/relPic/pic0.\
  \ So the DD-R halves pointed at different functors: abelSigmaChart (Pic0AtlasFromDivRep.lean:205)\
  \ consumes a CHART-TYPED representation, while isCertified_affine_and_not_isCertified_chart\
  \ puts a straddling divisor beyond chart-typed reach.\n\nREFUTED PRICING OF MINE:\
  \ I called the widened degree ledger OBSTRUCTED because deg_presentationDivisor_eq_finrank_glued\
  \ cites relCover_sup with cover0/cover1. FALSE (I-1098, re-derived by me): those\
  \ lines OUTPUT only 'every point lies in some piece', carried on the widened side\
  \ as the FIELD AffCoverData.cover (exists_mem_pieces, DivisorFamilyAffCover.lean:166).\
  \ DO NOT open a 'recover the pinned pair' front.\n\nRESIDUE: port four lemmas from\
  \ DivisorFamilyFieldDegree.lean (:144, :308, :217, :282), each quantifying ONLY\
  \ over A.index/pieces/eqn/colength/ovlColength/Glued -- all carried verbatim by\
  \ AffAdaptation, none mentioning m0/m1/h0/h1/partitions/charts. Real work, NOT blocked;\
  \ it drops hdegAff.\n\nCORRECTED: rep is NOT an antecedent of pic0RepresentableByOfCharts\
  \ (f, hf, IsLocallySurjective); it is an argument of abelSigmaChart and mixedParamRepresentableBy.\
  \ rep stays UNDISCHARGED."
