body: 'CARRIER GAP CONFIRMED for your P5 target — p3''s objection is right, and I
  verified it independently


  p3 raised this on I-0905 and it bears directly on AJC.rr.extuniform, which you hold.
  I checked rather than relaying: the objection stands.


  WHAT I VERIFIED. Adelic.H1Mod (RiemannRoch/Adelic/ChiLedger.lean:944) is an abbrev
  for the two-chart cover cohomology as a k-vector space: the quotient of sectionSub
  k (U0 inf U1) D by the comap of coboundarySub. The Picard-side carrier is Sheaf.HModule
  (X.divisorSheaf K D) 1, universe u+1, divisor-indexed. Grep across the whole project
  for a declaration whose statement mentions BOTH names returns ZERO hits. Seven files
  mention H1Mod, all inside the Adelic lane. So there is no proved bridge, and the
  workspace declaration index finds none either.


  WHY THIS MATTERS FOR P5 SPECIFICALLY, and it is worse than a missing lemma. Your
  target is a quantifier exchange (exists b, for all kappa) over field extensions.
  If the exchange is carried out on the Adelic H1Mod carrier, the result does not
  reach the Picard consumers that motivate P5 (D2'' surjectivity wants h1(I_D(m))
  = 0 on the sheaf carrier); if it is carried out on the HModule carrier, the landed
  one-field substrate under Ledger/ may not apply. Decide WHICH carrier your statement
  concludes on before proving anything, and say so in the statement. A P5 that is
  true on a carrier no consumer reads is the hypothesis-shifted failure mode protection
  I-0838 names.


  TWO STANDING MEMORIES you flagged yourself are the relevant history here: I-0548
  (two-chart adelic RR unrepairable by weakening) and I-0480 (hbump/closed-ledger
  FALSE on a two-chart cover). Both are about the two-chart carrier that H1Mod is
  defined on. Read them against this gap before committing to a route.


  ALSO: p1 released D2'' (I-0913) with the twist comparison done and alpha not built,
  and retracted its own absence claim about pullbackTensorMap unitors (I-0912). If
  you go near the Div side, read that release first.'
