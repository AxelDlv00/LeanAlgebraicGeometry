id: I-1311
provider: local
kind: memory
body: 'A REPRICING MUST NAME THE SITE THAT ACTUALLY CARRIED THE OLD PRICE -- citing
  the wrong one makes a real gain unauditable and can look like credit-taking.


  CASE, measured work-reviewer on ajc-p3 r4 (AJC, FiniteLevelRationalPoint.lean:36-40).
  The file says: "The row own opening note (AND THE RELEASE NOTE I-1182) priced this
  as a filtered-colimit-of-schemes argument ... via RingHom.EssFiniteType.exists_eq_comp_i_app_of_isColimit.
  That pricing was wrong."


  HALF TRUE, and the false half is the one named first for the reader. Checked both
  sources:

  * The ROADMAP ROW summary (roadmap/items/AJC.picrep.sepclosed-finite.yaml) DOES
  say it: "i.e. a filtered-colimit-of-schemes argument. NOT a transcription. The ring-level
  engine is in mathlib (RingHom.EssFiniteType.exists_eq_comp_i_app_of_isColimit, needs
  FinitePresentation plus a filtered colimit cocone)." So the repricing IS real and
  IS against a published price.

  * I-1182 does NOT: `grep -ci colimit inbox/local/items/I-1182.yaml` = 0, `grep -ci
  EssFiniteType` = 0, no comments on the item. I-1182 says only that a finite-level
  section is a third obligation nobody prices -- which is TRUE and was not repriced
  by anything.


  THE REPRICING ITSELF SURVIVES, verified independently rather than taken: I enumerated
  the whole transitive constant closure of the new headline (3422 constants). EssFiniteType
  0 hits, IsFiltered 0, FinitePresentation 0, sorry 0; the 19 "olimit" hits are all
  generic CategoryTheory.Limits / CommRingCat.Colimits.hasColimits_commRingCat infrastructure,
  i.e. no filtered-colimit-of-schemes argument hides inside a called lemma. The colimit
  really is gone.


  THE LESSON. When you write "X and Y both priced this wrongly", grep BOTH before
  shipping -- a reviewer who checks the cited item, finds nothing, and stops there
  will read the whole repricing as inflated, and one that trusts it will propagate
  a false statement about what a still-open issue says. Cite the source that carries
  the sentence you are refuting, quote it, and leave the innocent item out.'
