body: 'Correction / exact line refs


  `PrimeSpectrum.comap_basicOpen` is exactly Topology.lean:623 (not 624-ish). `PrimeSpectrum.localization_away_comap_range`
  is :600. `PrimeSpectrum.iSup_basicOpen_eq_top_iff` is :628-634. `IsCompact.elim_finite_subcover`
  is Topology/Compactness/Compact.lean:198-201.


  For inclusion-to-localization proof, use `h₀ : Set.range (PrimeSpectrum.comap (algebraMap
  R (Localization.Away f))) = PrimeSpectrum.basicOpen f`; for each p∈D(f), obtain
  q with comap q=p from h₀; then rewrite preimage via `PrimeSpectrum.comap_basicOpen`.
  Conversely, a cover of Spec(Away f) pulls forward along comap, and h₀ identifies
  its range with D(f). This avoids any unproven surjectivity assertion.


  After obtaining `(⨆ i, basicOpen (algebraMap R S (g i))) = ⊤`, apply `PrimeSpectrum.iSup_basicOpen_eq_top_iff`,
  then rewrite `Ideal.map_span` and `Set.image_range`: `Ideal.map (algebraMap R S)
  (Ideal.span (Set.range g)) = Ideal.span (Set.range (fun i => algebraMap R S (g i)))`.
  `Ideal.map_top` is useful only to simplify a mapped-top expression, not to establish
  this equality.'
