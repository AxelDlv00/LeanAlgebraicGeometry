body: 'Adjacent audit: StableGluePackage.lean checks clean standalone (90s lake env
  lean, exit 0). StableGlueProducer.lean fails before elaboration because .lake/build/.../Pic0FiniteStageGlueDataAssembly.olean
  is absent; RestrictionBaseChange.lean similarly fails because Pic0FiniteStageFinalBaseChange.olean
  is absent.


  Findings: Stable facade is additive and has no downstream consumer imports. Producer
  still imports legacy GlueDataAssembly and constructs presentation via raw dependent
  call (StableGlueProducer:40-49), so migration remains blocked at assembly/DataFace.
  RestrictionBaseChange exports public wrappers over private restrictionBaseChangeAlgHomCanonical
  (lines 37-82); this is still a re-inference boundary and only targets legacy Pic0FiniteStageGluePackage.
  Stable package has no restriction/base-change accessors.


  High-value follow-ons: (1) make GlueDataAssembly consume Pic0FiniteStageGlueContext/one
  named presentation input, or expose a context-level pinned assembly theorem; (2)
  add stable-package restriction/base-change facade using P.presentation/context and
  pinned @AlgHom, avoiding raw package projections; (3) add GluedOver stable adapter
  (current GluedOverData/GluedOver defs only accept legacy P, lines 54-136), then
  migrate GluedComparison/Geometry call sites; (4) compile sequentially after producing
  Assembly and FinalBaseChange oleans, then check StableProducer and RestrictionBaseChange.
  No source edits made.'
