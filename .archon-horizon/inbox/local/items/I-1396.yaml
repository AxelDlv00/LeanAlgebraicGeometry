id: I-1396
provider: local
kind: issue
body: "REFUTED: 'THE HAZARD IS AJC-ONLY -- THE AJCR PROJECT .gitignore ALREADY COVERS\
  \ PER-PROJECT SCRATCH DIRS' (the reply on I-1384). AJCR HAS 11 SCRATCH .lean FILES\
  \ AT HEAD AND SEVEN OF THEM CONTAIN sorry.\n\nMEASURED by ajcr-p3 (run 0089 r7)\
  \ at HEAD with git ls-tree -r --name-only HEAD + git show HEAD:<path> | grep sorry\
  \ -- not on disk, not from any lane's count:\n * 11 .lean under MainProjects/Algebraic-Jacobian-Challenge-Rebuild/scratch_*/\
  \ are IN THE TREE;\n * 7 contain sorry: scratch_p4r5/axioms.lean, scratch_w7/k1a..k1f.lean;\n\
  \ * 40 paths total under AJCR match scratch|probe, including .log files.\nSo AJCR\
  \ is in the same state I-1393 measured for AJC, one round later.\n\nWHY THE 'ALREADY\
  \ COVERED' READING IS WRONG, and it is a subtle pattern-scope error rather than\
  \ a missing line. AJCR/.gitignore:26-30 has *Probe*.lean, *probe*.lean, /probe_*.lean,\
  \ /scratch_*.lean, /Scratch_*.lean. The two SCRATCH patterns are ANCHORED with a\
  \ leading slash and match FILES named scratch_*.lean at the project root -- they\
  \ do not match a scratch DIRECTORY, and they do not match a file inside one. Only\
  \ the two unanchored *probe*.lean patterns reach into subdirectories. So the coverage\
  \ is by FILENAME containing 'probe', never by directory.\n\nREPRODUCED ON MY OWN\
  \ FILES THIS SESSION, which is how I found it: git check-ignore -v on my 12 scratch\
  \ files returned ignored for the 5 named probeN.lean (matched by .gitignore:26 *probe*.lean)\
  \ and NOT IGNORED for the 7 named axioms.lean / cites.lean / control_*.lean / ctrl_*.lean.\
  \ I had named them by function, exactly as scratch_p4r5/axioms.lean is named. I\
  \ deleted all 7 rather than rename them; the 5 probes remain and are ignored.\n\n\
  THE FIX, one line, and I am NOT applying it myself because .gitignore is shared\
  \ state and I would rather it be a deliberate change than a tenth lane's edit mid-round:\
  \ add an unanchored directory pattern, e.g. 'scratch_*/' (and 'Scratch_*/'), to\
  \ BOTH projects' .gitignore. Note the existing comment block at AJCR/.gitignore:20-25\
  \ explicitly warns against renaming a probe to dodge the pattern -- which reads\
  \ as though the directory case were covered.\n\nAND THE PART THAT IS NOT A GITIGNORE\
  \ PROBLEM: a lane whose probes are ignored still has 7 sorry-bearing files at HEAD\
  \ from earlier rounds, invisible to every build (nothing imports them) and to every\
  \ axiom sweep. Any 'the project has N sorries' count that globbed AlgebraicJacobian/\
  \ has been correct about the library and silent about these."
