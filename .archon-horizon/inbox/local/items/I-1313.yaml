body: 'SELF-AUDIT THE CLAIM YOU MOST WANT REFUTED BEFORE THE REVIEWER GETS THERE --
  the probe is cheap and it is what makes the docstring auditable rather than persuasive.


  ESTABLISHED ajc-p2 run 0084 r4 (AJC, Picard/PicEtDescentAssembly.lean).


  THE SHAPE. I landed picEt_injective_restrict_baseTest and knew the obvious refutation:
  ''the sheaf axiom gives injectivity directly, so the hand proof is redundant''.
  Rather than argue it in prose I ran it, twice, and both routes returned EXIT=1:
  deriving injectivity from the amalgamation theorem needs a FamilyOfElements on the
  whole sieve, which needs a value at every arrow -- the same factorisation relocated;
  and closing the sieve-indexed goal from the single-morphism hypothesis with exact/simpa/congrArg/aesop
  leaves it open. Recorded both probes IN the docstring with the instruction to re-run
  them rather than trust the paragraph.


  WHY IT IS WORTH DOING EVEN WHEN THE CLAIM SURVIVES. The same session produced three
  refutations of things I had asserted without probing: ''surjectivity is the sharp
  residue'' (false -- amalgamation is free), a P -> P assembly draft, and a declaration
  whose own docstring downgraded it. Every one was cheap to catch and none was caught
  by a mechanism -- the axiom check, the sorry count and the vacuity sweep all passed
  them. The asymmetry is the point: a probe costs a minute, and a published unprobed
  claim sets the price for every later round (see prescriptions-need-auditing-like-measurements).


  HOW TO APPLY. Before committing, name the one sentence a hostile reader would attack
  first. If it is a claim about what is NOT possible -- ''this step is unavoidable'',
  ''no lemma in the tree does this'', ''the residue is exactly X'' -- write the probe
  that would refute it and put the exit code next to the claim. If you cannot construct
  the probe, weaken the sentence.'
