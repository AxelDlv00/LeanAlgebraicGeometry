body: 'ThetaTrivData REPAIRS THE INDEX BUT THE WIDENED THETA LAYER HAS ZERO CONSUMERS,
  AND ITS ONLY PRODUCER SITS AT a=0 -- whose non-degeneracy citation is to the CHART-TYPED
  carrier


  work-reviewer, AJCR read-only vacuity audit of the chart/certificate seam. Measured
  at HEAD on disk; oleans for the five probed modules confirmed newer than sources
  first. No whole-tree lake build.


  SITES: Picard/DivisorFamilyAffThetaTyping.lean:99 (ThetaTrivData), :302 (thetaTrivDataZero),
  :343 (separation); Picard/DivisorFamilyAffTheta.lean:658.


  SOUND: ThetaTrivData is NON-VACUOUS. All four fields quantify over the curve, the
  pieces and relThetaSections; none is a nonemptiness assertion. The separation (inhabited
  where ChartTyping is IsEmpty) is a genuine index repair.


  THREE MEASUREMENTS THE FILE UNDERSTATES:

  (1) grep ''^import .*DivisorFamilyAffThetaTyping'' over all modules: ZERO hits;
  rooted only at AlgebraicJacobian.lean:346. Its 11 re-indexed declarations (trivEval,
  trivGluedEval, trivGluedSubmodule, ker_trivGluedEval, ...) have zero use sites outside
  the defining file. Same for the layer re-indexed: AffAdaptation.ThetaGlued / thetaGluedEval
  / ker_thetaGluedEval have zero consumers outside AffTheta.lean and this file. The
  vacuity moved from ''empty index'' to ''inhabited index nobody consumes'' -- only
  the second passes an emptiness sweep.

  (2) :299 defends a=0 as ''the exponent DivisorAdaptation.divisorDatum runs at (thetaIdealUnit_zero,
  DivisorDatumInverse.lean:207)''. That declaration exists at that line but is stated
  on DivisorAdaptation, the CHART-TYPED carrier. grep ''AffAdaptation.*divisorDatum|divisorDatumAff'':
  ZERO hits. No widened divisorDatum exists, so the citation does not reach AffAdaptation.

  (3) The consuming eps/window route pins a = windowM_choice pi hpi g (AffFraming.lean:93;
  WindowLedger.lean:186 = Nat.find of M*delta >= b+2g+(g+2)(s+1)*delta, 1<=delta at
  :125), so a>0 for g,s>=1. CAVEAT ON MY OWN CLAIM: no lower bound on windowM_choice
  is stated (grep returns none), so this is a read of windowM_exists, NOT an elaborated
  probe.


  OWED: produce ThetaTrivData at a = windowM_choice (a Pic condition per piece, correctly
  priced not-free at :64), or state that the widened theta layer is parked. Do not
  read the a=0 producer as evidence it is live.'
