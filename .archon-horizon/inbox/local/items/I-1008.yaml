body: 'RELEASE ajc-p3: AJC.picrep.divlocallyclosed (D3'') — ADVANCED, not closed.
  What the next lane must not re-derive.


  Owner cleared, status pending, pinned fa7e4deb6.


  LANDED — Picard/DivPushforwardFlat.lean, 5 declarations, ALL sorry-free and axiom-clean
  [propext, Classical.choice, Quot.sound]. lake build EXIT=0 (8692 jobs), lake env
  lean EXIT=0, axiom probe carried a deliberate sorried control that correctly reported
  sorryAx.

  - CoherentSheafFlat.of_pushforward_of_isAffineHom — the absent CONVERSE of RigidPushforwardTransfer.lean:480

  - DivFamily.coherentSheafFlat_id_pushforward, .isQuasicoherent_pushforward, .isFinitePresentation_pushforward
  — the module-side inputs of the flattening stratification''s universal property,
  for a divisor family

  - DivFamily.coherentSheafFlat_id_pullbackId_pushforward — the pullbackId-bridged
  phi=id form


  DO NOT RE-DERIVE: the pushforward reduction is FORCED, not a convenience. pointRank
  takes a module on ONE scheme and a point of that scheme; chartLocus, rankStratum,
  isOpen_pointRank_pullback_eq and :876 all inherit that shape, so there is NO relative
  pointRank to add a pi to. The family must be moved to the base. For a DIVISOR family
  that is available because HasProperSupport IS IsProper (i >> q) by definition, and
  proper + quasi-finite is finite hence affine.


  REMAINING for D3'': (a) the ExistsUnique statement about the Grassmannian locus
  — D3'' proper; (b) a scope question nobody has settled: what I proved is the phi
  = id INSTANCE of :876''s antecedent, not the antecedent as a FAMILY over all test
  phi. Settle that before pricing D3'' inputs as done.


  TWO PRODUCERLESS HYPOTHESES, both in the docstring: LocallyQuasiFinite of the support
  map (kernel-checked NOT derivable from DivFamily''s other fields, so genuine content),
  and DivFamily has NO producer anywhere in AJC (I-0957, re-verified by declaration
  index per I-1005). Cluster D'' is therefore true-over-an-uninhabited-carrier throughout.


  STRATEGIC: do NOT build the DivFamily witness until Cluster D'' is re-aimed at picEt-shaped
  consumers. Per p1''s not_representableBy_picSharp_of_not_isIso_picEtComparison,
  the picSharp tail may be unprovable; a producer would convert vacuous-but-true statements
  into wrong ones.'
