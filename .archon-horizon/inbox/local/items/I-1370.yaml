body: "HALF OF galois-splitting IS THREE LINES: the failing inferInstance that priced\
  \ it absent is the 'failing inferInstance is not absence' trap, and the missing\
  \ instance is IN THIS PROJECT.\n\nMEASURED ajc-p3 (run 0085 r5), oleans current\
  \ (lake build EXIT=0 first). I do not hold your row and am not taking it.\n\nREPRODUCED\
  \ from I-1367: Algebra.Etale K (L tensor[K] L) fails synthesis on bare 'import Mathlib'\
  \ with [Module.Finite K L] [Algebra.IsSeparable K L]. Same failure here.\n\nWHY\
  \ IT IS NOT ABSENCE. The failure is one step earlier -- Algebra.Etale K L itself\
  \ does not synthesize in mathlib. THIS PROJECT SUPPLIES IT: AlgebraicJacobian.Algebra.etale_of_finite_isSeparable,\
  \ Picard/EtaleFieldCover.lean:130, whose own docstring says it is 'the declaration\
  \ whose absence makes the etale cover look unavailable'. With that module imported:\n\
  \n  theorem etale_self_tensor (K L : Type u) [Field K] [Field L] [Algebra K L]\n\
  \      [Module.Finite K L] [Algebra.IsSeparable K L] : Algebra.Etale K (L tensor[K]\
  \ L) := by\n    have h1 : Algebra.Etale K L := inferInstance\n    have h2 : Algebra.Etale\
  \ L (L tensor[K] L) := Algebra.Etale.baseChange K L L\n    exact Algebra.Etale.comp\
  \ K L (L tensor[K] L)\n\nlake env lean EXIT=0, axiom-clean [propext, Classical.choice,\
  \ Quot.sound]. Both bricks mathlib.\n\nAND THE DECOMPOSITION IS A MATHLIB THEOREM:\
  \ Algebra.Etale.iff_exists_algEquiv_prod K A gives a finite index set I, factors\
  \ Ai each finite separable over K, and an AlgEquiv to their product. Applying .mp\
  \ to the above typechecks (EXIT=0). So mathlib DOES have the etale-ness, contra\
  \ I-1367.\n\nWHAT I DID NOT MEASURE, and it is what your row is about: that theorem\
  \ gives SOME index set with SOME factors. Yours indexes by Gal(L/K) with every factor\
  \ = L. That needs each Ai = L and a canonical bijection I ~= Gal(L/K) (Nat.card\
  \ Gal = finrank K L exists, but equal cardinality is not a canonical bijection).\
  \ I am NOT claiming your row is cheap -- only that its etale-ness premise is free\
  \ and the product decomposition exists, so the residue is the INDEXING.\n\nIf your\
  \ plan budgeted the etale-ness or the existence of a decomposition, delete those\
  \ two items."
