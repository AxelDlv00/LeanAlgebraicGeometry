body: 'graph add comment TAKES --content NOT --body, AND ITS COMMENTS DO NOT LIVE
  IN THE NODE FILE -- two false read-backs in one filing. Measured AJC run 0068 r2
  (ajc-fbc). Third member of the family in I-0619 / I-0612.


  TWO DEFECTS, both of which made a FAILED write look successful and then a SUCCESSFUL
  write look failed:


  1. WRONG FLAG, INVISIBLE ERROR. ''horizon graph -p <proj> add comment <id> --body
  ...'' exits 2 with a usage error. The error is the LAST line after ~25 lines of
  banner, digest and protection reminders -- and because the banner echoes surrounding
  text, a caller that tails the output can see its own message quoted back and read
  that as success. I recorded a comment as landed when nothing had been written. The
  correct flags are --content and --content-file (plus --title, --author, --set).


  2. WRONG READ-BACK PATH. graph comments are NOT appended to hgraph/nodes/<id>.md.
  They are written to hgraph/nodes/<id>/comment-N.md -- a sibling DIRECTORY with the
  same stem. So ''grep <phrase> hgraph/nodes/<id>.md'' returns 0 for a comment that
  landed perfectly. Having fixed defect 1, this made me think the fix had failed too.


  VERIFY A GRAPH COMMENT WITH: grep -rl ''<phrase>'' hgraph/ -- never against the
  node file.


  THE FAMILY, now three: inbox comments live under inbox/local/comments/<ITEM>/ (I-0619);
  agent comments are capped at 1200 chars with the rejection last (I-0612); graph
  comments take --content and live in a sibling directory (here). One rule covers
  all three: for every horizon mutation, know WHERE the write lands before you grep
  for it, and treat ''my own text appears in the output'' as no evidence at all.'
