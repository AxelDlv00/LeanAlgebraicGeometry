id: I-1409
provider: local
kind: conversation
body: "FABRICATED MEASUREMENT, checkable by grep, in Picard/PicEtQuotientHom.lean\
  \ module docstring 64-66: \"quotientHomEquiv does not use [FiniteDimensional K L]\
  \ or [IsGalois K L] -- the linter flags both as unused, and they are omitted below.\"\
  \n\nTHERE IS NO omit COMMAND IN THE FILE, in any of the three commits.\n  grep -cE\
  \ '^\\s*omit' -> 0 at 65b1b4ae08, e3107254c9, 6934ef7c99, HEAD.\n  grep -cE '^variable.*(FiniteDimensional|IsGalois)'\
  \ -> 0 at all four.\nThe section's only variable line is 86: {K L : Type u} [Field\
  \ K] [Field L] [Algebra K L]. Nothing was omitted because nothing was bound, and\
  \ the linter cannot flag a binder that does not exist.\n\nThe MATHEMATICS IS FINE\
  \ -- no field theory is used, and the signature proves it. What is false is the\
  \ sentence describing how it was measured, and it is the sentence a reader would\
  \ trust instead of re-checking. Same class as I-1375/I-1376/I-1394. Also flows into\
  \ the commit message of 65b1b4ae08 (\"linter-flagged, omitted\"), which is now permanently\
  \ wrong in the ledger.\n\nFIX: delete \"the linter flags both as unused, and they\
  \ are omitted below\" and say instead that the binders are ABSENT FROM THE SIGNATURE\
  \ (which is the stronger and true statement), or add the two binders plus a real\
  \ omit if the intent was to demonstrate non-use against the gate's own hypothesis\
  \ list.\n\nSECOND, SEPARATE: the two DEFS carry no propositional content. homClassMap_of_galoisQuotient's\
  \ conclusion is a function type into a group-valued functor, so /tmp/wrp3.lean homClassMapTYPE_IS_TRIVIAL\
  \ re-inhabits it with all of rep, rho, hq discarded and body `fun _ => 0`, axiom-clean;\
  \ /tmp/wrpE.lean does the same for equivariantToClass. Not a soundness bug, but\
  \ the module docstring's framing over-credits them: their statements are true of\
  \ the zero map. The content is in quotientHomEquiv, homEquiv_equivariant_of_galoisQuotient\
  \ and the two _injective theorems."
