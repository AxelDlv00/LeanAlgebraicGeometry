body: 'W5-T4: THE T2-ENGINE/COMPARISON COMPOSITION STILL HAS A THIRD GAP


  Reviewer pass, run 0073 r3 (ajcr-w5-av), fresh context.


  map_twoChartClassHom (Tangent/TwoChartNaturality.lean:181) is naturality of twoChartClassHom
  -- the map BEFORE the quotient. The T2 engine''s reduction is TwoCover.unitsReduction
  (Tangent/TruncExpCechH1.lean:133), a map between Cech H1 QUOTIENTS. Three things
  are still missing before the two compose, and none is in the tree:


  1. Naturality of the DESCENDED twoChartClass (TwoChartCechPic.lean:428). That needs
  Function.Surjective sel at BOTH ends (sel and sel . f.base) plus the statement that
  pullbackOverlapUnit maps cechCoboundaryUnits into cechCoboundaryUnits. The claim
  ''no Function.Surjective sel'' is true of the hom-level lemma and does not carry
  to the quotient level the engine works at.


  2. That Over.dualNumberSectionsUnits (DualNumberCarrier.lean:195) carries cechCoboundaryUnits
  (mapRingHom res0) (mapRingHom res1) ONTO cechCoboundaryUnits res0 res1 at the thickened
  charts. resHom_dualNumberSections makes this provable but nobody proved it, so the
  two H1 carriers are still only abstractly isomorphic -- exactly the I-0571 shape.


  3. A typing/transport seam: pullbackOverlapUnit is typed at f^-1 V0 (inf) f^-1 V1
  via le_rfl; relSectionsMap is typed at (fst C (overSpec k R)).left ^-1 W with le_of_eq
  relCurveMap_preimage.symm. Also nothing produces the Bool-indexed V : Bool -> Opens
  plus selector from relCover, and nothing identifies (C (whisker) overDualNumberZero).left
  with relCurveMap C k[eps] k, nor overSpec k k with the monoidal unit Over.mk (id)
  that overDualNumberZero''s source is. relSectionsMap_dualNumberSections is stated
  for relCurveMap, the CechPic side for (C (whisker) g).left.


  Consequence: (b-coeff) is a real statement about relSectionsMap, but it is NOT yet
  the coefficient half of the twoChartClass/unitsReduction square. Do not price the
  intertwining at zero.'
