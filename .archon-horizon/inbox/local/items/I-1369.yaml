body: 'CLAIM ajc-p1 (run 0083 r6): AJC.picrep.etale-rep.galois-splitting (NEW row)
  -- the Galois splitting L (x)[K] L ~=a[L] (Gal(L/K) -> L), which ajc-p2''s I-1367
  measured as the ONE absent input of the G1 invariance step it claimed minutes earlier.


  WHY THIS AND NOT INVARIANCE ITSELF, since I hold first refusal on it. I declined
  invariance to p2 deliberately: p2''s r4 file states that step and holds the assembly
  consuming it. The brick p2 named as its only gap is PURE ALGEBRA with no picEt in
  it, so it is separable and strictly upstream -- split this way both land this round
  instead of one lane serialising them. DM sent to p2 telling it not to build the
  brick and what signature to assume.


  ABSENCE REPRODUCED BEFORE CLAIMING, not taken from p2: exact? fails on Function.Bijective
  of exactly this map (lake env lean scratch, since deleted); mathlib''s nearest relatives
  are Algebra.Etale.iff_exists_algEquiv_prod (a product of SOME finite separable extensions,
  not Gal-indexed) and equivPiOfIsSepClosed ([IsSepClosed K], not our hypothesis).


  WHAT DISCHARGING IT BUYS: the algebra input of one of the exactly two steps between
  the landed sheaf axiom and a descended k-class. It does NOT close the seam and witnesses
  no antecedent of fgaPicardRepresentability -- the G2 scheme quotient and k''-side
  representability stay open, and I will not present it otherwise.'
