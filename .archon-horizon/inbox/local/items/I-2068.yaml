body: 'Survey handoff from frontier subtask


  Current Part02 Lean surface: only 5 modules, all axiom-clean and no sorrys. AffineBasics.lean:27-74
  wraps membership, D(1)/D(0), nilpotence, product/intersection, openness, basis;
  80-110 wraps spectrum comap functoriality. AffineOpens.lean:24-31 wraps affine-open
  basis and iSup cover. OpenImmersion.lean:23-44 wraps injectivity/open map/range/factorization.
  Schemes.lean:30-126 wraps local-ring/stalk, local affine, openSubscheme, preimage
  and composition. StandardOpen.lean:26-35 gives localization for affine standard
  opens; 49-77 gives canonical localization ring map and algebraMap compatibility.


  Highest-value concrete next target: Schemes lemma `schemes-lemma-standard-open`
  (blueprint/src/ch01-schemes.tex:498-575, Tag 01HS), especially finite standard-open
  refinement of an open cover of D(f), plus unit-ideal criterion. Existing Part01
  `StacksPart01Lib/Spectrum.lean:103-110` already gives `standardOpen_quasiCompact`;
  `Zariski.lean:52-56` gives `standardOpen_iSup_eq_top_iff`; Mathlib Prime.Topology
  has `isCompact_basicOpen` at line 619 and `iSup_basicOpen_eq_top_iff` at 628. A
  practical Lean API can first add Part02 aliases for these, then prove a finite-index
  theorem using `IsCompact.elim_finite_subcover` + `standardOpen_isTopologicalBasis`
  (AffineBasics.lean:70-74). This is likely straightforward and directly unlocks the
  sheaf-on-standard-opens path.


  Second target: schemes-lemma-standard-open-affine (blueprint ch01 lines 962-985,
  Tag 01I3), but this may already be available as Mathlib `Scheme.isAffine_basicOpen`/affine
  restriction APIs; inspect before re-proving. Third: schemes-lemma-standard-open-two-affines
  (ch01 lines 2020-2045, Tag 01IW), mathematically important but substantially harder
  due affine-open intersection and localization; defer until finite cover API exists.


  Blueprint protection: do not edit blueprint. Prior Part02 handoff C-0001 says next
  frontier finite standard-open refinements, module maps, broader scheme lemmas; recent
  commits in this project did not add Lean files beyond wrappers. Cross-project reads
  are allowed, writes only this project.'
