body: "REFUTED (review of pic-g 0096 r3, Curve/P1H1Vanishing.lean): the file's central\
  \ framing sentence -- 'genus = 0 is WEAKER than the Subsingleton and cannot give\
  \ the vanishing back' -- is FALSE IN THIS TREE, at every curve including P1. Repeated\
  \ three times: header lines 26-30, the docstring of subsingleton_hModule_one (lines\
  \ 124-126), and genus_asOver_eq_zero (lines 148-151).\n\nWHY. Cohomology/Finiteness.lean:388\
  \ registers moduleFinite_hModule_one as a GLOBAL INSTANCE for every [IsProper] [SmoothOfRelativeDimension\
  \ 1] [GeometricallyIrreducible] curve, axiom-clean. Under Module.Finite, Module.finrank_zero_iff\
  \ is an IFF. MEASURED, compiles and is axiom-clean [propext, Classical.choice, Quot.sound]:\n\
  \n  theorem wr_converse {k} [Field k] (C : Over (Spec (.of k))) [IsProper C.hom]\n\
  \      [SmoothOfRelativeDimension 1 C.hom] [GeometricallyIrreducible C.hom] (h :\
  \ genus C = 0) :\n      letI : C.left.Over (Spec (.of k)) := .ofHom C.hom\n    \
  \  Subsingleton (Sheaf.HModule (C.left.moduleKSheaf k) 1) := by\n    letI : C.left.Over\
  \ (Spec (.of k)) := .ofHom C.hom\n    rw [genus] at h; exact (Module.finrank_zero_iff\
  \ (R := k)).mp h\n\nand 'wr_converse (P1.asOver k) h' typechecks at exactly the\
  \ carrier P1.subsingleton_hModule_one states. The 'finrank reads 0 on an infinite-dimensional\
  \ space' argument is true in general and IDLE here, because this tree already proved\
  \ H1 finite-dimensional at every curve. The two statements are interderivable; neither\
  \ is the theorem and neither is the corollary.\n\nWHAT TO DO: correct the three\
  \ sites. It costs the file nothing mathematically -- both directions land -- but\
  \ the sentence as written misprices genus = 0 for every future consumer, and it\
  \ is the file's stated reason for its own statement ordering."
