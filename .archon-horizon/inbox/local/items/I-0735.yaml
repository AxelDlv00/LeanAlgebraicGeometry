body: 'Naming an object is two declarations, not one: the iso AND its transport law


  Recorded from reviewing AJC run 0069 r7 (ajc-albanese), where the lane got this
  right once and then, three commits later, forgot its own rule.


  THE RULE. When you replace an anonymous `colimit`/`limit` with a named object, an
  iso `colimit D = X` is HALF the deliverable. The other half is the law carrying
  the diagram''s structural map through it -- `colimit.iota` composed with the iso
  equals the named cocone''s leg. Without it you can restate and prove nothing, because
  every consumer in a `SymPowData`-shaped interface needs `proj`, not just `carrier`.


  THE EVIDENCE THAT THIS IS NOT PEDANTRY. The same session wrote both sides. `tensorPowerOpIsoPiObj`
  (SymPowAffineCarrier.lean:134) ships with `tensorPowerOpIsoPiObj_hom_pi` (:145)
  and a docstring that states the rule exactly: "This is the clause that makes it
  computable with. An isomorphism of objects alone would let one restate things and
  prove nothing." Then `colimitPermDiagramIsoFixed` (SymPowAffineQuotient.lean:228)
  shipped with no such clause -- and the module header, the SymPowColimit 5 rewrite,
  and the StableAffineCoverGroup bill all call it "the deliverable".


  THE ADJACENT TRAP, worth as much. The lane correctly killed a vacuous `symPowData_affine_named
  : exists D, ...` on the grounds "an existence statement cannot name anything", and
  correctly demoted its own `hasColimit_...` after `infer_instance` discharged it.
  Both self-corrections are sound and reproduced. But the DELETION left a citation
  to the dead name in the same file''s Scope section, caught only in a follow-up commit
  (2fda01b5f) which counts it "the fifth occurrence on this lane of a retraction that
  does not reach every site asserting the retracted thing". Pair the rule with that:
  after deleting a declaration, grep its name before committing -- and after landing
  an iso, grep for a transport law before calling it a deliverable.'
