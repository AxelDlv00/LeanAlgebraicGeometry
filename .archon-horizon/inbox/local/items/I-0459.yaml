id: I-0459
provider: local
kind: issue
body: 'Roadmap row AJC.jacobian.reachability publishes the pre-session probe counts
  (107/70/37 and 185 modules); the tree is at 111/71/40 and 186


  Found by the janitor hygiene pass of run 0054 s0010. The row is `done` and owned
  by `ajc-truth`, so I am reporting rather than rewriting another lane measurement
  prose.


  THE DRIFT, four numbers in `.archon-horizon/roadmap/items/AJC.jacobian.reachability.yaml`:


  - line 38-39: "107 declarations, 70 clean and 37 carrying sorryAx (the two new alg-closed
  lines take it to 109 probed)". The probe now holds **111** `#print axioms` commands
  (111 unique targets, counted mechanically), and `README.md:66` / `TO_USER.md:21`
  both publish **111 declarations, 71 clean, 40 sorryAx**, re-measured 2026-07-28.
  So the roadmap row is the only artifact still on the old numbers, and it states
  109 as a projection where the docs state 111 as a measurement.

  - line 11: "EVERY MODULE ON DISK IS ROOTED at AlgebraicJacobian.lean -- 185 of 185
  as of 2026-07-28, no exceptions". Measured this pass by transitive closure of the
  `import AlgebraicJacobian*` graph from the root: **186 modules on disk, 185 reachable,
  one unrooted** -- `AlgebraicJacobian.RiemannRoch.Adelic.ChiUnconditional` (mtime
  03:44, untracked by git). Per the rows own rule this is CORRECT while the module
  is uncommitted ("a module not yet committed to the ledger must NOT be rooted"),
  so the defect is only that the row asserts "no exceptions" as a standing fact. The
  grace period ends at the commit, and nothing will warn then.

  - line 42-43: "98 modules reachable from the headline of 185 on disk" -- the 185
  half has the same drift.


  WHAT IS CONFIRMED AND NEEDS NO CHANGE: **26 sorry carriers**. Re-derived this pass
  with the rows own command against a green warm build -- `lake build AlgebraicJacobian
  2>&1 | grep "declaration uses" | sort -u | wc -l` returns exactly 26, exit 0.


  WHY IT MATTERS RATHER THAN BEING BOOKKEEPING: this row is the projects designated
  place for the frontier count (`I-0439` corollary tells memory items to point HERE
  instead of carrying a number, and `I-0381` does exactly that). A stale value in
  the row that the memory items defer to defeats the whole arrangement. `I-0445` is
  the standing rule -- publish the command with the count and state the measurement
  status when the command has not just been run.'
