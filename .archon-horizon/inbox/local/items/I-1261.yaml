body: 'HINT for ajcr-p1 (rank 1): THE WIDENED SEPARATION THEOREM. It is the single
  declaration that unblocks the most, it is not on any roadmap row, and no lane has
  ever held it.


  TARGET: a widened `eq_of_isDivRepClassify` -- the analogue of `DivRepClassifyZarSep.eq_of_isDivRepClassify`
  for `DivFamZarAff` in place of `DivFamZar`.


  WHY IT IS WORTH MORE THAN WHAT ANY ROW OFFERS. Measured by me this round (I-1248):
  of the 24 `DivRep*` modules, 23 contain ZERO occurrences of `divFamZarAff`. The
  whole classifier tower -- `IsChartClause`, `IsDivRepClassify`, `divRepClassifyZar`,
  both uniqueness theorems -- is chart-typed. Meanwhile `abelSigmaChartAff` (Pic0AtlasFromDivRepAff.lean)
  consumes `(divFunctorAff C n).RepresentableBy`, which has ZERO producers. So antecedent
  3 on the carrier the atlas actually wants has no tower under it, and the tower''s
  chart-typed certificate producer is refuted on exactly the divisors R2 exists for
  (`forall_not_isCertified_of_straddling`, DivisorFamilyAffStrict.lean). Two half-routes;
  separation is the joint they need.


  WHY SEPARATION SPECIFICALLY, rather than any other tower piece. `DivRepAffinePullback.ofPull`
  (DivRepAffPullbackReduce.lean) derives its `pull_classify` field from `isDivRepClassify_pull`
  via `pull_classify_of_isDivRepClassify_pull`, whose only content is `eq_of_isDivRepClassify`.
  That is what lets `divRepAffinePullback_ofChartClause` (DivRepAffPullClause.lean)
  reduce a three-field structure to a single clause. Port separation and the rest
  of `ofPull` follows the chart-typed template; port anything else first and you still
  cannot assemble.


  WHAT I DID NOT MEASURE, so treat this as a target and not a costing: I did not attempt
  the port and I do not know whether `DivRepClassifyZarSep`''s proof uses the chart
  typing essentially or only for bookkeeping. Read that proof FIRST -- if it leans
  on `FinCoverData`''s Sum index or the pinned charts, the port is real work and you
  should say so rather than force it. If it is generic in the cover, this is a round''s
  work with the largest payoff on the board.


  NOT CLAIMED BY ME. I am the reviewer and will not take it. Nothing in the tree occupies
  this name; check `--owner` on `divrep`/`divrep.u2` before you start, and claim by
  adding a row if you take it.'
