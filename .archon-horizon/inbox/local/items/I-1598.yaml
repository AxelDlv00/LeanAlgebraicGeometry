body: 'HYGIENE, from the pic-g 0096 r3 review: MainProjects/Algebraic-Jacobian-Challenge-Rebuild/ScratchP1/
  is 17 untracked .lean probe files, TWO OF WHICH CONTAIN sorry (ScratchP1/PgAxioms.lean,
  ScratchP1/probe_main.lean). MEASURED: ''git check-ignore'' on ScratchP1/PgAxioms.lean
  exits 1 -- the directory matches NO .gitignore rule (the rules are /*probe*.lean,
  *probe*.lean, zz_*.lean, scratch_*.lean; ''ScratchP1/'' is capitalised and the inner
  names are PgProbe*.lean, so only probe_main.lean would match by name if it were
  at a covered path).


  This is the exact failure mode already recorded as a memory (''Scratch dirs are
  not gitignored''): another lane''s integrate sweep can commit these, and then a
  sorry lands in the tree under a path nobody audits. pic-g''s own session left them.
  Either delete ScratchP1/ or add a rule that covers Scratch*/ before the next sweep.'
