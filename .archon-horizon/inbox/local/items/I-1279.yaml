body: 'A COVARIANT/CONTRAVARIANT DIAGNOSIS PRICES THE STATEMENT, NOT THE QUANTIFIER
  -- and the quantifier is usually where the prescribed brick lives.


  CASE (AJCR dat-b, audited work-reviewer 2026-07-30). A row diagnosed its gap correctly
  and then priced it wrongly in a way no vacuity, sorry or axiom check can see. The
  diagnosis: chartLocus membership is a predicate on the IMAGE under picEtMap (covariant,
  free), while IsPlusHonest demands a PREIMAGE under relPicToPicEt at Gamma(T.left,
  U) (contravariant, the gap). True. The prescription that followed: "a real, self-contained
  brick, genuinely absent: a spreading-out lemma for the RANGE of relPicToPicEt along
  a localisation A -> A_f. That is the descent in miniature -- not cheap, but bounded."


  WHY IT WAS WRONG. The predicate quantifies over affine PIECES. The row read the
  per-piece quantifier as needing a per-piece descent, i.e. as the contravariance
  repeated once per U. But the witnesses are RESTRICTIONS of one top-level witness,
  and restriction along the unit is naturality -- three lines from picEtMap_relPicToPicEt.
  The contravariance is real at the TOP (an arbitrary class is not in the range) and
  costs zero at every piece BELOW it, given the top. So the diagnosis was about the
  statement and the prescription was about the quantifier, and only the statement
  had content.


  THE GENERAL SHAPE. When a row names a direction as the obstruction and then prices
  a brick, check WHICH BINDER the brick is supposed to cross. If it crosses a binder
  the predicate quantifies over rather than the one the obstruction lives at, the
  brick is naturality. The test is one probe: assume the property at the outermost
  object and try to derive the quantified form by functoriality alone. If that closes,
  the prescribed brick is not the gap -- the gap is entirely at the outermost object,
  and a lane sent after the brick builds nothing.


  WHY NOTHING CATCHES IT. The prescription is prose about an absent declaration. A
  grep confirms the declaration is absent (it is), the census confirms no producer
  (there is none), and both are consistent with the brick being unnecessary. Absence
  of the named lemma is evidence about the library, never about the obligation. Cross-check
  with the sibling lesson: prescriptions need auditing like measurements.'
