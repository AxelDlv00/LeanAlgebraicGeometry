body: "THE \"ONE INPUT STILL OPEN\" IS CLOSED: I proved the finite-presentation theorem\
  \ in scratch, sorry-free and axiom-clean, in one sitting. The docstring priced it\
  \ as remaining work.\n\nMEASURED by work-reviewer (run 0085, audit of 729fea00c..daf7aa700).\
  \ lake env lean EXIT=0; #print axioms with a deliberate sorried CONTROL that correctly\
  \ reported sorryAx, so the clean line is not silence.\n\nWHAT I PROVED (scratch\
  \ only, repo untouched): for x : Scheme.DivFamily pi T with [IsProper pi], [IsLocallyNoetherian\
  \ T.left] and the SAME LocallyQuasiFinite binder the file already carries,\n  ((Scheme.Modules.pushforward\
  \ (pullback.snd pi T.hom)).obj x.F).IsFinitePresentation\ndepends on axioms [propext,\
  \ Classical.choice, Quot.sound]. That is the third of the three inputs the docstring\
  \ (DivPushforwardFlat.lean:82-105) calls open.\n\nTHE MISSING STEP WAS ONE LEMMA\
  \ APPLICATION, NOT PLUMBING. The docstring says the residue is \"that these sections\
  \ are Ab-valued and carrying Module.Finite across them needs the semilinearity plumbing\
  \ spelled out\". The semilinearity is mathlib`s Scheme.Modules.Hom.app_smul (Modules/Sheaf.lean:123),\
  \ and this project already wraps exactly it as Scheme.Modules.appₗ (DivFunctorDef.lean:405-411).\
  \ Two facts made the transport immediate:\n* Gamma(q_* F, V) = Gamma(F, q inv V)\
  \ by rfl, and Gamma(i_* N, q inv V) = Gamma(N, (i>>q) inv V) by rfl -- both verified.\n\
  * the native Gamma(T,V)-action on Gamma(q_* F, V) IS compHom along q.app V: r .\
  \ y = (q.app V).hom r . y by rfl -- verified.\nSo the whole step is: apply Hom.app_smul\
  \ to hdesc.inv at the AMBIENT ring scalar (q.app V).hom r, then Module.Finite.of_surjective\
  \ along hdesc.inv`s section map, surjectivity from hdesc.hom_inv_id via Hom.comp_app.\n\
  \nWHAT WAS RIGHT in the docstring: legs 1 and 2 and the trans do elaborate as described\
  \ (IsFinite.finite_app, finite_sections_preimage_of_isAffineHom + isFinitePresentation_pullback_schematicSupportι,\
  \ Module.Finite.trans with IsScalarTower.of_algebraMap_smul). The tower description\
  \ is accurate. Only its RESIDUE was mispriced.\n\nACTION: land it. Note it needs\
  \ [IsProper pi] (for isQuasicoherent_pushforward) and [IsLocallyNoetherian T.left]\
  \ (for isFinitePresentation_of_finite_sections) -- neither is in coherentSheafFlat_id_pushforward`s\
  \ binders today."
