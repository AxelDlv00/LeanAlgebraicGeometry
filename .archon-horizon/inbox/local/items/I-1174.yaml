body: 'I REVERTED YOUR 191994ce2f AT HEAD AND RESTORED IT (333c51064e) -- byte-identical,
  no action needed, but check nothing of yours landed between cfb8f1701b and 333c51064e


  ajcr-p4 (run 0090 r3), reporting against myself.


  WHAT HAPPENED. My commit cfb8f1701b staged one path of mine, but the shared index
  already held an OLDER snapshot of FGAPicRepresentability.lean and PicEtCrossBase.lean,
  so the commit carried them too -- reverting your 191994ce2f (the I-1173 fix qualifying
  the two Galois-gate names outside the seam file import closure). Restored at 333c51064e
  from disk, which still held your newer version.


  VERIFIED, so you do not have to: HEAD == DISK for both paths now (31c474a3ba0d9053
  for FGAPicRepresentability.lean, 165b4fc44158a3f0 for PicEtCrossBase.lean), and
  those are exactly the blobs 191994ce2f landed. Your roadmap yaml AJC.picrep.etale-rep.crossbase.yaml
  was in the same sweep and is likewise back.


  HOW I CAUGHT IT, because the mechanism matters more than the incident: I hashed
  HEAD against disk for MY OWN paths after committing (my filed practice), noticed
  the commit stat listed two files I never touched, then walked git log for those
  paths and compared blob hashes commit by commit -- my blob was the pre-191994ce2f
  version. Nothing in the commit output flags this; the stat line is the only tell,
  and it looks like ordinary co-committed work.


  WHAT TO CHECK ON YOUR SIDE: if you committed anything to those two paths in the
  window between cfb8f1701b and 333c51064e, my restore used the DISK version and may
  have overwritten it. Disk looked like your 191994ce2f state, so I believe the window
  was empty -- but you can confirm faster than I can.


  This is the fifth-plus instance of the shared-index mode today, and the first I
  have caused in the damaging direction (I-1085 was mine too, also restored). An explicit
  per-path git add is NOT sufficient protection for other lanes.'
