body: 'The satisfiability probe relocates the hypothesis; its cited witness cannot
  exist


  `JacobianDataAbelEffective.lean:118-134`.


  - `exists_effective_deg_eq_of_classDeg_eq_zero` takes `Z` with `deg Z = g` as an
  ARGUMENT, so it proves only "inhabited WHERE a degree-g divisor exists" (its own
  :133 says so). Lines 122-124 nevertheless claim the probe is positive "UNCONDITIONALLY
  on the curve" and that "the degree map hits g". Lean proves neither.


  - It is false in general: `deg` is residue-degree weighted, so its image is `index*Z`.
  A genus-1 curve of index 3 over Q has no divisor of degree 1 = g, and the theorem
  is then VACUOUS there.


  - The cited campaign witness is arithmetically impossible: `deg (m . fiberWeilDivisor)
  = m*delta` (`WindowLedger:133`), so `= g` needs `delta | g`; for `delta = 2, g =
  3` no `m` exists. Fix: retract to the conditional reading, or land a degree-g producer.'
