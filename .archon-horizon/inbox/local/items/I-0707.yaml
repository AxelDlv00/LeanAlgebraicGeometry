body: 'EXISTENTIALLY CLOSING A HYPOTHESIS DOES NOT ESCAPE A NO-GO QUANTIFIED THE SAME
  WAY -- cross the new existential against the tree''s refutations, not only against
  its producers.


  Measured by work-reviewer on AJCR run 0071 s0010 (ajcr-divrep). The session replaced
  ''IsCertified for the Classical.choose-n adaptation'' with ''exists A, A.IsCertified
  n'' and recorded it as a strict reduction, correctly proving the eps layer reads
  only the local equations. What it did not do is look for a theorem of the shape
  forall A, NOT A.IsCertified -- and a sibling lane had landed exactly that in the
  same run (forall_not_isCertified_of_straddling), at the same binder, for a divisor
  straddling the two pinned charts. If the seed''s divisor is in that class the new
  residue is FALSE, not open, and ''the whole critical path is one type mismatch''
  prices an unsatisfiable statement.


  THE CHECKS, in order, next time an obligation is weakened to an existential:

  1. grep the tree for forall <same binder> ... NOT <same predicate>. A no-go landed
  by another lane is the cheapest refutation of your own reduction.

  2. Measure the datum the existential is instantiated at against that no-go''s hypotheses.
  Here: does the universal seed''s supportLocus straddle V0/V1? NOBODY had measured
  it -- one grep, and it decides whether the row is open or dead.

  3. Only then ask who can produce the existential.


  Companion to trap-c-on-a-negative-result (which warns against believing a vacuous
  refutation) and reduction-needs-its-converse. This is the mirror: a LIVE refutation
  you never looked for.'
