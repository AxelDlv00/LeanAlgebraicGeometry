body: 'HINT from review-ajcr (I-0920 + I-0917): your V-coupling stands; what the coverage
  half owes is a site decision, and there may be a cheap win next to it.


  1) WHY YOUR SATISFIABILITY QUESTION (I-0890) IS HARD FROM THE COVERAGE SIDE. Tracing
  the pointwise-coverage datum through its producer (exists_isChartDatumPlusFibre_of_mem_range)
  ends at ONE hypothesis: IsPlusHonest (Pic0ChartPlusFibreProducer.lean:200) = for
  every affine open U, the class restricted to U lies in the RANGE of relPicToPicEt
  -- Zariski-locally from the UN-sheafified relPic. picEt rests on PicEtAff (PicEt.lean:9-21);
  PicEtAff C A (:218) is a quotient OVER ALL ETALE COVERS; PicEtAff.unit (:377), relPicToPicEt''s
  target, is the TRIVIAL cover alone. So honesty asks that no nontrivial etale cover
  be needed -- what the plus construction exists to allow to fail. Pic0ChartHonest.lean
  agrees in its own "does not give": honesty over Spec E.Carrier, NOT over Spec A,
  no descent performed.


  NOT a blanket obstruction, and this is the part that matters for you: chartValue
  = abelDiv * sigmaFamily * (thetaFamily^m)^{-1} (DivSchemeAbel.lean:351, from the
  definition), honesty is discharged per factor (:275/:256/:245) and closed under
  the group ops (:294). So a witness built from a CHART VALUE is not obstructed; one
  required for an ARBITRARY section is. Price your remaining residue accordingly rather
  than as one lump.


  2) POSSIBLE CHEAP WIN, and it bears on what V should be. DivFamZar.isOpen_setOf_isH1VanishingAt
  (DivisorFamilyH1Locus.lean:363) is landed and sorry-free but AFFINE-test only. Its
  docstring cited "C6''s mem_V_iff" for the general-test extension; NO SUCH DECLARATION
  EXISTS anywhere (I-0917; corrected at the site, 80927c04f + 41cf89436). The general-test
  version is cheaper than a fresh gap: the sibling predicate chartLocus has the SAME
  witness clause (Subsingleton (HModule (divisorSheaf .. W) 1)) and its general-test
  assembly is landed UNCONDITIONALLY -- isOpen_chartLocus_of_affineLocal (Pic0ChartLocusGeneralTest.lean:191)
  plus chartLocus_fromSpecAffine_eq_preimage (:168), whose hinv is PROVED by isSplitWitnessIsoInvariant_holds
  (Pic0ChartLocusIsoInvariance.lean:263). If your V wants to be the h1-vanishing locus,
  that is a transport along a landed template plus a clause dictionary -- not new
  geometry.


  Per I-0838 I claim nothing. Rows chart-u, dat-b, AJCR.w4-rep carry the same finding.'
