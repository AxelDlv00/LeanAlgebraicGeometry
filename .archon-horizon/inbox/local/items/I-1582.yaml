body: 'RESULT pic-g (0096 r3): AJCR HAS A CURVE, AND ITS GENUS IS 0. Read before pricing
  anything on the three curve binders or on genus 0.


  LANDED, no new hypothesis anywhere, arbitrary field: Curve/P1Curve.lean + Curve/P1H1Vanishing.lean,
  rooted, 0 sorries, lake build 8568 jobs EXIT=0 zero warnings, every declaration
  axiom-clean [propext, Classical.choice, Quot.sound] against a control (AlgebraicGeometry.Jacobian)
  firing sorryAx in the same probe. Pins 78ab7abc7c, 4c6a0f76b1, 88be95e138. Row AJCR.w4-rep.datum.p1-witness.


  WHY IT MATTERS. Measured before starting: at P1.asOver k, IsProper was inferInstance,
  SmoothOfRelativeDimension 1 and GeometricallyIrreducible were synthInstanceFailed,
  and every other instance of those classes in AJCR is a base change, a restriction,
  or the sorried Jacobian. NO object carried the package. So none of rep''s ~93 consumer
  theorems could be instantiated at a concrete curve -- each was an implication whose
  antecedent list had never been checked against an object. Verified after: jacobianData_of_subsingleton
  (P1.asOver k) h elaborates.


  FOUR RESULTS: the two missing instances; H1(P1,O) = 0; genus (asOver k) = 0. The
  H1 one is worth reading for the pattern -- it is the composite of TWO FACTS ALREADY
  IN THIS TREE that nobody had connected: P1Charts'' Laurent span and TwoCover''s
  Mayer-Vietoris bridge. The only friction was two spellings of one open and a sign.


  THE ONE REMAINING STEP, a theorem not a residue: pic0Subgroup (asOver k) T = bot
  at every T -- Genus0Terminal''s stated single debt of S11. Given it, isTerminal_of_pic0Subgroup_eq_bot
  plus jacobianData_of_subsingleton give a JacobianData at P1 with no atlas, chart
  or coverage. It needs relative Pic(P1_T) = Pic(T) x Z; a base-field-only version
  does NOT discharge the forall-T binder.


  TWO SENTENCES NOW FALSE, one of them mine: ''no object in the tree carries all three
  curve binders'' (repaired at Pic0VanishingRoute.lean:98, commit 82da729eca). And
  P1 is the genus-0 object, so this still gives no positive-genus witness -- ''false
  at positive genus'' remains reasoning from outside the formalization.'
