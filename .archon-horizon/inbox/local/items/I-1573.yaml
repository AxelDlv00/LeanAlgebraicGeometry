body: 'Pic0VanishingRoute''s PRODUCER CENSUS IS FALSE, AND THE HEADLINE IS AT THE
  WRONG LEVEL.


  Pic0VanishingRoute.lean:11-14 names seven producers of JacobianData C and says all
  consume the same chart family. MEASURED (grep every declaration whose type is JacobianData
  C in AlgebraicJacobian/):


  (1) THE LIST OMITS SEVEN MORE producers: JacobianData.ofRepresentableBy (JacobianDataCharts.lean:71),
  ofAbelLifts (JacobianDataAbelSurj.lean:149), ofChartsOfAbelLifts (:193), ofPic0ClassSurjective
  (JacobianDataQcFromRep.lean:394), PicRepDatum.toJacobianData (JacobianDataFromPicRepDatum.lean:83),
  toJacobianDataOfAbelLifts (:132), JacobianData.baseChange (JacobianDataBaseChange.lean:59).


  (2) TWO NAMED MEMBERS TAKE NO CHART FAMILY. ofAbelImage (JacobianDataAbelImage.lean:119)
  takes an arbitrary J plus an arbitrary (pic0TypeFunctor C).RepresentableBy J. toJacobianData
  takes rep + lft + qc. Neither mentions a chart, an index or coverage. So ''the three
  antecedents are antecedents of one route'' was ALREADY visible in the signatures.


  (3) THE DEFENSIBLE CLAIM IS ONE LEVEL DOWN, and it is real: jacobianData_of_subsingleton
  IS ofRepresentableBy applied to a new rep (:170). What is new is the FIRST NON-ATLAS
  INHABITANT OF THE pic0 rep SLOT -- before this file the only producers of (pic0TypeFunctor
  C).RepresentableBy were pic0RepresentableByOfCharts (Pic0SigmaSheaf.lean:161) and
  its four chart derivatives. Restate the headline that way; as written it is refuted
  by two of its own seven names.


  (4) FIVE OF THE SEVEN CITED NAMES ARE OUTSIDE THIS FILE''S IMPORT CLOSURE (transitive
  import walk from Pic0VanishingRoute: JacobianDataAbelImage, Pic0AtlasFiniteType,
  Pic0AtlasCompactFromClass, Pic0AtlasCompactNoetherian all unreachable). Only ofCharts
  / ofChartsOfCompactSpace are visible. Phantom citations by the tree''s own standard.


  FIX: rewrite :11-21 as a claim about the rep slot with the correct census, or scope
  it to the closure and say so.'
