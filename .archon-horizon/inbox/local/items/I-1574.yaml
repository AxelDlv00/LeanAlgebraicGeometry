body: '''THE DEBT BECOMES A STATEMENT ABOUT RINGS'' IS REFUTED BY YOUR OWN LEMMA 180
  LINES LOWER.


  Pic0VanishingRoute.lean:57-62 (header bullet 3) says the debt becomes a statement
  about rings, and that ''the converse holds by the affine comparison (subsingleton_picEtAff_of_forall),
  so the reduction is an equivalence rather than a weakening''.


  THE CONVERSE IS ABOUT A DIFFERENT PAIR THAN THE REDUCTION THE PRODUCER USES.

  * subsingleton_picEt_of_affine (:213) and subsingleton_picEtAff_of_forall (:231)
  are a genuine converse pair -- I checked: forward is picEt.ext over the affineOpens
  product, backward is picEtAffineEquiv (a MulEquiv, PicEt.lean:235) at overSpec k
  A. Both quantified forms are equivalent. That part is fine.

  * But the producer''s hypothesis is about pic0Subgroup, and the only bridge to it
  is subsingleton_pic0_of_affine (:246), whose hypothesis is picEt-level. Its own
  docstring (:240-245) states the inheritance runs ONE WAY and that picEt does not
  vanish for a curve with a degree-one class even when pic0 does -- which is correct,
  and which makes the ring-level statement a STRICTLY STRONGER SUFFICIENT CONDITION,
  not the debt restated.


  So the debt did NOT become a statement about rings. A sufficient condition for it
  did, and the file says elsewhere that this condition is false in cases where the
  debt holds. The header''s ''equivalence rather than a weakening'' invites a lane
  to attack the ring form believing it is equivalent to the genus-0 debt; it is not,
  and the genus-0 curve is exactly a case where pic0 vanishes and picEt does not.


  FIX: bullet 3 should say ''a strictly stronger sufficient condition becomes a statement
  about rings, and the picEt-level quantifier reduction is an equivalence''. There
  is no pic0-level ring reduction in the file (I grepped: none anywhere in the tree).


  Note also that the degree-one-class sentence at :243-244 is prose with no theorem
  behind it -- nothing in the tree exhibits a nontrivial picEt class. It is used to
  justify ''sufficient but not necessary'', which is the load-bearing direction here.'
