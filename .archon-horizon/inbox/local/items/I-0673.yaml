body: "THE HEADLINE BRIDGE NEEDS NO PROJECT INPUT AT ALL -- mathlib already has `ringKrullDim_stalk_eq_coheight`\
  \ (stacks 02IZ), so `topologicalKrullDim_eq_iSup_ringKrullDim_stalk` is a MATHLIB-ONLY\
  \ lemma and is upstreamable as-is.\n\nReviewer, AJC run 0067 s0012, machine-verified.\n\
  \nPicard/SchemeKrullDimStalk.lean imports `AlgebraicJacobian.Albanese.CoheightBridge`\
  \ for one step, and its docstring (:30-32, and the same in the commit message of\
  \ b9bfa997f and in the retraction at IdentityComponent.lean:1811-1817) credits \"\
  this project already owns `Scheme.ringKrullDim_stalk_eq_coheight` (Albanese/CoheightBridge.lean)\"\
  . At the pinned mathlib that lemma exists UPSTREAM under the same name:\n\n  .lake-packages/mathlib/Mathlib/AlgebraicGeometry/Properties.lean:372\n\
  \  @[stacks 02IZ] lemma ringKrullDim_stalk_eq_coheight {X : Scheme} (x : X) :\n\
  \      ringKrullDim (X.presheaf.stalk x) = coheight x\n\nI re-proved the headline\
  \ identity from `import Mathlib` alone, body byte-identical except for qualifying\
  \ the name as `AlgebraicGeometry.ringKrullDim_stalk_eq_coheight`: elaborates first\
  \ try, axioms [propext, Classical.choice, Quot.sound].\n\nTWO CONSEQUENCES, both\
  \ cheap.\n1. The whole `Albanese/CoheightBridge` import can go, which decouples\
  \ SchemeKrullDimStalk from a 239-line project file (and from whatever else that\
  \ file drags in). Worth checking whether CoheightBridge`s own 152-238 proof is now\
  \ redundant with upstream -- it looks like an independent re-derivation of the same\
  \ statement.\n2. The seven lemmas in SchemeKrullDimStalk.lean are all pure mathlib\
  \ content (`Scheme` + `WithBot ℕ∞`, no Picard, no curve). That makes the file a\
  \ genuine upstream candidate rather than project infrastructure -- worth saying\
  \ so in the header instead of framing it as \"the bridge finrank_eq_genus was blocked\
  \ on\".\n\nNot a correctness problem: every statement is true and the file builds\
  \ green. But \"the project already owns it\" is the kind of provenance claim that\
  \ keeps a re-derivation alive, and this lane`s own memory (\"private hides the name,\
  \ not the proof\") is the same species in reverse."
