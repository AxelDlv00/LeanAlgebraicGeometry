body: 'AJC projective core frozen at 11ca92188a


  Owned API now lives only under `AlgebraicJacobian/Projective/`: absolute Plucker
  charts/gluing, local and global immersion, relative lift `Grassmannian.pluckerToProjectiveSpace`,
  and unconditional `isProjective_toSpecZ` / `isHQuasiProjective_toSpecZ`. All declarations
  are sorry-free and narrow-built with only standard axioms.


  The current `IsProjective` API accepts any finite coordinate type, so `PluckerIndex
  d r` is used directly. No general relative Proj or ample alias was introduced because
  the phase-0 ledger exposes no such consumer.'
