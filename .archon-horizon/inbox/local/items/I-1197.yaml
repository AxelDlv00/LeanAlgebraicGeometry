body: 'A PORT PRESCRIPTION COUNTED THE INPUTS OF THE LEMMA''S STATEMENT, NOT OF ITS
  PROOF -- and the missed input was the one with no widened analogue, so the target
  read as multi-round when it closes in four cheap decls. hdegAff is CLOSED at measurement.


  MEASURED (review-ajcr r5) against actual proof terms. /tmp/ajcr_p1_handover.lean,
  lake env lean EXIT=0; all three results [propext, Classical.choice, Quot.sound]
  vs a same-file control firing [sorryAx]. Handover to owning lane: I-1196.


  SITES CARRYING THE WRONG PRICE:

  * I-1187 (ajcr-p3 release): ''the widened analogue of classDeg_picClass ... it now
  has its input'' (singular); ''NOT closed: hdegAff''.

  * Picard/DivisorFamilyAffAbel.lean:244-248 and :296-300 -- ''that transport has
  no widened analogue yet''.

  * Picard/DivisorFamilyAffFieldDegree.lean:72-78; DivisorFamilyAffStalkEval.lean:57-61
  -- same claim.

  * Board row ...divrep.abel-widened -- ''hdegAff is NOT closed''.


  THE DEFECT. classDeg_picClass (DivSchemeAbel.lean:136-159) is STATED with one geometric
  input, so pricing from the statement shows one gap: the CRT identity, which p3 had
  just ported. Its PROOF opens with obtain <G, rfl> := DivFam.exists_toZar_eq F0 (:144)
  -- the FIELD COLLAPSE (:77). That input is the one with no widened twin (DivFamAff
  = zero tokens project-wide); the CRT half was already landed. So the half that looked
  absent got priced as hard.


  WHY IT WAS CHEAP. The chart-typed collapse (:79-130) transports verbatim; the widening
  touches two places, both already built: CertifiedDivisorFamilyAff.mapAlg (hinf free
  under [IsProper C.hom]) and DivFamZarAff.mapAlgHom_{eq_mapAlg,comp,id} (AffFace.lean:84-127).
  Two unnamed steps are one-liners: widened toZar_mapAlg (mk_eq_mk_iff.mpr (divEq_refl
  _)) and the widened affine collapse (abelDivAffPlus_mapAlgHom at overSpecGammaTopAlgEquiv).
  hdegAff then falls out of the widened degAt_abelDiv, five base-change haveIs unchanged.


  THE RULE: to price a PORT, read the PROOF TERM of what is ported, not its statement
  or docstring. A statement lists what the lemma wants from the READER; the proof
  lists what it wants from the LIBRARY, and a port pays the second. Whatever a proof
  grabs by `obtain ... := <lemma>` in its opening lines is invisible to signature-level
  pricing.


  SCOPE: clears nothing of rep, IsChartUniv, Sigma.desc surjectivity. Costing I-0984/I-1184
  UNCHANGED -- this is one level below them. No whole-tree build (mutex).'
