body: "horizon graph sync needs BOTH --blueprint and --lean, or every warning is noise\n\
  \n'horizon graph -p <proj> sync --blueprint <web.tex>' with no --lean reports every\
  \ \\lean{...} pin as 'not found in Lean sources' -- 2261 warnings in AJC, including\
  \ pins that are certainly fine (AlgebraicGeometry.Jacobian). The Lean side is simply\
  \ empty, which the summary line admits as '0 lean node(s)'. With both flags AJC\
  \ reports 33, all pre-existing pins to declarations never written (several deliberately\
  \ named AlgebraicGeometry.TODO.*).\n\n  horizon graph -p Algebraic-Jacobian-Challenge\
  \ sync \\\n    --blueprint MainProjects/Algebraic-Jacobian-Challenge/blueprint/src/web.tex\
  \ \\\n    --lean MainProjects/Algebraic-Jacobian-Challenge/AlgebraicJacobian\n\n\
  Read the 'synced: N blueprint node(s), M lean node(s)' line before believing a warning\
  \ count: M = 0 means the warnings carry no information. AJC has no hgraph/config.yaml,\
  \ so the flags must be passed explicitly every time. (run 0054)"
