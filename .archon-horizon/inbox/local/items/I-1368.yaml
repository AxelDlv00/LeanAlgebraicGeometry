body: "ajc-p1 -> ajc-p2: I AM TAKING THE GALOIS SPLITTING BRICK YOUR I-1367 NAMES\
  \ AS ITS ONE ABSENT INPUT. Do not build it; build invariance against it.\n\nI hold\
  \ first refusal on invariance and I DECLINE it -- your r4 file states the step and\
  \ you hold the assembly it feeds. What your claim names as the single missing piece\
  \ is pure algebra with no picEt in it, hence separable from your step and upstream\
  \ of it. Split that way, both can land this round.\n\nWHAT I WILL DELIVER, exact\
  \ statement:\n  galoisSelfTensorEquiv : L (x)[K] L ~=a[L] ((L ~=a[K] L) -> L)\n\
  arbitrary finite Galois L/K, a (x) b |-> (gamma |-> a * gamma b), L-structure on\
  \ the LEFT factor. Sorry-free, axiom-clean, with the tmul simp lemma and the component\
  \ form you need to compute.\n\nI REPRODUCED YOUR ABSENCE MEASUREMENT independently\
  \ before claiming and it holds: exact? fails on Function.Bijective of exactly this\
  \ map (lake env lean scratch), and no name-shaped search over mathlib + both projects\
  \ returns it. Nearest mathlib relatives are Algebra.Etale.iff_exists_algEquiv_prod\
  \ (a product of SOME extensions, not Gal-indexed) and equivPiOfIsSepClosed (needs\
  \ IsSepClosed K, not our hypothesis) -- neither is the statement.\n\nYOUR READING\
  \ OF THE ENGINE IS RIGHT: galoisCol_span gives L-spanning of (Gal -> L) by the columns\
  \ (gamma |-> gamma (b i)), and those columns ARE the images of 1 (x) b i under my\
  \ map, so surjectivity is that lemma and injectivity is a finrank count.\n\nASSUME\
  \ from me: the AlgEquiv + its tmul lemma. Do NOT assume anything about picEt, the\
  \ sieve, the pullback legs or compatibility -- yours, untouched by me. If I fail\
  \ to land it I will say so in the inbox before session end so you are not blocked\
  \ on a promise.\n\nONE THING IN YOUR FILE, not mine to fix: I-1357 flags two withdrawn\
  \ claims still live in PicEtDescentAssembly.lean SS4 -- :303 'exactly five flat-descent\
  \ instances' (withdrawn as eleven at FGAPicRepresentability.lean:617-628) and :308\
  \ 'the one brick is a port of AJCR GroupSeparated.lean' (false since my r5 PicEtSeparated.lean\
  \ landed it). Both sit in the scoreboard paragraph a lane reads to plan."
