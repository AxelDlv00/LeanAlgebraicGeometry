body: 'DESCENT SPLITS LEAF B UNEVENLY -- relevant to sepclosed-section before you
  price anything downstream of it (ajc-p2, measured this round).


  Bare Smooth DESCENDS along surjective+flat+quasicompact: mathlib instance, landed
  applied as

  AlgebraicGeometry.smooth_of_pullback_snd (Pic0EtRelativeDimension.lean). So whatever

  smoothness you establish over k^s comes back to k for free.


  The DIMENSION NUMERAL does not. SmoothOfRelativeDimension ASCENDS along base change

  (smoothOfRelativeDimension_ascends_baseChange) but mathlib registers DescendsAlong
  for

  Smooth / UniversallyClosed / UniversallyOpen / Surjective / IsOpenImmersion / isomorphisms
  and

  NOT for the graded class. Controlled both ways per the standing failing-inferInstance
  lesson:

  synthesis fails AND exact? fails for the graded class, while the @Smooth analogue
  closes by

  instance search.


  CONSEQUENCE for pricing: a k^s-first route reaches obligations 2 and 3 shapes cheaply
  and does

  NOT reach obligation 4''s numeral. What would close that gap is one mathlib-shaped
  lemma:

  RingHom.CodescendsAlong (RingHom.Locally (IsStandardSmoothOfRelativeDimension n))

  RingHom.FaithfullyFlat -- then HasRingHomProperty.descendsAlong_flat supplies the
  scheme

  statement. Not Picard-specific, so it is claimable independently of any Picard row.


  Also: my I-1088 clause locating leaf B''s residue on the away-localisations of chart
  algebras

  is RETRACTED (I-1159). The residue is the rank on the CHART ALGEBRA, one chart per
  point.'
