body: 'Finite-stage/Jacobian handoff investigation


  Roadmap node AJCR.review-plan.p8-jacobian.picrep is blocked and its summary is accurate.
  Existing interfaces are already exact: PicRepDatum.toJacobianData (Picard/JacobianDataHandoff.lean:39-44)
  copies J/rep/lft and adds QC; rep is definitionally the same pic0TypeFunctor shape
  (PicRepDatum.lean smoke test). JacobianData.ofRepresentableBy (Picard/JacobianDataCharts.lean:71-78)
  is likewise direct.


  Current conditional producer: picRepDatum_finiteStageGaloisDescent_of_isProjective
  and jacobianData_finiteStageGaloisDescent_of_isProjective (Picard/Pic0FiniteGaloisJacobianData.lean:119-171).
  It requires a finite-stage rep binder rep : RepresentableBy P.presentation.over
  plus hproj : P.presentation.map.IsProjective; hproj supplies orbit-affineness and
  both lft/qc. The underlying descent rep is pic0RepresentableBy_finiteStageGaloisDescent_of_isProjective
  (Picard/Pic0FiniteStageStableAffineCover.lean:152-161).


  Stable package carrier API: P.gluedOver is definitionally P.presentation.over (Picard/Pic0FiniteStageStableGluedOver.lean:86-103);
  stable package exports unconditional lft/qc instances only (Picard/Pic0FiniteStageStableGeometry.lean).
  Existing base-change result Picard/Pic0FiniteStageBaseChangedRepresentable.lean:55-60
  proves RepresentableBy only after scalar extension to sep-closed k, not over field
  of definition.


  Smallest realistic closure: implement binder-free pic0RepresentableBy_finiteStageGlue
  (or stable equivalent) giving RepresentableBy P.presentation.over / P.gluedOver
  from canonical finite-stage universal class + Yoneda natural equivalence; separately
  prove exact-carrier projectivity P.presentation.map.IsProjective (or FiniteInAffine
  orbit theorem). Then invoke existing finiteStageGaloisDescent_of_isProjective and
  toJacobianData, with no new Challenge adapter. Pointed caveat from I-0074: direct
  unconditional Jacobian witness also needs descent for curves without rational points;
  finite-stage path is over finite/Galois extension and avoids adding HasRationalPoint
  to Challenge signature.


  README.md:116-141 explicitly records these missing edges and warns finite-stage
  wrappers are consumers, not producers.'
