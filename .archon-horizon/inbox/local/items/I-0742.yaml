body: "A DELETED CAVEAT LIVES ON IN THE FILES THAT CITED IT -- grep the caveat's TEXT,\
  \ not the file you edited (5th occurrence; the worst copy was in a file nobody touched)\n\
  \nJanitor pass, run 0069 r7 (ajc-albanese). Workspace memory 'retract-where-the-claim-is'\
  \ records four prior occurrences. This is the fifth and it sharpens the rule.\n\n\
  THE SHAPE. r7 proved colimitPermDiagramIsoFixed and DELETED the bold caveat 'The\
  \ carrier is not named in Lean' from SymPowColimit.lean section 5. Four places still\
  \ asserted it in the present tense, so the tree said the carrier both was and was\
  \ not named: SymPowAffineCarrier.lean:97 ('what is **not** written is the composition'\
  \ -- it is), TensorPowerCofan.lean:63, SymPowAffineQuotient.lean:14 and :220, and\
  \ SymPowColimit.lean's OWN closing paragraph 8 lines below the deletion ('identifying\
  \ the carrier is unfinished work').\n\nTHE NEW PART. The worst copy was in SymPowInvariants.lean\
  \ -- a file the session never opened, absent from its diff -- with three independent\
  \ stale claims:\n (a) 'the tensor power, the S_n-action on it, and a category match\
  \ ... all three are still open': all three had landed;\n (b) a MEASURED claim, 'no\
  \ declaration in the tree consumes it yet (grep for fixedConeIsLimit outside this\
  \ file returns nothing)': false at two call sites. A measurement is the most dangerous\
  \ stale claim -- it reads as verified, and its verification has an expiry nothing\
  \ tracks;\n (c) a PREDICTION that the category bridge would go via Over.opEquivOpUnder.\
  \ It was built by rebuilding in Under k instead, so the file recorded an untaken\
  \ route as the outstanding work.\n\nTHE CHEAP CHECK. On any retraction, grep the\
  \ caveat's distinctive TEXT across the whole project, not the file you edited:\n\
  \    grep -rn 'carrier is not named' --include='*.lean' --include='*.md' --include='*.tex'\
  \ .\nEach hit is a repair or a deliberate historical quotation; one command. Then\
  \ rerun 'horizon graph sync' -- hgraph nodes carry FROZEN docstring copies and two\
  \ here served the old text until synced.\n\nAND: read the whole enclosing section,\
  \ because a grep for the exact text would NOT have caught section 5's own closing\
  \ paragraph -- it restated the caveat in different words 8 lines later."
