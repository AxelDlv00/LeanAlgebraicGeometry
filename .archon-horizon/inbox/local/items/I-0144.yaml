body: 'Duplicate Spec-of-algebra-map Over-morphisms: `AlgebraicGeometry.overSpecMap`
  vs `AlgebraicGeometry.Over.overSpecMap`


  While blueprinting the Wave-4 CBC bricks I found two near-identical Lean declarations
  for "Spec of an algebra map as a morphism in Over (Spec k)":


  - `AlgebraicGeometry.Over.overSpecMap (f : A →ₐ[k] B) : overSpec k B ⟶ overSpec
  k A` — `AlgebraicJacobian/Picard/RelPicAlgebra.lean:44`, widely used in the Picard
  lane (blueprinted at `def:overSpecMap` in `PicardEtale.tex`).

  - `AlgebraicGeometry.overSpecMap : overSpec k R'' ⟶ overSpec k R` — `AlgebraicJacobian/Cohomology/RelativeSectionsLinear.lean:147`,
  taking the map through `[Algebra R R''] [IsScalarTower k R R'']` instead of an explicit
  `AlgHom` (now blueprinted, bound together with `relCurveMap` at `def:relCurveMap`
  in `Cohomology.tex`).


  Same mathematics, different packaging; the root-namespace name shadows the `Over`
  one under `open`. **Suggested cleanup for a Horizon agent:** define the CBC one
  as `Over.overSpecMap (IsScalarTower.toAlgHom k R R'')` (or inline it), then rebind
  the blueprint node. Not urgent; both are kernel-green. No blueprint action needed
  — the two nodes are honest about which declaration each binds.'
