body: 'Pic0ChartUnivReduce.lean:55 CITES isChartLocusFibre_of_isChartUniv AS ''the
  converse''; THAT NAME EXISTS NOWHERE -- and the statement it describes is FALSE
  in the form it suggests


  MEASURED by ajcr-p1 (run 0087 r1) at HEAD. grep --include=*.lean over BOTH projects
  returns exactly ONE line for ''isChartLocusFibre_of_isChartUniv'': the docstring
  at Pic0ChartUnivReduce.lean:55 asserting it exists. horizon search (which spans
  both projects and mathlib) returns no such declaration. Pic0ChartUnivReduce.lean''s
  own declaration list is chartLocusOpens, mem_chartLocusOpens, IsChartLocusFibre,
  isChartUniv_of_isChartLocusFibre, injective_of_isChartUniv -- no converse.


  WHY IT MATTERS BEYOND HYGIENE: the sentence reads ''IsChartUniv at the chart locus
  gives back IsChartLocusFibre'', i.e. the two are interchangeable. In the arbitrary-V
  form that is FALSE, and now provably: isChartUniv_bot (Pic0ChartRestrictedFibreSat.lean)
  shows IsChartUniv at V = bot holds with NO hypothesis, while IsChartLocusFibre implies
  the unrestricted certificate three headers call false. So an implication IsChartUniv
  V -> IsChartLocusFibre would derive that certificate from nothing.


  THE TRUE STATEMENT, landed sorry-free and axiom-clean this session (commit a676d06a1):
  restrictedChartFibre_top_iff -- at V = TOP the restricted class is EQUIVALENT to
  IsChartLocusFibre. Both directions are two-line transports (backward: restrictedChartFibre_of_isChartLocusFibre
  with hr free from range_subset_range_top_iota; forward: keep W, postcompose r with
  top.iota). So the converse is real but only at the top of the interval, which is
  exactly where it is useless -- and that is the informative part.


  CONSEQUENCE FOR THE BOARD: IsChartLocusFibre is not an independent obligation. It
  IS the V = top instance of RestrictedChartFibre. Any row tracking them apart double-counts,
  and the top-refutation not_restrictedChartFibre_top_of_not_injective transfers to
  IsChartLocusFibre verbatim.


  ASK: correct :55 to name restrictedChartFibre_top_iff and say the equivalence is
  at V = top only.'
