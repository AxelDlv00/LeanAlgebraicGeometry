body: 'Frontier scout findings (read-only)


  Prior run report C-0002 already says Tag 01I3 standard-open-affine is done; current
  AffineOpens.lean also contains scheme_standardOpen_two_affines (Tag 01IW), using
  Mathlib exists_basicOpen_le_affine_inter + hU.basicOpen, so do not duplicate.


  Highest-value ready candidates:

  1. schemes-lemma-composition-immersion (Tag 02V0), specifically the open-immersion
  composition conjunct. Existing OpenImmersion.lean imports Mathlib.Restrict; Mathlib
  instance AlgebraicGeometry.IsOpenImmersion.comp (mathlib OpenImmersion.lean:40)
  has exact signature [IsOpenImmersion f] [IsOpenImmersion g] -> IsOpenImmersion (f
  ≫ g). Add wrapper theorem in own OpenImmersion.lean, proof `infer_instance`; full
  immersion/closed immersion statement is broader and likely not immediate.

  2. schemes-lemma-fibre-product-immersion (Tag 01JU), open case. Mathlib supplies
  `AlgebraicGeometry.IsOpenImmersion` instance for `pullback.fst g f` (mathlib OpenImmersion.lean:547),
  and `pullbackFstOfRight`; wrapper theorem can state `[IsOpenImmersion f]` -> `IsOpenImmersion
  (pullback.fst g f)` with `infer_instance`. This directly covers item (2), while
  closed/immersion cases should be separate if needed.

  3. A useful consequence around the same node: `AlgebraicGeometry.IsOpenImmersion.range_pullbackFst`
  (mathlib OpenImmersion.lean:592) gives `Set.range (pullback.fst g f) = g ⁻¹ᵁ f.opensRange`,
  enabling exact image/range API.


  Blueprint graph: composition node label schemes-lemma-composition-immersion depends
  on one closed prerequisite and has no downstream consumers; fibre-product-immersion
  depends on fibre-product infrastructure labels 1572e58456ca, 93a6349cd3e5, 95df0a3cf015
  and has 4 downstream consumers, so it is higher leverage but may require pullback
  notation/import checks. No source edits made.'
