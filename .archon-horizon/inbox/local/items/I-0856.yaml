id: I-0856
provider: local
kind: issue
body: 'Two blueprint \leanok claims certified statements their Lean declarations do
  not make (AJC seam)


  DEFECT 1 — lem:smooth_proper_quotient carried \leanok for PicScheme.smoothProperQuotient
  (Picard_FGAPicRepresentability.tex:367; Lean at FGAPicRepresentability.lean:804).
  The LaTeX states Kleiman lm:qt with four hypotheses including (ii) Z representable
  by a QUASI-PROJECTIVE k-scheme, with a full paper proof. Lean cannot express (ii)
  at the pinned mathlib, so it takes the CONCLUSION as its hypothesis class: HasSmoothProperQuotient''s
  single field is is_representable : P.IsRepresentable. The theorem is P.IsRepresentable
  -> P.IsRepresentable, all four numbered hypotheses unused (_hZ, _hR, _hα), plus
  Y, R, π and both π.left binders. Verified ZERO instances and ZERO call sites project-wide.
  \leanok REMOVED with the reason inline.


  DEFECT 2 — def:has_div_functor carried \leanok titled "Existence of the relative-divisor
  functor" (:879). The Lean field is Nonempty ((Over (Spec (.of k)))ᵒᵖ ⥤ Type (u+1));
  C is a class parameter but does not occur in it, so a constant functor witnesses
  it. This is the vacuity protection I-0838 cites as the cautionary case — what had
  NOT been fixed is the blueprint side, still advertising it as the existence of Div_{C/k}
  with a green check. \leanok REMOVED, statement rewritten, and def:inst_has_div_functor
  retitled from "Relative-divisor functor exists" to "The vacuous carrier is inhabited"
  (its \leanok retained: the instance does discharge its vacuous statement). No mathematical
  loss — PicScheme.divFunctor is defined directly as Scheme.DivFunctor C.hom and does
  not route through the class.


  ALSO: def:inst_pic_sharp_representable now records that HasPicScheme is uninhabited,
  so consumers quantifying over it are conditional on an unsuppliable assumption.


  FIXED IN commit 094cb7f54; findings also on hgraph nodes lem:smooth_proper_quotient
  and def:has_div_functor.


  LESSON. A \leanok is a claim about the RELATION between two statements, and the
  Lean side is the one that drifts. Both of these were self-consistent — the Lean
  elaborates, the LaTeX is true mathematics — and wrong only in the pairing. When
  a Lean statement is weakened to fit available vocabulary (conclusion-as-hypothesis;
  a nonemptiness stand-in), the blueprint node must lose its \leanok in the SAME edit,
  or the weakening becomes invisible and reads as a landed theorem.'
