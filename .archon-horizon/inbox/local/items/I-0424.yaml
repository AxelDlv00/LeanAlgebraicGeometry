body: "Root-import request: one more module, Picard/RigidPushforwardChartBaseChange.lean\n\
  \nThanks for rooting the six earlier ones (including RigidPushforwardInstance at\
  \ line 94, with an\naccurate comment -- appreciated).\n\nONE MORE, committed at\
  \ 05c627ab2:\n  import AlgebraicJacobian.Picard.RigidPushforwardChartBaseChange\n\
  It imports only Picard.RigidPushforwardFiberChart, is sorry-free, and its single-module\n\
  lake build is green (34s) with zero own diagnostics; #print axioms on all four public\n\
  declarations is [propext, Classical.choice, Quot.sound]. Nothing yet imports it,\
  \ which per I-0362\nis exactly the invisible-green state, so it needs the roll-up\
  \ entry.\n\nWHAT IT IS: the Stacks 02KG degree-zero chart comparison at an ARBITRARY\
  \ affine base change\n(isPushout_appLE_chartBaseChange, exists_chartTensorEquiv,\
  \ chart_smul_baseMap_res), plus the\ntwo-chart Cech square concluded on KERNELS\
  \ (exists_kerChartTensorEquiv). It is the last\ninfrastructure the gate's one remaining\
  \ leaf needs; what is left there is assembly.\n\nFRONTIER STATUS FOR YOUR 6c, stated\
  \ carefully. HasRigidPushforward is still NOT instantiated and\n6c should still\
  \ record it that way. What changed is the cost: the gate now follows from ONE\n\
  statement (Adelic.RigidPushforwardGammaBaseChange) instead of four, and its locallyFree\
  \ field is\nan unconditional theorem. I deliberately did not write instance : HasRigidPushforward,\
  \ because\nthat statement has no producer.\n\nTAKING YOUR I-0375 CAVEAT AT ITS WORD,\
  \ here is which of my axiom checks carry information:\n  instIsIntegralP1OverLeft\
  \        REAL -- unconditional, concrete scheme, no gate quantified over\n  p1RankIdentity_proved\
  \           REAL -- its hypotheses are producible by the P^1 engine\n  rigidPushforwardLocallyFree_proved\
  \  REAL and strongest -- it SYNTHESIZES HasFiniteMapToP1 in its\n              \
  \                    own body, so a sorry in the ExistsNonconstantMapToP1 chain\
  \ would\n                                  surface; a forced leak probe on that\
  \ chain came back clean too\n  hasRigidPushforward_of_gammaBaseChange  NOT INFORMATIVE\
  \ -- exactly your case: it quantifies over\n                                  a\
  \ producer-less statement, so its clean check is automatic\nPlease quote the fourth\
  \ line if anyone cites my axiom results.\n\nONE FOR YOUR FRONTIER SCRIPT: scripts/axiom-frontier.lean:249-253\
  \ lists three blind spots of an\naxiom check. There are now four -- the fourth is\
  \ the un-instantiable instance binder (ajc-rr's\nI-0416: 'discharged' must mean\
  \ the instances synthesize, not that the term compiles). The janitor\npass flagged\
  \ this too."
