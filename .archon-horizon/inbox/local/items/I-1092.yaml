kind: issue
body: 'BUILD-REACHABILITY AT HEAD: 17 transitively unreachable modules, 7 NEVER BUILT
  -- one holds 2 of the project''s 17 sorries. And ''rooted'' came apart from ''measured''
  on the round''s most load-bearing new file.


  MEASURED by review-ajcr (run 0082 s0008): import graph over all 768 AlgebraicJacobian
  modules, TRANSITIVE closure from AlgebraicJacobian.lean, then olean check.


  THE NUMBERS. A naive ''not imported by the umbrella'' count gives 123 and is meaningless
  -- most are imported by other rooted modules. Transitively unreachable: 17. Of those,
  7 have no olean, so they have never been compiled and are invisible to any axiom
  probe: DivSchemeRedesignKappaZSeed, DivSchemeRedesignPointPrime, DivSchemeRedesignRDN,
  DivSchemeRedesignSeedFinish, DivSchemeSeedUnivSecondWindowMap, Pic0ThetaCocycle,
  ScratchChartLocal. Six have zero importers; SeedFinish''s only importer is itself
  unreachable.


  Pic0ThetaCocycle carries 2 of the 17 code sorries and is both unreachable AND unbuilt
  -- no build and no axiom probe has ever spoken about it.


  SORRY CENSUS, re-measured with block and line comments stripped (a raw grep over-counts:
  docstrings here discuss sorries constantly): EXACTLY 17 code sorries in 2 files
  -- Challenge.lean 15, Pic0ThetaCocycle 2, nothing else in 768 modules. Challenge.lean
  is the statement-only north star, so its 15 are the OBJECTIVE, not debt. Honest
  one-liner: 2 sorries of technical debt, 15 of objective, 0 of the three seam antecedents
  discharged.


  THE SHARPER DEFECT, hit rather than inferred. ajcr-p1''s Pic0ChartVMonotone.lean
  -- what now prices antecedent 2 at the unrestricted statement -- WAS umbrella-imported
  but had NO OLEAN, so ''#print axioms'' failed with ''object file does not exist''.
  It had been elaborated standalone via lake env lean but never kernel-checked in
  the build graph, while presenting as rooted. I built that module (EXIT=0, 8894 jobs)
  and confirmed its three key declarations axiom-clean [propext, Classical.choice,
  Quot.sound] against an in-file sorry control that fires sorryAx.


  ADOPT THIS CHECK: rootedness is an import-graph property, builtness an artefact
  property. A lane can honestly report ''rooted + lake env lean EXIT=0'' while no
  kernel has seen the file in context. Confirm the olean exists before believing an
  axiom probe, and read ''object file does not exist'' as an UNMEASURED file, not
  a tooling nuisance.'
