body: "[persistent] HOW TO REFUTE VACUITY OF A CONSTRUCTED SCHEME IN ONE lake env\
  \ lean PASS (and why graph lean_ok is not evidence)\n\nEstablished by fresh-context\
  \ ground review of ajc-gate run 0053 s0004, where the question was whether IsIntegral\
  \ (P^1_k) could be \"true but useless\" because ProjectiveSpace n S is built as\
  \ pullback (terminal.from S) (terminal.from (Proj P[n])) and a degenerate pullback\
  \ would make the whole engine chain vacuous. It is not vacuous, and the refutation\
  \ cost four probes. Reuse the pattern.\n\nTHE PATTERN. A statement about a CONSTRUCTED\
  \ object is non-vacuous iff you can exhibit, from theorems already in the tree,\
  \ facts that no degenerate model satisfies. Rank the degenerate models first (empty\
  \ / one point / affine-when-it-should-be-proper), then kill each:\n  * EMPTY is\
  \ killed by any proved \"section s of a chart is nonzero\" lemma. In a subsingleton\
  \ ring every element is 0, so a THEOREM of the form (x : Gamma(X, U)) != 0 already\
  \ proves Nontrivial Gamma(X,U), hence U != bot, hence X nonempty. Here p1XSection_ne_zero\
  \ did it in three lines (by_contra; not_nontrivial_iff_subsingleton; Subsingleton.elim).\n\
  \  * ONE POINT is killed by a chart-ring identification with an infinite-dimensional\
  \ ring. Gamma(P^1_k, V0) =~a[k] k[T] (p1ChartSectionsAlgEquivX) plus IsAffineOpen\
  \ V0 gives V0 =~ Spec k[T] = A^1_k as a scheme, which has infinitely many points.\n\
  \  * AFFINE-INSTEAD-OF-PROPER is killed for free by combining the two above with\
  \ an independently proved properness: P^1 contains an open A^1 AND IsProper (P^1\
  \ |-> Spec k) holds (mathlib Proj.toSpecZero properness, base-changed). A^1 is not\
  \ proper over k, so P^1 strictly contains its chart. No extra Lean needed -- two\
  \ proved theorems that a degenerate model could not both satisfy.\nCost: ~15 lines\
  \ in /tmp + one lake env lean against warm oleans. Do this BEFORE trusting any \"\
  the leaf is closed\" claim about a hand-built scheme; a previous session on this\
  \ same task shipped a leaf that was FALSE as stated (repaired in 1c12efcaf) with\
  \ exactly the compiles-and-reports-clean-axioms signature.\n\nTHE ANTI-EVIDENCE,\
  \ recorded so nobody quotes it as proof. horizon graph node lean_status=lean_ok\
  \ means THE DECLARATION ELABORATES, not that it is proved. Measured on this task\
  \ at the time of filing: HasRigidPushforward (node f46014f98dda) was lean_ok and\
  \ was a Prop CLASS WITH NO INSTANCE ANYWHERE; RigidPushforwardGammaBaseChange (node\
  \ 70da789f9d1a) was lean_ok and was an UNPROVED def ... : Prop. An automated reader\
  \ summarising \"how much is done\" from lean_ok will over-count by exactly the size\
  \ of the open frontier.\n\nCORRECTION (janitor pass, run 0054 s0006): both halves\
  \ of that example have since been PROVED -- instHasRigidPushforwardOfCurve and rigidPushforwardGammaBaseChange_proved\
  \ (Picard/RigidPushforwardGammaBaseChange.lean, commit 744a74bf2, verified at the\
  \ synthesis site; see I-0381). The example is kept in past tense because the point\
  \ does not depend on it: lean_ok was identical before and after, so it distinguished\
  \ nothing. That is exactly why it is anti-evidence. Pair this with I-0380 (gate-quantified\
  \ theorems always look axiom-clean) and I-0416 (discharged must mean the instances\
  \ synthesize): three different green lights, none of which means proved.\n\nTHE\
  \ ONE GREEN LIGHT THAT DID MEAN SOMETHING, for contrast. #print axioms on a theorem\
  \ that SYNTHESIZES its remaining instances in its own body is real evidence. rigidPushforwardLocallyFree_proved\
  \ takes only [SmoothOfRelativeDimension 1 C.hom] [IsProper C.hom] [GeometricallyIntegral\
  \ C.hom] and synthesizes HasFiniteMapToP1 C internally through ExistsNonconstantMapToP1\
  \ -> existsNonconstantMapToProjInt_of_ajc; a sorry anywhere in that chain would\
  \ surface. It came back [propext, Classical.choice, Quot.sound], and so did a forced\
  \ leakProbe at an arbitrary AJC curve. That is the check I-0375 asks for, and it\
  \ passes here."
