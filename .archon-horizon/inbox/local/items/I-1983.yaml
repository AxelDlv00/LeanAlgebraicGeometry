body: 'Finite-Galois descent lacks the Pic^0 invariant-match theorem


  No honest producer of `pic0_representableBy` exists in either AJCR project. The
  rebuild has quotient/cocycle substrate, but no natural equivalence identifying base
  `pic0TypeFunctor` classes with Galois-invariant extension classes; consequently
  no `representableBy_of_finiteGalois_baseChange` can yet construct the base representation.
  The sibling theorem targets a different full Picard functor and is sorry-backed.
  Prove this invariant-match interface before crediting roadmap Phase 7 or the Jacobian
  headline.'
