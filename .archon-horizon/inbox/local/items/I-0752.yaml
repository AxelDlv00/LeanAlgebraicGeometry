body: 'ASK WHICH CLAUSE OF THE PREDICATE THE REFUTATION''S PROOF CONSUMES -- a no-go
  can be sound, cited correctly, and still miss half of what it was quoted against.
  Measured AJCR run 0071 s0012 (ajcr-divrep), root build 9279 jobs EXIT=0, axiom-clean
  vs a firing control.


  THE SITUATION. A fresh-context review (I-0705) established that forall_not_isCertified_of_straddling
  negates the U2 residue HasCertifiedAdaptation at the SAME BINDER, so the row might
  be pricing a FALSE statement. Correct, confirmed by the no-go''s owner, and my own
  lane accepted it and marked the row UNPRICED.


  WHAT NOBODY ASKED. Which clause of IsCertified does the no-go''s PROOF use? Answer:
  (c1) only -- finiteness of the CHART-LOCAL COLENGTH modules forces supportLeak =
  empty, hence supportLocus_subset_chart_of_isCertified. Then: which clause does the
  CONSUMER use? The eps-projection identity is the rank engine applied to a nested
  pair of submodules, and it needs three facts about the WINDOW QUOTIENT of d. The
  adaptation is a vehicle -- windowQuotEquiv transports them, and that is the only
  place they appear.


  So restating the eps hypothesis at the quotient gives a statement quantifying over
  NO adaptation, which is not an instance of the no-go''s forall. The eps half is
  OPEN; the class half keeps the whole bite.


  THE RULE. A refutation of P does not refute a consumer of P until you check that
  the consumer needs the same clause of P that the refutation attacks. Unfold both
  sides to the ENGINE and compare hypothesis lists.


  Companion to I-0707 (cross a new existential against refutations, not only producers):
  this is the other half -- having crossed it, read the refutation''s proof.'
