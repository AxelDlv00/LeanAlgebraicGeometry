body: 'STALE FRONTIER CLAIM IN LEAN SOURCE: `hasRigidPushforward_of_leaves` still
  advertises "the exact remaining frontier ... four named leaves"; two of the four
  are now theorems


  Found and verified by the janitor pass, run 0053 s0004. **Documentation defect only
  — no proof is wrong and nothing is broken.** Filed rather than fixed because janitor
  passes do not edit Lean source; `Picard/RigidPushforward*` is `ajc-gate`''s live
  write set (run 0053).


  **The defect.** `AlgebraicJacobian/Picard/RigidPushforwardGate.lean:289`, the docstring
  on `AlgebraicGeometry.Adelic.hasRigidPushforward_of_leaves`, opens:


  - "**The gate from the four named leaves.** The exact remaining frontier of the
  B3 campaign gate, machine-checked:" — then lists $\Gamma(\mathbb{P}^1_k,\mathcal{O})
  = k$ (leaf 1), the fibrewise Čech bridge (leaf 2), the local-freeness output bridge
  (leaf 3), and the base-change field (leaf 4, "no infrastructure yet").


  **Why it is now wrong.** Leaves 1 and 3 are proved, in the same project, at commit
  `e4a026eb7`:


  - `IsIntegral (ℙ¹_k)` — `instIsIntegralP1OverLeft`, `Picard/RigidPushforwardInstance.lean`,
  via the chart-ring identification $\Gamma(\mathbb{P}^1_k, D_+(X_i)) \simeq_{k\text{-alg}}
  k[T]$ (`RigidPushforwardP1ChartSections.lean`, `RigidPushforwardP1ChartRing.lean`)
  plus `IsReduced.of_openCover` and density of the overlap (`RigidPushforwardP1Topology.lean`).

  - `P1RankIdentity k A` — `p1RankIdentity_proved`, `Picard/RigidPushforwardRank.lean`,
  for *every* `k`-algebra `A`.


  The honest current statement is in the same file family and is already written:
  `hasRigidPushforward_of_gammaBaseChange` (`Picard/RigidPushforwardInstance.lean`)
  needs **one** hypothesis, `RigidPushforwardGammaBaseChange C A` — the classical
  $H^0$ base-change fact — and the gate''s `locallyFree` field is unconditional for
  an AJC curve (`rigidPushforwardLocallyFree_proved`).


  **Why this is worth fixing rather than leaving.** The phrase "the exact remaining
  frontier, machine-checked" is exactly the sentence a later session or a reviewer
  will quote when budgeting the gate, and it over-counts the remaining cost by a factor
  of four. This is the failure mode memory `I-0349` guards against; corrected memory
  `I-0381` records the true state, but the Lean docstring is what `horizon graph`/`hgraph`
  sync into node metadata, so the stale version is currently the *machine-visible*
  one.


  **Two derived copies carry the same claim and should be swept in the same edit:**


  - `MainProjects/Algebraic-Jacobian-Challenge/scripts/axiom-frontier.lean:158` —
  "`hasRigidPushforward_of_leaves` derives it from four named leaves".

  - `hgraph/nodes/9a71d6b8b014.md` — the `docstring:` field is synced from the Lean
  docstring, so it will self-correct on the next `horizon graph sync` once the source
  is fixed.


  **Suggested edit:** keep `hasRigidPushforward_of_leaves` and its four-leaf factorisation
  (it is a true theorem and a useful decomposition), but retitle the docstring to
  "the four-leaf factorisation" and replace "the exact remaining frontier" with a
  pointer to `hasRigidPushforward_of_gammaBaseChange` as the current frontier. Do
  not change any statement or proof.'
