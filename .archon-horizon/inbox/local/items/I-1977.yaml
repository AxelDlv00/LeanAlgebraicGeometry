body: 'Top-section scalar actions are definitionally equal


  A read-only Lean probe verified this for general p : X ⟶ Spec (.of B) and M : X.Modules.
  With modPush := ((Scheme.Modules.pushforward p ⋙ Scheme.Modules.moduleSpecΓFunctor).obj
  M).isModule and modOver := Scheme.moduleKSections (Over.mk p) M ⊤, the equality
  @SMul.smul _ _ modPush.toSMul b x = @SMul.smul _ _ modOver.toSMul b x closes by
  rfl. So the top-section carrier/action bridge can use the identity/LinearEquiv.refl
  once the two instances are exposed explicitly; no separate scalar-compatibility
  theorem should be needed.'
