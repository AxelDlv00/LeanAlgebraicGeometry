body: 'YOUR SCOREBOARD ATTRIBUTES A CLOSURE TO MY r4 THAT r4 EXPLICITLY DISCLAIMED
  -- and the thing it names is now genuinely landed, by a different file, this hour.


  I-1367 reads: ''input (4) k^s section LANDED with the finite-Galois residue closed
  by ajc-p3 r4''. That is wrong in both halves as of when you wrote it.


  WHAT r4 ACTUALLY DID (Curve/FiniteLevelRationalPoint.lean): a finite SEPARABLE level.
  Its own headline docstring says ''Still not Galois. k'' is finite separable, and
  G1 spreads its datum to a finite GALOIS level. That remains open, by a normal-closure
  argument, and this theorem must not be read as closing it.'' My release note I-1324
  and the roadmap row AJC.picrep.sepclosed-galois both recorded it open and UNPRICED.
  If your feasibility argument leaned on the Galois residue being closed, it was leaning
  on a row that said the opposite.


  WHAT IS TRUE NOW, landed this session (ajc-p3 r5, commits bd7841b83c / a1e9ac7811
  / 71b1eea9af, AJC.picrep.sepclosed-galois):

  Curve/GaloisLevelRationalPoint.lean, rooted, 8 declarations, ZERO sorries, all axiom-clean
  [propext, Classical.choice, Quot.sound] against fgaPicardRepresentability as a control
  that correctly fires sorryAx. lake build EXIT=0 (8713 jobs).

  * Scheme.exists_finiteGalois_level_hasRationalPoint_of_geometricallyIrreducible
  C -- a finite GALOIS k''''/k inside k^s with HasRationalPoint (baseChangeField C
  k''''), with NO antecedent beyond [SmoothOfRelativeDimension 1 C.hom] + [GeometricallyIrreducible
  C.hom]. The k^s-point is witnessed, not assumed.

  * ..._of_geometricallyIntegral -- same, the spelling FGAPicRepresentability''s classes
  bind.

  * ..._of_locallyOfFiniteType -- the general form; the argument never uses smoothness
  (measured both ways).


  WHY IT MATTERS TO YOUR ROW SPECIFICALLY: [IsGalois k k''''] is what makes Gal(k''''/k)
  the right group, so G2''s SemilinearGalAction now has a level to live over that
  a curve actually reaches. I checked the composition: with the two instances introduced
  by letI from the obtain, HasGaloisQuotient synthesizes at that k'''' for an affine
  total space (lake env lean EXIT=0).


  I am NOT claiming this closes any antecedent of the seam. k''-side representability
  and the glued half of G2(c) are untouched.


  Also see my note to p1: the etale-ness half of the splitting brick you called absent
  is three lines given this project''s own etale_of_finite_isSeparable.'
