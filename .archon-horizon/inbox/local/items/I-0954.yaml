body: "HasSmoothProperQuotient DOES NOT MENTION ITS alpha: the class is transferable\
  \ across arbitrary alpha with the same target, so the \"use site supplies it for\
  \ the RIGHT map\" safety argument does not hold\n\nVacuity sweep of the Picard seam\
  \ (Ground, fresh context). Complements the already-labelled P -> P projection defect\
  \ at smoothProperQuotient; this is a DIFFERENT, unrecorded fact about the CLASS,\
  \ and it is the HasDivFunctor mode exactly: the named object is absent from the\
  \ statement.\n\nWHERE. Picard/FGAPicRepresentability.lean:800-803\n  class HasSmoothProperQuotient\
  \ ... {Z P : ...} (_alpha : Z -> P) : Prop where\n    is_representable : P.IsRepresentable\n\
  alpha is a class binder and DOES NOT OCCUR in the field. Neither does Z. Only P\
  \ does.\n\nMACHINE-VERIFIED (lean_run_code, zero diagnostics, nothing landed) --\
  \ all three ELABORATE:\n  (alpha : Z -> P) (alpha' : Z' -> P) [HasSmoothProperQuotient\
  \ alpha] |- HasSmoothProperQuotient alpha'\n  (alpha : Z -> P) [HasSmoothProperQuotient\
  \ (id P)] |- HasSmoothProperQuotient alpha\n  [HasSmoothProperQuotient (id P)] |-\
  \ P.IsRepresentable\n\nWHY THIS GOES BEYOND THE LABELLED PROJECTION. The file's\
  \ §3 discipline (:776-781, :821-832) argues safety by scope: the class is \"an explicit\
  \ use-site hypothesis ... instantiated for the Abel-map slice Z -> P^phi_0, where\
  \ Altman-Kleiman descent genuinely applies\", carrying Kleiman's quasi-projectivity\
  \ of Y. That does not hold. Since alpha is absent, an instance supplied for ANY\
  \ map into P -- including the IDENTITY of P, where no equivalence relation, no smoothness,\
  \ no properness is in sight -- discharges the class for the intended alpha. The\
  \ class cannot express \"this quotient presentation is smooth and proper\"; it can\
  \ only say \"P is representable\".\n\nWRONG CONCLUSION A READER DRAWS from the name\
  \ plus the §3 header: that [HasSmoothProperQuotient alpha] is a scoped, alpha-specific\
  \ record of the lm:qt interface. It is an unscoped assertion about P, indexed by\
  \ an argument it ignores.\n\nZERO instances and ZERO call sites at HEAD (grep; the\
  \ file already states this at :826-827), so nothing is unsound now.\n\nRECOMMENDATION.\
  \ If kept as the blueprint pin, state in the docstring that alpha is a DECORATIVE\
  \ index and the class is alpha-agnostic -- next to the existing P -> P admission,\
  \ since the two together are the full truth. A genuinely scoped version would need\
  \ fields mentioning alpha (pullback alpha alpha representable, smooth/proper on\
  \ the projection), not only P.\n\nRead-only lane: no edits, no task done."
