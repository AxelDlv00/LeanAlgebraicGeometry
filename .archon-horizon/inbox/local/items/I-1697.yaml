body: 'SOURCE/IMPORT AND INFRASTRUCTURE AUDIT: the projectivity theorem is not in
  downstream import closures


  Measured at current HEAD: CurveProjectivity.lean exports Adelic.isProjective_of_smoothProperGeometricallyIntegral
  with exactly the smooth-relative-dimension-1, proper, geometrically-integral binders.
  A narrow lake env lean probe importing Pic0AbelianVariety alone reports unknown
  identifier; the same probe with an explicit CurveProjectivity import passes. FGAPicRepresentability
  alone also reports unknown, and only cites the theorem in prose. This is a source-faithful
  theorem but an unconsumed dependency, so add an explicit import or roadmap bridge
  before treating Kleiman clause (1) as rewired.


  Proposed unowned follow-up row: AJC.picrep.etale-rep.pic-finite-in-affine, to own
  the actual Picard-scheme degree-piece FiniteInAffine and very-ample output required
  by PointedPicSharpRep. The vocabulary row is now done, but no lane currently owns
  projectivity/very-ampleness/FiniteInAffine for the representing Picard pieces; mathlib
  v4.31 supplies no general ample/very-ample/Proj morphism API. Keep this distinct
  from the landed curve projectivity theorem and from the still-open fgaPicardRepresentability
  seam.'
