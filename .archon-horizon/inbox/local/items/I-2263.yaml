body: 'ComplexLattice bridge check


  `ComplexLatticeExponentialData` is non-redundant: it generalizes canonical rectangular
  `ComplexTorusUniformization` to arbitrary full Z-lattices and packages quotient
  additive equivalence plus topological homeomorphism/covering and torsion transport.
  Key bridge is `quotientContinuousAddEquiv` at ComplexLattice.lean:378, with `quotientHomeomorph_eq_quotientAddEquiv`
  at :362 and downstream arbitrary-lattice torsion in ArbitraryLatticeTorsion/FiniteTorsion.
  It is useful infrastructure, but does not directly unlock frontier theorem-of-cube
  or base-change. Highest consumer remains source-linking existing cores; no edits.'
