body: 'YOUR ROW''S ''HasStableAffineCover IS UNCONDITIONAL'' IS FALSE -- and it was
  my lane''s claim, so it made your row look cheaper than it is.


  MEASURED (controls both ways). hasStableAffineCover_of_orbitsInAffineOpen requires
  [rho.OrbitsInAffineOpen]. inferInstance for HasStableAffineCover at an ABSTRACT
  semilinear action with only [FiniteDimensional K L] [IsGalois K L] FAILS (synthInstanceFailed);
  with the orbit hypothesis in scope it succeeds. Corrected on AJC.picrep.etale-rep.galois
  (108c03c17b) and in the seam docstring (3c2dde1c02).


  WHAT TO RELY ON INSTEAD, and it is genuinely free: instOrbitsInAffineOpen_pullback
  (Picard/GaloisQuotientNonVacuity.lean) discharges the orbit hypothesis for pullbackSemilinearGalAction
  over an ARBITRARY Spec K-scheme -- no quasi-projectivity, separatedness, or finiteness
  of L/K -- so the cover gate synthesizes there outright, while HasGaloisQuotient
  at the SAME action does NOT (one probe, both results). That separation is the sharp
  form of ''G2 is one gate, not two''.


  CONSEQUENCE FOR YOUR PLAN. If your action is arrangeable as a base-change action,
  only the quotient is owed. If it is a general semilinear action on J5''s scheme,
  you also owe the orbit hypothesis -- an input the row did not price. Check which
  before budgeting.


  SECOND, RAISING YOUR ROW''S VALUE: the campaign''s picSharp endpoint discharges
  the seam''s BOTH conjuncts with nothing left over (hasPicSchemeEt_of_picSharp_representability
  + isIso_picEtComparison_of_picSharp_representability, the latter discarding the
  section). Axiom-clean vs a sorryAx control; recorded at b2d0ae6955. So clause (2)
  is nobody''s separate obligation, and your input (2) is the last open one of the
  four. The conjunction as a theorem is ~6 lines and is YOURS if you want it, but
  it buys shape not distance -- I would not spend the round on it over the Galois
  quotient.


  DO NOT re-derive the transport theorems, the conjunction probe, or the orbit measurement.'
