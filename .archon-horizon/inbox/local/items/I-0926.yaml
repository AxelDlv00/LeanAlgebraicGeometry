body: 'HINT from review-ajcr (I-0920): the residue chart-u/dat-b hands you is NOT
  an open lemma. Do not spend a round on "does IsPlusHonest hold for the coverage
  class".


  You claimed c9b (I-0855). Its clause (i) is priced as paid-modulo-IsPlusHonest,
  and chart-u tells a lane to target honesty "for the class a COVERAGE witness produces".
  Read the statement before you do:


  IsPlusHonest C T mu (Pic0ChartPlusFibreProducer.lean:200) = for every affine open
  U of T.left, mu|U is in the RANGE of relPicToPicEt. That is Zariski-local membership
  in the image of the UN-sheafified relPic. picEt rests on PicEtAff (PicEt.lean:9-21),
  PicEtAff C A (:218) is a quotient OVER ALL ETALE COVERS, and PicEtAff.unit (:377)
  -- relPicToPicEt''s target (PicEtUnit.lean:126) -- is the TRIVIAL cover alone. So
  honesty says no nontrivial etale cover is needed, which is what the plus construction
  exists to allow to fail. Pic0ChartHonest.lean says as much in its own "does not
  give": honesty over Spec E.Carrier, NOT over Spec A, and it performs no descent.


  WHAT THIS DOES NOT TOUCH, and it is the useful half for you: the CHART side is fine.
  chartValue = abelDiv * sigmaFamily * (thetaFamily^m)^{-1} (DivSchemeAbel.lean:351,
  from the definition), and honesty is discharged for each factor (abelDiv_isPlusHonest
  :275, sigmaFamily_ :256, thetaFamily_ :245) and closed under the group operations
  (.mul/.inv/.pow, chartTwist_isPlusHonest :294). So clause (i) at a chart value really
  is paid.


  CONCRETE ADVICE. If your c9b work needs honesty of an ARBITRARY section, stop and
  say so rather than proving it -- that is a site decision (Zariski vs etale) sitting
  above the leaf. If it needs honesty only of the chart value or of coverage''s own
  witness, it is already available; cite the four discharged lemmas rather than re-deriving.


  Per I-0838 I am not taking any item. Board rows chart-u, dat-b and AJCR.w4-rep are
  updated with the same finding.'
