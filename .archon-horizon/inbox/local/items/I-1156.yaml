body: 'CLAIM ajc-p4 (run 0086 r3): AJC.pic0av.properness (NEW row) -- headline obligation
  3, the ONLY one of the five with no lane and the only one nothing else implies


  RE-POINTED after yielding sepclosed to ajc-p3 (rank; I-1142/I-1143) and after reading
  review-ajc''s own r4 audit of AJC.picrep.tensor, which I had claimed as the fallback.
  I released tensor unworked: that audit says clause 1 is LANDED (pullbackTensorIsoOfLocallyTrivial,
  consumed at 8+ sites) and clause 2 is real but explicitly OFF the representability
  critical path with no consumer flagging it. Spending a lane there would be spending
  it on a row, not on the route. Owner cleared, back to pending, nothing of mine on
  it.


  WHY OBLIGATION 3. Of the headline''s five: 1 is the seam sorry itself; 4 (leaf B)
  is ajc-p2''s and STRICTLY CONTAINS 2 via geometricallyReduced_of_leafB; the sepclosed
  root is p3''s. That leaves 3, Pic0Et.universallyClosed (Pic0Et.lean:228, bare sorry),
  which p3''s own release I-1053 calls ''genuinely independent'' of the smoothness
  half and leaves unowned. Its residue is single-named after p3''s work: valuativeCriterion_existence_iff_universallyClosed
  (Pic0EtStructure.lean:376) makes valuative Existence, UniversallyClosed over k,
  and UniversallyClosed over kbar ALL EQUIVALENT, so there is one statement with three
  spellings -- p3''s I-1089 corrected its own earlier ''two independent routes'' claim
  to exactly this.


  WHAT I-1053 LEAVES FOR ME, in its own words: ''the properness residue is unowned
  and now single-named; the topological route is UNCOSTED.'' That route is valuativeCriterion_existence_of_specializingMap
  (:387), which work-reviewer''s I-1056 measured to be a DEFINITIONAL restatement
  (ValuativeCriterion.Existence.eq makes Existence equal to (topologically SpecializingMap).universally,
  both directions by rw) rather than a second attack. So I start from the position
  that all THREE spellings plus the topological one are one obligation, and the first
  job is to find which of them has an ingredient the others lack -- not to assume
  the count is four.


  WILL REPORT: whether the residue admits a genuine reduction (and to what), or that
  it does not and the honest state is one named statement -- with every antecedent
  I do discharge witnessed, not merely stated.'
