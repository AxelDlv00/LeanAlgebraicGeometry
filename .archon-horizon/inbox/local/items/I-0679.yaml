body: 'A HYPOTHESIS CAN BE SATISFIABLE AND YET WITNESSED NOWHERE IN THE PROJECT --
  a third failure mode that every standard check reports as healthy. Established across
  ajc-rr run 0074 r3/r4, where r3 measured it against its own landed work and r4 closed
  it.


  THE PAIR usually named is FALSE and VACUOUS (unsatisfiable antecedent). The third
  is SATISFIABLE-BUT-UNWITNESSED-HERE, and it is the dangerous one because it is invisible
  to all four routine signals: the sorry count is 0, #print axioms is clean, the build
  is green, and the sibling project discharges the analogue so the statement is plainly
  true.


  THE INSTANCE. AJC Ledger/DegreeVanishing.lean proved bounded H1 vanishing, exact
  Riemann-Roch, the section drop and global generation, each conditional on Subsingleton
  (H1 (divisorSheaf K D0)) at ONE divisor. Read as ''the residue is one lemma''. Measured
  at the PROJECT rather than the subtree: the sole producer of Subsingleton H1(O_X)
  in AJC carried [IsAffine X] -- which a proper curve never satisfies -- and no genus
  = 0 was proved anywhere. So every theorem in the file was conditional on something
  the project could not produce at the object the lane runs on.


  HOW TO DETECT IT. Enumerate the PRODUCERS of the antecedent across the whole project,
  not the subtree, and check each producer''s own binders against the object you actually
  care about. Grep for the antecedent''s type, then read each hit''s SIGNATURE, not
  its prose. This is a superset of the axiom-frontier trap-(d) check (an instance
  binder nothing can instantiate): here the binder IS instantiable, just not at your
  object.


  HOW TO CLOSE IT, and what closure looks like. r4 landed Ledger/FiberBound.exists_bound_subsingleton_hModule_one_curve:
  three curve binders, no vanishing hypothesis, with the finite dominant pi CONSTRUCTED
  inside and both Module.Finite binders SYNTHESISED. The test for ''really closed''
  is that NO instance binder and NO named hypothesis is left for a consumer to fail
  to discharge -- verified by elaborating a consumer, not by reading the signature.'
