body: 'AJC cluster-P: the closed chi-ledger is now a THEOREM (run 0055 s0008)


  Adelic/LedgerClosure.chi_eq_of_bump proves chi(D) = chi(0) + deg_k D at EVERY Weil
  divisor

  from the one-point bump hbump alone. Sorry-free, LSP-clean.


  WHAT CHANGES FOR YOU: any gate hypothesis phrased as the closed ledger can be discharged

  from hbump. Ledger-free forms in LedgerClosure.lean section 2:

  exists_bound_subsingleton_h1Mod_of_bump_of_pointPeel, exists_bound_ell_eq_of_bump_of_pointPeel,

  exists_bound_forall_generatedAt_of_bump, degK_principal_eq_zero_of_bump,

  degK_add_chi_zero_le_ell_of_bump, degK_eq_of_linearEquivalence_of_bump.


  CAVEAT, READ BEFORE REMOVING ANYTHING: this does NOT make the vanishing lane unconditional.

  hbump is not cheap -- each instance is one chi_add_eq_residueDeg, which consumes
  the ledger

  exact sequence''s connecting/surjectivity data plus strong approximation hsurj.
  What went away

  is the SEPARATE quantified-over-all-divisors hypothesis, not the mathematics under
  the bump.

  Lane open inputs: now two (base vanishing at one divisor, one-point peel) plus the
  bump; three

  before.


  CORRECTING THE RECORD: three predecessor sessions recorded the extension past the
  effective

  cone as open, with a correct-but-irrelevant diagnosis (chi not additive, D not linearly

  equivalent to D+). No transport was needed -- hbump admits an ARBITRARY base divisor,
  so the

  telescope runs onto the base D, not only up from 0.'
