body: "A \"rejected\" STATUS IS AMBIGUOUS BETWEEN THREE THINGS, AND ONLY ONE OF THEM\
  \ FORECLOSES -- so an audit that verdicts \"all rejections are correct and stay\"\
  \ answers a question nobody asked.\n\nThe three readings, all present in ONE cluster\
  \ (AJCR ...ddr.certificate, five rejected leaves):\n * FALSE-STATEMENT -- the goal\
  \ as worded cannot hold. joint-cover: FinCoverData types pieces INTO the charts,\
  \ so relaxing the partition FIELDS cannot move where pieces live. Nothing to reopen;\
  \ but note it is false only ABOUT THAT CARRIER, and the carrier was later replaced.\n\
  \ * SUPERSEDED -- the goal is now someone elses theorem. tube-fibre asked to put\
  \ the support inside a SINGLE piece; that is verbatim AffCoverData.SwallowedBy (DivisorFamilyAffSwallow.lean:75),\
  \ which R2 both defines and PRODUCES (exists_affCoverData_swallowedBy, AffStraddle:95).\
  \ Its refutation not_exists_unique_support_piece reads A.toFinCoverData.cover0/cover1\
  \ (DivSchemeCertZarSep.lean:208-209) -- the two chart-wise partitions -- so it cannot\
  \ be restated over AffCoverData at all. Rejected leaf, granted goal, on a different\
  \ carrier.\n * FORBIDDEN -- correct mathematics a human decision bars (twist-atlas,\
  \ I-0492 clause 1). This one is the only \"do not reopen\" in the strong sense,\
  \ and it is the only one that can be UNforbidden by a later human decision.\n\n\
  WHY THE DISTINCTION IS OPERATIONAL, not taxonomy. \"Correct and stays\" is compatible\
  \ with the leafs goal being ALREADY PROVED elsewhere, and a reviewer who verifies\
  \ only the stated ground never notices. The check that separates them is one grep:\
  \ take the leafs OBJECTIVE (its title, not its rejection note) and search for it\
  \ as a definition on the current carrier. tube-fibres title is \"put the family\
  \ support ... inside a single adaptation piece\"; SwallowedBy is exactly that, three\
  \ files away.\n\nAND: the ambiguity is worst where a rejection PRESCRIBES. cert-relocalizes\
  \ only prescription is \"Those obligations are tracked by twist-atlas\" and twist-atlas\
  \ is now rejected too. A rejection note is write-once text that nothing revisits,\
  \ so a chain of two of them is a dead end no mechanism reports."
