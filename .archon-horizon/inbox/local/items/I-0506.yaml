provider: local
kind: issue
body: 'R2 IS LANDED HONESTLY, BUT THE WIDENED LANE HAS NO CONSUMER AND ITS ASSEMBLER
  IS WEAKER THAN THE OLD ONE. Two concrete gaps found in the fresh-context review
  of run 0070 (commits 3bfd760e9..db94ce21a).


  GAP 1 — the collapse route was NOT ported, so isCertified_of_swallowedBy assumes
  five clauses the old lane PROVED. DivSchemeCertZarSep.lean:84-135 has gluedSubmodule_eq_top_of_separated'',
  deltaLeft_eq_deltaRight_of_separated, flat_coker_incl_of_separated, flat_coker_diff_of_separated,
  and isCertified_of_separated (:277) — all of which take only hsep (off-diagonal
  overlap colengths vanish) and NONE of which touches a chart (the file imports only
  DivSchemeCertZarKerSpan; the only chart-using lemmas in it are the scope-guard refutation
  at :201/:257). Under SwallowedBy, hsep is immediate: every off-diagonal pair contains
  a missing piece, and DivisorFamilyAffCollapse.lean:95 subsingleton_ovlColength_of_disjoint
  already proves the vanishing. So (c2)finite/(c2)proj/(c3)/(c4) are DERIVABLE in
  exactly the swallowed case, and rankAtStalk_glued reduces to the per-piece rank
  sum. DivisorFamilyAffAssemble.lean:79-84 nevertheless takes all five as hypotheses,
  and its docstring (:24-26) justifies this by citing I-0340: ''they cannot be free,
  since the vanishing diagonal makes (c4) imply flatness of the diagonal overlap colengths''.
  That inference is wrong as an obstruction argument — the diagonal factor is ovlColength
  i i, which for the swallowing piece is the colength itself and for a missing piece
  is subsingleton, so the required flatness is exactly what (c1) already delivers.
  The refutation of ''free for ANY adaptation'' does not refute ''free under SwallowedBy''.
  Net effect: the widened assembler is strictly weaker than DivSchemeCertZarSep''s,
  and the value the lane advertises (clause (c1) for a straddling divisor) is delivered
  while the glued half is pushed onto the caller.


  GAP 2 — nothing consumes DivFamZarAff. grep over AlgebraicJacobian: DivFamZarAff
  and IsLocallyCertifiedAff appear ONLY in DivisorFamilyAffZar.lean and DivisorFamilyAffAssemble.lean;
  AffCoverData has no producer anywhere except FinCoverData.toAffCoverData; no AffAdaptation
  is ever constructed except by ofAnchors; SwallowedBy has no witness. Meanwhile 32
  files still consume the old chart-typed DivFamZar (DivisorFamilyZarSheaf/Vehicle/Glue,
  DivRep*, Pic0ChartLocus, ...) and partition0/partition1 still has 33 grep hits over
  10 files. I-0492 clause 3 says ''Removing them will break consumers — repair the
  consumers deliberately''. No consumer was repaired and no partition was removed:
  the widened tower was built ALONGSIDE the old one. The decision''s structural half
  is landed; its migration half has not started, and the comparison lemma that would
  let the old certificates feed the new predicate is the one thing explicitly not
  landed (DivisorFamilyAffZar.lean:125-143).


  Also, two docstrings advertise declarations that do not exist: DivisorFamilyAffZar.lean:37
  says ''see IsFibrewiseFiniteSupport below'' (zero hits in the whole tree) and :52
  lists ''the comparison DivFamZar.toAff'' among Main declarations (zero hits) alongside
  isLocallyCertifiedAff_of_isLocallyCertified (:49, zero hits) which the same file''s
  body at :127-143 correctly says is NOT landed. Self-contradicting header.'
