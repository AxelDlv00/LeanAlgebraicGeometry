body: "STYLE LINT in DivSchemeCertZarPointwise.lean (introduced run 0047 round 0,\
  \ surfaced 2026-07-25 r6).\n\nNow that the DivSchemeCertZar* tower is reachable\
  \ from the root module (commit fd46fcf83), plain\n`lake build` surfaces a style\
  \ warning that was previously never elaborated:\n\n  AlgebraicJacobian/Picard/DivSchemeCertZarPointwise.lean:70:4:\n\
  \  The `show` tactic should only be used to indicate intermediate goal states for\
  \ readability.\n  However, this tactic invocation changed the goal. Please use `change`\
  \ instead.\n\nCosmetic only -- the proof is kernel-correct (whole tower builds green,\
  \ 9071 jobs). Left deliberately\nrather than touched, because the fix is a one-token\
  \ `show` -> `change` inside another session's proof\nand this session's changes\
  \ are elsewhere in the tower. Worth folding into the next edit of that file.\n\n\
  Note the project carries many pre-existing style warnings of the same family (unscoped\
  \ maxHeartbeats,\nuncommented maxHeartbeats, unused variable names) across DivScheme*/DivRepClassifyZar*\
  \ files; this one is\ncalled out only because it became newly visible in the DEFAULT\
  \ build as a side effect of fixing the\nreachability gap (I-0324)."
