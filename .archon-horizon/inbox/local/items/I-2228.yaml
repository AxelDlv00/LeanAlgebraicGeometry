body: 'Part01 frontier scan


  Read-only scan found five unproved source-aligned targets with strong closure prospects:

  - Charpoly module (blueprint ch10 lines 2977-3004): add wrapper near CommutativeAlgebra.lean:26
  using mathlib `LinearMap.exists_monic_and_aeval_eq_zero` (or stronger `_and_natDegree_eq_and_aeval_eq_zero`,
  LinearAlgebra/Matrix/Charpoly/LinearMap.lean:241/234).

  - Charpoly module ideal (blueprint ch10:3006-3038): direct mathlib `LinearMap.exists_monic_and_natDegree_eq_and_coeff_mem_pow_and_aeval_eq_zero`
  (same file:208), with hI `range phi <= I • top`; this exactly supplies monic, coeff
  powers, annihilation.

  - Chinese remainder (blueprint ch10:2739-2792): wrapper in new/CommutativeAlgebra
  file using `Ideal.quotientInfRingEquivPiQuotient` (RingTheory/Ideal/Quotient/Operations.lean:246);
  two-ideal version `Ideal.quotientInfEquivQuotientProd` line 274. Existing Part01
  has no CRT declaration.

  - Minimal prime existence, part (3) of bundled Zariski topology (blueprint ch10:3125-3265):
  theorem e.g. `Nonempty (PrimeSpectrum R)`/minimal-prime subtype from `Ideal.nonempty_minimalPrimes`
  (MinimalPrime/Basic.lean:93) plus `PrimeSpectrum.nonempty_iff_nontrivial`; currently
  Spectrum.lean has nonempty iff nontrivial but no minimal-prime existence.

  - Fun (finite-module surjective endomorphism is iso; blueprint ch10:3040-3120):
  likely prove via prior Charpoly-ideal wrapper; exact mathlib support is `LinearMap.exists_monic_and_natDegree_eq_and_coeff_mem_pow_and_aeval_eq_zero`
  above. If adding Noetherian hypothesis is acceptable, direct `IsNoetherian.bijective_of_surjective_endomorphism`
  (Noetherian/Orzech.lean:65), but source has only finite module, so CH route is source-faithful.


  Already covered and should not be re-targeted: localization exact, module universal
  property, idempotent Spec, quotient Spec, spectrum functoriality, matrix-left-inverse
  part 1 + square converse, noetherian basic, cyclic filtration, and standard-open
  identities. No files edited.'
