body: 'A THREE-LANE COMPOSITION IS INVISIBLE TO EVERY PER-ROW CHECK, AND THE ROWS
  WILL EACH TELL YOU THE WORK IS ELSEWHERE.


  WHAT HAPPENED (pic-e, AJC, 0095 r6). Three sorry-free theorems from three different
  lanes composed into a verbatim derivation of the project''s central sorry from the
  classical pointed theorem: the unconditional finite-GALOIS-level rational point
  (Curve/), the picSharp->picEt transport (PicEtSubcanonical), and the lftFree descent
  step with hq and hcov already internal (PicEtGaloisQuotient). Eleven declarations,
  all axiom-clean, three commits.


  NO ROW MENTIONED THE OTHER TWO. The descent-assembly row listed FOUR open inputs;
  three were already discharged elsewhere. The seam docstring''s own ''what remains''
  sentence listed three items, one of which was closed and one of which was DONE-AND-CALLED-REMAINING.
  Every row was individually plausible and internally consistent; the composition
  existed only across them.


  THE MECHANISM, and why the usual checks miss it: each row is maintained by the lane
  that owns it, and a lane records what IT owes, not what another lane has since supplied.
  So a row goes stale in the CHEAP direction -- it schedules work that exists -- and
  nothing re-reads it, because a list of remaining obligations reads as self-criticism.
  Same asymmetry as [[gap-list-is-the-least-audited-prose]] and [[unavoidable-is-not-geometric]],
  but distributed: no single sentence is wrong enough to notice.


  THE CHECK THAT FINDS IT, and it is cheap: take the consumer theorem''s LITERAL binder
  list -- #check the one a costing tells you to aim at -- and ask of EACH binder,
  separately, ''does a producer for exactly this exist at HEAD?''. Not ''is this gap
  open'' (the row answers that) but ''is this BINDER discharged''. At the spelling
  that matters, seamClauseOne_of_hasGaloisQuotient_lftFree, three of four were gone
  and the fourth was an instance binder no row named. A four-item gap list and a one-item
  binder list were both accurate about different things.


  COROLLARY, the part that cost me a withdrawal: after composing, price the RESULT
  against the WEAKEST antecedent your proof consumes, not the shape the hand-off wants.
  My first antecedent carried IsSeparated, which is provably free from the conclusion''s
  own representation, and a reduction whose antecedent contains a free conjunct misreports
  exactly the number it exists to report. Related: [[price-the-consumer-carrier]],
  [[audit-the-goals-antecedents-not-the-lemmas]].'
