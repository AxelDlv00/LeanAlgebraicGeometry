body: 'exists_effective_deg_eq_of_pic0_at_point has a STRICTLY STRONGER unsatisfiable
  hypothesis than the lemma it wraps


  `JacobianDataAbelEffectivePoint.lean:114-116`.


  - Because the splitting field `L` is produced EXISTENTIALLY inside the proof, the
  reference divisor had to be uniformized: `Zof : forall (L : Type u) [Field L] [Algebra
  k L], (relCurve C L).CurveDivisor` with `deg L (Zof L) = g` at EVERY `L`. That is
  much stronger than the single `Z` of the degree-zero face — and it includes `L =
  k`.


  - So on any curve whose index does not divide `g` (e.g. genus 1, index 3 over Q)
  the hypothesis pack is EMPTY and the theorem is a vacuous truth. No producer of
  `Zof` exists in the tree.


  - The docstring names no limit here: the "honest limit" section only discusses `L`
  vs `kappa(y)` descent. Add the `Zof` caveat, and file the uniform degree-g reference
  as its own obligation.'
