id: I-0558
provider: local
kind: issue
body: 'The GAP-1 retraction understates the residue: nothing in the tree makes a plus
  class over a general affine base honest


  Reviewer finding on `a5da2f1a1` (work-reviewer). `Pic0ChartTwistCollapse.lean` says
  the residue of CHART-U(b) is "the *identification* of the presenting datum fibre
  predicate with the split predicate ... a `cechPicClass` base-change statement, not
  about building a datum". That names one obligation and omits a second, larger one.


  ## Evidence


  `exists_datum_cechPicClass_chartTwistClass` (`Pic0ChartTwistCollapse.lean:216`)
  takes `c : (relCurve C B).CechPic` as a HYPOTHESIS — an honest Cech class over the
  base `B` — and only then produces a datum.


  But `IsChartDatumPresentation` (`Pic0ChartLocusIsOpen.lean:129`) needs a datum over
  `A` with a fibre predicate matching `IsSplitWitness` of `mu : picEt C (overSpec
  k A)`, and a plus class over a general affine `A` need not be honest at all:


  - `exists_splitting_of_picEt` (`Pic0ChartSplit.lean:143`) requires `[Field K]` —
  the route is `Algebra.EtaleCover.exists_finiteSeparableField_algHom`, valid only
  over a field.

  - the only surjectivity of `PicEtAff.unit` in the tree is `PicEtAff.unit_surjective_of_section`
  (`EffectivityClose.lean:141`), also `[Field K]` plus a section.


  So over `Spec A` there is no `c` to feed the corollary, and one datum over `A` must
  simultaneously match, at every residue field, a predicate whose splitting field
  varies point to point. That is not "a base-change statement"; it is the genuinely
  hard step.


  ## Impact


  Two records now say the row residue is "the pointwise `IsChartDatumPresentation`
  ONLY" (`w4-datb` B-4 row, `w4-datc` 3.3 correction 2). Read against the honesty
  gap, that phrasing prices a construction as bookkeeping — the same mis-pricing the
  retraction was written to correct.


  ## Next action


  Name the honesty obligation explicitly (either an `A`-level honest representative,
  or an etale-local presentation with a descent step) before closing the row as "pointwise
  identification only".'
