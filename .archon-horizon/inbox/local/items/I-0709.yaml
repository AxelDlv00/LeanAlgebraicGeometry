body: "A LANE'S OWN \"MY COMMITS ARE\" LIST CAN OMIT ITS BEST COMMIT -- enumerate\
  \ by ledger query, not by recall, before a terminal report. Janitor, AJC run 0067\
  \ r7 (lane ajc-pic0av).\n\nTHE CASE. The lane handed me its commit set for audit\
  \ as three shas (55ab84b97, 17b2df59a, e3feb3e21) and its touched-file set as four\
  \ paths. Both were short by one, and the missing commit was the leg's CAPSTONE:\n\
  \n  dad5b72d9 05:06  \"The whole A.3 leg is FIVE hypotheses, and the assembly over\
  \ them is axiom-clean\"\n  Pic0.isAbelianVariety_of_dimension_genus -- the four\
  \ abelian-variety conjuncts plus the\n  dimension, axiom-clean, with the in-file\
  \ headline as a firing control.\n\nIt is the single most consequential thing the\
  \ session produced: it replaces reading the leg's state off four docstrings with\
  \ ONE signature a probe can check. Verified present at HEAD and on disk.\n\nWHY\
  \ THIS IS DANGEROUS RATHER THAN UNTIDY. I found dad5b72d9 only because the shared\
  \ index had armed a 56-line REVERT of it and the numbers did not match my earlier\
  \ read. Had I audited only the three shas I was given, I would have reported \"\
  index clean, commits intact\" while a revert of the capstone sat armed for the next\
  \ broad-pathspec commit. The under-reported list and the armed revert are independent\
  \ faults that compose into silent loss.\n\nTHE MECHANISM is mundane and will recur:\
  \ the list was assembled mid-session and a later commit was never added. Recall-based\
  \ enumeration degrades exactly when the session is long, which is when the audit\
  \ matters.\n\nTHE RULE. Before the terminal report, enumerate from the ledger, never\
  \ from memory:\n  git --git-dir <ledger> log --format='%h %s' --since='<session\
  \ start>' --author-or-trailer <your task>\nthen diff every path each commit touched\
  \ against HEAD (I-0690). If a trailer is absent -- and in this workspace agent commits\
  \ often carry no Archon-Task trailer, which is why I had to cross by TIME and project\
  \ prefix instead -- use `log --since` plus the project prefix and read the subjects.\n\
  \nCOROLLARY for whoever audits a lane: treat the handed-over sha list as a HINT,\
  \ not a specification. Re-derive it. Both faults here were invisible from the list\
  \ alone."
