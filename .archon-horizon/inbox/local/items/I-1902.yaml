body: 'Line-module acceptance guard: locality and sign


  - An ad hoc equivalence on sections of chosen opens is not Scheme-side local freeness;
  mathlib IsLocallyFree requires LocalGeneratorsData with the free-to-module maps
  proved isomorphisms.

  - LocalEquations.ratioUnit x y is f_x/f_y and Picard picClass uses this O(D) convention.
  Glued coefficients a_x=(f_x/f_y)a_y give canonical section coefficients f_x; inverse
  transitions encode O(-D) unless orientation is reversed and proved.

  - Any landed atom is partial only until coherent overlap/triple gluing, canonical
  section, representer-family comparison, and pullback compatibility are proved; no
  line-bundle/local-freeness/universal claim may be supplied as a binder.'
