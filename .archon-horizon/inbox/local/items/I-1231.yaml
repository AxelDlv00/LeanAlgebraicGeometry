body: "A QUOTIENT-LEVEL AND A REPRESENTATIVE-LEVEL STATEMENT ARE THE SAME STATEMENT\
  \ WHEN THE SETOID HAS AN mk_eq_mk_iff -- so \"I stated it in the weaker form to\
  \ avoid a missing lemma\" is a route claim that must be probed in BOTH directions\
  \ before it is published.\n\nWHERE IT BIT (AJCR run 0087 r3, Picard/DivisorFamilyAffClassDegree.lean):\
  \ the author proved a field-collapse in DivEq form (exists_certifiedAff_divEq, \"\
  deliberately weaker, and that is what makes this cheap\") and separately in class\
  \ form (DivFamZarAff.exists_toZarAff_eq, \"stronger than exists_certifiedAff_divEq\
  \ -- it fixes the class, not merely the divisor\"), and built a header argument\
  \ on the gap: the DivEq form \"never re-enters the quotient level, so the missing\
  \ naturality lemma is never called\". Both derivations are 3 lines from the other\
  \ via DivFamZarAff.mk_eq_mk_iff, which is `Quotient.eq` and always exists for a\
  \ quotient by an explicit setoid. So there was no gap, no avoidance, and 50 duplicated\
  \ lines.\n\nTHE GENERALISABLE CHECK. Whenever a quotient `Q := Quotient s` has `mk_eq_mk_iff\
  \ : mk a = mk b <-> s.r a b`, a claim of the shape \"P about representatives is\
  \ weaker than P about classes\" is refuted unless the class-level statement quantifies\
  \ over something the representative-level one cannot reach. Two directions, both\
  \ cheap:\n  forward:  induction F using Quotient.inductionOn; apply the rep-level\
  \ lemma; mk_eq_mk_iff.mpr\n  backward: apply the class-level lemma at `mk d hd`;\
  \ mk_eq_mk_iff.mp\nIf both elaborate, the two are EQUIVALENT and the weaker/stronger\
  \ framing is wrong. Write the two probes before writing the docstring paragraph\
  \ that ranks them -- it costs one scratch file.\n\nTHE COMPOUNDING FAILURE MODE,\
  \ worth naming separately. A route claim of the form \"the form I chose avoids lemma\
  \ L, which nothing supplies\" is doubly checkable, and here BOTH halves failed inside\
  \ one file: (i) L was avoidable in the sense above, but (ii) the same file also\
  \ PROVED L (toZarAff_mapAlg, one line) and USED it in the sibling theorem. When\
  \ you find yourself writing \"avoidable rather than cheap -- recorded because the\
  \ two are different findings\", grep your own file for the lemma first: if it is\
  \ present and consumed, the sentence describes a file that does not exist.\n\nCf.\
  \ memory `unfolded-class-is-not-a-reduction` and `bijection-repricing-is-coordinates`:\
  \ same family -- a repricing announced from one direction of an equivalence."
