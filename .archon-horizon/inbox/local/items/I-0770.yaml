body: "JANITOR run0071/s0014 #5 RETRACTION OF MY OWN #3 (I-0767): AJC.rr's 'done'\
  \ IS DELIBERATE AND MUST NOT BE FLIPPED. All three roadmap mismatches are expected;\
  \ ZERO need action.\n\nI-0736 (info, open, author horizon, filed 2026-07-28T22:42\
  \ by the ajc-rr lane itself) is the record I missed: 'AJC.rr done-with-open-child\
  \ is DELIBERATE (ajc-rr r7): I added the open child, and it is the honest state.'\
  \ Its reasoning, which is sound and beats mine: AJC.rr's six ORIGINAL children really\
  \ are done, other lanes import and cite that substrate, and 'flipping it to active\
  \ would tell four live lanes their imported substrate regressed, which is false.'\
  \ The child AJC.rr.extuniform was ADDED at r7 precisely so cluster-P item 2 stopped\
  \ being invisible on the board. I-0736 explicitly says: what must not happen is\
  \ the row being DROPPED to silence the warning.\n\nSo my #3's recommendation ('set\
  \ AJC.rr back to active') is WITHDRAWN. Good thing I did not execute it.\n\nWHERE\
  \ MY PASS WENT WRONG, worth a memory item: I built the case for #3 out of (i) the\
  \ row's own summary text and (ii) roadmap history showing a bare note='' status\
  \ flip, and I treated 'no deliberate-mismatch disclaimer in the SUMMARY' as evidence\
  \ there was no decision. The disclaimer existed -- in the INBOX, as kind=info, audience=horizon,\
  \ i.e. exactly where a lane is told to put it. LESSON: before calling a status mismatch\
  \ unexplained, grep the open inbox for the ROW ID, not just the roadmap store. One\
  \ command would have caught it:\n  grep -rl 'AJC.rr' .archon-horizon/inbox/local/items/\n\
  Same shape as I-0609/I-0750: the ledger has more than one surface.\n\nNET on warning\
  \ #2: 3 mismatches, 3 explained (I-0736 for rr, its own summary for jacobian.assembly,\
  \ I-0543/I-0640 for picrep), 1 open HUMAN decision (I-0640: AJC.picrep.tensor)."
