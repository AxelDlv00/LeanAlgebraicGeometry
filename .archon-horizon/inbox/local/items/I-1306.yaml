body: "RELEASE ajc-p2 (run 0084 r4): AJC.picrep.etale-rep.descent-assembly -- ADVANCED,\
  \ seam sorry untouched. Owner cleared, status active, pinned f64de9d18d.\n\nDO NOT\
  \ REDO. Picard/PicEtDescentAssembly.lean, rooted, 5 decls, 0 sorries, GATE-FREE\
  \ (verified by I-1292's method: one variable line carrying only field binders, zero\
  \ bracketed gate binders under any qualification), all axiom-clean [propext, Classical.choice,\
  \ Quot.sound] vs fgaPicardRepresentability firing sorryAx. lake build AlgebraicJacobian\
  \ EXIT=0, 8873 jobs, no sorry warning from the module.\n * picEt_injective_restrict_baseTest\
  \ -- restriction along T x_k Spec k' -> T is INJECTIVE on picEt-classes; arbitrary\
  \ field, arbitrary finite separable k'/k, arbitrary test. The content is the reduction\
  \ from picEt_ext_of_pullback_agrees's sieve-indexed hypothesis to the SINGLE cover\
  \ morphism. Non-avoidability MEASURED, both routes EXIT=1 (see the docstring; re-run\
  \ them rather than trust it).\n * existsUnique_amalgamation_picEt_fieldCover --\
  \ a compatible family has a UNIQUE amalgamation, so the class-level descent is COMPLETE.\n\
  \ * representableByRestrict_of_baseChange -- the k'-side input transported, free\
  \ from picEt_crossBaseIso.\n\nWHY IT WAS WORTH A ROUND: the repair's four inputs\
  \ each had a lane or were landed and NOTHING STATED THE THEOREM THEY FEED (census\
  \ re-run independently by review-ajc, I-1256). A scoreboard of antecedents with\
  \ no goal cannot show a missing input.\n\nTHREE CORRECTIONS ON RECORD: mine (I-1280,\
  \ 'surjectivity is the sharp residue' -- too pessimistic, amalgamation is free);\
  \ review-ajc's withdrawn steer to aim at the picSharp endpoint over k, which its\
  \ own project refutes (I-1256); and I deleted one of my own declarations under I-1284\
  \ after out-measuring it myself.\n\nWHAT REMAINS, and none of it is sheaf-theoretic:\
  \ G1 invariance (compatible family from a Galois-invariant k'-class), the G2 scheme-level\
  \ quotient (affine half only), and k'-side representability itself. Of clause (1)'s\
  \ three fields only representability is owed (review-ajc I-1286); p1 has since claimed\
  \ the separatedness field.\n\nNO sorry closed, NO antecedent witnessed at any curve."
