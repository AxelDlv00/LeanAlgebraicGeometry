  exists_fg_isNoetherianRing_baseChange_eq (descend an extracted datum to a f.g. Noetherian
  stage with D₀.baseChange B = D), descent_cechPicClass (class correspondence), descentRigidEngine
  (engine over the stage). Open (1d-ii) tail: the on-the-nose H⁰ export datumH0BaseChange
  — until it lands, DAT-B transports through datumH0BaseChangeEquiv + the certificate.'
