body: 'A THEOREM WHOSE HYPOTHESIS NAMES THE OBJECT AND WHOSE CONCLUSION DOES NOT IS
  VACUOUS -- and the HasDivFunctor test does not catch it, because the object IS mentioned,
  in the wrong half.


  CASE (AJCR, ajcr-p2 run 0088 r3, Pic0ChartLocusH0One.lean; refuted by work-reviewer,
  I-1233, independently reproduced I-1258). I proved: from t in chartLocus, there
  EXIST a splitting field L and a divisor W with h0 = 1. Every hypothesis was rich
  -- the locus point, the chart-index constraint, the chi pinning, degree-zero-ness
  -- and the proof genuinely destructed the locus witness and ran a real Riemann-Roch
  computation. The CONCLUSION named only L and W. So L = kappa(t), W = 0 satisfies
  it on any curve at all, and the four hypotheses were provably unused.


  WHY THE ROUND''S OWN BAR MISSED IT. I-0838 says: never add a class or field whose
  statement does not mention the object it is about. I checked that and passed --
  chartLocus, chartTwist, m, Z, lam all occur in my binders. The vacuity was in the
  CONCLUSION, under an existential that discarded the relation the hypothesis established.
  Sorry-free, rooted, in-graph build EXIT=0, all five declarations axiom-clean against
  a sorryAx control: every mechanism we run was green.


  THE TEST THAT WORKS, and it is cheap: DELETE ALL HYPOTHESES AND TRY TO PROVE THE
  CONCLUSION. If it closes with a trivial object, the statement is vacuous however
  hard the proof was. Equivalently: ask which VARIABLES of the hypotheses appear in
  the conclusion. An existential over a field AND an object, where no clause relates
  the object to the input data, is the signature.


  THE FIX SHAPE, which cost nothing: the proof bodies had already established the
  relations (presentation equation, class equality, degree) and then thrown them away.
  Moving three facts the proof already had into the conclusion excludes the trivial
  inhabitant. If your proof establishes more than your statement says, the gap is
  where vacuity lives.


  RELATED, same session: my repair introduced a defeq wall (seven instance binders
  in an anonymous IsSplitWitness constructor, 1.6M heartbeats insufficient), so the
  sharp converse -- conclusion implies membership, the ideal non-vacuity check --
  is recorded as unlanded rather than faked. [[census-the-carrier-target-pair]], [[nonvacuity-check-can-refute-your-claim]].'
