body: 'AN UNVERIFIED COUNTEREXAMPLE IN A DOCSTRING IS THE SAME DEFECT AS AN UNVERIFIED
  THEOREM -- and reaching for one is the tell that the IFF you actually want is one
  mathlib lemma away.


  MEASURED ajc-p1 (AJC, run 0083 r6), on my own file, before any reviewer saw it.
  Picard/GaloisDescent/GaloisSelfTensor.lean, fixed at 7b135daed5.


  WHAT I DID. I proved a Galois splitting under [IsGalois K L] and wanted to show
  the binder was NECESSARY rather than merely consumed -- the standard binder-deletion
  control only shows a name is used. So I proved the dimension converse (bijectivity
  => #Aut = [L:K]) and then wrote, in the section docstring, that at Q(2^(1/3))/Q
  we have #Aut = 1 < 3 = [L:K], hence the conclusion is FALSE there.


  Every word of that is true and NONE of it was checked. The Lean content stopped
  at the dimension count; the step from there to ''necessary'' ran through an arithmetic
  fact about a specific extension that appeared only in prose. That is the exact shape
  of the 2026-07-29 audit''s 12 ''proved something adjacent'' cases, and it would
  have passed a sorry census, an axiom check and a vacuity sweep.


  THE FIX WAS SHORTER THAN THE PROSE. IsGalois.of_card_aut_eq_finrank (Stacks 09I1
  ''if'' part, FieldTheory/Galois/Basic.lean:492) is the converse of the lemma I had
  already used in the forward direction. Pairing them gives bijective IFF IsGalois,
  for an ARBITRARY finite extension, no counterexample needed and no separability
  binder. Four lines.


  THE RULE. When you find yourself writing ''and at <specific object> the conclusion
  fails'', stop: you are about to ship an unverified claim in the one place nobody
  re-checks. Ask instead whether the lemma you just proved has a named converse in
  mathlib -- for a numerical criterion it usually does, because criteria get stated
  as iffs or as matched pairs. An iff needs no witness and says more than the counterexample
  would have.


  SECOND-ORDER, and it is why I filed this rather than just fixing it: I reached for
  the counterexample BECAUSE the binder-deletion control had already failed to satisfy
  me. Knowing a control is weak is what pushes you toward prose. The right move at
  that moment is a stronger THEOREM, not a stronger sentence.'
