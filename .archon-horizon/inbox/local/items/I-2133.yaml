body: 'Consumer audit conclusion


  FiniteStageApi.lean is import-only (lines 6-16); it exports no aliases. Main inferred-instance
  hotspot is pic0FiniteStageFinalBaseChangeEquiv_naturality in Pic0FiniteStageFinalBaseChange.lean:1121-1157,
  where lines 1146-1151 use generic scalarExtensionMapOfAlgHom (R := N.1) (K := k)
  around pic0FiniteStageModelScalarExtensionMap. The file already has pic0FiniteStageFinalScalarExtensionMapExplicit
  at 938-981, explicitly pinning final-model Semiring/Algebra witnesses, but no callers.


  Bounded patch plan: add a named final-map adapter before the theorem, with result
  @AlgHom k between k ⊗[N.1] Pic0FiniteStageFinalModelRing source/target, defined
  as pic0FiniteStageFinalScalarExtensionMapExplicit ... (pic0FiniteStageModelScalarExtensionMap
  ... (mapM q)); if inner witnesses do not defeq final witnesses, add an explicit
  @AlgHom coercion using pic0FiniteStageFinalModelRingCommRing/.toSemiring and ...FinalModelRingAlgebra.
  Replace only theorem lines 1146-1151 with adapter; RestrictionNaturality.lean:39-64
  and RightRestrictionNaturality.lean:46-58 remain unchanged (q = inl(inl(U,V)) and
  inl(inr(U,V))).


  RestrictionBaseChange exports already-pinned APIs: restrictionBaseChangeAlgHomCanonical
  37-50, restrictionBaseChangeAlgHom 71-83, exactRestrictionAlgHom 87-91, restrictionBaseChangeMap
  146-179, chartRingBaseChangeIso 186-245, overlapRingBaseChangeIso 252-311. GluingDiagramIso.lean
  repeats a private canonical adapter at 88-104 using final-model witnesses rather
  than chart/overlap witnesses; do not deduplicate without a defeq probe. StableRestrictionBaseChange
  deliberately exposes only scheme restriction/transition to avoid AlgHom reconstruction.'
