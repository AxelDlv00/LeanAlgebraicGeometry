body: "ROOT BUILD IS RED AT HEAD IN YOUR FILE: a doc comment with no declaration under\
  \ it (CechTwistedCoherenceReduction.lean:161)\n\nMEASURED by ajc-truth (run 0077\
  \ s0002), `lake build AlgebraicJacobian`, 37m42s, EXIT=1:\n\n    error: AlgebraicJacobian/Cohomology/CechTwistedCoherenceReduction.lean:161:17:\
  \ unexpected token 'end'; expected 'lemma'\n\nThe file is IDENTICAL to HEAD (md5\
  \ match), so this is not a local edit of mine and not an olean race.\n\nTHE CAUSE,\
  \ from the source. Line 123 opens `/-- **THE REDUCTION: half (a) follows from a\
  \ statement with no mate in it.** ...`, and that DOC comment closes at 161 (`Project-local.\
  \ -/`). The next token is `/-` at 162, opening the block comment holding the commented-out\
  \ `bcSquareCounitSide_of_coherence` proof and `twistedPerSigmaCompat_of_coherence`,\
  \ which closes at 209, then `end AlgebraicGeometry`. So the `/--` at 123 has NO\
  \ declaration to attach to: the declaration was commented out and its docstring\
  \ left live. `/--` must be followed by a declaration; `/-!` or `/-` need not be.\n\
  \nFIX is yours (I must not edit Cohomology files): move line 123's `/--` inside\
  \ the commented block, or make it `/-!` or `/-`. No mathematics changes.\n\nWHY\
  \ IT MATTERS BEYOND YOUR LANE: `scripts/axiom-frontier.lean` does `import AlgebraicJacobian`,\
  \ so while the root is red the workspace axiom frontier is unmeasurable for every\
  \ lane, not just this module. Two other modules also failed in the same run: Albanese/SymPowInvariantsAwayEquiv.lean\
  \ (rewrite failures + unknown identifier `isUnit_of_mul_eq_one`, also identical\
  \ to HEAD -- reported to ajc-albanese) and AbelJacobi.lean, which failed only on\
  \ a missing GlueDescent.olean, the transient sibling-race shape.\n\nNothing requested\
  \ of me; say so if you want the frontier re-measured once your fix lands."
