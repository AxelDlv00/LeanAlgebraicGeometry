body: "compactSpace IS quasiCompact restated, and the ambient refutation does not\
  \ turn on it -- both halves of Section 1's novelty claim\n\nSITE: Picard/Pic0EtProperImage.lean:104-119\
  \ (compactSpace docstring), header Section 1 bullet 1, and the closing 'What is\
  \ genuinely new is Section 1 ... the invariant that decides the ambient refutation\
  \ does not apply here'.\n\nMEASURED (fresh-context audit, lake env lean /tmp probes,\
  \ EXIT=0):\n\n(1) Over an affine base the new theorem and the LANDED Pic0EtStructure.lean:189\
  \ quasiCompact are interderivable in one mathlib lemma each way. Backward is the\
  \ file's own proof (QuasiCompact.compactSpace_of_compactSpace); forward is one line\
  \ and was not measured:\n  HasAffineProperty.iff_of_isAffine.mpr (Scheme.Pic0Et.compactSpace\
  \ C) : QuasiCompact (Pic0SchemeEt C).hom\nSo Section 1's first 'unconditional fact'\
  \ is a renaming of a landed one, by the same I-1150 test the file applies to Section\
  \ 2.\n\n(2) AmbientPicNotProper.lean does not turn on CompactSpace of Pic0. Its\
  \ three theorems (:118, :137, :146) quantify over an arbitrary Scheme with an INFINITE\
  \ DISJOINT OPEN COVER; that cover is the load-bearing hypothesis, CompactSpace is\
  \ the intermediate. Its own :136 note says the project does NOT have the cover,\
  \ so the refutation is never instantiated at any Picard object. And the escape is\
  \ already compiler-adjacent in Lean prose at Pic0EtStructure.lean:288-292, which\
  \ cites AmbientPicNotProper by name and says 'quasiCompact above is precisely the\
  \ difference'.\n\n(3) Wrong tower. The refuted route is Pic0AbelianVariety.lean:1508\
  \ universallyClosed_of_ambient on PicScheme C (legacy picSharp, binder [HasPicScheme\
  \ C], no instance). Zero hits in-tree for UniversallyClosed of PicSchemeEt, so there\
  \ was no etale-side ambient route to escape.\n\nNOT REFUTED: theorem true, sorry-free,\
  \ axiom-clean under the binder; the 'necessary not sufficient, NOT a step towards\
  \ the gate' disclaimer is honest and unusually careful. What is overstated is novelty\
  \ and locus.\n\nNEXT ACTION: state Section 1 bullet 1 as 'quasiCompact on the other\
  \ side of HasAffineProperty.iff_of_isAffine', drop 'the invariant by which AmbientPicNotProper\
  \ refutes' (the cover is), name the legacy tower, and cite Pic0EtStructure.lean:288-292\
  \ as the pre-existing escape."
