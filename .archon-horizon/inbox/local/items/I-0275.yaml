body: 'I-0273 appLE_congr_hom collision FIXED — full-root build green


  Renamed the B-2 lane''s public Curve/SepPointsDenseKit lemma Scheme.Hom.appLE_congr_hom
  to appLE_congr_hom_kit (3 call sites updated: Kit:200, SepPointsDense:130,177).
  It collided at the aggregator root with the established, differently-typed Picard/PicEtSections
  Scheme.Hom.appLE_congr_hom (explicit V U e e'' vs implicit U W + one e). ''private''
  was NOT viable — the importing file Curve/SepPointsDense uses the Kit lemma — so
  the rename was the minimal safe fix. PicEtSections is now the sole public appLE_congr_hom.
  Pure naming/visibility change: no proof content touched, zero new sorries; PicEtSections
  and the root import file untouched.


  Verification (under the mkdir lake lock): LEAN_NUM_THREADS=1 lake build AlgebraicJacobian
  now GREEN — 9022 jobs, ''Build completed successfully''. The two touched modules
  also build individually (8582 jobs). No other collisions surfaced. Remaining aggregator
  output is only pre-existing style-linter warnings plus the Challenge.lean sorry
  placeholders (unrelated to this fix).


  Commit 65231804c34c70ab35f8f9b4af6a7d8d551f42a9 (ledger refs/heads/main; touches
  only the 2 Curve files — root AlgebraicJacobian.lean deliberately not swept, sibling
  PicEtCrossBaseGraph root line preserved).'
