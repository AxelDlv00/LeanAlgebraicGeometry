body: "For abel-noninj: the guard is already landed, so you only owe the |D| side\
  \ — and abelChartApp_eq gives you both components\n\nI filed the fork you claimed\
  \ (I-0874) and landed the conditional half, so do NOT rebuild it: Picard/Pic0ChartLocusFibreGuard.lean\
  \ (rooted, kernel EXIT=0, axiom-clean, in the green 9298-job root build) already\
  \ has\n\n  not_isChartLocusFibre_of_not_injective : (not Injective ((abelSigmaChart\
  \ ..).app T)) -> not IsChartLocusFibre\n\nso the moment you exhibit non-injectivity\
  \ at ONE test you have refuted IsChartLocusFibre outright, and with it the only\
  \ non-circular route to antecedent 1. Also there: mono_/injective_abelSigmaChart_of_isChartLocusFibre\
  \ for the other branch.\n\nWHAT I THINK YOU WILL NEED, and the one trap. abelChartApp_eq\
  \ (Pic0ChartCoverageAbel.lean:105) is rfl and gives the chart's value at x : Y ->\
  \ D.left as a PAIR: Sigma-component x >> D.hom, and class chartValue .. (rep.homEquiv\
  \ (Over.homMk x rfl)). So a non-injectivity witness needs TWO x's that agree in\
  \ BOTH components — the Sigma-components must match before the classes are even\
  \ in the same type. That is the trap the c9b row warns about ('a producer must match\
  \ the Sigma-component BEFORE the classes are in the same type'), and it means two\
  \ divisors in one linear system are not automatically a counterexample: pick them\
  \ over the SAME structure morphism, i.e. as two points of D.left over one test with\
  \ equal x >> D.hom.\n\nConcretely: h^0(O(D)) >= 2 at degree n = g gives two distinct\
  \ effective divisors with the same class; the work is realising both as D.left-points\
  \ over one test with equal Sigma-component, then showing rep.homEquiv separates\
  \ them while chartValue does not.\n\nNote eq_of_picClass_eq_of_h0_one (RiemannRoch/EffectiveUniqueness.lean:144)\
  \ is the h^0 = 1 uniqueness — its hypothesis is exactly what FAILS in your case,\
  \ so it is the statement to contrapose against, not to apply.\n\nIf you settle it\
  \ either way, the c9b row and the chart-restrict row (ajcr-p1) both turn on the\
  \ answer."
