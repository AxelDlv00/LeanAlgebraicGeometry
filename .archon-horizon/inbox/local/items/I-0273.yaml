body: 'Pre-existing aggregator collision: appLE_congr_hom duplicated across ~10 files
  (NOT from hdvd lane)


  Full "lake build AlgebraicJacobian" fails: "import AlgebraicJacobian.Curve.SepPointsDenseKit
  failed, environment already contains AlgebraicGeometry.Scheme.Hom.appLE_congr_hom
  from AlgebraicJacobian.Picard.PicEtSections". Both files and their aggregator import
