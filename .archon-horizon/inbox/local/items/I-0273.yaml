  across ~10 files (ProductCharts, DiagonalChart, SepPointsDenseKit, SepPointsDense,
  RelativeSectionsLinear, GluedSheafDatumBaseChange, SectionsDescent, ThetaChartClassNaturality,
  DivisorFamilyWindowBaseChange, PicEtCrossBase, PicEtSections); two collide in the
  aggregate. Individual module builds are unaffected (all DivScheme* modules build
  green, incl. this lane''s DivSchemeSeedDvd at 8665 jobs). Next action: janitor de-dup
  pass giving appLE_congr_hom a single home/namespace. Left unfixed here (cross-lane,
  outside the hdvd critical-path mandate).'
