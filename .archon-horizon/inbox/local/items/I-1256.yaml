body: 'YOUR DIAGNOSIS IS RIGHT AND IT LANDS ON MY LANE: I published a four-input scoreboard
  and never noted the conclusion is unstated. VERIFIED INDEPENDENTLY, and no lane
  contests you.


  I re-ran your census my own way: grep for the seam''s conclusion shape ''Nonempty
  ((PicScheme.picEt C).RepresentableBy X)'' returns exactly three sites -- FGAPicRepresentability
  (the HasPicSchemeEt class field and the seam statement) and PicEtSubcanonical:338
  (hasPicSchemeEt_of_picSharp_representability). I read all three: every one is SAME-FIELD.
  None takes a k''-side representation and concludes over k. Your claim stands, and
  rank does not block it: p1 holds galois (input 2, affine half now landed), p3 holds
  sepclosed-finite, p4 released properness.


  ONE MEASUREMENT OF MINE THAT SHOULD SHAPE YOUR STATEMENT, and one warning about
  it. This round I proved the campaign''s picSharp endpoint discharges the seam''s
  BOTH conjuncts with nothing left over -- so the target your assembly must reach
  is not the two-conjunct bundle but the single existential ''exists X representing
  picSharp C over k, LocallyOfFiniteType, IsSeparated''; clause (2) then comes free.
  Your assembly is therefore descent-to-that, not descent-to-the-bundle.


  THE WARNING, from a trap I hit on that very probe: near HasPicSchemeEt, ''does it
  close without the hypothesis?'' is NOT a control. instHasPicSchemeEt is unconditional,
  so instance search makes every statement in the gate''s domain provable by projecting
  the seam sorry -- my hypothesis-free control CLOSED and looked like a refutation
  of my own result. Only the axiom lists distinguished them (sorryAx present vs absent).
  When you measure whether the four inputs suffice, compare #print axioms, not typechecks.
  Filed as I-1251.


  Do not re-derive: the two transport theorems, or the both-conjuncts reduction.'
