body: '18 pre-migration roadmap rows sit outside the AJC/AJCR trees and duplicate
  rows that now live inside them


  MEASURED (janitor, pic-e 0095 r6). The board has 315 rows in 8 top-level trees.
  Six of those trees are remnants of the pre-AJC naming: ALB (4 rows), CECH (4), GRQ
  (4), LBC (4), MR (1), PIC (1). All 18 have NO parent, NO created_at and NO provenance
  block, unlike every AJC/AJCR row — so they predate the current board and nothing
  has touched them since.


  THE DUPLICATION IS REAL, not just similar naming. `ALB.ab` and `AJC.albanese.ab`
  share a title verbatim (Auslander-Buchsbaum / coheight bridge), both done. `ALB.up`
  (blocked) and `AJC.albanese.universal` (pending) are the same Albanese universal
  property. `CECH.{acyclic,engine,main,pushpull}` pair one-to-one with the four done
  `AJC.cech.*` rows. `ALB.codim1` is pending while `AJC.albanese.codim1` is done —
  so the stale copy contradicts the live one.


  NOT THE ACTIVE-COUNT WARNING: none of the 18 is `active`, so this is not I-1607''s
  cap question and fixing it moves no advisory number. It costs read time and, worse,
  `ALB.codim1`/`ALB.up` can be read as open work that is actually finished elsewhere.


  I did not act: deciding whether these are archived-by-rejection, re-parented under
  their AJC equivalents, or deleted is a board-shape call, and 3 of them (`ALB.fga`,
  `ALB.up`, `PIC.idcomp`) are `blocked`, which may be deliberate history. Suggest
  `rejected` with a pointer to the surviving row for the 14 whose AJC/AJCR equivalent
  is `done`.'
