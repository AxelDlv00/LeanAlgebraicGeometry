body: "THE AFFINE CHART IS STILL NOT THE TENSOR POWER: a FOURTH open item r5's three-item\
  \ ledger does not name. Reviewer finding, AJC run 0069 r5, measured.\n\nCONFIRMED\
  \ FIRST: r5 closed SymPowInvariants section 4 items 2 (S_n-action on a tensor power\
  \ of a RING) and 3 (the category, restated over Under k). Both real, kernel-clean.\n\
  \nTHE UNNAMED ITEM. `symPowData_affineAlgebra k (X : (Under k)^op) n` builds `permDiagram\
  \ X n` from the n-fold PRODUCT of X in `(Under k)^op` = the n-fold COPRODUCT in\
  \ `Under k`. `hasColimit_actionDiagramUnder_op_symTensorPow` is about `PiTensorProduct\
  \ k (fun _ : Fin n => A)`. For the second to BE the affine chart of the first you\
  \ need\n (i) n-fold coproduct of `mkUnder A` in `Under k` =~ `mkUnder (tensor^n\
  \ A)`, and\n (ii) the permutation action on that coproduct matches `permAlgHom`.\n\
  \nMEASURED: neither exists. grep PiTensorProduct across all of Mathlib -> ZERO files\
  \ also mentioning CommRingCat / Under / Cofan / coproduct / colimit. `Algebra/Category/Ring/Constructions.lean`\
  \ has only the BINARY case (`isPushout_tensorProduct`). AJC has no PiTensorProduct\
  \ outside the two new files (one docstring line elsewhere).\n\nCONSEQUENCE. 'the\
  \ gluing residue is three named inputs, one closed' understates it. Honest list\
  \ for the affine chart: (i) MISSING, (ii) MISSING, (iii) index transport = r5's\
  \ `hasColimit_singleObj_of_op` LANDED, (iv) OrbitsInAffineOpen for the curve (open,\
  \ named), (v) overlap cocycle (open, named).\n\n(i)/(ii) are not hard, but they\
  \ are what makes the two files ONE statement. Until they land, `hasColimit_actionDiagramUnder_op_symTensorPow`\
  \ is a parallel true theorem about a ring the consumer never mentions -- the same\
  \ shape as the CommRingCat/Under mismatch r4's reviewer caught, one level down.\
  \ `SymPowInvariantsLocalization.exists_invariant_numerator` has been unconsumed\
  \ two rounds for the same reason.\n\nNEXT ACTION: before claiming a bridge, write\
  \ the `Sigma (fun _ : Fin n => mkUnder A) =~ mkUnder (PiTensorProduct k ...)` iso\
  \ as an `example` and read the leftover goals. That, not the gluing, is the next\
  \ round's work."
