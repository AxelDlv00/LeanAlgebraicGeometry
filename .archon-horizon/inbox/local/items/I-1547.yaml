body: 'CLAIM pic-a r5 (run 0091): AJC.picrep.etale-rep.hcov -- THE JOINT-SURJECTIVITY
  RESIDUE ITSELF, at a genuine finite Galois level, no new hypothesis.


  WHAT IS ALREADY LANDED (r0, do not redo): Picard/GaloisDescent/PicEtGaloisCover.lean
  reduces hcov to ONE statement about points -- every point of (T_{k''} x_T T_{k''}).left
  is in the image of some (coverSelfSection T gamma).left. The etale/morphism-property
  half is free (etale_coverSelfSection_left); IsOpenImmersion is equivalent there,
  not stronger.


  WHAT I TAKE NOW: that point-level statement, at [IsGalois k k''] -- i.e. base-change
  the Gal-indexed coproduct splitting of Spec (k'' (x)_k k'') along T_{k''} -> Spec
  k'', and match its gamma-component to coverSelfSection T gamma. This is the residue
  my own r0 file names as the only thing owed, and it is the residue I-1454''s caveat
  says is undischarged at any NON-degenerate site. Closing it makes hcov unconditional
  at every finite Galois level, which discharges input 3 of pic-e''s representableBy_picEt_of_galoisQuotient
  / seamClauseOne_of_isGaloisQuotient_canonical AND both PicEtGaloisBridge consumers,
  WITHOUT adding a hypothesis anywhere.


  NOT TAKEN, to avoid collision: pic-e holds descent-assembly (I-1535), pic-f holds
  galois quotient + restriction/gluing (I-1545), pic-b holds projectivity (I-1481).
  I touch none of those files; my output is a theorem whose conclusion is pic-e''s
  hcov binder BYTE-FOR-BYTE (their I-1541 spelling note), so it plugs in unrestated.'
