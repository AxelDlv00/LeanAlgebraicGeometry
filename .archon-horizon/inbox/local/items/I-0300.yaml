  π dominant). Needs the parametric local instance instIsIntegralRelCurveCascade (mirrors
  instIsIntegralRelCurveHsub) so genericPoint/IrreducibleSpace of relCurve C L exist
  at STATEMENT elaboration. GOTCHA: relCurve is a non-reducible def, so the IsIntegral
  instance keyed on (C⊗overSpec k L).left does NOT auto-give IrreducibleSpace of relCurve
  C L — restate the instance on relCurve C L.


  (REUSABLE) surjective_fst_left_overSpec (C) (L : Type u) [Field L] [Algebra k L]
  : Surjective (fst C (overSpec k L)).left — first-projection twin of Over.surjective_snd_left
  (Separatedness:200). = MorphismProperty.of_isPullback (P := @Surjective) (Over.isPullback_left
  C (overSpec k L)).flip (surjective_specMap_algHom (Algebra.ofId k L)).


  === ANTI-CIRCULAR ORDERING USED ===

  Certificate-FREE, h z-FREE, hχ-threaded. hη is pure geometry, consumes NO IsGenerator/IsCertified/flat/seedUniv′.
  Preserves I-0289 order: hsub_chart (landed) → hη (landed here) → flat → RD-N → seedUniv′
  → certificate → U1.


  === FLAT-WIRING BLOCKER (step 2) — PRECISELY CHARACTERIZED (sharpens I-0293 germ-bridge)
  ===

  JFlat forall_flat_colength_quotient_of_hsub is PIECE-level (D.sideColengthSubmodule
  z on D.piece z); hsub_chart is CHART-level (range (chartReadMap divUniversalSeedK
  b) ⊆ Γ(V); chartReadMap : ↥K →ₗ Γ(relCurve C R, relPinnedChart C R π b), HinjChart:207).
  Both routes blocked: (A) chart→piece localize (I-0299 resid2) needs h z ⟹ AFTER
