  flattening keystones (SlicingFlatKernel c3 Module.Flat.quotient_ker_… / c4 Module.Flat.quotient_range_…)
  ALL require [Module.Finite R N] on the CODOMAIN; at chart level N = Γ(V) is Module.Free
  R Γ(V) (flat_sections_relPinnedChart via free_relSections) but INFINITE-rank, NOT
