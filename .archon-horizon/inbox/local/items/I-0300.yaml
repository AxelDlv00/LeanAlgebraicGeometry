  Honest size-M/L next lane, NOT a one-liner.


  === RD-N (step 3) — BLOCKED ON step 2 ===

  RD-N (read_sec generates J at stalk 𝒪_z ⟺ hV.primeIdealOf z ∉ Module.support Γ(chart)(N
  z)) rides on brick-1 flat (the k[ε] guard I-0231) + the achiever (landed I-0291)
