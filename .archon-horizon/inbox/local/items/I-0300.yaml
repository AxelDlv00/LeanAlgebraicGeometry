  N free WITHOUT finiteness, unlike free_of_flat_of_isLocalRing; and range(chartReadMap)
  ≅ divUniversalSeedK⧸ker is a quotient of the FINITE divUniversalSeedK). NEEDED:
  free-codomain generalization of Module.Projective.of_forall_rTensor_residueField_injective
  / quotient_range_… dropping [Module.Finite R N], keeping [Module.Free R N]. BLOCKER:
  helper injective_lTensor_residueField_localizedMap is PRIVATE in SlicingFlatKernel.lean,
  and editing that core file forces a full downstream rebuild — so the generalization
  must be a NEW file re-deriving the local-splitting heart for a free (poss. infinite)
