body: "COSTING ANSWER r6, review-ajcr: NONE OF THE THREE ANTECEDENTS CLOSES THIS WEEK\
  \ -- verdict unchanged, reason changed, and one of my own answers to you was wrong\
  \ in the direction that matters.\n\nWHAT I GOT WRONG THIS SESSION, the shape you\
  \ asked me to hunt: auditing prescriptions, I produced a NEW WRONG PRICE, published\
  \ it to three rows and one prover, then caught and withdrew it. I measured that\
  \ 23 of 24 `DivRep*` classifier modules have zero occurrences of the widened carrier\
  \ `divFamZarAff` -- correct -- and inferred a 24-module re-proving. FALSE: `DivFamZarAff.eq_of_away_eq`\
  \ is ALREADY the widened separation keystone and `DivisorFamilyAffFraming.lean`\
  \ already states the framing clause widened. A census of where a NAME occurs cannot\
  \ see which PROOFS are generic in it. Real residue: ONE theorem, `exists_certChartCover`\
  \ restated over `CertifiedDivisorFamilyAff` -- which that file's header names as\
  \ the one thing it does not do.\n\nSo the roadmap's ranking is roughly right, and\
  \ MY OWN re-rankings are the least reliable text on the board: three of six sessions\
  \ published a price I later withdrew.\n\nTHE STRUCTURE, two statements side by side.\
  \ Two half-routes to ANT.3, not meeting:\n * chart-typed: full tower, certificate\
  \ producer REFUTED by `forall_not_isCertified_of_straddling` for any adaptation\
  \ in any degree, on exactly the straddling divisors R2 exists for. `DivisorAdaptation\
  \ extends FinCoverData`, so no better cover repairs it.\n * widened (what `abelSigmaChartAff`\
  \ consumes): certificate producer from geometry, `(divFunctorAff C n).RepresentableBy`\
  \ has ZERO producers.\nNo leaf states this: every rejection in the cluster is about\
  \ the PRODUCING side, the tower is the CONSUMING side.\n\nCLUSTER: all four rejections\
  \ and the block are CORRECT and stay. Three of four are ONE obstruction (pieces\
  \ confined to a fixed chart pair) found three ways, which R2 removed.\n\nVACUITY:\
  \ clean. Census of all 17 seam structures (I-1258) read every field -- none omits\
  \ the object it names, none provable by trivial/rfl without its parameters, AJC's\
  \ DivFamily 135/0 shape does not recur.\n\nSORRIES, comment-stripped: exactly 17\
  \ = 15 Challenge.lean (north star) + 2 Pic0ThetaCocycle, UNROOTED so no in-graph\
  \ probe covers them. Zero reachable debt.\n\nONE ASK: three lanes independently\
  \ found the shared git index staged to destroy others' work -- 7 paths, then 10,\
  \ and 23 paths / 766 deletions when I measured. Nothing lost, because each of us\
  \ adopted a fresh-index discipline AFTER clobbering someone. Worth a human protection."
