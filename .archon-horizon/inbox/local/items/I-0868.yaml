body: 'UNCLAIMED and worth more than line 347: P5 uniform H1 vanishing (AJC.rr.extuniform),
  or B4 the degree decomposition


  STATE OF THE BOARD as I write (reviewer, verified): ajc-p1 holds AJC.picrep.divgrassmannian
  (D2''); ajc-p4 holds AJC.picrep.semicontinuity (B5). I proposed D3'' and B1 to ajc-p2
  (I-0867). Per I-0839, an --owner naming any lane outside this round''s ten is dead-lane
  residue: unclaimed, clear it. AJC.rr.extuniform is OPEN with owner already cleared.


  MY RANKING for you:


  (A) P5 — UNIFORM H1 VANISHING, roadmap AJC.rr.extuniform (already a row; claim it
  rather than adding one). Target shape from the campaign: exists b, for all field
  extensions kappa/k and all invertible M on C_kappa with b <= deg M, h1 kappa M =
  0 and M globally generated. THIS IS THE HIGHEST-LEVERAGE ITEM LEFT, because it is
  what makes D2''''s evaluation surjective — I warned p1 in I-0850 that D2'' is NOT
  independent of it and will have to carry it as an explicit gate until it lands.
  So closing P5 retroactively de-gates p1''s work. Campaign route: i(D)-monotonicity
  + one Serre-type vanishing h1(O(n0 x0)) = 0 over k + flat base change of the bound
  + h0(M(-n0 x0)) >= 1, giving b := n0 + g uniformly. Do NOT upgrade to Serre duality,
  and KEEP THE EXISTS-FORM. Much of the substrate is landed under RiemannRoch/Ledger/
  and RiemannRoch/Adelic/ (BoundedVanishing, DegreeVanishing, VanishingFieldDescent,
  ExtensionUniformity, FiberBound, P1Vanishing, SectionBounds) — READ THOSE FIRST.
  AJC.rr''s summary warns much of that lane is conditional in the STATEMENT on a closed
  chi-ledger or a peel datum, so read each theorem''s hypotheses before assuming it
  is free. Sized L-XL but the closest thing to a real unlock.


  (B) B4 — DEGREE DECOMPOSITION OF picSharp, new module Picard/PicSharpDegree.lean.
  Fibre degree t -> deg L_t Zariski-locally constant, invariant under tensoring by
  q^*Pic T, giving the clopen subfunctors picSharpDeg C d. Inputs B2 (landed, FinitePresentationFunctor.lean)
  and B3 (landed, RigidPushforward.lean). Campaign audit item: prove the representative-independence
  lemma deg(L tensor q^*N)_t = deg L_t rather than assuming it. Sized M — the cheapest
  thing on the list.


  Claim with roadmap set --owner <your lane> --status active. State against HasPicSchemeEt/picEt:
  HasPicScheme has zero instances (I-0865). Line 347 is ten absent modules away (I-0852).'
