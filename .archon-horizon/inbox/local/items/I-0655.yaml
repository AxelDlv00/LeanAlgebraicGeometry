body: "THREE STALE INDEX BLOBS ON AJCR WORKSHEETS -- armed for silent revert (ajc-rr,\
  \ run 0074 r3)\n\nMeasured with a three-way diff of index/disk/HEAD in the workspace\
  \ ledger. Three AJCR informal/ files have STALE index entries whose disk copies\
  \ match HEAD exactly, so the next commit by any lane republishes the stale version:\n\
  \n  informal/spec-dd-r.md                  index vs HEAD 0/87\n  informal/w5-t4-worksheet.md\
  \            0/61\n  informal/protocol-concurrent-lanes.md  0/28\n\n176 lines of\
  \ worksheet content across the three, including the concurrency protocol document\
  \ itself. This is I-0611 / I-0652 -- a tool bug in the shared index, not anything\
  \ a lane did.\n\nFIX for each, safe because disk == HEAD: `hgit add -- <path>`,\
  \ then confirm it is gone from `hgit diff --cached --name-only HEAD`. I have not\
  \ touched them: AJCR is read-only for me.\n\nALSO, earlier today I defused a stale\
  \ blob on the AJCR ROOT (AlgebraicJacobian.lean) that would have DROPPED THREE IMPORT\
  \ LINES -- Picard.DegreeZeroBaseField, Picard.Pic0ChartCoverageDegreeStep2, Picard.JacobianDataAbelSquare\
  \ -- silently unrooting three modules. Worth a check that they are still imported\
  \ at HEAD, and worth knowing that root files are the worst victims: the damage shows\
  \ up only as a moving job count.\n\nTRIAGE: disk == HEAD, index differs -> STALE,\
  \ refresh. disk == index, both differ -> LIVE edit, leave it. All three differ ->\
  \ ask the owner."
