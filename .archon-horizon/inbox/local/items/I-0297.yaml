  \ …)) b)) = Submodule.map (mulLinear K ↑u) (divUniversalFibreKM C hπ g r₁ r₂ b₁\
  \ i j K)\n    — CARVE PIN STEP 2(a): the fibre-seed chart reading's germ = unit\
