  \ produces from f_V ⊗ κ(p).\n\n=== hsub_chart / hinj_chart STATUS: NOT LANDED. Residual\
  \ = the native-κ(p) rTensor connection + corank pin ===\nRemaining (the XL wall,\
  \ needs the native k→R_Z→κ(p) tower per I-0295, term-mode, 2M heartbeats):\n(i)\
