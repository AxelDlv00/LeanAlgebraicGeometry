body: "THE CHART-AVOID COUNTEREXAMPLE IS OFF-STRATUM.  Ground review, 2026-07-26.\n\
  \nThe structural no-go is sound and I am not disputing it: (c1)-finiteness IS leak-freeness\n\
  (DivSchemeCertZarC1.lean), piece traces are clopen in the support (DivSchemeCertZarConn.lean:98),\n\
  FinCoverData types its pieces into the two pinned charts (DivisorFamily.lean:166,:168,:186),\
  \ and\nthe obstruction is DivEq-invariant (DivSchemeCertZarConfine.lean).  Those\
  \ are degree-agnostic.\n\nWHAT IS OVERSTATED is the \"explicit counterexample\"\
  \ that roadmap leaf chart-avoid (c),\nAJCR.w4-rep's master summary, and informal/spec-dd-r.md\
  \ ADDENDUM 3 all lean on:\n  F = t X^2 + X Y + t Y^2 over k[t], with C = P^1 and\
  \ pi = id.\nThat divisor has DEGREE 2 on a curve of GENUS 0.  The campaign's functor\
  \ is\ndivFunctor C pi g / DivFamZar C S pi g with g pinned to the genus by the standing\
  \ hypothesis\nhchi : Sheaf.chi = 1 - g (DivRepClassifyZarSep.lean:147, DivRepAffKit.lean:62),\
  \ and\nIsCertified n's clause (c2) fixes the glued colength's fibre rank to n, i.e.\
  \ n = deg D\n(DivisorFamily.lean:426-437).  So the witness lives in divFunctor P^1\
  \ id 2, NOT in\ndivFunctor P^1 id 0, which is the functor the campaign must represent\
  \ for that curve.\n\nWHY THIS MATTERS RATHER THAN BEING PEDANTRY.  On the campaign's\
  \ own stratum:\n * g = 0: degree-0 relative divisors have empty support and the\
  \ no-go is vacuous.\n * g = 1: degree 1, i.e. a section.  A section CAN meet both\
  \ pinned fibres over a connected\n   base (t |-> [t : t-1] hits 0 at t=0 and infinity\
  \ at t=1), but its support locus is\n   Spec R, so removing one of the two base\
  \ points confines it -- and the certificate gate is\n   pointwise on the base after\
  \ the I-0320 relaxation.  So base shrink DOES evade the no-go at\n   g = 1.  Irreducibility\
  \ over every shrink, which is what makes the exhibited example\n   shrink-stable,\
  \ needs degree >= 2.\n * g >= 2 is where the no-go actually bites, and no witness\
  \ has been exhibited there.\n\nACTION (cheap, and it should be done before p1-aut\
  \ or R2 is costed): produce a genus->=2\nwitness, or state plainly in ADDENDUM 3\
  \ and the roadmap that the counterexample is exhibited\noff-stratum and that the\
  \ on-stratum claim rests on the degree-agnostic structural argument\nalone.  As\
  \ written, a lane reading the roadmap will believe a decisive on-stratum\ncounterexample\
  \ exists."
