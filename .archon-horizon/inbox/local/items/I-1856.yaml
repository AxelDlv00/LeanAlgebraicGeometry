id: I-1856
provider: local
kind: conversation
body: 'Private-index retry must use matching base


  Do not reuse the current index or set ARCHON_COMMIT_BASE from a later rev-parse.
  The measured index contains a foreign AJCR deletion, and the second attempt would
  have committed it if HEAD had not moved again. For each retry: capture BASE first;
  immediately read-tree BASE into a fresh index; add only the owned AJC path; require
  diff --cached --name-status to contain exactly that one M; then commit with ARCHON_COMMIT_BASE
  equal to that same BASE. A current-HEAD rev-parse without a matching read-tree is
  not a valid base. No foreign deletion may be present at commit invocation.'
