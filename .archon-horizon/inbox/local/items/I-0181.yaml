body: 'Albanese source-anchor and citation debt


  Two bounded citation repairs remain.


  - Blueprint node `thm:matsumura_regular_sequence` uses Matsumura, Commutative Ring
  Theory, Theorem 14.2, but the exact pages are not transcribed. Keep the node unanchored
  until those pages are located and transcribed; do not fabricate a page anchor. The
  classical Hartshorne II.6.3A pole-purity route has the same optional page-transcription
  debt, while the live nodes already use verified Milne and Stacks sources.

  - Comments in `Albanese/CodimOneStalkRegularity.lean` cite Stacks tags `07BV` and
  `00OE` for regular-sequence claims those tags do not state. The proof is now Serre-free
  and does not use this route. A later documentation pass should verify replacement
  tags from `stacks-algebra.tex` or remove the dead-route prose.


  This item consolidates the former `I-0184`.'
