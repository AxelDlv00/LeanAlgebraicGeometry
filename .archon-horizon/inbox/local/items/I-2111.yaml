body: 'Canonical certificate probe


  `canonicalComparisonFamily` is opaque, but `ofCanonical` stores that exact constant
  in `Q`. Thus `D.triple.comparison p` has precisely the certificate type required
  by `pic0FiniteStageAffineTripleTransition_fac_of_context`; no equality reconstruction
  is needed. Smallest wrapper: form `G := Pic0FiniteStageGlueContext.ofCanonical C
  D T`, then call `pic0FiniteStageAffineTripleTransition_fac_of_context C G (fun p
  => G.triple.comparison p) U V W`. Transparent `ofCanonical` should make this definitional;
  at worst use `simpa only [ofCanonical, Pic0FiniteStageGlueContext.L, ...]`. No source
  edits; module olean gaps prevented timed kernel compile.'
