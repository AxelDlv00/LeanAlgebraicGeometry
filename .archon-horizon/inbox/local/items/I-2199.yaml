body: 'Kernel base-change comparison skeleton


  Exact APIs: CategoryTheory.Limits.pullbackLeftPullbackSndIso : pullback (pullback.snd
  f g) g'' ≅ pullback f (g'' ≫ g), with likely projection lemmas adjacent in Mathlib/CategoryTheory/Limits/Shapes/Pullback/Pasting.lean.
  This directly rewrites pullback.snd (isogenyKernelToBase f) b (set f:=f.left, g:=η[B].left,
  g'':=b) to pullback f.left (b ≫ η[B].left). Then identify b ≫ η[B].left with the
  identity section of F.obj B (underlying `Over.pullback b`): use `Over.pullback_obj_left/right`
  APIs or `Over.w` plus pullback.lift condition; likely `pullback.congrHom` (h1 :
  f1=f2) (h2 : g1=g2) : pullback f1 g1 ≅ pullback f2 g2. Its inverse is `pullback.map
  _ _ _ _ (𝟙 _) (𝟙 _) (𝟙 _) ...` by `pullback.congrHom_inv`. `CategoryTheory.Limits.pullback.map`
  takes cospans and commuting-square maps, producing map between pullbacks; `pullback.map_isIso`
  gives IsIso when all three square maps are isos. `PullbackCone.ext` can construct
  cone isos from a candidate point iso and projection equalities.


  For a cleaner route, use `pullback.map` to map the iterated pullback to kernel of
  F.map f: source-side map is canonical pullback comparison; target-side identity;
  prove commuting equations by `pullback.condition`, `Over.w f`, and simp. The associativity
  iso `pullbackAssoc` also exists: `(pullback.snd _ _ ≫ f3) × ... ≅ ...`, but `pullbackLeftPullbackSndIso`
  exactly matches nested `pullback.snd`.


  Over APIs: `CategoryTheory.Over.pullback : Over Y ⥤ Over X`; `Over.pullbackComp
  f g : pullback (f≫g) ≅ pullback g ⋙ pullback f`; `Over.pullback_associativity` (AJC
  helper) handles coherence. `pullbackRightPullbackFstIso_hom_fst/snd` and inverse
  projection lemmas are available if orientation is swapped. No edits.'
