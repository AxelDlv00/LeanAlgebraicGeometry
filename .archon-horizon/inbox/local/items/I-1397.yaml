id: I-1397
provider: local
kind: issue
body: 'UNUSED-HYP AGAIN, same lane, same session as I-1356''s lesson: card_aut_eq_finrank_of_galoisSelfTensorHom_bijective
  carries [FiniteDimensional K L] and does not consume it.


  SITE: Picard/GaloisDescent/GaloisSelfTensor.lean:256-263 (at HEAD, 306-line version).


  MEASURED work-reviewer, lean_run_code, oleans current (lake build AlgebraicJacobian
  EXIT=0, 8879 jobs; lake env lean on the file EXIT=0). The body verbatim with [FiniteDimensional
  K L] DELETED from the signature elaborates clean, no diagnostics. lean_minimal_hypotheses
  reports only the explicit (h : Bijective ...) and SKIPS instance binders, which
  is exactly where this defect lives -- so that tool cannot catch this class of error
  and was not sufficient here.


  WHY IT IS FREE: the proof is LinearEquiv.ofBijective + finrank_eq + finrank_baseChange
  + finrank_fintype_fun_eq_card. finrank of a non-finite-dimensional module is 0 by
  definition, so both sides degenerate consistently and no finiteness is needed; [Fintype
  (L ~=a[K] L)] is the only finiteness the statement reads, and it is an explicit
  binder already.


  CONTROL that the environment discriminates: in the same probe run, finrank_pi_aut
  with [IsGalois K L] deleted FAILS (synthInstanceFailed on IsGalois K L), and with
  [FiniteDimensional K L] deleted FAILS (synthInstanceFailed, twice, plus AlgEquiv.fintype
  unavailable). galoisSelfTensorHom_surjective with [IsGalois K L] deleted FAILS (galoisCol_span
  needs it). So three of the four declarations genuinely consume both binders; only
  this one does not. Not the stale-import artifact of I-1057.


  CONSEQUENCE, and it is small but it is the docstring: line 68 says ''No hypothesis
  beyond [FiniteDimensional K L] [IsGalois K L]'' -- true of section 2, and section
  3''s dimension count needs LESS than that. The iff galoisSelfTensorHom_bijective_iff_isGalois
  DOES need FiniteDimensional (AlgEquiv.fintype + IsGalois.of_card_aut_eq_finrank),
  so the fix is one binder on one theorem, not a restructure.


  I-1356 was filed against this same lane THIS SESSION for the identical defect one
  directory over. The lesson did not transfer because the check that would have caught
  it (lean_minimal_hypotheses) does not inspect instance binders. The durable fix
  is to probe instance binders by re-elaboration, not by that tool.'
