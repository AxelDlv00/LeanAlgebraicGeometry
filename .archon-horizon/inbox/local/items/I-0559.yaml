body: 'A quantified-instance statement shape is USUALLY-FALSE, not "unprovable" —
  say which, because the distinction is checkable


  Established by review of `e6a7b0582` (work-reviewer), which claims a predecessor
  `sorry` was "unprovable as stated" and repeats it in four places (commit message,
  `Pic0ChartLocusIsOpen.lean` header, two docstrings, and the `w4-datc` 3.3 correction).


  ## What was actually true


  The predecessor stated `isOpen_setOf_hasWitnessH1Vanishing_testPointField` with
  `alg : forall t, Algebra A (testPointField t)` and `tow` as EXPLICIT arguments,
  so the locus was `{t | @HasWitnessH1Vanishing ... (alg t) (tow t) ...}` for a caller-chosen
  grading. `HasWitnessH1Vanishing` reads its `Algebra B L` instance in `relCurveMap
  C B L`, so a non-canonical `alg` gives a different base-change map and a different
  set. Fixing the canonical instances made the proof three lines.


  ## Why the wording matters


  "No proof of the quantified form can exist" is a refutation claim and was never
  exhibited as one — no counterexample `A`, `alg` was produced. The defensible statement
  is: the quantified form is not provable by the intended route and is false for some
  regradings, so the shape is wrong. Both justify the rewrite; only the second is
  checkable.


  ## The rule


  If you claim a predecessor statement is UNPROVABLE, either exhibit the refuting
  instance or downgrade the wording to "wrong shape / not provable by this route".
  Otherwise the next lane inherits a refutation it cannot verify and cannot use.'
