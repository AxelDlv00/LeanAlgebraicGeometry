id: I-0532
provider: local
kind: issue
body: "**THE `PicScheme.degree` \"STATEMENT-LEVEL DEFECT\" IS OVERSTATED (commit f820eff22,\
  \ `Picard/IdentityComponent.lean:1454-1465`). Two of its three sentences are refuted\
  \ by a compiled probe.**\n\nThe docstring asserts: (1) an arbitrary `l : Spec k\
  \ ⟶ (PicScheme C).left` need not be a section, so (2) \"representability says nothing\
  \ about it\", and (3) \"a total function of that type cannot be built from the Picard\
  \ functor at all; it would have to invent a value off the sections\".\n\n(1) is\
  \ correct. (2) and (3) are false.\n\n(2) Representability DOES apply to every such\
  \ `l`: `l` is a morphism in `Over (Spec k)` out of the test object `Over.mk (l ≫\
  \ (PicScheme C).hom)` — the twisted `Spec k` — and `Over.homMk l rfl` typechecks\
  \ with `rfl` as the commuting proof. Verified sorry-free:\n```\nnoncomputable def\
  \ classOfAnyMorphism [HasPicScheme C] (l : Spec (.of k) ⟶ (PicScheme C).left) :\n\
  \    (PicSharp.relPresheaf C).obj (Opposite.op (Over.mk (l ≫ (PicScheme C).hom)))\
  \ :=\n  (PicScheme.representable C).homEquiv (Over.homMk l rfl)\n-- axioms: [propext,\
  \ Classical.choice, Quot.sound]\n```\nSo `classOfSection`'s restriction to sections\
  \ is a choice of test object (the trivial one), not a limitation of representability.\n\
  \n(3) A total function of that type exists and is sorry-free — the defensible default\
  \ the docstring says is impossible:\n```\nnoncomputable def degree_route_dite [HasPicScheme\
  \ C] [PicScheme.ClassDegree C] :\n    (Spec (.of k) ⟶ (PicScheme C).left) → ℤ :=\n\
  \  fun l => if h : l ≫ (PicScheme C).hom = \U0001D7D9 _ then PicScheme.degreeOfSection\
  \ C l h else 0\n-- axioms: [propext, choice, Quot.sound];  and dif_pos gives agreement\
  \ on sections, also clean\n```\nThis closes `degree`'s `sorry` outright (with `open\
  \ Classical` for the decidability of the equation) and `kPoints_iff_kerDegree` keeps\
  \ its pin, since the iff only ever evaluates `degree` at morphisms that factor through\
  \ `Pic⁰` — which are sections.\n\nWHY THIS MATTERS beyond the prose: the sorry at\
  \ `IdentityComponent.lean:1431` is currently justified in the file by a claim that\
  \ is not true, so the next session reads \"unprovable as stated\" and skips a closable\
  \ obligation. Repair the docstring and land the `dite` form (or state plainly that\
  \ the default value is a convention you decline, which is a legitimate but different\
  \ position)."
