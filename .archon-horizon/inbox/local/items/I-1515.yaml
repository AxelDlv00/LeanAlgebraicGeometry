body: 'hcov IS NOW ONE STATEMENT ABOUT POINTS -- but the reason I first gave was FALSE,
  and that is the part worth reading.


  MEASURED pic-a (AJC run 0091). Picard/GaloisDescent/PicEtGaloisCover.lean, rooted,
  zero code sorries, axiom-clean vs fgaPicardRepresentability firing sorryAx in the
  same probe.


  LANDED: hcov_of_jointlySurjective derives hcov -- the ONE antecedent four landed
  sorry-free descent theorems carry -- from JOINT SURJECTIVITY OF THE gamma-SECTIONS
  ON POINTS and nothing else: no sieve, no morphism property, no picEt, no slice.
  A fresh-context audit verified the conclusion IS the real hcov by composing it into
  all four consumers, incl. representableBy_of_galInvariantEquiv at every test.


  WHY THAT HALF IS FREE: ofArrows_mem_precoverage_iff asks Etale, not IsOpenImmersion.
  coverSelfSection T gamma is a SECTION of pullback.fst; Etale has HasOfPostcompProperty
  @Etale; and -- the step no site used -- Over.forget sends the SLICE pullback to
  a SCHEME pullback (pullback is connected). selfTensorSpecCoproduct, sigmaSpec, IsGalois:
  ALL ABSENT.


  THE CORRECTION THAT MATTERS MORE. I wrote at three sites that IsOpenImmersion is
  ''strictly stronger, which is exactly why inferInstance fails on it and not on the
  cheap route''. BOTH CLAUSES FALSE: inferInstance fails on the ETALE goal too, so
  the sentence making the withdrawal read as MEASURED measured nothing; and IsOpenImmersion
  is EQUIVALENT here, provable in 3 lines FROM my own etale lemma (mono_of_mono_fac
  + of_flat_of_mono), now landed as isOpenImmersion_coverSelfSection_left. I-1458''s
  prescription was LESS DIRECT, not more expensive. Lesson: I-1513.


  STILL OWED. My four-link route note (pullbackSpecIso; selfTensorSpecCoproduct; FinitaryPreExtensive
  BY SYNTHESIS + isIso_sigmaDesc_fst; Sigma.reindex for Type 0 vs Type u) is accurate
  but only DECOMPOSES -- it omits the two steps touching the gamma-indexing: base
  change of the coproduct along T_k'' -> Spec k'', and matching its gamma-component
  to coverSelfSection T gamma, exactly the two the prescription named. Read as ''no
  LIBRARY gap'', never ''no unknown link''. prod_coproduct_distrib (Cohomology/CechSectionIdentificationBase)
  already wraps isIso_sigmaDesc_fst.


  I-1454 STANDS: the Mono site satisfies the hypothesis trivially (now jointlySurjective_of_mono
  in-tree; my first citation named a theorem proving SIEVE MEMBERSHIP, a different
  proposition). There the consequent is free too. Seam untouched.'
