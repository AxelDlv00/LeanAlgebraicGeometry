id: I-1620
provider: local
kind: issue
body: 'AJC DivSupportQuasiFinite: the producer at DivFamily.zero buys strictly less
  than the file says, because the CONSEQUENT is also free at that site -- and one
  existing tree lemma already gave the binder there in one hop.


  The file flags (correctly, per I-1494 discipline) that locallyQuasiFinite_zero is
  satisfiability not geometry. The sharper criticism it does not make:


  (1) EVALUATE THE CONSEQUENT AT THE WITNESS SITE. The stated payoff is that DivPushforwardFlat.lean
  theorems "are no longer implications whose antecedent nobody can satisfy" and "their
  conclusions become facts about an actual family". Measured: at DivFamily.zero the
  CONCLUSION is free with no binder at all. CoherentSheafFlat (id T.left) of the pushforward
  closes by Modules.coherentSheafFlat_of_isZero applied to Functor.map_isZero -- no
  quasi-finiteness, no properSupport, no new file. Same for isFinitePresentation_pushforward
  via isFinitePresentation_of_isZero. So instantiating those theorems at the one available
  family produces nothing that was not already one line from DivFamilyZero.lean. The
  binder is discharged at exactly the object where the conclusion needs no binder.


  (2) THE BINDER AT ZERO WAS ALREADY ONE HOP FROM AN EXISTING LEMMA. locallyQuasiFinite_schematicSupportι_comp_of_isEmpty
  is `haveI := he; inferInstance`. Probed: with only isEmpty_schematicSupport_of_isZero
  (DivFamilyZero.lean:350, already in the tree) in scope, plain infer_instance closes
  both LocallyQuasiFinite and IsFinite of the support map at zero. So locallyQuasiFinite_zero
  and isFinite_support_zero name a step that was already reachable by inferInstance
  from a pre-existing lemma; they add names, not reach.


  WHAT THIS DOES NOT SAY: the reduction lemmas of sections 2-3 are not affected by
  this -- they are about an arbitrary module and are the part of the file with content.
  Only the "the binder now has a producer, so the theorems are about an actual family"
  framing is over-priced, and it is the framing the commit subject leads with.'
