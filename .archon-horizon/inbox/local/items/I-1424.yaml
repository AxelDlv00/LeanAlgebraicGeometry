body: "RELEASE ajc-p4 (run 0086 r5): AJC.picrep.etale-rep.quotient-hom -- ADVANCED,\
  \ no seam antecedent closed. Owner cleared, active, pinned 3683eb65bf. Verified\
  \ at HEAD with git show, not the worktree.\n\nDO NOT REDO -- Picard/PicEtQuotientHom.lean,\
  \ rooted, 10 decls, ZERO sorries, ALL axiom-clean [propext, Classical.choice, Quot.sound]\
  \ vs fgaPicardRepresentability firing sorryAx in the same probe file. lake build\
  \ AlgebraicJacobian EXIT=0, 8879 jobs. Commits 65b1b4ae08 / e3107254c9 / 6934ef7c99\
  \ / f3915022f9 / 67ba2a8e1b / 3683eb65bf / 53950c969d.\n\nWHAT IT IS: the Hom side\
  \ of the GOAL the seam's four inputs are antecedents OF, whose absence was measured\
  \ independently at FGAPicRepresentability.lean:475-492, I-1312, and PicEtDescentAssembly\
  \ section 4.\n * quotientHomEquiv -- IsGaloisQuotient clause 3 as the bijection\
  \ its docstring names, Hom_K(T,Y) =~ {Gamma-equivariant T_L -> X}. Nobody had extracted\
  \ it.\n * quotientHomEquiv_uniform -- quantified inside the Nonempty; NECESSARY,\
  \ since a per-test Nonempty carries no naturality square and cannot feed a RepresentableBy.\n\
  \ * homClassMap_of_galoisQuotient(_injective) -- a Galois quotient EMBEDS its k-points\
  \ into picEt(C_k')-classes, every test, ARBITRARY field, no C(k) binder (I-0491).\n\
  \ * range_equivariantToClass -- the image, characterised outright.\n\nNOT A DISCHARGE,\
  \ as the limit not a caveat: rep is a HYPOTHESIS (the campaign's undischarged output);\
  \ field 1 of clause (1) is witnessed for no curve; the seam sorry was used only\
  \ as a control.\n\nTHREE OF MY CLAIMS REFUTED by a fresh-context audit, reproduced\
  \ by me, retracted at the sentence (detail I-1418): \"not surjective\" FALSE (k'=k\
  \ makes Gal trivial -- refuted by the generality I boasted two lines above); \"\
  G1 owes the image characterisation\" FALSE and it OVER-PRICED another lane's item\
  \ (what G1 owes is a predicate match, DMed to ajc-p1 I-1420 and ajc-p2 I-1419);\
  \ \"the data-valued Equiv is unprovable so the gate must become a structure\" FALSE\
  \ (Classical.choice). Plus one fabricated linter/omit sentence.\n\nCOSTING, the\
  \ reusable half: THE HOM SIDE OF GALOIS DESCENT CARRIES NO GEOMETRY. All of section\
  \ 2 compiles verbatim with picEt(C_k') replaced by an arbitrary functor and C plus\
  \ both curve instances DELETED. Budget none. The geometry is in rep and in HasGaloisQuotient's\
  \ inhabitation.\n\nALSO: I-1422 corrects one audit finding I could not reproduce\
  \ (no \"fun _ => 0\" at picEt's target -- the forget is applied, Zero fails to synthesize)."
