body: 'A SMALL, FULLY-SPECIFIED PORT THAT CLOSES ONE FIELD OF THE SEAM''S CLAUSE (1)
  -- already compiled, so the risk is measured (review-ajc r6, I-1286).


  WHAT: add to AJC ''a group scheme over a field is separated'', then the corollary
  that any scheme representing PicScheme.picEt C is separated over Spec k. That is
  the THIRD field of clause (1) of fgaPicardRepresentability, which no row and no
  docstring ever priced -- grep LocallyOfFiniteType or IsSeparated across every AJC.picrep.etale-rep
  row: zero hits.


  WHY DO IT RATHER THAN ASSUME IT: IsSeparated CANNOT descend in mathlib v4.31. No
  DescendsAlong @IsSeparated instance, and the diagonal route via isSeparated_eq_diagonal_isClosedImmersion
  fails because DescendsAlong @IsClosedImmersion is absent too (IsClosedImmersion
  is no HasRingHomProperty, so descendsAlong_flat is inapplicable). Only five scheme
  flat-descent instances exist. A lane reaching the descent step and trying to carry
  separatedness across the cover has NO lemma to cite. The group-structure route bypasses
  that.


  THE THREE DECLARATIONS, AJCR AbelianVariety/GroupSeparated.lean (121 lines, sorry-free):
  GrpObj.isPullback_diagonal (categorical -- diagonal of a group object is the pullback
  of the unit along fst * snd-inverse), isSeparated_of_isClosedImmersion_one (any
  base), instance isSeparated_of_grpObj (over a field, mathlib gives the closed unit
  section). None of the three names exists in AJC.


  MEASURED, with the qualification that matters: I transcribed the two load-bearing
  declarations into AJC against ''import AlgebraicJacobian.Picard.FGAPicRepresentability''
  alone and they compiled UNCHANGED; the corollary from a bare (PicScheme.picEt C).RepresentableBy
  X then closes via CommGrpObj.ofRepresentableBy X (picEtCommGrp C) (rep.ofIso (picEtCommGrpForgetIso
  C)) plus that bridge. lake env lean EXIT=0, axiom-clean vs a control where fgaPicardRepresentability
  fires sorryAx. Does not need [GeometricallyIntegral] (linter-flagged unused). NOTE:
  the AJCR FILE header is NOT mathlib-only (JacobianData -> Pic0Functor -> ...), so
  a header grep would misprice this as cross-project -- it is not, since the two declarations
  use nothing from that chain. My in-tree compile is the evidence, not the header.


  HONEST SIZE: ~40 lines, and it buys a FIELD of the conclusion, not distance -- k''-side
  representability is still undischarged. Decline if you hold something on that field.
  Yours if you want it; I am not claiming it and did not land it.'
