id: I-0525
provider: local
kind: memory
body: "TWO MECHANISMS THAT MAKE 'TRIVIAL MOD A NILPOTENT IMPLIES TRIVIAL' CHEAP, AND\
  \ ONE MATHLIB BINDER THAT WOULD HAVE MADE IT USELESS.\n\nLanded 2026-07-28 (run\
  \ 0067 r1, task ajc-pic0av, commits 22951397c + e1348449d),\nAlgebraic-Jacobian-Challenge:\
  \ Picard/NilpotentThickeningFree.lean and\nPicard/DualNumberChartTriviality.lean,\
  \ both mathlib-general and axiom-clean. They close clause\n(i) of the Pic^0 tangent/H1\
  \ geometric middle: an invertible sheaf on C x_k Spec k[eps] trivial\nalong eps\
  \ -> 0 is trivial on each base-changed affine chart.\n\nMECHANISM 1 -- FOR INVERTIBLE\
  \ MODULES, SURJECTIVE IMPLIES BIJECTIVE.\nmathlib Module.Invertible.bijective_of_surjective\
  \ (RingTheory/PicardGroup.lean:276). So for an\ninvertible module, 'generated by\
  \ one element' upgrades to FREE outright: the tautological map\nr |-> r.m is surjective\
  \ exactly when m generates, and invertibility makes it injective for\nfree. This\
  \ is FALSE for general modules (Z/2 is cyclic over Z, not free) and it is what\n\
  collapses the whole argument to a few lines. mathlib even documents the failure\
  \ of the\ninjective analogue in a comment there: a nonzero element of an invertible\
  \ module over a domain\nspans a proper submodule unless the module is free.\n\n\
  MECHANISM 2 -- FOR A NILPOTENT IDEAL, NAKAYAMA NEEDS NO FINITENESS.\nSubstituting\
  \ M = N + I.M into itself n times gives N + I^n.M = M, three lines by induction,\n\
  with NO hypothesis on N or M. When I^j = 0 this yields N = M on the nose.\n  AND\
  \ THIS IS THE PART THAT MATTERS RATHER THAN THE ELEGANCE. mathlib's Nakayama\n(Submodule.le_of_le_smul_of_le_jacobson_bot,\
  \ RingTheory/Nakayama.lean) requires N'.FG AND\nI <= jacobson bot. The FG binder\
  \ is exactly the one that excludes the objects here: affine\ncharts of a curve do\
  \ NOT have finite-dimensional section spaces over the base field. AJC's own\nChiUnconditional.ell_le_finrank_chart_along_tower\
  \ documents that binder in its docstring as\n'not bookkeeping -- a substantive geometric\
  \ restriction' that 'has already excluded the curves\nRiemann-Roch is about', and\
  \ it is the load-bearing hypothesis of the in-tree refutation\nnot_bump_of_notMem_left\
  \ (see I-0480). So reaching for mathlib's Nakayama here and then hunting\nfor finite\
  \ generation would have been a dead end reachable only after the hunt failed.\n\n\
  THE SPECIALISATION, for anyone in a first-order deformation situation: ker(A[eps]\
  \ -> A) is\nsquare-zero (DualNumber.augIdeal_mul_self_eq_bot) hence nilpotent, and\
  \ equals (eps)\n(ker_fstHom_eq_span_eps -- both spellings recorded, because a representability\
  \ leg produces the\nkernel of the restriction while a cocycle leg produces the ideal\
  \ generated by eps, and the\nmismatch costs a rewrite). Ideal.isNilpotent_of_mul_self_eq_bot\
  \ bridges 'I*I = bot' to\nIsNilpotent, since deformation arguments supply the equation,\
  \ not an exponent.\n\nGENERALISABLE: when a statement is 'X mod a nilpotent implies\
  \ X', check first whether the\nobject's own structure (invertible, projective of\
  \ rank one, ...) upgrades a surjection to an\nisomorphism, and prove the Nakayama\
  \ iteration directly rather than importing a version whose\nfiniteness binder may\
  \ be the geometric restriction you are trying to avoid. Cf. I-0518 (a bare\nEquiv\
  \ in a reduction chain) for the dual failure mode on the same lane."
