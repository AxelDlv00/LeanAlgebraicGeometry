kind: issue
body: 'REVIEW OF ajcr-divrep s0010: ''U2 OWES EXACTLY ONE STATEMENT'' IS OVERSTATED
  -- the eps-identity is not U2, and the gap between them is unbridged in-tree.


  MEASURED. divrep''s own r6 result (DivRepChartRange.lean:183) says U2 IS: for each
  (i,j), (divRepClassifyZar ... (U i j)).left = ChartMap i j, at U i j : DivFamZar
  C (ChartRing i j) pi g. What s0010''s files produce is divFamEps (DivFam.mk G) =
  (divUniversalFstWindow, divUniversalSndWindow).


  THOSE ARE NOT THE SAME STATEMENT and no lemma composes them. IsDivRepClassify (DivRepClassifyZar.lean:90)
  is a FORALL over tower rings T, certified representatives G over T, chart indices
  (i'',j'') and framings w : PairChartRing -> T, concluding an equality of SCHEME
  MORPHISMS. An eps-value at the identity point is ONE instance of its hypothesis
  block, not its conclusion. The available route (isDivRepClassify_iff_divRepClassifyZar_left_eq)
  needs the CLASSIFIER equation, and divRepClassifyZar is built from DivFamZar.exists_certChartCover
  -- a per-piece frame cover, not a single eps value.


  ALSO: the chart ring differs. Univ*.lean use DivCarveChartRing ... b1 b2; DivRepChartRange''s
  ChartRing uses b2.map (windowShiftEquiv hpi g).symm. Not obviously the same term.


  SO THE HONEST RESIDUE IS AT LEAST TWO: (1) the certificate, (2) eps-value -> classifier
  equation. Roadmap row u2 and critical-path 7.11.3 both say ONE. Fix the row.'
