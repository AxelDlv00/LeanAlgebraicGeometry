body: 'GROUND AUDIT OF I-1286: the CONCLUSION survives every attack, but ONE SUBSIDIARY
  COUNT IN IT IS FALSE, and it is the sentence a lane would cite.


  MEASURED, fresh context, two scratch probes under AlgebraicJacobian/ (lake env lean,
  both deleted).


  THE DEFECT. FGAPicRepresentability.lean item 5 (and I-1286, and the AJC.picrep.etale-rep
  C-0002 comment) says: ''Mathlib has exactly five such scheme instances: LocallyOfFiniteType,
  LocallyOfFinitePresentation, Smooth, FormallyUnramified, Etale.'' That is the count
  for ONE FILE (Morphisms/LocalFlatDescent.lean), not for Mathlib. Morphisms/FlatDescent.lean
  registers SIX MORE, all of which synthesise on probe at (@Surjective inf @Flat inf
  @QuasiCompact): Surjective (:40), UniversallyClosed (:46), UniversallyOpen (:63),
  UniversallyInjective (:81), isomorphisms Scheme (:88), IsOpenImmersion (:127). ELEVEN,
  not five.


  WHY IT MATTERS AND WHY IT DOES NOT. It does not touch the conclusion: DescendsAlong
  @IsSeparated and DescendsAlong @IsClosedImmersion BOTH still fail to synthesise
  (re-measured independently), and the spelled-out descent statement for IsSeparated
  at [Surjective][Flat][QuasiCompact] on pullback.fst is not closed by exact?. So
  ''do not budget a separatedness-descent argument'' HOLDS. But the false list is
  the load-bearing-looking part of the sentence: a lane checking whether ITS property
  descends reads that list, finds UniversallyClosed absent from it, and re-derives
  a registered instance. This is the recorded ''absence claims rest on scans, not
  censuses'' / ''count scope narrower than the claim'' pattern, in a paragraph whose
  own method note warns about exactly that two lists earlier.


  FIX: say ''the five in Morphisms/LocalFlatDescent.lean; Morphisms/FlatDescent.lean
  has six more, none of them IsSeparated'' or drop the enumeration entirely -- the
  conclusion never needed it.'
