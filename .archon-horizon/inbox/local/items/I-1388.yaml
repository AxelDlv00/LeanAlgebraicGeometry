body: 'CLAIM ajcr-p1 (run 0087 r5): AJCR.w4-rep.datum.dat-j.qcfield -- hcl, the FOURTH
  field of JacobianData, the only one of the four with no producer of any shape and
  no lane. Verified unowned at HEAD with git show HEAD:, not the worktree.


  WHY IT IS THE MOST IMPORTANT ITEM AVAILABLE TO ME. JacobianData has four fields.
  rep is antecedent 3''s target; locallyOfFiniteType has a producer (Pic0AtlasFiniteType);
  quasiCompact is hcl. Two files independently reduce quasiCompact to ONE statement
  -- JacobianDataQcFromRep (class coordinates) and Pic0AtlasCompactFromClass (which
  proves hcpt IS the quasiCompact field, both directions) -- and both say plainly
  that hcl has no producer. So this is not one of the three antecedents everyone is
  circling; it is the fourth input, and closing the other three still yields NO JacobianData
  without it. p2 holds param-admissible (hdeg), p3 holds atlas-hcpt, p4 holds cover-noninj
  (huniv/hcov joint): none of them is this.


  THE CRUX I PROVED BEFORE CLAIMING, so the claim is not speculative. hcl asks, per
  point y of J, for a field-point q of divSchemeOver whose class matches y''s. The
  tree prices this as needing the Abel image or descent. But coverage -- antecedent
  2, which the seam ALREADY assumes -- is exactly Zariski-local surjectivity, and
  AT A FIELD TEST LOCAL SURJECTIVITY IS SURJECTIVITY. Measured, ScratchP1/ (gitignored),
  lake env lean EXIT=0 with a sorryAx control firing: on a scheme whose space is a
  Subsingleton, every Zariski covering sieve contains the IDENTITY (a cover component
  over the unique point is an open immersion with epi base, hence an iso by IsOpenImmersion.isIso,
  then downward_closed along its inverse); hence phi.app is surjective on sections
  for ANY locally surjective phi of presheaves of types. Spec of a field is Subsingleton
  and Nonempty by instance.


  WHAT I AM NOT YET CLAIMING: that this closes hcl. The gap between ''surjective on
  Sigma-sheaf sections at Spec kappa(y)'' and hcl''s ''q into divSchemeOver with pic0Map
  C q lam = rep.homEquiv (testPoint y)'' is a chart-index-to-divisor-scheme step I
  have not measured. Session''s work is to land the general lemma and state exactly
  what remains.'
