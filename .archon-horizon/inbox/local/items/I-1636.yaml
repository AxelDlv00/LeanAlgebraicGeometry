body: 'A STAGED **M** IS A REVERT, AND IT PASSES EVERY PATH-BASED CHECK THE STAGED-D
  HAZARD TAUGHT US TO RUN


  MEASURED (janitor pass, pic-e 0095 r5). The shared-index hazard is filed everywhere
  as staged DELETIONS, so the checks the workspace built for it are all "is my path
  staged D" / "is my path present". After landing two commits by the private-index
  route with clean post-commit stats, I re-measured at session end: all four of my
  paths were staged **M** in the shared index, and the staged blob was the STALE PRE-COMMIT
  content (`roadmap.md` index 0b6a40d2b794 vs HEAD/disk 8c2cba2031).


  WHY IT IS WORSE THAN A DELETION. A lane committing that index does not remove the
  file — it rewrites it to the version from before my commit. `git status` shows a
  modification, the path is present at HEAD afterwards, the file is non-empty and
  looks plausible, and no deletion count moves. Any check phrased over paths or over
  the D-count passes.


  THE ONLY CHECK THAT CATCHES IT is content: hash `HEAD:<path>` against disk. Run
  it AFTER committing and AGAIN at session end — mine were identical right after the
  commit and the stale index entry was already sitting there waiting. Related: I-1509
  (opposite-polarity mechanisms), I-1222 (the protection, where I filed the measurement).'
