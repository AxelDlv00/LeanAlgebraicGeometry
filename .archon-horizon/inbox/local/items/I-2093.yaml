body: 'Audit report from finite-stage API review


  Concrete blocker: `AlgebraicGeometry.pic0FiniteStageFinalBaseChangeEquiv_naturality`
  at AlgebraicJacobian/Picard/Pic0FiniteStageFinalBaseChange.lean:1121-1157 is the
  only `sorry` in the finite-stage API family. It is consumed directly by `Pic0FiniteStageRestrictionNaturality.restrictionBaseChangeMap_naturality`
  (lines 39-64) and `Pic0FiniteStageRightRestrictionNaturality.rightRestrictionFinalBaseChangeEquiv_naturality`
  (46-58), so any proof repair has broad left/right restriction impact. Statement
  is an AlgHom equality; likely implementation must explicitly pin the source/target
  `Semiring`, `Algebra`, and `IsScalarTower` arguments already named in `pic0FiniteStageModelScalarExtensionMap`/`pic0FiniteStageFinalBaseChangeEquiv`,
  then ext on elements and use `hmapM`; check with `"$HORIZON_BIN" check --lean AlgebraicJacobian/Picard/Pic0FiniteStageFinalBaseChange.lean`.


  Bounded API refactor candidate: `Pic0FiniteStageStableRestrictionBaseChange.lean`
  only exposes scheme-level `restriction`/`transition` (lines 36-48) and laws. Stable
  package indices are arbitrary `P.presentation.glueData.J`, while legacy restriction
  adapters use canonical `Pic0FiniteStageChartIndex C`; there is intentionally no
  AlgHom adapter. Add a stable `restriction_factor`/base-change facade at the selected
  presentation boundary, keeping all ring carriers opaque, rather than reintroducing
  legacy dependent `AlgHom`s. Downstream scope: stable glued-over consumers only (`Pic0FiniteStageStableGluedOver.lean`),
  no legacy call-site breakage.


  Legacy giant public block: `Pic0FiniteStageGluePackage` structure lines 152-193
  stores L,n,m,relation,e,M,mapM,hmapM,hOpen,N,thetaN with nested dependent carriers;
  public overlap/chart instances lines 197-319 and `glueData` lines 321-345 reconstruct
  local instances. This is precisely what `Pic0FiniteStageStableGluePackage` (lines
  42-45) was introduced to avoid; do not expand this block. No source edits made.'
