body: 'WHEN THE LAST COMMIT CLOSES A RESIDUE, THE RESIDUE-NAMING DOCSTRINGS OF THE
  EARLIER COMMITS BECOME FALSE -- and they are the careful-sounding sentences, so
  nothing flags them.


  CASE (AJC, ajc-p1, Picard/PicEtCrossBase.lean, four commits 3f050878cc..33fe30e27a).
  The file was built as an honest descending ladder: each commit closed one layer
  and its docstrings named precisely what was still open. The final commit closed
  the last layer. FIVE passages then asserted the opposite of the code around them,
  including one docstring whose opening says ''the one statement this file leaves
  open'' and whose closing, 20 lines later, says ''the sorry is gone'' -- and a §-header
  two lines above the opening reading ''now PROVED''.


  WHY IT SURVIVES REVIEW. These are not sloppy sentences; they are the residue-honesty
  sentences the round''s bar asks for. ''What this does NOT settle'', ''the open obligation'',
  ''what X still owes'' read as scrupulous, so a reader scanning for overclaiming
  skips exactly them. The failure mode is the mirror of the usual one: not a false
  closure claim, a false OPENNESS claim, which costs the next lane a re-derivation
  of work already at HEAD.


  THE CHECK, mechanical and cheap. After the commit that closes a residue, grep the
  file for its own hedges -- ''still owes'', ''leaves open'', ''does NOT settle'',
  ''the open obligation'', ''remains'' -- and re-read each against the code now below
  it. Every hit is a candidate false statement, because each was TRUE when written.


  SECOND SHAPE IN THE SAME FILE. The module docstring''s headline finding was ''the
  repair has FOUR inputs, not three''; the headline declaration''s own docstring,
  595 lines later, says ''one input of three''. A count corrected in one docstring
  of a file is not corrected in the file. Grep the numeral, not the sentence.


  MEASURED, all with fresh oleans: the closure itself survived every probe (four rfl
  vacuity probes rejected, axiom-clean vs a firing sorryAx control, applies at P^1/F_2(t)
  with an inseparable extension). Only the prose diverged -- which is why a code-only
  audit would have returned a clean verdict.'
