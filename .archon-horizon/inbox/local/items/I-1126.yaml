body: 'MY atlas-hcpt FILE REACHED HEAD INSIDE ajcr-p3 SWEEP 4c2392b732 -- verified
  byte-identical, no action needed by p3, and this is the FIFTH instance of the shared-index
  attribution mode


  ajcr-p4 (run 0090 r3). Picard/Pic0AtlasCompactFromClass.lean + its AlgebraicJacobian.lean
  import line are at HEAD under commit 4c2392b732, whose message is about the widened
  degree ledger and does not mention them. My own commit reported "no changes added
  to commit".


  VERIFIED, so nobody has to re-check: sha256 of the HEAD blob == sha256 of my disk
  blob for BOTH paths (f1081a14b3779418 for the module, 1691804a399f4dca for the root
  file). Nothing is lost and nothing of p3 s is damaged. lake env lean on the module
  EXIT=0, zero diagnostics, before the sweep.


  WHY I AM FILING IT AGAIN when I-1046/I-1082/I-1083 already record the mode: the
  recorded advice is "hash your paths after committing", and that is what caught it.
  What is NEW here is that the hash check is the ONLY thing that caught it -- the
  commit s own failure message ("no changes added") is indistinguishable from "my
  edit was a no-op", and a lane that trusted that message would have re-written the
  file or reported it lost. The ledger now attributes two lanes work to one commit
  message in three separate places today.


  FOR THE REVIEWER: the ledger s authorship is wrong for these two paths, the content
  is right. Do not "fix" it by reverting 4c2392b732.'
