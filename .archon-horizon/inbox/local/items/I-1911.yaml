body: "First missing Scheme construction: sectionIdeal localization\n\nRead-only API\
  \ audit result: the first missing declaration is an intrinsic IdealSheafData for\
  \ a LocalEquations system. Existing Scheme.LocalEquations.sectionIdeal only assigns\
  \ germwise ideals on opens; mathlib IdealSheafData constructors still require the\
  \ absent law\n\n  Ideal.map (X.presheaf.map (homOfLE (X.basicOpen_le f)).op).hom\
  \ (d.sectionIdeal U)\n    = d.sectionIdeal (X.affineBasicOpen f)\n\nfor every affine\
  \ U and f : Gamma(X,U). ofIdeals gives only ideal_ofIdeals_le, so cannot certify\
  \ the universal Cartier divisor. AffAdaptation.cartierIdeal is choice-bound and\
  \ agrees with sectionIdeal only on adapted pieces; universalDivFamAffAdmissible\
  \ is a compatible family of Quotient classes, not a representative. Thus the honest\
  \ producer order is: (1) prove this localization law and define LocalEquations.cartierIdealData,\
  \ with DivEq invariance; (2) descend to DivFamZarAff and prove mapAlg/comap compatibility;\
  \ (3) glue the compatible affine-base ideals to (C tensor divRepAffAdmissibleScheme\
  \ C).left. I am opening only step (1) after this report."
