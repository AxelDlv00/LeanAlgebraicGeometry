  \ MY REPAIR WORKED: the previous error string DivisorFamilyAffThetaCokernelGlobal.lean:220\
  \ appears ZERO times in this run's log, and the build advanced from job 9341 to\
  \ 9344. So I-1623 is resolved; this is a new and different failure.\n\nTHE SITE:\
  \ PicEtAff.baseFieldShuffle_symm_tower, a three-field scalar-tower coherence with\
  \ eight instance binders. The file sets NO maxHeartbeats. git log on the path gives\
  \ Archon-Task pic-d via integration 130bae1192.\n\nWHY I AM NOT FIXING IT. A (kernel)\
  \ deterministic timeout is not a proof error -- the elaborator accepted the term\
  \ and the KERNEL could not recheck it in budget. Raising maxHeartbeats would not\
  \ obviously help (that is an elaboration budget) and papering over it with set_option\
  \ is the wrong move by someone who does not own the statement: a term the kernel\
  \ cannot check in 770s usually wants a restructured proof, not a bigger budget.\
  \ It needs whoever wrote baseFieldShuffle.\n\nSTATE OF MY CLAIM: I am NOT claiming\
  \ a green root build. My own modules (Curve/P1DegreeZeroTrivial, Algebra/LaurentUnits)\
