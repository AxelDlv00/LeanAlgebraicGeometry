body: 'THE toZarAff NATURALITY LEMMA PRICED AS THIS ROW-S REMAINING COST IS ONE LINE,
  AND IT IS ALSO AVOIDABLE -- so a prescription can be wrong about the SIZE of a step
  and about whether the step is on the path at all.


  SITE OF THE PRICING: I-1187 (ajcr-p3 release) and its reply on conversation I-1190,
  both naming "toZarAff (F.mapAlg R2 n hinf) = DivFamZarAff.mapAlg R2 n F.toZarAff"
  as what the next lane OWES, with "if not, THAT is the cost". Also review-ajcr I-1196
  item 2. MEASURED by ajcr-p1 (run 0087 r3), Picard/DivisorFamilyAffClassDegree.lean,
  rooted, sorry-free, axiom-clean vs a sorryAx control, lake build AlgebraicJacobian
  EXIT=0 9318 jobs.


  TWO SEPARATE FACTS, and the second is the one that generalises.


  1. THE LEMMA IS ONE LINE. CertifiedDivisorFamilyAff.toZarAff_mapAlg = DivFamZarAff.mk_eq_mk_iff.mpr
  (Scheme.LocalEquations.divEq_refl _). Both sides are mk of the same pulled system:
  mapAlg-s eqns field IS pulledEquations, which IS the pullback along the comparison,
  regularity proof-irrelevant. p3 predicted exactly this shape and was right; the
  hedge "if not, THAT is the cost" was the only uncertain part.


  2. IT IS NOT ON THE PATH. The consumer of the field collapse -- AffAdaptation.deg_presentationDivisor_of_divEq,
  via Scheme.presentationDivisor_eq_of_divEq -- wants a DivEq, not a class equality.
  Stating the collapse as "exists G, DivEq G.eqns d" (exists_certifiedAff_divEq) never
  re-enters the quotient, so the naturality lemma is never called. The chart-typed
  original concludes at the QUOTIENT level because DivFam.exists_toZar_eq was written
  for other consumers too; porting its CONCLUSION rather than its USE imported an
  obligation the target did not have.


  THE REUSABLE SHAPE: when porting a lemma, port the form the CONSUMER needs, not
  the form the original states. A stronger conclusion drags in the lemmas that stronger
  conclusion requires, and those become "what you owe" in the handoff. I landed BOTH
  forms (the quotient-level DivFamZarAff.exists_toZarAff_eq too, since it is genuinely
  stronger and other consumers may want it) -- but only after the cheap one had already
  closed the target.


  NOT A CRITICISM OF THE HANDOFF-S DIRECTION: I-1187 pointed at exactly the right
  step, and its input (the cover-free degree identity) is what made this round cheap.'
