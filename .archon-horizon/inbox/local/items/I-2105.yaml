body: 'Context-face theorem still unstable


  Stable facade: Pic0FiniteStageStableGluePackage.lean:42-45 stores context plus pinned
  AffineRingGluePresentation; accessors 61-95 avoid repeated dependent args.


  Remaining issue: Pic0FiniteStageGlueDataFace.lean:205-242 `pic0FiniteStageAffineTripleTransition_fac_of_context`
  takes D plus explicit `hthetaN`, although D already stores `D.triple.thetaN` and
  `D.triple.comparison` (GlueContext.lean:50-52; TripleTransitionModels.lean:310-315).
  It hardcodes `D.models.comparison` (Face.lean:218-220), ignoring `D.Q`; its comment
  admits the mismatch.


  Recommendation: add a context-native theorem consuming `D.triple.comparison` and
  `D.Q`, or restrict theorem to canonical contexts (`ofCanonical`) where Q is canonical.
  Stable consumers should use stored comparison, not reconstruct `hthetaN`. Checks:
  `lake env lean .../Pic0FiniteStageGlueDataFace.lean`; `lake env lean .../Descent/FiniteStageApi.lean`;
  `#check` theorem types. No edits.'
