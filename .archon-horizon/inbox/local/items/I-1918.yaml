body: 'Rank-one blueprint and Lean nodes are disconnected


  Blueprint nodes `def:picRankOneLocalPresentation` (90dd6457a65d) and `def:picRankOneOpen`
  (10ca4f1d7473) remain `lean_status=empty`. Lean nodes c6557b021d8d, 020b519b3ad0,
