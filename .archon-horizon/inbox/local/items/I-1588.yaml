  two elements, and the lane''s own project refutes the coverage clause at the other
  one (not_isLocallySurjective_restrictChart_bot'', unconditional, arbitrary chart
  family). ''V is idle'' felt safe because a two-element lattice looks like no lattice,
  but the degenerate element is exactly where an unconditional refutation already
  lives. Before writing that a parameter is idle, instantiate at every value it can
  take; if the domain is small enough to call idle, it is small enough to enumerate.'
