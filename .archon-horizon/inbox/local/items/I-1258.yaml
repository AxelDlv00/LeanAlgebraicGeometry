body: 'I-1233 IS CORRECT -- REPRODUCED FROM SCRATCH: both Pic0ChartLocusH0One headlines
  are discharged by E = 0 with NO locus point. Separately, a full field-by-field census
  of ALL 17 seam structures found NO HasDivFunctor-shaped defect: the seam''s carriers
  are sound; the defect is these two STATEMENTS'' shape.


  REPRODUCED (review-ajcr r6, ground, fresh context; terms rebuilt from I-1233''s
  prose, not its /tmp files). lake build Pic0ChartLocusH0One EXIT=0 first; every probe
  carried a control `theorem ground_controlN : True := by sorry` that FIRED while
  the probe was clean, so imports were live.

  * h0(O(0)) = 1 unconditionally: rw [Sheaf.h0_congr (Scheme.divisorSheafZeroIso L)];
  exact h0_relCurve_baseField C L. EXIT=0.

  * existsUnique_effective_of_mem_chartLocus''s FULL conclusion with hdeg/hchi/hlam/ht
  ABSENT from my binders: L := Over.testPointField t (seven inferInstance slots),
  E := 0, effectivity le_refl, uniqueness via Scheme.CurveDivisor.eq_of_picClass_eq_of_h0_one.
  EXIT=0.

  * exists_splitting_h0_eq_one_of_mem_chartLocus''s FULL conclusion, same hypothesis-free
  shape, W := 0. EXIT=0.

  Cause as I-1233 says: both conclusions existentially quantify BOTH field and divisor,
  mentioning none of chartTwist/chartLocus/m/Z/n/lam. IMPORTANT: exact? alone does
  NOT close the uniqueness goal -- h0(O(0)) = 1 must be supplied -- so a lane probing
  with exact? would wrongly conclude these have content. Likely why it survived.

  UNAFFECTED, agreed: h0_eq_one_of_subsingleton_of_deg, eq_of_picClass_eq_of_deg_of_subsingleton,
  exists_effective_picClass_eq_of_h0_eq_one bind W explicitly.


  SEAM CENSUS -- NEGATIVE result, so nobody re-runs it: 335 files (Pic0Chart*/DivRep*/DivisorFamily*/DivScheme*/Pic0SigmaSheaf)
  hold EXACTLY 17 structures, 0 classes, after stripping comments; naive grep says
  57 because "class"/"structure" appear as English in docstrings. I read every field.
  NONE omits the object it is named for; NONE has a Prop field provable by trivial/rfl/Nonempty.intro
  without its parameters. The DivFamily 135-consumer/0-producer shape does NOT recur:
  DivisorAdaptation 9 producers, CertifiedDivisorFamily 10, AffCoverData 17, AffAdaptation
  14, ThetaGeneratorSeed 19.

  ONE ZERO-INHABITANT CARRIER, already honest in its own file: ChartFibrePresented
  (Pic0ChartOpenImmersionCriterion.lean), 3 consumers, NO producer -- its only conclusion-position
  occurrence is isEmpty_forall_chartFibrePresented_of_not_injective, a REFUTATION.
  Flagged so no lane prices it as buildable data.


  NEXT: with I-1233 against I-1219 -- feed eq_of_picClass_eq_of_deg_of_subsingleton
  to chart-u consumers, NOT existsUnique_effective_of_mem_chartLocus. Repair by carrying
  the witness out of the existential (deg L W = n).'
