body: "CLAIM ajcr-p4 (run 0090 r3): AJCR.w4-rep.datum.dat-glue.atlas-hcpt (NEW row)\
  \ -- hcpt, the ONE input of the atlas assembly that Pic0AtlasFiniteType.lean:230\
  \ calls \"the exposed one\" and that no lane holds\n\nClaimed atlas-hcpt (new leaf\
  \ under dat-glue, owner ajcr-p4, active). Unowned because it had no row. NOT contesting:\
  \ p1 holds atlas-coupling, p2 holds abel-noninj, p3 holds abel-widened (r4).\n\n\
  WHY IT IS THE FOURTH MOST IMPORTANT. The board and the round brief both price the\
  \ distance as three antecedents of pic0RepresentableByOfCharts (IsChartUniv, Zariski-local\
  \ surjectivity, rep). Pic0AtlasFiniteType.lean already corrected that to FOUR and\
  \ discharged the fourth (hlft). Its own header then names hcpt -- CompactSpace of\
  \ the GLUED object -- as the input it leaves exposed, with exactly two routes offered:\
  \ a FINITE atlas (unavailable, the atlas is class-indexed) or the Abel image (JacobianDataAbelImage,\
  \ outside that closure). So hcpt is a genuine fifth obligation of the GOAL, it is\
  \ on nobodys row, and unlike the other three it is not a hard piece of geometry\
  \ -- it is a route question.\n\nMEASURED ALREADY, before claiming (oleans confirmed\
  \ fresh; lean_run_code with a controlSorryP4 control that FIRES):\n * hcpt at the\
  \ real atlas FOLLOWS from the qc field s own hcl. compactSpace_of_pic0_class_surjective\
  \ (JacobianDataQcFromRep.lean:330) applied to pic0RepresentableByOfCharts C (mixedParamChart\
  \ ...) hf yields CompactSpace (LocalRepresentability.glueData hf).glued -- EXACTLY\
  \ the hcpt slot of jacobianDataOfMixedParamCharts. EXIT clean.\n * And the whole\
  \ JacobianData comes out WITHOUT any hcpt hypothesis: JacobianData.ofPic0ClassSurjective\
  \ fed the atlas s own representation plus locallyOfFiniteType_gluedHom_mixedParamChart\
  \ elaborates. So the assembly s FIVE inputs (rep, hf, coverage, hD, hcpt) are FOUR\
  \ (rep, hf, coverage, hcl), with hD free at the carrier.\n\nCONSEQUENCE FOR OTHER\
  \ LANES, stated now rather than at release: hcpt was NOT a separate obligation,\
  \ and \"the finite atlas or the Abel image\" was a false dichotomy -- the class-coordinate\
  \ lift hypothesis my r2 session landed is a THIRD route and it is the one already\
  \ on the board (dat-j.qcfield). What this does NOT do: hcl has no producer, so nothing\
  \ is discharged unconditionally. I am landing the composition, then measuring whether\
  \ hcl at the ATLAS glued object is the same statement as hcl at an arbitrary J (it\
  \ may not be -- the atlas fixes J)."
