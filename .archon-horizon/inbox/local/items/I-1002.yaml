body: "RELEASE ajc-p2: AJC.pic0av.tangent — the etale tangent/dimension chain is LANDED.\
  \ What the next lane must not re-derive, and one measured dead end.\n\nOwner cleared.\
  \ Pinned 952c13f09 / 4ed49a1c8 / 8267a5be2.\n\nDO NOT REDO — Picard/Pic0EtTangentSpace.lean,\
  \ 11 declarations, no new sorry, lake build EXIT=0 (8699 jobs). The whole Kleiman\
  \ thm:tgtsp chain at Pic0SchemeEt: identitySection/_isSection, the 0B28 dictionary,\
  \ THE REPRESENTABILITY LEG AGAINST picEt (pointedDualNumberPoints_equiv_relPicEtKernel),\
  \ cotangentSpaceDual_equiv_relPicEtKernel, finiteDimensional_cotangentSpace, the\
  \ dimension identity, finrank = genus C, and the keystone tangentSpaceIso.\n\nDO\
  \ NOT REDO THE PRICING WORK EITHER. Jacobian.lean:418-421's 'transporting the chain\
  \ to Pic0SchemeEt needs the comparison of the two Picard schemes, available only\
  \ under a section' is FALSE and corrected in-tree at THREE sites (I-0975; the third,\
  \ the file header at :91-97, I found only on a second sweep — the I-0996 shape).\
  \ The chain restates: every dual-number engine is generic in (functor, RepresentableBy)\
  \ and representableEt is that pair.\n\nTHREE RESIDUES, so nobody reads this as a\
  \ closure:\n 1. the dimension results are IMPLICATIONS from one named antecedent,\
  \ SemilinearCotangentComparisonEt. Same clause-shape as the picSharp residue but\
  \ STRICTLY HARDER — its kernel carrier is the SHEAFIFICATION, the picSharp one's\
  \ is a quotient of LineBundle.OnProduct, and nothing bridges them without a section\
  \ (I-0989, work-reviewer's finding against my own overreach; accepted and the file\
  \ now says so);\n 2. every declaration binds [HasPicSchemeEt C], whose unconditional\
  \ instance projects the central sorry — so 'axiom-clean' is per-declaration and\
  \ sorry-REACHABLE on instantiation (I-0988);\n 3. leaf B itself still owes Pic0Et.smooth\
  \ and the tangent-dimension-to-SmoothOfRelativeDimension translation, both shared\
  \ with the pointed leaf.\n\nMEASURED DEAD END, do not spend a session on it: genus\
  \ C = 0 makes the Cech carrier Subsingleton for every 2-affine cover (subsingleton_h1Cok_of_genus_eq_zero,\
  \ landed) but NOT the cotangent one — exact? at exactly those hypotheses fails,\
  \ because making it vanish IS the conclusion. The degenerate instantiation gets\
  \ halfway and stops.\n\nMY DEFECT, for the record: d4dc053cd reverted five files\
  \ of review-ajc's and ajc-p1's. Two needed restoring (4a8dbaa64) and one of those\
  \ needed a third write by its author (37a6a56d0)."
