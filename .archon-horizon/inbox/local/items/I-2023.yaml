body: 'Challenge/JacobianData audit (read-only)


  The requested sibling path `Algebraic-Jacobian-Challenge/JacobianData/Challenge.lean`
  is absent at HEAD; the frozen statement is `AlgebraicJacobian/Challenge.lean` in
  AJCR itself (same structure likely intended). Exact proof holes in frozen Challenge.lean:
  lines 99 `Jacobian`; 108 `Jacobian.instGrpObj`; 113 `smoothOfRelativeDimension_genus`;
  120 anonymous `IsProper`; 127 anonymous `GeometricallyIrreducible`; 132 `Jacobian.ofCurve`;
  140 `Jacobian.comp_ofCurve`; 158 `Jacobian.exists_unique_ofCurve_comp`; functor
  fields lines 168-170 (`map`, `map_id`, `map_comp`); lines 260,271,284,296 (`baseChangeIso`,
  `baseChangeIso_id`, `baseChangeIso_comp`, `baseChange_ofCurve`). Thus 15 sorry occurrences/fields
  (the functor structure contributes 3). `genus`, baseChange and stability instances,
  idIso/compIso, and `Jacobian.congr` are clean.


  Clean acyclic bridge candidates: `Picard/JacobianData.lean` gives `JacobianData.grpObj`,
  `homEquiv`, `homEquiv_comp`, `uniqueUpToIso`, `homEquiv_uniqueUpToIso_hom`; `JacobianDataAbel.lean`
  gives `ofCurve`, `homEquiv_ofCurve`, `homEquiv_one`, `comp_ofCurve`; `JacobianDataBaseChange.lean`
  gives datum transport/baseChangeIsoOfData and `grpObjObj_baseChange_eq`; `JacobianDataBaseChangeAbel.lean`
  gives `baseChangeIsoOfData_hom_hom_hom`, base-change Abel compatibility. These are
  clean and stated for arbitrary `d : JacobianData C`, so no cycle.


  Critical gap: current rebuild has no unconditional global `jacobianData C` producer
  (only specialized producers such as finite-Galois/separably-closed/vanishing routes).
  Therefore these datum-level theorems cannot by themselves discharge frozen `Challenge`
  fields. The frozen discharge requires a genuine DAT-J producer with definitional
  `Jacobian C := (jacobianData C).J` and matching `instGrpObj := (jacobianData C).grpObj`;
  `JacobianDataAbel.lean` explicitly records this coupling and says universal-property
  half (`exists_unique_ofCurve_comp`) has no datum avatar. Pointed/rational-point
  route is additionally blocked for arbitrary curves per protection I-0074 caveat.'
