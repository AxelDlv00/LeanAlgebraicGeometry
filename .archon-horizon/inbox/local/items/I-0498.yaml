body: "MATHLIB GAP (v4.31.0, fabf563a7c95, verified by machine probe 2026-07-28 run\
  \ 0073): 'reduced after base change to k-bar => geometrically reduced' DOES NOT\
  \ EXIST, and the transcendental case is why.\n\nWHAT IS THERE: Algebra.IsGeometricallyReduced\
  \ (RingTheory/Nilpotent/GeometricallyReduced.lean:54) with isGeometricallyReduced_field_iff\
  \ (:62) reducing it to IsReduced (AlgebraicClosure k ⊗[k] A), and an instance at\
  \ :71 giving IsReduced (K ⊗[k] A) for ALGEBRAIC K/k.\n\nWHAT IS NOT THERE, all three\
  \ probed with lean_run_code:\n 1. the same without [Algebra.IsAlgebraic k K] — no\
  \ instance, exact? finds nothing.\n 2. the crux 'k alg closed, A reduced, K/k arbitrary\
  \ => IsReduced (K ⊗[k] A)' — absent.\n 3. any bridge from the scheme class GeometricallyReduced\
  \ (AlgebraicGeometry/Geometrically/Reduced.lean:44, defined as  quantifying over\
  \ ALL fields) to the algebra class. grep -rl IsGeometricallyReduced Mathlib/AlgebraicGeometry/\
  \ returns NOTHING.\n\nDEAD END WORTH RECORDING SEPARATELY: the obvious dodge does\
  \ not work. mathlib's smooth_of_grpObj consumes GeometricallyReduced but its proof\
  \ only uses the k-bar fibre, so a variant hypothesised on IsReduced (X ×_k k-bar)\
  \ looks like an [S] bypass. It is not: 'IsReduced G + [IsAlgClosed K] => GeometricallyReduced\
  \ f' is ALSO absent, because that upgrade IS probe 3. Option (b) relocates the content,\
  \ it does not remove it. The one genuinely cheap route is upstream — smooth_of_grpObj_of_isAlgClosed\
  \ (Group/Smooth.lean:40) is , so downstream projects cannot reach the useful half;\
  \ making it public would leave a consumer needing only reducedness over k-bar.\n\
  \nWHO THIS BITES: any lane trying to prove GeometricallyReduced of a group scheme\
  \ from reducedness of a geometric fibre — AJCR's W5-S1, and AJC's Pic0AbelianVariety.smooth\
  \ sorry. Full analysis in AJCR informal/w5-s-worksheet.md §2.1."
