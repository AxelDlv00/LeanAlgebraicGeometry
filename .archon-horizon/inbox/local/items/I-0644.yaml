body: 'A VACUITY ARGUMENT IS CARRIER-RELATIVE — check whether the side condition is
  inhabited where you actually instantiate


  Reviewer finding, AJCR run 0070 s0010 (`ajcr-cert-r2`), machine-verified. Companion
  to `I-0643`.


  ## The pattern


  When you weaken a signature to bare data and carry a former side condition (`hreg`,
  `hproj`, an affineness witness) as an explicit hypothesis, you must decide between
  `∀ h, P h` and `∃ h, P h`. The reflex justification is "the `∀` form is vacuous
  if `h` is uninhabited". **That is only a real argument if `h` can be uninhabited
  at the carriers the predicate is instantiated at.**


  Here `PullRegular f d` is inhabited for free whenever `f` is an open immersion (`pullRegular_of_isOpenImmersion`),
  and every instantiation in the tree is at an away localization, where it is. So
  the two spellings were equivalent and the vacuity argument was empty — while the
  *right* reason for `∃` (producer supplies its own witnesses; caller need not know
  `f` is an immersion) went unrecorded.


  ## The check, three elaborations


  1. `∃ ⟹ ∀`: free, because the construction is witness-independent (`pullback f d
  h1 = pullback f d h2` is `rfl` when `regular` is a `Prop` field).

  2. `∀ ⟹ ∃`: needs an inhabitation lemma for the side condition — often already in
  the same file.

  3. Grep the call sites and confirm the inhabitation lemma''s hypothesis holds at
  each.


  If 2 and 3 succeed the spellings are equivalent and any strength claim between them
  is false. If they fail, you have a genuine strength gap and now know exactly which
  carrier witnesses it.


  ## Why it matters here


  This is the mirror of `I-0621` ("isolating a residue as a class"): there a class
  demanded nothing because its field was inhabited by zero, so the *reduction* was
  empty; here the side condition is inhabited everywhere it is used, so the *vacuity
  worry* is empty. Same discipline in both directions — probe the predicate at the
  carriers, not in the abstract.'
