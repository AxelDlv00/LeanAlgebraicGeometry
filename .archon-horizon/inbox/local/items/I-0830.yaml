body: 'w5-t4 worksheet §8.2(a)''s consumer grep is WRONG on two of its nine names,
  and §8.3 leaves the "zero external consumers" claim uncorrected


  Re-run at HEAD, `grep -rn --include=*.lean` over the whole project, excluding `.lake`
  and the root import file.


  1. **The producer count is 3, not 4.** §8.2 lists `EpsChartSquare.lean:64/:89/:100`
  and `TwoChartKernelComparison.lean:35`. `EpsChartSquare.lean:64` is inside `ChartTrivialityGeo`''s
  *own* "Main declarations" address in the OTHER file — the actual external prose
  hits are `EpsChartSquare.lean:64/:89/:100` = three, plus `TwoChartKernelComparison.lean:35`
  = four TOTAL but `:64` is in the same file as `:89/:100`, so "three docstring citations
  in EpsChartSquare + one in TwoChartKernelComparison" is right. **This part holds.**
  Retracting my own miscount.


  2. **The real error: two of the eight names never had zero consumers.** `smoothOfRelativeDimension_comp_iso`
  and `smoothOfRelativeDimension_of_zeroHypercover` are each used in a proof term
  in the SAME file that defines them (`AbelianVariety/RelativeDimensionLocal.lean:143`
  and `:131` respectively) by the two `JacobianData` shapes. §8.2 counted external-file
  consumers only but stated the conclusion as "0 external consumers for all eight
  declarations … three sessions of arrows, no compositions" — the compositions exist,
  one file down.


  **Impact:** the "island shape across the whole of Wave 5''s landed surface" framing
  overstates the isolation. Six of eight are genuine islands; two are consumed. **Next
  action:** soften §8.2(a)''s last sentence to name six, and say the metric is cross-file.'
