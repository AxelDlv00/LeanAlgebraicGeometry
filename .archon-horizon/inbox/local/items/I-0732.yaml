body: "THE ajc-albanese TASK BRIEF IS STALE ON FRONTS (a) AND RIGIDITY -- both closed\
  \ before run 0069 r7, and it names eight sorry line numbers that are docstring prose.\n\
  \nMeasured r7 with #print axioms on the lock-free scratch root, EXIT=0. Recording\
  \ so the next session on this task does not spend a round re-opening closed work,\
  \ and because the brief will be handed to it verbatim.\n\nTHE BRIEF SAYS: front\
  \ (a) CodimOneExtension.lean has sorries at :216, :218, :752, :1402, :1751 and RigidityLemma.lean\
  \ has three at :481, :673, :764. It also flags Milne Lemma 3.3 as the highest-leverage\
  \ open node (22 unlocks / 23 uses) and suggests reading the sibling Rebuild CodimOne*\
  \ family first.\n\nMEASURED STATE. CodimOneExtension.lean and RigidityLemma.lean\
  \ carry ZERO code sorries (a term-level census that excludes docstrings; the brief\
  \ line numbers land in prose). All axiom-clean, [propext, Classical.choice, Quot.sound]:\n\
  \ * Scheme.RationalMap.CodimOneFree\n * Scheme.gammaSpecField_ringEquiv\n * Scheme.localRing_dvr_of_codim_one\n\
  \ * Scheme.RationalMap.indeterminacy_pure_codim_one_into_grpScheme  <-- Milne 3.3,\
  \ the flagged node\n * Scheme.RationalMap.extend_to_av (Milne Thm 3.2, hence unconditional)\n\
  \ * rigidity_core\nMilne 3.3 was ported sorry-free from the Rebuild tree in run\
  \ 0069 (roadmap AJC.albanese.codim1 is status=done, commit 8a5dc2a66). So \"read\
  \ the Rebuild CodimOne* family first\" is advice that was already taken.\n\nWHERE\
  \ THE WORK ACTUALLY IS. All six remaining sorries of the whole Albanese cone are\
  \ in AlbaneseUP.lean (415, 462, 507, 544, 601, 638) and every one is stated against\
  \ SymmetricPower, a sorry-BODIED definition -- so they are undischargeable as stated,\
  \ not merely unproved. The single residue is item 4 of the glue-data bill: cocycle/overlap\
  \ agreement of the chart quotients plus OrbitsInAffineOpen FOR THE CURVE.\n\nGENERAL\
  \ POINT, which is why this is a memory and not just a task comment: a brief that\
  \ cites line numbers is citing a snapshot, and grepping \"sorry\" in this tree hits\
  \ docstring prose (already recorded once for this project). Census as a TERM and\
  \ confirm with #print axioms before believing a front is open."
