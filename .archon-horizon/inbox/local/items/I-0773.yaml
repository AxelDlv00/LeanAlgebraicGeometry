body: 'JANITOR run0071/s0014 #8 THE 21 ACTIVE ROADMAP ROWS: I-0509''s LIVENESS TRIAGE
  NOW GIVES A DIFFERENT ANSWER THAN IT DID YESTERDAY -- only 4 of 21 belong to a LIVE
  lane. None is an orphan; all 21 are legitimate. But ''deferred'' is now the honest
  word for 17 of them, and I-0509''s argument no longer covers them.


  METHOD: crossed each active row (and its ancestors) against tasks/items/*.yaml roadmap_refs,
  then against ''horizon ps''. Live lanes are exactly 2 (ajc-fbc, ajcr-divrep).


  LIVE (4): AJC.fbc, AJC.fbc.cosimplicial, AJC.fbc.cosimplicial.twisted (ajc-fbc,
  running) and AJCR.w4-rep.datum.dat-d.ddr.divrep (ajcr-divrep, running).


  DEFERRED BEHIND A HANDED-BACK LANE (16): every row whose only task refs are ''queued''.
  AJC.albanese + .symmetric + .universal (ajc-albanese); AJC.pic0av + .identity +
  .structure + .tangent (ajc-pic0av); AJC.rr.extuniform (ajc-rr); AJC.jacobian (only
  ref is ajc-optimize); AJCR.w4-rep + .datum + .datum.dat-d + .ddr + .ddr.certificate
  + .dat-c.c9-chartlocus.chart-u (ajcr-cert-r2 / ajcr-charts / ajcr-w4-rep-free);
  AJCR.w5-av.t5 (ajcr-w5-av). Each has real open mathematics and a named owner field,
  so NONE should be closed. They are parked, not stale.


  ONE ROW WITH NO TASK REFERENCE AT ALL (1): AJCR.jacobian -- active, owner empty,
  and not in any task''s roadmap_refs, not even via an ancestor. It is the AJCR north-star
  row, so the analogue of I-0648''s ''charter'' case, but unlike T16/''rebuild'' it
  has no charter task pointing at it. If anything on this board is a bookkeeping gap,
  it is this one: worth giving it the ''rebuild'' task as an owner so a future liveness
  cross does not read it as orphaned.


  DELTA ON I-0509: its reasoning was ''13 active rows with 8 lanes live is the fleet''s
  steady state''. At 2 lanes live that no longer holds arithmetically -- the count
  is now dominated by parked work. The conclusion (do not close them) survives; the
  JUSTIFICATION changes from ''these are in flight'' to ''these are parked with owners''.
  Recording so the next pass does not cite I-0509 as-is.'
