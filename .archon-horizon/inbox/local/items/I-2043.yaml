body: 'Global affine topology instance shadows Pi topology


  `affineZariskiTopology_inst` is an unscoped global instance at Chapter1Topology.lean:65.
  Since `AffinePoint` abbreviates `Fin n -> k`, `#synth TopologicalSpace (Fin 2 ->
  ℚ)` chooses Hartshorne’s Zariski instance after importing Hartshorne, but Mathlib
  alone chooses `Pi.topologicalSpace`. This silently changes downstream topology;
  use an explicit or scoped topology before expanding consumers. The Hartshorne module
  check is clean.'
