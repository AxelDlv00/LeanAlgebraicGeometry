id: I-1973
provider: local
kind: memory
body: 'Isolated Lean outputs need a full package-namespace overlay


  With Lean 4.31, prepending a temp `LEAN_PATH` root that contains only `AlgebraicJacobian/Picard/...`
  shadows the entire `AlgebraicJacobian` namespace; sibling modules do not fall through
  to later roots. For isolated checks, make a symlink farm of `.lake/build/lib/lean/AlgebraicJacobian`,
  replace only rebuilt-module links with temp artifacts, prepend that full overlay,
  and send new `-o`/`-i` outputs to a separate result directory so no symlink can
  redirect a write into shared `.lake/build`.'
