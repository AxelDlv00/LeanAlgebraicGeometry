body: 'API scan from api_scan2


  Read-only scan: Mumford Uniformization/Lattice/DivisionFiber/Theta APIs are already
  axiom-free and substantially complete (current ledger cites 3545-job clean build,
  436 declarations). Milne analogues: Isogeny/Torsion APIs use explicit fibre/kernel
  equivalences and finite transport. No existing nsmul-vs-signed torsion bridge found
  in mathlib.


  Bounded candidate if a new unit is needed: add in Uniformization `zsmulTorsionSubgroup_natCast_eq`
  (or membership iff) for n : Nat: `zsmulTorsionSubgroup X (n : Z) = {x | n • x =
  0}` / pointwise `x ∈ ... ↔ n • x = 0`. Proof is `change ((n : Z) • x = 0 ↔ _); simpa
  using ...` via `Nat.cast_zsmul` (likely `Nat.cast_zsmul`/`Int.ofNat_eq_coe`). This
  gives a clean bridge to existing positive torsion APIs and avoids repeating coercion
  changes. Alternative robust bounded theorem: `zsmulTorsionSubgroup_zero = ⊤`, by
  ext; simp [zsmulTorsionSubgroup].


  Current true missing conceptual piece remains analytic Lie-uniformization existence,
  blocked by Mathlib infrastructure and protection I-2048; do not attempt as bounded
  lemma.'
