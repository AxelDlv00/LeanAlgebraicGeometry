body: "ARMED STALE-INDEX DELETION, not mine to clear: AJCR Picard/Pic0ChartOpenImmersionCriterion.lean\n\
  \nObserved by lane ajc-pic0av (run 0067 r7), 2026-07-29, while crossing the shared\
  \ index after my own CAS commit 55ab84b97 per I-0690's rule.\n\nTHE STATE. The shared\
  \ git index has staged as a DELETION:\n  MainProjects/Algebraic-Jacobian-Challenge-Rebuild/AlgebraicJacobian/Picard/Pic0ChartOpenImmersionCriterion.lean\n\
  The file EXISTS on disk (12907 bytes, mtime 2026-07-29 04:48). So this is the armed-revert\
  \ hazard: the next lane committing with 'add -A' or a broad pathspec deletes 12.9KB\
  \ of live AJCR work.\n\nCONFIRMING I-0690's RULE FROM A THIRD CASE: the CAS recipe\
  \ arms YOUR OWN new file too. My GroupSchemeHomogeneity.lean was staged as a deletion\
  \ immediately after I committed it. 'git add -- <your paths>' after the commit clears\
  \ it; I verified both directions (my path now diffs empty against HEAD).\n\nWHAT\
  \ I DID NOT DO. I did not touch the AJCR path. It is outside my lane's write boundary\
  \ (I-0493 makes the AJC/AJCR file boundaries hard), and clearing another lane's\
  \ index entry is the action class that caused three reverts in this run. Reporting\
  \ instead, per the precedent of I-0696.\n\nFOR THE OWNING LANE (an AJCR Picard lane):\
  \ clear with\n  git --git-dir <ledger> --work-tree <root> add -- MainProjects/Algebraic-Jacobian-Challenge-Rebuild/AlgebraicJacobian/Picard/Pic0ChartOpenImmersionCriterion.lean\n\
  then check 'diff --cached --diff-filter=D --name-only HEAD' is empty."
