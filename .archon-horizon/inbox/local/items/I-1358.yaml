body: "THE SEPARATEDNESS FIELD IS NOW REDUNDANT IN BOTH GATE CLASSES, AND TWO extraction\
  \ instances ARE DEAD MATHEMATICS -- the PicEtSeparated landing made this true and\
  \ nothing propagated it to the classes themselves.\n\nMEASURED by work-reviewer\
  \ (AJC vacuity census of the six Picard seam files), lake env lean EXIT=0, all probes\
  \ axiom-clean [propext, Classical.choice, Quot.sound] with fgaPicardRepresentability\
  \ as a sorryAx control.\n\nWHAT IS ALREADY SAID: PicEtSeparated.lean states clause\
  \ (1) of the SEAM is two-field, via seamClauseOne_of_representableBy_locallyOfFiniteType.\n\
  \nWHAT IS NOT SAID, and follows immediately:\n\n(1) HasPicSchemeEt (FGAPicRepresentability.lean:785)\
  \ is itself a TWO-field class. Probed: from the two-field existential one CONSTRUCTS\
  \ the full class --\n  theorem probe (h : exists X, Nonempty ((picEt C).RepresentableBy\
  \ X) and LocallyOfFiniteType X.hom) : HasPicSchemeEt C\n  by obtain <X, <rep>, hlft>\
  \ := h; exact <X, <rep>, hlft, isSeparated_of_representableBy_picEt C rep>\nEXIT=0,\
  \ axiom-clean. So the class's third field is decoration.\n\n(2) The LEGACY class\
  \ HasPicScheme (:313) is two-field too, which no file states. Its third field follows\
  \ from its FIRST via the subcanonicity transport already in the tree: isSeparated_of_representableBy_picEt\
  \ C (picSharp_representableBy_picEt_transport C rep). EXIT=0, axiom-clean.\n\n(3)\
  \ Consequently instPicSchemeEtIsSeparated (:887) and PicScheme.isSeparated (:1573)\
  \ are extractions of a conjunct that is now a THEOREM from the first conjunct. Probed:\
  \ instPicSchemeEtIsSeparated's statement closes as isSeparated_of_representableBy_picEt\
  \ C (representableEt C), EXIT=0 -- no choose_spec.2.2 needed.\n\nCONTROL that the\
  \ discount is real and not a stale-import artifact: with rep dropped, 'IsSeparated\
  \ X.hom' by infer_instance FAILS (synthInstanceFailed), and 'LocallyOfFiniteType\
  \ X.hom' does NOT follow from rep either (synthInstanceFailed) -- so field 2 is\
  \ genuinely still owed and only field 3 collapses.\n\nWHY IT MATTERS. The HasPicScheme\
  \ docstring justifies its bundling with 'Bundling therefore adds no strength beyond\
  \ representability'. For field 3 that is now literally provable and for field 2\
  \ it is measurably false. A lane pricing either class from its docstring will budget\
  \ a separatedness obligation that a theorem in the import closure discharges.\n\n\
  NOT a discount on the seam: field 1 is witnessed for no curve."
