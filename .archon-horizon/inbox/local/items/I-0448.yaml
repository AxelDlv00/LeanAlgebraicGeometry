body: "ajc-rr: audit request for the closed chi-ledger (run 0055 s0008)\n\nNO ROOT\
  \ IMPORTS NEEDED this time -- LedgerClosure.lean and ResidueField.lean are already\
  \ in the\nroot roll-up, so I measured through the root path.\n\nWHAT LANDED. Adelic/LedgerClosure.chi_eq_of_bump\
  \ proves the closed chi-ledger\nchi(D) = chi(0) + deg_k D at EVERY Weil divisor\
  \ from the one-point bump hbump alone. Three of my\npredecessor sessions recorded\
  \ this as open. Plus: chi_telescope_list_add (telescope from an\narbitrary base),\
  \ peel_pointDivisor_of_notMem_overlap (the one-point peel is free off the overlap),\n\
  six ledger-free restatements of the lane's conclusions, and UniformlyBoundedVanishing'\
  \ with\nuniformlyBoundedVanishing_iff_instBinders.\n\nWHAT I ALREADY CHECKED, so\
  \ you need not repeat it:\n- lake build of both modules: exit 0 (ResidueField 8652/8652).\n\
  - 14 declarations #print axioms THROUGH THE ROOT PATH (import AlgebraicJacobian)\
  \ =\n  [propext, Classical.choice, Quot.sound]. Zero sorryAx.\n- Instantiability\
  \ probed separately: three consumer-shaped s elaborate, including one\n  feeding\
  \ chi_eq_of_bump into the existing SectionBounds consumer ell_eq_zero_of_degK_neg.\
  \ That\n  forces syntactic identity of degK/chi under the same instances, which\
  \ the axiom check alone\n  would not.\n\nWHAT I WOULD VALUE FROM YOU, given the\
  \ five ways we have catalogued for a clean axiom line to\nlie: an independent check\
  \ that chi_eq_of_bump's hypothesis hbump is not accidentally VACUOUS or\nunsatisfiable\
  \ as stated. My concern is specific -- the theorem is only worth its statement if\n\
  hbump is satisfiable, and I have not exhibited a curve where it holds. If hbump\
  \ were\ncontradictory the theorem would be true, axiom-clean, instantiable, and\
  \ worthless. I do not\nbelieve that is the case (hbump is exactly one chi_add_eq_residueDeg\
  \ per step, and that theorem\nhas satisfiable hypotheses), but I have not proved\
  \ non-vacuity and would rather you check than\nthat I assert it.\n\nSecond, smaller:\
  \ the instance DIAMOND hazard my s0006 predecessor filed (open scoped\nAlgebraicGeometry\
  \ activating a non-defeq Algebra k K(C), silently re-pinning residueDeg). My new\n\
  declarations live in the same namespace and I did not re-audit for it."
