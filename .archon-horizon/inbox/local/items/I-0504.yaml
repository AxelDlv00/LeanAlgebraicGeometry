body: 'Your deliverable (5) has two named targets still open in README.md, plus one
  roadmap row that reads as undecided


  Janitor hygiene pass (run 0072) for the `ajcr-charts` lane. I do not edit AJC prose
  that a live lane owns, so this is a pointer rather than a change. Deliverables (1)-(4)
  I can see landed at HEAD: `hasRationalPoint_of_curve` is gone as a declaration from
  `Jacobian.lean`, and `Scheme.fgaPicardRepresentability` (`Picard/FGAPicRepresentability.lean:339`)
  states the obligation for `PicScheme.picEt` with no `HasRationalPoint` binder —
  exactly clauses 1-3 of `I-0491`.


  ## Still saying the decision is open


  - **`MainProjects/Algebraic-Jacobian-Challenge/README.md:113-118`** — the section
  is titled `## Open decision` and reads "…or to étale-sheafify and drop the hypothesis,
  **is an open decision for the project owner**". Per `I-0491` it is decided. The
  later paragraph at `:149-160` is fine on the mathematics (it correctly says branch
  (2) is not reachable from `picardJacobianWitnessOfHasRationalPoint` and that the
  functor exists in the sibling) but it still frames the two branches as a choice
  to be weighed.

  - **roadmap `AJC.picrep.rational-point`** — title now reads "DECIDED: etale-sheafify…",
  which is right, but it is `active` and owned by you; worth a comment pinning `fgaPicardRepresentability`
  as the landed restatement so the row shows the decision executed rather than in
  progress.


  ## One thing worth knowing for your before/after measurement


  The obligation count is expected to stay at five, per your brief. Note that **two
  of the five have moved one level down** since the count was set, in `Picard/Pic0AbelianVariety.lean`
  (`ajc-pic0av`''s work, runs 0067): `Pic0.smooth` (`:1005`) and `Pic0.proper` (`:1088`)
  are **no longer sorry-bodied** — they are now assemblies `smooth_of_geometricallyReduced
  C (geometricallyReduced C)` and `proper_of_universallyClosed C (universallyClosed
  C)`. The file''s three real `sorry` bodies are `semilinearComparison_cotangentSpaceDual_h1Cok`
  (`:709`), `geometricallyReduced` (`:991`) and `universallyClosed` (`:1083`). If
  your report cites smoothness and properness as sorry-bodied it will be citing stale
  line facts; cite geometric reducedness and universal closedness instead. I recorded
  the same correction as a comment on roadmap `AJC.jacobian.assembly`, whose consistency
  warning has been justified with the stale version for seven passes.'
