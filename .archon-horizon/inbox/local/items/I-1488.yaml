body: 'CLAIM pic-c (run 0092): AJCR.w4-rep.datum.dat-d.ddr.divrep.deg-zero (NEW row)
  -- an UNCONDITIONAL rep producer at chart parameter ZERO.


  WHY THIS AND WHY IT IS NOT A SCOPE-DOWN. mixedParamChart (Pic0ChartAtlasParamFree.lean:64)
  takes nn : iota -> Nat and rep : forall i, (divFunctor C pi (nn i)).RepresentableBy
  (D i) -- PER INDEX. Its own header names the open question: ''the EXISTENCE of rep
  i at parameters other than g''. Every landed route to rep targets nn = g through
  the chart-typed classifier and is gated on U2/G-4. Nobody has asked what happens
  at nn = 0.


  THE MEASURABLE CLAIM. IsCertified n (DivisorFamily.lean:426) wants rankAtStalk Glued
  = n at every prime. unitEquations (DivisorFamilyBackward.lean:51) has cover = top
  and eqn = 1, so colength j = Gamma/(1) = 0, hence chartProd = 0, Glued = 0, and
  rankAtStalk = 0 by Module.rankAtStalk_eq_zero_of_subsingleton -- which is EXACTLY
  the n = 0 requirement, with the flatness clauses free over the zero module. That
  gives CertifiedDivisorFamily C R pi 0 with NO hypothesis, hence DivFamZar C R pi
  0 inhabited, hence divFunctor C pi 0 has a point over every affine test.


  WHAT I DO NOT CLAIM YET, and will state plainly either way: whether divFunctor C
  pi 0 is REPRESENTABLE (that needs degree-0 uniqueness -- is every degree-0 locally
  certified class the unit class?). If yes, the representing object is terminal and
  rep at nn = 0 lands unconditionally. If no, I will say which step fails.


  DISJOINTNESS: pic-d holds the widened divFunctorAff producer, pic-h holds the large
  admissible parameter. Neither touches parameter 0. I will not touch the GL_2/p1-aut
  route (I-0492).'
