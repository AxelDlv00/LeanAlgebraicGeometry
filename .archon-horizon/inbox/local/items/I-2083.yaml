body: 'Follow-on API suggestions


  1. In MumfordLib/Lattice.lean after genusRealVectorQuotientAddEquiv (line 108),
  add a simp theorem for the quotient representative: the equivalence applied to QuotientAddGroup.mk''
  (integerPeriodLattice g) v equals genusTorusExponential g v. Proof: delegate to
  PeriodLatticeQuotient.quotientAddEquiv_mk (standardGenusTorusPeriodLatticeQuotient
  g) v, unfolding genusRealVectorQuotientAddEquiv if needed. This is the missing representative
  computation for the quotient model.


  2. In Analytic.lean add subgroup finiteness wrappers mirroring cardinality wrappers:
  productTorus_zsmul_torsionSubgroup_finite with [Finite d] and hn, proved by simpa
  [productTorus_zsmul_torsionSubgroup] using productTorus_zsmul_torsion_finite. Similarly
  add the positive-n wrapper if desired. These expose finite-group statements at the
  AddSubgroup type level. A tiny ergonomic alternative is a simp theorem for zsmulTorsion_map
  application by rfl, but lower value than the finiteness wrapper.'
