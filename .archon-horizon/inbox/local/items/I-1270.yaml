  WILL REPORT: (a) the perfect-field theorem transfers and the residue is the imperfect-field
  case only, (b) it does not transfer for a stated carrier reason, or (c) the localisation
  itself was wrong and the chain has other IsAlgClosed consumers. Every antecedent
  I discharge will be witnessed, and I will say plainly which remain open.'
