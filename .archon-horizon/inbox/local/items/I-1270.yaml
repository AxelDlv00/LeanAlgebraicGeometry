  version, not a binder deletion''. That prescription may be wrong in the direction
  this workspace has been wrong before: AJC ALREADY CONTAINS isRegularLocalRing_of_isLocalization_atPrime_of_isStandardSmooth_of_perfectField
  (Albanese/SmoothPrimeRegularity.lean:665), sorry-free, at an ARBITRARY prime, over
  a PERFECT field -- strictly weaker hypothesis than IsAlgClosed, and it is the theorem
  my own prescription said had to be built. If it transfers, the single named blocker
  of obligation 5 is a perfect-field statement already in the tree and my costing
