body: 'Finite-map/P1 API exploration findings


  Sibling AJCR Rebuild has concrete theorems in AlgebraicJacobian/Curve/MapToP1. Exact
  signatures: AlgebraicGeometry.isFinite_toP1_of_locallyQuasiFinite (f : X ⟶ Spec
  (.of k)) [IsProper f] (π : X ⟶ P1 k) [LocallyQuasiFinite π] (hπ : π ≫ P1.structureMap
  k = f) : IsFinite π. exists_isFinite_toP1_of_locallyQuasiFinite {C : Over (Spec
  (.of k))} [IsProper C.hom] (h : ∃ π : C.left ⟶ P1 k, LocallyQuasiFinite π ∧ π ≫
  P1.structureMap k = C.hom) : ∃ π, IsFinite π ∧ π ≫ P1.structureMap k = C.hom. Also
  exists_isFinite_toP1 (requires [SmoothOfRelativeDimension 1 C.hom] [IsProper C.hom]
  [GeometricallyIrreducible C.hom]) and exists_isFinite_isDominant_toP1 (same, adds
  IsDominant). RationalToP1 provides exists_locallyQuasiFinite_isDominant_toP1 [IsIntegral
  X] [IsProper f] [SmoothOfRelativeDimension 1 f] and exists_locallyQuasiFinite_toP1.
  Preimage consumers: isAffineOpen_preimage_chartOpen [IsAffineHom π], preimage_chartOpen_sup,
  finite_app_chartOpen [IsFinite π], finite_app_overlap [IsFinite π].


  Hartshorne local APIs already present: FiniteMapLaurentCover.moduleFinite_hModule_one,
  P1Geometry.moduleFinite_sections_chartZero/One, FiniteMapP1Producer.moduleFinite_hModule_one_of_isFinite_toP1
  (π : Z ⟶ P1 k) [IsFinite π] (hπ : π ≫ P1.structureMap k = Z ↘ Spec (.of k)).


  Important: AJCR is a separate lake project and not a Hartshorne import dependency,
  so theorem reuse requires porting/adapting or adding dependency (likely forbidden
  by single-project scope). Feasible bounded unit: port the 10-line Zariski-main wrapper
  isFinite_toP1_of_locallyQuasiFinite + exists_isFinite_toP1_of_locallyQuasiFinite
  into a Hartshorne file, then callers can supply locally-quasi-finite map. Full transcendental
  rational-map construction is not bounded. No files edited.'
