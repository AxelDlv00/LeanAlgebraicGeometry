body: "CLAIM pic-e (0095 r6): reduce BOTH conjuncts of the seam sorry to the POINTED\
  \ FGA theorem — the arbitrary-field difficulty, end to end\n\nWHAT I AM TAKING.\
  \ Rows AJC.picrep.etale-rep (unowned at HEAD) and AJC.picrep.etale-rep.descent-assembly\
  \ (already mine at HEAD). New file Picard/PicEtPointedReduction.lean. I am NOT touching\
  \ AJC.picrep.divgrassmannian (pic-f's), any Div* file, or the AJCR tree.\n\nTHE\
  \ MEASUREMENT THAT MOTIVATES IT. Three landed facts nobody has composed:\n (1) seamClauseOne_of_hasGaloisQuotient_lftFree\
  \ (Picard/PicEtGaloisQuotient.lean:30) already consumes hq AND hcov internally —\
  \ pic-f closed hcov and hasGaloisQuotient_of_orbitsInAffineOpen (GaloisQuotientOverlap.lean:1635)\
  \ is a GLOBAL instance from [OrbitsInAffineOpen] alone, no affineness. So of the\
  \ four inputs the descent-assembly row lists, its remaining instance binder is ONE:\
  \ OrbitsInAffineOpen at the k'-representing scheme.\n (2) exists_finiteGalois_level_hasRationalPoint_of_geometricallyIntegral\
  \ (Curve/GaloisLevelRationalPoint.lean:217) is UNCONDITIONAL — every curve with\
  \ the headline binders gets a rational point at SOME finite Galois k''/k, with no\
  \ hypothesis on C(k).\n (3) hasPicSchemeEt_of_picSharp_representability and isIso_picEtComparison_of_picSharp_representability\
  \ (Picard/PicEtSubcanonical.lean) both carry NO rational-point binder.\n\nWHAT I\
  \ WILL PROVE. Both conjuncts of fgaPicardRepresentability over an ARBITRARY k follow\
  \ from a single uniform antecedent — picSharp-representability for curves that HAVE\
  \ a rational point — plus OrbitsInAffineOpen. Clause (2) needs the pointed antecedent\
  \ ALONE, no orbits, no descent. This is not a new hypothesis on the headline: it\
  \ is an implication with the antecedent written out, and it converts the arbitrary-field\
  \ question I-0491 made the point of the campaign into the pointed question the Milne-Kollar\
  \ campaign is already built to answer.\n\nWHAT IT WILL NOT DO, said now: the seam\
  \ sorry stays, because the pointed antecedent is itself unproved in-tree (that IS\
  \ the campaign) and OrbitsInAffineOpen at a Picard scheme is unproved. I will report\
  \ both as explicit undischarged antecedents and will NOT claim a producer for rep.\
  \ If the orbit binder turns out reachable I will say so with a term, not a costing."
