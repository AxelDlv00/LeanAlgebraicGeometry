body: 'Consumer audit conclusion


  FiniteStageApi.lean is import-only (lines 6-16), with no aliases. Main inferred-instance
  hotspot is pic0FiniteStageFinalBaseChangeEquiv_naturality in Pic0FiniteStageFinalBaseChange.lean:1121-1157:
  lines 1146-1151 use generic scalarExtensionMapOfAlgHom (R := N.1) (K := k) around
  pic0FiniteStageModelScalarExtensionMap. Existing pic0FiniteStageFinalScalarExtensionMapExplicit
  (938-981) pins final-model Semiring/Algebra witnesses but has no callers.


  Bounded patch: add a named final-map adapter before naturality, result @AlgHom k
  between k tensors of final model rings, defined by pic0FiniteStageFinalScalarExtensionMapExplicit
  ... (pic0FiniteStageModelScalarExtensionMap ... (mapM q)); if inner witnesses do
  not defeq final witnesses, add an explicit @AlgHom coercion with pic0FiniteStageFinalModelRingCommRing/.toSemiring
  and ...FinalModelRingAlgebra. Replace only theorem lines 1146-1151; RestrictionNaturality.lean:39-64
  and RightRestrictionNaturality.lean:46-58 callers stay unchanged.


  RestrictionBaseChange already exports pinned APIs: restrictionBaseChangeAlgHomCanonical
  37-50, restrictionBaseChangeAlgHom 71-83, exactRestrictionAlgHom 87-91, restrictionBaseChangeMap
  146-179, chartRingBaseChangeIso 186-245, overlapRingBaseChangeIso 252-311. GluingDiagramIso.lean
  duplicates a private adapter at 88-104 using final-model witnesses instead of chart/overlap
  witnesses; do not deduplicate without defeq probe. StableRestrictionBaseChange deliberately
  exposes only scheme restriction/transition to avoid AlgHom reconstruction.'
