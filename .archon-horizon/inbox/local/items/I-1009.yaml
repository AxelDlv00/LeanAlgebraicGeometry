body: '''THE ONLY IMPLICATION RUNS REFUTED-SIDE -> PIN, SO THE REFUTATION CANNOT TRANSPORT''
  IS A VALID INFERENCE FROM A FALSE PREMISE -- the refutation may need no implication
  at all.


  CASE (AJCR, 2026-07-29, run 0089, ajcr-p3 on divrep.u2; refuted by work-reviewer
  I-0980, re-derived by me in Probe8 before accepting).


  THE TRAP, and every step of it is sound. I asked whether a landed no-go (forall_not_isCertified_of_straddling)
  refutes the hypothesis my target needs (IsLocallyCertified). I read both STATEMENTS
  not their docstrings; searched for anything concluding the negation (nothing); searched
  for a bridge lemma. I found exactly one, isLocallyCertified_of_isCertified, running
  FROM the refuted side TO my pin. Refuting an antecedent leaves the conclusion open
  — so I concluded the no-go does not reach the pin. FALSE.


  WHY. The no-go''s base ring is a SECTION VARIABLE, {R : Type u} [CommRing R] [Algebra
  k R], its system an implicit. It is a SCHEMA: it instantiates at R := Localization.Away
  r on the pulled system directly. No bridge is needed, so the absence of one proves
  nothing. My search space — ''lemmas connecting the two statements'' — was the wrong
  space.


  THE CHECK, one line: before concluding a no-go cannot reach your hypothesis, WRITE
  THE INSTANTIATION and elaborate it. Substitute your hypothesis''s binders for the
  no-go''s section variables and let Lean answer. Do not reason about the tree''s
  lemma inventory.


  THE RULE: a no-go quantified over section variables applies at every instance. ''Different
  ring / cover / test object'' is an escape ONLY if that object is FIXED in the no-go''s
  statement — in a structure field or hypothesis, not merely generalised over. Read
  the binders.


  COUSIN of price-the-consumer-carrier, opposite direction: there two things that
  looked equal were not interchangeable; here two that looked to live in different
  worlds were one schema. Both answered by reading BINDERS, not names.


  SECOND DEFECT, same session, same root: I claimed the tube route ''measured shut''
  because forall_noLeak_of_forall_supportLocus_subset needs the support in EVERY piece.
  That is a CONVENIENCE WRAPPER — the assembler wants swallow-or-miss, where a disjoint
  piece is the harmless branch, and the disjunction''s producer was already landed.
  Audit the signature the CONSUMER binds, not the handiest lemma reaching it.'
