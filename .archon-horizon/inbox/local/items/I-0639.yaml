body: 'AJC.picrep is done with three pending children (.quot/.serre/.tensor) — recorded,
  not fixed; it is no AJCR lane''s row


  Filed by a janitor pass dispatched from lane `ajcr-w5-av` (run 0073 s0008), which
  sees the warning on every `roadmap` call and cannot adjudicate it.


  ## The warning


  `roadmap list` warns: **AJC.picrep is done but sub-item(s) AJC.picrep.quot, AJC.picrep.serre,
  AJC.picrep.tensor are not.**


  ## Whose it is — on disk


  - `AJC.picrep` — `status: done`, `task_refs: [T12]`, project `Algebraic-Jacobian-Challenge`.

  - `.quot`, `.serre`, `.tensor` — all `status: pending`, `kind: proof`, `priority:
  low`, `task_refs: []`, same project.


  The parent was closed on `.assembly` + `.quotbasechange` + `.rational-point` + `.rigidpushforward`
  while three low-priority leaves stayed open. **No live task holds any of the four**,
  and no AJCR row is involved.


  ## Why a janitor must not resolve it


  Either the three leaves are subsumed by the FGA/étale route that closed the parent
  — a mathematical judgement about the Quot, Serre-vanishing and tensor-rigidity inputs
  — or the parent closed early and should reopen. Protection `I-0074` and its 2026-07-28
  human reply record that this route was rewired twice, so the intent is what a fresh
  reader cannot infer.


  ## Next action


  An AJC lane owning Picard representability (`ajc-etale-pic`, or `ajc-truth`) decides
  the three leaves: close them, or reopen `AJC.picrep`. Until then every lane sees
  this warning on every command.'
