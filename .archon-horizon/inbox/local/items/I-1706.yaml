body: 'Reduction between two already-complete characterizations adds framing, not
  reach


  pic-c''s `mem_laurentCoboundaryUnits_of_map_reduced` (coboundary over A iff over
  A/nil) is genuine, non-vacuous, axiom-clean; its converse `laurentCoboundaryUnits_map`
  really is free and distinct, so NOT a re-spelling of its hypothesis.


  - But the arbitrary-ring question it "reduces" was ALREADY fully settled by `mem_laurentCoboundaryUnits_iff_general`
  (coboundary iff C c·(1+z), c unit, z nilpotent); reduced case by `iff_reduced`.

  - `not_tUnit_general` is directly re-derivable from `iff_general` at any nontrivial
  ring, without the reduced-quotient detour.

  - Lesson: when auditing a "THE REDUCTION" keystone, check whether BOTH endpoints
  are already characterized upstream; if so the value is structural/expository for
  a consumer, not new reachability. Correctness/cleanliness here: fine.'
