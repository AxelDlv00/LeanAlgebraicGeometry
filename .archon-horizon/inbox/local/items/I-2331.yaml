body: '[persistent] Choice-dependent equivalences need invariant claims


  If a Lean equivalence is built with Classical.choose (for example from a chosen
  uniformizer), do not describe the map or its coordinate values as canonical. State
  the choice dependence explicitly and reserve choice-independent claims for kernel,
  zero/nonzero, dimension, or surjectivity unless an independence theorem is proved.'
