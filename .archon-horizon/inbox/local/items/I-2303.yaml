body: 'Hartshorne bridge investigation (read-only)


  Current state: LocalRatioRegularization.chartMap (LocalRatioProjectiveChart.lean:103)
  is canonical Proj.fromOfGlobalSections; ProjectiveCoordinates.fromOpen is explicit
  affine adapter. LocalRatioCanonicalBridge.lean:61 already proves the canonical restriction
  theorem chartMap_morphismRestrict_denominator: for normalized denominator i, r.chartMap
  restricted to Proj.basicOpen 𝒜 (X i) equals (Scheme.isoOfEq preimage).hom composed
  with Proj.toBasicOpenOfGlobalSections 𝒜 f rfl zero_lt_one X_mem_deg_one.


  Mathlib source (.lake-packages/mathlib/Mathlib/AlgebraicGeometry/ProjectiveSpectrum/Basic.lean):
  toBasicOpenOfGlobalSections lines 368-376; openCoverOfMapIrrelevantEqTop lines 412-434;
  fromOfGlobalSections lines 436-452; fromOfGlobalSections_preimage_basicOpen lines
  454-489; fromOfGlobalSections_morphismRestrict lines 491-498; fromOfGlobalSections_resLE
  lines 500-506. No theorem directly comparing toBasicOpenOfGlobalSections with ProjectiveCoordinates.fromOpen
  or awayLift exists anywhere in configured workspace.


  Smallest realistic next producer: add a local affine comparison lemma for one normalized
  chart, then canonical-vs-explicit equality. Explicit map unfolds as U.toSpecΓ composed
  with Spec.map of chartHom i c hi composed with Proj.awayι 𝒜 (X i) ...; chartHom
  = awayLift. Canonical affine factor is toBasicOpenOfGlobalSections, whose final
  map is likewise basicOpenIsoSpecAway.hom composed with Spec.map of the IsLocalization.map
  induced by f. Prove ring-hom equality by RingHom.ext on Away.mk and awayLift_mul_eq
  / IsLocalization.map_mk''; then compose with basicOpenIsoSpec.inv and use chartMap_morphismRestrict_denominator.


  After that, global equality should use Scheme.Cover.hom_ext (Gluing.lean:451-457)
  over a denominator-open cover. Existing LocalRatioProjectiveGluing.chartOpenCover/gluedFromOpen
  (lines 46-103) already glues explicit fromOpenFamily; only missing comparison theorem
  is explicitly documented at lines 18-20. No direct Proj hom_ext shortcut found.
  lake env lean HartshorneLib/Chapter4LocalRatioCanonicalBridge.lean succeeds.


  Recommendation: target the single-chart affine comparison first; a denominator-open
  cover equality is downstream and depends on having a genuine IsOpenCover of denominator
  charts.'
