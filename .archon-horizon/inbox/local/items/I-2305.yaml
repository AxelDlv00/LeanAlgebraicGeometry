body: "Disposable probe succeeded with NO new localization lemma. Exact compiling\
  \ theorem (Probe.lean lines 30-67):\n\n  theorem chartMap_eq_fromOpen (r : LocalRatioRegularization\
  \ a) :\n      r.chartMap = ProjectiveCoordinates.fromOpen (k := k) (J := Fin (n\
  \ + 1))\n        (Z := X.left) a.chart.U (X.left.overAlgebraMap k a.chart.U)\n \
  \       a.denominator_index r.regularized r.regularized_denominator_eq_one := by\n\
  \    have hcan := chartMap_morphismRestrict_denominator (a := a) r\n    change r.chartMap\
  \ =\n      (ProjectiveCoordinates.fromOpen (k := k) (J := Fin (n + 1))\n       \
  \ (Z := X.left) a.chart.U (X.left.overAlgebraMap k a.chart.U)\n        a.denominator_index\
  \ r.regularized r.regularized_denominator_eq_one :\n        a.chart.U.toScheme ⟶\
  \ Proj (MvPolynomial.homogeneousSubmodule (Fin (n + 1)) k))\n    let g : a.chart.U.toScheme\
  \ ⟶\n        Proj (MvPolynomial.homogeneousSubmodule (Fin (n + 1)) k) :=\n     \
  \ ProjectiveCoordinates.fromOpen (k := k) (J := Fin (n + 1))\n        (Z := X.left)\
  \ a.chart.U (X.left.overAlgebraMap k a.chart.U)\n        a.denominator_index r.regularized\
  \ r.regularized_denominator_eq_one\n    let F : a.chart.U.toScheme ⟶\n        Proj\
  \ (MvPolynomial.homogeneousSubmodule (Fin (n + 1)) k) := r.chartMap\n    have hfg\
  \ : F = g := by\n      apply (cancel_mono (Proj.basicOpen\n        (MvPolynomial.homogeneousSubmodule\
  \ (Fin (n + 1)) k)\n        (MvPolynomial.X a.denominator_index)).ι).1\n      change\
  \ F ≫ (Proj.basicOpen\n          (MvPolynomial.homogeneousSubmodule (Fin (n + 1))\
  \ k)\n          (MvPolynomial.X a.denominator_index)).ι =\n        g ≫ (Proj.basicOpen\n\
  \          (MvPolynomial.homogeneousSubmodule (Fin (n + 1)) k)\n          (MvPolynomial.X\
  \ a.denominator_index)).ι\n      rw [← Scheme.Hom.morphismRestrict_ι F\n       \
  \   (Proj.basicOpen\n            (MvPolynomial.homogeneousSubmodule (Fin (n + 1))\
  \ k)\n            (MvPolynomial.X a.denominator_index)), hcan]\n    exact hfg\n\n\
  The `change` and typed aliases are essential: without them, `cancel_mono` fails\
  \ to unfold `projectiveSpace` and cannot infer the target morphisms. `rw` closes\
  \ the remaining goal definitionally: `fromOpen` unfolds to the same `toBasicOpenOfGlobalSections`\
  \ factor in this normalized-denominator case. Probe compiles under `lake env lean`."
