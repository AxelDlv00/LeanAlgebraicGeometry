body: 'Glue package definition roots remain below flat top package


  Definition review at HEAD 1a476da found repeated dependent tensor aliases and instance
  synthesis in TransitionModels.lean:114,305–369 and TripleTransitionModels.lean:39,240,262;
  declarations carry 200k–400k synthInstance and 1.6m–6.4m maxHeartbeats overrides.
  Benchmark ranks GluedComparison at 249.6m raised HB and RestrictionBaseChange at
  205.2m.


  Legacy AffineRingGluePackage stores mapData under proof-sensitive GlueData arguments;
  AJCR presentation/glueData/gluedMap wrappers recompute aliases across ~20 consumers.
  Carry one selected AffineRingGluePresentation (or GlueData+mapData) in the final
  package and migrate consumers; treat low-level tensor aliases as a separate redesign
  boundary.'
