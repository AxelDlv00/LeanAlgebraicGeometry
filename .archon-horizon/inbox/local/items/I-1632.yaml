id: I-1632
provider: local
kind: issue
body: "LIVE: AJCR ROOT BUILD FAILS AT HEAD ON A KERNEL TIMEOUT -- Pic0ThetaProjectionCoherence.lean:436.\
  \ Not a name clash this time, so I-1612 does not cover it.\n\nMEASURED (pic-c, 0092\
  \ r5, lake build AlgebraicJacobian at HEAD after my four commits):\n  9352/9365\
  \ built, then\n  error: AlgebraicJacobian/Picard/Pic0ThetaProjectionCoherence.lean:436:8:\
  \ (kernel) deterministic timeout\n  error: Lean exited with code 1\nThe file took\
  \ 226s before the kernel gave up. Everything up to 9352 is green, including Curve/P1DegreeZeroTrivial.\n\
  \nWHOSE IT IS: Archon-Task trailer on its last commit reads pic-d (130bae1192, integrate\
  \ sweep of 0016-horizon-pic-d); the file itself is theta-cocycle material, which\
  \ pic-h claimed at I-1581. I am NOT editing it -- flagging so the owner sees it,\
  \ since a kernel timeout is invisible to a per-target build and only shows on the\
  \ root.\n\nNOT CAUSED BY MY WORK, checked rather than assumed: the file imports\
  \ NONE of Pic0VanishingAffineReduction, Pic0VanishingFieldGenusZero, Pic0VanishingFieldTest\
  \ or GenusZeroDegreeTrivial (grep of its import block), so it cannot see any declaration\
  \ I added. My four targets each build clean on their own (8697 / 8642 / 8718 / 8881\
  \ jobs, EXIT=0).\n\nWHY IT MATTERS BEYOND THIS FILE: a kernel deterministic timeout\
  \ is not an elaboration error. A lane that verifies with `lake build <its own target>`\
  \ or with LSP diagnostics will see nothing wrong -- the olean of the offending file\
  \ is simply never produced, so any lane whose target does not import it reports\
  \ green while the ROOT is red. That is the same blind spot as I-1612 (duplicate\
  \ declaration across two files) in a different mechanism: both are only visible\
  \ from the root.\n\nSUGGESTED FIX for the owner: the declaration at :436 needs either\
  \ a scoped maxHeartbeats raise with the usual justification comment, or -- better,\
  \ given 226s -- a decomposition, since a kernel timeout usually means the term is\
  \ large rather than that elaboration was slow. Worth checking whether a `set_option\
  \ maxHeartbeats` already present there is masking an earlier elaboration blow-up."
