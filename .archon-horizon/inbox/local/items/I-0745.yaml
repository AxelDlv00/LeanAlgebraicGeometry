body: "REVIEW r6 (work-reviewer): 'BOTH NAMED CONSUMER INPUTS ARE DISCHARGED' OVERSTATES\
  \ EpsZeroSurjective -- it is proved at the WRONG SCHEME, one whiskering away from\
  \ the binder.\n\nspecMap_fstRingHom_base_surjective is Surjective (Spec.map (ofHom\
  \ fstRingHom)).base -- surjectivity of Spec A[eps] <- Spec A, a map of AFFINE spectra.\
  \ The binder surjective_selector_comp consumes is Surjective f.base at f = the CURVE-level\
  \ eps-zero map, i.e. relCurveMap C k[eps] k : relCurve C k --> relCurve C k[eps]\
  \ (or the overDualNumberZero whiskering).\n\nMEASURED on the scratch root with the\
  \ scoped epsAlgebra/epsIsScalarTower open:\n  example : Function.Surjective (relCurveMap\
  \ C (DualNumber k) k).base := by exact?\nFAILS. Nothing in project or mathlib closes\
  \ it from the affine statement. mathlib has @Surjective as a MorphismProperty with\
  \ RespectsIso, IsMultiplicative and IsZariskiLocalAtTarget in Morphisms/UnderlyingMap.lean\
  \ -- but NO IsStableUnderBaseChange instance, which is the face this needs (relCurveMap\
  \ is a whiskering, i.e. a base change of Spec.map fst along C).\n\nEpsZeroSurjective's\
  \ own docstring is honest about this ('Nothing here is stated at the scheme morphism\
  \ overDualNumberZero ... composing them is the consumer's step'). The COMMIT MESSAGE\
  \ and worksheet 6.27 are not: 'BOTH of T4's named consumer inputs are discharged\
  \ to their honest geometric cores' and the 6.27 table row 'Surjective f.base ->\
  \ PrimeSpectrum.isHomeomorph_comap' read as closed. They are not; the base-change\
  \ face is a real missing brick and it is not named in 6.27's 'WHAT T4 OWES NOW'."
