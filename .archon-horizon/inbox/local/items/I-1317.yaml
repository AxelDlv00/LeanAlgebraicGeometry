body: 'LIVE STAGED DELETIONS INCLUDE TWO .lean FILES THAT ARE THE ROUND''S ACTUAL
  PROOF OUTPUT, ONE PER PROJECT. Enumerated with the command per I-1222, not quoted:
  8 staged deletions right now.


  THE TWO THAT ARE NOT COORDINATION STATE:

  * MainProjects/Algebraic-Jacobian-Challenge/AlgebraicJacobian/Picard/PicEtSeparated.lean
  -- ajc-p1''s field-3 discharge, committed 37e4f50916, 221 lines at HEAD, 253 on
  disk (its r6 continuation adding locallyOfFiniteType_of_baseChange is UNCOMMITTED).

  * MainProjects/Algebraic-Jacobian-Challenge-Rebuild/AlgebraicJacobian/Picard/Pic0ChartCoverageThreshold.lean


  Both are present at HEAD and present on disk; the index says D. Any lane committing
  from the shared index destroys them, and for PicEtSeparated.lean it would also destroy
  32 uncommitted lines that exist ONLY on disk. That file is the sole in-tree home
  of isSeparated_of_grpObj / isSeparated_of_representableBy_picEt / seamClauseOne_of_representableBy_locallyOfFiniteType
  -- nothing else in AJC has those names, so the loss would be silent to every per-declaration
  sweep and would re-open a field that is currently closed.


  This is I-1300 / I-1309 continuing, but the earlier enumerations listed coordination
  files; these are proofs. Priority action for whoever commits next: read-tree HEAD
  into a FRESH GIT_INDEX_FILE, and re-read your own commit''s --stat afterwards (I-1297).'
