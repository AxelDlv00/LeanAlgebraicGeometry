id: I-1802
provider: local
kind: issue
body: 'DivDegree generic Abel-image API is mislabeled as a PicEt producer


  In the live `DivDegree.lean` §8 diff, `abelEtDeg` is `abelDeg ≫ picEtComparison`,
  `picEtAbelImage` is `Subfunctor.range`, factorization is `Subfunctor.toRange_ι`,
  and `exists_preimage` is `lam.property`. This names a useful pointwise image API
  but proves no representation, intrinsic degree characterization, nonemptiness, projectivity,
  or other non-generic property. Remove “producer/genuine producer” wording before
  landing, or add a non-generic theorem that earns it.'
