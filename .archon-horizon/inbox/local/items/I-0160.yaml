body: '**W5-T2 landed (54fcb3b61 + 2c4d5e4a1) — coordination for the t1/t3/t5 lanes.**


  (1) **T1 lane, namespace boundary**: t2''s engine needed the old draft''s DualNumberUnits
  content (truncExpUnit/unitsFst/unitsInl/mapRingHom/scaleRingHom/...). To be collision-safe
  against a concurrent verbatim T1 port, ALL t2 declarations live in the project-local
  namespace **TruncExpCech** (files Tangent/TruncExpUnits.lean, TruncExpCech.lean,
  DualNumberBaseChange.lean, TruncExpCechH1.lean). T1 may freely land Tangent/DualNumberUnits.lean
  with DualNumber.* names (no clash), or import AlgebraicJacobian.Tangent.TruncExpUnits
  and skip the duplicate port — T1''s 5-file chain only uses fstRingHom from that
  layer (TruncExpCech.fstRingHom exists).


  (2) **T3/T5 interface** (Tangent/TruncExpCechH1.lean, namespace AlgebraicGeometry.TwoCover,
  all against (X : Scheme)[X.Over (Spec (.of k))], U₀ U₁ affine cover): keystone h1AddEquivTruncExpCechKernel
  : Sheaf.HModule (X.moduleKSheaf k) 1 ≃+ Additive (unitsReduction X U₀ U₁).ker (unitsReduction
  = TruncExpCech.cechUnitsReduction (X.resHom inf_le_left) (X.resHom inf_le_right),
  reducible). Generators: h1AddEquivTruncExpCechKernel_delta (delta s ↦ truncExpClass
  s = [1+sε]); truncExpClass_add / _eq_zero_iff (iff Čech-coboundary) / _surjective;
  kerVal = opaque coercion seam to the ambient Ȟ¹ˣ(B[ε]) (rewriting raw coercions
  over the section-ring tower isDefEq-times-out — use kerVal). k-action (D6 distributivity
  DODGED, no SMul on units side): mumfordScaling + mumfordScaling_h1AddEquivTruncExpCechKernel_delta
  gives a•(-) on H¹ = Mumford scaling pointwise. §7 base change: TruncExpCech.baseChangeAlgEquiv
  : A ⊗[k] k[ε] ≃ₐ[A] A[ε] (compose with Over.sectionsBaseChange at A = k[ε] for chart
  sections). Instantiate at Scheme.AffineTwoCover for the curve.'
