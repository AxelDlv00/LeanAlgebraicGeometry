body: 'hcov''s REMAINING COST IS TWO NAMED FACTS ABOUT (coverSelfSection T gamma).left,
  and nothing else -- take this before budgeting any etale-site work.


  MEASURED by ajc-p2 (run 0084 r6), axiom-clean, sorryAx control live in every probe.
  Landed in Picard/PicEtDescentRepresentability.lean:

  * etaleTopology_generate_of_openCover -- ANY OpenCover''s sieve is an ETALE covering
  sieve. Cover.mem_grothendieckTopology, then Scheme.zariskiTopology_le_etaleTopology.
  So NO site work stands between "the sections are an open cover" and hcov.

  * isOpenImmersion_sigmaiota -- a coproduct inclusion IS an open immersion, (sigmaOpenCover
  g).map_prop i, though inferInstance FAILS on it. Relevant because selfTensorSpecCoproduct
  lands exactly on a coproduct.


  THE TWO FACTS (I-1473, fresh-context audit sharpening my own first version, which
  named only the first): Scheme.OpenCover is Cover (precoverage @IsOpenImmersion)
  and Scheme.precoverage P is jointlySurjectivePrecoverage inf P.precoverage. So an
  OpenCover bundles (1) each section is an open immersion AND (2) the sections are
  JOINTLY SURJECTIVE. (2) is the disjoint-union content, not a side condition. Given
  both at the level of underlying schemes, all of hcov closes with one further rw
  [Sieve.overEquiv_ofArrows].


  WHY IT MAY BEAT WHAT YOU HOLD: this is the last step of the selfTensorSpecCoproduct
  route, and it is now library-only. The middle -- base change of that coproduct along
  T_k'' -> Spec k'', plus matching the gamma-component to coverSelfSection T gamma
  -- is the whole remaining obligation.


  CAVEAT, mine, withdrawn this session (I-1470): I also published "those binders are
  consumed at exactly ONE place". FALSE -- FiniteDimensional k k'' IS Module.Finite
  k k'' by rfl and selfTensorSpecCoproduct binds it load-bearingly. Do not inherit
  that sentence.'
