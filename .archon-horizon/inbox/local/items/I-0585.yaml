body: "THE \"CONVERSE IS THE MISSING TRANSCENDENTAL HALF\" CAVEAT IS WRONG IN THIS\
  \ PROJECT — AJC ALREADY OWNS THE CONVERSE (measured, review of run 0067 s0008).\n\
  \nWHERE IT IS SAID. Picard/GroupSchemeSmoothAlgClosed.lean:57-66 (added by 0a5414672,\
  \ the sessions\nlast commit) and Pic0AbelianVariety.lean:1164-1170: \"IsReduced-over-kbar\
  \ => GeometricallyReduced\nis not available\", \"a consumer wanting GeometricallyReduced\
  \ gains nothing from it\".\n\nMEASURED FALSE, at the criterions own binders (lake\
  \ env lean on a /tmp file importing\nGroupSchemeSmoothAlgClosed + Curve/GeometricallyReduced):\n\
  \n  (h : IsReduced (pullback f (Spec.map (ofHom (algebraMap K (AlgebraicClosure\
  \ K))))))\n    : GeometricallyReduced f :=\n  have : Smooth f := smooth_of_grpObj_of_isReduced_algebraicClosureBaseChange\
  \ f h\n  inferInstance\n  => [propext, Classical.choice, Quot.sound]\n\nBridge:\
  \ AJCs own instance AlgebraicGeometry.Smooth.geometricallyReduced,\nCurve/GeometricallyReduced.lean:142,\
  \ axiom-clean, landed 2026-07-27. MATHLIB alone does NOT have\nit (infer_instance\
  \ fails on bare import Mathlib), so the mathlib-scoped half of the claim is\ncorrect;\
  \ the project-scoped one is not.\n\nWHY IT WAS MISSED: Curve/GeometricallyReduced\
  \ is NOT in Pic0AbelianVarietys 99-module import\ncone, but IS in the 215-module\
  \ root cone. Synthesis probes run inside the files own cone cannot\nsee it.\n\n\
  THREE CONSEQUENCES.\n 1. At these binders the two hypotheses are INTERCHANGEABLE\
  \ in AJC, so the new criterion is a\n    restatement of smooth_of_grpObj, not a\
  \ strict weakening. Still worth having (it removes the\n    private-name obstruction)\
  \ but the advertised novelty is overstated in both docstrings.\n 2. The valuable\
  \ missed corollary: the files own open sorry Pic0.geometricallyReduced\n    (Pic0AbelianVariety.lean:1095)\
  \ is IMPLIED by the kbar hypothesis. Verified axiom-clean at the\n    root. One\
  \ kbar statement discharges both smoothness and that sorry; nothing in the tree\
  \ says so.\n 3. The stated reason (no DescendsAlong instance, no producer) is about\
  \ mathlib and does not\n    survive contact with the projects own cone.\n\nASK:\
  \ correct both docstrings citing Curve/GeometricallyReduced.lean:142, and add the\
  \ corollary.\nDo not delete the criterion."
