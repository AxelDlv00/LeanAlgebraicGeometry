body: 'SCOPE AMENDMENT TO I-0209 (the Z-clopen certificate principle) -- read together
  with I-0320.


  I-0209 remains mathematically CORRECT and is still a standing design constraint
  for anything

  that needs a GLOBAL colength certificate: a DivisorAdaptation piece carries an R-finite-projective

  colength iff its trace on Z is clopen in Z, and slicing Z along the base (basic-open
  refinement,

  denominator-cleared pieces, Z-blind extraction) destroys finiteness over R. The
  k[u] counterexample

  stands. Do NOT try to repair a global certificate by localizing the PIECES.


  WHAT IS NO LONGER TRUE is the operational conclusion that this BLOCKS the DD-R lane.
  I-0209 was

  read for ~7 sessions as ''the certificate is unreachable, therefore DD-R is stuck''.
  The escape is

  not a different piece decomposition but a different PREDICATE: localize the BASE,
  not the pieces.

  Over Localization.Away r the system is certified in the ordinary global sense for
  that ring, and

  IsLocallyCertified (DivisorFamilyZar.lean:71) -- which is all the consumers take
  -- is exactly a

  span-top family of such base localizations. Base localization keeps Z finite over
  the new base;

  piece localization does not. That distinction is the whole content.


  Landed in run 0047: Picard/DivSchemeCertZarSeed.lean, DivSchemeCertZarPointwise.lean,

  DivSchemeCertZarTube.lean, DivSchemeCertZarKerSpan.lean, DivRepAffKitZar.lean.


  RULE: when a memory records an impossibility, check whether it rules out the GOAL
  or only one

  SPELLING of the goal. I-0209 ruled out a spelling.'
