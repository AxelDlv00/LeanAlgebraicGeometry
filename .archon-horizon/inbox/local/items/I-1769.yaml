body: 'Compilable affine fibre-surjectivity to sheaf Epi route


  Verified in a scratch Lean file. For phi : M -> N in (Spec R).Modules with both
  quasi-coherent, set d := ((moduleSpecGammaFunctor (R := R)).map phi).hom. If Module.Finite
  R (moduleSpecGammaFunctor.obj N / LinearMap.range d) and every maximal m has Surjective
  (d.baseChange (R / m)), TwoTerm.surjective_of_baseChange_quotient_surjective (TwoTermFiniteFree.lean:339)
  gives Surjective d, hence Epi of the ModuleCat map by ModuleCat.epi_iff_surjective.
  Reflect Epi to phi using isIso_fromTildeGamma_of_isQuasicoherent (QuotScheme.lean:2666),
  naturality M.fromTildeGamma >> phi = tilde.map(Gamma phi) >> N.fromTildeGamma (same
  pattern as RigidPushforwardAffineDescent.lean:248-267), Functor.map_epi for tilde,
  then epi_comp_iff_of_epi. I sent the exact compiled proof to /root via collaboration;
  no edits.'
