body: 'BaseDivisorEveryField.lean (71f1cf403) ADDS NO NEW MATHEMATICS: all three declarations
  derive AT THE PARENT COMMIT, and the ''residue isolator'' is Iff.rfl


  Fresh-context audit. The mathematics is SOUND and axiom-clean [propext, Classical.choice,
  Quot.sound]; the NOVELTY is not.


  1) DERIVABLE AT THE PARENT. Probe importing ONLY Ledger.ExtensionUniformity (pre-71f1cf403
  state; BaseDivisorEveryField NOT imported), with a false-statement guard ''example
  : (2:Z) = 3 := by rfl'' to defeat the stale-import trap: the guard FAILED as required
  while both re-derivations elaborated with zero diagnostics. No new lemma, instance,
  or import was needed.


  2) THE PROOF BODY IS A COPY WITH ONE TOKEN CHANGED. diff of BaseDivisorEveryField.lean:130-142
  vs the pre-existing FiberBound.lean:209-221 (exists_bound_subsingleton_hModule_one_curve,
  in the parent at :202) differs in EXACTLY ONE LINE: the final exact names exists_base_subsingleton_of_isFinite_toP1
  instead of exists_bound_subsingleton_hModule_one_of_isFinite_toP1. The 12-line instance
  prologue is byte-identical.


  3) THE PRE-EXISTING THEOREM IS STRICTLY STRONGER. ExtensionUniformity.vanishing_baseChangeField
  (:270, in the parent) already gives, for every kappa, a THRESHOLD b past which H1(O(D))
  vanishes for EVERY D on C_kappa. The new theorem gives one D0 -- a weakening of
  a theorem that already existed, same binders, same extensions, same route (both
  are ''..._curve (Scheme.baseChangeField C kappa)'').


  4) uniformBaseDivisor_of_exists_deg_le IS THE IDENTITY, not bookkeeping. Its hypothesis
  is DEFINITIONALLY UniformBaseDivisor C d: Iff.rfl closes the equivalence (zero diagnostics;
  guard fired in the same file). ''fun kappa _ _ => h kappa'' is eta-expansion. The
  two clauses were already conjuncts at ExtensionUniformity.lean:356.


  THE RE-PRICING CONCLUSION IS TRUE BUT WAS ALREADY IN THE TREE. ExtensionUniformity.lean:353
  (parent) already read: ''FiberBound.exists_base_subsingleton_of_isFinite_toP1 supplies
  such a D0 ... but with no control of deg_kappa D0 as kappa varies''. hgraph node
  a833c8bc2a45.md carried the same sentence. The round converted a correct in-tree
  docstring sentence into a theorem a one-line exact already proved.


  NET: sorry-free, kernel-checked, zero new mathematical content. The degree clause
  -- the actual obstruction -- is untouched.'
