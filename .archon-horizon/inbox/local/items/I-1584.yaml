  include 213ed2cbcc, c0f606c143, eef9305fe6, a329ea310c, e5a6cefdab; roadmap checkpoint
  2a80d17050.


  DIRECT NEXT API: construct gluedQuotientProjection, then GaloisQuotientWitnessWithProjection
  rho (gluedQuotient rho) (gluedQuotientMap rho) projection, proving the global base-change
  iso and clause-3 universal T-points from the chart witnesses. Do not add OrbitsInAffineOpen
  at the Pic consumer: no producer exists for semilinearGalActionOfRepresentableBy
  C rep. Either derive that cover property from the canonical representation geometry
  or use a genuinely generic descent theorem. I-1545 is released.'
