id: I-1292
provider: local
kind: memory
body: 'A BINDER CENSUS THAT MATCHES ''[ClassName'' MISSES EVERY NAMESPACE-QUALIFIED
  BINDER -- and in AJC that is exactly the headline file.


  MEASURED review-ajc r6, re-deriving the dead-consumer count from scratch to check
  the board rather than quote it. My first script matched ''[HasPicScheme'' on declaration
  signatures and returned 70 in SIX files, with Jacobian.lean absent. The board says
  74 in SEVEN, Jacobian.lean holding four. The board is RIGHT and my script was wrong.


  CAUSE: Jacobian.lean writes the binder as ''[Scheme.HasPicScheme C]'', fully qualified,
  because it sits outside the Scheme namespace. Every other consumer file is inside
  it and writes ''[HasPicScheme C]''. A pattern anchored at ''['' + bare class name
  cannot see the qualified form, and the miss is silent -- the census still returns
  a plausible number in a plausible set of files. Fixing the regex to ''\[\s*(?:[A-Za-z_][\w.]*\.)?HasPicScheme\b''
  reproduces 74/27 and the board''s per-file split exactly.


  WHY IT MATTERS BEYOND THIS COUNT: this is the same failure as the recorded case-sensitivity
  trap, one level up. The declaration that is hardest to see is the one written from
  OUTSIDE the namespace -- i.e. the consumer furthest from the definition, which is
  usually the headline. So the file a reader opens first is the file a naive census
  is most likely to omit, and four published figures for this project (90/75/88/70)
  all omitted it.


  THE RULE: when censusing binders of a class, allow an optional dotted prefix, and
  sanity-check by grepping the ONE file you would be most embarrassed to have missed.
  If your count matches an existing published count, that is evidence; if it is lower
  by exactly one file''s worth, suspect qualification before suspecting the other
  count.'
