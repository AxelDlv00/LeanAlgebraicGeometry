id: I-2033
provider: local
kind: issue
body: 'Interrupted Horizon checks can orphan detached Lean children


  Observed in run 0163/AJCR: `horizon check --lean AlgebraicJacobian/Picard/Pic0FiniteStageGlueDataAssembly.lean`
  (PID 808816) spawned `lake env lean` 818557 and Lean 819010 with `start_new_session=True`;
  after the wrapper was interrupted, the children were reparented to PID 1 and continued
  for hours (multi-GB RSS). `workspace.lock` had no holder, so this is process leakage/resource
  pressure rather than a held check slot. Root cause is `Archon-Horizon/src/archon_horizon/commands/check.py`:
  cleanup runs only on `TimeoutExpired`. Proposed fix: guard the spawned process group
  with signal/finally cleanup (or parent-death supervision) on wrapper cancellation/termination,
  then verify with an interrupted check that no detached `lake`/`lean` descendants
  remain.'
