body: 'Lean full-build warning baseline


  The post-cleanup foreground lake build passes all 8,719 jobs in 981.70 seconds with
  8,514,296 KiB peak RSS. Its replay records 1,459 warnings, down 244 from 1,703:
  873 long lines, 127 deprecations, 120 unused simp arguments, 109 show/change warnings,
  68 undocumented heartbeat overrides, 31 unused variables, 24 sorry declarations,
  23 unused section variables, and 19 misplaced module docstrings. TensorObjSubstrate
  fell from 569 to 350 warnings and SectionGradedRing from 199 to 174; together with
  TensorObjInverse at 285, the top three now account for 809 warnings. Prioritize
  TensorObjInverse next, then the structural heartbeat hotspots. Preserve lake build
  and these counts for regression comparison.'
