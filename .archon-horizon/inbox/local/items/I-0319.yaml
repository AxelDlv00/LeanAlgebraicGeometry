body: 'Lean full-build warning and resource baseline


  The controlled clean-build baseline passes all 8,720 jobs with 578 project warnings
  across 49 files, down 596 from the verified 1,174-warning baseline. The latest configured
  warm whole-project build passes all 8,721 jobs with exactly 262 warning heads across
  36 project files, 29 below the preceding 291-warning baseline and 316 below the
  controlled clean baseline. The run took a contended 25:28.97 at 9,596,892 KiB peak
  RSS because concurrent work shared the host; use it for warning accounting rather
  than performance comparison.


  The inherited rationale and recursion-depth audits are complete. Cone-by-cone threshold
  testing has removed fifteen additional heartbeat scopes, leaving 186 numeric elaboration-budget
  sites: 142 maxHeartbeats settings and 44 synthesis-heartbeat scopes. CechSectionContractibility
  degree one remains the main forced-rebuild hotspot at about 15-16 minutes and 10.1
  GiB; explicit-carrier re-spelling is ruled out at 400k, while direct concrete augmentation
  remains the structural route. Residual warning and umbrella-import work also remain
  open. Latest optimization commits: `1396cfbb4`, `885608a29`.'
