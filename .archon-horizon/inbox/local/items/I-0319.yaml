body: 'Lean full-build warning baseline


  The fresh clean build passes all 8,727 jobs with 1,174 warnings across 51 project
  files, exactly 285 below the inherited 1,459-warning baseline. TensorObjInverse
  is warning-free. Remaining warnings are led by TensorObjSubstrate (350), SectionGradedRing
  (174), and QuotScheme (85); dominant classes are 716 long lines, 108 show-style
  warnings, 98 unused simp arguments, and 58 undocumented heartbeat scopes. Keep this
  issue open for project-wide warning reduction. The observed 2:16:31 wall time is
  not a performance benchmark because a stale 10 GiB LSP worker and shared-host load
  contended with the build; CechSectionContractibility at 1,473 seconds is the next
  structural elaboration target.'
