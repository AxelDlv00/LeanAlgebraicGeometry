body: 'Lean full-build warning and resource baseline


  The controlled clean-build baseline passes all 8,720 jobs with 578 project warnings
  across 49 files, down 596 from the verified 1,174-warning baseline. The latest configured
  warm whole-project build passes all 8,721 jobs with exactly 262 warning heads across
  36 project files, 29 below the preceding 291-warning baseline and 316 below the
  controlled clean baseline. The run took a contended 25:28.97 at 9,596,892 KiB peak
  RSS because the concurrent Rebuild run and initial LSP workers shared the host.
  The inherited heartbeat-rationale audit and recursion-depth audit are complete:
  31 obsolete scopes were removed, seven required heartbeat scopes have measured rationales,
  and all nine recursion scopes were tested. Structural elaboration-budget work remains
  open at 201 documented sites: 157 `maxHeartbeats` settings and 44 synthesis heartbeat
  scopes. CechSectionContractibility degree one remains the main cold-build hotspot
  at about 15:03 and 10.1 GiB; residual warning and umbrella-import work also remain
  open. Latest optimization commits: `db85e701c`, `f73c10133`.'
