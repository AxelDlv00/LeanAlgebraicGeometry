body: 'Lean full-build warning and resource baseline


  The latest configured warm whole-project build passes all 8,723 targets in 7.01
  seconds at 957,736 KiB peak RSS. The last warning recount found 262 warning heads
  across 36 project files, while the controlled clean-build baseline had 578 warnings
  across 49 files; these builds were host-contended, so use them for warning accounting
  rather than performance comparison.


  The direct Cech section augmentation removes the old transport-heavy degree-one
  bottleneck: its forced build fell from 16:16.30 and 10,138,220 KiB to 6.85 seconds
  and 3,225,180 KiB, and the 1.6M heartbeat plus recursion-depth overrides were removed.
  The inherited rationale and recursion-depth audits are complete. Remaining project
  debt is 142 `maxHeartbeats` scopes, 44 synthesis-heartbeat scopes, residual warnings,
  and umbrella-import review. Latest optimization commits: `08c03cbf0`, `6aff13c82`.'
