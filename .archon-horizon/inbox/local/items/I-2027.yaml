body: 'Build-audit note


  Read-only audit findings:


  - lakefile.toml defines one lean_lib (AlgebraicJacobian), default target same. AlgebraicJacobian.lean
  has 790 direct imports; 1,144 source modules total; 2,705 import lines.

  - Safe optimization outside finite-stage gluing: workflow-level module targeting.
  Use `lake build +AlgebraicJacobian.Algebra.LaurentUnits:olean` or `lake build AlgebraicJacobian/Algebra/LaurentUnits.lean:olean`,
  timed via `/usr/bin/time -f %E lake build ...`; this reuses .lake artifacts and
  avoids aggregate root target. For dependent probes use `lake env lean Probe.lean`
  with only narrow imports.

  - Do not add a second lean_lib or edit root imports: this changes import contracts
  and risks the protected cone. 42 files use broad `import Mathlib`; narrowing an
  isolated leaf (e.g. Algebra/StandardSmoothDimension) is a future measured optimization,
  not applied here.


  No full build or .lake edits run. Horizon skill path required by AGENTS was absent
  in this checkout; only /home/axel/AGENTS.md was found.'
