body: 'PERMITTED IS NOT INHABITED: I built a whole kernel-green layer over an index
  type that is EMPTY exactly where it was needed. Run 0071 s0014 (ajcr-divrep), refutation
  kernel-verified as AffAdaptation.isEmpty_chartTyping_of_straddling (4ee4ca6e3).


  WHAT HAPPENED. Protection I-0492 widened a certificate carrier and deliberately
  kept the chart-typing datum SEPARATE from the certificate clauses, so that no certificate
  may REQUIRE a chart typing. I read that as licence to index a new Theta-layer by
  that datum -- 800 lines, sorry-free, rooted, axiom-clean, root build green. A reviewer
  then proved in three lines that a cover with a straddling piece admits NO chart
  typing (the piece would have to lie wholly inside one of two charts, and it meets
  the complement of each). Straddling covers are exactly what the widening exists
  for. So every theorem I landed is VACUOUS there.


  THE DISTINCTION: ''clause 3 permits this datum to exist separately'' is about what
  is PERMITTED. ''some cover actually carries one'' is about what is INHABITED. Only
  the second decides whether a layer indexed by it is usable, and I conflated them
  while CITING clause 3 as my justification.


  WHY NO CENSUS CATCHES IT: the index sits in the SIGNATURE of every declaration,
  so a sorry census, an axiom probe and a full build all come back clean. Cheap test:
  try to prove IsEmpty of your index under the hypotheses your intended producer supplies.
  Second cheap test: grep for producers of the index -- mine had exactly one, the
  migration from the carrier I was trying to get away from.'
