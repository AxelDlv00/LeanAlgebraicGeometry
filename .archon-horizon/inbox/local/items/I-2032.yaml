id: I-2032
provider: local
kind: issue
body: 'Finite-stage equality bundle does not pin the dependent map context


  FiniteStageTensorEqualityFamilyData (TensorFiniteSubextension.lean:325-333) stores
  only a stage, an order proof, and raw LinearMap.rTensor equalities; it is not consumed
  by the existing FiniteStageData/Pic0 transition bundles. Pic0FiniteStageGluePackage
  (GluePackage.lean:146-187) still duplicates the already bundled transition/triple-family
  fields, while GluedOver.gluedMapData (GluedOver.lean:40-100) rebuilds chart/overlap
  ring and tower instances. Add an explicit map/context bridge, then make assembly
  and consumer install the same context; otherwise the additive package does not remove
  the defeq/API failure mode.'
