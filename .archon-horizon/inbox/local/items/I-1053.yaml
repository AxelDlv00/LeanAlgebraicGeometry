body: 'RELEASE ajc-p3: AJC.pic0av.structure (ETALE tower) -- ADVANCED, not closed.
  Owner cleared, status active, pinned 94599c2607 / 1455abbefd.


  LANDED, DO NOT REDO -- Picard/Pic0EtStructure.lean, rooted, 18 declarations, ALL
  sorry-free and axiom-clean against FOUR controls that correctly fire sorryAx. lake
  build EXIT=0 (8855 jobs); oleans rebuilt BEFORE every probe.

  * SMOOTHNESS: geometricallyReduced_of_isReduced_algebraicClosureBaseChange + smooth_of_...
  + the CONVERSE + the iff. Obligation 2 IS exactly IsReduced (Pic0SchemeEt x_k kbar)
  -- an EQUIVALENCE, not a weakening.

  * PROPERNESS (the half nobody else holds): quasiCompact FREE from isFiniteTypeGeometricallyIrreducible.2.1
  (never previously extracted); valuativeCriterion_uniqueness FREE from IsSeparated.valuativeCriterion;
  quasiSeparated FREE; proper_of_valuativeCriterion_existence; universallyClosed_of_baseChange
  + converse + iff; valuativeCriterion_existence_of_specializingMap. NET: ValuativeCriterion.Existence
  is the ENTIRE residue, with TWO independent routes (valuations, or topology via
  SpecializingMap).


  BOARD CAVEAT RETIRED: this row said the properness reduction is stated for Pic0Scheme
  and whether it carries to Pic0SchemeEt is unmeasured. It carries; quasiCompact is
  why.


  MY OWN I-1032 WAS WRONG (corrected in-tree, I-1044): NOT two independent obligations
  of five. Obligation 4 (leaf B, ajc-p2 holds it) IMPLIES obligation 2 via SmoothOfRelativeDimension.geometricallyReduced
  -- raised by p2 (I-1040), verified by me. Adding 2 and 4 overstates the distance
  by one. The PROPERNESS half is genuinely independent.


  TWO NEGATIVES: (a) IsProper has NO DescendsAlong instance for (Surjective inf Flat
  inf QuasiCompact) at v4.31 -- only its UniversallyClosed conjunct descends; (b)
  NO perfect-field shortcut -- dense_smoothLocus_of_perfectField wants only [PerfectField
  K] [IsReduced X], but the translation half needs pointEquivClosedPoint and fails
  to synthesize IsAlgClosed k, so kbar is where the argument LIVES (I-1045). Mathlib
  has NO Cartier result.


  NOTHING IS CLOSED. Both sorries stand (Pic0Et.lean:170, :223), neither antecedent
  is witnessed for ANY curve, and every declaration binds [HasPicSchemeEt C] whose
  instance projects the central sorry -- sorry-REACHABLE on instantiation.


  NEXT LANE: the properness residue is unowned and now single-named; the topological
  route is uncosted.'
