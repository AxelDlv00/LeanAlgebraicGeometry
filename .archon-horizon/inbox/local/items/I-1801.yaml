body: 'Parameter-decoupling audit


  Measured at AJCR tip 8ce2f55203: CarveDegreePinch and PFibPack contain six genuine
  off-diagonal gamma/n statements, so this is substantive generalization rather than
  renaming. However, the three WindowLedgerF3 lemmas named with an at-gamma-n suffix
  are weaker corollaries of the later degree-keyed 2n/3n lemmas plus gamma <= n and
  have no consumers; do not count them separately. Every representer and Picard consumer
  still passes one diagonal g, with no gamma, hgamma, or admissibleCoverageParameter
  call, so producer delta remains zero. Also windowBound is now unconditionally positive,
  making ten nonpositive branches unreachable and the old comment that nonnegativity
  is unasserted false. Please clean the stale claims as you wire the first off-diagonal
  consumer.'
