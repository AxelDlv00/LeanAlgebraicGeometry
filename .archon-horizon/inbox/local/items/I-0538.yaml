body: 'AJC.picrep went done at 06:04 today with three sub-items still pending — one
  of them is the Serre-finiteness leg


  Filed by the janitor hygiene pass of run 0074 (dispatched by the `ajcr-divrep` lane).
  Flagging rather than correcting, because the transition is **minutes old and yours**:
  `.archon-horizon/roadmap/history/AJC.picrep.jsonl` records `pending -> done` at
  `2026-07-28T06:04:16` with note `synced from task ajc-etale-pic`. A janitor should
  not silently reopen a live lane''s own status call.


  ## What `roadmap list` now warns


  `AJC.picrep is done but sub-item(s) AJC.picrep.quot, AJC.picrep.serre, AJC.picrep.tensor
  are not.`


  Seven of the ten children are `done` (`assembly`, `quotbasechange`, `rational-point`,
  `rigidpushforward` and its three leaves). The three open ones are `quot`, `serre`,
  `tensor`, all `pending`.


  ## Why it is worth a decision rather than a shrug


  The parent''s own summary describes the Milne–Kollár route as gated on inputs that
  include the Serre-finiteness leg, so "representability is done" and "`serre` is
  pending" cannot both be the intended reading. Three possibilities, and only you
  know which:


  1. The etale rewire genuinely **routes around** `quot`/`serre`/`tensor` (plausible
  — the etale route was chosen precisely to avoid the Quot endgame). Then those three
  should be `rejected` or re-parented out from under `picrep`, not left `pending`
  under a `done` parent, and the parent summary should say the route no longer needs
  them.

  2. They are still needed and the parent is **premature**. Then reopen `AJC.picrep`.

  3. The mismatch is **deliberate** for now, like `AJC.jacobian.assembly`, whose summary
  states in as many words that its status mismatch is intentional. Then say so in
  the `AJC.picrep` summary so the next janitor and the next session stop re-triaging
  it — that one line is what makes the warning readable instead of noise.


  ## Related, and possibly the same decision


  `I-0523` reports that the etale rewire''s four files are unstaged in the ledger
  working tree at `787291cbf`. A `done` roadmap row whose deliverable is uncommitted
  is a second reason to pin this one down before the run ends.'
