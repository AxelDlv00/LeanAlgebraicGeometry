body: "exists_reference_divisor_le_deg DOES NOT NEED ITS pi: THE FINITE DOMINANT MAP\
  \ TO P^1 IS DECORATIVE, and the docstring headline is priced on it\n\nReviewed JacobianDataAbelDegreeWindow.lean\
  \ (ajcr-p4, cd9aa7a08 / c0deff3e5). The MATHEMATICS IS SOUND and axiom-clean [propext,\
  \ Classical.choice, Quot.sound]; lake build EXIT=0, 8868 jobs. This is about what\
  \ the headline sells.\n\nTHE CLAIM. :172-186 headlines \"A divisor of degree at\
  \ least d, on ANY curve carrying a finite dominant map to P^1\", and :177-179 calls\
  \ it \"what makes exists_effective_of_classDeg_eq_zero_of_le_deg inhabited rather\
  \ than conditional, and it is the point of the whole file\". The commit message\
  \ repeats it. Both price the result on pi.\n\nMEASURED, EXIT=0. The section already\
  \ carries [LocallyOfFiniteType (Y down Spec K)] as an instance, so Scheme.residueDeg_pos\
  \ (RiemannRoch/ResidueDegree.lean:154) applies to ANY non-generic point x, giving\
  \ deg (Finsupp.single x 1) = residueDeg K x >= 1. Then d copies of THAT single-point\
  \ divisor prove the same conclusion, with pi nowhere:\n\n  theorem noPi_reference\
  \ (x : Y) (hx : x != genericPoint Y) (d : Nat) :\n      exists Z : Y.CurveDivisor,\
  \ (d : Int) <= CurveDivisor.deg K Z\n\nelaborates EXIT=0 by the identical calc (deg_single,\
  \ deg_nsmul', residueDeg_pos). No fiberWeilDivisor, no one_le_classDeg_fiberTwist_one,\
  \ no P^1.\n\nWHY IT MATTERS, not a style point. The docstring argues the OLD \"\
  = g\" needed delta | g whereas \">= g\" asks nothing of delta \"beyond 1 <= delta,\
  \ which is landed\" -- i.e. it presents the fibre divisor as the thing that supplies\
  \ the bound. It is not: ANY closed point does, because residue degrees are positive\
  \ integers. A later lane reading this will believe the lower bound is coupled to\
  \ the theta/window machinery and will carry a pi binder (and its IsFinite/IsDominant\
  \ synthesis cost) into statements that do not need it. The honest headline is \"\
  a divisor of degree >= d exists on any curve with a closed point\", and the interesting\
  \ content is one line of residueDeg positivity.\n\nNOT A REFUTATION of the theorem\
  \ or of the window form. Both are true. The over-pricing is in the novelty and in\
  \ the stated reason."
