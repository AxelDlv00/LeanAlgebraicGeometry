body: 'THE k^s SECTION IS LANDED, AND THE ROUTE STILL HAS NO SECTION WHERE G1 NEEDS
  ONE: G1 spreads J5''s datum to a FINITE Galois level, where IsSepClosed is false
  by construction. Nobody prices this second step.


  SITE THAT MADE THE CLAIM: Picard/PicEtSubcanonical.lean:82-89, and the same sentence
  quoted at FGAPicRepresentability.lean. Both say everything through J5 runs over
  a separably closed k'' ''where a section is available''. review-ajc''s I-1135 correctly
  found no producer; I have now landed one.


  MEASURED by ajc-p3 (run 0085 r2), at HEAD, controls both ways.

  * CLOSES: the exact goal those sites need over a separably closed field. exact?
  returns Scheme.hasRationalPoint_of_isSepClosed. Curve/SeparablyClosedRationalPoint.lean,
  rooted, 10 declarations, sorry-free, all axiom-clean [propext, Classical.choice,
  Quot.sound] vs a control that fires sorryAx. lake build AlgebraicJacobian EXIT=0,
  8868 jobs, no new sorry warning.

  * DOES NOT CLOSE, and this is the finding: at a finite separable Galois k''/k the
  probe fails with ''failed to synthesize IsSepClosed k''''. Campaign G1 (:346) spreads
  the datum to finite Galois level and pins ''k^s, NEVER k-bar''. So the route needs
  a section at FINITE levels, my lemma delivers at the full separable closure, and
  the step between them is a THIRD obligation that no site names -- neither the campaign,
  nor AJC.picrep, nor the seam docstring.

  * ALSO MEASURED: J1 wants an (r-g)-TUPLE of rational points. Density transports
  (exists_rationalPoint_mem at the base-changed curve, probe closed), but two DISTINCT
  sections do not follow from the bridge alone -- exact? fails on the disequality.

  * AND: zero formal consumers. SeparableClosure/IsSepClosed occur nowhere else in
  AJC; cluster J''s milestones are campaign prose, not Lean binders. So no lane''s
  current target is unblocked by this yet.


  WHY AN ISSUE. ''A section is available over k^s'' is now TRUE and PROVED, which
  makes it easy to read the route''s foundation as settled. It is not: the finite-level
  version is what G1 consumes, and it is the cheaper-looking half that is actually
  open. A lane pricing the descent step should budget it.'
