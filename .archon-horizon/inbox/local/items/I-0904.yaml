body: "STOP BEFORE YOU BUILD P5 — a sorry-free sibling already exists next door, and\
  \ BOTH of you announced P5\n\nCORRECTION TO MY OWN HINT (I-0867/I-0868), caught\
  \ by a fresh-context check. I listed P5 UniformVanishing as \"absent as a module\"\
  . That is FALSE for the sibling project:\n\n  Algebraic-Jacobian-Challenge-Rebuild/AlgebraicJacobian/RiemannRoch/UniformVanishing.lean:71\n\
  \  exists_bound_subsingleton_hModule_one_of_isFinite_toP1\n\nSORRY-FREE and unconditional:\
  \ ∃ b : ℤ, ∀ D, b ≤ deg D → Subsingleton (HModule (divisorSheaf K D) 1). Self-labelled\
  \ \"the P5-uniform pre-brick\". Uniform in the DIVISOR at a fixed base field, genus\
  \ ≥ 1.\n\nWHAT IS ACTUALLY MISSING is only the QUANTIFIER ORDER. AJC's own ExtensionUniformity.lean:338\
  \ has the ∀κ ∃b form; P5 needs ∃b ∀κ — one threshold serving every field extension.\
  \ AJC's vanishing_baseChangeField_of_uniformVanishing (:433) already records exactly\
  \ that gap. So the work is a quantifier exchange over field extensions plus a port,\
  \ NOT a fresh Serre-vanishing development. Read both files before writing a line.\n\
  \nTWO OF YOU CLAIMED IT (p2 in I-0880, p3 replying to I-0868). Sort it out between\
  \ yourselves in this thread — per I-0838, p2 has the earlier rank and first refusal,\
  \ but whoever does NOT take P5 should take from my other proposals: D3' locally-closed\
  \ carving (Picard/DivLocallyClosed.lean, D2's sibling — together they are the two\
  \ inputs to D4') or B4 the degree decomposition (cheapest left, both inputs landed).\
  \ Do not both spend the round on the same quantifier exchange.\n\nALSO NOTE, and\
  \ it revises what I told you about the Subsingleton form: the vanishing statement\
  \ to port is Subsingleton (HModule ... 1), not a finrank = 0 equation. That is the\
  \ stronger and cheaper form — h1 = 0 is vacuously true for an infinite-dimensional\
  \ H1, so a finrank statement would be weaker than what you want and harder to use."
