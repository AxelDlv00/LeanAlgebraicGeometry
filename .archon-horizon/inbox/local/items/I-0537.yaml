body: '[persistent] SHARED .lake AND ONE CLI LOCK: a missing .olean, a CLI timeout,
  or a 35-minute blocked build is usually a sibling run, not a failure — and a lane
  CAN be starved out of its root build


  Re-filed by the janitor hygiene pass of run 0074 to make this content **reachable
  from `horizon inbox list`**. The original, `I-0408`, is open in the store but invisible
  to the CLI (it carries `scope.projects: [Algebraic-Jacobian-Challenge]` with `audience:
  horizon`, the combination reported in `I-0481`/`I-0505`), so a lane on any other
  project cannot read it. `I-0520` was archived into it in the same pass, which would
  have buried both. This item supersedes `I-0408` and `I-0520` as the readable version;
  neither is retracted.


  ## Symptom 1 — a green file suddenly fails


  `lake env lean` failed with `object file ''.../Adelic/SectionBounds.olean'' ...
  does not exist` on a file green minutes earlier whose content had not changed: a
  sibling team was rebuilding that module, so its `.olean` was transiently absent
  from the shared `.lake/build` tree. Rebuild, then re-run. **Do not** conclude a
  proof or probe is broken on a missing-`.olean` error while other runs are live.


  ## Symptom 2 — an 8-second check takes many minutes, or never acquires at all


  - `lake` serialises on a shared lock. With 25-30 queued build processes it is **waiting,
  not hung**: check `ps aux | grep "[l]ake build" | wc -l` for queue depth before
  drawing conclusions, and launch build-then-check as one backgrounded sequence you
  wait on rather than two foreground commands that each risk a timeout.

  - **Starvation is real.** Measured 2026-07-28, 13:05-13:41 (run 0072): `/tmp/claude-1001/ajcr-locks/lake.lock`
  was held essentially continuously for ~35 minutes, and *two* attempts at a final
  `lake build AlgebraicJacobian` exited on the lane''s own guard (15 min, then 9 min)
  without ever acquiring.

  - **Two holder shapes, neither reapable.** (a) *No pidfile while a live build runs*:
  the `kill -0` branch needs a pid and the "no live build AND >15 min" branch is false
  because a build **is** live — do not reap, you cannot prove death. (b) *Pidfile
  present, holder alive*: a legitimate long build. Waiting is correct in both. Budget
  for it.

  - **The fallback, and its exact limit:** `lake env lean AlgebraicJacobian/Picard/<File>.lean`
  needs no lock, writes no shared state, and is a faithful **kernel** check for that
  file (LSP diagnostics are not a substitute). It does **not** give the cross-module/root-closure
  check a full `lake build` gives. Report per-file checks *as* per-file.

  - Repair clue: the no-pidfile window lasted 25+ minutes, so at least one acquirer
  takes the lock **without** the documented recipe (`mkdir` then write `$$`). Look
  for `mkdir`-without-pidfile call sites. Human-facing report: `I-0502`.


  ## Symptom 3 — horizon CLI writes time out or apply PARTIALLY


  The CLI serialises on `.archon-horizon/locks/workspace-commit.lock`, whose contents
  are the holder pid — probe it, because a **live** pid means contention, not a stale
  lock. Under contention `roadmap set`, `inbox comment` and `inbox add` can time out
  mid-write. So (a) verify whether a write landed by **reading the YAML on disk**,
  not by assuming a timeout meant failure; and (b) expect partial application — one
  `roadmap set --summary --owner --pin-commit` landed the summary and silently dropped
  the other two, twice. **Set one field per call and verify on disk.**


  ## The reporting rule that follows


  Never carry a green result forward from an earlier run of the same file once the
  environment has been rebuilt underneath it. Re-run it, or say plainly in the report
  which run the result came from and that the environment has changed since. Related:
  `I-0362` (an unrooted module looks green because nothing builds it).'
