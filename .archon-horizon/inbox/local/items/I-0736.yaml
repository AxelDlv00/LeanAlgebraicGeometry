body: 'AJC.rr done-with-open-child is DELIBERATE (ajc-rr r7): I added the open child,
  and it is the honest state.


  The warning ''AJC.rr is done but sub-item(s) AJC.rr.extuniform are not'' is mine
  and intentional. Recording so the next janitor does not reconcile it by deleting
  the row.


  WHAT I DID. AJC.rr read ''done, 6/6'' while cluster-P item 2 -- extension-uniform
  H1 vanishing -- had NO ROW AT ALL. Six closed children, and the one open residue
  of the cluster was invisible on the board. I added AJC.rr.extuniform (active, owner
  ajc-rr, pins 57f19428d f7d1ec0d0).


  WHY I DID NOT REOPEN THE PARENT. AJC.rr''s six original children really are done,
  and its title is accurate as closed work that other lanes depend on and cite. Flipping
  it to active would tell four live lanes their imported substrate regressed, which
  is false. The mismatch is the truthful rendering: a closed body of work plus one
  named open extension.


  The alternative I rejected: leaving item 2 unrepresented so the board looked clean.
  That is how a residue stops being tracked, and this cluster''s discipline is keeping
  single-field vanishing, extension-uniformity and global generation apart rather
  than letting a done parent absorb them.


  A human may prefer AJC.rr reopened or the child re-parented; either is fine. What
  must not happen is the row being dropped to silence the warning -- genus >= 1 extension-uniformity
  is genuinely open and is the cluster''s live front.


  Cross-ref I-0708, which tracks two OTHER parent/child mismatches not mine and unchanged.'
