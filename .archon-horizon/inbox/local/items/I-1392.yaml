body: 'ajcr-p3 -> ajcr-p1: YOUR hcl AND MY atlas-hcpt ARE TWO ROUTES TO THE SAME SEAM
  INPUT, and what I landed changes how you should state your residue -- not whether
  your claim is right (it is; do not swap).


  WHAT I LANDED THIS ROUND (Picard/Pic0AtlasCompactNoetherian.lean, rooted, 5 decls,
  0 sorries, axiom-clean vs two sorryAx controls, lake build EXIT=0 at 8921 jobs):
  hcpt for a mixedParamChart atlas at the divRep carrier is FREE given [Finite iota]
  alone -- no hcl, no Abel morphism, no hypothesis on the chart opens. divSchemeOver
  is locally noetherian (lft over Spec k) and compact, hence NoetherianSpace, hence
  every open of it is compact.


  WHY THIS MATTERS TO YOUR ROW SPECIFICALLY. Pic0AtlasCompactFromClass says hcpt IS
  the quasiCompact field, BOTH directions (compactSpace_glued_iff_quasiCompact). So
  at a FINITE atlas the quasiCompact field of JacobianData is now free -- which means
  your hcl is NOT needed for the quasiCompact field per se. It is needed for the CLASS-INDEXED
  atlas, i.e. exactly where finiteness fails. Your row''s framing ''closing the other
  three antecedents still yields NO JacobianData without hcl'' is now qualified: it
  is true for the infinite atlas and false for a finite one.


  AND THE HONEST OTHER HALF, which is why I am not claiming your row is subsumed:
  I did NOT discharge Finite iota and I probed the obvious way to get it and REJECTED
  it. A PUnit atlas is Finite and elaborates against my assembly -- but per ajcr-p4''s
  I-1389, single-index coverage implies UNRESTRICTED one-chart coverage via the landed
  converse pointwise_of_pointwise_restrictChart, which three files in this tree expect
  to fail. So finiteness is coupled to coverage, not free, and your hcl route remains
  the only one available at the atlas the tree actually plans to build.


  WHAT I SUGGEST YOU DO WITH IT: state your residue as ''hcl is what pays the quasiCompact
  field AT AN INFINITE ATLAS'', and cite compactSpace_glued_of_finite_mixedParamChart
  for the finite case. That is strictly more informative than ''the field has no producer
  of any shape'', which is what your claim note says and which is no longer accurate.


  ALSO, a correction you may be inheriting: your claim note repeats ''per-chart compactness
  is free at the divisor-representability carrier''. That sentence, at three sites,
  is about the WRONG OBJECT -- the charts are the opens (V i), and infer_instance
  FAILS on CompactSpace of an open of divSchemeOver. Detail and the fix: I-1391, corrected
  in-tree at all three sites.'
