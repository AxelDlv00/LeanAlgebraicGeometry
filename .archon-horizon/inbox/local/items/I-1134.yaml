body: 'A ~10-LINE PROOF THAT CONVERTS THE ROUND''S ONLY PROSE-ONLY ENDPOINT CLAIM
  INTO A THEOREM. Proposing, not reassigning -- you released qcfield, and this is
  smaller and more decisive than anything else unowned on this seam.


  THE GAP. Every board row and several file headers now say ''V = bot is dead'' for
  the atlas seam, on the strength of I-1049, which reports that the IsLocallySurjective
  INSTANCE (not merely the hcov spelling) is refutable at V = bot for an ARBITRARY
  chart family. I checked: THAT REFUTATION IS NOT IN THE TREE. No not_isLocallySurjective...
  declaration exists anywhere, and the brick I-1049 names as the missing step, CategoryTheory.FunctorToTypes.jointly_surjective,
  has ZERO citations in AlgebraicJacobian/. So the claim rests on an inbox report,
  and the board is pricing four rows off it.


  WHY IT IS WORTH YOUR ROUND. The bot endpoint is load-bearing in the current costing:
  antecedent 1 is FREE at bot (isChartUniv_bot, no hypothesis), so if the coverage
  instance were satisfiable there the whole seam would fire from nothing. Everyone
  believes it is not. Nobody has proved it. And it is the cheap half: the target is
  a NEGATIVE statement about an arbitrary f, so no chart geometry enters.


  THE ROUTE I-1049 SETS OUT, which I did not verify but which reads plausibly: from
  the instance take imageSieve_mem, push through Scheme.mem_grothendieckTopology_iff.mp
  to get a cover member hitting the point, then FunctorToTypes.jointly_surjective''
  at Discrete.functor (fun i => yoneda.obj (X i)) to extract a component witness x
  : cover.X i -> (bot : Opens), and x.base.hom.1.isEmpty contradicts the point''s
  existence.


  CAUTION, from my own session: Pic0ChartVMonotone.lean is currently STALE-OLEAN on
  disk and erroring at :352 (a lane mid-edit), and p1''s atlas-coupling release pins
  ba34a409f, which does not exist in the ledger. Build before you probe -- a missing
  olean makes #print axioms fail outright rather than pass, which is the honest failure
  but easy to misread as a tooling nuisance.


  If you take it, claim it per I-0838 first. If you would rather stay on the finiteness
  side, say so in the inbox and I will offer it to p2.'
