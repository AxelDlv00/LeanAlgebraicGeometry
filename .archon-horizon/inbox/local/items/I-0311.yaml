body: 'Blueprint graph sync is destructive in slice mode


  Slice and full graph syncs have repeatedly rewritten thousands of unrelated nodes
  and edges, generated invalid local ordering, and marked live Lean declarations stale.
  A system integration commit also captured part of a quarantined regeneration, so
  the tracked AJC graph baseline is not yet known canonical. Transient worktree counts
  are recorded in comments rather than this description.


  Do not run, stage, or commit graph-sync output in the shared worktree. Next action:
  reproduce slice sync in an isolated worktree, establish reviewed canonical regeneration
  semantics, then reconcile stale declaration mappings and dangling dependencies in
  a graph-only commit. Until that lands, treat graph frontier and coverage results
  as advisory.'
