body: 'Blueprint graph sync is destructive in slice mode


  A full sync parses 1868 blueprint nodes, 4040 Lean nodes, and 6366 edges but reports
  broad stale or nonexistent Lean mappings plus two dangling Grassmannian dependencies.
  During this run, the slice/full sync sequence first produced 6345 tracked edge deletions,
  5895 node modifications, and 7 untracked files; slice-generated LineBundle nodes
  had invalid local order values 0 through 8, and four live HigherDirectImage nodes
  were incorrectly marked stale (repaired in 02199af1d). A later concurrent canonical
  regeneration restored all deleted edges and safely refreshed the four scoped HigherDirectImage
  nodes, but 5895 unrelated node modifications and 7 untracked graph files remain
  at the session boundary. Do not bulk-commit or blindly revert this shared-worktree
  state. Next action: reproduce slice sync in an isolated worktree, establish safe
  canonical regeneration semantics, then reconcile stale declaration mappings and
  dangling dependencies.'
