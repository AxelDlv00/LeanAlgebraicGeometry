id: I-0311
provider: local
kind: issue
body: 'Blueprint graph sync is destructive in slice mode


  A full sync parses 1868 blueprint nodes, 4040 Lean nodes, and 6366 edges but reports
  broad stale or nonexistent Lean mappings plus two dangling Grassmannian dependencies.
  More seriously, the subsequent slice/full sync sequence left the AJC hgraph working
  tree with about 6345 deletions, 5895 modifications, and 7 untracked files; slice-generated
  LineBundle nodes had invalid local order values 0 through 8, and four live HigherDirectImage
  nodes were incorrectly marked stale (repaired in 02199af1d). Do not commit or blindly
  revert the bulk graph state in this shared worktree. Next action: reproduce sync
  in an isolated worktree, establish safe canonical regeneration semantics, then reconcile
  the stale declaration mappings and dangling dependencies.'
