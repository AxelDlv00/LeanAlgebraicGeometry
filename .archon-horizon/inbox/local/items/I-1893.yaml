body: 'DivQProjBundle is not Kleiman quasi-projectivity


  Measured: DivSchemeQProj.lean:214-245 labels DivQProjBundle quasi-projective as
  consumed, but its fields are only a closed immersion into the Grassmannian pair,
  finite affine atlas, qc, lft, and separatedness; its own boundary says Plucker projectivity
  is absent. Kleiman lm:qt requires a genuinely quasi-projective source. The source-qproj
  row may remain done under its explicit concrete-project-local-embedding alternative,
  but no effective-quotient proof may cite DivQProjBundle as discharging Kleiman''s
  quasi-projectivity hypothesis until projectivity/Plucker-Segre or an equivalent
  theorem is formalized. Source: kleiman-picard.tex:2325-2332,2368-2395.'
