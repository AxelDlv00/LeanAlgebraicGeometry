body: 'A 17k-LINE SORRY-FREE PORT LANDS ON A CARRIER WITH NO SHEAF-SIDE FACE -- front
  (a) of AJC.pic0av


  Measured 2026-07-29, lane ajc-pic0av run 0067 r6, after three sessions (r3/r4/r5
  roadmap rows) had

  named AJCR''s two-chart Cech machinery as the live route for clause (iii) of the
  tangent comparison.


  THE DECISIVE FACT, and it is one grep. AJCR''s Scheme.CechPic is a SELF-CONTAINED
  definitional

  Picard group (Quotient of unitsH1 over PointedCover, Picard/Pic.lean:60). Its ONLY
  bridge to

  invertible SHEAVES is Scheme.cechPicEquivPic (Picard/CechPicSurjective.lean:283),
  and that carries

  [IsAffine X] irremovably -- the proof needs a trivializing basic open per point
  plus

  Module.Invertible.span_tensor_free_eq_top over Gamma(X,top). There is NO non-affine
  comparison in

  either tree, nor in mathlib (which has no Picard group of a SCHEME at all; CommRing.Pic
  is

  ring-level). The other consumers use it at affine schemes only.


  WHY FATAL. Clause (iii) compares AJC''s dual-number kernel of PicSharp.relPresheaf
  -- a setoid

  quotient of LineBundle.OnProduct, honest invertible sheaves -- with a two-chart
  Cech H1 on

  C x_k Spec k[eps]. That is a PROPER CURVE, not affine, and not affine precisely
  because the

  interesting H1 is nonzero. The one hypothesis the dictionary needs is what the problem
  structurally

  denies.


  PORT COST, both ways (rule I-0678; here BOTH are large, which is itself the signal):
  import closure

  of the three TwoChart* endpoints = 57 modules, 46 absent, 13,691 lines. Closure
  of the 10-file

  genuine core (UnitsPresheaf, UnitsCocycle, CechH1, Pic, PicAffineCover, RefinementInjectivity,

  TwoChart{CechPic,Selector,Normalize,Representable}) = 76 modules, 60 absent, 17,031
  lines. All

  sorry-free. The SIZE is not why it fails -- that is a plausible multi-session port.
  It fails because

  at the end you hold a class in X.CechPic and no theorem connecting it to LineBundle.OnProduct
  at a

  non-affine X.


  SO THE RESIDUE OF FRONT (a) IS NOT ANY OF THE FOUR AJCR THEOREMS. It is: Cech H1
  of units on a

  NON-AFFINE scheme = isomorphism classes of invertible sheaves. Absent from both
  projects and from

  mathlib. Genuinely new mathematics for this workspace, not a port.


  RULE: when a port is priced, ask what CARRIER you are left holding and whether it
  has the FACE your

  consumer needs. "Sorry-free and portable" says nothing about whether the destination
  type connects

  to yours. I-0684''s shape at subsystem scale; the test is one grep for the comparison
  theorem and a

  read of its binders.'
