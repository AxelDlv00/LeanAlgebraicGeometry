body: "hspan + hfield BUILD — REDUCED both XL fibre facts to their honest carve/BPF\
  \ cores; shared base-change setup + both reductions LANDED green.\n\nNew file Picard/DivSchemeUnivFibreKerSpan.lean\
  \ (220 L, ≤500). Single-module lake build green (8670 jobs, LEAN_NUM_THREADS=1);\
  \ all keystones axiom-clean [propext, Classical.choice, Quot.sound]; zero sorries/warnings.\
  \ Root-wired HEAD-blob + own line only (sibling PicEtCrossBaseGraph line NOT swept).\n\
  \n=== COMMITS (this lane) ===\n- 6cd460657  shared piece-colength base-change setup\
  \ (4 lemmas, +134 L + root line)\n- fbb922f23  hfield reduced to per-generator fibre\
  \ divisibility (+39 L)\n- e998c350   hspan reduced to induced-map fibre injectivity\
  \ (+47 L)\n\n=== KEYSTONES (VERBATIM, all in namespace AlgebraicGeometry.ThetaGeneratorSeed,\
  \ generic over any D : ThetaGeneratorSeed C R π a K; section vars {k C R} (R') {π\
  \ a K}) ===\n\n(1) shared base-change setup (the \"factor ONCE\" piece; both hspan+hfield\
  \ route through it):\n- pinnedPieceSectionsMap (b : Bool) (h : Γ(relCurve C R, relPinnedChart\
  \ C R π b)) : Γ(relCurve C R, (relCurve C R).basicOpen h) →+* Γ(relCurve C R', (relCurve\
  \ C R').basicOpen (relPinnedSectionsMap C R R' π b h))   — side-uniform piece comparison,\
  \ cased to pieceSectionsMap at fiberChart₀/₁.\n- pinnedPieceQuotBaseChangeAlg (b)\
  \ (h) (E : Set Γ(relCurve C R, (relCurve C R).basicOpen h)) : R' ⊗[R] (Γ(D(h)) ⧸\
  \ Ideal.span E) ≃ₐ[R'] Γ(D(relPinnedSectionsMap b h)) ⧸ Ideal.span (pinnedPieceSectionsMap\
  \ R' b h '' E)   — κ(p)⊗colength = fibre colength.\n- pinnedPieceQuotBaseChangeAlg_one_tmul_mk\
  \ : sends (1 ⊗ [s]) ↦ [pinnedPieceSectionsMap s].\n- mk_tmul_one_eq_zero_iff_pinnedPieceSectionsMap_mem\
  \ (b)(h)(E)(s) : (Ideal.Quotient.mk (Ideal.span E) s ⊗ₜ[R] (1:R')) = 0  ↔  pinnedPieceSectionsMap\
  \ R' b h s ∈ Ideal.span (pinnedPieceSectionsMap R' b h '' E).\n\n(2) hfield reduction\
  \ (feeds the hfield arg of isGenerator_of_fibrewise_ker_span_of_field_vanishing):\n\
  - hfield_of_forall_pinnedPieceSectionsMap_mem (D)\n    (hdiv : ∀ (z : relCurve C\
  \ R)(p : PrimeSpectrum R) ⦃ψ⦄, ψ ∈ K → pinnedPieceSectionsMap p.asIdeal.ResidueField\
  \ (D.side z) (D.h z) (relThetaResSide a (D.side z) (D.piece_le z) ψ) ∈ Ideal.span\
  \ {pinnedPieceSectionsMap p.asIdeal.ResidueField (D.side z) (D.h z) (D.eqn z)})\n\
  \    : ∀ (z)(y)(hy : y ∈ D.piece z)(x : ↥(D.sideColengthSubmodule z)), ((x : Γ(…,D.piece\
  \ z) ⧸ Ideal.span {D.eqn z}) ⊗ₜ[R] (1 : (basePrime ((relCurve C R).presheaf.germ\
  \ (D.piece z) y hy).hom).asIdeal.ResidueField)) = 0\n  — EXACTLY the hfield hypothesis\
  \ shape (DivSchemeSeedUnivClose.lean:99 / DivSchemeSeedDvd.lean:194).\n\n(3) hspan\
  \ reduction (feeds the hspan arg; SOUND replacement of the false FibreInjective):\n\
  - hspan_of_forall_liftQ_rTensor_injective (D)\n    (hinj : ∀ (z)(p : PrimeSpectrum\
  \ R), Function.Injective (((LinearMap.ker ((D.kColengthMap z).comp K.subtype)).liftQ\
  \ ((D.kColengthMap z).comp K.subtype) le_rfl).rTensor p.asIdeal.ResidueField))\n\
  \    : ∀ (z)(p), LinearMap.ker (((D.kColengthMap z).comp K.subtype).rTensor p.asIdeal.ResidueField)\
  \ ≤ LinearMap.range ((LinearMap.ker ((D.kColengthMap z).comp K.subtype)).subtype.rTensor\
  \ p.asIdeal.ResidueField)\n  — EXACTLY the hspan hypothesis shape (DivSchemeSeedUnivClose.lean:94\
  \ / DivSchemeSeedDvd.lean:189). Proof: ≥ inclusion is free (rTensor_exact on ker\
  \ f_z ↪ K ↠ K/ker f_z); ≤ = hinj. hinj is the INDUCED map K/ker f_z → colength fibre-injective\
  \ — TRUE (unlike FibreInjective which killed all of K via the seed section).\n\n\
  === HOW THE ASSEMBLY LANE USES THESE at seedUniv ===\nD := seedUniv C hπ g r₁ r₂\
  \ b₁ b₂ i j hO hχ (R = R_Z, K = divUniversalSeedK, [Module.Finite R_Z ↥K] = finite_divUniversalSeedK).\
  \ Then:\n  hfield := seedUniv.hfield_of_forall_pinnedPieceSectionsMap_mem hdiv_seedUniv\n\
  \  hspan  := seedUniv.hspan_of_forall_liftQ_rTensor_injective hinj_seedUniv\nfeed\
  \ both (with hreg/hcolFin/hcolFlat/hfib from the sibling lane) to ThetaGeneratorSeed.isGenerator_of_fibrewise_ker_span_of_field_vanishing.\n\
  \n=== RESIDUAL (the honest carve/BPF cores — genuinely XL, NOT plumbing) ===\nTwo\
  \ obligations remain, each isolated to pure fibre geometry at seedUniv:\n1. hdiv_seedUniv\
  \ (hfield core): ψ ∈ divUniversalSeedK ⟹ the fibre side component pinnedPieceSectionsMap\
  \ κ(p) (side z)(h z)(relThetaResSide (side z) ψ) is divisible by the fibre equation\
  \ pinnedPieceSectionsMap κ(p)(side z)(h z)(eqn z), at every prime p of R_Z. This\
  \ is the BPF/Nakayama neighbourhood: the fibre K-side components (∈ H⁰(windowN −\
  \ d_p) via divUniversalFibreKM = divisorSections(windowN − d_p), divUniversalSeedFibreDivisor_spec\
  \ Fields:146) are locally generated by the seed section's side component (eqn z)\
  \ on D(h z). Ingredients: divUniversalFibreKM_eq_span (Res:376), divFamPhi_windowCompare_mem_divUniversalFibreKM\
  \ (Res:423), relPinnedSectionsMap_relThetaResSide_windowEquiv (Read:203), the d_p\
  \ achiever exists_coeffAt_eq_baseDivisorAt (BaseDivisor:143).\n2. hinj_seedUniv\
  \ (hspan core): the induced map (divUniversalSeedK ⧸ ker f_z) → colength is fibre-injective\
  \ at every p. This is the genuine carve rank-g content: divUniversal_carve_residueField\
  \ (FamilyUniv:135) + the window/colength fibre identification (pieceQuotBaseChangeAlg\
  \ + divUniversalFibreKM identification). ker f_z should be the second window divUniversalSeedK'-image;\
  \ the carve pair arrow = 0 gives the injectivity.\n\nBoth residuals need the fibre\
  \ window↔colength side-component identification (relThetaResSide fibre ↔ divUniversalFibreKM\
  \ through pinnedPieceSectionsMap), which is the next brick to build. No FibreInjective\
  \ (I-0279 dead). No sorries introduced; full-root stays green."
