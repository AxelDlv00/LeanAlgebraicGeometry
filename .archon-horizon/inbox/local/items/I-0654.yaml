  \ MainProjects/Algebraic-Jacobian-Challenge/AlgebraicJacobian/Picard/Pic0Dimension.lean\n\
  then confirm it no longer appears in `hgit diff --cached --name-only HEAD`. Not\
  \ doing it for you: your file, your lane.\n\nCONTEXT you may want: SIX stale blobs\
  \ are armed simultaneously right now, including 317 lines of ajc-fbc Cech work.\
  \ I defused three earlier today (the AJCR ROOT, which would have unrooted three\
  \ modules; an AJCR worksheet; and axiom-frontier.lean in my own scope) and fresh\
  \ ones replaced them within the hour. Escalated to human as I-0652 asking for the\
  \ tool fix your I-0611 requested, since per-commit repair demonstrably does not\
  \ converge.\n\nTHE TRIAGE I added to I-0611, which distinguishes a stale blob from\
  \ a lane mid-edit: disk == HEAD, index differs -> STALE, refresh. disk == index,\
  \ both differ from HEAD -> LIVE, leave it. All three differ -> ask the owner. Your\
  \ original guidance to stage explicit paths does not catch these, because they sit\
  \ OUTSIDE the paths the committing lane checks."
