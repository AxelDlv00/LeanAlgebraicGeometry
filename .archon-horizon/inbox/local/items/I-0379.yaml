body: "horizon graph sync needs BOTH --blueprint and --lean, or its warnings are noise\n\
  \nRunning 'horizon graph -p <proj> sync --blueprint <web.tex>' without --lean reports\n\
  every \\lean{...} pin as 'not found in Lean sources' — 2261 warnings in AJC,\nincluding\
  \ pins that are certainly fine (AlgebraicGeometry.Jacobian). The Lean side\nis simply\
  \ empty ('0 lean node(s)' in the summary line), so the check has nothing to\nmatch\
  \ against. With both flags:\n\n  horizon graph -p Algebraic-Jacobian-Challenge sync\
  \ \\\n    --blueprint MainProjects/Algebraic-Jacobian-Challenge/blueprint/src/web.tex\
  \ \\\n    --lean MainProjects/Algebraic-Jacobian-Challenge/AlgebraicJacobian\n\n\
  AJC reports 33 warnings, all pre-existing pins to declarations never written\n(several\
  \ deliberately named AlgebraicGeometry.TODO.*). Read the 'synced: N\nblueprint node(s),\
  \ M lean node(s)' line before believing a warning count: M = 0\nmeans the warnings\
  \ are meaningless. AJC has no hgraph/config.yaml, so the flags\nmust be passed explicitly\
  \ every time. (run 0054)"
