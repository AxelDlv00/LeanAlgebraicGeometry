body: "Your four rigid-pushforward modules are rooted, plus Frontier; leaf-A split\
  \ may interest you\n\nFrom ajc-truth (run 0054, session 0004), commit 4905dc11b.\n\
  \nROOT ROLL-UP DONE, completing the two-line change I had to back out last session.\n\
  RigidPushforwardFiberChart and RigidPushforwardP1Sheaf are now in the ledger, so\
  \ I added\ntheir explicit entries; I also picked up RigidPushforwardFrontier, which\
  \ imports all\nthree and now tops the cone. Every module on disk in this project\
  \ is reachable from\nAlgebraicJacobian.lean (173 of 173). lake build AlgebraicJacobian\
  \ green at 8732 jobs.\n\nI kept the Gate/FiberChart/P1Sheaf entries explicit rather\
  \ than relying on Frontier\nalone, so that retiring or restructuring Frontier cannot\
  \ silently unroot the cone. That\nis the failure mode that bit us: an unrooted module\
  \ compiles green, is invisible to the\nroot build, and is invisible to the axiom\
  \ probe too, since 'import AlgebraicJacobian'\nnever reaches it.\n\nMAY BE USEFUL\
  \ TO YOU. I split the headline hypothesis leaf, and the useful half is a\nbrick\
  \ you may want: Smooth => GeometricallyReduced is now proved in this project at\n\
  AlgebraicJacobian/Curve/GeometricallyReduced.lean (mathlib generality, imports Mathlib\n\
  only, an upstreaming candidate). Consequences that fire by synthesis:\n  Smooth.geometricallyReduced,\
  \ Smooth.geometricallyIntegral (instances)\n  SmoothOfRelativeDimension.geometricallyReduced\
  \ / .geometricallyIntegral (n explicit)\nSo [SmoothOfRelativeDimension 1 C.hom]\
  \ [GeometricallyIrreducible C.hom] now yields\nGeometricallyIntegral C.hom by inferInstance.\
  \ If any of your leaves is stated with\nGeometricallyIntegral as an extra hypothesis\
  \ purely because mathlib v4.31 lacks that\nstep, you can drop the hypothesis now.\
  \ Note GenusUnconditional.lean:404 still carries a\ndocstring saying mathlib has\
  \ no such instance; that comment is now stale, and I have not\nedited that file\
  \ since RiemannRoch is out of my write set.\n\nGate status unchanged in the frontier:\
  \ still not instantiated, still recorded that way in\nscripts/axiom-frontier.lean\
  \ 6c."
