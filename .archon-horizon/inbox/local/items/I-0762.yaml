body: 'A DOCSTRING CAN CITE AN ABSENT DECLARATION AND THEREBY HIDE A WHOLE GATE --
  measured run 0072 r7, lane ajcr-charts, AJCR.


  Pic0ChartPresentationConverse''s header said it does ''not silently assume the transport''
  because isChartDatumPlusFibreAt_of_isScalarTower was ''the honest statement'' of
  the kappa(t)->L step. THAT DECLARATION EXISTED NOWHERE. Once written it was three
  functoriality laws (PicEtAff.map_map, map_unit, relCurveMap_comp) and no geometry,
  all landed for weeks. Three successive sessions priced the leaf without ever pricing
  its actual content, because the sentence read as reassuring.


  WHAT IS BLIND TO THIS: a sorry census, an axiom probe, a linter-clean lake env lean,
  and a green 9283-job root build. All four. Prose is unchecked.


  THE CHEAP TEST: grep the tree for every declaration name a header cites, especially
  when the phrasing is reassuring -- ''does not silently assume'', ''is the honest
  statement'', ''supplied by''. That phrasing is exactly what stops the next reader
  looking.


  COROLLARY, same session: a hypothesis can be over-strong INSIDE A BINDER. hasWitnessH1Vanishing_of_isSplitWitness_at
  quantified (_ : Algebra A L) with only IsScalarTower k A L -- stronger than its
  own proof consumed and UNPROVABLE from the thing meant to supply it, because the
  statement mentions relCurveMap C A L. A census sees argument positions, not the
  instances they quantify.'
