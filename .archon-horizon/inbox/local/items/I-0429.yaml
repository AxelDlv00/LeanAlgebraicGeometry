id: I-0429
provider: local
kind: issue
body: 'B3 is now closed, but NO object in the tree satisfies the three AJC curve binders
  — the headlines apply to nothing concrete yet


  `Adelic.instHasRigidPushforwardOfCurve` (`Picard/RigidPushforwardGammaBaseChange.lean:253`)
  needs `[SmoothOfRelativeDimension 1 C.hom] [IsProper C.hom] [GeometricallyIntegral
  C.hom]`. Measured with `lake env lean` (four `infer_instance` probes):


  - `p1Over k` — `IsProper` **synthesizes**; `SmoothOfRelativeDimension 1 (p1Over
  k).hom` and `GeometricallyIntegral (p1Over k).hom` **both fail**.

  - `𝔸(1; Spec k)` — `GeometricallyIntegral` synthesizes (mathlib); `SmoothOfRelativeDimension
  1` and `IsProper` fail (the latter correctly).

  - `Scheme.HasRigidPushforward (p1Over k)` therefore **fails to synthesize**.


  **This is not a defect of session 0006** and not a relocated gap: the three binders
  are the campaign''s standing premise, quantified over all such `C`, so B3 is correctly
  stated. The specific worry that `[HasFiniteMapToP1 C]` might be a silent producer-less
  gate is **refuted** — it is derived from the three via `existsNonconstantMapToProjInt_of_ajc`
  (`RiemannRoch/Adelic/NonconstantToP1.lean:1067`), and `rigidPushforwardGammaBaseChange_proved`
  carries only the three binders and is axiom-clean.


  **What it does mean:** no theorem in this tree can yet be applied to a named curve,
  so per `I-0416` the word "unconditional" in the new docstrings should stay scoped
  to "no gate beyond the AJC hypotheses". The two concrete missing prerequisites,
  both already named in the source, are:


  - `GeometricallyIntegral (terminal.from (Proj ℤ[X₀,X₁]))` — `Picard/RigidPushforwardP1Constants.lean:207-210`
  calls it "a missing mathlib fact about `Proj`"; it would give `GeometricallyIntegral
  (p1Over k).hom` for every field at once.

  - smoothness of relative dimension 1 for `ℙ¹` — no producer anywhere; note `Curve/GeometricallyReduced.lean:172`
  derives `GeometricallyIntegral` from `SmoothOfRelativeDimension n` + `GeometricallyIrreducible`,
  so one smoothness instance would halve the gap.


  **Next action:** decide explicitly whether exhibiting one witness curve is in campaign
  scope, and record the decision; do not let "unconditional" drift into "instantiated".'
