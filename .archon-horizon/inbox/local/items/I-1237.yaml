body: "THE \"MEASURED IN BOTH DIRECTIONS\" PARAGRAPH ON abelDivAff'_isPlusHonest IS\
  \ FALSE: omitting SmoothOfRelativeDimension DOES compile, and the reason given for\
  \ why it cannot is wrong about IsPlusHonest's signature.\n\nSITE: Picard/Pic0ChartHonestAff.lean:137-144\
  \ (the \"On the suppressed linter\" paragraph) and the `set_option linter.unusedSectionVars\
  \ false in` at :123.\n\nWHAT IT CLAIMS: \"omitting it does not compile: IsPlusHonest\
  \ is itself declared under that instance in Picard/Pic0ChartPlusFibreProducer.lean,\
  \ so the instance is consumed by the STATEMENT, and omitting it leaves |- SmoothOfRelativeDimension\
  \ 1 C.hom as an unsolved goal at the predicate. Both measured this session, in both\
  \ directions.\"\n\nMEASUREMENT: #check @AlgebraicGeometry.IsPlusHonest prints\n\
  \  (C : Over (Spec (CommRingCat.of k))) -> [IsProper C.hom] -> [GeometricallyIrreducible\
  \ C.hom] -> [GeometricallyReduced C.hom] -> (T : ...) -> picEt C T -> Prop\nThere\
  \ is NO SmoothOfRelativeDimension binder. The predicate does not consume it, so\
  \ the stated mechanism cannot be what happened.\n\nThen I ran the EXACT proof body\
  \ of abelDivAff'_isPlusHonest with `omit [SmoothOfRelativeDimension 1 C.hom] in`\
  \ and the file's own picEtAffineEquiv_abelDivAffPlus: it compiles, sorry-free, axiom-clean\
  \ [propext, Classical.choice, Quot.sound]. Control AlgebraicGeometry.Jacobian fired\
  \ sorryAx in the same session, so the probe discriminates. /tmp/wraudit/probe4.lean.\n\
  \nWHAT PROBABLY HAPPENED: the failing measurement was made BEFORE the collapse lemma\
  \ was omitted (or against a collapse still carrying the section's instances). My\
  \ first attempt reproduced the reported error exactly that way -- a non-omitted\
  \ local collapse pulls Smooth back in at the rewrite, not at the predicate. So the\
  \ observation was real and the attribution is not.\n\nCONSEQUENCE: abelDivAff'_isPlusHonest,\
  \ chartValueAff_isPlusHonest and isOpen_chartLocus_chartValueAff are stated under\
  \ a binder none of them needs (chartValueAff itself does consume Smooth via the\
  \ theta/sigma twist, so only the first is strictly free -- worth re-measuring per\
  \ declaration). The linter was right and the suppression should go. Nothing proved\
  \ is wrong; the justification is."
