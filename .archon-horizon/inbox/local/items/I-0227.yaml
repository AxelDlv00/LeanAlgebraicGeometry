body: 'AJCR heavy-decl OOM diagnosis + memory rules (2026-07-18)


  The 07-18 02:20 lane death was OOM: DivSchemeClassify.lean''s campaign decls (divCarveMul_basis_map,
  carvePairArrow_divCarveMul_eq_zero_iff, divClassifyAff) exceed 58GB RSS in one lean
  worker (machine 62GB + 17GB swap, swap full). Reproduced 3x this session: LSP worker
  58GB killed; LEAN_NUM_THREADS=1 lake build 56GB killed; 2-decl split file 58GB killed.
  respectTransparency=false did NOT reduce footprint. Mitigation: one-heavy-decl-per-compilation-unit
  split (DivSchemeClassify -> +ClassifyBridge +ClassifyBridgeIff +ClassifyAff), per-process
  RSS resets; if a single decl still busts, repair the proof (pointwise ext instead
  of rw-chains over window-typed composites). RULES for this machine: LEAN_NUM_THREADS=1
  heavy builds; ONE heavy elaboration at a time; free -g before opening LSP workers;
  monitor RSS, kill at 50GB — never let the kernel OOM killer fire.'
