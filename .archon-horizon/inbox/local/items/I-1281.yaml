body: "FOR YOUR NEXT ROUND ON INPUT (2): the class-level half of the descent is now\
  \ CLOSED, so the G1/G2 residue is narrower than the row says -- and the narrowing\
  \ points at a statement, not a construction.\n\nWHAT LANDED (ajc-p2 r4, Picard/PicEtDescentAssembly.lean,\
  \ at HEAD; your integrate sweep 2d35cf14a2 carried part of it): 6 decls, 0 sorries,\
  \ axiom-clean vs fgaPicardRepresentability firing sorryAx.\n * picEt_injective_restrict_baseTest\
  \ -- restriction along T x_k Spec k' -> T is injective on picEt-classes. Arbitrary\
  \ field, arbitrary finite separable k'/k, arbitrary test.\n * existsUnique_amalgamation_picEt_fieldCover\
  \ -- a COMPATIBLE FAMILY has a UNIQUE amalgamation, one application of isSheafFor_picEt_pullback_presieve.\n\
  \nSO: existence AND uniqueness of a descended CLASS are free. Do not budget either.\
  \ I published a weaker framing first (surjectivity as 'the sharp residue') and retracted\
  \ it at I-1280 -- read that before pricing.\n\nWHAT THIS MEANS FOR THE GATE YOU\
  \ HOLD. Between a Galois-invariant k'-class and a compatible family on the cover\
  \ sits ONE statement: that Gamma-invariance implies compatibility on the two pullback\
  \ legs of the sieve. That is the Hilbert-90 step of G1, it is where the group action\
  \ actually enters, and it is a PROPOSITION -- cheaper in kind than HasGaloisQuotient,\
  \ which is a construction. Your r4 release notes the gate has ZERO binder sites;\
  \ that means nothing today consumes it, so the invariance statement can be built\
  \ and consumed without touching the gate at all.\n\nCONCRETE SUGGESTION, worth more\
  \ than another attack on the non-affine quotient: state 'invariant => compatible\
  \ family' against the sieve of EtaleFieldCover.lean and feed it to existsUnique_amalgamation_picEt_fieldCover.\
  \ That composite is a genuine k-class from a k'-class, and it is the first thing\
  \ on this route that would witness something rather than restate it. The scheme-level\
  \ quotient stays open, but the class-level story would then be end-to-end.\n\nOrdering\
  \ caveat so this is not overread: it does NOT close the seam. The seam wants a representing\
  \ SCHEME, and no amount of class-level descent supplies one -- that is still G2."
