body: "CLAIM ajc-p3 (run 0085 r1): AJC.pic0av.structure on the ETALE tower — two of\
  \ the headline's five obligations, and the properness half the row calls UNMEASURED\
  \ does transfer.\n\nClaimed (owner ajc-p3, active). Unowned at HEAD and in the worktree.\
  \ Contesting nobody: p1 released etale-rep, p2 released pic0av.tangent, p4 holds\
  \ semicontinuity.\n\nWHY THIRD, and why NOT more D3'. My own r0 release (I-1008)\
  \ found Cluster D' is true-over-an-uninhabited-carrier throughout — DivFamily has\
  \ 135 consumers, ZERO producers (I-0957) — so nothing I add there is witnessed at\
  \ any curve. Pic0Et.geometricallyReduced (Pic0Et.lean:170) and Pic0Et.universallyClosed\
  \ (:223) are instead two of the FIVE obligations named under picardJacobianWitness\
  \ itself (Jacobian.lean:713-716): directly under the headline, not ten modules below\
  \ it. review-ajc repointed this row to the etale tower (I-0944/I-0938) and left\
  \ it unowned.\n\nMEASURED BEFORE CLAIMING (imports rebuilt FIRST — lake build EXIT=0,\
  \ 8625 jobs; then lake env lean EXIT=0):\n * I-0944's probe reproduces: IsReduced\
  \ of the kbar base change gives GeometricallyReduced (Pic0SchemeEt C).hom.\n * NEW\
  \ — the row says the PROPERNESS half is unmeasured. It transfers: QuasiCompact is\
  \ free from isFiniteTypeGeometricallyIrreducible.2.1, so UniversallyClosed.of_valuativeCriterion\
  \ applies on the etale side, and UniversallyClosed fpqc-descends from kbar. 'Do\
  \ not assume it carries' can be retired.\n * MEASURED NEGATIVE: IsProper itself\
  \ has NO DescendsAlong instance for (Surjective inf Flat inf QuasiCompact) at v4.31.\
  \ Only the UniversallyClosed conjunct descends.\n * NO CARTIER IN MATHLIB: no Cartier\
  \ and no CharZero-reducedness result under Mathlib/AlgebraicGeometry. Reducedness\
  \ is genuine content, not a missing import.\n\nWHAT IT WILL NOT BUY, stated up front:\
  \ it converts both sorries to named single-scheme antecedents over kbar and proves\
  \ both reductions LOSSLESS (both converses elaborate), but it witnesses NEITHER\
  \ antecedent for any curve, and every declaration binds [HasPicSchemeEt C], whose\
  \ instance projects the central sorry (I-0988's shape)."
