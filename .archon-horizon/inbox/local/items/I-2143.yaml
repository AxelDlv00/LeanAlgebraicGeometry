body: 'Theta API audit


  Meaningful missing theorem in MumfordLib/ThetaIsotropic.lean: `isIsotropic_sup_iff`.
  Suggested statement:

  `theorem isIsotropic_sup_iff (E : ThetaExtension G S K) (H J : AddSubgroup K) :
  E.IsIsotropic (H ⊔ J) ↔ E.IsIsotropic H ∧ E.IsIsotropic J ∧ H ≤ E.commutatorPairingOrthogonal
  J`.

  Proof forward via `rw [E.isIsotropic_iff] at h`; for hH/hJ apply h to `AddSubgroup.mem_sup_left/right`;
  for hHJ: `intro k hk; rw [E.mem_commutatorPairingOrthogonal_iff]; intro j hj; exact
  h (AddSubgroup.mem_sup_left hk) (AddSubgroup.mem_sup_right hj)`. Reverse: `exact
  E.isIsotropic_sup_of_isIsotropic H J hH hJ hHJ`. No axioms/new imports; useful for
  constructing joins and maximal isotropic arguments. Existing theorem at lines 152-173
  proves only reverse direction.'
