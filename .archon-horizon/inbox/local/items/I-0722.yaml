body: 'THREE PHANTOM DECLARATION NAMES IN THE TWO NEW FILES -- the same error this
  lane committed twice before, plus one dead set_option in each file.


  Work-reviewer on ajc-rr r6. Every other cited name and file resolves; these three
  do not.


  PHANTOMS (grep -E for a declaration line returns nothing; each is a docstring pointing
  a reader at a name that does not exist):

  1. Ledger/SectionsFieldBaseChange.lean:57 -- "sectionsBaseChangeFieldl_res". The
  real name is sectionsBaseChangeField_res (:308). No l subscript.

  2. Ledger/SectionsFieldBaseChange.lean:58 -- "sectionDiff_baseChangeField". The
  real name is sectionDiffl_baseChangeField (GenusFieldInvariance.lean:173). Missing
  the l subscript.

  3. Ledger/GenusFieldInvariance.lean:33 -- "h1_unit_baseChangeField_eq". The real
  name is h1_unit_baseChangeField_eq_h1_unit (:291). Truncated. Note h1_unit_baseChangeField_eq_genus
  DOES exist (CohomologyKit.lean:582) and is a DIFFERENT theorem, so this phantom
  reads like a real name and misdirects.


  Not phantoms, verified present: Adelic.LaurentChartData.pullbackSquare (Adelic/FinitenessP1.lean:439),
  CohomologyKit.h1_unit_baseChangeField_eq_genus (:582), h1_unit_eq_genus (CohomologyKit.lean:481),
  AJCR Cohomology/H1BaseFieldInvariance.lean, AJCR RiemannRoch/WindowLedger.lean,
  AJCR WindowFieldTransport.lean, AJCR LinearMap.quotRangeBaseChangeEquiv (Cohomology/RelativeH1BaseChange.lean:82).
  AffineTwoCover genuinely absent from AJC as a declaration.


  SEPARATE, MINOR: both set_option backward.isDefEq.respectTransparency false in are
  DEAD. Removed each and re-ran lake env lean on a scratch copy: both files elaborate
  clean with no errors. Methodology validated by mutating congrArg2 (. - .) to (.
  + .), which does produce the expected type mismatch, so the harness is not silently
  passing. GenusFieldInvariance.lean:166 and SectionsFieldBaseChange.lean:301 can
  both be deleted; the comment at GenusFieldInvariance.lean:221-223 explaining why
  the escape is needed is then also stale.


  NEXT ACTION: fix the three names, delete the two dead set_options and the stale
  comment. Verify absence claims with grep -E "^(noncomputable )?(def|theorem|lemma|abbrev|structure)
  <name>" rather than a bare string count, per your own I-0717.'
