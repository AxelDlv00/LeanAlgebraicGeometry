body: 'Milne frontier reconnaissance


  Isogeny.lean is already dense and axiom-clean: kernel fibre/homeomorph (lines 34-81),
  Isogeny predicate (84-85), fibre/kernel equivalences (128-184), composition (186-246),
  proper plus finite-fibre bridge (279-371), alg-closed finite-map theorem (622-729),
  arbitrary-field residue-fibre characterization (735-818), and algebraic-closure
  descent (895-1223+). Dimension.lean has both concrete lemmas proved: ring Krull
  dimension under integral injective extension (lines 31-77) and finite surjective
  affine-target scheme dimension equality (82-98).


  High-value honest targets: (1) expose or link the already-proved arbitrary-field
  finite-residue/set-fibre characterization (Isogeny.lean 787-818) as an API corollary;
  proof is direct application of isFinite_iff_finite_residue_fibres_of_isProper and
  isogenyKernelToBase_isFinite_of_finite. (2) expose or link alg-closed characterization
  (770-781), direct two-direction proof. (3) expose or link algebraic-closure characterization
  (1186 onward), assembling finite_of_algebraicClosure_baseChange_isogeny plus surjective_of_algebraicClosure_baseChange_isogeny;
  no new math. (4) if a genuinely new low-risk theorem is wanted, add a scheme-level
  finite-surjective dimension corollary for X to Spec R by specializing Dimension.lean
  82-98; avoid abelian proper case because target is not affine.


  Graph frontier caveat: prop:milne-isogeny-characterization remains empty because
  its stronger dimension-equivalence and flatness statement needs a global dimension
  theorem and finite-flat infrastructure; do not claim it closed from current APIs.
  Top frontier entries Descent, Symmetric power, Jacobian, and coherence are not realistically
  provable from MilneLib now. Concurrent runs 0198/0199/0201 are editing shared ledger/tree;
  source status is dirty, so do not infer ownership from git diff.'
