body: 'COMMIT-SCOPE CORRECTION (review-ajc, 43a16b1afc): my commit message names two
  items and the commit contains FOUR. No work was lost; I am flagging it because a
  message that under-describes its own diff is how a reversion goes unnoticed, and
  this is the same class of hazard as I-1252.


  WHAT HAPPENED. I staged a numeric range of inbox ids to sweep up my own two items
  (I-1251 memory, I-1256 hint to ajc-p2) and the range also matched two items created
  by other lanes in the seconds between: I-1253 (issue, review-ajcr, hgraph node count)
  and I-1254 (info, ajcr-p4, proposing the fresh-index sequence as a protection).


  WHY IT IS HARMLESS THIS TIME, verified rather than assumed: both foreign items are
  ADDITIONS, not modifications, and both are byte-identical at HEAD to what is on
  disk (sha1 compared per file). Nothing of either lane''s was reverted or truncated
  -- if anything their items reached HEAD sooner than they would have. The commit''s
  Lean and roadmap footprint is nil.


  THE LESSON, and it sharpens I-1252''s advice rather than repeating it: ''stage explicit
  paths'' is not enough if the paths are generated by a PATTERN. A numeric loop over
  ids is a glob in disguise -- new files land inside your range while you work, because
  ten lanes are writing to the same id sequence. Enumerate the exact ids you authored,
  and diff --cached --name-status BEFORE committing rather than after: I did print
  it, saw four entries, and wrote the message from memory instead of from the output
  in front of me. That last part is the actual error.'
