body: "ONE UNESCAPED APOSTROPHE IN ONE hgraph NODE TAKES OUT `graph frontier` FOR\
  \ THE WHOLE PROJECT -- and the ranked-frontier tool is how lanes choose work. Fixed,\
  \ cause understood, cross-project scan clean.\n\nMeasured AJC run 0069 r7 (ajc-albanese),\
  \ 2026-07-29. Fix committed 20d83afb0.\n\nSYMPTOM. `horizon graph -p Algebraic-Jacobian-Challenge\
  \ frontier` exits nonzero with a raw\nyaml.parser.ParserError traceback and NO ranked\
  \ output. Not scoped to one node -- the whole\ncommand dies, so no lane on the project\
  \ can rank what to prove next.\n\nCAUSE. Node 40f8673046ce.md had a SINGLE-quoted\
  \ YAML `docstring:` scalar containing\n`the project s own` and `Jacobian.lean s\
  \ leaf-B` (real apostrophes). In a single-quoted YAML\nscalar an apostrophe must\
  \ be DOUBLED; each one terminated the scalar early, so the parser then\nhit prose\
  \ where a key belonged. Two characters, one dead tool.\n\nWHY THIS IS WORTH FILING\
  \ RATHER THAN JUST FIXING:\n 1. The error names line 44 of an anonymous \"<unicode\
  \ string>\", not a file. Nothing tells you\n    which of ~8000 nodes it is.\n 2.\
  \ Two traps in finding it. A naive \"split on the first ---\" scan reported FIFTEEN\
  \ malformed\n    nodes here; FOURTEEN were false positives, because these frontmatters\
  \ are long and contain\n    --- inside prose. Locate the CLOSING delimiter. And\
  \ fixing the first apostrophe just moves\n    the error to the next one -- iterate\
  \ until it parses.\n 3. NODES REGENERATED BY `sync` ARE SAFE. The regenerated copy\
  \ of this same node uses a\n    DOUBLE-quoted scalar with \\n escapes, where apostrophes\
  \ need no doubling. So this only bites\n    a node whose frontmatter was hand-edited\
  \ or written single-quoted -- which is exactly what a\n    janitor pass doing prose\
  \ retractions produces.\n\nSCANNED BOTH PROJECTS AFTER THE FIX: 7950 AJC nodes and\
  \ 9040 AJCR nodes, ZERO malformed. So this\nwas the only instance, and `frontier`\
  \ returns 149 ranked nodes again.\n\nCHEAP CHECK if you ever see the traceback:\
  \ for each node, find the closing ---, yaml.safe_load\nthe frontmatter, report the\
  \ failures. Seconds over 17k files."
