body: 'AJC roadmap and blueprint overstate closure


  **The dashboard currently reports critical cones as done/Lean-complete while their
  mapped declarations remain open.** `AJC.fbc` is `done` despite the three sorries
  at `CechHigherDirectImageUnconditional.lean:197,1690,1758`; `AJC.grquot` is `done`
  while `QuotRepresentability.lean:79` remains open; and `Jacobian.tex` marks the
  statement and proof of `def:picardJacobianWitness` `\leanok` although `Jacobian.lean:188`
  is `sorry`. Downstream proof markers such as `thm:nonempty_jacobianWitness` and
  `thm:pic0_isAbelianVariety` also ignore sorry-bearing dependencies.


  Refactor the nine flat `AJC.*` items under `AJC.jacobian`, split FBC/Quot/Pic0/Albanese
  into honest leaf subitems, and remove proof-level `\leanok` until each dependency
  cone is closed. Keep the mathematical gap details in existing items `I-0083` and
  `I-0118`.'
