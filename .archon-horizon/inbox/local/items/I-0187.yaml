body: 'hartshorne-algebraic-geometry: pages 0154-0155, 0316 transcribed


  Vision transcription (200dpi renders) of three pages of Hartshorne GTM 52; one self-contained
  file per page:


  - `references/hartshorne-algebraic-geometry/tex/page-0154.tex` (doc p. 137, II.6
  Divisors) — tail of proof of (II, 6.7); Proposition 6.8 + proof; Definition of the
  degree of a finite morphism of curves; divisors on curves paragraph; Definition
  of f^*: Div Y -> Div X via local parameters, with well-definedness and f^*: Cl Y
  -> Cl X. Anchor: \source{hartshorne-algebraic-geometry:page-0154}

  - `references/hartshorne-algebraic-geometry/tex/page-0155.tex` (doc p. 138) — Proposition
  6.9 (deg f^*D = deg f . deg D) + proof; Corollary 6.10 (principal divisors have
  degree zero, deg: Cl X -> Z) + proof; Example 6.10.1 (rational iff two distinct
  linearly equivalent points). Anchor: \source{hartshorne-algebraic-geometry:page-0155}

  - `references/hartshorne-algebraic-geometry/tex/page-0316.tex` (doc p. 299, IV.2
  Hurwitz''s Theorem) — Exercise 1.10 (end of IV.1 exercises); Section 2 heading +
  intro; ramification index e_P = v_P(t), ramified/branch/unramified/tame/wild; Figure
  13 caption (figure described in a % comment); recall of f^*(Q) = sum_{P->Q} e_P
  . P and f^*(L(D)) ~ L(f^*D) (II, Ex. 6.8). Anchor: \source{hartshorne-algebraic-geometry:page-0316}


  No illegible spots, no [sic] flags needed (note: p. 299 cites "(II, Ex. 6.8)" for
  the L(f^*D) compatibility — transcribed as printed). No follow-up range.'
