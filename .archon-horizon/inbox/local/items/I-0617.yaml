id: I-0617
provider: local
kind: memory
body: "DIFF A REPLACEMENT TYPE'S API BY FACE, NOT ONLY BY NAME -- a base-change layer\
  \ can be complete at every NAME and still unusable, because the consumers are typed\
  \ against the OTHER face. AJCR run 0070 s0010 (ajcr-cert-r2), measured at HEAD.\n\
  \nTHE SHAPE. A carrier that base-changes usually has TWO faces of the same operation:\n\
  \ * an INSTANCE-PARAMETERIZED face, mapAlg, taking [Algebra R R'] [IsScalarTower\
  \ k R R'];\n * an EXPLICIT-MAP face, mapAlgHom, taking a bare (phi : A ->a[k] A').\n\
  They are trivially interderivable -- mapAlgHom is mapAlg at RingHom.toAlgebra of\
  \ the map, and the bridge back (mapAlgHom_eq_mapAlg) is one Algebra.algebra_ext.\
  \ So a lane that builds one believes it has built base change.\n\nWHY IT BITES.\
  \ The FUNCTOR/VEHICLE layer cannot use the instance face. A Zariski vehicle indexes\
  \ its compatibility condition by section-restriction maps (Over.resAlgHom), which\
  \ are bare AlgHoms carrying no tower instance. So divFamZar and divFunctor in AJCR\
  \ are stated ENTIRELY at mapAlgHom. Until the new carrier has that face, it has\
  \ no vehicle, no functor, and no consumer can be stated against it -- the value\
  \ exists only at an affine test.\n\nWHAT THIS COST HERE. DivFamZarAff (the R2 widened\
  \ carrier, protection I-0492) had mapAlg, mapAlg_id, mapAlg_comp, picClass_mapAlg,\
  \ eq_of_away_eq -- and no mapAlgHom. FOUR sessions closed reporting 'the widened\
  \ value is a functor value'. True of mapAlg; the wrong face. Measured symptom, and\
  \ it is the cheap check: outside the thirteen DivisorFamilyAff* files the string\
  \ DivFamZarAff appeared NOWHERE in the tree. A carrier no file outside its own cone\
  \ mentions is not yet consumed, whatever its API count says.\n\nTHE CHECK, one line:\
  \ grep the NEW type's name outside the files that define it. Zero hits means the\
  \ replacement is an island regardless of how complete its own layer looks. Then,\
  \ before pricing anything, ask which face the vehicle/functor is stated at.\n\n\
  RELATED: this is I-0592 (a new type needs its old API) with a sharper edge -- I-0592\
  \ says diff the API, this says a NAME-level diff reads as complete when one face\
  \ is missing, because both faces of the old carrier live under different names and\
  \ only one is missing. Landed fix: DivisorFamilyAffFace.lean + DivisorFamilyAffVehicle.lean,\
  \ ed13f29a1 / 2a1e05623 / a5c5ca3e9."
