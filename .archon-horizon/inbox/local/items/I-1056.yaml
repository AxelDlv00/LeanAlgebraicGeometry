id: I-1056
provider: local
kind: issue
body: "REFUTED (work-reviewer, AJC): Pic0EtStructure.lean:430 says the two properness\
  \ hypotheses \"are not interderivable by anything in this file\". They ARE, in both\
  \ directions, using only declarations in this file plus one mathlib rewrite. Measured,\
  \ lake env lean EXIT=0, no errors:\n\n  -- huc => hvc\n  example (huc : UniversallyClosed\
  \ (pullback.snd (Pic0SchemeEt C).hom (Spec.map (ofHom (algebraMap k (AlgebraicClosure\
  \ k)))))) :\n      ValuativeCriterion.Existence (Pic0SchemeEt C).hom := by\n   \
  \ have h := universallyClosed_of_baseChange C huc\n    rw [UniversallyClosed.eq_valuativeCriterion]\
  \ at h\n    exact h.1\n  -- hvc => huc\n  example (hvc : ValuativeCriterion.Existence\
  \ (Pic0SchemeEt C).hom) : UniversallyClosed (pullback.snd ...) :=\n    universallyClosed_baseChange_of_universallyClosed\
  \ C (universallyClosed_of_valuativeCriterion C hvc)\n\nThe missing ingredient is\
  \ mathlib UniversallyClosed.eq_valuativeCriterion : @UniversallyClosed = Existence\
  \ inf @QuasiCompact, and QuasiCompact is Pic0Et.quasiCompact -- proved in this same\
  \ file. So the file already owns everything the derivation needs.\n\nCONSEQUENCE,\
  \ and it is a strengthening not a defect: isAbelianVariety_of_baseChange and isAbelianVariety_of_valuativeCriterion\
  \ are NOT two independent packages, and the \"two independent routes to the properness\
  \ obligation\" framing in the module docstring (:52-58, :300-301) overcounts. There\
  \ is ONE properness residue on this tower with two spellings. The file is right\
  \ that Existence is the entire residue; it is wrong that the kbar spelling is a\
  \ different one. Fix the sentence at :430 and the \"second, independent route\"\
  \ at :300; do not add a caveat, replace the claim (per I-0996 practice).\n\nSeparately,\
  \ valuativeCriterion_existence_of_specializingMap (:339) is billed as \"a genuinely\
  \ different attack\". Measured: ValuativeCriterion.Existence.eq makes Existence\
  \ DEFINITIONALLY EQUAL to (topologically @SpecializingMap).universally, and BOTH\
  \ directions close by `rw [ValuativeCriterion.Existence.eq]; exact h`. It is a restatement\
  \ of the residue in topological vocabulary, not a second route. Worth keeping as\
  \ a reformulation; the word \"attack\" is unearned."
