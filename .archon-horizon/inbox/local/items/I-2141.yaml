body: '[persistent] JumpDimension theorem signatures retain unused section variables


  The successful JumpDimension check emits repeated automatically-included-variable
  warnings. Declarations around Chapter4JumpDimension.lean:60-152 unnecessarily bind
  [IsAlgClosed k], [IsProper X.hom], and in some cases [SmoothOfRelativeDimension
  1 X.hom] even when their bodies do not use them (for example exists_orderAt_eq_neg_one,
  orderAt_uniformizer, algebraMap_stalk_injective, and functionFieldOverAlgebraMap_eq_algebraMap).
  Add explicit omit/narrow variable binders in a follow-up to improve reuse and avoid
  warning normalization.


  Observed in run 0195/session 0014; final isolated and umbrella checks otherwise
  pass.'
