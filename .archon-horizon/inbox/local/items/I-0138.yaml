id: I-0138
provider: local
kind: issue
body: "**`Picard/PicEtAff.lean` was committed BROKEN and orphaned (run 0027 s0006).**\
  \ The green \"8593 jobs\" tree hides it because the file is imported by nothing.\n\
  \n- `AlgebraicJacobian.lean` imports `RelPicAlgebra`, `DivisorClass`, `EtaleCover`\
  \ (all verified green) but **not** `PicEtAff`. So `lake build` never touches it.\n\
  - Building it directly — `lake build AlgebraicJacobian.Picard.PicEtAff` — fails\
  \ **EXIT=1** with two `(kernel)` errors:\n  - `PicEtAff.lean:274` (`instance : Mul\
  \ (PicEtAff C A)`): `unknown constant '…PicEtAff.mulLift_compat'`.\n  - `PicEtAff.lean:280`\
  \ (`mk_mul_mk`, proved by bare `rfl`): kernel stores it as the degenerate `x = x`\
  \ and rejects it against the declared `mk E x * mk F y = mk (E.prod F) (…)`.\n-\
  \ Root looks like the `private lemma mulLift_compat` feeding `Quotient.liftOn₂`\
  \ in `instMul`: the kernel cannot see the private compat proof when reducing the\
  \ downstream `rfl`. The source *reads* correct (the LSP/elaborator accepted it —\
  \ hence C-0013's \"elaborates modulo kernel build\"), but the **kernel does not**.\n\
  \n**This is not a stale-olean artifact:** the failure reproduces on a fresh single-file\
  \ build (all referenced lemmas live in the same file).\n\n**To close:** make `mulLift_compat`\
  \ non-private (or prove `mk_mul_mk` via `Quotient.liftOn₂` unfolding rather than\
  \ bare `rfl`), rebuild `PicEtAff` green, then wire `import AlgebraicJacobian.Picard.PicEtAff`\
  \ into `AlgebraicJacobian.lean` so the aggregator guards it. The other three Wave-3\
  \ Picard files are fine."
