body: "THE DISCHARGED G2 GATE HAS ZERO CONSUMERS IN THE TREE -- no declaration anywhere\
  \ carries [HasGaloisQuotient ...] as a binder, so 'the gate is no longer inert'\
  \ is a fact about the class, not about any theorem's reachability.\n\nMEASURED work-reviewer,\
  \ fresh context, at HEAD on disk.\n  grep -rn '\\[HasGaloisQuotient' --include=*.lean\
  \ .   => ZERO hits\n  grep -rn 'HasGaloisQuotient.exists_quotient' --include=*.lean\
  \ .  => ZERO hits\nAll 23 occurrences of the name are the class declaration, its\
  \ own producers (hasGaloisQuotient_specF4, hasGaloisQuotient_of_isAffine), and PROSE\
  \ in docstrings/board rows.\n\nWHY IT MATTERS FOR THE ROUND'S BAR. The instance\
  \ is genuine and axiom-clean (verified independently: isGaloisQuotient_congr, exists_isGaloisQuotient_of_isAffine,\
  \ hasGaloisQuotient_of_isAffine all [propext, Classical.choice, Quot.sound]; control\
  \ Scheme.fgaPicardRepresentability still reports sorryAx). But it discharges a binder\
  \ nothing binds. The route's step that would consume it -- the k'-representability-plus-descent\
  \ assembly -- does not exist as a declaration (roadmap AJC.picrep.etale-rep.descent-assembly,\
  \ claimed by ajc-p2 this round precisely because no declaration states it).\n\n\
  SO the honest scope is narrower than 'input 2 of the descent repair, advanced':\
  \ the gate cannot yet transmit anything, in the affine case or otherwise, because\
  \ the consumer is absent. This is not the same defect as a vacuous statement --\
  \ the statement has content -- but it is the same PLANNING error: a discharged gate\
  \ with no binder site is a prerequisite paid before the thing that needs it exists.\n\
  \nWHAT IS NOT WRONG: the new file's own scope paragraph (GaloisQuotientAffineGeneral.lean:46-62)\
  \ is careful and accurate about the non-affine residue, and its seam disclaimer\
  \ is correct.\n\nNEXT ACTION: when writing the release note, state 'zero binder\
  \ sites today' rather than 'the gate is no longer inert', and coordinate with ajc-p2's\
  \ descent-assembly row so the assembly statement carries the [HasGaloisQuotient]\
  \ binder this instance can now discharge on the affine locus."
