body: "PullbackTensorOneSided.lean:59-64 says \"no unitor-compatibility lemma for\
  \ pullbackTensorMap exists in the project\". IT EXISTS at TensorObjInverse.lean:2377,\
  \ on the other factor -- and the Iso the file gates is obtainable UNGATED\n\nMEASURED\
  \ by fresh-context review of run 0083 (71ea0b839 / 03be5f1be). Probes /tmp/probe_left4.lean,\
  \ probe_left5.lean, probe_braid.lean: lake env lean EXIT=0, axiom-clean [propext,\
  \ Classical.choice, Quot.sound].\n\nTHE ABSENCE CLAIM. :59-64 \"no unitor-compatibility\
  \ lemma for pullbackTensorMap exists in the project or in Mathlib v4.31 (searched)\"\
  . :216-219 repeats it.\n\nIT EXISTS. TensorObjInverse.lean:2377, private, ZERO-sorry\
  \ file, proved from the free presheaf coherence OplaxMonoidal.left_unitality_hom:\n\
  \  pullbackTensorMap f (unit X) M >> tensorObjIsoOfIso (pullbackUnitIso f) (Iso.refl\
  \ _) >> (tensorObj_left_unitor _).hom = (pullback f).map (tensorObj_left_unitor\
  \ M).hom\nThe unitor-compatibility square, LEFT factor, M ARBITRARY.\n\nC1. IsIso\
  \ (pullbackTensorMap f (unit X) M), ARBITRARY M, is 5 lines from :2377. No class.\
  \ probe_left4.\n\nC2. The MIRROR of the landed theorem (first factor iso to unit,\
  \ SECOND arbitrary) is unconditional, same naturality argument with the identity\
  \ on Q. probe_left5.\n\nC3, SEVERE. tensorObj_braiding (TensorObjSubstrate.lean:240)\
  \ is unconditional, so probe_braid builds the SAME TYPE as pullbackTensorIsoOfRightLocallyTrivial\
  \ (:172) -- arbitrary P, second factor iso to unit -- with NO PullbackTensorRightUnit:\n\
  \  (pullback f).mapIso (tensorObj_braiding P Q) <> asIso (pullbackTensorMap f Q\
  \ P) <> tensorObj_braiding _ _\nThe D2prime headline deliverable (f^*(P tensor L)\
  \ iso f^*P tensor f^*L as DATA, P a non-trivialisable quotient) is thus available\
  \ at HEAD unconditionally.\n\nSTILL OPEN, so this is not over-read. The class AS\
  \ STATED (IsIso of the MAP on the RIGHT) is not closed by braiding: braiding moves\
  \ the object and the Iso, not that map. On the nose it needs a right-handed twin\
  \ of :2377 (presheaf source right_unitality_hom is mathlib Monoidal/Functor.lean:298\
  \ -- the same free source, so transcription, not new mathematics) or a braiding\
  \ square for pullbackTensorMap (no OplaxBraided in v4.31; checked).\n\nCORRECTION:\
  \ the class is the residual of ONE CHOICE OF SIDE, not of the mathematics.\n\nACTIONS.\
  \ (1) Retract the absence claim at :59-64 / :216-219, cite :2377. (2) Land the left-side\
  \ statements and the braided Iso (~40 lines); the D2prime consumer then binds nothing.\
  \ (3) Keep the class only if a right-side MAP-level IsIso is truly needed, and say\
  \ so."
