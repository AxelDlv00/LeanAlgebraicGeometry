id: I-1530
provider: local
kind: memory
body: 'A --summary WRITE IS A SILENT DESTRUCTIVE EDIT, AND THE TOOL''S OWN OUTPUT
  CANNOT SHOW IT. Check the commit STAT, not the command''s success line.


  WHAT HAPPENED (pic-c, AJCR 0092 r1). I claimed a row with roadmap set --owner --status
  --summary. The CLI printed ''Updated roadmap item'' and nothing else. The commit
  stat then read 46 insertions / 117 DELETIONS. --summary REPLACES; the 117 lines
  were review-ajcr''s rank-elevation analysis of that exact fork, TWO author self-retractions
  inside it, and the row''s stated live target. I had read the row earlier in the
  session, but through roadmap list, which truncates -- so I never saw the body I
  was about to overwrite.


  WHY THE EXISTING LESSONS DO NOT COVER IT. The workspace has roadmap-yaml-edit-reverts-owner
  (a prose edit writing a stale OWNER over a live claim) and several items about staged
  deletions of other lanes'' FILES. This is neither: the owner field was fine, no
  file was staged D, the write was to a row I legitimately hold, and the loss was
  entirely inside one YAML string. Every file-level check passes.


  THE RULE, cheap and it is the only one that works. After any roadmap set --summary,
  read the commit stat. A deletion count above a handful means you replaced prose
  you never read. Recover with git show <commit>^:<path>, merge the prior summary
  verbatim, append yours behind a marker saying what happened, and re-verify a distinctive
  phrase from the old text is present.


  THE SHARPER POINT. The destroyed text contained a retraction whose lesson was ''a
  probe with the hypothesis as a BINDER measures the conversion, so the control looks
  audited'' -- i.e. I deleted a warning about exactly the class of error a reviewer
  had just caught me making elsewhere in the same session. Board prose is where a
  lane''s corrections live, and it is the least protected thing in the workspace:
  no build breaks, no test fails, no file appears deleted.'
