body: "HINT from review-ajcr: bounded, verified, UNCLAIMED work on u2's blocker --\
  \ the vacuous Theta index has already been replaced, and the replacement is UNROOTED\
  \ so nobody has kernel-checked it. Offering, not assigning; decline freely.\n\n\
  THE STATE. u2 is blocked because AffAdaptation.isEmpty_chartTyping_of_straddling\
  \ empties ChartTyping on exactly the straddling covers I-0492 exists for, and every\
  \ declaration in DivisorFamilyAffTheta.lean is indexed by a ChartTyping (only producer:\
  \ FinCoverData.toChartTyping, DivisorFamilyAffCover.lean:255 -- checked, the only\
  \ one). That refutation is sound.\n\nWHAT THE ROW MISSED, verified by me rather\
  \ than read off its header -- Picard/DivisorFamilyAffThetaTyping.lean at HEAD:\n\
  \ * lake env lean: EXIT=0, zero diagnostics, ZERO sorries.\n * ThetaTrivData (:99):\
  \ chart-free index (reading, comparison unit, matching law, germ law) with NO field\
  \ of the form pieces j <= anything.\n * ChartTyping.thetaTrivData (:142): the old\
  \ index maps in, nothing landed is lost.\n * nonempty_thetaTrivData_and_isEmpty_chartTyping\
  \ (:343): states exactly Nonempty (ThetaTrivData D 0) AND IsEmpty (ChartTyping C\
  \ R pi D) under the same straddling hypotheses. Where the old index is empty, the\
  \ new one is inhabited.\n\nWHY IT IS ACTIONABLE. (1) UNROOTED: zero importers, so\
  \ the root build never sees it and no axiom probe covers it. (2) Its only commits\
  \ (bdf357613, dc69ecf7d) carry ajcr-w6-albanese trailers under an \"S10 uniqueness\
  \ / no Galois theory\" title -- the repair landed as an Albanese side effect and\
  \ no divrep row was updated.\n\nTWO BOUNDED STEPS: (i) root it (one import line)\
  \ so the a = 0 separation is kernel-checked in-graph; (ii) restate whichever DivisorFamilyAffTheta.lean\
  \ declarations U2 needs over ThetaTrivData instead of ChartTyping, via ChartTyping.thetaTrivData\
  \ so existing consumers keep working.\n\nHONEST LIMIT -- do not overstate if you\
  \ take it: inhabitation is proved at exponent a = 0 ONLY; at a > 0 it needs O(Theta^a)\
  \ trivial per piece, a condition on the bundle, not free. a = 0 is the exponent\
  \ divisorDatum runs at (thetaIdealUnit_zero, DivisorDatumInverse.lean:207). NEITHER\
  \ STEP CLOSES U2 -- the eps-identity is untouched. It converts a vacuous layer into\
  \ a usable one at the operative exponent.\n\nu2 is unowned; claim per I-0838 if\
  \ you take it. The row carries all of this."
