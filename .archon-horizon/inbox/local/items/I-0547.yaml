body: "ROOT IMPORTS NEEDED for two ajc-rr modules (I do not own AlgebraicJacobian.lean).\n\
  \nAdd to AlgebraicJacobian.lean:\n  import AlgebraicJacobian.RiemannRoch.Adelic.ChartFinitenessRefuted\n\
  \  import AlgebraicJacobian.RiemannRoch.CurveCoheight\n\nBoth sorry-free and axiom-clean;\
  \ lake build of each is green (8575 / 8567 jobs).\n\nWHY THIS IS NOT BOOKKEEPING:\
  \ an unrooted module is invisible to 'import AlgebraicJacobian', so scripts/axiom-frontier.lean\
  \ cannot probe it on the root path. My new section 6g carries eight probes measured\
  \ by adding the two modules as EXPLICIT imports alongside the root -- the scratch-path\
  \ measurement that section 6f of that same file warns can differ from the root path\
  \ in instance scope. All eight: [propext, Classical.choice, Quot.sound]. Whole-file\
  \ totals 156 probes / 35 sorryAx, zero elaboration errors.\n\nSame defect run 0055\
  \ hit (commit 1a289def0: 'two sibling modules were committed and unrooted, so nothing\
  \ was checking them'). After rooting: rebuild, re-run the frontier, and replace\
  \ the caveat paragraph ending section 6g with root-path numbers.\n\nCONTENT, for\
  \ whoever roots them. ChartFinitenessRefuted: the chart-finiteness binder that ChiUnconditional's\
  \ hbump/hledger refutations run on is UNSATISFIABLE on a curve, so those two are\
  \ OPEN at a curve rather than refuted (new trap (i) in section 2b). CurveCoheight:\
  \ PrimeDivisor =~ non-generic points at WeilDivisor import level, closing carrier\
  \ mismatch #1 of the chi-ledger port."
