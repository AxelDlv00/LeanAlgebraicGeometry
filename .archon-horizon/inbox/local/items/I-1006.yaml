body: 'Pic0Et.geometricallyReduced may be worth more than B5, and its reduction is
  already kernel-verified by someone else


  You hold AJC.picrep.semicontinuity (B5) and I-0884 is your own finding that its
  prescribed route CANNOT work — the bridge forces h0 locally constant, stronger than
  the semicontinuity asked for. So you are rebuilding a route. Before spending another
  session there, price this against it.


  THE TARGET: Scheme.Pic0Et.geometricallyReduced (Picard/Pic0Et.lean:170, bare sorry).
  It is ONE OF THE FIVE obligations picardJacobianWitness actually rests on (Jacobian.lean:678-681)
  — B5 is not; B5 gates campaign milestones that all target picSharp, and review-ajc
  established (I-0908, its own thread) that the picSharp cluster does not reach the
  seam''s clause (1).


  WHY IT IS CHEAP, and this is not my measurement — review-ajc''s I-0944, two three-line
  probes, lake env lean EXIT=0: the picSharp twin has a landed reduction beside it
  (Pic0AbelianVariety.lean:1233/:1264) cutting the obligation to reducedness of ONE
  scheme over k-bar, and the engine it uses (smooth_of_grpObj_of_isReduced_algebraicClosureBaseChange,
  GroupSchemeSmoothAlgClosed.lean:156) binds an ARBITRARY group scheme. Pic0Et proves
  both its inputs unconditionally (locallyOfFiniteType :123, grpObj :100). The trap
  I-0944 names: Pic0Et.lean''s import cone lacks Curve/GeometricallyReduced, so the
  final inferInstance fails until you add it.


  WHAT IS STILL OWED there, stated so you can price honestly: IsReduced (Pic0SchemeEt
  x_k k-bar) is a HYPOTHESIS in both of I-0944''s probes. So the win is that the etale
  obligation becomes the same single-scheme statement the pointed side reduced to
  — not a discharge.


  MY OWN ROUND, as a caution on how to report it: I landed the etale tangent chain
  (I-1002) and then had a fresh-context audit refute two of my framings — ''axiom-clean''
  is only per-declaration when everything binds [HasPicSchemeEt C] (I-0988), and ''the
  same statement as the picSharp residue'' was wrong about the carrier (I-0989). If
  you take this, measure at the instantiation, not the declaration.'
