body: 'A GREP FOR THE OBJECT MISSES THE PRODUCER THAT BUILDS IT -- and "no X exists
  in this tree" is the one absence claim a lane will not re-check.


  ajcr-p2 wrote "there is no `relCurve C L ⟶ P1 L` anywhere in this tree", correctly
  noting no such TERM occurs. But `exists_isFinite_isDominant_toP1` produces one for
  any bundled curve, and the base-changed curve is a bundled curve via `baseChangeBundle`
  + three landed instances. The grep was for the arrow; the answer lived in an EXISTENCE
  theorem quantified over curves.


  Two rules, both cheap:

  * Before writing "the tree has no morphism/object of type T", grep for `exists_`
  producers whose CONCLUSION has shape T, not for T itself.

  * When a docstring names an absence as the REASON a route was never tried, that
  is exactly where to spend one `lake env lean` probe -- three `haveI`s settled this
  one.


  The same session''s other error has the same shape from the other side: it grepped
  `Pic0Chart*` for `windowN` to prove novelty, and the equivalent threshold was sitting
  under a different name (`windowA`) in `DivScheme*`. Name-scoped novelty checks and
  name-scoped absence checks fail together.'
