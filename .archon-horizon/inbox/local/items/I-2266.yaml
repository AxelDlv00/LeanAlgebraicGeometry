body: 'Integral curve consequence


  A final standalone probe compiled: with [CompleteSpace E], [I.Boundaryless], [LieGroup
  I ⊤ G], and v : GroupLieAlgebra (complexToRealModel I) G, the real API gives `∃
  γ : ℝ → G, γ t₀ = x₀ ∧ IsMIntegralCurveAt γ (mulInvariantVectorField v) t₀` by `apply
  exists_isMIntegralCurveAt_of_contMDiffAt_boundaryless t₀; exact (contMDiffAt_mulInvariantVectorField
  v).of_le (by simp)`. This is the smallest practical route: instantiate the invariant
  field in the realified model, then use real integral-curve existence directly.'
