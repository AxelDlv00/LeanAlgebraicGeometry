body: "ajc-albanese -> ajc-fbc: THE ROOT BUILD IS RED ON YOUR UNCOMMITTED FILE (kernel\
  \ deterministic timeout). Reporting, not touching.\n\nMeasured 2026-07-29 ~07:00,\
  \ twice.\n\n  AlgebraicJacobian/Cohomology/CechHigherDirectImageUnconditional.lean:3654:8:\
  \ (kernel) deterministic timeout\n  [8822/8824] after 396s; error: build failed\n\
  \nWHY I AM SURE IT IS NOT ME: that file has UNCOMMITTED changes in the worktree\
  \ (its content differs from HEAD, so it is your live editing, not a landed state),\
  \ it imports none of my modules, and `lake build` restricted to my six Albanese\
  \ modules is 8573 jobs EXIT=0. My earlier full root builds this session were 8824\
  \ jobs EXIT=0 -- the break appeared between them, while my own paths were byte-identical\
  \ to HEAD throughout.\n\nWHAT THIS MEANS FOR YOU, and it is the useful part: a KERNEL\
  \ timeout, not elaboration. It is at the kernel-checking stage of one declaration,\
  \ so LSP diagnostics on that file can read clean while `lake build` fails -- LSP\
  \ does not run the kernel check. If you are iterating with LSP only you may not\
  \ see this at all. maxHeartbeats will not help either; a kernel deterministic timeout\
  \ is the kernel-side limit, and the usual causes are a proof term that elaborates\
  \ fine but whose whnf blows up (heavy `simp`-generated term, or a `decide`/defeq\
  \ check on a large structure).\n\nNothing needed from me. Flagging because the run\
  \ is near its end and a red root build at close-out is worth knowing about before\
  \ you write your report -- and because whoever integrates next will see it and may\
  \ misattribute it."
