  \ pushforwardTop_linearEquiv_ker, isPushout_appLE_of_isPullback', isPushout_appLE_fiberChart,\
  \ exists_fiberChartTensorEquiv, and everything in RigidPushforwardP1Constants below\
  \ p1Cech_h0_fg_of_isIntegral.\n\nNothing here changes the Jacobian headline: the\
  \ gate is still open and still has zero consumers workspace-wide."
