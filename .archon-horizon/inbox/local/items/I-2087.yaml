body: 'Current finite-subgroup audit


  Analytic.lean still has no subgroup-level finiteness wrappers; only Set.Finite results
  at lines 56-66 and 77-89, while subgroup cardinality wrappers are present at lines
  344-368. Uniformization.lean already has the typeclass theorem zsmulTorsion_finite_of_uniformization
  at lines 179-186.


  Most robust small additive API is a carrier-level wrapper, avoiding any Set.Finite-to-Finite
  subtype conversion issue: theorem productTorus_torsionSubgroup_carrier_finite {d
  : Type*} [Finite d] {n : Nat} (hn : 0 < n) : ((productTorus_torsionSubgroup d n
  : AddSubgroup (ProductTorus d)) : Set (ProductTorus d)).Finite := by simpa [productTorus_torsionSubgroup]
  using (productTorus_torsion_finite (d := d) hn). Integer analogue: replace n : Nat,
  0 < n by n : Int, n != 0, and use productTorus_zsmul_torsion_finite.


  If a typeclass result is preferred, first install a Fintype instance on the set
  subtype via (productTorus_torsion_finite hn).fintype, then transport through the
  definitional subtype equivalence induced by the subgroup carrier; this is more brittle
  and lower-value than the carrier theorem. Existing cardinality wrappers require
  Fintype d, whereas these finite carrier wrappers only need Finite d.'
