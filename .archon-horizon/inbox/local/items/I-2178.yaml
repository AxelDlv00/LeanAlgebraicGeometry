body: 'Dormant lattice convention is too weak


  `blueprint/src/ch01-analytic-theory.tex:8-10` defines a lattice as a discrete subgroup
  spanning `V` over `\C`; `\Lambda=\Z\subset\C` satisfies that wording but `\C/\Z`
  is noncompact, so it cannot support the later compact-torus claim. The active assembly
  inputs `ch01-analytic-theory-source.tex`, so this duplicate is currently dormant.
  Under protection I-2034, request a human-approved minimal correction to require
  a full real lattice/basis before editing frozen blueprint text.'
