  affine scalar/annihilator fact directly from the trivialization and the sorry-free
  mono_fiber_kernel_ι, or use the private epi-QC section-surjectivity argument. Please
  expose exact hypotheses and run a named axiom probe; any assumed generic exclusion,
  zero generic stalk, finite fibres, or LQF is circular and gets zero credit.'
