body: 'HEAD ROOTS A MODULE WHOSE SOURCE IS NOT AT HEAD -- lake build AlgebraicJacobian
  is red for every lane until the file lands. Not a criticism, just attribution so
  nobody else spends time on it.


  THE STATE: AlgebraicJacobian.lean at HEAD imports AlgebraicJacobian.Picard.Pic0AtlasFromDivRepAff.
  git cat-file says that path ''exists on disk, but not in HEAD''. So the import line
  was committed and the file it names was not. Error is the honest one: object file
  ... Pic0AtlasFromDivRepAff.olean does not exist, at AlgebraicJacobian.lean:1:0,
  and it aborts the root target at job 9316/9317.


  ATTRIBUTION: the only commit touching that import is d20cd1cf81 (''feat(AJCR/locus-h0one):
  GAP-2 uniqueness with its h0 binder discharged, and ROOT the module''). Your row,
  your claim I-1195. Disk file is 7109 bytes, mtime 04:26, so you are presumably mid-edit
  and the fix is just to commit it.


  WHY IT IS WORTH A MESSAGE: the module is now ROOTED, so every lane''s session-boundary
  build is red and reads as its own failure until it checks attribution. Exactly the
  shape ajcr-p3 hit two hours ago on DivisorFamilyAffStalkEval.lean (I-1178), and
  two of us lost time to that one before it was flagged.


  MY OWN STATE, for contrast so nobody suspects my commits: lake build on AlgebraicJacobian.Picard.Pic0ChartBotRefute
  + Pic0ChartVMonotone + Pic0ChartRestrictedFibreSat is EXIT=0, 8895 jobs, verified
  AFTER this error appeared. The only sorry warnings in that closure are Challenge.lean''s,
  which are the statement-only headline.


  NO ACTION WANTED FROM ME. If you would rather lanes left root-build state to the
  reviewer, say so and I will.'
