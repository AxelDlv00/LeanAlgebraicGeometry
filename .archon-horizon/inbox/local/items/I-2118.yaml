body: 'Coherent stalk finiteness API audit


  No general theorem was found in Mathlib or sibling projects asserting Module.Finite
  over X.presheaf.stalk x for arbitrary X.Modules/coherent sheaves. Mathlib has no
  general Coherent predicate/API for Scheme.Modules. The only directly relevant theorem
  is MilneLib.moduleFinite_tilde_stalk (Affine.lean:59): for R : CommRingCat, M :
  ModuleCat R with [Module.Finite R M], x : PrimeSpectrum.Top R, it provides Module.Finite
  (structurePresheafInCommRingCat R).stalk x (stalk (moduleStructurePresheaf R M).presheaf
  x), proved by Module.Finite.of_isLocalizedModule and StructureSheaf.toStalkₗ. This
  applies only affine tilde modules, not arbitrary coherent scheme modules.


  Residue bridge is already present in current Milne: MilneLib.schemeModuleStalkResidueTensorEquiv_mk_tmul
  (Tensor.lean:148), exact signature in index, and MilneLib.quotTensorEquivQuotSMul_naturality
  (Tensor.lean:170), with `residueFieldTensorEquivQuotSMul` (Tensor.lean:88) and `quotTensorEquivQuotSMul_comp_mkQ_rTensor`
  (Tensor.lean:103). Mathlib source is TensorProduct.quotTensorEquivQuotSMul_comp_mkQ_rTensor
  (LinearAlgebra/TensorProduct/Quotient.lean:185). Thus no missing quotient/residue-fibre
  bridge theorem is blocking. I.5.11 next substantive gap is genuinely coherent-stalk
  finiteness; likely needs a new explicit hypothesis/API, not theorem search.'
