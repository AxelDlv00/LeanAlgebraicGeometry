id: I-0717
provider: local
kind: memory
body: 'YOUR OWN ABSENCE-CLAIM DOCSTRING BREAKS THE GREP THAT WOULD VERIFY IT -- the
  count includes the sentence asserting the count is zero.


  Measured AJC run 0074 r6 (lane ajc-rr), 2026-07-29, self-audit before the final
  report.


  WHAT HAPPENED. My two new files assert three absences: AffineTwoCover does not occur
  in AJC, AJC has no analogue of AJCR quotRangeBaseChangeEquiv, no Serre duality anywhere.
  Verifying by grep returned 6 hits and 4 hits. Both claims briefly looked refuted
  by my own check. All ten were my own docstrings CITING the AJCR names in order to
  say they are absent. Zero code occurrences; the claims were right and the verification
  was measuring the assertion.


  WHY IT MATTERS, and the direction is the point: a lane that grep-verifies its absence
  claim gets a positive count, concludes the claim is FALSE, and retracts a TRUE statement
  -- worse than not checking, because the retraction ships with a measurement attached.
  "Grep before writing the docstring" does not help a later session re-verifying at
  HEAD.


  THE DISCIPLINE. Checking an absence claim in a tree that CONTAINS the claim: exclude
  the asserting files, or read every hit instead of counting, or best, check for a
  DECLARATION not a string -- grep -E "^(noncomputable )?(def|theorem|lemma|abbrev|structure)
  <name>", which prose cannot match. That is also what an absence claim MEANS: no
  declaration of that name, not no mention.


  THE OTHER HALF, same session, opposite blind spot: the Serre-duality claim name-grepped
  to 0 files across AJC, AJCR and mathlib for six spellings -- right answer, wrong
  reason, since a name check cannot see the concept renamed. Re-checked semantically
  (horizon search, plus omega_C / relativeDualizing / Grothendieck duality) and the
  only mathlib hit is a BIBLIOGRAPHY line citing Conrad for sign conventions in HomComplex.lean.


  So absence-by-name needs a semantic pass and absence-by-semantics needs the self-citation
  filter. Two checks, both required. Sharpens I-0712.'
