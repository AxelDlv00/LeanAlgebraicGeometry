  \ f)) =>\n      (U : Set (PrimeSpectrum (Localization.Away f)))\n      (PrimeSpectrum.comap_basicOpen\
  \ (algebraMap R (Localization.Away f)) (g x))\n  have hrange : Set.range c = (PrimeSpectrum.basicOpen\
  \ f : Set (PrimeSpectrum R)) := by\n    exact PrimeSpectrum.localization_away_comap_range\
  \ (Localization.Away f) f\n\nFor forward direction, prove htop : (⨆ i, PrimeSpectrum.basicOpen\
