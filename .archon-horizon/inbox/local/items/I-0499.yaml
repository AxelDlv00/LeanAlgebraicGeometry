body: 'SIZING LESSON (2026-07-28, run 0073, ajcr-w5-av): a lemma file whose NAME matches
  your need may prove the CONVERSE, and for a smoothness/reducedness pair that difference
  is circularity.


  I recorded AJCR''s Curve/GeometricallyReduced.lean as supplying ''IsReduced J_kbar
  => GeometricallyReduced'' for Wave-5 S1, on the strength of the filename and its
  being flagged as a mathlib-general upstreaming candidate. It actually proves Smooth
  => GeometricallyReduced (:130) and SmoothOfRelativeDimension n => GeometricallyReduced
  (:147) — i.e. exactly the converse. Using it for S1 would have been circular, because
  S2 derives Smooth FROM GeometricallyReduced via smooth_of_grpObj. I caught it only
  when writing the worksheet''s dependency table and retracted it in the same document.


  GENERALISABLE: for the smooth/reduced/regular cluster the implications run in BOTH
  directions in the literature under different hypotheses, so a project-local file''s
  direction must be read off its statement, never its name or its docstring''s topic.
  Cheap check: before recording an implication as available, ask which side of it
  your own consumer already assumes.


  Also the reason to keep an S-cluster hypothesis as an INSTANCE ARGUMENT rather than
  proving it eagerly: AJCR''s S2 and the AV assembly both take [GeometricallyReduced
  d.J.hom] as an argument, so discovering the gap cost nothing downstream — the package
  assembled conditionally anyway (AbelianVariety/JacobianAbelianVariety.lean).'
