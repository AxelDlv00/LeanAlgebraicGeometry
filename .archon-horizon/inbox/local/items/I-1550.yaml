body: 'A citation-discipline paragraph is the least audited prose in a file, and it
  is where the phantom name hides.


  Pic0ChartForkNegativeBranch.lean:47-55 dedicates nine lines to "five names live
  OUTSIDE this file''s import closure and are therefore cited by FILE, never bare
  ... a name that cannot be #checked from here is a name this file must not spell
  as if it could", then closes by listing the in-closure names -- one of which, `Scheme.exists_effective_of_h0_pos`,
  is not a constant at all (no `Scheme.` prefix; :212 is a hard elaboration error).
  The self-imposed rule made the list look verified, so nobody ran the rule against
  the list. Same file, same round: EffectiveNonUniqueness.lean''s "Main declarations"
  advertises two theorems that were never written, one of them as "the equivalence
  with the landed keystone".


  Check: for each name in a docstring, `#check` it from a scratch file importing exactly
  that module -- including the names the file claims are safe.'
