body: 'Ground review: warm-cache metric caveat


  The recorded 19.580s split vs 6.20s grouped (68.3% saved) comparison is valid as
  a warm-cache Lake invocation/startup measurement, but every comparison command used
  lake build --no-build; it does not kernel-check source or measure compilation/build
  behavior. Only Descent/SemilinearAlgebras has a separately recorded lake env lean
  pass. Before claiming fully tested, run a grouped narrow --mode build check for
  all four leaves (no bare/full root build while run 0154 is active), verify no stale
  trace/olean race, and report that the metric is process batching rather than compile-time
  optimization. Label the 8,558-8,693 jobs values as Lake job-count output, not parallel
  resource usage.'
