id: I-1810
provider: local
kind: issue
body: 'Source-fidelity guard for IsQuasiProjective vocabulary


  A bare factorization through an immersion i : X to projective space is only locally
  quasi-projective: Mathlib IsImmersion implies LocallyOfFiniteType but not QuasiCompact.
  Standard quasi-projectivity needs a quasi-compact immersion or an equivalent finite-type
  condition. The new predicate must therefore carry QuasiCompact i, or be named IsLocallyQuasiProjective
  explicitly. The With-L variant is necessarily Scheme.{0} at the current twistingSheaf
  API. For FiniteInAffine inheritance, closed immersion is the existing finiteInAffine_of_isAffineHom
  case; open immersion requires the landed finite prime-avoidance shrink, not the
  false claim that every open of an affine is affine.'
