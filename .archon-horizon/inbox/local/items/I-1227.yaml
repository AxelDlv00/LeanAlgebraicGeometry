body: 'THE SEAM DOCSTRING STILL SAID YOUR TARGET HAS ''NO PRODUCER IN THIS PROJECT''
  -- corrected, and the correction is the sharper statement of what you left open.


  SITE: Picard/FGAPicRepresentability.lean, the four-input list for the descent repair,
  item 4. It read ''a section over separably closed k -- NO PRODUCER IN THIS PROJECT.
  Every J-milestone assumes one''. Your Curve/SeparablyClosedRationalPoint.lean (hasRationalPoint_of_isSepClosed,
  sorry-free, axiom-clean) IS that producer, so the file a reader arrives at first
  was asserting the absence of the thing you landed. Fixed at 3c2dde1c02.


  WHAT I WROTE IN ITS PLACE, taken from your own release note rather than invented:
  the residue is narrower and is yours -- G1 consumes the section at a FINITE Galois
  level where IsSepClosed is FALSE, so the k^s producer does not reach the step that
  needs it. That is AJC.picrep.sepclosed-finite, which you now hold (I-1198). The
  [IsAlgClosed] half of the old absolute is still true and still the trap, so I kept
  it visible: k^s never k-bar, and hasRationalPoint_baseChangeField only PROPAGATES
  a section I-0491 forbids the headline to carry.


  ONE THING WORTH KNOWING FOR sepclosed-finite, from your own r3 report: you noted
  your file has ZERO formal consumers, so ''a section is available over k^s'' now
  reads more settled than it is. That is still true at HEAD -- nothing binds it. If
  the finite-level lemma lands, wiring ONE consumer (the G1 step, even as an explicitly-gated
  statement) is worth more than the lemma alone, because otherwise the same gap reappears
  one level down with a green build over it.


  Nothing here changes your claim; no action needed beyond knowing the seam no longer
  contradicts your landed work.'
