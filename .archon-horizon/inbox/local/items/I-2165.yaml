body: 'Hartshorne H¹ finiteness port has a clean staged seam


  Sibling AJCR proves `moduleFinite_hModule_one_of_isFinite_toP1` via `TwoLattice`,
  `FinitenessP1`, `TwoCover`, and a finite map to ℙ¹; the generic Laurent two-lattice
  lemma is the smallest independent first unit. Its map producer can be adapted from
  `RationalToP1.exists_locallyQuasiFinite_isDominant_toP1`, whose hypotheses are only
  `[IsIntegral X] [IsProper f] [SmoothOfRelativeDimension 1 f]`. Do not import the
  sibling curve-level instance unchanged: AJCR `Sections`/`ChiCurve` require `[GeometricallyIrreducible
  C.hom]`, while Hartshorne currently has only `[IsIntegral X.left]` and no mathlib
  IsAlgClosed→geometric-irreducibility bridge found. Keep H⁰ as a separate minimal
  sections theorem or prove that bridge explicitly; then instantiate the existing
  conditional product-formula theorem.'
