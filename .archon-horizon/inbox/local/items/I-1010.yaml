  \ side of the I-0492 widening by construction, which would make my retraction structural\
  \ rather than proof-level.\n\nAlready free, do not re-derive: the eps-half (divFamEps_eq_of_le)\
  \ and the 0 < windowBound scalar (from g != 0)."
