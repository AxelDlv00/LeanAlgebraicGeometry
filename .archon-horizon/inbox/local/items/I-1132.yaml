body: 'hcpt IS THE quasiCompact FIELD, so "the two routes the tree already names are
  still the honest ones" MISSES the one already on the board -- and the atlas row
  and dat-j were holding ONE obligation between them


  SITE: Picard/Pic0AtlasFiniteType.lean:230-244 (the hcpt bullet of jacobianDataOfMixedParamCharts),
  also its header :111-117. Measured by ajcr-p4 (run 0090 r3).


  WHAT IT SAYS. hcpt (CompactSpace of the GLUED object) is "Open, and it is the input
  this file leaves exposed"; after correctly measuring that coverage does not imply
  it and correctly diagnosing index finiteness as the gap, it concludes "the two routes
  the tree already names are still the honest ones: a finite atlas, or the Abel image."


  WHAT IS WRONG. Incomplete, in the expensive direction: a THIRD route needs no Abel
  morphism and was already tracked on ANOTHER row (dat-j.qcfield). compactSpace_of_pic0_class_surjective
  (JacobianDataQcFromRep.lean:330) applied to the atlas own representation pic0RepresentableByOfCharts
  C (mixedParamChart ...) hf lands in the hcpt slot on the nose -- (gluedOfCharts
  ...).left is glueData.glued by rfl. Landed as compactSpace_glued_of_pic0_class.


  THE SHARP FORM. hcpt is not a separate obligation at all: CompactSpace of the glued
  SPACE and QuasiCompact of the glued MORPHISM (the JacobianData.quasiCompact FIELD)
  are interderivable over the affine base, one mathlib lemma each way -- compactSpace_glued_iff_quasiCompact,
  BOTH directions. The atlas assembly and dat-j list the SAME statement twice, on
  two rows.


  THIS REFUTES MY OWN I-1123, which called hcpt "a genuine fifth obligation of the
  GOAL". Not fifth: JacobianData has four fields and this is one. Retracted at the
  file and here; the iff is the refutation and it is mine.


  MEASURED. Picard/Pic0AtlasCompactFromClass.lean, rooted, sorry-free. lake build
  EXIT=0 (8913 jobs), oleans confirmed rebuilt BEFORE the axiom probe -- the FIRST
  probe reported the iff as an unknown constant off a stale olean, the recorded stale-import
  trap. lake env lean EXIT=0, zero diagnostics. All SIX declarations axiom-clean [propext,
  Classical.choice, Quot.sound]; control #print axioms AlgebraicGeometry.Jacobian
  DOES fire sorryAx.


  NOT CLAIMED: no gate closed. hcl has no producer (dat-j.qcfield residue, I-1091),
  and its own limit (effectiveDivisorClassifyZar pins deg D = g, g fixed by the curve)
  is unchanged. jacobianDataOfCompactFromClass is an implication with four open inputs:
  rep, hf, coverage, hcl.


  NEXT ACTION: name the class route at :230-244 and stop calling hcpt atlas-specific;
  and do not price hcpt and dat-j.qcfield as two items.'
