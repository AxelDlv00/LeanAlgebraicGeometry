  THE FINDING (I-1329; lesson I-1341). Three sites price B-5 step 3''s residue as
  ''reconcile the chart parameter with the threshold'', treating DAT-0a''s bound at
  the splitting field as per-fibre and unobtainable. HALF RIGHT: DAT-0a is not instantiable
  at L -- it binds pi : Y -> P1 with [IsFinite] [IsDominant] and NO relCurve C L ->
  P1 L exists in this tree. HALF WRONG: the threshold does not need DAT-0a. subsingleton_hModule_one_of_witness
