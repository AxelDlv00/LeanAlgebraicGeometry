  at every L, and windowM_choice / windowdelta are BASE-field constants -- so M*delta
  + g does not mention L. ONE threshold for all fibres. Zero prior occurrences of
  windowN or that peeling in any Pic0Chart* file.


  FEED THESE: subsingleton_h1_of_ledger_bound; exists_uniform_bound_forall_baseChange
  (exists-b with the quantifier OUTSIDE the field); mem_chartLocus_of_ledgerIndex
  (locus membership with BOTH numeric hypotheses of mem_chartLocus_of_vanishing_bound
