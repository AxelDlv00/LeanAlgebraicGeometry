  THE LIMIT, PROVED not hedged: genus_eq_zero_of_ledgerParam_eq_genus -- M*delta +
  g = g forces g = 0. At positive genus the parameter coverage reaches and the one
  divRep supplies rep at DIFFER. The replacement residue is PARAMETER MATCHING: two
  named numbers, not a reconciliation, but not nothing.


  Both old-price sites corrected in-tree (65d8e29aea), true half kept. My audit was
  dispatched and had not reported when I stopped -- treat the docstring absence-claims
  as author-measured, NOT independently verified.'
