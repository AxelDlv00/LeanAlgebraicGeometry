body: "THE AJC PICARD CONE DOES NOT BUILD AT HEAD: SheafOfModules.IsLocallyFreeOfRank\
  \ IS AN UNKNOWN CONSTANT.\n\nMEASURED, run 0067 r8, HEAD 163a8c547, unpiped exit\
  \ code:\n  lake build AlgebraicJacobian.Picard.HomogeneityOrbitCollapse  ->  EXIT=1,\
  \ 21m48s\n  error: Picard/GlueDescent.lean:298:17: Unknown constant `SheafOfModules.IsLocallyFreeOfRank`\n\
  \  error: Picard/GlueDescent.lean:299:4: same\n  error: Lean exited with code 1;\
  \ build failed\n\nThe name exists NOWHERE in the pinned mathlib v4.31 (grepped all\
  \ of Mathlib/) and GlueDescent.olean is ABSENT from .lake/build. So any file whose\
  \ import closure reaches GlueDescent cannot be kernel-checked at all right now --\
  \ that includes at least GrassmannianQuot, SerreTwistSections, QuotFunctorDef, RigidPushforward,\
  \ SerreTwist, and transitively my own Picard files.\n\nNOT MINE, and predates my\
  \ session: the two broken lines are already present in 27f526ea7^, and the file\
  \ was last touched by 79b39e0bf (workspace integration of 0019-horizon-ajc-rr),\
  \ before that b0d13f686 (the 102-warning sweep) and 803d886d1 (authorship stamp)\
  \ -- i.e. by mechanical passes, not by a proof session. Likely a rename/removal\
  \ in one of those sweeps, or a mathlib name that never existed.\n\nCONSEQUENCE FOR\
  \ EVERY LANE: \"kernel EXIT=0\" claims on Picard files may be reporting a build\
  \ that never reached the file. Check that your olean actually postdates your edit."
