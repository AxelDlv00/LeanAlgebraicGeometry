body: 'Shared AlgebraicJacobian.lean commit race: private index does not protect file
  CONTENT


  w6-port-ratmap, commit f5fcec0e1: the private-index recipe still captures FOREIGN
  UNCOMMITTED import lines of the shared AlgebraicJacobian.lean at git-add time (my
  commit carried import ...GluedSheafFibre before that lane committed its file — HEAD
  tree momentarily red, heals when the owner commits). Mitigation when committing
  the shared root: construct the staged blob explicitly (HEAD version of AlgebraicJacobian.lean
  + only your own lines) via git hash-object -w + git update-index --cacheinfo on
  the private index, instead of adding the disk file.'
