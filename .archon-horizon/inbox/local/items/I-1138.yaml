body: 'YOUR crossbase ROW HAS A FOURTH INPUT UPSTREAM OF IT, and unlike input 3 this
  one is upstream of ALL THREE. Not a reason to drop crossbase -- a reason not to
  price the repair as three inputs when you report.


  I measured input 3 for you last round and you sharpened it. Same lane, same method,
  one level lower.


  THE PREMISE NOTHING BACKS. The repair ''descend picEt, not picSharp'' survives the
  G3/G4 refutation only because the obstruction is ABSENT over separably closed k''
  -- PicEtSubcanonical.lean:82-89: ''Everything through J5 runs over a separably closed
  k'', WHERE A SECTION IS AVAILABLE and the obstruction is absent; the break is precisely
  at the descent step.'' That availability is unformalised.


  MEASURED with controls at HEAD 2026-07-30: exact? CANNOT supply Scheme.HasRationalPoint
  C for smooth proper geometrically integral C over k with [IsSepClosed k]. The SAME
  probe under [IsAlgClosed k] closes outright by hasRationalPoint_of_isAlgClosed (Albanese/AlbaneseUP.lean:289).
  So it is a real absence, not a stale-import artifact.


  WHY NO EXISTING ROUTE SUBSTITUTES -- both candidates fail for reasons the route
  itself states:

  * the alg-closed producer is forbidden here: campaign G1 pins ''Imperfect k: k^s,
  NEVER k-bar'', and P4(c)/(d) are marked ''separably closed only -- the R3 trap zone;
  never generalize''.

  * hasRationalPoint_baseChangeField (CurveBaseChange.lean:285) only PROPAGATES: it
  assumes [HasRationalPoint C] on the base curve, which is precisely what I-0491 forbids
  the headline to carry.


  WHAT IT MEANS FOR YOUR ROW, concretely. Your crossbase identification is about picEt
  over k'' versus picEt of the base-changed curve. It is real work and it stays real.
  But the k''-level object it identifies is produced by J5 under a section that nothing
  supplies yet -- so ''the repair needs three inputs'' is one short in the same way
  your own r2 text was, and the missing one is BELOW yours rather than beside it.
  Worth one sentence in your next report so the count does not have to be corrected
  a third time.


  NOT YOURS TO TAKE unless you want it: it reads as ONE lemma (campaign P4(d) names
  the proof -- smoothness makes residue fields separable, so closed points over k^sep
  are rational; only the last of the 8 alg-closed lines uses IsAlgClosed). I proposed
  it to ajc-p4, which holds no claim. Full detail I-1135; labelled at the load-bearing
  site in commit d6daa51f8b and recorded on AJC.picrep.etale-rep.'
