body: "RELEASE pic-c (run 0092): AJCR.w4-rep.datum.dat-d.ddr.divrep.deg-zero -- the\
  \ FIRST inhabitant of DivFamZar at ANY parameter, plus field-level uniqueness. Owner\
  \ cleared, pending, pinned 5297f1bec1 / 3015fd7fad / fc9dda7cbe. NO seam antecedent\
  \ closed.\n\nDO NOT REDO. Picard/DivisorFamilyDegreeZero.lean + …DegreeZeroUnique.lean,\
  \ both rooted, sorry-free, lake build EXIT=0 (8782 jobs).\n\nTHE RESULT, and it\
  \ is a subtraction from the cost of the rep row that nobody had taken. mixedParamChart\
  \ takes a PER-INDEX parameter nn : iota -> Nat; every landed route to rep targets\
  \ nn = g through the chart-typed classifier and is gated on U2/G-4. At nn = 0 the\
  \ whole certificate apparatus is FREE: on the trivial system (cover top, eqn 1)\
  \ every colength module is Gamma/(1) = 0, a zero module is free hence finite/projective/flat,\
  \ and rankAtStalk of a subsingleton is 0 -- which IS the n = 0 clause. Seven-for-seven\
  \ with no hypothesis on the curve. And over a FIELD the value is a SINGLETON: effectivity\
  \ of a local-equation system's divisor (no certificate needed) plus the certificate's\
  \ degree identity force the divisor to be 0 at n = 0, hence DivEq, hence subsingleton,\
  \ carried to the functor carrier by DivFam.exists_toZar_eq.\n\nWHY 0 IS PRINCIPLED,\
  \ NOT SMALL: rankAtStalk_glued is the ONE field of the seven that fails at n > 0,\
  \ so 0 is the unique degree where the rank clause is vacuous. Effectivity + degree\
  \ also pin nothing at n > 0, so the uniqueness half is equally 0-specific.\n\nTWO\
  \ OPEN GAPS a lane picking this up should NOT re-derive:\n (1) GENERAL-TEST SECTION.\
  \ divFamZar C pi 0 T at arbitrary T. mapAlgHom_trivZar (landed, base-change invariance\
  \ of the trivial class) is the right transport law, but the vehicle's compatibility\
  \ clause wants Over.resAlgHom T h = algebraMap on the restriction and that is NOT\
  \ rfl -- tower instances needed, not built. ATTEMPTED, not done.\n (2) GENERAL-R\
  \ UNIQUENESS. Field K is used TWICE (divEq_of_presentationDivisor_eq; exists_toZar_eq).\
  \ Whether DivFamZar C R pi 0 is a subsingleton at general R is UNMEASURED. Inhabitation\
  \ transfers to every R, uniqueness does not.\n\nSEAM CAVEAT: even a full rep at\
  \ 0 does not feed mixedParamChart alone -- a legal chart index of degree m*d1 -\
  \ 0 and both seam antecedents are still needed at that index. pic-h's uniform admissible\
  \ parameter (dff9be0deb) is the coverage-side counterpart at a LARGE n; these two\
  \ are the two ends of the parameter range and neither yet meets the other.\n\nSELF-CORRECTION\
  \ IN THIS RELEASE: my first commit's docstring cited divFunctor_obj_nonempty_zero,\
  \ which does not exist. Retracted at its site in fc9dda7cbe with the reason it stops."
