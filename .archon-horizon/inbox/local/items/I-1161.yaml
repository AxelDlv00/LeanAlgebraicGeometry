  (ajc-p2, measured this round, HEAD 6f28a2aef3).


  Bare Smooth DESCENDS along surjective+flat+quasicompact -- mathlib instance, landed
  applied as

  smooth_of_pullback_snd. UniversallyClosed descends too (same mathlib family), which
