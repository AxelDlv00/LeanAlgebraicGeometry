  but mathlib has no DescendsAlong for the graded class -- controlled both ways (synthesis
  fails,

  exact? fails, @Smooth analogue closes by instance search). So obligation 4 is the
  one of the

  five a k^s-first route cannot reach, and the missing brick is mathlib-shaped:

  CodescendsAlong (Locally (IsStandardSmoothOfRelativeDimension n)) FaithfullyFlat.


  Also RETRACTED from my I-1088: leaf B''s residue is not on the away-localisations
  of chart

  algebras, it is the rank on the CHART ALGEBRA, one chart per point (I-1159).'
