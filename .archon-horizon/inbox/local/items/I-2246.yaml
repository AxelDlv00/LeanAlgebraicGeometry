body: 'Read-only finite-stage -> original-field audit (2026-09-02).


  Exact chain: `Pic0FiniteStageBaseChangedRepresentable.lean:41-62` gives `finiteStageBaseChangeOverIso`
  and `pic0RepresentableBy_finiteStageBaseChange`, but only for the scalar extension
  of `P.gluedOver` to sep-closed `k`: `(pic0TypeFunctor C).RepresentableBy ((Over.pullback
  ...).obj P.gluedOver)`. It does NOT represent the finite-stage carrier over its
  field of definition. Stable carrier is `P.presentation.over` (`Pic0FiniteStageStableGluedOver.lean:86-103`);
  no stable base-change representer wrapper exists.


  Galois descent is already complete: `Pic0GaloisInvariantComparison.lean:202-226`
  gives invariant equivalence; `Pic0GaloisInvariantMatch.lean:416-432` gives naturality;
  `Pic0FiniteGaloisRepresentable.lean:35-58` turns any finite-level `rep : (pic0TypeFunctor
  ((baseChange K L).obj C)).RepresentableBy J` plus orbit-affine into original-field
  `RepresentableBy` of the glued quotient.


  Packaging is already complete: `Pic0FiniteGaloisJacobianData.lean:78-106` gives
  `picRepDatum_finiteGaloisDescent` / `jacobianData_finiteGaloisDescent`; stable wrappers
  `:119-171` consume exact `rep : ...RepresentableBy P.presentation.over` and projectivity.
  Orbit geometry exists at `Pic0FiniteStageStableOrbitAffine.lean:133-147`; LFT/QC
  stable instances are landed. `PicRepDatum.toJacobianData` is direct field copy (`JacobianDataHandoff.lean:39-44`).


  Smallest missing declarations: (A) binder-free same-carrier finite-stage Yoneda
  producer, ideally `pic0RepresentableBy_finiteStageGlue ... : (pic0TypeFunctor ((baseChange
  K P.context.triple.N.1).obj C)).RepresentableBy P.presentation.over` (legacy analogue
  targets `P.gluedOver`), with explicit Ck/base-change compatibility. This must descend
  universal class + natural Yoneda equivalence from the post-base-change theorem.
  (B) exact-carrier geometry producer `pic0FiniteStage_isProjective P : P.presentation.map.IsProjective`
  (or direct `FiniteInAffine`). (C) only then arbitrary-field `pic0_representableBy
  (C) : Sigma J, (pic0TypeFunctor C).RepresentableBy J`, then direct PicRep/Jacobian
  projection. README current checkpoint and `AJC.picrep.rational-point` done state
  confirm these remain absent. No source edits.'
