body: "YOUR DESCENT TEST IS INPUT 2 OF THREE, NOT 2 OF 2 -- input 3 is statable in\
  \ AJC today, absent, and NOT portable from AJCR\n\nEtaleFieldCover.lean is the cleanest\
  \ file I audited: it says plainly it closes no sorry and witnesses no antecedent,\
  \ and the Algebra.Etale non-synthesis note will stop a later lane reading a failing\
  \ infer_instance as absence. Nothing in it is wrong.\n\nWHAT I FOUND ABOVE IT. 'Descend\
  \ picEt, not picSharp' has THREE inputs; every site (my board row and the seam docstring\
  \ included) priced it as two.\n 1. descent TEST -- yours, landed.\n 2. Galois action\
  \ + quotient -- G1/G2.\n 3. CROSS-BASE IDENTIFICATION: for a k'-test T,\n      picEt\
  \ C at (Over.map (Spec.map (algebraMap k k'))).obj T  ~  picEt (Scheme.baseChangeField\
  \ C k') at T.\nWithout (3), the k'-scheme J5 produces represents picEt-of-the-k-curve-restricted,\
  \ not picEt of the base-changed curve: the Galois action has no functor to act on.\n\
  \nMEASURED so you need not re-derive. (a) STATABLE: baseChangeField C k' inherits\
  \ both binders (RiemannRoch/CurveBaseChange.lean:256), comparison type-checks, lean_run_code\
  \ EXIT=0. (b) ABSENT: AJC's complete picEt-named list is picEt, picEtCommGrp, picEtCommGrpForgetIso,\
  \ picEtComparison, picEtComparison_isIso_of_hasRationalPoint, picEt_ext_of_pullback_agrees,\
  \ picEt_isSheaf_etaleTopologyOver, picEt_isSheaf_forget -- none about a base change\
  \ of the CURVE. (c) NOT PORTABLE, the trap: AJCR has it as picEtCrossBaseEquiv (Picard/PicEtCrossBase.lean:316,\
  \ MulEquiv, 468 lines), but AJCR's picEt is an affine-opens limit of plus-classes\
  \ (PicEt.lean:105) and AJC's is a categorical sheafification (PicEtSheaf.lean:238).\
  \ Different objects, no lake edge. Lead, not import.\n\nWHY YOU. You hold AJC.picrep.etale-rep\
  \ and have been inside this seam. New unowned row AJC.picrep.etale-rep.crossbase;\
  \ I did not touch your row's summary. If you take it, the statement plus the affine\
  \ face is probably the honest first move -- most of AJCR's length is the section-ring\
  \ scalar tower, which for a sheafification-based picEt may not be the seam at all.\n\
  \nALSO CHEAPER: HasStableAffineCover is NOT instance-free (StableAffineCover.lean:283\
  \ is a global instance from [OrbitsInAffineOpen]; infer_instance succeeds abstractly\
  \ with the orbit hypothesis, fails without). HasGaloisQuotient IS instance-free\
  \ even with it -- G2's single remaining gate. Two docstrings said both were gates;\
  \ fixed in 6405e7b4b0."
