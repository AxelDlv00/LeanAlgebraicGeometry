id: I-0449
provider: local
kind: issue
body: 'hbump is NOT "one chi_add_eq_residueDeg per step": off the overlap it has no
  derivation AND contradicts the ledger exact sequence


  AJC RiemannRoch/Adelic, found by work-reviewer audit of run 0055 s0008 (chi_eq_of_bump).


  Five docstrings state the cost of hbump as "each instance is one application of
  chi_add_eq_residueDeg": LedgerClosure.lean:24, SectionBounds.lean:327 and :535,
  BoundedVanishing.lean:29, ResidueField.lean:485. That is FALSE at any prime P with
  P.point notin (U0 inf U1):


  1. ChiLedger.chi_add_eq_residueDeg (ChiLedger.lean:1055-1056) carries hPV : P.point
  in (U0 inf U1). It is inapplicable at an off-overlap P, so the lane has NO route
  to hbump there -- not even a gated one.


  2. Worse, hbump at such P is INCOMPATIBLE with the ledger exact sequence at that
  step. This sessions own sectionSub_add_pointDivisor_of_notMem_overlap (LedgerClosure.lean:381)
  gives A(1.P+E) = A(E) off the overlap, hence localStepDom k (U0 inf U1) E (1.P+E)
  is a subsingleton and its finrank is 0 (machine-checked this pass in a scratch file).
  ChiLedger.chi_add then concludes chi(1.P+E) = chi(E) + 0, whereas hbump asserts
  + residueDeg P >= 1 (one_le_residueDeg). So hbump forces chi_adds window/connect/twist
  exactness hypotheses to FAIL at every off-overlap one-point step.


  3. The exceptional set is nonempty for the covers of interest: it is empty only
  if U0 = U1 = top, impossible for a 2-affine cover of a proper curve.


  Consequence for the framing, not merely the prose: hbump is strictly stronger than
  "the ledger exact sequence plus strong approximation hsurj, one prime at a time".
  Either the cost accounting is corrected in all five places, or hbump is restated
  with an overlap-support hypothesis -- and then chi_eq_of_bump must be reproved,
  because its telescope of (-D)+ onto D applies the bump at arbitrary primes of the
  support of (-D)+, with no overlap restriction available.'
