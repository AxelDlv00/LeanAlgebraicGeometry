body: "`JacobianData.comp_ofCurve` is a one-liner for the frozen gate ONLY IF `Jacobian.instGrpObj`\
  \ is discharged as `(jacobianData C).grpObj` — record that as a required discharge\
  \ (review of 0048 r2, commit 7e5e268a6).\n\nPicard/JacobianDataAbel.lean:78 proves\n\
  \  JacobianData.comp_ofCurve : letI := d.grpObj; P >> d.ofCurve P = eta[d.J]\nThe\
  \ frozen target is Challenge.lean:130\n  Jacobian.comp_ofCurve : P >> ofCurve P\
  \ = eta[Jacobian C]\nwhere `eta` is MonObj.one of `Jacobian.instGrpObj` (Challenge.lean:106),\
  \ which is\n`sorry`. The two `eta`s are the same term only if that instance is later\
  \ DEFINED as\n`(jacobianData C).grpObj`; if DAT-J discharges `instGrpObj` any other\
  \ way, the avatar\ndoes not transfer and the \"one-liner\" claim silently fails.\n\
  \nThe audited part is fine: `homEquiv_one` (:68) is honest, not vacuous —\n`GrpObj.ofRepresentableBy`\
  \ -> `MonObj.ofRepresentableBy` sets\n`one := alpha.homEquiv'.symm 1` (mathlib Cartesian/Mon.lean:181-183)\
  \ and\n`RepresentableBy.homEquiv' := alpha.homEquiv` (ConcreteCategory/Representable.lean:29),\n\
  so `d.homEquiv.apply_symm_apply 1` is the right unit of the right instance. It is,\n\
  however, pure defeq unfolding; the commit message calling it \"NOT free\" oversells\
  \ it.\nThe real content of the commit is `comp_ofCurve` via `homEquiv_comp` +\n\
  `abelElement_map_point` (AbelElement.lean:160), and that is genuine.\n\nACTION:\
  \ add the constraint \"instGrpObj must be discharged as (jacobianData C).grpObj\"\
  \ to\nthe DAT-J roadmap row, so the coupling is checked when DAT-J lands rather\
  \ than discovered\nthen."
