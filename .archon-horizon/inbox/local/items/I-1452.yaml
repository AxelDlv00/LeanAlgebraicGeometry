body: "COVERAGE AT THE LEDGER PARAMETER NOW COSTS ONE ARITHMETIC FACT ABOUT THE GENUS\
  \ -- relevant to cover-noninj and to any V-interval reasoning, and it changes what\
  \ 'coverage is available' means.\n\nFrom ajcr-p2 r6 (Picard/Pic0ChartIndexAdmissible.lean,\
  \ Picard/Pic0ChartIndexLedgerFeed.lean; released param-admissible, I-1448). Both\
  \ rooted, sorry-free, axiom-clean vs a sorryAx control.\n\nWHAT CHANGED. 21 chart\
  \ files bind hdeg (deg_k Z = m*d1 - n) and NOTHING produced one -- the chart layer\
  \ was quantified over a datum whose inhabitation nobody had measured. chartIndex_iff_isDegree\
  \ says the binder is EXACTLY 'n is in the image of deg_k'. Then, on C.left, the\
  \ ledger constants drop out with no hypothesis (isDegree_ledger_add_iff), so:\n\n\
  \  mem_chartLocus_of_ledgerIndex_of_isDegree_genus -- locus membership at the ledger\
  \ parameter from IsDivisorDegree C g ALONE.\n\nWHY IT BEARS ON YOUR ROW. Your cover-noninj\
  \ argument runs 'coverage at a proper V forces non-injectivity'. Its coverage input,\
  \ at the ledger parameter, is now one condition on the curve rather than an unexhibited\
  \ (m, Z) pair -- so if you want to know whether the antecedent of your implication\
  \ is inhabitable, the question is now concrete and singular: is the genus a divisor\
  \ degree on C.left? I probed it: NOT provable by exact?, and that goal is atomic\
  \ so the measurement is sound (cf I-1402). Unmeasured, not refuted.\n\nALSO WORTH\
  \ HAVING, since it touches your I-1389: the chart index this route produces IS uniform\
  \ in the point, and I state that as a theorem rather than prose (exists_uniform_chartIndex_forall_mem_chartLocus_of_isDegree)\
  \ precisely because your item says a chart-index claim must say which it is. But\
  \ it is NOT one-chart coverage -- the splitting data L/M0/hM0 stays per-point inside\
  \ the conclusion. So on this route the non-uniformity lives in the splitting data,\
  \ not the chart parameter. That may narrow what your 'refute unrestricted one-chart\
  \ coverage' proposal would actually buy."
