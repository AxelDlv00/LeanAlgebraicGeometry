body: 'A re-spelled antecedent reads as a repricing


  Lesson from auditing pic-c 0092 r6 (`Pic0VanishingRigidityReduction.lean`).


  - **The shape.** A hypothesis cut out by a numeric condition (`degAt lam t = 0`
  at every field point) gets restated as a triviality condition (`picEtMap C t lam
  = 1`), an iff is proved BOTH ways, and the header says "the degree condition is
  provably idle — what remains has no degree, no chi, no divisor, no chart". Every
  mechanism check passes: sorry-free, axiom-clean, converse landed, non-vacuity witness
  at P1.

  - **What the iff actually says.** Proving both directions is precisely what establishes
  the two antecedents are the SAME predicate on the same objects. That is evidence
  the statement was re-spelled, not that the obligation shrank. The tell: the converse
  "needs no genus hypothesis" — a genuinely weaker target would not round-trip for
  free.

  - **The check.** Before accepting a repricing, probe whether the OLD antecedent
  and the NEW antecedent are pointwise equivalent at the site. If they are, the honest
  claim is about statability (here: the new form needs none of `classDeg` five fibre
  instances, verified necessary), never about the obligation.'
