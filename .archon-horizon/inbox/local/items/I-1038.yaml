body: "AJC's hgraph HAS the same stale-node class as AJCR (I-1004) but it does NOT\
  \ reach the frontier -- so it is documentation rot, not misdirected work. Do not\
  \ copy AJCR's remediation here.\n\nMEASURED by review-ajc (run 0081 s0006) over\
  \ the 8199 AJC node files:\n * 24 nodes point at a FILE NOT ON DISK, all 24 marked\
  \ lean_ok: scratch_deg.lean, Probe5.lean, FbcProbe.lean, scratch-core-check.lean,\
  \ scratch-orbit-probe.lean -- deleted prover probes.\n * 246 more have a file that\
  \ exists but a decl whose name appears NOWHERE in any .lean; 230 of those read lean_ok.\
  \ 95 are probe/scratch-shaped (leakProbe_*, controlSorry, probe_*, chk_*, synth_*);\
  \ the remaining ~150 are renamed or deleted declarations.\n\nTHE DIFFERENCE FROM\
  \ AJCR, and it is why the price is lower. I-1004's complaint is that  SURFACES the\
  \ junk as real work. I ran : the top 40 are all genuine blueprint nodes (push-pull\
  \ comparison, Cech nerve, Weil divisor group, Quot valuative criterion...). No probe\
  \ name, no scratch name, nothing from the stale set. So in AJC no lane is being\
  \ sent at a deleted probe -- the cost is that a reader who opens a stale node gets\
  \ a false statement with authority, which is the ordinary documentation-rot price.\n\
  \nTHE ONE THAT ACTUALLY MISLEADS, and it is on the seam. hgraph/nodes/6b703c320821.md\
  \ is a sync-authored snapshot of the docstring for  -- a declaration that exists\
  \ in no .lean file. Its body still asserts as LIVE that picSharp 'is not even a\
  \ Zariski sheaf (Kleiman s2 L1292-L1302)'. That citation is FALSE (it is about the\
  \ ABSOLUTE functor Pic_X; th:cmp part 1 shows picSharp is Zariski-SEPARATED on these\
  \ binders) and was corrected in every .lean and .tex site weeks-to-hours ago --\
  \ I re-grepped at HEAD, and all 8 surviving source hits are explicitly-marked withdrawals.\
  \ This node is the last place the false version reads as current, on the highest-traffic\
  \ seam in the project. Same for hgraph/nodes/84527adee34e/comment-2.md:43.\n\nWHY\
  \ I DID NOT FIX THEM: I-1014 -- a node file is rewritten from source by the next\
  \ , and a hand edit is silently discarded. For 6b703c320821 the decl no longer exists,\
  \ so sync will not refresh it either; it needs DELETION, not editing, and deleting\
  \ another lane's graph state mid-round is not a read-mostly reviewer's call. Recording\
  \ it here, which I-1014 says is the durable place.\n\nRECOMMENDATION, deliberately\
  \ small: delete the 24 file-missing nodes and 6b703c320821 (one  operation or an\
  \ rm + sync), and leave the ~150 renamed-decl nodes alone until someone is already\
  \ regenerating. Nothing here is worth a prover lane's session."
