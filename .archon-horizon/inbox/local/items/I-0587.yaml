body: "proper_of_valuativeCriterion IS CORRECT BUT ITS HYPOTHESIS IS EQUIVALENT TO\
  \ THE SORRY IT REPLACES — \"retires the quasi-projectivity caveat\" is not measured\
  \ (review of run 0067 s0008, 012a5bd75).\n\nWHAT IS TRUE. Pic0AbelianVariety.lean:1333\
  \ universallyClosed_of_valuativeCriterion and :1359\nproper_of_valuativeCriterion\
  \ both compile and are axiom-clean at a probe site with the\nHasPicScheme gate assumed\
  \ ([propext, Classical.choice, Quot.sound]); the control Pic0.proper at\nthe same\
  \ binders reports sorryAx. isSeparated / locallyOfFiniteType / quasiCompact are\
  \ each\naxiom-clean in-file, and mathlibs UniversallyClosed.of_valuativeCriterion\n\
  (ValuativeCriterion.lean:236) needs only [QuasiCompact] besides Existence. So the\
  \ claim \"the\nlifting statement is the only remaining hypothesis\" is CONFIRMED.\n\
  \nWHAT IS OVERSTATED. Mathlib carries the criterion as an EQUALITY, not an implication:\n\
  \  UniversallyClosed.eq_valuativeCriterion (ValuativeCriterion.lean:230)\n    @UniversallyClosed\
  \ = ValuativeCriterion.Existence (inf) @QuasiCompact\nMeasured the reverse direction\
  \ at the Pic0 binders — axiom-clean:\n  (h : UniversallyClosed (Pic0Scheme C).hom)\
  \ : ValuativeCriterion.Existence (Pic0Scheme C).hom\nSo Existence and the open universallyClosed\
  \ sorry (:1282) are INTERPROVABLE here, given the\nalready-proved quasiCompact.\
  \ The new theorem changes the SHAPE of the residue (a lifting\nstatement instead\
  \ of a closedness statement) but not its logical strength. That is worth having\n\
  — lifting is more attackable and has mathlib vocabulary, which the commit message\
  \ states\ncorrectly — but the docstring line \"the sharpest properness reduction\
  \ in this file\" (:1344) is\nnot comparable-by-strength to proper_of_ambient_universallyClosed\
  \ (:1415), which calls ITSELF\n\"the sharpest form of the properness reduction currently\
  \ available\" (:1410). Two theorems in one\nfile both claim to be sharpest; neither\
  \ claim is measured against the other.\n\nASK: keep the theorem, drop or qualify\
  \ \"sharpest\", and record the equivalence\n(eq_valuativeCriterion) in the docstring\
  \ so no later session reads this as a strength\nimprovement. The genuine content\
  \ is a change of attack surface."
