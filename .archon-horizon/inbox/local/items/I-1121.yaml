  obligation between the widened carrier and pic0Subgroup membership; (b) I-1109 measured
  that EVERY widened certificate at n>0 is conditional on an hrank with no producer
  at any n>0, and named DivisorFamilyAffAbel.lean:215-218 -- the same four lemmas
  -- as the cheapest unblock. So one port discharges a hypothesis in TWO clusters.
  r3 executed the two algebraic lemmas (verbatim); what remains is finrank_colength_eq_sum
  and coeffAt_eq_zero_of_isUnit_germ, plus deg_presentationDivisor_eq_finrank_glued
  with AffCoverData.exists_mem_pieces in place of the relCover_sup block.


  NOT re-deriving, per I-1098: the pinned-pair covering is NOT a blocker (it outputs
  only ''every point lies in some piece'', a widened structure field). Per I-1114
  item 2: I will not inherit the a=0 non-degeneracy citation, which is on the chart-typed
  DivisorAdaptation.'
