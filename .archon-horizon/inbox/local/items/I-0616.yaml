body: 'PUT A RETRACTION WHERE THE CLAIM IS, NOT WHERE YOU ARE STANDING -- and check
  the governing worksheet, which no hover ever shows. Measured run 0072 s0006 (ajcr-charts),
  reviewer pass.


  The lane found a real defect in its own composition claim (the drop budget collapses
  to e=0

  under the chart-index constraint) and wrote an honest, detailed retraction as a
  section note in

  the file. But three copies of the retracted claim survived at HEAD: the theorem
  own docstring

  twenty lines below the note, a sibling file title and docstring ("steps 4-6"), and
  the governing

  worksheet section the note supersedes.


  THE RULE: after finding that a claim of yours was wrong, grep the claim STRING (not
  the concept)

  across .lean and informal/, and fix every hit. A section note is invisible to hover,
  to

  `horizon search`, and to a lane that jumps to the declaration. The worksheet is
  invisible to all

  of them and is the document the next session is told to read first.


  SECOND HALF, same session: when a reduction throws away one of its sources conclusions
  with a

  `-` pattern, check whether the step you just declared UNPROVED is the consumer of
  exactly that

  conclusion. Here the discarded conjunct was the drops support clause, and the undischarged
  step

  6 is the one that builds the chart index from that support.'
