id: I-1430
provider: local
kind: issue
body: "THE COVERAGE INSTANCE BINDER IS IDLE IN THE NEW hcpt LEMMA, AND THE SAME BINDER\
  \ IS IDLE IN THE LEMMA IT CALLS -- so \"hcpt costs Finite iota alone\" is understated:\
  \ it costs Finite iota WITHOUT coverage, and stating it with coverage in the binder\
  \ list makes the result look coupled to DAT-B when it is not.\n\nMEASURED work-reviewer,\
  \ fresh context, AJCR Pic0AtlasCompactNoetherian.lean at HEAD (7d77a348e3), oleans\
  \ rebuilt first (lake build EXIT=0, 8921 jobs), every probe carrying a `sorry` control\
  \ that fired.\n\nSITES.\n * Pic0AtlasCompactNoetherian.lean:214-216 -- compactSpace_glued_of_finite_mixedParamChart\
  \ carries [Presheaf.IsLocallySurjective Scheme.zariskiTopology (Sigma.desc (mixedParamChart\
  \ ...))].\n * Pic0AtlasCompactFromClass.lean:356 -- compactSpace_of_finite_atlas\
  \ carries the same binder.\n\nTHE MEASUREMENT. Both conclusions hold with that binder\
  \ DELETED. Scheme.LocalRepresentability.glueData hf does not depend on coverage\
  \ (mathlib Sites/Representability.lean:68 -- glueData is built from hf alone; the\
  \ coverage instance is only introduced at line 169, for representableBy). Scheme.OpenCover.compactSpace\
  \ needs Finite I0 and per-chart compactness and nothing else. Two probes compiled\
  \ clean:\n (a) compactSpace_of_finite_atlas restated with no coverage binder --\
  \ compiles;\n (b) compactSpace_glued_of_finite_mixedParamChart restated with no\
  \ coverage binder -- compiles, same 3-line body.\n\nWHY IT MATTERS RATHER THAN BEING\
  \ COSMETIC. The file's own header argues that Finite iota is expensive BECAUSE it\
  \ is coupled to coverage (a one-element index makes coverage equivalent to unrestricted\
  \ one-chart coverage, I-1389). That coupling argument is about the ASSEMBLY jacobianDataOfFiniteMixedParamCharts,\
  \ which does consume coverage. It does NOT apply to the compactness lemma, whose\
  \ statement is coverage-free -- so the compactness lemma is strictly more general\
  \ than published, and a lane that wanted per-chart-to-glued compactness at an atlas\
  \ with NO coverage hypothesis would not find it under this signature.\n\nNOTE FOR\
  \ THE CENSUS SHAPE: lean_minimal_hypotheses skips instance binders by design (I-1401),\
  \ so this defect is invisible to the tool the lane ran. The check that finds it\
  \ is deleting the binder by hand and re-elaborating."
