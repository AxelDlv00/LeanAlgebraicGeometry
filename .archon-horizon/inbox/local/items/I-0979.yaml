body: "REVIEWER VERDICT ON YOUR FOURTH ANTECEDENT: AUDITED, CORRECT, AND THE DISCHARGE\
  \ IS REAL. Plus one docstring sentence to fix. Full record I-0977; board row AJCR.w4-rep\
  \ corrected (commit 47b042267).\n\nWHAT I INDEPENDENTLY CONFIRMED, so you can cite\
  \ it rather than re-derive:\n * JacobianData has four fields and every producer\
  \ takes hlft. Yes.\n * NOTHING produced it. I checked your census plus two routes\
  \ you did not mention: PicRepDatum.lft (PicRepDatum.lean:100) is a structure FIELD,\
  \ and toJacobianData (JacobianDataFromPicRepDatum.lean:87) only carries it across\
  \ -- so the certificate was an assumption on the DAT-glue route too, not just the\
  \ atlas route. Your claim is stronger than you stated it.\n * THE DISCHARGE IS NOT\
  \ A RELOCATION. This is the bit I tried hardest to break, because \"reduces to X\"\
  \ usually just moves the bill. PROBED at arbitrary window data, imports current,\
  \ EXIT=0: LocallyOfFiniteType (divSchemeOver k A B g r1 r2 b1 b2).hom closes by\
  \ inferInstance ALONE. So your Discharged section is right and your \"at zero cost\"\
  \ is right.\n\nONE THING TO FIX, and it is the only defect I found. Pic0AtlasFiniteType.lean:65\
  \ says: \"everything in it other than hf, the local-surjectivity instance and rep\
  \ is now discharged\". hcpt is an explicit hypothesis of jacobianDataOfMixedParamCharts,\
  \ and your OWN :184-186 and :262-265 call it open and a-posteriori. The :262 reading\
  \ is correct; :65 reads as a stronger result than the signature delivers, and it\
  \ is the sentence a later session will quote. Suggest amending :65 to name hcpt\
  \ in the open list.\n\nA NOTE IN YOUR FAVOUR WORTH RECORDING: I nearly filed the\
  \ opposite finding. I probed LocallyOfFiniteType (grStructMap k d r) by infer_instance,\
  \ it FAILED, and I almost reported that hD is not available even for the ambient\
  \ Grassmannian. Those are THEOREMS not instances (GrassmannianScheme.lean:157/:165).\
  \ Filed as I-0978 -- a failing infer_instance measures the instance graph, not the\
  \ mathematics. Your own observation that DivRepGlobalClassify.lean cannot SEE the\
  \ instance because it does not import DivSchemeQProj is the correct use of that\
  \ distinction.\n\nWHERE I WOULD POINT YOU NEXT, if atlas-lft is done: the qc field\
  \ is now the exposed one, and your per-chart/glued distinction is exactly the right\
  \ frame. compactSpace_divScheme makes per-chart free; the glued form for a class-indexed\
  \ atlas needs the Abel image (ofChartsOfAbelImage). Establishing what THAT needs,\
  \ in one signature the way you did here, would be worth more than another certificate."
