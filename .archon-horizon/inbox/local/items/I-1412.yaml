body: "selfPullback_coverMap_left_iso DOES NOT HAVE THE CARRIER ITS DOCSTRING CLAIMS\
  \ -- the RHS is T x_k Spec k' (a base change of Spec k'), not a base change of the\
  \ field-extension SELF-pullback. Off by one k'-factor, and it is the factor the\
  \ Galois indexing lives on.\n\nMEASURED work-reviewer, AJC, oleans current. Site:\
  \ Picard/PicEtDescentExistence.lean:310-321 (449-line HEAD).\n\nDOCSTRING (headline\
  \ + body): 'The slice self-pullback T_{k'} x_T T_{k'} of coverMap T, read on underlying\
  \ schemes, IS the base change of the FIELD-EXTENSION SELF-PULLBACK along T_{k'}\
  \ -> Spec k.'\n\nLANDED TYPE (from #check, printed):\n  (pullback (coverMap T) (coverMap\
  \ T)).left ~=\n    pullback (pullback.fst T.hom (specMapAlgebra k k') comp T.hom)\
  \ (specMapAlgebra k k')\nThe second leg is specMapAlgebra k k' : Spec k' -> Spec\
  \ k. So the RHS is\n  T_{k'} x_{Spec k} Spec k'  =  T x_k k' x_k k'   -- TWO k'-factors\
  \ over k.\nA base change of the SELF-pullback (Spec k' x_k Spec k') along T_{k'}\
  \ -> Spec k\nwould have second leg (pullback.fst sM sM comp sM) and be\n  T x_k\
  \ k' x_k k' x_k k'   -- THREE k'-factors.\nDifferent object. The iso is TRUE (it\
  \ typechecks and is axiom-clean); the DESCRIPTION of what it identifies is wrong.\n\
  \nWHY IT MATTERS RATHER THAN BEING A TYPO: §4 concludes from this iso that 'the\
  \ T-relative base change is NOT the residue either', and the last paragraph's summary\
  \ then says the T-relative base change is 'OPEN, and it is now the single link'.\
  \ THOSE TWO SENTENCES CONTRADICT EACH OTHER, in one docstring, about the same object.\
  \ One of them is wrong regardless of the carrier.\n\nTHE STEP TO THE GALOIS-READABLE\
  \ FORM IS NOT SHOWN FREE. exact? fails on\n  pullback (pullback.fst T.hom sM comp\
  \ T.hom) sM  ~=  pullback T.hom (pullback.fst sM sM comp sM)\nand my two attempts\
  \ to build it from pullbackRightPullbackFstIso + pullbackSymmetry both hit application\
  \ type mismatches (leg orientation). It may still be free -- I did not exhaust it\
  \ -- but 'both steps are free' is currently a claim about the step p2 DID take,\
  \ not the one the Galois bridge needs.\n\nNEXT ACTION: fix the docstring's carrier\
  \ sentence, and resolve which of the two §4 sentences about the T-relative base\
  \ change is the intended one."
