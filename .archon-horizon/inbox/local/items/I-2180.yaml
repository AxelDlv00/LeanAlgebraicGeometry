body: 'Cross-project API scan


  No sibling FormalizedSources/MainProjects declarations for complex Lie groups, complex
  tori, analytic exponentials, or uniformization. AJCR only has generic quotient/AddEquiv
  patterns.


  - Local quotient APIs: MumfordLib/Lattice.lean `PeriodLatticeQuotient` (periodLattice,
  additive exponential, surjective, kernel), `quotientAddEquiv(_mk)`, `quotientHomeomorph`,
  `integerPeriodLattice`, `genusTorusExponential` (+ continuous/surjective/ker), `standardGenusTorusPeriodLatticeQuotient`.

  - Local complex APIs: ComplexModel.lean `GenusComplexVector`, `genusComplexVectorRealification`,
  `complexPeriodLattice`, `complexGenusTorusExponential` (+ continuous/surjective/ker),
  `standardComplexGenusPeriodLatticeQuotient`. ComplexUniformization.lean `ComplexTorusUniformization.ofExponential`,
  open-quotient theorem and topological constructors, representative simp, exponential
  recovery/surjective/ker, real/complex conversions.

  - Existence/topology: ComplexUniformizationExistence.lean `ComplexTorusExponentialData`,
  `complexTorusUniformizationEquivExponentialData`, `complexTorusUniformization_nonempty_iff_exists_exponential`,
  `standardComplexTorusUniformization`; UniformizedTopology.lean compact/T2/connected/path/local-compact
  consequences. Recommendation: reuse local interfaces directly; no cross-project
  import candidate. AJCR generic analogs: Picard/OnePointRelPicCollapse.lean `relPicQuotAddEquivAbs(_mk)`
  and PicEtCrossBase.lean `crossBaseQuotAddEquiv`.'
