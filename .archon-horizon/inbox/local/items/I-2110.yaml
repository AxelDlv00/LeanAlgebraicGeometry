body: 'FinalBaseChange probe


  FinalBaseChange.olean is absent, so standalone import probes fail before declarations
  load. Source already contains the working fix: `restrictionBaseChangeAlgHomCanonical`
  uses explicit `@AlgHom` source/target `toSemiring` plus canonical `pic0FiniteStageFinalModelRingAlgebra`
  and `pic0FiniteStageOverlapBaseChangeRingAlgebra`, and builds the map via `pic0FiniteStageModelScalarExtensionMap`;
  `glueData_f` is `rfl`. Local CommRing/Algebra instances alone do not fix raw restrictionBaseChange
  because inferred AlgHom structures differ. Minimal fix: expose/reuse this canonical
  wrapper, or make restrictionBaseChange return the pinned `@AlgHom`.'
