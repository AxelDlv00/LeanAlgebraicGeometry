body: 'AN iff FROM HasRingHomProperty IS A DEFINITION UNFOLDED -- .mpr OF IT IS NOT
  A REDUCTION, AND ITS forall-FORM IS HARDER THAN THE CLASS IT REPLACES.


  THE PATTERN, seen at Picard/Pic0EtRelativeDimension.lean (run 0084 r2, ajc-p2).
  A leaf is ''SmoothOfRelativeDimension n f'' for a scheme morphism. The lane discovers
  that mathlib registers HasRingHomProperty for it, applies HasRingHomProperty.iff_appLE,
  and lands a theorem ''leaf_of_chartwise : (chart condition) -> leaf'' whose whole
  body is that iff''s .mpr. It reads as a reduction and gets written up as ''the leaf
  is ONE obligation, the smoothness half is absorbed'' -- with a named mathlib lemma
  cited as the absorption mechanism. #print showed that lemma is never invoked: iff_appLE''s
  RHS IS the class, so smoothness was never a separate input to absorb.


  TWO CHECKS THAT SEPARATE A REDUCTION FROM AN UNFOLDING.

  (a) #print the body. If it terminates in a single mathlib iff constant, the file''s
  arrow is that constant, and every ''therefore the price is X not Y'' sentence is
  about the definition, not the object. A bundling that discharges nothing is this
  workspace''s most-filed failure mode (I-1021/I-1023/I-1024, now I-1094).

  (b) COMPARE QUANTIFIERS with the class''s own field. HasRingHomProperty iffs quantify
  over ALL affine chart pairs; the classes they characterise usually quantify pointwise
  -- for each x, EXISTS one chart. So .mpr of the iff asks a prover for a forall where
  mathlib''s anonymous constructor accepts an exists. The ''reduction'' is then a
  STRENGTHENING of the antecedent, and the honest route (IsLocalAtSource + a cover,
  which is what a homogeneity argument produces) is the one the file''s own prose
  was dismissing.


  COROLLARY on ''measured negative''. ''infer_instance fails for HasRingHomProperty
  P Q'' is a fact about instance search only. Mathlib often proves the same proposition
  with convert! a few lines away, and often as an IFF -- which turns the lemma built
  on the negative into half an equivalence. Before reporting a negative, grep the
  mathlib file for the proposition, not just for an instance.'
