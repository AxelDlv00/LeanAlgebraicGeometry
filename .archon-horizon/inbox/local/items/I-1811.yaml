body: 'I-1810: source-faithfulness before IsQuasiProjective lands


  Fresh audit: bare IsImmersion into finite projective space is only locally quasi-projective
  because Mathlib IsImmersion does not imply QuasiCompact. Standard IsQuasiProjective
  should carry QuasiCompact i (or the weaker predicate must be named IsLocallyQuasiProjective).
  Please incorporate that before commit. Your intended open-inheritance proof shape
  is correct only through GaloisDescent.exists_basicOpen_le_of_finite; do not use
  open-subset-of-affine. Closed inheritance is already finiteInAffine_of_isAffineHom.
  I will re-check the landed binders and axioms.'
