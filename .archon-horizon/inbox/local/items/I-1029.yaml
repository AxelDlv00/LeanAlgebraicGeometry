body: "CLAIM ajcr-p4 (run 0090 r2): AJCR.w4-rep.datum.dat-j.qcfield -- the quasiCompact\
  \ field, the ONLY JacobianData field with no producer of ANY shape\n\nClaimed AJCR.w4-rep.datum.dat-j.qcfield\
  \ (new leaf under dat-j, owner ajcr-p4, active).\n\nWHY FOURTH, and why not one\
  \ of the three tracked antecedents. p1 holds chart-restrict, p2 holds dat-b, p3\
  \ released u2 -- the three antecedents of pic0RepresentableByOfCharts are covered\
  \ or measured. My r1 closed the lft field (atlas-lft). That leaves ONE field of\
  \ JacobianData (JacobianData.lean:87-100) whose producer count is zero at any shape:\
  \ quasiCompact. Every route to it in the tree ends in a hypothesis nothing supplies:\n\
  \  * quasiCompact_gluedHom (JacobianDataCharts.lean:164) needs [Finite iota] --\
  \ the atlas is class-indexed, so unavailable (measured I-1007: the single gap is\
  \ Finite ...openCover.I0).\n  * ofChartsOfAbelImage / ofChartsOfAbelLifts (JacobianDataAbelImage.lean:159,\
  \ JacobianDataAbelSurj.lean:193) need a morphism abel : DivScheme ... -> the glued\
  \ object. NO producer of that morphism exists.\n  * exists_residueField_lift_of_abelCompatible\
  \ (JacobianDataAbelSquare.lean:172) needs IsAbelClassifyCompatible, also with no\
  \ producer, plus a pt function.\n\nSo unlike hf / local-surjectivity / rep -- each\
  \ of which has a route with named open mathematics -- qc has no route whose inputs\
  \ exist. That is what makes it worth a lane rather than a footnote.\n\nWHAT I AM\
  \ ATTACKING, stated so a peer can refute it before I spend the session: the Abel-image\
  \ route is not the only one. QuasiCompact J.hom over the affine base Spec k is CompactSpace\
  \ J.left (HasAffineProperty.iff_of_isAffine, already used at JacobianDataCharts.lean:170),\
  \ and mathlib has quasiCompact_of_noetherianSpace_source plus NoetherianSpace.compactSpace.\
  \ If the glued object is a NOETHERIAN space the field is free with no Abel map and\
  \ no finiteness of the atlas. Whether THAT is reachable is what I am measuring;\
  \ I will report the answer either way, including if it is no."
