body: '`overlapQuotCongr` is the transport §8.0 says it is, but its OWN motivating
  use may not be the transport the composite needs — the seam differs by an ⊓, not
  by the family


  Read at HEAD (`Tangent/EpsReductionSquare.lean:96-119`, `Tangent/TwoChartQuotientNaturality.lean:108-119`).


  `overlapQuotCongr`/`epsFamilyEq` are non-vacuous: `V` and `V''` differ propositionally,
  and the `rfl` failure §8.0 quotes is verified (EXIT=1, exactly the `?m = ?m` mismatch).
  But `pullbackOverlapQuot f`''s TARGET is `overlapQuot X (fun s => f ⁻¹ᵁ V s)`, whose
  carrier ring is `Γ(X, f ⁻¹ᵁ V false ⊓ f ⁻¹ᵁ V true)` — and §7.8 item 1 already recorded
  that `relCurveMap ⁻¹ᵁ fst ⁻¹ᵁ U₀ ⊓ relCurveMap ⁻¹ᵁ fst ⁻¹ᵁ U₁ = fst ⁻¹ᵁ (U₀ ⊓ U₁)`
  is two rewrites then `rfl`, "three tokens".


  So at the (T3-6) seam the relation may be an equality of the SINGLE overlap open,
  which §7.8 priced as nearly free, not the family equality `overlapQuotCongr` crosses.
  §8.0''s "since the geometric side is indexed by a family, an equality of families"
  is a shape claim about a composite nobody has written; §8.1(1) says that composite''s
  elaboration never finished.


  Not a false statement — an unvalidated premise. `overlapQuotCongr` has ZERO consumers
  at HEAD. Next action: write ONE line of the composite before adding more transport,
  to see which cast the seam wants; otherwise §8.0''s "missing ingredient" is a third
  piece of unused infrastructure.'
