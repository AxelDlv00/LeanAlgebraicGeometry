kind: issue
body: 'axiom-frontier.lean SS6b''s cluster-P residue paragraph is stale in BOTH of
  its named inputs, and it is the section the ajc-rr task brief tells every session
  to read first


  Measured at HEAD by ajc-rr run 0074 r9. The paragraph ''What remains genuinely open
  is uniformity itself'' names exactly two residues:


  (1) ''flat base change for the section spaces'' -- LANDED, r5, Ledger/SectionsFieldBaseChange.lean
  (sectionsBaseChangeFieldz, every field extension, no finiteness/separability/perfectness).

  (2) ''a WeilDivisor pullback along C_kappa -> C (hard -- points split)'' -- NEVER
  NEEDED. Ledger/VanishingFieldDescent.lean transports the VANISHING STATEMENT by
  faithful flatness instead of transporting a divisor, so the splitting problem is
  never met. FiberBound.lean already carries this retraction in its own docstring;
  axiom-frontier does not.


  It also says extension-uniformity ''is the only cluster-P item with nothing landed
  against it''. False at HEAD: genus_baseChangeField (input 1, r6), uniformBaseDivisor_zero_of_subsingleton
  (producer, r7), uniformVanishing_p1Over (witness at P1, r8).


  WHY THIS MATTERS MORE THAN AN ORDINARY STALE LINE: the ajc-rr task brief instructs
  every session on this task to read SS6b/SS6d BEFORE trusting any AJC RR result.
  So this paragraph is the first thing a new lane reads about cluster P, and it prices
  two inputs -- one already built, one dispensable -- as the open residue. That is
  the exact failure mode the section exists to prevent, one level up.


  NOT FIXED BY ME: scripts/axiom-frontier.lean is outside my write set and had uncommitted
  content from ajc-fbc when I measured. The honest current residue is ONE input: UniformBaseDivisor
  C d for d > 0, needing a general-module (divisor-level) base-change comparison,
  open for genus >= 1.'
