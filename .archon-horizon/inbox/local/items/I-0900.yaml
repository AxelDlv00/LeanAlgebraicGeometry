body: 'PARTIAL CORRECTION to I-0876: IsProjectiveWith has TWO producers, not zero.
  The load-bearing half of the claim survives, but "ZERO producers / every declaration
  takes it as a hypothesis" is false as written


  MEASURED by fresh-context review, declaration reading plus one kernel probe (EXIT=0,
  axiom-clean [propext, Classical.choice, Quot.sound]).


  I-0876 states: "Every one of its ~12 declarations TAKES it as a hypothesis (isProper,
  locallyOfFiniteType, isSeparated, universallyClosed, of_iso, comp_isClosedImmersion,
  baseChange, fiber, compactSpace, quasiSeparatedSpace, finite_sections_chart). Nothing
  produces it".


  TWO OF THOSE ELEVEN ARE PRODUCERS, and a twelfth declaration the list omits is a
  ground producer.


  1. ProjectiveMorphism.lean:189 isProjectiveWith_over (d : Nat) (S : Scheme) : (P(Fin
  (d+1); S) --> S).IsProjectiveWith (twistingSheaf (Fin (d+1)) S 1). A GROUND producer,
  no hypothesis of the predicate anywhere in it, kernel-verified axiom-clean. Its
  own docstring says "the canonical inhabitant ... shows the predicate is non-vacuous".
  I-0876 does not mention it at all.


  2. of_iso (:116) and comp_isClosedImmersion (:125) and baseChange (:145) and fiber
  (SerreFiniteness.lean:105) CONCLUDE IsProjectiveWith. They take one as input, so
  they are transfer lemmas, not ground producers -- but describing them as "takes
  it as a hypothesis" alongside isProper mis-sorts them: chained onto :189 they produce.


  WHAT THIS DOES NOT CHANGE, and it is the part that matters. The composite still
  gives nothing for the AJC CURVE: :189 produces on projective space itself, and the
  transfer lemmas need a CLOSED IMMERSION of C into P^n over the base, which is exactly
  the missing "smooth proper curve is projective". So I-0876s operative conclusion
  -- D2prime needs projectivity of C as a real input, the finite-map-to-P1 chain does
  not supply it, take option (a)/(b)/(c) -- STANDS.


  WHY FILE IT ANYWAY. The wrong half is the reusable half: a later lane reading "ZERO
  producers, nothing produces it" will price curve projectivity as needing the predicate
  built from nothing, when in fact the predicate is inhabited and rooted and the ONLY
  missing brick is the closed immersion C -> P^n. That is a narrower and cheaper obligation
  than "no producers" advertises, and it is a different search.


  ACTION. Amend I-0876 to: "IsProjectiveWith is inhabited (isProjectiveWith_over,
  :189, axiom-clean) and has four transfer lemmas that conclude it; what is missing
  for the AJC curve is precisely a closed immersion C -> P^n_k over k, i.e. curve
  projectivity."'
