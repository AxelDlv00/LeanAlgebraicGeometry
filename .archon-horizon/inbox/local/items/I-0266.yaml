body: "DAT-G0 β residual: PARTIAL — DG-G0.δ (base-field directed system) LANDED; the\
  \ analytic residual Pic0PreservesFilteredBaseColimit remains PINNED (NOT discharged).\
  \ Commit ad6cd964f492b6bec484d43575696d5da2b04fb9.\n\n=== WHAT LANDED (new AlgebraicJacobian/Picard/PicRepColimitResidual.lean,\
  \ +root import line) ===\nDG-G0.δ, the base-field directed system K_s = colim k''\
  \ that the β1 residual quantifies over. Built green (8703 jobs), zero sorries; keystones\
  \ axiom-clean [propext, Classical.choice, Quot.sound] (verified iSup_finSubext_eq_top,\
  \ coe_iSup_finSubext). Native IntermediateField k-algebra/scalar-tower instances\
  \ only (I-0255 tower diamond honoured). Root committed as HEAD-blob + only my import\
  \ line (protocol §4; a sibling's uncommitted PicEtCrossBaseGraph line was NOT swept).\n\
  \nKEYSTONES (VERBATIM, namespace AlgebraicGeometry.DatG0; vars {k K : Type u} [Field\
  \ k] [Field K] [Algebra k K]):\n - abbrev FinSubext (k K) : Type u := {L : IntermediateField\
  \ k K // FiniteDimensional k L}   -- the k'' index\n - theorem directed_finSubext\
  \ : Directed (· ≤ ·) (fun L : FinSubext k K => (L.1 : IntermediateField k K))\n\
  \ - instance instIsDirectedFinSubext [Algebra.IsAlgebraic k K] : IsDirected (FinSubext\
  \ k K) (· ≤ ·)\n - instance instIsCofilteredFinSubextOp [Algebra.IsAlgebraic k K]\
  \ : IsCofiltered (FinSubext k K)ᵒᵖ   -- EXACTLY the [IsCofiltered J] shape of Pic0PreservesFilteredBaseColimit's\
  \ diagram binder\n - theorem iSup_finSubext_eq_top [Algebra.IsAlgebraic k K] : ⨆\
  \ L : FinSubext k K, (L.1 : IntermediateField k K) = ⊤   -- K = colim k'' (lattice\
  \ level)\n - theorem coe_iSup_finSubext [Algebra.IsAlgebraic k K] : (↑(⨆ L, L.1)\
  \ : Set K) = ⋃ L, (L.1 : Set K)   -- colimit-is-union (coe_iSup_of_directed): every\
  \ x∈K lives at a finite stage\n - instance isSeparable_finSubext [Algebra.IsSeparable\
  \ k K] (L : FinSubext k K) : Algebra.IsSeparable k L.1   -- with isSeparable_iSup:\
  \ the finite *separable* subextensions of K_s/k\nFor K = K_s a separable closure,\
  \ [Algebra.IsSeparable k K_s] + [Algebra.IsAlgebraic k K_s] both hold, so these\
  \ ARE the finite separable subextensions.\n\n=== IS Pic0PreservesFilteredBaseColimit\
  \ DISCHARGED? NO. ===\nThe β1 residual is UNCHANGED from I-0263: still the named\
  \ Prop in Picard/PicRepColimitCompat.lean (commit c9df8d479), still M–L, still divRep-free,\
  \ still sorry-free-pinned. This session did NOT touch the analytic core; it landed\
  \ the δ substrate the residual quantifies over. The β1 REDUCTION (pic0ThetaType\
  \ collapse to the fixed base) remains as landed in c9df8d479 (pic0TypeFunctor_baseChange_iso,\
  \ preservesColimit_pic0TypeFunctor_baseChange).\n\n=== PRECISE REMAINDER (pinned,\
  \ for the next lane) ===\nTwo bricks remain between the δ system and β1-at-K_s,\
  \ then the mountain:\n\n(1) δ-scheme / CommRingCat colimit (spec-datg0 §3 δ target\
  \ \"show colim D ≅ K_s\", + α spreading): build D : FinSubext k K ⥤ CommRingCat\
  \ via IntermediateField.inclusion (inclusion_self/inclusion_inclusion give functoriality),\
  \ the inclusion cocone to CommRingCat.of K, prove IsColimit — route: forget CommRingCat\
  \ preserves filtered colimits (Ring/FilteredColimits.lean:363 forget_preservesFilteredColimits)\
  \ + Types.FilteredColimit.isColimitOf' (Limits/Types/Filtered.lean:90) with jointly-surjective\
  \ = coe_iSup_finSubext and separation from injective directed inclusions; then Spec\
  \ (right adjoint Γ⊣Spec) sends it to Spec K = cofiltered lim of Spec k'' in Over\
  \ (Spec k), discharging IsAffineHom (Spec of field homs) / CompactSpace (one-point)\
  \ / QuasiSeparatedSpace. Produces the concrete S : (FinSubext k K)ᵒᵖ ⥤ Over (Spec\
  \ k) with lim S = S_{K_s} that plugs into Pic0PreservesFilteredBaseColimit. Sized\
  \ S–M, divRep-free.\n\n(2) THE MOUNTAIN — prove Pic0PreservesFilteredBaseColimit\
  \ C (M–L, the genuine theorem): pic0TypeFunctor C (FIXED base k) is locally of finite\
  \ presentation as a functor; on affine tests overSpec k A this is PicEtAff C A commuting\
  \ with filtered colimits of the test algebra A, riding finite presentation of the\
  \ proper smooth curve C/k. Named avatars (mathlib v4.31.0, at .lake-packages/mathlib):\n\
  \  · CommRingCat.preservesColimit_coyoneda_of_finitePresentation (Algebra/Category/Ring/FinitePresentation.lean:144)\n\
  \  · RingHom.EssFiniteType.exists_eq_comp_ι_app_of_isColimit (:81 existence) + exists_comp_map_eq_of_isColimit\
  \ (:45 uniqueness)\n  · Scheme.exists_π_app_comp_eq_of_locallyOfFinitePresentation\
  \ (AffineTransitionLimit.lean:1177) + exists_hom_hom_comp_eq_comp_of_locallyOfFiniteType\
  \ (:686) + exists_isAffineOpen_preimage_eq (:1058) / exists_isOpenCover_and_isAffine\
  \ (:1078)\nThe ride (C/k finitely presented) is the input to grep for on C.hom /\
  \ relCurve. divRep-free, intrinsic to C/k. NOT a one-session proof.\n\nNet: DAT-G0\
  \ feasibility moves from pinned toward landed — δ substrate now green in-tree; the\
  \ mountain (1 theorem) precisely pinned with avatars."
