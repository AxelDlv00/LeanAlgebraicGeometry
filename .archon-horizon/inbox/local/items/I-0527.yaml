body: "A SORRY OPEN FOR MANY SESSIONS MAY BE UNPROVABLE BECAUSE ITS STATEMENT IS WRONG\
  \ — check the binders before sizing a route.\n\nFound 2026-07-28 (run 0067 r1, task\
  \ ajc-pic0av, commit f820eff22), Algebraic-Jacobian-Challenge.\n\nTHE CASE. AlgebraicGeometry.Scheme.PicScheme.degree\
  \ (Picard/IdentityComponent.lean) had been\nopen across many sessions. Successive\
  \ reports — including my own, one round earlier — described\nit as blocked on Quot\
  \ (retained-not-revived), or as 'unconstructed, no route I would stand\nbehind'.\
  \ All of that was beside the point. Its domain is\n\n    (Spec (.of k) ⟶ (PicScheme\
  \ C).left) → ℤ\n\ni.e. an ARBITRARY morphism of schemes, not a morphism OVER Spec\
  \ k. Such a morphism need not be\na section of (PicScheme C).hom — the goal  is\
  \ simply not derivable — so it does\nnot name a k-RATIONAL point, and representability\
  \ says nothing about it. No total function of\nthat type can be built from the Picard\
  \ functor at all; it would have to invent values off the\nsections. The sorry is\
  \ a STATEMENT bug. No amount of degree theory closes it.\n\nHOW IT SURFACED, and\
  \ this is the transferable part: I wrote the INTENDED one-line proof\n(transport\
  \ the point through PicScheme.representable's homEquiv at the trivial test object)\
  \ and\nread the leftover goal. It was not a mathematical subproblem — it was an\
  \ undischargeable\nside condition on the statement's own argument. That is the tell,\
  \ and it costs one minute.\n\nWHAT I DID INSTEAD OF 'FIXING' THE PIN: added PicScheme.degreeOfSection\
  \ on the correct domain\n(sections, with the section proof as an argument), sorry-free\
  \ and total given one named input;\nRETAINED the broken  with its sorry, because\
  \ another declaration (kPoints_iff_kerDegree)\nis pinned against it and silently\
  \ swapping a pinned statement is worse than leaving a labelled\ndefect. Recorded\
  \ the defect in both docstrings. Whoever owns the pin decides.\n\nCONTRAST WITH\
  \ THE ADJACENT FAILURE MODE, since both live on this lane: I-0518 is about a\nstatement\
  \ that is TRUE but too weak (a bare Equiv does not transport finrank). This one\
  \ is about\na statement that cannot be satisfied at all. Both look like 'the proof\
  \ is hard' from the outside\nand both are diagnosed by reading types rather than\
  \ by looking for mathematics.\n\nGENERALISABLE RULE: before estimating a route for\
  \ a long-open obligation, write the intended\nproof and read the leftover goals.\
  \ If a goal is a well-formedness condition on the statement's\nown arguments rather\
  \ than mathematics, stop looking for a route — the statement is the bug. Then\n\
  fix it BESIDE the pinned one and say so, rather than reporting the lane as blocked.\
  \ Cf. I-0442\n(the eight ways a clean #print axioms lies) — same family: the type,\
  \ not the proof, is where the\nclaim actually lives."
