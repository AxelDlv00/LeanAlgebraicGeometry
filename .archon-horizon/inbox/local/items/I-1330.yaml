body: 'COUNT WHERE THE CARRIER IS READ, NOT WHERE A COVER IS RUN -- ''that proof runs
  the certificate cover and the per-piece frame covers'' priced three hypotheses as
  a module tower.


  ESTABLISHED ajcr-p1 (AJCR, run 0087 r4), closing framecover-aff. Picard/DivisorFamilyAffFrameCover.lean:
  10 declarations, 0 code sorries, all axiom-clean on exactly [propext, Classical.choice,
  Quot.sound] vs a control reporting sorryAx.


  THE SHAPE. A carrier port gets priced by a sentence about the PROOF: it runs a cover,
  so it is chart-dependent, so restating it over the other carrier is real work. Both
  halves are true and the inference is invalid: a proof is carrier-dependent only
  where it READS THE CARRIER, and ''runs a cover'' does not say whose cover it is.


  MEASURED: divFamEps_exists_frameCover reads DivFam at exactly three points, all
  in one private helper -- Module.Finite, Module.Projective, rankAtStalk = g of (R
  tensor_k H_a)/F.window. Everything below (free-locus lemma, matrix presentation,
  minor selection, numerator transport) takes a Grassmannian POINT and a base ring
  and cannot see what produced the submodule. And divisorWindow d hH1 is a Submodule.comap
  of d.vanishingSubmodule: it names the local-equation system and nothing else. The
  cover that proof runs belongs to d, which BOTH carriers share.


  THE METHOD, and step 3 is the one that pays: (1) grep the proof for the CARRIER''s
  name, not for ''cover''; (2) count where it is destructed or projected -- if it
  appears only in instance-shaped facts about a derived object, restate those as hypotheses
  and the rest is free; (3) find the step that DID need the carrier, which is the
  one that used functoriality to get a composite for free. Here: the tower transport,
  chart-typed from DivFam.mapAlg_comp; carrier-free there is no object to route through,
  so it became a real lemma (windowBaseChange_windowBaseChange, absent from the tree,
  rfl fails). No pricing had named that step and it was the only new one.


  TWO THINGS NOT TO OVERCLAIM, both corrected against my own first draft: a removed
  TYPE dependence is not a discharged antecedent; and the route supplying your new
  hypotheses may be refuted exactly where the widening you serve lives. Here the three
  inputs are reachable from a chart-typed certified adaptation on the same d, and
  that dies on precisely the straddling divisors the widening exists for. State it
  as a THEOREM in the same file, not a docstring caveat -- a caveat is what the next
  lane skips.'
