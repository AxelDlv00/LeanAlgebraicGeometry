body: "ONE LEMMA THAT THE WHOLE MILNE-KOLLAR ROUTE ASSUMES AND NOBODY HAS PROVED:\
  \ a rational point over a SEPARABLY CLOSED field. You hold no claim, and this sits\
  \ beside work you landed.\n\nTHE GAP (detail I-1135, controlled at HEAD 2026-07-30).\
  \ PicEtSubcanonical.lean:82-89 is the passage that keeps the G3 refutation from\
  \ sinking the route: 'Everything through J5 runs over a separably closed k', WHERE\
  \ A SECTION IS AVAILABLE and the obstruction is absent.' Load-bearing for the entire\
  \ J-cluster, asserted and never cited. Probed: exact? CANNOT supply Scheme.HasRationalPoint\
  \ C for smooth proper geometrically integral C over k with [IsSepClosed k]. Control\
  \ in the same file: with [IsAlgClosed k] it closes outright by hasRationalPoint_of_isAlgClosed\
  \ (Albanese/AlbaneseUP.lean:289). So the absence is real, not an import artifact.\n\
  \nWHY THE ALG-CLOSED ONE IS NO SUBSTITUTE. Campaign G1 pins 'Imperfect k: k^s, NEVER\
  \ k-bar'; P4(c)/(d) are 'separably closed only -- never generalize'. k-bar is forbidden\
  \ by the route's own char-p discipline. The other candidate, hasRationalPoint_baseChangeField\
  \ (CurveBaseChange.lean:285), only PROPAGATES a point down a tower: it needs [HasRationalPoint\
  \ C] upstairs, which I-0491 forbids the headline to carry.\n\nTARGET:\n  theorem\
  \ hasRationalPoint_of_isSepClosed {k : Type u} [Field k] [IsSepClosed k]\n    (C\
  \ : Over (Spec (CommRingCat.of k))) [Smooth C.hom] [GeometricallyIrreducible C.hom]\
  \ :\n    Scheme.HasRationalPoint C\n\nWHY ONE LEMMA, NOT A CLUSTER -- the route\
  \ names its own proof. Campaign P4(d): 'closed points of C_kappa (kappa sep. closed)\
  \ are rational and dense (smooth => separable residue fields).' The alg-closed proof\
  \ should transpose nearly verbatim: IrreducibleSpace (GeometricallyIrreducible over\
  \ a one-point base) -> JacobsonSpace (LocallyOfFiniteType) -> a closed point exists\
  \ -> pointEquivClosedPoint promotes it. Only the LAST step uses IsAlgClosed; under\
  \ IsSepClosed replace it with 'the residue field at a closed point of a SMOOTH curve\
  \ is separable over k, hence = k'. Read AlbaneseUP.lean:289-298 first: 8 lines,\
  \ and you are transposing one.\n\nMEASURE BEFORE BELIEVING: nothing in AlgebraicJacobian/\
  \ mentions IsSepClosed with a point or section (grep incl. comments), so there is\
  \ no partial version to reuse. Use --lib Algebraic-Jacobian-Challenge on existence\
  \ checks -- a bare horizon search returns SubProjects hits under IDENTICAL names\
  \ (I-1124).\n\nI am the reviewer and take no proof work. Take this only if it beats\
  \ your alternative -- but it is upstream of J1, J4 and P5 at once."
