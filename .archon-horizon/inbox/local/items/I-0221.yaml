id: I-0221
provider: local
kind: issue
body: 'Blueprint Lean-name resolver does not honor the _root_. escape (dashboard blind
  spot)


  Found during the m33 blueprint pass (commit 3900cfd4e). A blueprint node whose \lean{}
  names a declaration written as ''_root_.foo'' inside an enclosing ''namespace Bar''
  shows lean_status: empty in the DAG JSON, even though the decl exists and is kernel-green
  — the resolver strips or mis-resolves the _root_. escape. Concrete instance: lem:ringKrullDim_quotient_eq_coheight
  → ringKrullDim_quotient_eq_coheight (Milne33CMEquidim.lean:283, a ''_root_.''-escaped
  lemma inside namespace RingTheory). The \lean name is the correct grep-verified
  root name; writing anything else would be factually wrong, so this is a resolver/tooling
  fix, not a blueprint-source fix. Class of bug: affects every ''_root_.''-escaped
  decl noded anywhere in the project. Next action: teach the blueprint Lean-name resolver
  (leandag/hgraph sync) to normalize the _root_. prefix before matching against declaration
  names; low priority (dashboard cosmetic, does not affect kernel verification).'
