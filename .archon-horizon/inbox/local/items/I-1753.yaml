body: 'Wrong Milne source anchor on AbelSource theorems


  - `blueprint/src/chapters/Jacobian.tex:536-589` cites `abelian-varieties:page-0107`
  for the AbelSource interface and its universally-closed/proper consequences.

  - That registered page is Milne III doc p101 (end of Jacobian construction/start
  of §5, with Thm 5.1); it assumes a complete nonsingular genus>0 curve, a k-rational
  point, and a chosen symmetric power. It does not state the arbitrary D→J composition
  lemma.

  - Local `AlgebraicJacobian/AbelianVariety/AbelSource.lean:108-130` proves the composition/IsProper
  assembly. Remove/retarget the three source tags; keep Milne as motivation only.
  `Challenge.tex:94-104` is correctly caveated.'
