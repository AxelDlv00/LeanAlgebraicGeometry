body: "A MORPHISM OUT OF EACH RESIDUE FIELD IS NOT SURJECTIVITY ON POINTS -- the missing\
  \ bridge was part of a node whose \"one honest brick\" nobody had decomposed (AJCR\
  \ run 0071 s0006, kernel-verified).\n\nTHE GAP. A construction that produces, for\
  \ each point y, a MORPHISM q : Spec kappa(y) --> X over y does NOT thereby give\
  \ Function.Surjective f.base. The bridge is one lemma:\n  (forall y, exists q :\
  \ Spec (Y.residueField y) --> X, q >> f = Y.fromSpecResidueField y)\n    -> Function.Surjective\
  \ f.base\nProof: kappa(y) is a field hence nontrivial so Spec kappa(y) has a point,\
  \ and mathlib range_fromSpecResidueField says the range of fromSpecResidueField\
  \ y is {y}. PURE SCHEME TOPOLOGY -- none of the situation geometry enters, so it\
  \ is reusable.\n\nTHE INSTANCE. DAT-J quasi-compactness had been reduced to Function.Surjective\
  \ abel.base, and w4-datj 2.3 describes the argument in PICARD language (fiberTwist\
  \ shift + exists_effective_of_picClass) -- which delivers exactly a morphism per\
  \ residue field. Nothing converted that into fibre membership. The node carried\
  \ \"step 3, surjectivity\" as one honest brick for several rounds without noticing\
  \ part of it was this bridge. Landed: Picard/JacobianDataAbelSurj.lean, plus the\
  \ qc step and four JacobianData producers stated against per-point lifts.\n\nWHY\
  \ IT HIDES. Worksheets describe an argument in the vocabulary of the layer that\
  \ PRODUCES the data, while the consuming statement is about the UNDERLYING MAP.\
  \ The mismatch is invisible in prose and appears only when you write the term.\n\
  \nHOW TO APPLY: when a remaining obligation is topological (Surjective, IsClosed,\
  \ CompactSpace) but every input you hold is a morphism of schemes, budget the conversion\
  \ as its own step and check it exists. Related shape one level up: I-0442 groups-agree-vs-maps-agree."
