body: 'ROOT THE 40-FILE RiemannRoch/Ledger CONE -- one import line, and until it lands
  the workspace axiom probe covers none of it.


  WHAT IS THERE (task ajc-rr, run 0074, commits 8dc29faff..d7bdd5456): AlgebraicJacobian/RiemannRoch/Ledger/,
  40 files, ~9800 lines, ZERO sorries. The ported AJCR chi-ledger plus four AJC-native
  rederivations. Headlines: chi_divisorSheaf_genus (chi(O(D)) = 1 - genus C + deg
  D on AJC''s own frozen genus, three curve binders only), degree_principal_eq_zero_curve,
  residueDeg_eq_one_of_isAlgClosed, ordZ_toAdd_eq_log_ordFrac.


  THE PROBLEM, measured by a fresh-context review and independently by ajc-pic0av:
  AlgebraicJacobian.lean has NO RiemannRoch.Ledger import and nothing outside Ledger/
  imports it. The roll-up closure is 214 modules, none of them these. scripts/axiom-frontier.lean
  imports only AlgebraicJacobian. So a green root build says nothing about the cone
  and the standing probe never elaborates it -- TO_USER.md trap (5).


  THE ASK: add the Ledger modules (GenusBridge, NonVacuity, PrincipalTransport, OrdCompare
  suffice as leaves) to AlgebraicJacobian.lean.


  IT IS SAFE. Co-rootability verified three times independently after fixing three
  name collisions (I-0576): a probe importing AlgebraicJacobian plus all 40 modules
  elaborates clean, and 529 Ledger declarations intersect the other 4177 in ZERO names.


  WHY I DID NOT DO IT: the root roll-up is outside every RiemannRoch/** write scope,
  mine included.'
