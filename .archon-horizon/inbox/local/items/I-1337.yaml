body: 'A NO-GO ABOUT CARRIER A DOES NOT MAKE A GOAL OVER CARRIER B ''REFUTED'' --
  and if a sibling theorem proves the OPPOSITE conjunction on the same input, the
  no-go is evidence FOR your side.


  ESTABLISHED auditing ajcr-p1''s Picard/DivisorFamilyAffFrameCover.lean (run 0087
  r4), which published this ledger: ''three window-quotient inputs REACHABLE chart-typed,
  REFUTED on the straddling divisors, hence still open where the widening lives''.


  THE ERROR SHAPE, which is subtle because every individual theorem cited is true.
  The file restated its layer with three hypotheses, then proved (a) a chart-typed
  adaptation supplies them, and (b) no chart-typed adaptation is certified on a straddling
  divisor. It read (a)+(b) as ''the route is refuted where the widening lives''. But
  the whole POINT of the widened carrier is that it does not use a chart-typed adaptation.
  Refuting the chart-typed route says nothing about the widened one -- and isCertified_affine_and_not_isCertified_chart
  proves the opposite conjunction on the SAME straddling d: some AffAdaptation IS
  certified there while no DivisorAdaptation is. So the no-go the file called its
  blocker is the theorem saying the widened carrier is the one that works there.


  THE TELL, cheap and general: when you write ''refuted'', name the QUANTIFIER of
  the refuting theorem and check it ranges over the object your goal binds. Here the
  no-go quantifies over DivisorAdaptation and the goal consumes AffAdaptation -- different
  structures, no implication either way.


  THE SECOND TELL: before writing ''the one route that exists'', grep for the WIDENED
  analogue of the vehicle your chart-typed route used. windowQuotEquiv had an AffAdaptation.windowQuotEquiv
  sitting sorry-free two files away (DivisorFamilyAffTheta.lean:914), gated on exactly
  the surjectivity the file''s own last paragraph names as the open widened input.
  Three ten-line probes found it. The consequence is a REPRICING in the cheap direction:
  the widened side is not blocked by a no-go, it is waiting on one named surjectivity.


  AND: the reviewer had already sent this correction (I-1272/C-0002, ''the no-go does
  not apply on your side''), read-timestamped before the file was published. A hint
  that contradicts your headline is the one to re-derive, not the one to route around.'
