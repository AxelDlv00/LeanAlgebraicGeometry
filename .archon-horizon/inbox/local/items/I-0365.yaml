body: "WHERE THE DD-R GATE ACTUALLY BITES: NOT U2, NOT 'the certificate for the universal\
  \ family' -- IT IS L8, LOCAL SURJECTIVITY. Established run 0048 round 5 by a seven-front\
  \ recon with an adversarial refuter per front; the refuter on the 'single gate'\
  \ front overturned the recon on exactly this point, and I re-verified it at source.\n\
  \nTHE OLD FRAMING, which several roadmap rows and worksheets still use: 'the divrep\
  \ tail is\nindependent of the certificate; the certificate only gates U2'. That\
  \ is FALSE, and the reason is\nstructural rather than a failed proof.\n\nWHAT IS\
  \ TRUE.\n * DivFamZar C S pi g is BY DEFINITION a quotient of LOCALLY CERTIFIED\
  \ divisor families\n   (DivisorFamilyZar.lean:224,:235). Certificates are not consumed\
  \ by the tail -- they come with\n   the object.\n * So on the consuming side certificates\
  \ are free, and DivFamZar.exists_certChartCover\n   (DivRepClassifyZarKit.lean:433)\
  \ is a landed THEOREM that produces a certified representative\n   Zariski-locally\
  \ from the vehicle itself. It is unfolded by every keystone of the classifier:\n\
  \   DivRepClassifyZar.lean:128 (exists_isDivRepClassify), :176 (isDivRepClassify_unique),\n\
  \   :230 (exists_overHom_isDivRepClassify), DivRepClassifyZarSep.lean:361 and :363\n\
  \   (eq_of_isDivRepClassify).\n * IsDivRepClassify (DivRepClassifyZar.lean:90) universally\
  \ quantifies over\n   (G : CertifiedDivisorFamily C T pi g) in its body at :95-97\
  \ -- a hypothesis, so scarcity of\n   certificates makes the predicate EASIER, not\
  \ harder.\n\nTHE CONSEQUENCE, and it is the campaign's real shape. The no-go (DivSchemeCertZarC1.lean:30-31,\n\
  :131) says DivFamZar is BLIND to connected divisors meeting both pinned fibres.\
  \ So divFunctor\nC pi g is a PROPER SUBFUNCTOR of 'degree-g relative divisors'.\
  \ Representing it is not the problem\n-- the whole L9-L13 tail does that honestly,\
  \ over a section variable, and round 5 nearly finished\nit. The problem is that\
  \ a representable but too-small divisor functor cannot cover Pic^0: the\nAbel map\
  \ out of it is not Zariski-locally surjective, because the classes whose only witnesses\n\
  are the invisible divisors are not hit. That is L8, the\nPresheaf.IsLocallySurjective\
  \ (Sigma.desc f) input of pic0RepresentableByOfCharts\n(Pic0SigmaSheaf.lean:165),\
  \ roadmap dat-b B-6.\n\nHOW TO APPLY.\n 1. Stop describing U2 / the affine package\
  \ as 'the gate'. They are tail work and they are nearly\n    done. The gate is L8.\n\
  \ 2. Repairs R1 (twist by Aut(P^1)) and R2 (generalise FinCoverData's piece type)\
  \ are correctly\n    understood as WIDENING DivFamZar until it sees enough divisors\
  \ for L8 to hold. Judge any\n    proposed repair by that criterion, not by whether\
  \ it makes a certificate easier to prove.\n 3. Anyone proving L8 must check which\
  \ functor the surjectivity is stated against. Local\n    surjectivity onto Pic^0\
  \ from a subfunctor that misses classes is FALSE, not merely unproved,\n    and\
  \ no amount of work on the affine package changes it.\n\nSee also the roadmap rows\
  \ AJCR.w4-rep.datum.dat-b and ...ddr.certificate.cert-relocalize, and\ninformal/w4-rep-critical-path.md\
  \ section 7."
