body: 'TWO CITATION MISSES IN Pic0ChartHonestAff.lean, one of them the load-bearing
  refutation the header rests its "not approached here" caveat on.


  (1) abelDivAff''_overSpec IS ADVERTISED AND DOES NOT EXIST. The Main declarations
  list (:66-67) says "AlgebraicGeometry.abelDivAff''_overSpec -- on an affine test
  the vehicle-level widened Abel transformation is the affine one", and :56 prices
  the whole port on it ("Every widened ingredient existed except the collapse abelDivAff''_overSpec").
  grep across the project: the only two occurrences are those two docstring lines.
  The file has FOUR declarations, and this is not one of them. What was actually landed
  is the picEtAffineEquiv-level collapse, i.e. the twin of picEtAffineEquiv_abelDiv
  (DivSchemeAbel.lean:236, verified correct), NOT the twin of abelDiv_overSpec (DivSchemeAbel.lean:245,
  verified correct) which is the abelDivAff'' = abelDivAff form. Either drop the bullet
  or prove it -- as it stands the header names a declaration count of 5 against a
  file of 4.


  (2) PicEtAff.unit_surjective_of_section IS NOT IN THIS FILE''S IMPORT CLOSURE. Cited
  at :46 as "Picard/EffectivityClose.lean:141" -- the file and line are correct (theorem
  is at :141, in section `close`, so its full name is AlgebraicGeometry.PicEtAff.unit_surjective_of_section).
  But EffectivityClose is NOT among the 441 modules Pic0ChartHonestAff transitively
  imports (computed by walking `import AlgebraicJacobian.*` from the file). So the
  citation is grep-true and #check-false from where it is written. This is the exact
  mechanism memory `cited-names-need-check-not-grep` records. It matters more than
  a normal miss because that lemma is the whole support for the header''s claim that
  absolute honesty is "*refuted* in this tree" -- a reader cannot follow it from this
  file.


  Line numbers I DID verify as correct: Pic0ChartPlusFibreProducer.lean:316 (isOpen_chartLocus_of_isPlusHonest),
  :200 (IsPlusHonest), :275 (abelDiv_isPlusHonest, at :275 exactly), DivSchemeAbel.lean:236
  and :245, DivisorFamilyAffAbel.lean:266 (chartValueAff is at :287; :266 is inside
  the hdegAff discussion, so this one is OFF -- the "chartValueAff = abelDivAff''
  . Sigma . (theta^m)^-1" claim points at the wrong line), DivisorFamilyAffAbel.lean:327
  (degAt_abelDivAff''_toAff is at :362, so also OFF), Curve/MapToP1.lean:108 (exists_isFinite_toP1
  is at :108 exactly, and it DOES produce hpi -- that claim holds), DivisorFamilyAffClassDegree.lean:363-366
  (was the `have` at HEAD~; now p1''s named theorem sits there).'
