body: '**papaioannou-algebraic-rr: pages 0003–0007 transcribed**


  Faithful per-page LaTeX written from AI vision on the 300-DPI page images (no OCR).
  All five files are self-contained, compilable `\documentclass{article}` documents
  (verified: each compiles cleanly with pdflatex) using a small-caps theorem style
  matching the source. \source anchor for all pages: `papaioannou-algebraic-rr` (Papaioannou,
  *An algebraic approach to the Riemann-Roch theorem…*), pages 3–7.


  Files written:

  - `references/papaioannou-algebraic-rr/tex/page-0003.tex` — end of the valuation-ring
  lemma/claim proof (parts (a)(b)(c), ref. Theorem 1.1(b)); Definition 1.3 (place
  = maximal ideal of a valuation ring, parameter, place set **P**_F); Definition 1.4
  (valuation v: F* ↠ Z, (a) v|_{K*}≡0, (b) triangle inequality, v(0)=∞).

  - `references/papaioannou-algebraic-rr/tex/page-0004.tex` — Theorem 1.4 (strong
  triangle equality) + proof; construction of v_P; exact sequence 0→O_P^×→F*→Z→0;
  category equivalence of valuations/rings/places; degree of a place = [F_P:K]; Theorem
  1.5 (deg P ≤ [F:K(x)] < ∞), proof begins (continues p.5, no QED on this page).

  - `references/papaioannou-algebraic-rr/tex/page-0005.tex` — end of Theorem 1.5 proof;
  Definition 1.5 (zeroes/poles of order m); Theorem 1.6 (place dominating a proper
  ideal) + full Zorn/valuation-ring proof; Corollary 1.7 (transcendental z has a zero
  and a pole, **P**_F ≠ ∅); Corollary 1.8 (field of constants is finite algebraic
  over K).

  - `references/papaioannou-algebraic-rr/tex/page-0006.tex` — §1.2 Weak Approximation
  Theorem: Theorem 1.9 (WAT), Corollary 1.10, Theorem 1.11, Corollary 1.12; §1.3 Divisors:
  Definition 1.6 (Div(F) free abelian group, D = Σ n_P P, support).

  - `references/papaioannou-algebraic-rr/tex/page-0007.tex` — v_P: Div(F)→Z, partial
  order ≤, effective divisors, deg(D)=Σ v_P(D)deg(P) homomorphism; Definition 1.7
  (zero/pole/principal divisor); Definition 1.8 (Princ(F), Class(F)=Div(F)/Princ(F),
  linear equivalence); Definition 1.9 (L(A)={x∈F*:(x)≥−D}∪{0}); Definition 1.10 (genus
  g = sup{deg D − dim D + 1}).


  Fidelity notes — source typos transcribed as printed (NOT corrected):

  - p.3: "Dedekind domain are assumed" (sic).

  - p.4: Theorem 1.4 proof prints "…> min{…} > v(x)" (first relation `>` where `≥`
  is expected) — kept as printed; also x+y=t^n(u''+t^{m-n}u'''')=t^n z and z=t^k u''''''
  primes kept verbatim.

  - p.5: "this contradicts are assumption"; Theorem 1.6 statement "there exists a
  place P_F" and proof prints "aS ≠ O" and "aO[z]=O[z^{-1}]" (sic); "it will alow
  us".

  - p.6: "P_1,…,P_r be" set with no space (P_r​be), "[F:K(x_i)]" with subscript i,
  "a contradiction to ." (dangling ref).

  - p.7: "N is"→printed "Nis" (no space); "IN what follows, we will he assumption
  that K is algebraically closed will now imply…" (garbled + plain K, sic); Definition
  1.9 prints **L(A)** (not L(D)) and "J is a finite subset of Div(F)"; deg-sum subscript
  printed lowercase "p ∈ **P**_F".


  No page was illegible; nothing left for a follow-up call (full 3–7 range done).'
