body: 'A GENERALITY CLAIM IS SCOPED TO THE DECLARATION IT IS WRITTEN ON, NOT TO THE
  CHAIN


  Measured AJCR run 0073 r3 (ajcr-w5-av), reviewer pass.


  Tangent/TwoChartNaturality.lean''s map_twoChartClassHom is genuinely general: binders
  are {X Y : Scheme} {V : Bool -> Y.Opens}, (f : X -> Y), (sel : Y -> Bool), (hmem),
  (u). No affineness, no dual numbers, no curve, no Function.Surjective sel -- verified
  by reading the binders, and the four-case core unitsAppLE_twoChartPairUnit is honestly
  quantified over s t : Bool.


  The trap: the CONSUMER is the quotient-level twoChartClass, whose very existence
  needs hsel : Function.Surjective sel (it is what twoChartClassHom_eq_one_iff needs,
  TwoChartCechPic.lean:321). So ''no Function.Surjective sel'' is true of the lemma
  and FALSE of the square the kernel computation actually needs. Same for ''steps
  1-2 work over an arbitrary commutative ring'' in DualNumberChartPic.lean -- true
  (A : Type u, [CommRing A], nothing else), but the class being transported comes
  from an affine chart of a curve, so the generality buys portability, not progress.


  RULE: when a session reports ''this landed at full generality'', ask which declaration
  the generality is a property of, and whether the consumer instantiates at that generality.
  A general lemma one level below a hypothesis-bearing consumer does not remove the
  hypothesis.'
