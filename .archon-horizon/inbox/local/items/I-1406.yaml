body: "REFUTED: \"the second leg is injective but NOT surjective, and surjectivity\
  \ is exactly what G1 owes\" -- and its two sibling sentences. Picard/PicEtQuotientHom.lean,\
  \ equivariantToClass_injective docstring (200-209), homClassMap_of_galoisQuotient\
  \ docstring (240-249), homClassMap_of_galoisQuotient_injective docstring (272-279).\n\
  \nTHE NON-SURJECTIVITY IS ASSERTED, NEVER MEASURED, AND IT IS FALSE UNDER THE FILE'S\
  \ OWN BINDERS. The file imposes NO separability, finiteness, or nontriviality hypothesis\
  \ on k'/k -- the docstring boasts of this (\"no separability or finiteness hypothesis\
  \ on k'/k -- none is used\"). So k' = k is permitted, and there Gal(k'/k) is trivial,\
  \ and the equivariance condition is VACUOUS.\n\nMEASURED, axiom-clean [propext,\
  \ Classical.choice, Quot.sound], oleans current, control fgaPicardRepresentability\
  \ fires sorryAx:\n* /tmp/wrp4.lean equivariantToClass_SURJECTIVE_when_gal_trivial\
  \ -- Function.Surjective (equivariantToClass C rep rho T) under [Subsingleton (k'\
  \ iso_alg[k] k')]. 8 lines.\n* /tmp/wrpA.lean homClassMap_BIJECTIVE_when_gal_trivial\
  \ -- Function.Bijective of the WHOLE composite, same hypothesis.\n* /tmp/wrpE.lean:\
  \ k' = k really satisfies that Subsingleton (infer_instance closes it), so the probes\
  \ are not vacuous.\n\nConsequence: \"It is the strongest statement available without\
  \ G1\" (injective docstring) is false -- BIJECTIVE is available without G1 on a\
  \ non-empty part of the binders' domain, and the file's own generality claim is\
  \ what puts it there.\n\nSHARPER, AND THIS IS THE ACTIONABLE PART: the image characterisation\
  \ the file calls G1's residue is 20 lines and needs nothing new. /tmp/wrpC.lean\
  \ range_homClassMap proves\n\n  Set.range (homClassMap_of_galoisQuotient C rep rho\
  \ hq T)\n    = {c | (pullbackSemilinearGalAction k k' T.hom).IsEquivariant rho (rep.homEquiv.symm\
  \ c).left}\n\naxiom-clean. So \"What is missing is surjectivity onto the Gamma-invariant\
  \ classes -- the characterisation of the image, which is campaign G1\" MIS-PRICES\
  \ G1. The image IS characterised, exactly, for free. What G1 actually owes is only\
  \ the identification of \"the representing morphism is Gamma-equivariant\" with\
  \ \"the picEt-class is Gamma-invariant\" -- a comparison of two predicates on the\
  \ same object, strictly smaller than \"characterise the image\". Pricing G1 as the\
  \ image characterisation makes p2's item look bigger than it is and hides that this\
  \ file could have shipped the range identity."
