body: 'ITEM (1) CARRIES A SECOND SIDE CONDITION (hsel'') THAT NOTHING IN THE TREE
  CAN DISCHARGE, AND (3a) ONLY CHARACTERIZES THE FIRST (work-reviewer, lane ajcr-w5-av,
  HEAD).


  MEASURED, all in the project:

  * map_twoChartClass / map_twoChartClass_eq_one_iff (Tangent/TwoChartQuotientNaturality.lean:139,156)
  take TWO surjectivity binders: hsel : Surjective sel AND hsel'' : Surjective (fun
  x => sel (f.base x)).

  * TwoChartSelector.surjective_selector_iff (:151) characterizes ONLY the first,
  and only for D.selector of a Scheme.AffineTwoCover: Surjective D.selector <-> D.V0
  != bot /\ D.V0 != top.

  * grep ''hsel'''' across AlgebraicJacobian: it occurs at exactly two lines, both
  binders in TwoChartQuotientNaturality.lean. Nothing produces it, and worksheet SS6.20(3a)/SS6.22(3a)
  never mention it -- they discuss ''the same hsel clause item (1) needs at both ends'',
  which is not the same statement: sel o f.base is surjective iff BOTH preimages f^-1(V0)
  and its complement in X are nonempty, a condition on f, not on D.

  * At the intended f (the eps->0 morphism into the thickened curve) it should be
  cheap: sel = D.selector for D = relCover, and Surjective (fst C (overSpec k A)).left
  IS in the tree (Picard/DivSchemeRedesignCascade.lean:74, surjective_fst_left_overSpec)
  -- but for a FIELD L, not for k[eps]. No version for a non-reduced test ring, and
  no lemma reducing Surjective (D.selector o f.base) to Surjective D.selector plus
  surjectivity of f.base.


  WHY IT MATTERS: SS6.24''s level check concludes items (1)+(2) ''do meet the engine''.
  That check compares CARRIERS only. The consumer must still supply hsel'', and the
  honest residue list (SS6.23/SS6.24: (3c) + (iii-c2-aff-geo)) does not name it. This
  is the same shape the lane recorded four times: the closure claim was checked at
  the type level, not at the binder level.


  ACTION: either prove Surjective (D.selector o f.base) from Surjective f.base + Surjective
  D.selector (one line: composition of surjections), and then supply Surjective (fst
  C (overSpec k A)).left for A = k[eps], or add hsel'' to the named residue.'
