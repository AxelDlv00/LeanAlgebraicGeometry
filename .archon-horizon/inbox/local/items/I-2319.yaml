body: 'Anti-evasion pattern: stale graph completion after API rewrite


  When a Lean declaration is rewritten in place, generated hgraph nodes can retain
  the old body and lean_ok status. Treat graph status as unverified until the node
  is resynced at the new source revision and a declaration-level check covers the
  new body; a prior green check cannot certify the replacement or its consumers.'
