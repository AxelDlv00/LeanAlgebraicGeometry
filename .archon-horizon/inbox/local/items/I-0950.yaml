body: "hf's exists_factor AND coverage's hV ARE ONE RANGE CONTAINMENT ASKED TWICE\
  \ — chart-u and dat-b price them as two obligations\n\nMEASURED by ajcr-p1 (run\
  \ 0087), landed as restrictedChartFibre_of_isChartLocusFibre in Picard/Pic0ChartRestrictedFibre.lean\
  \ (commit 2327a0757; sorry-free, lake build EXIT=0 8892 jobs, axiom-clean [propext,\
  \ Classical.choice, Quot.sound] against a control reporting sorryAx). Predicted\
  \ by ajcr-p2 on I-0871 before it was measured.\n\nTHE STATEMENT. IsChartLocusFibre\
  \ plus\n  hr : Set.range (r.base) subset Set.range (V.i.base)\ngives RestrictedChartFibre\
  \ at V. Proof: keep the old datum's W, lift r along V.i with IsOpenImmersion.lift,\
  \ sq by lift_fac, exists_factor by feeding (v >> V.i) and cancelling the mono. TWELVE\
  \ LINES.\n\nTHE POINT. That hr is character-for-character the hV of Pic0ChartAtlasCoupling.liftPointwiseToOpens\
  \ (:133), which ajcr-p2 isolated on the COVERAGE side as 'exactly the difference'\
  \ between unrestricted and restricted coverage. Same containment, opposite sides\
  \ of the seam: the fibre side asks that the chart point's range sit in V, the coverage\
  \ side asks that the coverage witness's range sit in V.\n\nSO THE V-COUPLING IS\
  \ NOT TWO OBLIGATIONS TO RECONCILE. It is one containment that two rows are separately\
  \ carrying, and the board's picture of antecedents 1 and 2 as independent-then-coupled\
  \ overcounts by one. Rows to correct: dat-c.c9-chartlocus.chart-u and dat-b, both\
  \ of which price the hf side and the coverage side apart. AJCR.w4-rep.datum.chart-restrict\
  \ now records it.\n\nWHAT IT DOES NOT DO: closes no gate. rep/huniv/hcov remain\
  \ unproduced, and RestrictedChartFibre still has NO satisfiability witness at any\
  \ V (I-0890).\n\nMETHOD NOTE, worth more than the result. I nearly lost this: my\
  \ own docstring priced the transport as 'needs the preimage r^-1 V pushed forward\
  \ along W.i, real work, buys nothing', and declined to attempt it. A fresh-context\
  \ review refuted both halves (I-0936). The sentence 'the transport is real work'\
  \ was in the file whose entire purpose was to fix somebody else's unaudited pricing."
