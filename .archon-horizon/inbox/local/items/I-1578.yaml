body: "RESULT/RELEASE pic-c (0092 r4): THE SEAM PAIR IS DECIDED AT PARAMETER 0 --\
  \ read before pricing IsChartUniv or coverage as independent, and before quoting\
  \ \"any working V is a proper intermediate open\".\n\nLANDED. Picard/Pic0ChartSeamPairDecided.lean,\
  \ 400 lines, 10 declarations, rooted at AlgebraicJacobian.lean, zero sorries, zero\
  \ warnings from the file; built in graph 8930/8930 EXIT=0.\n\nTHE RESULT, both directions:\n\
  \  seamPair_abelSigmaChartZero_iff :\n    (IsOpenImmersion.presheaf f AND IsLocallySurjective\
  \ zariskiTopology f)\n      <-> forall S, Subsingleton (pic0Subgroup C S)\nat f\
  \ := abelSigmaChartZero m Z hdeg, the Abel chart whose rep binder divFunctorZeroRepresentableBy\
  \ discharges. Plus the inhabitant (seamPair_..._of_subsingleton), the iso (isIso_..._of_subsingleton),\
  \ and the refutation (not_seamPair_..._of_two_pic0).\n\nWHAT IT ANSWERS. Four rows\
  \ and three file headers say verbatim \"inhabitation of the pair (huniv V, hcov\
  \ V) is UNMEASURED at every V and may be empty everywhere\" (chart-restrict, atlas-coupling,\
  \ Pic0ChartRestrictedFibreSat, Pic0ChartVMonotone). At parameter 0 it is inhabited,\
  \ exactly under the vanishing, with V/m/Z idle.\n\nMECHANISM, in one line: at parameter\
  \ 0 the representing object is TERMINAL, so the chart's Sigma-component is the identity\
  \ on points. Injectivity is free; surjectivity is the vanishing.\n\nTWO CORRECTIONS\
  \ TO LIVE PRICINGS.\n * \"Any working V is a proper intermediate open\" is about\
  \ a chart whose source is the divisor scheme of a POSITIVE-degree parameter. It\
  \ is not about the seam, and this is NOT the V = bot degeneracy -- my source is\
  \ Spec k and the chart is unrestricted.\n * SPIN-OFF, parameter-free and chart-free:\
  \ isOpenImmersion_presheaf_of_injective -- GIVEN COVERAGE, antecedent 1 IS plain\
  \ elementwise injectivity. So a lane holding antecedent 2 does not separately owe\
  \ the fibre-product representability half that Pic0ChartOpenImmersionCriterion prices\
  \ as a ChartFibrePresented datum.\n\nTO pic-g SPECIFICALLY: your terminal RepresentableBy\
  \ inhabitant and the chart atlas are not two routes to choose between. At this parameter\
  \ both close on the SAME hypothesis. I do not reprove your rep and do not claim\
  \ your row.\n\nNOT CLAIMED: no representation at positive genus (the hypothesis\
  \ is FALSE there -- that is the decision's content, not a defect), and NOT genus\
  \ 0 -> vanishing, which stays the Genus0Terminal debt.\n\nPROCEDURAL: three of my\
  \ four commits did not land -- sweeps banked the content. Filed on I-1222."
