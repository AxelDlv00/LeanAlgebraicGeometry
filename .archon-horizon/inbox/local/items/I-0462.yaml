id: I-0462
provider: local
kind: issue
body: "TWO SMALLER GROUND FINDINGS ON THE LEAF-A SLICE: a \"headline\" attribution,\
  \ and a ghost graph node\n\nCompanion to I-0461 (which carries the substantive obligation-count\
  \ finding). Both of these are\ncheap to fix.\n\n1. THE HEADLINE DOES NOT BENEFIT,\
  \ AND ONE HEADLINE SENTENCE IMPLIES IT DOES.\n\nVerified: picardJacobianWitnessOfIsAlgClosed\
  \ has ZERO Lean consumers\n(`grep -rn picardJacobianWitnessOfIsAlgClosed AlgebraicJacobian/`\
  \ returns only its own definition\nat Jacobian.lean:527 and three prose mentions).\
  \ The protected chain is unchanged and unaffected:\n\n  Jacobian (Jacobian.lean:572)\
  \ -> jacobianWitness (:556) -> nonempty_jacobianWitness (:548)\n    -> picardJacobianWitness\
  \ (:496) -> hasRationalPoint_of_curve (:300, FALSE)\n\nAll five protected declarations\
  \ in archon-protected.yaml still route through the FALSE leaf, and\n#print axioms\
  \ confirms Jacobian, Jacobian.instIsProper and\nJacobian.smoothOfRelativeDimension_genus\
  \ all carry sorryAx. That is CORRECT -- the protected\nsignatures must not change,\
  \ and the new definition deliberately sits beside them. Most of the\npublished prose\
  \ is careful about this. One sentence is not:\n\n  TO_USER.md:52  \"**The headline\
  \ is wired, and now rests on five stated obligations -- four over\n            \
  \      `k̄`.**\"\n\nRead as a bullet HEADING by a user skimming the notice board,\
  \ this says the headline -- i.e.\nJacobian and its protected instances -- rests\
  \ on four obligations over k-bar. It does not: the\nheadline routes through picardJacobianWitness\
  \ only, and no instantiation of it at an algebraically\nclosed field exists anywhere\
  \ in the tree. The four/five figure belongs to a definition with no\nconsumers.\
  \ (Beyond the count itself being wrong -- see I-0461 -- the ATTRIBUTION is wrong.)\n\
  \nContrast Jacobian.lean:48-50, which is accurate because it names the definition\
  \ rather than \"the\nheadline\": \"picardJacobianWitnessOfIsAlgClosed assembles\
  \ the same witness on the remaining four\nobligations alone. That is the version\
  \ of the headline whose open obligations are all of the\nordinary kind.\" Suggested\
  \ fix for TO_USER.md:52: make the subject the witness, not the headline,\nand say\
  \ explicitly that Jacobian itself still routes through the general witness and the\
  \ false\nleaf. A reader deciding I-0372 should not be left thinking the construction\
  \ already runs\nend-to-end over k-bar at the protected declarations.\n\nWorth stating\
  \ what is NOT overstated, since the session asked adversarially: the \"axiom-clean\"\
  \nclaim for hasRationalPoint_of_curve_of_isAlgClosed is exactly right and holds\
  \ up under the\nproject's own eight-trap catalogue; the \"both witnesses report\
  \ sorryAx identically, so nothing in\nthis file's output distinguishes them\" note\
  \ at scripts/axiom-frontier.lean:77-79 is a genuinely\ngood piece of epistemic hygiene;\
  \ and the blueprint correctly withholds \\leanok from\ndef:picardJacobianWitnessOfIsAlgClosed\
  \ (Jacobian.tex:284-296) while granting it to\nlem:curve_rational_point_algClosed\
  \ (:247-265), which is precisely the right split.\n\n2. GHOST HGRAPH NODE FOR LEAF\
  \ A -- a duplicate with a backticked decl name.\n\nhgraph/nodes/d19eaa0edf99.md\
  \ carries\n\n  decl: AlgebraicGeometry.`hasRationalPoint_of_curve_of_isAlgClosed`\n\
  \  title: AlgebraicGeometry.`hasRationalPoint_of_curve_of_isAlgClosed`\n  lean_status:\
  \ lean_ok\n\nwith an empty body, alongside the REAL node hgraph/nodes/196ef3926e2c.md,\
  \ which has the same\ndeclaration without backticks plus the full docstring and\
  \ source. Both were written by the same\n`sync` in ledger commit 8db779ae0, so the\
  \ graph now has two nodes for leaf A, one of which can\nnever resolve against Lean\
  \ (the backticks are part of the stored name) yet is marked lean_ok.\n\nThis matters\
  \ slightly more than a cosmetic duplicate, given I-0452 and I-0458 in this same\n\
  project: a node whose decl cannot resolve is invisible to `graph get`, `frontier`\
  \ and `ancestors`,\nwhile its lean_ok status still counts toward any \\leanok audit\
  \ that trusts the DAG. It is the\nmirror image of I-0452 (scanner misses a real\
  \ declaration) -- here the graph carries a declaration\nthat does not exist.\n\n\
  The same pattern exists on 12 other nodes (`grep -rn '^decl:.*`' hgraph/nodes/`),\
  \ including\n60948e799d69, 4cbbd64b1045, b7229997f642 and 6db35b22dafa, so the backtick\
  \ leakage is systemic\nrather than specific to this session -- most likely prose\
  \ in a comment or docstring being parsed\nas a decl name. Recording it here rather\
  \ than as a separate item because the leaf-A instance is\nthe one this session created.\n\
  \nTOOLING NOTE for whoever picks this up: in this workspace `horizon inbox list\
  \ --json` and\n`horizon graph -p Algebraic-Jacobian-Challenge stats` both HANG (each\
  \ timed out past 2 min, the\ngraph command after printing only the synchronizer\
  \ digest). Read inbox and roadmap from\n.archon-horizon/inbox/local/items/*.yaml\
  \ and .archon-horizon/roadmap/items/*.yaml instead.\nLedger git, roadmap list, and\
  \ `lake env lean` all work normally."
