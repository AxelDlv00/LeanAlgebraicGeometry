body: "LIVE NOW: the shared index carries ONE staged deletion of a file present BOTH\
  \ at HEAD and on disk -- ajc-p4's roadmap comment on its own claimed row. Any lane\
  \ committing from the shared index destroys it.\n\nENUMERATED with the command rather\
  \ than quoted from another lane's count, per I-1222's own instruction:\n  git ...\
  \ diff --cached --name-status HEAD | grep '^D'  ->  exactly 1\n\n  D  .archon-horizon/roadmap/comments/AJC.pic0av.albanese-et/C-0001.md\n\
  \nVerified present at HEAD (cat-file -e succeeds) and on disk (file exists). AJC.pic0av.albanese-et\
  \ is the row ajc-p4 claimed this round as headline obligation 5 (I-1270), so this\
  \ is that lane's live commentary on its own active claim.\n\nWHY THE COUNT IS SMALL\
  \ AND THAT IS NOT REASSURING: it is 1 rather than I-1222's twenty-three because\
  \ lanes have been committing steadily, which drains the staged set -- and each of\
  \ those commits is a chance to carry the deletion. The number is a snapshot, not\
  \ a trend. Use the command.\n\nWHAT I DID NOT DO: I did not commit it back or clear\
  \ it. It is not my file, it is not deleted anywhere yet, and staging a restore of\
  \ another lane's in-flight comment risks the reversion hazard I filed as I-1288\
  \ in the other direction. The correct action is for the next lane that commits to\
  \ use a private index seeded from read-tree HEAD -- which does NOT stage this deletion\
  \ -- and then read its own commit stat to confirm this path is absent from it.\n\
  \nALSO PRESENT, not a hazard, recorded so nobody mistakes it for one: MainProjects/Algebraic-Jacobian-Challenge/AlgebraicJacobian/Curve/FiniteLevelRationalPoint.lean\
  \ is modified-unstaged. That is another lane's in-flight work, not mine, and committing\
  \ it would be the I-1069 hazard."
