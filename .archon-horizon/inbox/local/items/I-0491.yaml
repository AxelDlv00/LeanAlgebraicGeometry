body: "[persistent] HUMAN DECISION, BINDING (2026-07-28): the Jacobian headline is\
  \ stated over an ARBITRARY field with NO rational-point binder. Branch (2) of I-0372\
  \ — ETALE-SHEAFIFY — is chosen and closed.\n\nTHE RULE, in four clauses. Any session\
  \ touching the Picard representability seam or the Jacobian headline in Algebraic-Jacobian-Challenge\
  \ is bound by these:\n\n 1. hasRationalPoint_of_curve (AlgebraicJacobian/Jacobian.lean)\
  \ is FALSE as stated. It must be DELETED, never proved. No new declaration may consume\
  \ it. If you find a consumer, repair the consumer.\n\n 2. The representability obligation\
  \ is restated for the ETALE-sheafified relative Picard functor, WITHOUT [HasRationalPoint\
  \ C]. instHasPicScheme in its current [HasRationalPoint C] form is not the target\
  \ and must not be presented as progress toward the headline. Expect the new obligation\
  \ to stay open as one named sorry with a docstring saying so; that is the honest\
  \ state, not a defect.\n\n 3. The etale-plus functor already EXISTS and is sorry-free\
  \ in the sibling project Algebraic-Jacobian-Challenge-Rebuild: Picard/PicEtAff.lean,\
  \ Picard/Pic0Functor.lean, Picard/RelPicCoverInjective.lean (verified zero sorries\
  \ 2026-07-28). READ THOSE THREE FILES before writing anything. Port, import, or\
  \ re-derive — do not start from scratch and do not re-derive the Zariski-sheaf story\
  \ that motivated the section.\n\n 4. picardJacobianWitnessOfHasRationalPoint SURVIVES,\
  \ as an explicitly labelled CONDITIONAL milestone (true under a section, strictly\
  \ weaker than the challenge). picardJacobianWitnessOfIsAlgClosed SURVIVES as a genuine\
  \ theorem over k-bar. NEITHER may be presented as the headline, in Lean docstrings,\
  \ in the blueprint, or in a report.\n\nWHY (so nobody reopens it on cost grounds):\
  \ Challenge.lean binds Jacobian C with no rational point and binds a point only\
  \ where Abel-Jacobi needs one. A headline carrying [HasRationalPoint C] answers\
  \ a different question. The build-cost asymmetry between the branches was reported\
  \ honestly by ajc-truth and was explicitly NOT the deciding factor.\n\nUNAFFECTED:\
  \ the Milne-Kollar route stays committed, Quot stays retained-not-revived, nothing\
  \ is deleted beyond the false leaf. Full reasoning: I-0372 (human comment, 2026-07-28)\
  \ and roadmap AJC.picrep.rational-point. Executing task: ajc-etale-pic."
