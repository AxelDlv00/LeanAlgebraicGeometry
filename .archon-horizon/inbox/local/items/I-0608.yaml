id: I-0608
provider: local
kind: issue
body: '62% OF TODAY''S LEDGER COMMITS CARRY NO Archon-* TRAILERS — the CAS commit
  route bypasses the stamping hook, so trailer-based history queries are blind to
  most work.


  Filed by the janitor pass of run 0074 (lane `ajc-rr`) after a fresh-context reviewer
  reported that `ajc-rr`''s ten commits lacked `Archon-Run`/`Archon-Task` while sibling
  lanes'' had them. The report is accurate; the implied diagnosis "a lane error" is
  not.


  ## Result


  Mechanical, not a lane defect. `hooks/prepare-commit-msg` stamps the trailers, and
  git runs that hook **only from `git commit`**. The compare-and-swap route of protocol
  1b — private `GIT_INDEX_FILE`, then `git commit-tree` + `update-ref` — fires no
  hooks, so it cannot be stamped. Lanes that moved to CAS to dodge the shared-index
  phantom-deletion clobber (`I-0568`, `I-0572`) lost provenance as the price. Both
  defences are not currently available at once.


  ## Evidence


  - Last 200 commits: **104 with** an `Archon-Task` trailer, **96 without**. Commits
  dated 2026-07-28: **232 with, 381 without**.

  - Of the last 120 commits, the 75 unstamped ones touch AJCR (59) and AJC (9) — spread
  across lanes in both projects.

  - CLI-made `workspace[NNNN rN] … integrate …` commits are **always** stamped, which
  is why the survivors look like a per-lane property when sorted by recency.

  - The hook itself is correct; nothing is misconfigured.


  ## Impact


  `.claude/skills/project-git/SKILL.md` presents trailers as the reliable index into
  history and recommends `log --format=''%H %(trailers:key=Archon-Session,valueonly)''
  -- <path>` for finding what the previous agent changed. That returns blank for most
  of today''s commits, and a reviewer trusting it concludes a lane produced nothing
  — which happened once today already.


  ## Next action


  Tooling decision, outside a lane''s scope:


  1. Cheapest fix: apply `git interpret-trailers` to the message *before* `commit-tree`
  in the CAS publish path, keeping both defences.

  2. Or run the CAS commit as `GIT_INDEX_FILE=… git commit`, which does fire hooks.

  3. Until then, `project-git` should state that trailer queries are incomplete and
  that **pathspec** (`log -- <project-path>`) is the trustworthy attribution, being
  independent of the commit plumbing.


  Do **not** retro-stamp history: rewriting ledger SHAs while eight runs hold live
  pids on one shared branch is worse than the missing metadata.'
