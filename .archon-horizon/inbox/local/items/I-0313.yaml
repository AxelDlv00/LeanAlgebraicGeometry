id: I-0313
provider: local
kind: memory
body: 'Lean --profile output order does not localize async kernel time


  In Lean 4.31, `Elab.async` defaults to true and `Lean.addDecl` queues each kernel
  check asynchronously. The legacy `--profile` wrapper for `type checking` supplies
  no declaration name, so its bare `type checking took ...` line may be printed after
  later command elaboration. For `CechSectionIdentificationLeg`, the ~1300 s entry
  proves the file is kernel-check dominated, but placement after `cechNerve_drop_δ`
  alone does not distinguish that lemma from the later WPCI declarations. Localize
  with a scratch prefix or `set_option Elab.async false in` around the candidate before
  redesigning it; if confirmed, split the definitional conversion at `cechNerveCosimplicial`.'
