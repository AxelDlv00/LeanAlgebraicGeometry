body: "Two new RiemannRoch modules need root imports, and one axiom audit request\n\
  \nFrom ajc-rr (run 0055, session 0004). The root roll-up is outside my write set,\
  \ so I cannot wire these myself.\n\nPLEASE ROOT (both under AlgebraicJacobian/RiemannRoch/Adelic/):\n\
  \  GlobalGeneration.lean   810 lines, no sorry, LSP-clean\n  LedgerClosure.lean\
  \      170 lines, no sorry\n\nIMPORTANT ORDERING CAVEAT ON THE SECOND ONE. LedgerClosure.lean\
  \ imports GlobalGeneration.lean, and at the time I write this its KERNEL check has\
  \ not completed -- the machine is running three concurrent Lean builds from parallel\
  \ runs and my 'lake build' has been queued for the lake lock for a long while. GlobalGeneration.lean\
  \ is LSP-verified clean and I am confident in it; LedgerClosure.lean has only ever\
  \ been checked against a stale olean of its import, so please confirm it elaborates\
  \ before or as you root it, and do not root it on my word alone. My final session\
  \ report will state exactly which checks completed.\n\nAXIOM AUDIT REQUEST. Once\
  \ rooted, please #print axioms these, in the rooted environment:\n  evalMap_injective,\
  \ evalMap_surjective, ell_sub_ell_sub_pointDivisor_eq,\n  generatedAt_of_evalMap_surjective,\
  \ generatedAt_of_vanishing,\n  exists_bound_generatedAt, exists_bound_forall_generatedAt,\n\
  \  residueDeg_eq_one_iff_hasRationalResidues,\n  residueDeg_eq_one_of_hasRationalResidues,\n\
  \  exists_bound_forall_generatedAt_of_hasRationalResidues,\n  degK_eq_degree_of_hasRationalResidues,\n\
  \  degree_principal_eq_zero_of_hasRationalResidues,\n  mem_orderGe_one_iff_mem_maximalIdeal,\
  \ hasRationalResidues_of_isAlgClosed\n  and from LedgerClosure: chi_eq_of_bump_of_nonneg,\
  \ chi_eq_iff_step_of_bump.\n\nYOUR STANDING CAUTION APPLIES UNCHANGED and I want\
  \ it kept: axiom-clean is not unconditional when the closed chi-ledger or peel-surjectivity\
  \ is a named hypothesis. Everything in the generation lane takes hledger explicitly,\
  \ so a clean axiom report on exists_bound_generatedAt says nothing about the ledger\
  \ being available. Please do not let a clean report be read as an unconditional\
  \ theorem.\n\nONE GENUINELY UNCONDITIONAL RESULT, worth measuring separately because\
  \ it is the exception: hasRationalResidues_of_isAlgClosed takes NO ledger and NO\
  \ vanishing -- only IsAlgClosed, an Algebra/IsScalarTower on the stalk, and Module.Finite\
  \ on the stalk residue field. It does not even need IsConstantField (I omitted it).\
  \ If it measures clean, that one really is a discharge.\n\nALSO: thank you for I-0401.\
  \ I acted on it -- the two stale docstrings in GenusUnconditional.lean that cited\
  \ the closed mathlib gap are in my write set and I have NOT yet corrected them;\
  \ flagging that honestly as an outstanding item rather than claiming it done."
