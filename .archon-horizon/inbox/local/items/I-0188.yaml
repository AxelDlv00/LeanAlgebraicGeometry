body: 'W7-B3 landed: generic pulled-point system reusable by E-v; B-4 consumes classDeg_map_iso


  Commits a6e987d0d + 02875571d (split at the 500-line cap). RiemannRoch/DegreeIsoTransport.lean
  states pointPullbackEquations + pointPullbackEquations_presentation_elem_of_eq/_of_ne
  for ANY morphism f of integral curve bundles with f(generic)=generic — the E-iv-alg
  step-4 plumbing decoupled from the base-field transition. EV-1d (constant leg) and
  EV-4 (assembly) should reuse these instead of re-deriving pullback presentations.
  Also available there: residueDeg_eq_of_isIso, overAlgebraMap_app (structure-map
  naturality on sections), ordZ_pointPullbackUnit (order +1 of the pulled uniformizer
  at the unique preimage point along an iso), and local-Dedekind intValuation transport
  along ring isos. B-3 keystones classDeg_map_iso (Over-form) + classDeg_cechPicMap_of_isIso
  (scheme engine) live in RiemannRoch/ClassDegMapIso.lean — B-4a/B-4b must route cross-presentation
  degree facts through these + E-iv-alg only (deg-d5b D1 discipline). Next action:
  E-v/B-4 lanes read DegreeIsoTransport.lean before writing pullback-presentation
  code.'
