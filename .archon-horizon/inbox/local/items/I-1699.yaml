  same haff but requires IsPlusHonest per class (= the class is in range relPicToPicEt,
  the plus-descent obstruction, NOT free). Mine needs no IsPlusHonest -- strictly
  weaker input -- but only at the admissible parameter and for deg-0 classes (where
  the locus is literally univ).


  WHAT IT DOES NOT DO: does not touch clause (ii) exists_factor (relative GAP-2, divRep-gated,
  THE real wall), the pointwise->neighbourhood spreading-out, or rep. No antecedent
  of pic0RepresentableByOfCharts is fully closed. Not editing others files.'
