body: 'hdeg LANDED — the general colength<->degree identity (MV wall I-0179) falls;
  G-1 keystones now UNCONDITIONAL


  Commit 03019a051. All keystones axiom-clean [propext, Classical.choice, Quot.sound],
  lake build green (8968 jobs, includes sibling-lane working-tree files), zero sorries
  in my files.


  LANDED (the CRT/stalk route, exactly the I-0228 NEXT-LANE brief):

  - RiemannRoch/StalkColength.lean: Scheme.stalkOverAlgebra (K-algebra on stalks,
  house local instance) + Scheme.germAlgHom + scalar tower; span_singleton_eq_maximalIdeal_pow_count
  (local Dedekind: (g) = m^count); finrank_stalkQuot_span_germ — the POINTWISE chart
  dictionary finrank K (O_z/(germ f)) = count p_z (factors (f)) * [k(z):K] (transported
  along quotPowLinearEquiv; multiplicity preserved by localization).

  - Picard/DivisorFamilyStalkEval.lean: piece equations generate the adaptation-free
  stalk ideals (span_germ_eqn_eq_stalkIdeal); stalk evaluations stalkColEval/ovlStalkColEval
  of the colength modules intertwining the equalizer arrows; stalkColEval_glued —
  ON THE EQUALIZER every piece seeing a point reads the same stalk value (the cross-chart
  double counting resolved); pointwise divisor dictionary finrank K (O_z/I_d(z)) =
  coeff_z * resdeg_z.

  - Picard/DivisorFamilyFieldCRT.lean: pieceStalkEval bijective (injective by stalk-locality
  mem_span_singleton_of_forall_germ; surjective by DIMENSION COUNT against the landed
  finrank_colength_eq_sum — honest CRT, no fresh constructions, dodges explicit lifting);
  gluedStalkEval bijective (W(d) = prod over supp of O_z/I_d(z)); DivisorAdaptation.deg_presentationDivisor:
  deg K (div d) = finrank K W(d) for EVERY adaptation, NO hypotheses — adaptation-independence
  of the glued rank is a corollary, not an input (the I-0179 circularity note is dissolved).
  Corollaries: deg_divFamDivisor (deg = n for every certified F : DivFam — the hdeg
  input of divFamFieldEquivOfDegOfSurj, unconditional); IsCertified.deg_presentationDivisor
  / .deg_presentationDivisor_pulledEquations (the exact G-1 fibre seam shape, via
  isCertified_pullback).

  - Picard/DivisorThetaFibreData.lean: hdeg hypothesis REMOVED from both G-1 keystones
  — IsCertified.fibrewise_h1 and IsCertified.thetaGluedEval_surjective are unconditional
  (no consumers existed yet, so no API breakage). Per I-0228 WHAT COLLAPSES: the threaded
  hsurj of RiemannRoch/CarveDegree.lean:112,183,227, Picard/DivisorFamilyEpsMono.lean
  mono lemmas, divisorWindowGr, and the DivSchemeCertificateEngine hfib slots can
  now take hc.fibrewise_h1/hc.thetaGluedEval_surjective directly.


  STALE DOCS (left untouched to avoid a giant rebuild of downstream lanes mid-flight):
  DivisorFamilyField.lean:36-37,147-151 and DivisorFamilyFieldEquiv.lean:44-56 still
  describe hdeg as open — a janitor/doc pass should update them; divFamFieldEquivOfDegOfSurj
  can now be instantiated with hdeg := deg_divFamDivisor, leaving hsurj (backward
  realization) as the only remaining gap of the field dictionary.


  LEAN GOTCHA (memory-worthy): unifying an inline re-indexing lambda (fun p => a <p.1,
  mem_filter...>) against the stored Pi codomain of a def over a Finset.filter subtype
  sends isDefEq into a whnf loop (>1M heartbeats, with or without respectTransparency);
  naming the family as a private def (pieceTarget) makes the same unification instant.'
