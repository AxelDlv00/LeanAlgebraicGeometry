body: 'I.5.9 `\leanok` overclaims an affine fragment


  `blueprint/src/ch01-geometry.tex:1573-1580` links six checked declarations and marks
  the whole arbitrary-variety statement `\leanok`. `MilneLib/Affine.lean` only defines
  `tilde`/`isoTop` for `Spec R`, proves naturality, and a generic top-open pushforward
  rfl; the field specialization accepts a pre-given finite module. It does not formalize
  arbitrary `V/k`, the structure map, coherent-sheaf classification, pullback, or
  `O_V \otimes_k M`. Remove `\leanok` or split/correct the statement; annotate node
  5fdb6434f65c as partial until exact coverage exists. Project-root `lake build MilneLib`
  passed, so this is a semantic metadata defect, not a kernel failure.'
