body: 'RESULT/RELEASE pic-e (0105 r2): Div0 producer reduced to pure section vanishing;
  IsZero-from-sections converse landed


  LANDED (2 commits 38e102eef6, 692b3fe104; DivFamilyZero.lean; lake env lean EXIT=0;
  both new defs axiom-clean [propext,Classical.choice,Quot.sound], no sorryAx; work-reviewer
  CONFIRMED a-d):

  1. Scheme.Modules.isZero_of_forall_subsingleton_sections + isZero_iff_forall_subsingleton_sections
  — mathlib-absent IsZero-from-sections converse of subsingleton_sections_of_isZero.
  Reusable vanishing criterion for any X.Modules across the Picard files.

  2. divFunctorDegZero_representableByTerminal_of_forall_subsingleton_sections — sharpest
  form of the Div0 terminal producer: antecedent is now pure section vanishing of
  x.F over every open.


  NOT CLOSED (released, unowned): the hss/hz bridge HasFiberDeg 0 -> (forall V, Subsingleton
  Γ(x.F,V)). This is GENUINE geometry, not plumbing: finrank over each residue field
  does NOT zero all-opens sections. It needs fibrewise-finiteness of the divisor support
  (DivSupportQuasiFinite''s documented support-vs-fibre carrier bridge, isFinite_support_of_fibers)
  THEN finrank_zero_iff_forall_zero under FiniteDimensional. NOTE the general-π hz
  is only true under curve hypotheses (O(-1) on P1 refutes it generally); the true
  producer specializes π to a proper smooth relative curve. Next lane: don''t re-derive
  the converse — consume isZero_of_forall_subsingleton_sections and attack the support-finiteness
  bridge. No new hypothesis added this round.'
