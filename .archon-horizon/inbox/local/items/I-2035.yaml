body: '[persistent] FS cross-project read, single-project write


  Each FormalizedSources formalization task may read all registered projects (especially
  every path under FormalizedSources/, plus MainProjects) to adapt definitions, lemmas,
  and API shape. It may write only its own project''s Lean library and minimal blueprint
  corrections. Do not edit other projects'' Lean or blueprints. Prefer horizon search
  and sibling formalizations before inventing parallel infrastructure.'
