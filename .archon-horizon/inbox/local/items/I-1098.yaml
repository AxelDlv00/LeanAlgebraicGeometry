body: 'REFUTED, the PRICING not the RESIDUE: "the pinned-pair covering R2 deletes"
  is NOT what the widened degree ledger is missing -- the step it names is the one
  the widened structure supplies as a FIELD.


  SITE: Picard/DivisorFamilyAffAbel.lean:199-210 and :251-258 (the hdegAff docstrings),
  ajcr-p3 run 0089 r3. MEASURED by work-reviewer; lake build AlgebraicJacobian.Picard.DivisorFamilyAffAbel
  EXIT=0 8958 jobs first, so probes ran on current oleans.


  CLAIM: "the degree half of that chain (DivisorAdaptation.deg_presentationDivisor_eq_finrank_glued)
  consumes relCover_sup together with cover0/cover1 -- the pinned-pair structure R2
  removes", hence "the transcription is not free, because the chart-typed proof spends
  the two-chart covering".


  WHAT THE PROOF DOES (DivisorFamilyFieldDegree.lean:354-360): the relCover_sup +
  cover0 + cover1 block is three lines inside `hinner` and its ENTIRE output is `obtain
  <j0,hj0> : exists j : A.index, p.1 in A.pieces j` -- "every point lies in some piece".
  That is verbatim the widened structure FIELD AffCoverData.cover (DivisorFamilyAffCover.lean:154),
  already extracted as AffCoverData.exists_mem_pieces (:166, #check confirmed in closure),
  whose own docstring says: "Under FinCoverData this came from relCover_sup together
  with the two partitions of unity; here it is exactly the joint covering field --
  obligation I-0492 4(ii) discharged in one line". On the widened side that step gets
  CHEAPER, not harder. The file has the cost direction backwards at the one step it
  names.


  WHAT THE RESIDUE IS (the file gets this half right): AffAdaptation.{finrank_glued_eq_sum_of_separated,
  subsingleton_ovlColength_of_sep, finrank_colength_eq_sum, coeffAt_eq_zero_of_isUnit_germ}
  all #check as Unknown constant. But #check on the four CHART-TYPED originals shows
  each is stated purely over A.index / A.pieces / A.eqn / A.colength / A.ovlColength
  / A.Glued -- no m0, m1, h0, h1, partition0/1 or chart in ANY of the four statements.
  AffAdaptation carries all six names.


  CONSEQUENCE: hdegAff is a REAL undischarged obligation (deleting it leaves goal
  `degAt (abelDivAff C n T s) t - n = 0`, ring fails), so nothing is vacuous -- but
  it is priced as blocked-on-a-deleted-structure when it is measured-absent-but-UNOBSTRUCTED.
  Do not open a "recover the pinned pair" front. Port the four lemmas at AffAdaptation
  over abstract A.index, then deg_presentationDivisor_eq_finrank_glued with exists_mem_pieces
  in place of the relCover_sup block.'
