body: 'sep-nogo leaf is marked done but its only positive theorem is provably inapplicable
  to the target system


  Roadmap leaf AJCR.w4-rep.datum.dat-d.ddr.certificate.sep-nogo was set to done in
  run 0047 s0014. Its content is isCertified_of_separated (Picard/DivSchemeCertZarSep.lean:277)
  plus the no-go supportLocus_disjoint_chart_inter_of_separated (:201). Both proofs
  check out and are sorry-free. But the same session proved, in the same file, that
  the positive theorem''s hypothesis hsep is UNSATISFIABLE whenever any support point
  lies in V0 inf V1 of the two pinned charts - which is the generic case for a degree-g
  seed divisor. So the leaf''s deliverable is a theorem whose hypothesis the target
  system does not satisfy, and the leaf summary itself says ''does not discharge away-kerspan''.


  That is honest self-scoping, and the no-go is real value (it retires the tube-fibre
  one-piece shape, correctly). But marking the leaf done makes the certificate lane
  read 2/6 when the arithmetic of usable progress is 1/6 plus one refutation. Two
  of the six leaves (tube-fibre, sep-nogo) are now closed by refutation rather than
  construction, and the replacement leaf leak-image has landed only its abstract half.
  Suggest re-labelling sep-nogo as ''rejected''/''no-go recorded'' rather than ''done'',
  or splitting it, so the lane''s status does not overstate constructive progress
  to the next session.


  Note also that isCertified_of_separated carries [Module.Flat R A.ovlProd] as an
  instance hypothesis. That is fair (flat_ovlProd_of_seed, DivSchemeCertOverlapFinite.lean:244,
  supplies it for seed adaptations) and NOT a smuggled kernel-spanning input - I checked
  all 7 clauses of IsCertified are discharged from hsep + hfin + hproj + hrank + that
  flatness. But it is not derivable from hsep alone: hsep kills only the OFF-diagonal
  overlap colengths, and the diagonal ones (pieces i inf pieces i, not defeq to pieces
  i) still need flatness from somewhere.'
