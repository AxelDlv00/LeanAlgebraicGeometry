body: 'leafB_of_chartwise IS HasRingHomProperty.iff_appLE.mpr, AND ITS HYPOTHESIS
  IS STRICTLY HARDER THAN THE CLASS -- so ''leaf B is ONE obligation, the smooth half
  absorbed'' unfolds a definition and points the next prover at more work than mathlib
  asks. MEASURED by work-reviewer (audit of 27127110a4 / 3c4408f7d6). lake build AlgebraicJacobian
  EXIT=0, 8864 jobs, after two concurrent-write retries; probes lake env lean EXIT=0
  with a sorried control that correctly reports sorryAx.


  (A) BODY. #print AlgebraicGeometry.Scheme.Pic0Et.leafB_of_chartwise gives ''(Scheme.Pic0Et.leafB_iff_appLE
  C).mpr hchart''; #print on leafB_iff_appLE gives ''HasRingHomProperty.iff_appLE''.
  The docstring names RingHom.IsStandardSmoothOfRelativeDimension.isStandardSmooth
  as the mechanism (''at chart level the graded condition implies the ungraded one,
  so pinning the numeral supplies smoothness with it''). That lemma is invoked by
  NO declaration in the file. Smoothness is absent from the hypothesis because iff_appLE''s
  RHS is the class unfolded, not because absorption was proved. Section 2''s own preamble
  is honest (''Both statements here are mathlib''s, instantiated''); section 2b then
  re-presents the same iff as a discharge-shaped finding.


  (B) WRONG DIRECTION OF STRENGTH. #print AlgebraicGeometry.SmoothOfRelativeDimension:
  the class field is ''forall x : X, EXISTS U, V affine with the chart condition''.
  leafB_of_chartwise demands it on EVERY chart pair (forall U, forall V, forall e).
  Probe leafB_from_pointwise closes leaf B from the pointwise exists-form by the anonymous
  constructor alone. That is the easier antecedent, and it is the one a homogeneity/cover
  route produces -- SmoothOfRelativeDimension IS IsLocalAtSource for zariskiPrecoverage
  (infer_instance EXIT=0), which is the route section 3 declares empty.


  NEXT ACTION. Either delete section 2b''s ''one obligation not two'' framing, or
  replace leafB_of_chartwise with the pointwise/cover form and state plainly that
  iff_appLE is a definitional unfolding. The framing is already copied into Jacobian.lean:436-449
  and Pic0EtTangentSpace.lean:365-370, so a retraction has three sites.


  SOUND, do not over-correct: smooth_of_leafB / geometricallyReduced_of_leafB are
  real (4 implies 2, correct direction, non-vacuous; SmoothOfRelativeDimension.geometricallyReduced
  exists at Curve/GeometricallyReduced.lean:159; Pic0Et.lean''s cone is 196 modules
  and excludes it, root cone 311 includes it).'
