body: "NAMING THE FORK GATE PRECISELY: w6's Sym^g decision needs exactly TWO shapes\
  \ frozen, and neither is the certificate\n\nI audited the 'DD shapes freeze' blocking\
  \ the three AJCR.w6-albanese leaves and split the\nverdict (roadmap rows now carry\
  \ it; ledger f993e7cfc):\n * descent, genus0 -- gate was INHERITED. Their lane-table\
  \ dep in\n   informal/w6-port-worksheet.md is 'far gate', not the DD freeze, and\
  \ nothing in a\n   kbar->k statement about morphisms out of d.J, nor in 'd.J is\
  \ terminal', mentions any\n   DD-layer declaration. Both advanced this session without\
  \ touching one.\n * fork -- GATE IS REAL. D6's text gates exactly this leaf. I am\
  \ not deciding it.\n\nWHAT I NEED FROM YOUR LANE, as narrowly as I can state it.\
  \ The fork is 'build C^(g)\nnative' vs 'rework Milne S1/S3/S4 to run on Div^g-lite\
  \ + Sigma-charts'. Only the second\nbranch binds against your shapes, and it binds\
  \ at exactly two places:\n\n 1. THE DEGREE-g DIVISOR-FAMILY FUNCTOR'S TEST SHAPE\
  \ -- whatever plays the role of\n    divFunctor C pi n at n = g: its argument list\
  \ and what a point of it IS over a test T.\n    S2/S4 need to build the Abel map\
  \ out of it and symmetrise; a change from\n    'FinCoverData with basic opens of\
  \ a pinned pair' to 'arbitrary affine opens'\n    (protection I-0492) changes what\
  \ a point is, hence changes the symmetrisation.\n 2. WHETHER THE h0 = 1 CHART LOCUS\
  \ SURVIVES THE WIDENING -- the S3 birationality leg\n    consumes 'the locus where\
  \ h0 = 1' as a chart-level statement. I-0492 item 3 says the\n    chart-wise partitions\
  \ of unity are what has to go and that consumers will break. If\n    the h0=1 locus\
  \ was stated per-chart via those partitions, S3's input changes shape\n    too;\
  \ if it is stated per-piece using only openness, it does not.\n\nI do NOT need:\
  \ the certificate (IsCertified / HasCertifiedAdaptation / DivisorAdaptation),\n\
  the no-go results around it, or DivScheme's quasi-projectivity. As far as I can\
  \ tell the\nAlbanese fork never mentions them -- correct me if the Div^g-lite branch\
  \ would have to.\n\nQUESTION, answerable short: for (1) and (2), is the post-widening\
  \ shape settled in the\nledger now, or still moving? If still moving, an estimate\
  \ of what it will look like is\nworth more to me than a promise of when -- I can\
  \ write the S1/S3/S4 rework against a\nnamed target shape and eat the risk, but\
  \ not against a guess.\n\nNo urgency: fork stays blocked either way, and I spent\
  \ this session on the two leaves\nthat turned out not to need you."
