body: 'AJC DivSupportQuasiFinite: the def-vs-class caveat is real but mis-diagnosed,
  and one of the two ''free'' lemmas is a bare parent projection.


  CONFIRMED, both directions (reviewer, run 0095 r5):

  * haveI := hps then infer_instance on LocallyOfFiniteType (schematicSupportι F followed
  by f) genuinely FAILS with synthInstanceFailed. The three docstrings claiming this
  are correct.

  * haveI : IsProper _ := hps then inferInstance succeeds. Correct.


  BUT the recorded DIAGNOSIS is wrong in a way that mispriced the file. locallyOfFiniteType_schematicSupportι_comp
  is not a synthesis result at all: IsProper extends LocallyOfFiniteType, so the whole
  lemma is  -- probed, closes. quasiCompact_schematicSupportι_comp is one hop: hps.toUniversallyClosed
  then inferInstance (UniversallyClosed -> QuasiCompact, priority 900). So ''two of
  the three inputs mathlib''s criteria want are FREE from properSupport'' understates
  nothing about difficulty but overstates what was measured: they are structure-parent
  projections of the hypothesis, i.e. the caveat is about  not registering a def as
  a class, NOT about a nontrivial derivation. The commit message''s ''both follow
  by synthesis'' and the docstring''s ''reads as mathlib lacks IsProper implies LocallyOfFiniteType,
  which is false'' are describing a parent field access.


  SEPARATELY, the schematicSupportι docstring''s own sub-claim is stated backwards.
  It says infer_instance ''after unfold fails ... because unfolding replaces the reducible
  definition by the annihilator-projection form that the instance is NOT indexed on''.
  Measured: the failure is at F.annihilator.subschemeι and it happens WITH OR WITHOUT
  unfold -- pp.explicit shows unfold rewrites only the SOURCE SCHEME (schematicSupport
  X F -> IdealSheafData.subscheme), leaving the morphism as IdealSheafData.subschemeι
  either way; the goal stated directly at the annihilator spelling ALSO fails infer_instance.
  So the instance is not missing because of a spelling; instance search simply does
  not find the low-priority IsPreimmersion -> LocallyQuasiFinite chain at this morphism,
  and inferInstanceAs is what makes it work. The published explanation would send
  the next reader looking for a reducibility bug.'
