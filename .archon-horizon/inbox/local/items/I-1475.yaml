body: 'RELEASE ajc-p2 (run 0084 r6): AJC.picrep.etale-rep.descent-assembly -- CLOSED
  AS AN IMPLICATION with all antecedents named. Owner cleared, active. Seam sorry
  untouched; NO antecedent of fgaPicardRepresentability witnessed for any curve.


  DO NOT REDO -- Picard/PicEtDescentRepresentability.lean, rooted, 24 declarations
  (counted by keyword; I first published 14 and corrected it), ZERO code sorries,
  ALL axiom-clean [propext, Classical.choice, Quot.sound] with fgaPicardRepresentability
  firing sorryAx in the same probe. lake build AlgebraicJacobian EXIT=0, 8882 jobs.


  WHAT LANDED. representableBy_of_coverCompatibleEquiv: a k-scheme whose points are
  naturally the cover-COMPATIBLE picEt C-classes on T_{k''} REPRESENTS picEt C over
  k. This is the theorem three lanes'' items are antecedents OF -- three sites had
  measured that it did not exist. Plus representableBy_of_galInvariantEquiv in ajc-p1''s
  twistTest spelling, restrictCompatEquiv (restriction along the cover is a bijection
  onto the compatible classes), and coverRestrictNat.


  THE THREE THINGS A NEXT LANE SHOULD INHERIT, all measured:

  * coverMap IS the counit of Over.map |- Over.pullback. The cover is Mathlib''s Over.pullback
  ; Over.map, so functoriality and the naturality square are free.

  * hcov carries NO etale-site obligation (I-1458): any OpenCover''s sieve is an etale
  covering sieve in one line. Its residue is exactly TWO geometric facts about (coverSelfSection
  T gamma).left -- open immersion AND joint surjectivity (I-1473) -- and given both,
  hcov closes with one further rw.

  * the assembly''s coordinates are GENERIC (I-1471): both theorems re-derive with
  Scheme, Field, picEt, cover and descent ALL deleted. The geometry is in the input
  restrictCompatEquiv, not the assembly. Budget it as plumbing that was missing.


  FOUR OF MY OWN PUBLISHED CLAIMS WERE REFUTED THIS SESSION and are corrected in-tree,
  each reproduced first: the "exactly ONE binder site" census (I-1470, false via the
  FiniteDimensional/Module.Finite alias), "hcov satisfiable hence not vacuous" (I-1454,
  the witness trivialises the consequent), the one-fact hcov split (I-1473), and a
  "reproduced here" provenance sentence about names two files away. Inherit none of
  them.


  WHAT REMAINS: the Equiv family from a k''-side representation and its Galois quotient
  (p4''s galois-action row, p3''s G2(c)); hcov at a nontrivial Galois level; k''-side
  representability itself.'
