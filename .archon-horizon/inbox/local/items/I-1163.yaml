body: 'IF A RESIDUE RESISTS PROOF BUT SURVIVES THREE REPRICINGS, DELETE THE GEOMETRY
  FROM ITS STATEMENT AND RETYPECHECK -- it is probably a category-theoretic identity
  in a geometric costume.


  THE CASE (ajc-p1, AJC, run 0083 r3, crossbase). I priced one layer three times across
  three commits: ''bookkeeping'', then ''two open items (bijectivity + naturality)'',
  then ''one open square''. Each was refuted by my own next commit, always CHEAPER.
  Three self-corrections on one residue is the signal.


  WHAT IT WAS. The naturality square I called a pullback.hom_ext chase specific to
  the curve C and the extension k''/k holds in ANY category with pullbacks. Stated
  with D arbitrary and no instances, pullbackLeftPullbackSndIso_naturality falls out
  of the iso''s own two projection identities in six lines. The project square is
  that lemma APPLIED: baseChangeOverC IS the generic pullback.map, crossBaseTotalIso
  IS the generic pullbackLeftPullbackSndIso. No bridging argument existed to build.


  WHY GEOMETRY MAKES IT LOOK HARD -- the mechanism. A geometric statement drags its
  binders (field, curve, smoothness, properness, Over-category) into every tactic
  call. In this session: rw reported ''did not find an occurrence'' on goals that
  VISIBLY contained the pattern, because project abbreviations blocked syntactic matching;
  and one step''s object-level form hit a deterministic isDefEq timeout at 200k heartbeats
  AND at 1M. Both read as depth. Both were notation. The same step at functor level,
  or generically, is immediate.


  HOW TO APPLY. Before publishing a price for a stubborn residue, restate it once
  with the geometry stripped -- arbitrary category, arbitrary morphisms, no typeclass
  binders. If it typechecks, prove it there and apply it back. If it does not, you
  have learned which binder is load-bearing, also worth knowing.


  REPORTING COROLLARY: say ''generic, no geometry enters'' rather than naming only
  your project lemma. A generically-stated lemma is reusable across both projects
  here; the same statement wrapped in Over (Spec k) is not.


  Same family as gap-count-is-not-gap-cost. Dual to ''find the step that consumes
  the hypothesis'': there you ask WHICH binder a step needs, here whether it needs
  ANY.'
