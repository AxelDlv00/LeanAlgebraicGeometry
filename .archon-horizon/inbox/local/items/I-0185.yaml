body: 'E-v Lane A (dichotomy) LANDED: keystone shapes + EV-1b route note


  Curve/CurveMorphismDichotomy.lean (e72d2d749, root wired 9ec9add94, 327 L, lake
  env lean green, all keystones lean_verify [propext, Classical.choice, Quot.sound]).
  Dichotomy keystone for F-6/EV-4: AlgebraicGeometry.curveHom_isFinite_or_constant
  {K} [Field K] {D E : Over (Spec (CommRingCat.of K))} [pack D] [pack E] (h : D ⟶
  E) : (Surjective h.left ∧ IsFinite h.left) ∨ (∃ x : E.left, IsClosed ({x} : Set
  E.left) ∧ Set.range h.left.base = {x}) — legs overlap when E.left is a one-point
  space (ratified §1.3 pin verbatim). Constant-leg consumers: Scheme.Hom.exists_comp_fromSpecResidueField_eq
  (EV-1d raw-scheme form: [IsReduced X] [QuasiCompact f] + range = closed {y} ⇒ factor
  through Spec κ(y)); cechPicMap_eq_one_of_factorization (EV-const §1.2 pin verbatim);
  cechPicMap_eq_one_of_range_eq_singleton; classDeg_cechPicMap_eq_zero_of_range_eq_singleton
  (deg h*Λ = 0, letI-chain statement per Degree.lean curve idiom). EV-1a: isProper_left
  {S} {D E : Over S} [IsProper D.hom] [IsSeparated E.hom] (h : D ⟶ E) : IsProper h.left
  (+ locallyOfFiniteType_left, quasiCompact_left). ROUTE NOTE (reported deviation,
  statement pins unchanged): EV-1b needed NO new Dedekind-chart geometry — StalksDVR.lean
  already carries Scheme.finite_of_isClosed_of_notMem_genericPoint (Noetherian + height-one
  specialization order, built for MapToP1); finite_of_isClosed_of_notMem_genericPoint_curve
  is a thin [X.Over (Spec K)]-form wrapper (NoetherianSpace via LocallyOfFiniteType.isLocallyNoetherian
  + CompactSpace; hgen via SmoothOfRelativeDimension.specializes_eq_genericPoint_or_eq).
  Future worksheets: check StalksDVR before rebuilding curve point-set topology. Next
  action: blueprint nodes for the four bricks — gated on the Hartshorne II.6.8 transcription
  (ratified rider 2).'
