body: 'Lean warning debt in the Čech consumer closure


  A successful build of `AlgebraicJacobian.Cohomology.CechAugmentedResolution` replays
  concentrated pre-existing warnings from `QcohRestrictBasicOpen`, `QcohTildeSections`,
  `CechBridge`, `CechToCohomology`, and `AffineSerreVanishing`. The warnings include
  deprecated `Sheaf.val` usage, long-line and style diagnostics, unused simp arguments,
  and undocumented heartbeat settings. The newly split contractibility targets and
  the augmented-resolution change are warning-free. Next action: clear these warnings
  module by module, replacing deprecated projections and justifying or removing local
  resource overrides, with a consumer build after each bounded slice.'
