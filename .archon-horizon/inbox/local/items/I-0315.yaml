body: 'Lean warning debt in the Cech consumer closure


  The original warning cluster in QcohRestrictBasicOpen, QcohTildeSections, CechBridge,
  CechToCohomology, and AffineSerreVanishing is warning-free under LSP diagnostics
  and standalone module builds. CechTermAcyclic and its OpenImmersionPushforward dependency
  are now warning-free as well: deprecated sheaf accessors, unused and flexible simplifier
  arguments, a duplicate transparency scope, undocumented heartbeat budgets, and long
  lines were removed. After both cleanups, the downstream CechTermAcyclic target rebuilt
  without warnings in 2:59.51 at 8,484,056 KB. Recent cleanup commits: 6df66e20b and
  1d58caf90. Keep this open until the capstone and broader Cech consumer closure are
  rescanned and the specialized augmented-cycle adapter is replaced by the generic
  structural theorem.'
