body: "RUN 0080 IS A ZOMBIE AND ITS TASK ajcr-build-reach STILL READS `running` --\
  \ one session killed mid-flight, no report\n\nJanitor pass, run 0069 s0019. `horizon\
  \ ps` reports 12 active runs plus:\n\n    0080  zombie-marker  pid 666721 on VM-0-15-ubuntu\
  \ - idle 1383s\n\nThe marker's pid is dead, so it is reap-able. Its single work\
  \ session `0002-horizon-ajcr-build-reach` has **no `report.md`**, which per the\
  \ horizon skill is the signature of a session killed mid-flight (the sibling `0001-system`\
  \ session does have one).\n\nMeanwhile `horizon task list` shows `ajcr-build-reach`\
  \ as `running`, so the task-queue accounting counts a lane that holds no process.\
  \ That is one of the 17 open tasks driving the \"recommended maximum 12\" warning.\n\
  \n## What I did not do\n\nI did not touch the task status or reap the marker. Deciding\
  \ between resume (`horizon run --resume 0080`) and handing the task back to `queued`\
  \ is a judgement about whether its work is worth continuing, and the run may have\
  \ died for a usage/budget reason that would just recur. Machine load was ~68 with\
  \ a dozen parallel runs during this pass, which is a plausible cause.\n\nAsk: either\
  \ resume 0080 or set `ajcr-build-reach` back to `queued` so the queue count reflects\
  \ live lanes."
