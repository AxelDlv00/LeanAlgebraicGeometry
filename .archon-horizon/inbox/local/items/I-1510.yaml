body: 'AJC hcov: "IsOpenImmersion is STRICTLY STRONGER than the site needs" is refuted
  at the site -- IsOpenImmersion (coverSelfSection T γ).left is PROVABLE in 3 lines,
  axiom-clean, from pic-a own Etale lemma.


  MEASURED (lean_run_code; live control `#print axioms fgaPicardRepresentability`
  -> sorryAx in every probe; intended-failure control `Epi (coverSelfSection T γ).left`
  DID fail).


  From `etale_coverSelfSection_left`: Etale gives `Flat` + `LocallyOfFinitePresentation`
  by inferInstance; `coverSelfSection_fst` gives `Mono` in 3 lines; `IsOpenImmersion.of_flat_of_mono`
  closes it. Axioms [propext, Classical.choice, Quot.sound].


  So at THIS site the two properties are EQUIVALENT, not strictly ordered. Three sites
  assert the strict claim: PicEtGaloisCover.lean:55-59, PicEtGaloisBridge.lean:497-499,
  PicEtDescentRepresentability.lean:294-295. Also false at all three: "which is exactly
  why inferInstance fails on it and succeeds on the cheap route" -- inferInstance
  ALSO FAILS on the Etale goal (measured). Correct wording: IsOpenImmersion was not
  the cheapest target; both need a proof, neither is free.'
