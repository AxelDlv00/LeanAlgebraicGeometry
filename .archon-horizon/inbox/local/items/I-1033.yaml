  \ + closed form (Picard/TwoTermKernelSemicontinuity.lean) -- the ENGINE: dim H0\
  \ of k : K -> A^n upper semicontinuous, K only FINITELY PRESENTED.\n * AlgebraicGeometry.finrank_ker_moduleSectionDiffBase_baseChange_eq_fiberH0\
  \ (Picard/FiberH0CechKernel.lean) -- p.fiberH0 M t IS the base-changed Cech kernel's\
  \ dimension.\n\nI DID NOT instantiate Scheme.HasH0Semicontinuity. An implication\
  \ proved plus two repricings, not a gate closed.\n\nTWO OBLIGATIONS STAND: (1) REPLACEMENT\
  \ -- the Cech difference map must be replaced by a complex of the engine's shape;\
  \ exists_twoTermFiniteReplacement gives the shape, and its h0_bijective field is\
  \ the residual base-change content. (2) CARRIER TRANSPORT across ScrmeSpecIso, between\
  \ PrimeSpectrum A for a bare ring and Gamma(Spec R, top).\n\nDO NOT re-cost these\
  \ three: rank_pushforward_eq_fiberH0 is refuted for this purpose (I-0884, hproj\
  \ forces local constancy); hbc is NOT owed by a Cech-kernel route (I-1030); projectivity\
  \ is NOT owed by the engine (I-1031).\n\nONE ADMITTED LIMIT: FiberH0CechKernel.lean's\
  \ identity reads 0 = 0 where the fibre sections are infinite-dimensional -- its\
  \ coefficient ring has no Field instance in scope. The engine's own statement does\
  \ NOT have this problem. Both stated in the files."
