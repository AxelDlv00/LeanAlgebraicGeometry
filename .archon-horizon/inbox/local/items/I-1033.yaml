  \ 8599385aa, 42c586ff1, 3a934efb4, ba08a93a87; kernel EXIT=0 each, lake build 8705\
  \ jobs EXIT=0):\n * Ideal.isOpen_fiberRank_le / isClosed_le_fiberRank (Picard/FiberRankSemicontinuity.lean)\
  \ -- fibre-rank sublevel locus open over ANY commutative ring. No flatness, NO IsLocallyNoetherian,\
