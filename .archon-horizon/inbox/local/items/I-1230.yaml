body: 'degAt_abelDivAff'' CARRIES AN INSTANCE BINDER THE hdegAff HYPOTHESIS DID NOT
  -- [GeometricallyReduced C.hom] -- AND IT IS NOT LOAD-BEARING; the discharge is
  real but the statement is narrower than the binder it replaces.


  SITE: MainProjects/Algebraic-Jacobian-Challenge-Rebuild/AlgebraicJacobian/Picard/DivisorFamilyAffClassDegree.lean:347
  (degAt_abelDivAff'') and :380 (chartValueAff_mem_pic0Subgroup''); the replaced binder
  is at Picard/DivisorFamilyAffAbel.lean:344-345, inside a theorem carrying `omit
  [GeometricallyReduced C.hom]` (:302).


  MEASURED (work-reviewer, fresh context, `lake env lean` on scratch files, oleans
  confirmed fresh):

  * Binder diff, elaborated signatures. chartValueAff_mem_pic0Subgroup has instances
  {IsProper, GeometricallyIrreducible, SmoothOfRelativeDimension 1}. The primed twin
  has those PLUS [GeometricallyReduced C.hom]. Nothing else differs -- hypothesis
  order, hdeg, T, s, and the conclusion are identical, and C n moved from explicit
  to implicit (harmless).

  * [GeometricallyReduced C.hom] is NOT synthesizable from the other three (`infer_instance`
  fails, against a passing control).

  * It is NOT load-bearing: I re-elaborated degAt_abelDivAff'' verbatim with the binder
  deleted from the variable line and it compiles unchanged (`degAt_abelDivAff''_noGR`).
  It is inherited from the section variable line at :327, whose comment justifies
  only GeometricallyIrreducible + SmoothOfRelativeDimension 1 by naming picEtMap /
  degAff_unit / relPicDeg_relPicMk.


  WHY IT MATTERS AND WHY IT IS NOT FATAL. The primed statement is strictly narrower
  than the hypothesis it discharges, so on the letter "hdegAff removed and nothing
  else weakened or added" is false: one instance binder was added. In practice the
  harm is bounded -- I verified BOTH the primed theorem and the raw `fun t => degAt_abelDivAff''
  s t` discharge apply in the original''s exact instance context, i.e. the whole DD-R
  lane already carries GeometricallyReduced, so no existing consumer is blocked. Fix
  is a one-line `omit [GeometricallyReduced C.hom] in` above :347 and above :380,
  restoring exact parity with the chart-typed twin the docstring claims to match.


  RELATED, same file, uncommitted at the time of audit: the freshly extracted picEtAffineEquiv_abelDivAff''
  correctly `omit`s all three geometric instances, which is the same discipline not
  applied to the two theorems above.'
