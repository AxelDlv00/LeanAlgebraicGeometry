body: "THE QuotScheme EDGE IS LOAD-BEARING, NOT VESTIGIAL -- so the AJC.picrep organisation\
  \ verdict is right for a reason it does not give, and the ONE remaining refactor\
  \ candidate should also be dropped.\n\nMEASURED review-ajc r7 (AJC, run 0081 s0016)\
  \ at HEAD, own import census over all 318 modules.\n\nTHE ROW'S VERDICT, which I\
  \ reproduce: 97 of 318 modules reach Picard/QuotScheme.lean (the row says 85 of\
  \ 305; the tree has grown, the shape is unchanged). Splitting the 6265-line module\
  \ is not worth a lane; the bare 'import Mathlib' in 111 of 318 is house style, not\
  \ drift.\n\nWHAT IS NEW, and it matters because the row leaves this as live hygiene.\
  \ The row downgraded 'prune GrassmannianQuot's unused import of QuotScheme' to a\
  \ one-line hygiene fix on the ground that a live-route module importing the REJECTED\
  \ route's engine misleads a reader. That framing is wrong, and I would drop the\
  \ item entirely rather than leave it as a hygiene invitation:\n\n * FIVE of the\
  \ SEVEN files landed this round reach QuotScheme -- PicEtSubcanonical, PicEtSeparated,\
  \ EtaleFieldCover, PicEtDescentAssembly, FiniteLevelRationalPoint. Only GaloisQuotientAffineGeneral\
  \ (closure 7) and Milne33RowSectionRational (closure 6) are disjoint.\n * The shortest\
  \ path is identical for all of them and does NOT run through GrassmannianQuot: PicEtSubcanonical\
  \ -> FGAPicRepresentability -> DivFunctorDef -> QuotFunctorDef -> GenericFlatnessGeometric\
  \ -> QuotScheme.\n * And GenericFlatnessGeometric's QuotScheme import is USED, not\
  \ vestigial: its docstrings at :27 and :1473 cite the QuotScheme SECTION-LOCALIZATION\
  \ ENGINE by name as the thing FlatteningStratification does not import.\n\nSO THE\
  \ READER-MISLEADING FRAMING IS ITSELF THE ERROR. QuotScheme is not only the rejected\
  \ route's Quot construction; it also houses a general section-localization engine\
  \ that the LIVE Grassmannian/flattening route consumes. The 97 modules that reach\
  \ it are not evidence of an incomplete rejection. A lane that 'tidies' this will\
  \ either be blocked or will fork the engine.\n\nNET ORGANISATION ANSWER for the\
  \ four provers: nothing here costs a lane this round. Not the module size, not the\
  \ bare imports, not the GrassmannianQuot edge. The 26 body sorries in 10 files are\
  \ the real ledger, and only one of them (FGAPicRepresentability, the seam) is on\
  \ the representability route."
