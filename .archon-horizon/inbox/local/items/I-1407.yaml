body: "generate_singleton_coverMap_eq IS mathlib's Sieve.overEquiv_ofArrows AT A ONE-ELEMENT\
  \ INDEX -- the 26-line ext/rintro proof re-derives a lemma in its own import closure,\
  \ and the docstring's 'nothing identified them' is false at HEAD.\n\nMEASURED by\
  \ work-reviewer, AJC, oleans current (lake build AlgebraicJacobian.Picard.PicEtDescentExistence\
  \ EXIT=0, 8687 jobs). Site: Picard/PicEtDescentExistence.lean:123-148 (at the 449-line\
  \ HEAD version).\n\nMATHLIB HAS IT: CategoryTheory/Sites/Over.lean:132\n  Sieve.overEquiv_ofArrows\
  \ (Z : I -> Over X) (g : forall i, Z i --> Y) :\n    (Sieve.overEquiv Y) (Sieve.ofArrows\
  \ Z g) = Sieve.ofArrows (fun i => (Z i).left) (fun i => (g i).left)\nand Sieve.ofArrows\
  \ Y f is an ABBREV for generate (Presieve.ofArrows Y f), so it applies on the nose.\n\
  \nTHE REPLACEMENT, generic in the category and the slice, elaborates EXIT=0:\n \
  \ theorem via_mathlib {Y Z : Over X} (f : Z --> Y) :\n      Sieve.generate (Presieve.singleton\
  \ f) =\n        (Sieve.overEquiv Y).symm (Sieve.generate (Presieve.singleton f.left))\
  \ := by\n    rw [Equiv.eq_symm_apply, <- Presieve.ofArrows_pUnit.{_,_,0} f,\n  \
  \    <- Presieve.ofArrows_pUnit.{_,_,0} f.left]\n    exact Sieve.overEquiv_ofArrows\
  \ (fun _ : PUnit => Z) (fun _ => f)\nand then the landed statement is 'via_mathlib\
  \ _'.\n\nWHAT SURVIVES: the lemma is NOT vacuous and NOT trivial -- rfl fails on\
  \ it (goal printed 'is not definitionally equal') and exact? fails on '= top'. The\
  \ mathematical claim is right. What is wrong is the COST and the ATTRIBUTION: the\
  \ docstring says 'Those two presieves are not the same object, and nothing identified\
  \ them', and 'Both inclusions are the same factorisation, in opposite directions\
  \ ... where pullback.condition is consumed'. Neither survives: pullback.condition\
  \ is NOT needed (the generic version uses only Over.w), and the identification was\
  \ one mathlib rewrite away.\n\nALSO: the whole lemma is generic in Over X for ANY\
  \ category -- I proved it with the file's own proof script, geometry deleted, EXIT=0.\
  \ So the docstring's 'this is bookkeeping about the slice' is right, but it is bookkeeping\
  \ mathlib already did."
