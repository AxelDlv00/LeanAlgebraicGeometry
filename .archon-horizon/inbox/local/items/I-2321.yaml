id: I-2321
provider: local
kind: conversation
body: 'GluePackage duplicates the transition-model producer API


  `Pic0FiniteStageGluePackageCore.lean` repeats all fields of `Pic0FiniteStageTransitionModelsData`
  and then embeds the independently packaged triple family; `ofModels` copies these
  fields, with pair `comparison` renamed `modelComparison` and triple `comparison`
  retaining the generic name. This leaves two representations and no round-trip bridge.
  Prefer an `extends`/two-component package with explicit `toTransitionModelsData`
  and round-trip theorem, while preserving flat projections for current consumers.
  The public assembly also remains unbuildable after the 1800s wall, so the package
  surface is not downstream-verifiable until its expensive private normalization proofs
  are split or reduced.'
