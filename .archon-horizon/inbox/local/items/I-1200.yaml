body: 'The ''sharp localisation'' of obligation 3 is universally_le read backwards:
  the free factor is IMPLIED by the goal, so its freeness localises nothing


  SITE: Picard/Pic0EtProperImage.lean:121-148 (specializingMap docstring, ''Why this
  is worth a name'') and header Section 1 bullet 2 (''the entire content of obligation
  3 sits in the universally quantifier ... the sharp localisation the properness row
  asked for'').


  MEASURED (lake env lean, EXIT=0):


  (1) MorphismProperty.universally_le P : P.universally <= P. For ANY P and ANY f,
  the quantified form implies the un-quantified one. Probe: from ''h : ValuativeCriterion.Existence
  f'' at an arbitrary scheme morphism, rw [ValuativeCriterion.Existence.eq] then MorphismProperty.universally_le
  gives SpecializingMap f.base -- no one-point base, no field. So the un-quantified
  factor is a CONSEQUENCE of obligation 3, not an independent conjunct, and proving
  it free removes nothing from the conjunction. Same logical status as compactSpace,
  which the file correctly labels ''necessary, not sufficient'' and ''NOT a step towards''.
  Bullet 2 makes the stronger claim for a fact of identical status.


  (2) The freeness is not about Pic0 or the etale tower. Probe: for topological X,
  Y with [Subsingleton Y], every f : X -> Y is a SpecializingMap. So EVERY scheme
  over a field satisfies it, including the ambient PicSchemeEt bullet 1 discusses.
  ''The whole obligation lives in the universally'' therefore holds verbatim of every
  properness-over-a-field obligation in either project; it does not distinguish obligation
  3.


  (3) ''A lane should not spend effort on the specialization property at k'' is sound
  but empty: ValuativeCriterion.Existence.of_specializingMap (already wired at Pic0EtStructure.lean:387)
  takes the universally form as its hypothesis, so the un-quantified factor was never
  an input a consumer had to supply.


  NOT REFUTED: specializingMap is true, sorry-free, axiom-clean; topologically_specializingMap
  is rfl-equal to it (probe closes by rfl). As a convenience name it is fine.


  NEXT ACTION: downgrade bullet 2 to bullet 1''s register -- necessary, free by universally_le,
  no localisation content -- and delete ''the sharp localisation the properness row
  asked for''. The topological route stays uncosted: costing it means bounding the
  base-changed maps, which nothing here touches.'
