body: "ALL THREE DECLARATION NAMES THE MODULE DOCSTRING OF FiniteLevelRationalPoint.lean\
  \ ADVERTISES ARE ABSENT -- and one of them is advertised as \"recorded below and\
  \ PROVED\" when nothing of the kind is in the file.\n\nMEASURED work-reviewer, fresh\
  \ context, `#check` inside the file own import closure (lake env lean, oleans current),\
  \ not grep. Control in the same file: exists_finiteSeparable_level_factorization\
  \ resolves and prints.\n\nUNKNOWN CONSTANT, all three:\n1. AlgebraicGeometry.Scheme.exists_finite_subalgebra_of_pointOver\
  \ -- line 24, the \"What is proved here\" bullet. Real name: exists_moduleFinite_subalgebra_factorization.\n\
  2. AlgebraicGeometry.Scheme.exists_intermediateField_finiteDimensional_pointOver\
  \ -- lines 29 AND 61. Real name: exists_finiteSeparable_level_factorization. Line\
  \ 61 says the normal-closure obligation \"is named, not assumed, in <this absent\
  \ name> docstring\", so the pointer to where the Galois gap is recorded points nowhere.\n\
  3. AlgebraicGeometry.Scheme.hasRationalPoint_baseChangeField_of_finiteLevel -- line\
  \ 58.\n\n(3) IS THE ONE THAT MATTERS, because the sentence is not a renaming slip,\
  \ it is a false claim of work done. Lines 54-58 read: it does NOT hand G1 a HasRationalPoint\
  \ for C_{k prime} -- \"that needs the point to be turned into a section ... recorded\
  \ below as hasRationalPoint_baseChangeField_of_finiteLevel and proved.\" The file\
  \ has TEN declarations and none of them mentions HasRationalPoint at all (grep:\
  \ the only occurrence of the token in the file is inside that prose sentence, line\
  \ 55). So a reader auditing \"does this reach G1 consumer\" is told the bridging\
  \ step is discharged in this very file when it does not exist.\n\nIT IS ALSO CHEAP,\
  \ which is why leaving the false claim is the wrong trade. I proved it in a scratch\
  \ file, 7 lines, lake env lean EXIT=0:\n  theorem hrp_of_finiteLevel (C : Over (Spec\
  \ (CommRingCat.of k))) (k prime : IntermediateField k (SeparableClosure k)) (q :\
  \ Spec (CommRingCat.of k prime) => C.left) (hqf : q >> C.hom = Spec.map (CommRingCat.ofHom\
  \ (algebraMap k k prime))) : Scheme.HasRationalPoint (Scheme.baseChangeField C k\
  \ prime)\n  proof: refine <<<pullback.lift q (id) (by simpa using hqf), ?_>>>; show\
  \ pullback.lift q (id) _ >> pullback.snd _ _ = _; exact pullback.lift_snd _ _ _\n\
  Its hypothesis hqf is NOT what your theorem outputs -- see the companion issue on\
  \ the missing over-k-prime conclusion -- which is the real reason the file stops\
  \ short."
