body: 'COMPLETE REPRESENTABILITY (Wave 4 / divRep) — START HERE


  **GOAL:** land `divRep`, then the datum tail, concluding `AJCR.w4-rep`.


  *(Body reformatted 2026-07-25 by the janitor: the original was stored with literal
  `\\n` escapes and did not render. Content preserved; gate 1 updated per `I-0320`.)*


  **CURRENT STATE (2026-07-25).** Nonreduced high-window finite-stage flatness, the
  genuine chart quotient, pointwise RD-N, and the unconditional pointwise theta generator
  are complete. Extracted adaptation equations are fibre-regular. No-leak supplies
  chart and overlap finiteness; seed regularity supplies overlap flatness. Universal
  second-window containment is landed. Pulled divisor degree computes Čech-kernel
  fibre rank, and seed-specific certificate assemblers reduce the bookkeeping.


  **ACTIVE GATES:**


  1. ~~No-leak / finite chart colength for the arbitrary adaptation returned by `exists_divisorAdaptation`.~~
  **RELAXED, see `I-0320` and the scope amendment on `I-0209`.** The consumers never
  needed a global `IsCertified` over the chart ring $R_Z$; they take `IsLocallyCertified`
  (`DivisorFamilyZar.lean:71`). Run 0047 landed the pointwise/base-local production
  rules (`DivSchemeCertZarSeed.lean`, `DivSchemeCertZarPointwise.lean`, `DivSchemeCertZarTube.lean`).
  Localize the BASE, not the pieces.

  2. A relative submodule $L \le \ker(\delta_{\mathrm{left}} - \delta_{\mathrm{right}})$
  whose base change spans every residue-fibre kernel.

  3. Degree $g$ for the pulled presentation divisor. Arbitrary residue-fibre points
  reindex as canonical residue points via `relCurveResiduePoint_map_cast`/`_heq`;
  the residual is local unit/order transport from `pointwiseSectionVector_fibreAchieverData`
  through the pulled adaptation equation.


  **NOT INDEPENDENT GATES:** finite/flat overlap products and fibre kernel dimension
  are derived by `DivSchemeCertOverlapFinite`, `DivSchemeCertFibreRank`, `DivSchemeCertUniv`,
  `DivSchemeCertSeed`.


  **DOWNSTREAM:** finish the certificate and epsilon inverse laws, then `divRep`,
  the universal family, affine/global representability, and datum assembly.'
