body: 'COMPLETE REPRESENTABILITY (Wave 4 / divRep) - START HERE `agent-ready`


  GOAL: land `divRep` (Div^g-lite representable), then the datum tail, concluding
  `AJCR.w4-rep` (Pic^0 representability). Orient from roadmap node `AJCR.w4-rep.datum.dat-d.ddr`
  and the earlier inbox trail `I-0289...I-0307`.


  AUDITED STATE (2026-07-20): the previous claim that only a bounded total-stalk bridge
  remained is false. The chart reading map has an `R`-linear range `P`; RD-N concerns
  the genuine chart ideal `J = B * P`, where `B = Gamma(V)`. The landed flatness is
  flatness of `B/P` as an `R`-module, not purity or flatness of `B/J` after quotienting
  by a chosen section.


  Guard example: `R = k[epsilon]/(epsilon^2)`, `B = R[t]`, `P = R*t + R*(t^2+epsilon)`,
  `s=t`. The reduced fibre is generated by `t` and `B/P` is `R`-free, but `J/(s)=(epsilon)`
  has nonzero fibre at `(epsilon,t)`. Thus an achiever and a total-stalk lift alone
  cannot prove RD-N.


  CORRECT CRITICAL PATH: use the second Grassmannian window to prove relative multiplication
  persistence `K_prime = H_s * K` from P-fib in every residue field, globalize fibre-surjectivity
  by finite-module Nakayama, then prove the resulting ideal-level purity/local principality.
  Only then derive `SeedUnivRDN` and unconditional `isGenerator` -> certificate/U1
  -> F5/F6/F7 -> `divRep`.


  VALID LANDED INFRASTRUCTURE: residue-point lift `abac842cc` (`DivSchemeFibrePoint.lean`);
  sharp single-point `kappa(z)` consumer `ca7c437d4`; genuine `chartReadIdeal` and
  equality with the old colength module `e0a718b0c`; finite fibre-surjectivity/Nakayama
  globalization `b67d9b09`, `77e1f3bd`. The draft Quot/FGA project is typed-sorry
  dependent and is not a complete shortcut.


  BINDING: stay single-point for the RD-N consumer, but do not mistake single-point
  fibre divisibility for ideal purity; do not reuse the old chart-flat inference or
  the dead global `kappa(p)` bridge.'
