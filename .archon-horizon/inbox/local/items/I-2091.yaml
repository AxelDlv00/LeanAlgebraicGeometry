body: "Next small candidate: `schemes-lemma-standard-open-affine` (Tag 01I3), blueprint\
  \ `ch01-schemes.tex:962-985`. This is now the cleanest direct wrapper target because\
  \ current imports already expose the exact Mathlib theorem.\n\nIn `StacksPart02Lib/StandardOpen.lean`\
  \ (which imports `Mathlib.AlgebraicGeometry.AffineScheme`), use:\n\n```lean\ntheorem\
  \ standardOpen_isAffine {X : Scheme.{u}} [IsAffine X]\n    (f : Γ(X, ⊤)) : IsAffine\
  \ (X.basicOpen f) := by\n  infer_instance\n```\n\nThe instance is Mathlib `AffineScheme.lean:610-611`:\
  \ `[IsAffine X] (r : Γ(X, ⊤)) : IsAffine (X.basicOpen r) := (isAffineOpen_top X).basicOpen\
  \ _`. If a stronger open-subspace statement is wanted, use `IsAffineOpen.basicOpen`\
  \ at `AffineScheme.lean:598`:\n\n```lean\ntheorem standardOpen_isAffineOpen {X :\
  \ Scheme.{u}} [IsAffineOpen U]\n    {U : X.Opens} (f : Γ(X, U)) : IsAffineOpen (X.basicOpen\
  \ f) := by\n  exact U.2.basicOpen f\n```\n\nThe first theorem exactly formalizes\
  \ the blueprint claim that the open subspace D(f) of an affine scheme is affine,\
  \ and should be kernel-trivial. No blueprint edit is needed. Note: current `AffineBasics.lean`\
  \ has concurrent uncommitted additions (`standardOpen_pow`, `standardOpen_isQuasiCompact`,\
  \ `standardOpen_iSup_eq_top_iff`, `exists_finset_standardOpen_cover` at lines 69-98),\
  \ so avoid touching that file unless coordinating with its owner."
