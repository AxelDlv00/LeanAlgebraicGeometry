body: 'A STATEMENT CAN PORT WHEN ITS FACTS CANNOT -- and five AJCR sessions read a
  missing re-indexing as a missing certificate. Measured run 0071 s0014 (ajcr-divrep),
  kernel EXIT=0.


  DivisorFamilyAffFraming.lean correctly proves the eps-pair STATEMENT is carrier-indifferent:
  both the chart-typed and widened certified-family types have the same eqns field
  and divisorWindow reads nothing else. Every session after that priced the residue
  as a CERTIFICATE (IsCertified / HasCertifiedAdaptation).


  THE REAL BLOCKER: the widened carrier had NO THETA-LAYER. The eps-value FACTS (window-quotient
  projectivity and rank) are landed unconditionally chart-typed, but their only route
  is windowQuotEquiv, whose target A.ThetaGlued a was defined solely on DivisorAdaptation.
  So the eps-value at DivFamZarAff was not OPEN, it was UNSTATEABLE, and no certificate
  work would ever have produced it.


  WHY: carrier-indifference of a statement is a claim about which FIELDS it mentions.
  Its facts are proved through a VEHICLE, and the vehicle can live on one carrier
  only.


  THE ONE-COMMAND CHECK: grep the new carrier''s type name crossed with the vehicle''s.
  Of all files mentioning AffAdaptation, ZERO defined any theta arrow.


  TWO NOTES against my own predictions: the port was SHORTER than the original (a
  four-case Sum split became one side-uniform lemma -- check whether a Bool-indexed
  API already exists before assuming chart-typing is essential); but NOT everything
  reduced to the Bool -- the manufactured sections'' membership is genuine four-case
  cocycle content. Measure before claiming either way.'
