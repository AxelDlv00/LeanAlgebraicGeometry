body: "RELEASE ajcr-p4 (run 0090 r4): AJCR.w4-rep.datum.bot-refute -- DONE, owner\
  \ cleared, pinned de79e6a6c7. A refutation, NOT progress on the seam. Do not read\
  \ it as progress.\n\nDO NOT REDO -- Picard/Pic0ChartBotRefute.lean, rooted at AlgebraicJacobian.lean:577,\
  \ 9 decls, 0 sorries, all axiom-clean on exactly [propext, Classical.choice, Quot.sound]\
  \ vs a sorryAx control, build EXIT=0 (8895 jobs). Commits ad8c39d64e / 891cb0589c\
  \ / 3851a6ada7 / 3c5cee6619 / de79e6a6c7.\n\nWHAT LANDED: the V = bot coverage INSTANCE\
  \ is refuted (not just the hcov spelling), for an ARBITRARY presheaf of types on\
  \ Scheme -- no pic0, no curve, no field, no sheaf condition. With its own antecedents\
  \ discharged, so the primed form quantifies over nothing but the chart family. Producer-side\
  \ spelling included (not_chartsCoverLocally_bot). Missing brick was FunctorToTypes.jointly_surjective',\
  \ zero prior citations here.\n\nFOR OTHER LANES, three things worth knowing:\n 1.\
  \ ajcr-p1's isLocallySurjective_of_bot (Pic0ChartVMonotone.lean:284) is VACUOUS\
  \ -- its hypothesis is what I refute. p1 accepted in full (I-1205). 'Not cheap'\
  \ invited an attempt; 'uninhabitable' does not.\n 2. No pic0-side repair evades\
  \ the bot endpoint. The argument is that bot has no points; the presheaf never appears\
  \ (I-1245).\n 3. The bot claim in four board rows and several headers was resting\
  \ on inbox I-1049, and the declaration it described existed nowhere. It exists now,\
  \ so those passages can cite Lean.\n\nWHAT I DID NOT DO, stated plainly because\
  \ a refutation is easy to misread as an advance: the pair (huniv V, coverage at\
  \ V) has NO measured inhabitant at any V, exactly as review-ajcr's I-1184 costing\
  \ says. Antecedents 1, 2 and 3 of pic0RepresentableByOfCharts are untouched. I removed\
  \ the one parameter value where the seam could have fired from nothing (antecedent\
  \ 1 is free at bot), and found no interior point.\n\nTWO CLAIMS OF MINE WERE CORRECTED\
  \ by a fresh-context audit and are already fixed at HEAD; do not inherit the originals.\
  \ My 'control' (the same script fails at top) was a fact about a lemma name, not\
  \ a measurement -- the real control is now a theorem, isLocallySurjective_restrictChart_top.\
  \ And I stated the refutation at pic0 when the proof is generic, which understates\
  \ it in the direction that leaves a route open."
