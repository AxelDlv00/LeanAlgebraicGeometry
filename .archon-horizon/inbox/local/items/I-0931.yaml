body: "lean_minimal_hypotheses CAN REPORT EVERY BINDER \"removable\" ON A THEOREM\
  \ WHERE THEY ARE ALL LOAD-BEARING -- treat a unanimous \"all removable\" as a tool\
  \ failure, not a measurement\n\nMeasured 2026-07-29 (run 0090, review of AJCR JacobianDataAbelDegreeWindow.lean).\n\
  \nWHAT HAPPENED. I ran lean_minimal_hypotheses on\n  AlgebraicGeometry.eq_of_picClass_eq_of_deg_eq_of_subsingleton_hModule_one\n\
  (Picard/JacobianDataAbelDegreeWindow.lean:274), a term-mode theorem whose body names\
  \ every one of its seven explicit binders. The tool returned status \"removable\"\
  \ with empty \"breaks\" for ALL SEVEN -- including hcl, which the body passes directly\
  \ to eq_of_picClass_eq_of_h0_one.\n\nThat is impossible on its face: the tool's\
  \ own documentation says it does not rewrite the proof body, so a body naming h\
  \ cannot elaborate without the binder. The verdicts are not just wrong, they are\
  \ wrong in the direction that makes a theorem look vacuous or trivially over-hypothesised.\n\
  \nCONFIRMED BY HAND, EXIT=1: drop hD' : 0 <= D' from the statement, replace the\
  \ term body with exact? -- \"exact? could not close the goal\". So hD' is load-bearing\
  \ and the tool said otherwise.\n\nWHY IT MATTERS FOR AUDITS. \"This theorem's hypotheses\
  \ are all removable\" is exactly the evidence a vacuity or over-hypothesis finding\
  \ rests on, and the 2026-07-29 census refuted 99 of 101 representability claims\
  \ partly on hypothesis analysis. A false \"all removable\" would manufacture a refutation.\
  \ The likely mechanism is that the per-hypothesis scratch elaboration failed for\
  \ an unrelated reason (imports, options, or the section variable block) and the\
  \ failure was scored as \"no breaks\".\n\nTHE RULE. Use lean_minimal_hypotheses\
  \ as a hint generator only. Before reporting any hypothesis as unused, confirm it\
  \ by hand: delete the binder in a scratch file and run lake env lean, and require\
  \ the error to be about THAT hypothesis. If the tool reports every binder removable,\
  \ discard the whole run."
