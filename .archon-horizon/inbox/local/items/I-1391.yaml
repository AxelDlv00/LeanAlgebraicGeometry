body: "THREE SITES PRICE THE ATLAS'S PER-CHART COMPACTNESS AS FREE BY EXHIBITING AN\
  \ INSTANCE ABOUT THE WRONG OBJECT -- the charts are the OPENS (V i), not the representing\
  \ objects, and compactness is not inherited by open subspaces.\n\nSITES (all corrected\
  \ in-tree, commit at HEAD):\n * Pic0AtlasFiniteType.lean:115-117 -- 'per-chart compactness\
  \ is free at the divisor scheme (below)';\n * the same file's Discharged example\
  \ docstring -- 'What is free is the per-chart compactness, i.e. EXACTLY THE HYPOTHESIS\
  \ of the finite-index route JacobianData.ofCharts';\n * Pic0AtlasCompactFromClass.lean:342\
  \ -- 'Finite iota and per-chart compactness (BOTH FREE at the divisor-representability\
  \ carrier, where CompactSpace (divSchemeOver ...).left is an instance)'.\n\nWHY\
  \ IT IS THE WRONG OBJECT. mixedParamChart C pi nn D rep m Z hdeg V i = restrictChart\
  \ (abelSigmaChart ...) (V i), whose source is yoneda.obj ((V i : Scheme)). So compactSpace_of_finite_atlas\
  \ / Scheme.OpenCover.compactSpace ask for CompactSpace ((V i : Scheme)) -- an OPEN\
  \ of (D i).left. The exhibited instance is CompactSpace (divSchemeOver ...).left,\
  \ which is the ambient object. Compactness does not pass to open subspaces.\n\n\
  MEASURED (AJCR run 0089 r7, oleans verified fresh first, lake env lean, controls\
  \ firing sorryAx):\n * CONTROL: example ... (V : (divSchemeOver k A B n r1 r2 b1\
  \ b2).left.Opens) : CompactSpace (V : Scheme) := by infer_instance -- FAILS. So\
  \ the gap is real, not a spelling.\n * AND IT IS NOT A CORNER CASE: hf is FALSE\
  \ at V = top (Pic0ChartPair.lean:134), so every atlas the seam can use has PROPER\
  \ chart opens. The one V at which the cited instance would suffice is the one V\
  \ the certificate forbids.\n\nWHAT CLOSES IT, so the conclusion survives and only\
  \ the reason changes: divSchemeOver .left is LOCALLY NOETHERIAN (LocallyOfFiniteType.isLocallyNoetherian\
  \ at locallyOfFiniteType_divSchemeOverHom over the noetherian base Spec k) and COMPACT\
  \ (compactSpace_divScheme), hence IsNoetherian, hence NoetherianSpace, hence EVERY\
  \ subset is compact. Landed as compactSpace_isOpen_divSchemeOver in Picard/Pic0AtlasCompactNoetherian.lean,\
  \ rooted, 5 decls, 0 sorries, all axiom-clean [propext, Classical.choice, Quot.sound]\
  \ vs TWO controls firing sorryAx.\n\nTRANSFERABLE SHAPE: the three sites each cite\
  \ a TRUE instance, at an object one constructor away from the one the hypothesis\
  \ binds. A per-declaration vacuity sweep passes; a reader checking 'does the cited\
  \ instance exist' passes. What fails is 'is the cited instance ABOUT the hypothesis's\
  \ object'. restrictChart is exactly the kind of one-step wrapper that makes the\
  \ two look identical in prose."
