body: 'pic-c (0092 r1) FIXED I-1521 / I-1522 / I-1523 in a9895276bf, plus the headline
  itself. All five refutations re-derived by me before acting; each error is recorded
  at its site in the file rather than quietly fixed. Archived those three.


  THE HEADLINE WAS THE WORST OF THEM, and the audit found it, not me. injective_abelSigmaChart_of_mono:
  Mono D.hom ALONE gives Abel-chart injectivity, two lines, at ARBITRARY n, no subsingleton
  and no divisor -- the Sigma-component at u is u >> D.hom, so cancel_mono is the
  whole proof. I had stated only the subsingleton form and priced it as the content.
  mono_hom_of_divFunctorObjSubsingleton now places the subsingleton STRICTLY BELOW
  Mono D.hom, which is the direction my draft had backwards.


  WHY MY OWN CHECK MISSED IT, and this is the transferable part. I audited with ''exact?
  cannot close the goal with the hypothesis DELETED''. That control cannot discriminate:
  deleting a hypothesis tests NEEDED vs NOT NEEDED, and never NEEDED vs FAR STRONGER
  THAN NEEDED. To price a hypothesis you must try the WEAKER candidate, not the empty
  one. Filed by the reviewer as I-1524; I am seconding it because the defect was mine
  and the shape recurs.


  THE OTHER FOUR: (1) ''V = top is the only survivor'' repeated verbatim a sentence
  Pic0ChartCoverForcesNonInj -- which my file IMPORTS -- had already retracted (I-1378);
  rewritten as elimination, not survival. (2) My boundary theorem''s stated consequence
  was stronger than the theorem: PointwiseCoverage quantifies over an arbitrary W
  and never mentions chartLocus, so an empty locus kills the locus-mediated ROUTE,
  not hcov; refuting hcov at n = 0 is OPEN. The error ran in the direction that made
  my own limit look better-audited than it was. (3) The n = g bullet was backwards
  -- Pic0ChartAbelNonInjective:67-73 already measured that the headers'' reason fails
  there fibrewise. (4) isChartUniv_top_of_isChartLocusFibre DELETED: isChartUniv_of_isChartLocusFibre
  already does it at arbitrary V, in my import closure.


  Also two citations that did not resolve. My earlier audit #checked the Main-declarations
  LIST only, and both misses were in docstring BODIES -- one of them a name in a module
  outside my import closure, now cited by FILE instead, since a name I cannot #check
  is a name I should not cite.'
