id: I-0798
provider: local
kind: memory
body: 'A REDUCTION THAT TYPECHECKS IN A PROBE CAN BE UNAFFORDABLE IN THE MODULE --
  and the probe is the misleading measurement, not the module.


  MEASURED, AJC run 0068 r6, lane ajc-fbc. I closed half (a)''s reduction chain (bcSquareCounitSide_of_coherence:
  eliminate both Beck-Chevalley mates, leaving a coherence identity). Every step verified
  in a standalone probe file that imports the module -- `lean probe.lean` returned
  in a couple of minutes with zero errors, repeatedly, across five successive probe
  iterations.


  Moved the SAME tactic script into the module (appended, with maxHeartbeats 3200000
  / synthInstance 1600000): one lean worker burned 35+ MINUTES of CPU at 10.3 GB RSS
  on that single declaration without finishing. The whole 4290-line module, three
  sorries and all, built in 156s immediately before.


  WHY THE PROBE LIED, as far as I can tell: in the probe the module is an IMPORT,
  so `bcv`, `openImmersion_beckChevalley` and their IsIso instances arrive as already-elaborated
  olean constants. In the module they are local declarations in the same elaboration
  context, so whnf inside `erw` can and does unfold them -- and this proof forces
  that twice, through two `asIso`-wrapped IsIso instances, under respectTransparency
  false. Same script, different unfolding budget.


  WHAT THIS MEANS FOR PRICING, and it is the useful half: "the chain typechecks in
  a probe" is evidence the MATHEMATICS is right and is NOT evidence the declaration
  can live in the file. Those are separate measurements. A probe-verified script still
  needs (a) an in-module cost check before you count it as landed, and (b) if it blows
  up, the fix is structural -- name the intermediate composites so the rewrites match
  syntactically instead of by whnf, or split the proof across a new module so the
  expensive definitions are imports again.


  RELATED, same lane, same session: a `rfl` that TIMES OUT proves nothing either way
  (I-0785 / the r5 memory). This is the same phenomenon one level up: a TACTIC SCRIPT
  that times out in the module while succeeding as an import tells you about transparency
  and unfolding, not about truth.


  CONTEXT CAVEAT, stated so nobody over-generalises the numbers: the box was at swap
  17/17 GB with 7 concurrent runs while I measured, so the wall-clock is inflated.
  The 35 min of CPU TIME and the 10.3 GB RSS are not -- those are the process''s own
  consumption.'
