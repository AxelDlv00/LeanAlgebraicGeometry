  \ exposed as a reusable keystone, reduced to the single carve input; genuine hspan_seedUniv\
  \ (carve wiring at seedUniv) is the precisely-scoped residual (gated on redesigned\
  \ seedUniv bricks 2-4 + the section->functionField germ bridge).\n\nNew file Picard/DivSchemeRedesignJFlat.lean\
  \ (175 L). Single-module LEAN_NUM_THREADS=1 lake build GREEN under the mkdir lock\
  \ (8672 jobs, 16s). All 3 keystones lean_verify axiom-clean [propext, Classical.choice,\
  \ Quot.sound]; zero sorries; zero new warnings (Pic.lean show-style + Challenge.lean\
  \ sorries are pre-existing). Full-root stays green (leaf file). Root: HEAD-blob\
  \ + own line only (sibling PicEtCrossBaseGraph line + Hinj-removal in working tree\
  \ NOT swept; show --stat = my 2 paths, root +1).\n\n=== COMMIT (this lane) ===\n\
  - f033986c8  brick 1 J-flat: expose (c4) reading-map cokernel R_Z-flatness as a\
  \ reusable keystone, reduced to the carve input\n\n=== KEYSTONES (VERBATIM; namespace\
  \ AlgebraicGeometry.ThetaGeneratorSeed; section vars {k C R} {pi a} {K}, (D : ThetaGeneratorSeed\
  \ C R pi a K); colength z := Gamma(relCurve C R, D.piece z) / Ideal.span {D.eqn\
  \ z}; N z := D.sideColengthSubmodule z) ===\n\n(1) THE flat producer downstream\
  \ RD-N (§1.3 input iii 'J z R_Z-flat') + certificate consume:\n  forall_flat_colength_quotient_of_hsub\
  \ (D) [Module.Finite R K]\n    (hcolFin : forall z, Module.Finite R (colength z))\n\
  \    (hcolFlat : forall z, Module.Flat R (colength z))\n    (hsub : forall (z :\
  \ relCurve C R) (p : PrimeSpectrum R),\n      Function.Injective ((D.sideColengthSubmodule\
  \ z).subtype.rTensor p.asIdeal.ResidueField))\n    : forall z, Module.Flat R (colength\
  \ z / D.sideColengthSubmodule z)\n  — hsub = the SINGLE genuine carve obligation:\
  \ fibre non-collapse N z (x) kappa(p) into colength z (x) kappa(p) (rank-g pinning\
  \ from divUniversal_carve_residueField). Composes landed hsub=>hinj (hinj_of_forall_sideColengthSubmodule_subtype_rTensor_injective,\
  \ I-0286) + hinj=>hspan (hspan_of_forall_liftQ_rTensor_injective, I-0282) + c4.\n\
  \n(2) forall_flat_colength_quotient_of_hspan (D) [Module.Finite R K] (hcolFin)(hcolFlat)\n\
  \    (hspan : forall (z)(p : PrimeSpectrum R),\n      LinearMap.ker (((D.kColengthMap\
  \ z).comp K.subtype).rTensor p.asIdeal.ResidueField)\n        <= LinearMap.range\
  \ ((LinearMap.ker ((D.kColengthMap z).comp K.subtype)).subtype.rTensor p.asIdeal.ResidueField))\n\
  \    : forall z, Module.Flat R (colength z / D.sideColengthSubmodule z)\n  — exact\
  \ hflat argument of dvd_of_flat_quotient_of_field_vanishing (SeedDvd:128); hspan\
  \ = the c4 (SlicingFlatKernel:296) hypothesis at L = ker f_z, hle = le_rfl.\n\n\
  (3) flat_colength_quotient_of_hspan (D) (z) [Module.Finite R K] [Module.Finite R\
  \ (colength z)] [Module.Flat R (colength z)] (hspan_z) : Module.Flat R (colength\
  \ z / D.sideColengthSubmodule z)  — single-point c4 wrapper.\n\n=== WHAT THIS IS\
  \ ===\ncolength z / N z ~= Gamma(D(h z)) / J.Gamma(D(h z)) (piecewise Gamma/J; eqn\
  \ z = read(sec z) in J) — the c4 conclusion of spec §1.4. From this the base ideal\
  \ J itself is R_Z-flat as ker(Gamma -> Gamma/J) (Gamma flat, Gamma/J flat via SES)\
  \ — a cheap downstream step, NOT yet added here. Sound fibrewise-spanning route:\
  \ NEVER the false FibreInjective (f_z (x) kappa always kills the seed section);\
  \ the hspan/hsub route divides ker out first.\n\n=== RESIDUAL — hsub_seedUniv (the\
  \ genuine XL carve wall, UNCHANGED difficulty) ===\nhsub at the concrete redesigned\
  \ seedUniv: Function.Injective ((sideColengthSubmodule z).subtype.rTensor kappa(p))\
  \ via divUniversal_carve_residueField (FamilyUniv:135, carvePairArrow=0) transported\
  \ by ker_baseChange_mkQ (DivCarveKit:91) + divUniversalFibreKM_eq_span (Res:376)\
  \ + corank-g finrank_divUniversalFibreKM_add (AssembleKappa:207). BLOCKER = the\
  \ still-UNBUILT section->functionField germ bridge (relThetaResSide on D(h') <->\
  \ thetaFieldRead) identifying the piece colength fibre with the fibre-window reading\
  \ (I-0286), which depends on the redesigned (sec z, h z) of bricks 2-4. This file\
  \ takes hsub/hspan as HYPOTHESES so the flat conclusion is non-circular and stable\
  \ under that redesign; the carve wiring instantiates them downstream. No FibreInjective\
  \ (dead). No sorries; full-root green."
