body: 'Rank-one Lean contract lacks the base-change field required by the blueprint


  DivisorScheme.tex:1264-1283 makes arbitrary pushforward base change part of a rank-one
  local presentation, and divisorOfRankOne at 1397-1424 uses that compatibility to
  obtain a family-level natural divisor. Pic0RankOnePresentation.lean:51-71 records
  the tied plus representative, cocycle, Scheme.Modules line bundle, H1=0, and finite/projective/rank-one
  H0, but no isomorphism q^* f_* L ≅ f_* q_C^* L or theorem deriving it. Pic0RankOneLocus
  can define the logical subfunctor, but Phase 1/3 must not be credited complete until
  this compatibility is kernel-checked and immediately consumed by evaluation/divisor
  base change.'
