body: "W7-A1 PARTIAL (lane w7-a1, Opus 4.8, commit ea4ed5c97): datum-level baseChange_ofCurve\
  \ REDUCED to a single Leg-4 core, not yet fully landed. New Picard/JacobianDataBaseChangeAbel.lean\
  \ (166L, axiom-clean [propext,Classical.choice,Quot.sound], root-wired).\n\nR-K1-3\
  \ ACCESSOR RE-PIN (verified vs B-6b committed sig e30e066a1): the worksheet's .hom.hom.hom\
  \ is CORRECT. baseChangeIsoOfData d dL : (baseChange k L).mapGrp.obj (.mk d.J) ≅\
  \ .mk dL.J in Grp(Over(Spec L)); underlying scheme morphism (baseChange k L).obj\
  \ d.J ⟶ dL.J is .hom.hom.hom (iso .hom -> Grp-mor, Mon-mor .hom, underlying .hom).\
  \ L is IMPLICIT (from dL). Bridge lemma landed:\n  baseChangeIsoOfData_hom_hom_hom\
  \ : (baseChangeIsoOfData d dL).hom.hom.hom = ((d.baseChange L).uniqueUpToIso dL).hom\n\
  REUSABLE by DAT-J: the equation reducing the frozen baseChangeIso to uniqueUpToIso.\n\
  \nFULL REDUCTION LANDED (baseChange_ofCurve_data_of_core, axiom-clean, modulo hCore):\
  \ dL.homEquiv injectivity -> accessor bridge -> homEquiv_uniqueUpToIso_hom -> (d.baseChange\
  \ L).homEquiv unfolds DEFEQ (rfl) to (pic0CrossBaseEquiv...).symm ∘ d.homEquiv ∘\
  \ (mapPullbackAdj σ transpose); transpose of (baseChange k L).map aj = (counit.app\
  \ C) ≫ aj by counit_naturality; homEquiv_comp -> pic0Map C εC (abelElement C P).\
  \ Seam crossings term-mode only.\n\nREMAINING = hCore (ONLY gap), Leg-4 'θ carries\
  \ the Abel class across the base-field shuffle':\n  (pic0CrossBaseEquiv k L C C_L).symm\
  \ (pic0Map C ((Over.mapPullbackAdj (Spec.map (CommRingCat.ofHom (algebraMap k L)))).counit.app\
  \ C) (abelElement C P)) = abelElement C_L (Functor.LaxMonoidal.ε (baseChange k L)\
  \ ≫ (baseChange k L).map P)\nUnderlying picEt (Subtype.ext + pic0CrossBaseEquiv_symm_apply_coe\
  \ + pic0Map_coe + abelElement_coe + abelPicEt_map):\n  picEtCrossBase k L C C_L\
  \ (picEtMap C εC (abelPicEt C P)) = abelPicEt C_L Q,  Q = ε ≫ (baseChange k L).map\
  \ P.\nCONFIRMED no existing picEtCrossBase↔relPicToPicEt/relPicMk bridge at general\
  \ (non-affine) tests (relPicCrossBase is affine-only). Needs new infra: (A) picEtCrossBase\
  \ commutes with the étale unit relPicToPicEt∘relPicMk at a general test (componentwise\
  \ sectionShuffle vs relPic gluing), then (B) base-field-change of the graph class\
  \ via abelPicEt_map + graphLocalEquations_base_change (recon §3.4).\n\nFINISH: prove\
  \ hCore, then baseChange_ofCurve_data := baseChange_ofCurve_data_of_core hCore (frozen\
  \ worksheet-§3 shape); add \\leanok blueprint node in Jacobian.tex after def:baseChangeIsoOfData;\
  \ set AJCR.w7-functor.a1 done. Blueprint node DEFERRED this session (dishonest \\\
  leanok while conditional). DAT-J closures baseChangeIso_id/_comp + frozen baseChange_ofCurve\
  \ remain Fleet A."
