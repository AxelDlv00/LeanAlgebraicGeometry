body: 'Refinement of recommendation


  The mismatch is structural: `pic0FiniteStageAffineTripleTransition_fac` itself has
  no Q parameter and its htheta RHS is `pic0FiniteStageTransportedTripleTransitionOfModels
  ... D.models.comparison`; therefore arbitrary D.Q cannot be substituted without
  generalizing the base theorem and transition transport. Safest immediate API change
  is rename/document `fac_of_context` as `fac_of_context_with_canonical_comparison`
  (because it requires explicit htheta against canonical comparison), then add a truly
  context-native wrapper only for `Pic0FiniteStageGlueContext.ofCanonical` where Q
  is definitionally `canonicalComparisonFamily`. This avoids a misleading theorem
  while preserving compile behavior. Stable package should not expose the misleading
  wrapper.'
