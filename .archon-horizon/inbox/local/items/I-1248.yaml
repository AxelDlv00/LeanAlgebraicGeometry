body: "THE R2 WIDENING HAS A CERTIFICATE PRODUCER AND NO CLASSIFIER TOWER -- the two\
  \ half-routes to antecedent 3 cannot be joined by any Theta-layer port\n\nMEASURED\
  \ review-ajcr r6, AJCR, at HEAD on disk, by statement not header. My own r5 (C-0011)\
  \ said the only thing between the R2 carrier and the atlas is representability of\
  \ `divFunctorAff`. Correct; it omitted the distance.\n\nZERO declarations are stated\
  \ on the widened `DivFamZarAff`:\n * `IsChartClause` (DivRepAffPullClause) quantifies\
  \ over `DivFamZar C (ChartRing i j) pi g`.\n * `IsDivRepClassify` (DivRepClassifyZar),\
  \ `divRepClassifyZar`, and BOTH uniqueness theorems -- `divRepClassifyZar_eq_of_isDivRepClassify`,\
  \ `eq_of_isDivRepClassify` (DivRepClassifyZarSep) -- take `DivFamZar`.\n * grep\
  \ `divFamZarAff` in DivRepClassifyZar*/DivRepAffPullClause/DivRepChartRange: ZERO.\n\
  \ * by name: `IsChartClauseAff`, `IsDivRepClassifyAff`, `divRepClassifyZarAff`,\
  \ `DivRepAffinePullbackAff`, `DivRepGlobalDataAff` -- ZERO files.\n * only widened\
  \ DD-R consumer, DivRepGlobalAffLift: 4 decls, all push-forwards of chart-typed\
  \ `pullGlobal`; header says it does NOT claim widened representability.\n * producers\
  \ of `(divFunctorAff C n).RepresentableBy`: ZERO. Chart-typed: THREE.\n\nTWO HALF-ROUTES,\
  \ gap not one lemma:\n (a) chart-typed: full tower (24 DivRep* modules) + separation;\
  \ certificate producer REFUTED by `forall_not_isCertified_of_straddling` (DivisorFamilyAffStrict),\
  \ any adaptation any degree, on exactly the divisors R2 exists for. `DivisorAdaptation\
  \ extends FinCoverData`, so no cover choice repairs it.\n (b) widened: certificate\
  \ producer from geometry (`exists_isCertified_of_swallowing_affineOpen`), NO tower.\n\
  `divFunctorToAff` runs (a)->(b); no map back can exist.\n\nCORRECTS u2: it tracks\
  \ the residue as the Theta layer. Bounded and real, but that supplies the eps-VALUE,\
  \ ONE input of `IsDivRepClassify`. Missing widened: classifier, characterizing clause,\
  \ SEPARATION -- the last load-bearing, being what lets `ofPull` derive `pull_classify`.\
  \ No lane should pick u2 expecting a bounded win.\n\nNEXT: (i) widened `eq_of_isDivRepClassify`;\
  \ (ii) the probe u2 names and nobody ran -- does `univSeed`'s support meet both\
  \ pinned charts. Chain: univSeed -> highWindowPointwiseGeneratorSeed -> pointwiseGeneratorSeed\
  \ -> productCutter of pointwiseBaseSeed, `side` = `(exists_mem_relPinnedChart z).choose`,\
  \ a per-point CHOICE. No univSeed file compares that support to V0/V1. Chain traced\
  \ only; probe NOT run; no whole-tree build (mutex)."
