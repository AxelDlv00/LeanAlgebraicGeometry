body: "THE TWO PROPERNESS HYPOTHESES OF Pic0EtStructure.lean ARE INTERDERIVABLE, and\
  \ the file says the opposite in the docstring that justifies keeping the duplicate\
  \ package.\n\nMEASURED by work-reviewer (audit of 94599c2607). Oleans rebuilt first:\
  \ lake build AlgebraicJacobian.Picard.Pic0EtStructure EXIT=0, 8628 jobs. Then lake\
  \ env lean on a deleted Probe/ scratch, with a deliberate sorried control that correctly\
  \ reported sorryAx.\n\nCLAIM. Picard/Pic0EtStructure.lean:364-366, docstring of\
  \ isAbelianVariety_of_valuativeCriterion: \"kept because the two properness hypotheses\
  \ are not interderivable by anything in this file.\"\n\nTRUE. Both directions close,\
  \ axiom-clean [propext, Classical.choice, Quot.sound]. Forward is two of the files\
  \ own theorems composed (universallyClosed_baseChange_of_universallyClosed after\
  \ universallyClosed_of_valuativeCriterion). Backward is one projection of mathlibs\
  \ UniversallyClosed.eq_valuativeCriterion, which the file already cites:\n\n  theorem\
  \ ucGivesValuative {X Y : Scheme} (f : X ⟶ Y) [UniversallyClosed f] :\n      ValuativeCriterion.Existence\
  \ f := by\n    have h : @UniversallyClosed = ValuativeCriterion.Existence ⊓ @QuasiCompact\
  \ :=\n      UniversallyClosed.eq_valuativeCriterion\n    exact (h ▸ ‹UniversallyClosed\
  \ f›).1\n\nquasiCompact (:171) makes the QuasiCompact conjunct free on this morphism,\
  \ so the three forms collapse into one equivalence class: ValuativeCriterion.Existence\
  \ ↔ UniversallyClosed over k ↔ UniversallyClosed of pullback.snd over kbar. I re-derived\
  \ the whole chain.\n\nCONSEQUENCE. isAbelianVariety_of_valuativeCriterion (:367)\
  \ is a corollary of isAbelianVariety_of_baseChange (:353), not an independent route.\n\
  \nREPAIR IS AN UPGRADE. State the missing third iff, then delete the \"not interderivable\"\
  \ sentence. The properness half is then ONE equivalence class, which is stronger\
  \ than the file claims.\n\nLESSON. The file audited its four hypotheses for vacuity\
  \ (correctly) but never against EACH OTHER. \"Two routes, not interderivable\" is\
  \ a claim about a pair, and the collapsing projection sat in the same mathlib lemma\
  \ the file cites for the forward direction."
