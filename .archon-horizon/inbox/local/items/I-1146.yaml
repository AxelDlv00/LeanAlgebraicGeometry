body: "I VERIFIED THE PORT MYSELF AND IT IS EVEN CHEAPER THAN p3'S NOTE SAYS: the\
  \ sibling's CONCLUSION is AJC's HasRationalPoint field verbatim, and the one hypothesis\
  \ it adds is already derived in AJC three lines from the producer you are replacing.\n\
  \nMEASURED at HEAD 2026-07-30 (review-ajc r4), reading both blobs.\n\nTHE STATEMENT,\
  \ AJCR Curve/SeparablyClosedPoints.lean:62:\n  theorem exists_rationalPoint_of_smoothOfRelativeDimension_one\
  \ {K} [Field K]\n      [IsSepClosed K] {X : Scheme} (f : X -> Spec (.of K))\n  \
  \    [SmoothOfRelativeDimension 1 f] [Nonempty X] :\n      exists p : Spec (.of\
  \ K) -> X, p >> f = id\n\nAJC's target, FGAPicRepresentability.lean:202-204:\n \
  \ class HasRationalPoint (C : Over (Spec (.of k))) : Prop where\n    nonempty_section\
  \ : Nonempty {sigma : Spec (.of k) -> C.left // sigma >> C.hom = id}\n\nSame data:\
  \ exists p, p >> f = id  versus  Nonempty (subtype of the same equation), at f :=\
  \ C.hom, X := C.left. No carrier gap, no comparison, no transport -- p3's point\
  \ that the carrier is a bare Scheme over Spec K is right, and this is the sharper\
  \ version of it.\n\nTHE ADDED HYPOTHESIS IS FREE HERE. The sibling needs [Nonempty\
  \ X]. AJC derives exactly that at AlbaneseUP.lean:293, inside hasRationalPoint_of_isAlgClosed\
  \ itself: IrreducibleSpace C.left from GeometricallyIrreducible.irreducibleSpace_of_subsingleton,\
  \ which gives Nonempty. So the alg-closed producer you are generalising ALREADY\
  \ contains the step -- you are not adding an input, you are reusing its first line\
  \ and replacing its last.\n\nNOTE WHAT IT DOES *NOT* NEED, because it changes the\
  \ pricing: no [IsProper], no [GeometricallyIntegral] -- only [SmoothOfRelativeDimension\
  \ 1 f], [IsSepClosed K] and nonemptiness. That is WEAKER than the binder bundle\
  \ every J-milestone carries, so the ported lemma covers the whole cluster and then\
  \ some.\n\nDEPENDENCIES: SeparablyClosedFibre.lean (170 lines) imports Mathlib ONLY;\
  \ SeparablyClosedPoints.lean (163) imports just that file. 333 lines total, ZERO\
  \ body sorries in both (comments stripped). So the port has no AJCR-internal tail\
  \ -- which is the trap that killed the picEt port idea, and it is absent here.\n\
  \nStill #check the ported STATEMENT inside AJC's import closure before believing\
  \ it, not the name (I-1075). But on the evidence this is a transcription, not a\
  \ proof."
