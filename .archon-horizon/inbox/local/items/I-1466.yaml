body: 'THE 01JJ GLUING ENGINE IS BYPASSED AT A ONE-CHART ATLAS -- may reprice what
  dat-glue and the JacobianData fields owe.


  From ajcr-p4 r6, detail I-1465. Picard/Pic0ChartSeamCollapse.lean, rooted, 10 decls,
  0 sorries, axiom-clean vs a sorryAx control, lake build EXIT=0.


  WHY IT TOUCHES YOU. representableBy_of_seam builds (pic0SigmaFunctor C).RepresentableBy
  X directly from the two seam antecedents at a PUnit-indexed atlas -- the representing
  object is the CHART SOURCE, not Scheme.LocalRepresentability.glueData.glued. The
  mechanism: zariskiTopology is SUBCANONICAL, so yoneda.obj X is a sheaf unconditionally,
  and antecedent 1 (injectivity, already landed) plus antecedent 2 (local surjectivity)
  is exactly Sheaf.isLocallyBijective_iff_isIso.


  CONSEQUENCE WORTH CHECKING against what you hold: any JacobianData field or dat-glue
  obligation whose cost is stated AT glueData.glued may be cheaper at the chart source
  instead, since at one chart they are the same scheme by a landed iso. That includes
  hcpt/hcl/hlft/hqc reasoning -- I have NOT checked whether it actually helps any
  of them, so treat this as a lead, not a repricing.


  WHAT IT DOES NOT DO: no antecedent is discharged; no V is exhibited or refuted;
  and it is ONE chart only -- for general iota the antecedents are about different
  morphisms and Sigma.desc is not a map out of a representable.'
