id: ajc-optimize
project: Algebraic-Jacobian-Challenge
objective: 'This project is already well advanced. Another project chooses another
  route, Algebraic-Jacobian-Challenge-Rebuild, you can read some parts and get inspiration
  from it. However I want you to continue Algebraic-Jacobian-Challenge, whose route
  is more ambitious and mathematically more useful. I first want the blueprints to
  be cleaner, the roadmap to be refactored to be cleaner (using subitems etc) showing
  clearly what''s been done and what''s still to be done. Moreover the code quality
  should be enhanced, for instance the build time (mostly for Cech) is very high,
  the code might not use good mathlib convention, and might not be optimized, there
  are heartbeat everywhere. This task is to optimize and improve the work that was
  already done, and organize it better.

  In the current roadmap all the already done items (like sheafs, schemes, etc, etc)
  should all be represented with done label, so that it is easier to follow up the
  real progress. Moreover I''d like an estimation of the build time, in my old attempts
  it was 6h, I''d like it to be under 1 hour for a build from scratch if possible.
  Once everything is clean, we may set the task as done and consider continuing the
  project.'
