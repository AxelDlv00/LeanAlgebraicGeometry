objective: 'Advance Kleiman''s Picard-scheme representability in Algebraic-Jacobian-Challenge
  (AJC), source-faithfully from Kleiman "The Picard scheme" (references/kleiman-picard:
  PDF + kleiman-picard-src/kleiman-picard.tex; map in references/kleiman-picard.md).


  PRIMARY OBLIGATION: move the source-facing producer toward `fgaPicardRepresentability`
  in Picard/FGAPicRepresentability.lean — representability of the étale-sheafified
  relative Picard functor `Pic_{(C/k)ét}` for a smooth proper geometrically integral
  curve over an arbitrary field, with no `[HasRationalPoint C]` binder (owner decision
  / I-0491). This is Kleiman §2 functors + §4 Main theorem route, specialized as needed
  for curves; §5 Pic^0 / §6 Pic^τ are in-scope when they unlock the representing object
  or its group/projectivity structure for the Jacobian handoff.


  ROUTE: follow the project''s settled D3 Milne–Kollár campaign (informal/pic-representability-campaign.md)
  and roadmap cone AJC.picrep — finite Galois / separably closed construction, descent/assembly
  to arbitrary k, FiniteInAffine/very-ample/projectivity substrate only when it is
  load-bearing for a representing scheme. Do not reopen the deleted rational-point
  false leaf. Conditional `[HasRationalPoint C]` producers may be landed only if labeled
  conditional and not claimed as the headline.


  SUCCESS METRIC: producer-side movement (new kernel-checked theorems that a scheme
  represents picEt / closes a named AJC.picrep unmet producer, or discharges a real
  Kleiman §4/§5/§6 lemma consumed by that cone). NOT: new bare `(rep :)` consumers,
  certificate wrappers, or Euler/RR detours that leave fgaPicardRepresentability and
  PicEt producers unchanged (that was the failure mode of cancelled ajc-kleiman-rewire).


  CONSTRAINTS:

  - WRITE only Algebraic-Jacobian-Challenge (Lean library + minimal blueprint/hgraph
  corrections). READ AJCR, FormalizedSources, references freely.

  - Blueprint frozen except genuine math corrections and honest \lean attachments.

  - No sorry/admit/project axioms in committed math. Standard axioms only on headlines.

  - Narrow per-module builds during the session; AJC umbrella is expensive — one root
  build only if umbrella imports changed.

  - Before final report: honesty-reviewer on any new certificate/context wrapper,
  \leanok/completion claim, or repeated unchanged frontier; if unavailable, state
  why skipped.

  - Standing task style: do not mark done after partial advance; leave queued/running
  with what moved and the next Kleiman/AJC.picrep cone node.


  Start from on-disk state: FGAPicRepresentability, PicEtSheaf, PicEtSubcanonical,
  prior picrep commits, hgraph frontier for AJC.picrep, and the last durable notes
  on cancelled ajc-kleiman-rewire (substrate exists; headline producers still open).'
