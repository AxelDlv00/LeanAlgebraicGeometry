objective: 'Advance AJCR Phase 7: finite-Galois descent of the Pic^0 representative
  to the original field.


  Goal: take the finite-stage glued carrier to original-field `pic0_representableBy`
  (then the same-carrier PicRepDatum/JacobianData handoff if that is in reach). The
  mathematical gates are:

  1. binder-free finite-stage representability: maps into `P.gluedOver` naturally
  match `pic0TypeFunctor` families on arbitrary tests;

  2. exact-carrier orbit-affine / projective geometry over the finite Galois stage
  used by `P`;

  3. effective finite-Galois descent of that representative and universal class to
  `k`.


  WRITE only Algebraic-Jacobian-Challenge-Rebuild. READ AJC, FormalizedSources, and
  the Phase 7 roadmap (`AJCR.review-plan.p7-galois-descent`) freely. Blueprint frozen
  except genuine math corrections and honest Lean attachments. No sorry/admit/project
  axioms in committed math.


  Do not mark done after a partial advance. Leave queued/running with the next Phase
  7 producer. Mark done only if original-field `pic0_representableBy` is kernel-checked
  on the intended carrier.


  P.S. Some glue/package code this lane relies on may be poor quality (nested packages,
  decorative abbrevs, transport piles, I-2011 dependent-index `gluedCover.J` blocker).
  Do not spend sessions patching bad packaging. If a glue/package module blocks descent,
  backup it (`horizon attempt save` / short-lived Archive copy), rewrite from scratch
  as mathlib-shaped code, and re-point consumers. A clean rewrite usually beats fixing
  layered glue code. Drop backups once git holds the old text.'
