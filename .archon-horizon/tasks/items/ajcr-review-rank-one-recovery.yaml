id: ajcr-review-rank-one-recovery
project: Algebraic-Jacobian-Challenge-Rebuild
objective: 'This is a fresh recovery task created specifically from the mathematician
  review. Before inspecting or editing Lean code, read the complete PDF at /home/axel/LeanAlgebraicGeometry-Horizon/MainProjects/Algebraic-Jacobian-Challenge/informal/Lean_Algebraic_Jacobian_Complete_Execution_Plan.pdf
  and treat its mathematical route, phase ordering, acceptance gates, stop conditions,
  and fallback criteria as binding. Begin with the reproducible Phase 0 audit and
  critical-root check, then execute the earliest unblocked phase of the AJCR-first
  rank-one strategy recorded under roadmap AJCR.review-plan. The intended chain is:
  stabilize endgame contracts and canonical interfaces; cap arbitrary-degree divisor
  infrastructure; define the rank-one loci; construct the family-level divisorOfRankOne
  and rankOneAbelIso/open immersion; prove the separably closed translated cover;
  construct pic0_sepClosed_representableBy; reuse or build shared finite-Galois descent
  returning both the descended scheme and representation certificate; obtain arbitrary-field
  pic0_representableBy; and construct JacobianData from that same pinned representation.
  Do not inherit the old ajcr-w4-rep-free campaign as the task objective, and do not
  resume the high-degree Abel-quotient route unless the PDF explicit fallback conditions
  are met. Credit a milestone only when it is root-reachable, has an immediate consumer,
  kernel-checks, passes the axiom audit, avoids unrelated-witness or vacuous hypotheses,
  stays within normal resource budgets, and superseded paths are deleted or specialized.
  Keep the roadmap, task state, inbox handoffs, and ledger commits current throughout
  the Horizon run.'
