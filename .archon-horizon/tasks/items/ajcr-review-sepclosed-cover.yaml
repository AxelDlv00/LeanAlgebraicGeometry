objective: This is a fresh parallel lane created specifically from the August 2026
  mathematician review. Before inspecting or editing Lean, read the complete PDF at
  /home/axel/LeanAlgebraicGeometry-Horizon/MainProjects/Algebraic-Jacobian-Challenge/informal/Lean_Algebraic_Jacobian_Complete_Execution_Plan.pdf
  and treat its Phase 5 route, acceptance gates, stop rules, and anti-vacuity criteria
  as binding. Own only AJCR.review-plan.p5-sepclosed-cover. For every extension K/k
  and every input Picard class lambda, construct a base-field line bundle L0 whose
  translation of lambda lies in the existing PicRankOneOpen predicate, using positive
  twisting, point subtraction, and h0 reduction while preserving H1=0. The witness
  must explicitly depend on lambda and must be packaged in the exact form later consumed
  by the translated-open gluing criterion; unrelated existential carriers and fieldwise
  substitutes receive no credit. Work only in new Pic0RankOneTranslatedCover*.lean
  or Pic0SepClosedCover*.lean files and, if genuinely required, RiemannRoch/Ledger/VanishingFieldDescent.lean.
  Treat all Phase-3 locus files, Phase-4 presentation/local-divisor files, and Pic0CriticalPath.lean
  as owned by other lanes. Request API or root-integration changes through the coordination
  conversation. Require narrow kernel checks, standard axiom audits, an immediate
  consumer theorem, and normal proof budgets. Do not work on representability or Galois
  descent and do not resume the high-degree Abel quotient route.
