  .olean files. Do not run a full project build while run 0154 is active. Measure
  a baseline and an after-state with narrow faithful targets, commit only a tested
  improvement, and report exact timing/resource changes; if a source split is unsafe,
  land the build-profile/tooling improvement instead of a speculative refactor.
