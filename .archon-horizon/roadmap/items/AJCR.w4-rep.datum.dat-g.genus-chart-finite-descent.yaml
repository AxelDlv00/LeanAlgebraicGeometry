title: 'DAT-G genus charts: finite Galois cover and descent'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: Unconditionally choose a finite Galois extension L/k carrying a curve point
  and legal chart indices at every natural parameter on the same fpqc cover. This
  removes rational-point and divisor-degree assumptions and exposes the level consumed
  by Galois descent. Remaining work is the L-side representation, its canonical whole-object
  overlap cocycle, and effective scheme descent; numerical chart legality alone is
  not coverage or representability.
