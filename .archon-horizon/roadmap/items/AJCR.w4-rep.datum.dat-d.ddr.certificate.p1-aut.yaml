summary: 'DEPRIORITISED BY HUMAN DECISION 2026-07-28 (I-0346, protection I-0492).
  Not rejected, and not because the mathematics is wrong.


  R2 (generalize the piece type to arbitrary affine opens) was chosen over R1 because
  R1 is live only over infinite k and over F_q with q >= g+1, so it must be paired
  with descent to reach the challenge field, while archon-protected.yaml freezes the
  arbitrary-field statement. Two mechanisms where one suffices.


  BINDING: no session is to build the GL_2(k) / Aut(P1) action, and no consumer may
  be written against it. Left pending rather than rejected only because varying the
  pinned pair may one day accelerate the large-field case; that is a future optimisation,
  not current work. The landed groundwork (finite-field-avoid.cardinality e602378af,
  .support-degree d6c67f41d) remains valid mathematics and is not to be deleted.'
