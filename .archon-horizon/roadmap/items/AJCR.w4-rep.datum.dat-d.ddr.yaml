  chart colengths, finite-flat overlaps, fibre kernel spanning and dimension), discharge
  U1/U2, package the universal family, and finish affine/global divRep assembly. Old
  Grassmannian, Zariski descent, and flattening infrastructure is reusable, but old
  Quot/Pic representability endpoints remain sorry-backed and do not close this gate.'
