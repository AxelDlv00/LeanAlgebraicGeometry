summary: "DECIDED BY THE HUMAN 2026-07-28: R2 — GENERALIZE THE PIECE TYPE. Binding\
  \ form: protection I-0492.\nFull reasoning: I-0346 (human comment, same date).\n\
  \nEXECUTED, AND THE WIDENED LAYER IS NOW A FUNCTOR WITH A CONSUMER. Rooted (twenty-seven\n\
  DivisorFamilyAff*.lean files plus DivRepGlobalAffLift.lean).\n\nVERIFICATION STATUS,\
  \ and read it before quoting any of the below as green (I-0675, work-reviewer,\n\
  2026-07-29): everything landed BEFORE session 0012 is kernel-checked. The FOUR modules\
  \ of residue\n(b) -- DivisorFamilyAffMapKit / AffMap / AffFunctorCompare / DivRepGlobalAffLift\
  \ -- are CLAIMED,\nNOT VERIFIED. No sorries and no oleans either: the session's\
  \ own lake build hit its 3300s cap while\nstill rebuilding unrelated modules other\
  \ lanes had invalidated (EXIT=124), and the per-file fallback\nfailed environmentally\
  \ on a missing transitive olean, not on a proof. DO FIRST next session: run\n'lake\
  \ build AlgebraicJacobian.Picard.DivRepGlobalAffLift' to completion with a cap well\
  \ above 3300s.\nThe lane's own recorded hazard applies with full force here -- DivFamZarAff.eq_of_away_eq\
  \ takes n as\nan EXPLICIT leading argument (AffMapKit.lean:96 passes it, chart-typed\
  \ ZarMapKit.lean:54 does not),\nso a mis-port is RED WITH ZERO SORRIES and a census\
  \ cannot see it. Of the two obligations I-0492 clause 4\nrelocated, 4(i) is DISCHARGED\
  \ rather than assumed.\n\n  AffCoverData          -- m / pieces : Fin m -> Opens\
  \ / isAffineOpen / cover (iSup = top).\n                           NO pi argument,\
  \ NO partitions of unity, NO Sum index, NO chart typing.\n  AffAdaptation      \
  \   -- eqn per piece + eqn_rel; IsCertified with (c1)-(c4) VERBATIM.\n  CertifiedDivisorFamilyAff\
  \ / IsLocallyCertifiedAff / DivFamZarAff (mk, mk_eq_mk_iff, picClass)\n  DivFamZar.toAff\
  \       -- the widened value RECEIVES every chart-typed one, same picClass\n  isCertified_of_swallowedBy_of_c1\
  \ -- cert-collapse: all seven clauses from (c1) + the rank datum\n  exists_isCertified_of_seed_of_swallowing_affineOpen\
  \ -- the endpoint at a seed\n  DivFamZarAff.mapAlg + mapAlgHom + mapAlgHom_eq_mapAlg\
  \ -- both faces (s0010)\n  DivFamZarAff.eq_of_away_eq / exists_glue_of_away_compat\
  \ -- a Zariski SHEAF value (s0010)\n  divFamZarAff + divFamZarAffAffineEquiv --\
  \ the widened vehicle and its affine collapse\n\nRESIDUE ITEM (b) IS LANDED (2026-07-29\
  \ session 0012; spec ADDENDUM 9). The widened vehicle is\nfunctorial along an ARBITRARY\
  \ morphism of test objects, and the comparison out of the chart-typed\nside is a\
  \ NATURAL TRANSFORMATION, which is the form a consumer substitutes:\n\n  divFamZarAff.eq_of_basic_eq\
  \ / exists_glue_of_basic_compat / mapAlgHom_appLE_eq   (…AffMapKit)\n  divFamZarAff.IsPullbackValue\
  \ / exists_isPullbackValue / mapVal / mapVal_eq_mapAlgHom\n  divFamZarAff.map, map_id,\
  \ map_comp; divFunctorAff; divFamZarAffAffineEquiv_naturality (…AffMap)\n  divFamZarToAffVehicle_map;\
  \ divFunctorToAff : divFunctor => divFunctorAff  (…AffFunctorCompare)\n\nNot new\
  \ mathematics, and the reason generalises: every statement is about the Zariski\
  \ topology of\nthe BASE, which R2 left alone, so the chart-typed proofs of DivisorFamilyZarMapKit/ZarMap/\n\
  ZarFunctor transfer clause for clause. The typing is what costs: keystones speak\
  \ localization\ninstance packs, the vehicle speaks Over.resAlgHom, and every crossing\
  \ goes through\nmapAlgHom_eq_mapAlg. Predecessor price (ADDENDUM 8 §8.7) was \"\
  one file, ~350 lines\"; actual was\nthree files, ~730 lines, because the comparison\
  \ of FUNCTORS was never priced.\n\nTHE ISLAND IS BROKEN, and it was the lane's real\
  \ exposure. Before this session the widened names\nappeared in ZERO Lean files outside\
  \ their own family — a functor nothing consumes and a functor\neverything can consume\
  \ are indistinguishable to a sorry census and a job count.\nDivRepGlobalAffLift.lean\
  \ restates a DD-R consumer on it:\n\n  DivRepAffinePullback.pullGlobalAff / pullGlobalAff_val\
  \ / pullGlobalAff_comp\n  divFamZarAffAffineEquiv_pullGlobalAff\n\npull_comp is\
  \ the one DivRepGlobalData field that is about the FUNCTOR rather than one test,\
  \ so it\nis the law that decides usability, and its proof is the chart-typed pullGlobal_comp\
  \ transported\nalong divFamZarToAffVehicle_map. Cost: a push-forward. NOT claimed:\
  \ representability of\ndivFunctorAff by DivOver. The transformation is old -> new\
  \ only and the converse cannot exist.\n\nWHAT THE LANE STILL OWES: ONE STATEMENT.\n\
  \ (a) THE SUBORDINATE STACKS 0B8B INPUT. An affine open W with supp d inside W,\
  \ and W inside one\n     member of d.cover. Out of scope per I-0492 clause 2: USE\
  \ it, do not re-derive it. Mathlib has\n     no form of 0B8B and this tree constructs\
  \ no curve but P1. Unchanged since ADDENDUM 5.\n\nCARRIED HAZARDS, both real and\
  \ neither created here:\n * DivFamZarAff.eq_of_away_eq takes n as an EXPLICIT leading\
  \ argument where the chart-typed one has\n   it implicit. A port copying the chart-typed\
  \ call site feeds the cover family where n belongs and\n   fails as an unresolvable\
  \ l.down on a ULift binder, naming neither. Sorry census and job count\n   both\
  \ call such a file healthy; only elaborating it does not.\n * awayGluedEquationsLoc\
  \ at (fun i => (E i).eqns) is DEFINITIONALLY equal to awayGluedEquations at\n  \
  \ E, so DivisorFamilyZariskiGlue.lean:189-495 is subsumed — ~300 lines in two copies\
  \ needing sync.\n   Real fix: redefine the chart-typed five in terms of the Loc\
  \ five.\n\nWHY (b) WAS INVISIBLE FOR FOUR SESSIONS, the lane's generalisable finding.\
  \ A carrier that base\nchanges has TWO FACES of one operation: mapAlg (instance\
  \ tower) and mapAlgHom (bare AlgHom). They\nare interderivable in a few lines. The\
  \ widened carrier had the first only, while the vehicle indexes\nits compatibility\
  \ by Over.resAlgHom — a bare AlgHom. Every audit compared the widened layer to the\n\
  chart-typed one BY NAME, and by name the list was complete. Cheap check, to run\
  \ on any replacement\ntype: grep the new carrier's name OUTSIDE its defining files,\
  \ and exclude substring collisions\n(divFamZarAffineEquiv is chart-typed and matches\
  \ \"divFamZarAff\") before believing the count.\n\nTHE MIGRATION HALF HAS NOT STARTED,\
  \ and that is the honest scope of this node (I-0667, measured\n2026-07-29 with the\
  \ divFamZarAffineEquiv substring collision excluded). The STRUCTURAL half of\nI-0492\
  \ is complete; the migration is separate:\n * 49 Lean files still consume the chart-typed\
  \ DivFamZar;\n * partition0/partition1: 33 hits over 11 files, INCLUDING the carrier\
  \ fields\n   FinCoverData.partition0/.partition1 (DivisorFamily.lean:173-176) that\
  \ I-0492 clause 3 names as\n   what has to go;\n * widened names outside Picard/DivisorFamilyAff*:\
  \ exactly ONE file. One consumer is not a\n   migration.\nUntil consumers move,\
  \ the chart-typed carrier is still the live one and R2's field-uniformity is\nnot\
  \ yet reaching the DD-R gate -- which no sorry census or job count can see. Whoever\
  \ takes it\nshould use pullGlobalAff as the worked example (push forward along divFunctorToAff,\
  \ keep the\nrestriction equations) and expect the typing, not the mathematics, to\
  \ be the cost.\n"
