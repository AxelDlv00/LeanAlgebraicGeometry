summary: "DECIDED BY THE HUMAN 2026-07-28: R2 — GENERALIZE THE PIECE TYPE. Binding\
  \ form: protection I-0492.\nFull reasoning: I-0346 (human comment, same date).\n\
  \nEXECUTED. The widened certificate layer is sorry-free, axiom-clean and rooted\
  \ (fifteen\nDivisorFamilyAff*.lean files). Of the two obligations I-0492 clause\
  \ 4 relocated, 4(i) is\nDISCHARGED rather than assumed. Read the residue in the\
  \ CORRECTED form below, not in the form\nsessions 0006/0008 reported it.\n\n  AffCoverData\
  \          -- m / pieces : Fin m -> Opens / isAffineOpen / cover (iSup = top).\n\
  \                           NO pi argument, NO partitions of unity, NO Sum index,\
  \ NO chart typing.\n  AffAdaptation         -- eqn per piece + eqn_rel; IsCertified\
  \ with (c1)-(c4) VERBATIM.\n  CertifiedDivisorFamilyAff / IsLocallyCertifiedAff\
  \ / DivFamZarAff (mk, mk_eq_mk_iff, picClass)\n  DivFamZar.toAff       -- the widened\
  \ value RECEIVES every chart-typed one, same picClass\n  isCertified_of_swallowedBy_of_c1\
  \ -- cert-collapse: all seven clauses from (c1) + the rank datum\n  exists_isCertified_of_seed_of_swallowing_affineOpen\
  \ -- the endpoint at a seed\n  DivFamZarAff.mapAlg + the S5b layer (mapAlg_id/comp,\
  \ picClass_mapAlg, eq_of_away_eq)\n  DivFamZarAff.mapAlgHom + mapAlgHom_eq_mapAlg\
  \ -- the EXPLICIT-MAP face (session 0010)\n  divFamZarAff + divFamZarAffAffineEquiv\
  \ -- the widened vehicle and its affine collapse\n\nTHE RESIDUE IS TWO ITEMS OF\
  \ DIFFERENT KINDS (corrected 2026-07-28 session 0010; spec-dd-r\nADDENDUM 8). Sessions\
  \ 0006 and 0008 reported ONE, and that claim was true of the CERTIFICATE\nbut not\
  \ of the lane:\n\n (a) THE SUBORDINATE STACKS 0B8B INPUT. An affine open W with\
  \ supp d inside W, and W inside one\n     member of d.cover. Out of scope per I-0492\
  \ clause 2: USE it, do not re-derive it. Mathlib\n     has no form of 0B8B and this\
  \ tree constructs no curve but P1. Unchanged.\n\n (b) divFamZarAff.map ALONG AN\
  \ ARBITRARY MORPHISM OF TEST OBJECTS, and divFunctorAff on top of\n     it. This\
  \ is what DivRepGlobalData.pull_comp consumes. Priced as a PORT, not as mathematics:\n\
  \     its input is the base-side Zariski gluing keystone DivFamZar.exists_glue_of_away_compat\n\
  \     (DivisorFamilyZarGlue.lean), whose argument is entirely about the Zariski\
  \ cover of the BASE\n     -- which R2 did not touch. MEASURED 2026-07-28 s0010 and\
  \ the pricing is SHARPER than\n     \"a port\": awayGluedEquations (DivisorFamilyZariskiGlue.lean:454),\
  \ the divisor assembly\n     itself, projects only .eqns (8x) and .cover (7x, =\
  \ eqns.cover) across its whole body --\n     never .adaptation, never .certified\
  \ -- returns a bare LocalEquations and mentions pi zero\n     times, yet its DECLARED\
  \ input is the full chart-typed CertifiedDivisorFamily. That\n     STATEMENT/proof\
  \ mismatch is the blocker and no call-site cleverness removes it: a widened\n  \
  \   class has no chart-typed certificate at all, which is the CONTENT of R2. The\
  \ fix is to\n     restate the assembly at bare local-equation systems plus the pullback\
  \ regularity the\n     certificate used to supply, carried explicitly (Scheme.LocalEquations.PullRegular,\
  \ landed\n     with its open-immersion discharge; the restated assembly itself is\
  \ NOT landed). So (b) is\n     DECOMPOSED, not closed. Full argument: spec-dd-r\
  \ ADDENDUM 8 SS8.5 (132ac965a).\n\nWHY (b) WAS INVISIBLE FOR FOUR SESSIONS, and\
  \ it is the lane's generalisable finding. A carrier\nthat base-changes has TWO FACES\
  \ of one operation: mapAlg, taking an algebra-tower instance pack,\nand mapAlgHom,\
  \ taking a bare AlgHom. They are interderivable in a few lines. The widened carrier\n\
  had the first only. But the vehicle indexes its compatibility by Over.resAlgHom,\
  \ a bare AlgHom\ncarrying no tower, so divFamZar, divFunctor and DivRepGlobalData\
  \ are ALL spelled at the second.\nEvery audit compared the widened S5b layer to\
  \ the chart-typed one BY NAME, and by name the list\nwas complete. Cheap check that\
  \ would have caught it, and the one to run on any replacement type:\ngrep the new\
  \ carrier's name OUTSIDE the files defining it. It returned zero hits.\n"
