summary: 'CURRENT STATE 2026-07-27. The fixed two-chart DivFamZar is a proper subfunctor
  of relative effective divisors, so the certificate lane must be widened before it
  can cover Pic0. R1, varying the P1 coordinate, is selected after auditing R2 and
  R3. LANDED: the GL2 action and twisted relative covers (p1-aut), plus noncircular
  fibre avoidance over infinite ground fields (fibre-avoid). REJECTED: cert-relocalize
  cannot put the twist quantifier inside one DivRepGlobalData equivalence because
  that equivalence and all theta data are fixed in pi. ACTIVE SUCCESSORS: twist-atlas
  builds an outer atlas of fixed-twist classifiers and glues them on common divisor
  loci; finite-field-avoid proves a degree-bounded finite-cardinality variant and
  connects it to finite Galois descent. After those, the certificate-production chain
  continues through swallow-adapt, cert-collapse, and cert-assemble. The parent remains
  blocked on ordinary formalization work, not on a human decision.'
