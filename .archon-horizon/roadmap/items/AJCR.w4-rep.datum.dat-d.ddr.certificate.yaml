summary: 'ROUTE CHANGED (2026-07-25). The gate is no longer a global certificate over
  the chart ring. Consumers (DivFamZar, divRepPullAt, DivRepAffinePullback.pull, divRepClassifyZar)
  need only IsLocallyCertified, so the certificate may be produced one base prime
  at a time over a Localization.Away chart -- with the adaptation free by extraction.
  zar-gate is LANDED and kernel-checked (the relaxation, the pointwise gate via quasi-compactness,
  the Away-form support tube, and no-leak from support containment). The degree input
  hdeg is also already proved. What remains is exactly: tube-fibre (put the support
  fibre at one prime inside one piece), away-kerspan (the Cech-kernel spanning submodule
  over the Away chart), away-assemble (composition). The old I-0209 obstruction blocks
  only the abandoned global clause.'
