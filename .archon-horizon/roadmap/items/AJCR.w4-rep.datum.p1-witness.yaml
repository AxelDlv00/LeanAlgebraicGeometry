summary: 'DONE pic-g (0096 r5). Row consumed: the field-test vanishing IS PROVED,
  by pic-c''s Picard/Pic0VanishingFieldTest.lean at any genus-0 curve with P1 as a
  corollary. This row''s job was to make that instantiable.


  LANDED, r3: Curve/P1Curve.lean + Curve/P1H1Vanishing.lean -- the three curve binders
  and genus = 0 at P1.asOver k over an ARBITRARY field, rooted, axiom-clean. Before
  r3 no AJCR object satisfied the package at all, so none of rep''s ~93 consumer theorems
  could be instantiated at a concrete curve. That is the durable content of this row.


  LANDED, r5, and DOWNGRADED after audit (I-1633): Curve/P1DegreeZeroTrivial.lean
  is a COROLLARY LAYER, not an independent result -- all four of its declarations
  follow from pic-c''s Pic0VanishingFieldGenusZero alone, which landed 7 minutes earlier
  and is general in the curve. I verified the subsumption myself. The one part not
  duplicated is eq_of_classDeg_eq_baseChange (no Injective (classDeg) statement exists
  elsewhere). Also Algebra/LaurentUnits.lean: the Laurent unit group R^x x Z, with
  the necessity of IsDomain now a THEOREM rather than the prose assertion I first
  shipped (I-1634).


  WITHDRAWN, r5: my r3 pricing said the remaining step needs relative Pic(P1_T) =
  Pic(T) x Z, ''substrate-building, not a residue''. Right about the RING case; false
  about the FIELD case, which closed through the chi-ledger with no relative-Pic computation
  at all.


  SURVIVING OBLIGATION: forall k-ALGEBRA A, Subsingleton (pic0Subgroup (P1.asOver
  k) (overSpec k A)), content Pic(P1_A) = Pic(A) x Z. Tracked at pic0-affine-reduction
  (pic-c), not here.


  WHAT I KNOW ABOUT ROUTES TO IT, with the audit''s correction (I-1635) applied --
  I earlier called two routes FORECLOSED and only one of those clauses was audited:

  * MEASURED: Subsingleton (CommRing.Pic (Polynomial k)) is inferInstance at a FIELD
  and synthInstanceFailed at a general [CommRing A], failing even when GIVEN Subsingleton
  (CommRing.Pic A). Zero mathlib files match seminormal or traverso. So a chart-by-chart
  argument has no instance to stand on over a ring.

  * QUOTED, NOT VERIFIED HERE: that Pic(A[t]) = Pic(A) holds EXACTLY for seminormal
  A is Traverso-Swan, mathematics from outside this formalization. It explains the
  failed instance search; it is not a formalized no-go and I should not have written
  it as one.

  * MEASURED: subsingleton_pic0_of_affine (Pic0VanishingRoute.lean:283) runs one way
  and its hypothesis is vanishing of the whole picEt, which is false at P1 where a
  degree-one class exists.'
