id: AJCR.w4-rep.datum.p1-witness
title: 'P1 WITNESS: AJCR now has a curve and genus(P1)=0; one input remains to a JacobianData
  at P1 (relative Pic0 vanishing) and two more to the challenge target'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'DONE pic-g (0096 r5): the P1 witness has served its purpose -- the field-test
  vanishing IS PROVED, by pic-c''s Picard/Pic0VanishingFieldTest.lean at any genus-0
  curve with P1 as a corollary. This row''s job was to make that instantiable, and
  it is now consumed.


  LANDED across r3 and r5, all rooted and axiom-clean:

  * Curve/P1Curve.lean + Curve/P1H1Vanishing.lean (r3): the three curve binders and
  genus = 0 at P1.asOver k over an ARBITRARY field. Before r3 no AJCR object satisfied
  the package at all, so none of rep''s ~93 consumer theorems could be instantiated
  at a concrete curve.

  * Curve/P1DegreeZeroTrivial.lean (r5): chi(O) = 1 at the BASE-CHANGED curve P1_K
  for every field extension K/k -- the input GenusZeroDegreeTrivial''s author recorded
  as not elaborated at any concrete curve -- plus eq_of_classDeg_eq_baseChange, the
  degree DETERMINES the class.

  * Algebra/LaurentUnits.lean (r5): units of R[T;T^-1] over a domain. Mathlib''s whole
  IsUnit API there is isUnit_T. NOT on the critical path -- it computes the GROUP,
  not the vanishing.


  WITHDRAWN, r5: my r3 pricing said the remaining step needs relative Pic(P1_T) =
  Pic(T) x Z, ''substrate-building, not a residue''. Right about the RING case, WRONG
  about the FIELD case, which pic-c and I independently closed in the same hour through
  the chi-ledger with no relative-Pic computation. I deleted my duplicate; pic-c''s
  is more general.


  SURVIVING OBLIGATION, sharp and singular: forall k-ALGEBRA A, Subsingleton (pic0Subgroup
  (P1.asOver k) (overSpec k A)) -- content Pic(P1_A) = Pic(A) x Z, cohomology and
  base change. Tracked at pic0-affine-reduction (pic-c), not here. Two routes FORECLOSED,
  not merely unattempted: the chart route needs Pic(A[t]) = Pic(A), i.e. Traverso,
  true exactly for seminormal A and absent from mathlib entirely; and subsingleton_pic0_of_affine''s
  hypothesis is vanishing of the whole picEt, false at P1 where a degree-one class
  exists.'
