summary: "CHART-U(a)/(b): DONE, and as of 2026-07-29 UNCONDITIONAL at a GENERAL TEST.\n\
  \nWHAT LANDED THIS PASS (run 0072 s0010, lane ajcr-charts, commit 2b6228f6a):\n\
  IsSplitWitnessIsoInvariant is DISCHARGED (Picard/Pic0ChartLocusIsoInvariance.lean),\
  \ which was the\nONE input between the landed affine openness and isOpen_chartLocus\
  \ over a general test. So\nisOpen_chartLocus_of_affineLocal' and chartLocus_fromSpecAffine_eq_preimage'\
  \ now carry NO\nhypothesis. This row is closed as far as (a)/(b) go.\n\nTHE PREDICTION\
  \ ON THIS ROW WAS HALF RIGHT, AND THE MISSING HALF IS THE TRANSFERABLE PART.\nBoth\
  \ this row and c9b priced the residue as \"PicEtAff.map_map plus map_id, not geometry\"\
  . True of\nthe CLASS side: map_mapAlg_eq_map (map_map with an explicit AlgHom into\
  \ a common target) plus\npicEtAffineEquiv_naturality, with the witness clause carried\
  \ through untouched.\n\nWhat neither row mentioned is the INSTANCE side, which is\
  \ the actual content. IsSplitWitness\nexistentially quantifies a splitting field\
  \ L TOGETHER WITH FOUR INSTANCES about L over the reading\nfield (Algebra, IsScalarTower,\
  \ Module.Finite, Algebra.IsSeparable). Transporting along\ne : K equiv K' keeps\
  \ THE SAME L and must re-derive all four over K' along e.symm: two by\nIsScalarTower.of_algebraMap_eq,\
  \ two by mathlib transports stated for exactly that commuting square\n(Module.Finite.of_equiv_equiv,\
  \ Algebra.IsSeparable.of_equiv_equiv). RULE: price the instances a\npredicate quantifies,\
  \ not only its data.\n\nTWO BRICKS NOBODY HAD, both about testPoint and both now\
  \ supplied:\n 1. Over.testPointFieldMap_comp_algebraMap -- the residue-field extension\
  \ a morphism of tests\n    induces is a k-ALGEBRA map. The tree recorded it only\
  \ as an Algebra over the SOURCE field\n    (testPointFieldAlgebra), and without\
  \ the k-compatibility it cannot feed PicEtAff.mapAlg at\n    all. It is Spec.preimage\
  \ of the testPoint_comp_left square plus the two Over triangles.\n 2. Over.testPoint_comp\
  \ -- the same naturality square as an equality of morphisms IN THE SLICE,\n    through\
  \ Over.overSpecMap. Pic0ChartTestPoint states it only for the underlying scheme\n\
  \    morphisms, but picEtMap is indexed by Over-morphisms, so every class-level\
  \ transport needs\n    this form.\n\nAND THE IsIso HYPOTHESIS IS NOT PACKAGING --\
  \ checked, expecting it to be. The transported\nAlgebra K' L is algebraMap K L composed\
  \ with e.symm, so it needs e SURJECTIVE. Along a\nnon-invertible K -> K' the old\
  \ L carries no K'-structure at all and one must base-change L, which\nis the separable\
  \ route (exists_witness_of_separable_extension) and strictly harder. Do not weaken\n\
  that hypothesis to an AlgHom anywhere.\n\nThe two 2026-07-28 corrections on this\
  \ row stand: testPointField_affineOpen_iso was advertised and\nabsent (supplied\
  \ as testPointField_fromSpecAffine_isIso, I-0650), and \"needs no new mathematics\"\
  \nwas false by exactly the one lemma now proved.\n"
