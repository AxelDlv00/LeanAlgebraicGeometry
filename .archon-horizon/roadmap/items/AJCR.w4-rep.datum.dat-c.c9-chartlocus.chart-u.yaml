summary: "THE CO-SIGNED BRICK. chartLocus and isOpen_chartLocus. DONE as of 2026-07-26;\
  \ EXTENDED TO A\nGENERAL TEST 2026-07-28 (run 0072 s0008, lane ajcr-charts).\n\n\
  WHAT LANDED THIS PASS: isOpen_chartLocus_of_affineLocal\n(Picard/Pic0ChartLocusGeneralTest.lean)\
  \ -- chartLocus open over every affine-open test object\nimplies open over T. Pic0ChartLocusIsOpen's\
  \ docstring promised exactly this \"by the affine-piece\nlocality of transport (iii)\
  \ ... needs no new mathematics\". The assembly is proved; TWO of its\nstated ingredients\
  \ were not where the tree said they were, and both corrections are the point of\n\
  this row:\n\n 1. ADVERTISED-BUT-ABSENT (I-0624). Pic0ChartTestPoint's header justifies\
  \ chart-independence\n    being free by \"the chart comparison becomes a lemma (testPointField_affineOpen_iso)\
  \ instead\n    of a side condition. That is the whole reason this file is short.\"\
  \ NO DECLARATION OF THAT\n    NAME EXISTS anywhere in the workspace -- the sole\
  \ occurrence was that sentence, and it was\n    load-bearing prose (cited as the\
  \ reason a side condition is unnecessary). Now supplied as\n    testPointField_fromSpecAffine_isIso,\
  \ and for a DIFFERENT reason than the header implies: not\n    a Spec.residueFieldIso\
  \ computation but the structural fact that fromSpecAffine is an OPEN\n    IMMERSION\
  \ on carriers, and mathlib already knows an open immersion induces an ISO of residue\n\
  \    fields (Scheme.instIsIsoCommRingCatResidueFieldMapOfIsOpenImmersion).\n\n 2.\
  \ \"NEEDS NO NEW MATHEMATICS\" IS FALSE, BY EXACTLY ONE LEMMA. The tree's landed\
  \ fibre-field\n    invariance is about HasWitnessH1Vanishing; nothing transports\
  \ IsSplitWitness along a field\n    ISO (measured: its only invariance mentions\
  \ are two docstring sentences). Isolated as\n    IsSplitWitnessIsoInvariant, and\
  \ CHECKED NON-VACUOUS -- Iff.rfl fails, the two sides are not\n    definitionally\
  \ equal, so this is a real obligation and not a restatement. Believable and\n  \
  \  small: along an iso the same L presents the transported class, so it should be\n\
  \    PicEtAff.map_map plus map_id, not geometry.\n\nAlso corrected: the locality\
  \ bookkeeping is NOT the isOpen_iff_forall_isOpen_inter the docstring\nnames, because\
  \ the affine piece's locus lives in a DIFFERENT SPACE (Spec Gamma(T.left,U), not\n\
  T.left). The bridge is IsAffineOpen.range_fromSpec plus the image of an open immersion;\n\
  chartLocus_fromSpecAffine_eq_preimage carries it, and it also DISCHARGES transport\
  \ (i) for the\naffine-piece maps in BOTH directions (a one-sided containment would\
  \ not give openness).\n\nNEXT ON THIS ROW: prove IsSplitWitnessIsoInvariant. It\
  \ is the only input between the landed\naffine openness and isOpen_chartLocus over\
  \ a general test.\n"
