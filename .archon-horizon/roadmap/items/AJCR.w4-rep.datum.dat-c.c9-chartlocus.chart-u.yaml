summary: "THE CO-SIGNED BRICK, opened 2026-07-26 (run 0048 round 2) after the C9a-0\
  \ rescope made clear\nthat nothing in the tree implements it.\n\n`chartLocus c lambda`\
  \ (w4-datc-worksheet.md §3.3, CHART-U(a)) is a locus over a GENERAL TEST\nT, indexed\
  \ by a plus class lambda in pic0Subgroup C (Over.mk a), at the TWISTED fibre class\n\
  lambda_t . theta^m . (-Sigma).  w4-datb-worksheet.md §1.6 CO-SIGNS it with two amendments\n\
  that the DAT-C lane was asked to acknowledge BEFORE EITHER LANE BUILDS:\n  (a) for\
  \ arbitrary plus classes the predicate is the SPLIT form -- for some (equivalently\n\
  \      every) finite separable L/kappa(t) splitting the collapsed class, h^0 = 1\
  \ and h^1 = 0;\n  (b) the openness route of record is: reduce to affine pieces;\
  \ collapse to PicEtAff.mk E x;\n      extract a cocycle datum over the etale carrier;\
  \ TWIST it by the theta layer + DAT-C's\n      GAP-1 inverse datum; descend to a\
  \ Noetherian stage (RE-5); fire the engine there; then\n      transports (i) descent-preimage,\
  \ (ii) etale-image openness, (iii) affine gluing.\n`isOpen_chartLocus` is dat-b\
  \ row B-4's ASSEMBLY of (i)/(ii) against DAT-C's shifted-datum\nhalf.\n\nINPUT STATUS\
  \ 2026-07-26: transport (0) -- the class-indexation of the engine output -- is\n\
  LANDED (leaf c9a).  Still missing, all three: the SHIFTED-DATUM CONSTRUCTOR (DAT-C\
  \ GAP-1;\nthere is no BasicOpenCocycleDatum.mul or tensor anywhere, so the twist\
  \ has no route), the\nSPLIT predicate (a-amendment), and transports (i)/(ii) (DAT-B).\
  \  None of the three is\ndivRep-gated, so all three are launchable cold.\n\nDO NOT\
  \ let a lane cite isOpen_cechWitnessLocus as if it were isOpen_chartLocus.  It is\n\
  strictly weaker: affine base, untwisted class, no split, no transports.\n"
