summary: "CHART-U(a)/(b). REOPENED 2026-07-29 (run 0072 r6, lane ajcr-charts) FROM\
  \ done, BY THE LANE THAT\nCLOSED IT, and then advanced. Read the reopening before\
  \ the progress.\n\nWHY IT IS REOPENED. This row was set done at r5/s0010 on the\
  \ strength of\nisSplitWitnessIsoInvariant_holds, which removed the ONE hypothesis\
  \ standing between the landed\nAFFINE openness and general-test openness. That is\
  \ true and stands. What the closure missed is\nthat isOpen_chartLocus_of_affineLocal'\
  \ STILL TAKES haff -- the affine-local openness at every\naffine open of the test\
  \ -- and NOTHING IN THE TREE DISCHARGES IT:\n\n * isOpen_chartLocus_of_affineLocal'\
  \ (Pic0ChartLocusIsoInvariance.lean) passes haff straight\n   through to isOpen_chartLocus_of_affineLocal\
  \ (Pic0ChartLocusGeneralTest.lean), which also\n   passes it through;\n * the affine\
  \ case that would feed it, isOpen_setOf_isSplitWitness_of_presentation\n   (Pic0ChartLocusIsOpen.lean:321),\
  \ is itself conditional on IsChartDatumPresentation.\n\nSo \"CHART-U(b) at a general\
  \ test is UNCONDITIONAL\" was true only of the iso-invariance\nhypothesis, and the\
  \ row read it as unconditional simpliciter. The consequence propagated: the\nc9b\
  \ row and Pic0ChartUnivReduce's headline both said the chart-locus open \"costs\
  \ zero\" / \"needs\nnothing\", which made B-4's residue invisible to a census. RETRACTED\
  \ at all four asserting sites\n(8fc0df182, c401ed616).\n\nMEASURED, not inferred:\
  \ chartLocusOpens had ZERO consumers in the whole tree at r6 start, and\nhaff appears\
  \ only as an argument position -- which is exactly why an unnamed hypothesis in\
  \ a\nDEFINITION's signature is invisible to a search for open obligations.\n\nWHAT\
  \ LANDED THIS PASS, all sorry-free, rooted, kernel EXIT=0 with the lakefile linter\
  \ options in\nforce, and axiom-clean against a control that fires sorryAx:\n\n *\
  \ ChartLocusAffineLocal (Pic0ChartCoverageAbel.lean) -- the haff residue NAMED,\
  \ so it appears\n   in a census. chartLocusOpens' carries the dependency explicitly\
  \ in the API.\n * chartLocusAffineLocal_of_presentation -- THE RESIDUE REDUCED TO\
  \ B-4'S OWN NAMED OBLIGATION:\n   a per-affine-piece IsChartDatumPresentation gives\
  \ haff. This is the link\n   Pic0ChartLocusIsOpen's docstring DESCRIBES (\"not stated\
  \ here only because it would need the\n   presentation hypothesis per affine piece\"\
  ) and never states. IsFinite pi, not IsAffineHom pi,\n   is what that route needs\
  \ -- the rigid engine.\n * abelChartApp_eq -- the Abel chart's value at a point\
  \ of the divisor scheme, BOTH components.\n * hasWitnessH1Vanishing_of_isSplitWitness_at\
  \ (Pic0ChartPresentationConverse.lean) -- hconv, THE\n   DESCENT DIRECTION, DISCHARGED.\
  \ Open as B-4's named residue for three sessions.\n * isChartDatumPresentation_of_plusFibre\
  \ -- IsChartDatumPresentation with no separate hconv.\n * towerOfResidueFieldExtension\
  \ -- htow is bookkeeping, not an obligation (Algebra A L does NOT\n   synthesize;\
  \ measured, which is why this had to be stated).\n * isChartDatumPlusFibreAt_self\
  \ -- non-vacuity, in the sharp form: at L := kappa(t) the new\n   predicate IS IsChartDatumPlusFibre\
  \ by Iff.rfl, so hplus's extra strength over hfib is exactly\n   \"the same identity\
  \ at every extension\" and nothing else.\n\nTHE TRANSFERABLE LESSON, and it is the\
  \ second one this row has produced about pricing:\nr5's lesson was PRICE THE INSTANCES\
  \ A PREDICATE QUANTIFIES, NOT ONLY ITS DATA. This pass's is\nCHECK WHAT A \"DISCHARGED\"\
  \ THEOREM STILL TAKES. Pic0ChartPresentationHalf priced hconv as \"two\ningredients\
  \ both exist but composing them is not a rewrite\", naming two TRANSPORT lemmas.\
  \ The\ndiagnosis of the obstruction was right and the ingredient list was short\
  \ by one, and the missing\none was not a transport: PicEtAff.unit_injective (CechKernelLemma.lean:361,\
  \ Kleiman 2.5(1), the\nunconditional close of the zeta3 campaign) plus relPicMk_injective_of_subsingleton\
  \ force the\npresenting class to EQUAL D's fibre class at L_t, which is what \"\
  visibly in D's class\" needed.\nBOTH HAVE BEEN IN THE TREE FOR WEEKS AND NO CHART-U\
  \ ROW CITES EITHER.\n\nSTATE NOW. Both halves of the pointwise presentation are\
  \ witness-free, H1-free and divisor-free:\nthe forward half already was (trivial\
  \ splitting), the converse now is. So the whole of\nCHART-U(b) reduces to a cechPicClass\
  \ base-change identity -- which is what this row's own\n2026-07-28 correction 2\
  \ predicted (\"a cechPicClass base-change statement, and not any\nconstruction\"\
  ). The one place the reduction is not tight, stated in the file rather than hidden:\n\
  the identity is wanted at EVERY extension of kappa(t), strictly more than IsChartDatumPlusFibre\n\
  asks, and isChartDatumPlusFibreAt_self measures that gap.\n\nThe two 2026-07-28\
  \ corrections on this row stand: testPointField_affineOpen_iso was advertised\n\
  and absent (supplied as testPointField_fromSpecAffine_isIso, I-0650), and \"needs\
  \ no new\nmathematics\" was false by exactly the one lemma proved at s0010. And\
  \ the IsIso hypothesis of the\niso-invariance is load-bearing, not packaging --\
  \ do not weaken it to an AlgHom.\n"
