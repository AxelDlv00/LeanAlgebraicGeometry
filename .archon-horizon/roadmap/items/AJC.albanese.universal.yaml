summary: 'Albanese universal property. CORRECTED run 0069: the headline is NOT sorry-free.


  Measured: #print axioms AlgebraicGeometry.Pic0.albanese_universal_property = [propext,
  sorryAx, Classical.choice, Quot.sound]. The assembly from descentThroughBirationalSigma
  and albanese_eq_iff_symmetricPower_eq is honest and the statement is the right one,
  but it inherits sorryAx from all six unproved AlbaneseUP declarations -- decisively
  from abelJacobi, which is a sorry-BODIED DEFINITION, so the equation phi = abelJacobi
  C P0 >> psi does not yet say what it is meant to say. Must not be reported as a
  landed theorem. File header and theorem docstring corrected in run 0069.


  REAL INPUTS THAT NOW EXIST: extend_to_av (Milne Thm 3.2) is unconditional and axiom-clean
  as of run 0069 (Milne Lemma 3.3 closed, commit 8a5dc2a66); and the whole RigidityLemma.lean
  chain is sorry-free and axiom-clean, so step 4''s homomorphism property (Milne Cor
  I.1.2) has its input.


  descentThroughBirationalSigma is now blocked UPSTREAM of the extension rather than
  at it: producing the rational map needs the dense open where f^{(g)} is an isomorphism
  plus a way to invert it there, and mathlib has no birational-inverse API at this
  pin (checked Birational/{RationalMap,Dominant}.lean).


  THE EXTENSION HALF IS NOW DISCHARGED (commit 2e58d6cd1). Scheme.RationalMap.exists_unique_hom_restrict_eq_of_dense_open
  (Albanese/DenseOpenDescent.lean, axiom-clean) gives: for ANY dense open V of a nonsingular
  k-bar-variety and ANY compatible morphism h : V -> A into an abelian variety, a
  UNIQUE g : X -> A with V.iota >> g = h. No rational map in the statement; the enabling
  bridge hom_toRationalMap_eq_partialMap_iff discharges the RationalMap quotient once.
  So what remains in descentThroughBirationalSigma is producing V and h -- i.e. Sym^g
  C and f^{(g)} existing at all, plus Milne III.5.1(a) birationality as a SECTION
  of f^{(g)} over a dense open.

  '
