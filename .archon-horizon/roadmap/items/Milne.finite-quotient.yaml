summary: 'Pending source node prop:milne-finite-quotient. Stable quotient opens, order/equality
  reflection, finite-cover reconstruction data, functorial chart transitions, and
  within-one-affine-ring localization cocycle laws are verified. Actual quotient and
  source structure-sheaf sections on invariant basic opens are identified with fixed/full
  localizations; restriction naturality and the equation q.app D(b) = ((A[1/b])^G
  -> A[1/b]) hold under these presentations. These local APIs are not yet consumed
  by cross-chart gluing. Remaining: compare quotient overlaps coming from different
  affine coordinate rings, construct canonical transition isomorphisms and the triple
  cocycle for genuine Scheme.GlueData, then prove the global topology/sheaf clauses,
  arbitrary-target universal property, and free-action etaleness.'
