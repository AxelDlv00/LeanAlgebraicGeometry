id: AJC.fbc.exactness
title: Flat pullback preserves finite limits (bypassed on quasi-coherent objects;
  arbitrary-module case open)
projects:
- Algebraic-Jacobian-Challenge
summary: "BYPASSED, NOT PROVED -- and the arbitrary-module form should NOT be attempted\
  \ (run 0068 r1, ajc-fbc).\n\npullback_preservesMonomorphisms (flat g^* preserves\
  \ monos of ARBITRARY O_S-modules) is genuinely\nwalled: mathlib gives SheafOfModules.pullback\
  \ no pointwise model, and the sibling\nMR0555258-Compactifying-Picard independently\
  \ reduced j_! to the same missing brick. It is also NOT\nNEEDED. Every consumer\
  \ instantiates flat exactness at QUASI-COHERENT objects, where it is now proved\n\
  sorry-free:\n\n * pullback_preservesKernel_of_isQuasicoherent -- general flat g,\
  \ affine base, any map of\n   quasi-coherent modules -- via cone-cancellation (preservesLimit_comp_cancel)\
  \ off the tilde-image\n   exactness already in the tree, plus the FULLNESS of tilde;\n\
  \ * mapHomologicalComplexHomologyIso_of_preservesKernel -- because ShortComplex.mapHomologyIso\
  \ needs\n   ONE KERNEL per degree, not global exactness;\n * cech_flatBaseChange_of_termsQuasicoherent\
  \ -- the capstone with the leaf out of its proof term.\n\nMEASURED, not asserted:\
  \ axiom-frontier's leakProbe_qcohRoute_kernel / _homologyIso / _coneCancel and\n\
  leakWitness_qcohRoute_nonvacuous all report clean, while leakControl_qcohRoute_oldRoute\
  \ (same\nconclusion, old route) still reports sorryAx. All four explicit binders\
  \ of the main theorem verified\nload-bearing with populated breaks.\n\nREMAINING\
  \ on this row is BOOKKEEPING, not mathematics. A reviewer (I-0580) correctly refuted\
  \ this\nrow's earlier claim that closure of quasi-coherence under FINITE PRODUCTS\
  \ was absent from mathlib and\nthis workspace: over an affine base -- the only case\
  \ stated -- it follows in a few lines from\nessImage_tilde_of_isQuasicoherent, and\
  \ is now landed as isQuasicoherent_pi_of_isAffineBase (79a30f40d).\nSo discharging\
  \ h2/h3 of cech_flatBaseChange_of_termsQuasicoherent is a matter of matching the\
  \ two\n(CechComplex).sc i terms to the sigma-product decomposition through pushPull_sigma_iso.\
  \ The\ngeneral-BASE product statement is a genuine gap; no consumer needs it.\n\n\
  The :681/:707 sorry stays as a monument to the reduction; do not price it.\n"
