summary: "Flat pullback preserves finite limits. A DELIBERATE MONUMENT, NOT A FRONTIER\
  \ -- do not spend a\nsession here, and read this before treating the task brief's\
  \ priority ordering as current.\n\nWHY IT IS OFF THE PATH, measured across run 0068\
  \ r1/r2:\n * pullback_preservesMonomorphisms quantifies over ALL O_S-modules, and\
  \ over an affine base\n   Scheme.Modules is strictly larger than ModuleCat of the\
  \ global sections (tilde is fully faithful\n   but not essentially surjective).\
  \ Mathlib gives SheafOfModules.pullback no pointwise model, so the\n   general statement\
  \ is walled -- the sibling MR0555258-Compactifying-Picard independently reduced\n\
  \   j_! to the same missing brick.\n * The obligation was MIS-SCOPED. Every consumer\
  \ instantiates flat exactness at QUASI-COHERENT\n   objects, and there it is PROVED,\
  \ sorry-free: pullback_preservesKernel_of_isQuasicoherent, by\n   cone-cancellation\
  \ off tilde-image exactness plus fullness of tilde.\n * The homology comparison\
  \ needs ONE KERNEL PER DEGREE, not global exactness, so\n   pullback_mapHC_homologyIso_of_isQuasicoherent\
  \ is an axiom-clean replacement.\n * MEASURED r2: closing it would clean only the\
  \ two probes that NAME it. cech_flatBaseChange_qcoh\n   never touches it and is\
  \ dirty for an unrelated reason.\n\nSTATUS NOTE, deliberate: pullback_preservesFiniteLimits\
  \ and pullback_preservesHomology are NOT\ninstances. They were, and that was worse\
  \ -- as instances they were picked up by synthesis, so\ndeclarations merely quantifying\
  \ over them reported clean axioms while every SYNTHESIS SITE silently\nacquired\
  \ sorryAx. Demoted at r1. Do not restore the attribute before the carrier is proved.\n\
  \nThe task brief for ajc-fbc still calls this \"one of only two sorry-bodied INSTANCES\
  \ that leak through\ntypeclass synthesis\" and names it THE priority. That was true\
  \ when the brief was written and is not\ntrue at HEAD; the lane's own r1 made it\
  \ stale.\n\nLeft `pending` rather than `rejected`: the statement is TRUE and someone\
  \ may want it if mathlib grows\na pointwise model for module pullback. It is simply\
  \ not on the route to Stacks 02KH.\n"
