summary: 'BYPASSED AND NOW ALSO OFF THE HYPOTHESIS LIST -- and the task brief that
  calls this the PRIORITY is stale (run 0068 r2).


  WHY THE BRIEF IS STALE, since it will be read again: it says pullback_preservesFiniteLimits
  is one of only two sorry-bodied INSTANCES leaking through typeclass synthesis, which
  made closing it worth more than its line count. That was true when written. r0 de-instanced
  it -- it is a plain theorem, and the file''s own census reports 0 instance carriers
  -- so the synthesis-leak argument no longer applies. The arbitrary-module statement
  should NOT be attempted.


  MEASURED ANSWER to the brief''s real question (which declarations become clean if
  this lands): ONLY the two probes that name it. Nothing else in the lane routes through
  it. cech_flatBaseChange_qcoh does not touch it and is still dirty, for an unrelated
  reason.


  WHAT REPLACED IT, all sorry-free: pullback_preservesKernel_of_isQuasicoherent (r1)
  plus, this session, isQuasicoherent_cechComplex_X -- which discharges the two quasi-coherence
  hypotheses h2/h3 that the bypass route previously had to ASSUME. So cech_flatBaseChange_qcoh
  now has the full cech_flatBaseChange conclusion, no flat-exactness leaf in its proof
  term, and NO extra hypotheses.


  The mono statement stays a MONUMENT: keep it for the reduction''s legibility, do
  not prove it, route new work through the _of_isQuasicoherent forms. mathlib gives
  SheafOfModules.pullback no pointwise model and a sibling project hit the same brick
  for j_!; over an affine base Scheme.Modules is strictly larger than ModuleCat, so
  the tilde route cannot reach arbitrary modules. Status pending rather than active:
  this is deliberately not a frontier.'
