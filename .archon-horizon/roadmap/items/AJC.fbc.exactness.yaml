id: AJC.fbc.exactness
title: Flat pullback preserves finite limits
projects:
- Algebraic-Jacobian-Challenge
summary: 'Flat pullback preserves finite limits. REDUCED TO ONE CARRIER; the synthesis-leak
  MECHANISM is closed project-wide (run 0068). NOT closed as mathematics.


  THE LEAK MECHANISM IS GONE. pullback_preservesFiniteLimits and pullback_preservesHomology
  are no longer `instance`s -- the attribute WAS the leak: it let synthesis inject
  sorryAx at sites that never named the sorried declaration. Verified both directions:
  for a general flat g, `inferInstance` for PreservesFiniteLimits (pullback g) now
  FAILS, whereas before it elaborated and reported sorryAx. Combined with ajc-etale-pic
  demoting instHasPicScheme the same day, the project now has ZERO sorry-bodied instances:
  21 theorem + 7 def + 0 instance = 28 carriers, re-derived with axiom-frontier''s
  own keyword census.


  PROVED, sorry-free and Ground-verified axiom-clean: preservesFiniteLimits_of_preservesMonomorphisms
  (additive + right exact + mono-preserving => left exact); Modules.injective_app_of_mono
  / mono_of_injective_app / mono_of_injective_app_isBasis (monos of O_X-modules are
  sectionwise, both directions, incl. basis-local); Scheme.OpenCover.isBasis_image_opens
  + Modules.mono_of_mono_restrict (mono-checking is COVER-LOCAL); Modules.restrictFunctor_preservesMonomorphisms
  + pullback_preservesMonomorphisms_of_isOpenImmersion (the OPEN-IMMERSION case, outright);
  tildePullbackNatIso + tildePullback_preservesFiniteLimits (the AFFINE case on the
  tilde image).


  THE SOLE RESIDUAL is pullback_preservesMonomorphisms: g flat => g^* preserves monos,
  for ARBITRARY modules. Three of its four ingredients now exist. THE GAP, precisely:
  the affine case is available only on the tilde image (quasi-coherent modules), while
  the statement quantifies over all modules, and over an affine base Scheme.Modules
  is strictly larger than ModuleCat -- tilde is not an equivalence. Next target: mono-preservation
  for the AFFINE pullback on arbitrary modules. Deducing it from the quasi-coherent
  case would need quasi-coherent modules to generate, which is false.


  DEAD END, do not retry: the presheaf-pullback / sheafification factorisation. Its
  outer two factors DO synthesise their PreservesFiniteLimits instances on the scheme
  site (checked), so the categorical glue was never the gap; its middle factor is
  characterised as a left adjoint with no pointwise description, i.e. it needs the
  same missing stalk model. Reasons are in the docstring of pullback_preservesMonomorphisms.


  MEASURED WITH CONTROLS in scripts/axiom-frontier.lean (restated this run because
  the old identity-argument probe went VACUOUSLY clean after de-instancing): leakControl_pullback_finiteLimits_given_monos
  and leakControl_pullback_monos_openImmersion are axiom-clean; the two probes over
  a general flat g leak, as they must. Frontier at session end 147/95/52. NO previously-contaminated
  declaration became clean.

  '
