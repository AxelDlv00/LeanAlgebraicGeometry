summary: "Flat pullback preserves finite limits. NOT ON THE CRITICAL PATH, and the\
  \ \"instance leak\" that made\nit the task brief's stated priority NO LONGER EXISTS\
  \ (re-measured run 0068 r5).\n\nTHE BRIEF'S FRAMING IS STALE, and this row is where\
  \ a fresh session will act on it, so it is\ncorrected here (full measurement in\
  \ I-0756):\n * \"pullback_preservesFiniteLimits is one of only two sorry-bodied\
  \ INSTANCES leaking through\n   typeclass synthesis\" -- it is NOT an instance.\
  \ This lane demoted it at r1 for exactly that leak\n   reason; the file says so\
  \ at its header. And the project now has ZERO sorry-bodied instances\n   (grep for\
  \ `instance ... := sorry` returns nothing). There is no leak to close, and no\n\
  \   contaminated declaration for closing it to clean.\n * r2 separately measured\
  \ that discharging it would clean only the two probes that name it.\n\nWHY NOTHING\
  \ NEEDS IT. Flat left-exactness was being demanded at the strongest generality that\
  \ makes\nthe sentence true, while every consumer instantiates it at QUASI-COHERENT\
  \ objects, where it is\nPROVED sorry-free by pullback_preservesKernel_of_isQuasicoherent\
  \ (cone-cancellation off the\ntilde-image exactness, plus fullness of tilde). And\
  \ the homology comparison the Cech proof consumes\nneeds only ONE KERNEL PER DEGREE\
  \ (mapHomologicalComplexHomologyIso_of_preservesKernel), not global\nexactness --\
  \ so pullback_mapHC_homologyIso_of_isQuasicoherent is an axiom-clean replacement.\n\
  Measured: the leakProbe_qcohRoute_* lines are clean while leakControl_qcohRoute_oldRoute\
  \ (same\nconclusion, old route) still reports sorryAx.\n\nWHAT REMAINS OPEN, honestly:\
  \ pullback_preservesMonomorphisms for ARBITRARY O_S-modules, walled --\nmathlib\
  \ gives SheafOfModules.pullback no pointwise model, and the sibling project\nMR0555258-Compactifying-Picard\
  \ independently reduced j_! to the same missing brick. It should not be\nattempted\
  \ from this row; the quasi-coherent route bypasses it entirely.\n"
