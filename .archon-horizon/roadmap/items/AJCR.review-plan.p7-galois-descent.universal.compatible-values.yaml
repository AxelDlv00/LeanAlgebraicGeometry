id: AJCR.review-plan.p7-galois-descent.universal.compatible-values
title: Compatible pinned atlas classes on one finite Galois stage
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: Instantiate the checked pinned-value theorem on the tensor ring models of
  the intended finite-stage package, then prove both restriction equations after a
  common finite Galois enlargement retaining earlier coefficients. The output must
  be actual compatible degree-zero chart and overlap classes, ready to glue on the
  literal P.gluedOver. Do not assume compatibility or a TestEquiv. PicEtAff.mapAlg_injective
  requires a bijective algebra map and cannot be used as arbitrary faithfully-flat
  reflection.
