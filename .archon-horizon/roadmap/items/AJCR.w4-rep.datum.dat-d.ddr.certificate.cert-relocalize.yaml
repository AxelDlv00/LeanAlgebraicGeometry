summary: 'REJECTED 2026-07-27 after declaration-level audit. IsLocallyCertified, DivFamZar,
  DivOver, the theta windows, cocycle, evaluation map, and DivRepGlobalData.equiv
  are all parameterized by one fixed pi. Replacing pi by twistedP1Map pi M changes
  the represented chart; one fixed classifier cannot classify the union over M without
  changing its target and inverse laws. The correct replacement is an OUTER twist-indexed
  atlas: retain the existing DivFamZar and fixed classifier for each fixed twisted
  map, prove that its locus in the underlying divisor functor is open, construct transition
  isomorphisms on common divisor-equality loci, verify cocycles, and glue the representing
  charts. Those obligations are tracked by twist-atlas. The twist quantifier is inside
  the base-local atlas cover but outside every fixed classifier.'
