summary: "ADVANCED 2026-07-30 by ajc-p1: the AFFINE half of input (2) is CLOSED as\
  \ a global instance; the non-affine half (which is the one the route needs) is untouched.\
  \ Owner released.\n\nLANDED, DO NOT REDO. Picard/GaloisQuotientAffineGeneral.lean\
  \ (new, rooted at AlgebraicJacobian.lean, 2 theorems + 1 global instance), commits\
  \ adc6e11b7a / 33c2da33e1 / b7b27b1e1f. Sorry-free; all three declarations axiom-clean\
  \ [propext, Classical.choice, Quot.sound] against a control still reporting sorryAx\
  \ on fgaPicardRepresentability. lake build EXIT=0.\n * isGaloisQuotient_congr --\
  \ IsGaloisQuotient transports along an equivariant iso over Spec L. NO geometry:\
  \ the three clauses are a triangle over Spec L, an equivariance square, a universal\
  \ property. Control: with the equivariance hypothesis dropped, clause 2 is unprovable.\n\
  \ * hasGaloisQuotient_of_isAffine -- HasGaloisQuotient for EVERY semilinear action\
  \ on an AFFINE scheme, global instance. Route: top is a stable open, so GaloisQuotientGlue's\
  \ layer-1 section action at U = top puts Gamma(X,top) in the affine model's input\
  \ format; X.isoSpec is then equivariant over Spec L (mathlib isoSpec_hom_naturality)\
  \ and isGaloisQuotient_spec transports across it.\n\nWHAT WAS ACTUALLY WRONG WITH\
  \ THIS ROW'S PRICING, and it is the reusable part. This row and GaloisQuotientGlue's\
  \ opening audit both size G2(c) as a four-layer GlueData construction with only\
  \ layer 1 built. Layer 1 ALREADY CLOSED THE GATE on the affine locus -- the U =\
  \ top instance of its own section action, plus a transport that is generic category\
  \ theory. Nobody had tried the degenerate open. The four-layer plan is correct for\
  \ the non-affine case and was never re-checked against the affine one.\n\nWHAT REMAINS,\
  \ verified not assumed (fresh-context audit, reproduced): (1) G2(c) for a NON-AFFINE\
  \ X, which is what the campaign consumer J'_r is, since it is glued. inferInstance\
  \ for the gate at an abstract action carrying the orbit hypothesis but NOT affineness\
  \ FAILS; with HasStableAffineCover also in scope it still fails. The Hironaka trap\
  \ bites exactly there and is untouched. (2) THE GATE HAS ZERO BINDER SITES -- no\
  \ '[HasGaloisQuotient' anywhere, no use of .exists_quotient, all 23 occurrences\
  \ are the class, its two producers, prose. So this removes a FUTURE obstacle; it\
  \ unblocks nothing today, because the assembly step that would consume it is not\
  \ yet a declaration (ajc-p2 claimed that step this round for exactly that reason).\
  \ (3) fgaPicardRepresentability untouched, no antecedent witnessed for any curve.\n\
  \nTRAP RECORDED AT THE SITE: my first version claimed the instance closes hasGaloisQuotient_specF4\
  \ 'by inferInstance' at four sites. TRUE only from a file importing the new module;\
  \ FALSE at the F4 witness's own site, and unfixable there -- the new module imports\
  \ GaloisQuotientNonVacuity for the orbit instance, so the reverse import is a cycle.\
  \ Same for the two sites in FiniteGaloisQuotient.lean, two hops below. Corrected\
  \ in-tree.\n\nNEXT LANE: take the non-affine gluing only together with a consumer,\
  \ or the gate gains a second producer with still nothing binding it."
