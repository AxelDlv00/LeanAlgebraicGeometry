summary: 'WORKSHEET LANDED (run 0073), informal/w5-s-worksheet.md §2+§2.1. Route alpha-1
  survives but splits differently than the recon said. CHEAP half, structurally: the
  two-term-H^2=0 step is free because pic0Functor is built on a TWO-chart Cech cover,
  so the degree-2 term is absent by construction (hence the ban on porting EGA III
  7.7.5/7.7.10 Exchange costs nothing). EXPENSIVE half: "IsReduced J_kbar => GeometricallyReduced"
  is ABSENT from mathlib — the gap is exactly the TRANSCENDENTAL extension case (mathlib
  covers algebraic K/k at Nilpotent/GeometricallyReduced.lean:71; no scheme-level
  reduction of the field quantifier exists; IsGeometricallyReduced has zero consumers
  under AlgebraicGeometry/). Do NOT reach for Curve/GeometricallyReduced.lean — it
  proves the CONVERSE and using it here is circular (this mistake was made and retracted
  in §2.1; cost recorded in I-0499/I-0508). RECOMMENDATION: keep S1 a hypothesis;
  the AV package already assembles conditionally on it. Cheap unblock is UPSTREAM
  (mathlib smooth_of_grpObj_of_isAlgClosed is private). S1-a (reduced stalk at identity)
  is T3/T4-gated.'
