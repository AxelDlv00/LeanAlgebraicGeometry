summary: 'WORKSHEET-FIRST (informal/w5-s-worksheet.md 2, 2.1). S1 is a HYPOTHESIS
  by design: S2 and S3 take GeometricallyReduced as an instance argument, so keeping
  S1 open blocks no other Wave-5 item. Two live corrections to earlier sizings, both
  recorded in 2.1: (i) Curve/GeometricallyReduced.lean proves the CONVERSE of what
  S1 needs, so citing it is circular; (ii) RETRACTED 2026-07-28 (run 0073 r2) -- my
  own claim that the cheap unblock was an upstream mathlib PR making smooth_of_grpObj_of_isAlgClosed
  public is WRONG. private hides the name, not the proof: the script uses only public
  API and transcribes verbatim ([XS], local; sibling did it in Picard/GroupSchemeSmoothAlgClosed.lean,
  inbox I-0567). What survives and sizes the row: IsReduced over an algebraically
  closed base does NOT give GeometricallyReduced -- absent from mathlib v4.31, and
  proving it IS the transcendental-extension statement. So the kbar-fibre variant
  RELOCATES S1-b0 at [XS] rather than dodging it. Residue: S1-b0 [M/L] plus S1-a''s
  reduced-identity-stalk question (R2'', gated on T3/T4).'
