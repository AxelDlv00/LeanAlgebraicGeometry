summary: "T3: SEVEN of the eight arrows are landed; the COMPOSITE (T3-6) is still\
  \ unwritten, so this row stays PENDING. Run 0073 r8 added the section equation and\
  \ closed the last named non-composite residue.\n\nLANDED r8 -- both kernel EXIT=0,\
  \ lake build EXIT=0 (8686 jobs), nine headlines axiom-clean vs two controls that\
  \ both fire sorryAx (33f71cf06, 4b3f46153):\n\n * Tangent/EpsReductionSquare.lean\
  \ -- Over.appLE_dualNumberSections and its units form: worksheet 7.8's section equation,\
  \ i.e. 'restrict the eps|->0 image of a thickened section and get the collapse of\
  \ fst x'. Plus overlapQuotCongr and Over.epsFamilyEq, the opens/family transport.\n\
  \ * Tangent/EpsChartTrivialInstance.lean -- chartTrivial_of_map_eq_one: hchart (clause\
  \ iii-c2) DISCHARGED at the Wave-5 charts, which closes worksheet 7.9 item (4).\
  \ Four supporting statements: resRingEquivOfEq (+2 simp projections), epsChartDownAt,\
  \ appLE_relCurveMap_eq, hsq_at.\n\nWHAT r7's MEASUREMENT GOT WRONG, and it is the\
  \ method point of this round. 7.8 priced (T3-6) by writing the square and reading\
  \ the LEFTOVER GOAL, then reported '[S], NO MISSING INPUT IDENTIFIED'. The CONTENT\
  \ half held exactly -- (b-coeff) plus the sectionsCollapse/sectionsBaseChange bridge,\
  \ closed by appLE_map, spelling not mathematics. The ENUMERATION half did not:\n\
  \n  relCurveMap C k[eps] k ^-1 (fst_{k[eps]} ^-1 W) = fst_k ^-1 W   is NOT rfl\n\
  \n7.8's square spelled its target open in relCurve C k's own fst ^-1 (U0 inf U1)\
  \ form, so this transport was absorbed into the ELABORATED TYPE and never appeared\
  \ as a leftover goal. READING THE LEFTOVER GOALS MEASURES THE DIFFICULTY; IT DOES\
  \ NOT ENUMERATE THE INGREDIENTS. Probe the equalities your statement assumes, not\
  \ just the goals it leaves. Worksheet 8.0.\n\nTHE SAME CAST was what blocked hchart's\
  \ instantiation, and a consumer grep dates that claim: before r8 the producer Opens.cechPicMap_ι_eq_one_of_map_eq_one\
  \ had FOUR occurrences outside its defining file and ALL FOUR WERE PROSE (EpsChartSquare:64/:89/:100,\
  \ TwoChartKernelComparison:35), zero in a proof term. Three docstrings said it 'has\
  \ a producer at the Wave-5 instance'; 7.9 verified every step by hand and said so\
  \ honestly; nothing composed them. Worksheet 8.2/8.3.\n\nA FAILURE MODE WITH NO\
  \ ERROR MESSAGE, recorded because it cost the round's only wasted stretch. Defining\
  \ the open-equality transport the obvious way, h |> RingEquiv.refl, typechecks everywhere\
  \ downstream -- and then hsq_at's rw chain is a SILENT NO-OP: lean_goal returned\
  \ character-for-character identical goals before and after, and Lean reported NO\
  \ ERROR. Nothing rewrites under a |>-transport with an opaque motive. Rebuilt from\
  \ X.resHom (le_of_eq h) in both directions, so resHom_resHom and resHom_self apply,\
  \ the same proof closes. A rw that changes nothing and reports nothing is a wrong\
  \ DEFINITION, not a failing tactic -- the mirror image of 7.7, where an error message\
  \ pointed at the wrong cause. Cohomology/RelThetaTransportCore.presheafCongr had\
  \ already arrived at the resHom design; searching for the SHAPE of a transport,\
  \ not a lemma name, would have skipped it.\n\nRESIDUE, unchanged in kind and now\
  \ smaller: (T3-6), the composite H1(C,O) ~+ ker(CechPic(C_eps) -> CechPic(C)). Both\
  \ halves exist as statements. Two cautions for whoever writes it:\n (a) the elaborated\
  \ pullbackOverlapQuot/collapseCechH1Equiv square did not finish stating under LSP\
  \ (two timeouts) nor under lake env lean (10 min) -- but measured at machine load\
  \ ~60 with swap exhausted, so that is NOT a clean cost measurement and must not\
  \ be quoted as one. Assemble in small named steps with the transport factored out;\
  \ do not attempt one rw chain through both carriers.\n (b) ADDITIVITY is still open\
  \ and still SEPARATE. Every arrow is a MulEquiv; Additive-wrapping happens only\
  \ on the (T3-1) leg. MulEquiv.toAdditive exists and moves the chain, but the INTERTWINING\
  \ LAW across kappa(e) ~+* k is not a corollary of any of it. T5's trap stands verbatim.\n\
  \nALSO NOT DONE: twoChartKernelEquiv itself is still not instantiated -- hchart\
  \ is one of its three hypotheses; the other two are the surjectivity binders (TwoChartHonestGenus,\
  \ EpsZeroSurjective)."
