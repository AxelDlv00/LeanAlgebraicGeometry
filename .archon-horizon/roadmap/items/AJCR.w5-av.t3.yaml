summary: 'T3 is the CONSUMER of the T4 comparison, not independent work: ker(relPic(k[eps])
  -> relPic(k)) =+ H1(C,O).


  T3''s STATED BLOCKER IS GONE as of run 0073 r6. The previous version of this row
  said T3 "waits on exactly T4''s named residue: the scheme-object identifications
  (3b)/(3c), and (iii-c2-aff-geo) carried as the hcyc binder in DualNumberChartPic".
  All of those are now closed: (3b)/(3c) in r4/r5, and (iii-c2-aff-geo) plus BOTH
  consumer inputs in r6 (Tangent/ChartClassNaturality, PicEpsKernelTrivial, ChartTrivialityGeo,
  EpsZeroSurjective, TwoChartHonest; worksheet 6.27).


  WHAT T3 NOW WAITS ON is instantiation, not a comparison: the two chart presentations
  at the thickened charts (e = Over.dualNumberSectionsOfIsAffineOpen, e'' its eps-zero
  reduction) plus the commuting square hsq between them, and not-IsAffine C.left.
  Neither is a wall; both are named in the new docstrings. A successor should START
  by assembling hsq, since every other piece of the chain is landed and rooted.


  STILL TRUE AND STILL THE TRAP FOR T5: what T3 must hand T5 is the SEMILINEAR COMPARISON
  (AddEquiv plus intertwining across kappa(e) ~+* k), NOT a bare eps-kernel bijection
  — finrank does not transport along a bijection of sets. See the t5 row.

  '
