summary: 'SPINE LANDED, numeral open (run 0073). Tangent/Pic0TangentSpace.lean, against
  (d : JacobianData C). UNCONDITIONAL: identitySection (the group unit, hence a section,
  hence automatically k-rational — no rationality hypothesis anywhere downstream);
  T_0(d.J) ~ cotangent dual; T_0(d.J) ~ ker(Pic^0(k[eps]) ->* Pic^0(k)); finiteDimensional_cotangentSpace;
  and finrank_eq_of_addEquiv_of_bijective_smul, the LINEARITY BRIDGE (finrank transports
  across a scalar BIJECTION given an AddEquiv + intertwining law; mathlib has only
  the Module.rank form). CONDITIONAL on one named hypothesis hdim, verified load-bearing
  so not vacuous.


  WHAT T3/T4 MUST DELIVER, corrected: the SEMILINEAR COMPARISON (AddEquiv + intertwining
  across kappa(e) ~+* k), NOT a bare eps-kernel bijection. The kernel bijection is
  a bijection of SETS and finrank does not transport along one — so no amount of kernel
  computation gives hdim without the additive/intertwining data. Same residue the
  AJC sibling isolated as semilinearComparison_cotangentSpaceDual_h1Cok. My earlier
  "reduced to the eps-kernel, discharge is exact" phrasing was an overstatement; corrected
  in commit e441cf715 (see I-0513).'
