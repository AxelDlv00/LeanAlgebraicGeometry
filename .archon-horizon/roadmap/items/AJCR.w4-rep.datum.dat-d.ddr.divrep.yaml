summary: "DD-R divRep: affine classification, Zariski/global representability, and\
  \ consumer export.\n\nSTATUS 2026-07-28 (run 0071, ajcr-divrep). THE ENDPOINT IS\
  \ LANDED AND ROOTED, and the residue\nof the whole divisor-representability chain\
  \ is now TWO FIELDS of one structure. Root build\ngreen, 9149 jobs.\n\nDONE, all\
  \ sorry-free and kernel-checked by the configured build:\n * the GLOBAL ENDPOINT:\
  \ DivRepAffinePullback.representableBy (DivRepGlobalClassify.lean:306)\n   yields\
  \ (divFunctor C pi g).RepresentableBy DivOver. Landed 2026-07-27 (31930badb +\n\
  \   aeb77e174) -- AFTER the round-5 critical-path doc, which is why that doc called\
  \ it\n   missing. L10/L11 have ZERO remaining obligations.\n * the pull FIELD IS\
  \ DEFINED: divRepPullValue (DivRepAffPullField.lean), Classical.choice over\n  \
  \ the atlas factorization, pinned by IsDivRepPullValue with no residual ambiguity\
  \ so the\n   choice never leaks into a statement. divRepPullValue_eq_of is the usable\
  \ form.\n * its two supporting theorems: the chart pulls of one factorization glue\
  \ uniquely\n   (DivRepAffPullGlue), and the result is INDEPENDENT of the factorization\n\
  \   (DivRepAffPullIndep, divRepPullGlue_eq_of_chartFactors) -- the latter U2-free\
  \ in its proof.\n * infrastructure: DivRepAwaySpanGlue (the eight-field instance\
  \ pack of the S5b gluing\n   keystone at canonical away carriers -- the mechanical\
  \ gap between the atlas factorization,\n   which returns a BARE spanning family,\
  \ and every gluing keystone, which wants carriers as\n   instance data) and DivRepAwayPush\
  \ (the pull_naturality carrier transport, on mathlib\n   Localization.awayMapₐ).\n\
  \nTHE RESIDUE: a producer of DivRepAffinePullback (DivRepAffKit.lean:175). Via ofPull\
  \ that is\nthree fields, of which one is done:\n   pull                  -- DEFINED\
  \ (divRepPullValue), conditional on a supplied chart family\n   pull_naturality\
  \       -- carrier transport landed; the proof is not written\n   isDivRepClassify_pull\
  \ -- THE EPSILON-GATED FIELD, where DDR9-U enters\n\nIMPORTANT QUALIFICATION, do\
  \ not read the above as a cleared gate. Everything here is\nconditional on DivRepChartFamily.IsCompatible\
  \ for the supplied family, which has NO producer\nother than U2 (isCompatible_of_isDivRepClassify_divRepPullAt).\
  \ So nobody can construct a\nDivRepAffinePullback yet. The set of unproved statements\
  \ is unchanged since round 5; what\nchanged is its partition and hence the size\
  \ of the target. General form: inbox I-0512.\n"
