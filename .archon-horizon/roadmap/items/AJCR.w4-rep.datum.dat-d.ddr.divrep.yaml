  \ SPLITS, AND THE STANDING REFUTATION BITES ONLY ONE HALF.\n  epsilon-VALUE : d's\
  \ window quotient is projective of constant rank g -- no-go-IMMUNE, OPEN.\n  the\
  \ CLASS     : a term of DivFamZar C R_Z pi g (a LOCALLY CERTIFIED family) -- carries\
  \ the\n                  WHOLE bite of I-0705.\n\nLANDED (Picard/DivRepChartClassUnivQuot.lean,\
  \ commit ae01cfcb2; sorry-free, rooted, lock-free\nscratch-olean check EXIT=0, zero\
  \ warnings): divisorWindow_eq_of_le_of_quotientData and\ndivFamEps_eq_of_le_of_quotientData\
  \ state the epsilon-projection identity with NO\nDivisorAdaptation, NO IsCertified,\
  \ no cover and no chart typing -- the input is three (in fact\ntwo: see the u2 row\
  \ on finiteness) module-theoretic facts about the window quotient of d alone.\n\
  The landed chart-typed statement is recovered as a COROLLARY, so the generalisation\
  \ is\nmachine-checked.\n\nWHY THE REFUTATION MISSES IT: forall_not_isCertified_of_straddling\
  \ proves its conclusion through\ncertificate clause (c1) -- finiteness of the CHART-LOCAL\
  \ COLENGTHS forces supportLeak = empty,\nhence chart confinement. A statement about\
  \ d's window quotient is not an instance of that\nforall.\n\nWHAT THIS DOES FOR\
  \ THE CERT-R2 SEAM: the epsilon layer needs NO AffAdaptation.IsCertified ->\nDivisorAdaptation.IsCertified\
  \ bridge. The type mismatch the previous body called \"the whole\ncritical path\"\
  \ is off the epsilon path; it survives only on the class half, where cert-r2's\n\
  divFamZarAff_of_swallowing_affineOpen (DivisorFamilyAffSeedGate.lean) is the live\
  \ candidate.\nPosted to cert-r2 on I-0494.\n\nTHE ENDPOINT IS UNCHANGED and is still\
  \ what consumers write against:\n  DivRepAffinePullback.representableBy (Picard/DivRepGlobalClassify.lean:306)\n\
  \  divFunctor_representableBy_of_chartClause (DivRepAffPullClause.lean)\n  divFunctor_representableBy_of_chartRange\
  \  (DivRepChartRange.lean:220)\nL10/L11 have zero remaining obligations.\n\nSTILL\
  \ BINDING: NO GATE HAS CLEARED. Nobody can construct a DivRepAffinePullback, because\n\
  nothing produces the class. The straddling probe is still unmeasured and now decides\
  \ only the\nclass half. critical-path 7.6 is untouched: L8 remains the campaign's\
  \ real gate and is arguably\nFALSE as stated.\n\n--- the previous body follows;\
  \ correct except that its \"unpriced\" verdict now applies only to\n--- the CLASS\
  \ half, and its \"type mismatch is the whole critical path\" is retracted ---\n\n\
  The certificate residue of this row was established (I-0705, CONFIRMED by the no-go's\
  \ own owner)\nto be possibly FALSE rather than open: forall_not_isCertified_of_straddling\n\
  (Picard/DivisorFamilyAffStrict.lean:127) is the negation of \"some adaptation is\
  \ certified\" at the\nsame binder, and because it quantifies over ALL A it equally\
  \ refutes the older spelling\n(D.divisorAdaptation hD).IsCertified g.\n\nTHE DECISIVE\
  \ UNMEASURED FACT, and it is cheap: is (univSeed ..).localEquations' supportLocus\n\
  preconnected with a point off V0 and a point off V1? NO file in the tree measures\
  \ it. WHICH WAY\nIT CUTS: if the universal seed straddles, R2 (protection I-0492)\
  \ is not an inconvenience for\ndivrep -- it is the ONLY route for the class half.\n\
  \nAlso landed earlier in this run and unaffected: windowBound_pos_of_genus_ne_zero\
  \ (the U2 scalar\nis a genus disjunction with a landed degenerate branch, DivRepChartClassUnivFree.lean);\n\
  HasCertifiedAdaptation plus the epsilon identity at an arbitrary certified adaptation\n\
  (DivRepChartClassUnivAny.lean); all three modules rooted, kernel-green in the 9270-job\
  \ root\nbuild of s0010, axiom-clean against a control that reports sorryAx.\n\n\n\
  VERIFICATION, FINAL AND MEASURED (appended at s0012 close, superseding the 'no full\
  \ lake build'\ncaveat above): lake build AlgebraicJacobian -> 'Build completed successfully\
