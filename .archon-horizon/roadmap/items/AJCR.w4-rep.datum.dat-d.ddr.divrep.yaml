summary: "DD-R divRep: affine classification, Zariski/global representability, and\
  \ consumer export.\n\nSTATUS 2026-07-28 (run 0071 s0004, ajcr-divrep). THE CHAIN\
  \ IS COMPLETE EXCEPT FOR ONE\nSTATEMENT. There is now a sorry-free producer of the\
  \ endpoint from a single named hypothesis:\n\n  divFunctor_representableBy_of_chartClause\
  \  (Picard/DivRepAffPullClause.lean)\n    : DivRepChartFamily.IsChartClause U ->\
  \ (divFunctor C pi g).RepresentableBy DivOver\n\nDONE, all sorry-free, kernel-checked,\
  \ rooted, root build green:\n * the GLOBAL ENDPOINT DivRepAffinePullback.representableBy\
  \ (DivRepGlobalClassify.lean:306).\n   L10/L11 have zero remaining obligations.\n\
  \ * THE THREE FIELDS OF ofPull, all three now discharged from IsChartClause:\n \
  \    pull                  divRepPullValue (DivRepAffPullField), choice over the\
  \ atlas\n                           factorization, pinned by IsDivRepPullValue\n\
  \     pull_naturality       divRepPullValue_naturality (DivRepAffPullNat) -- EPSILON-FREE,\n\
  \                           and it performs no gluing: a witness construction against\n\
  \                           divRepPullValue_eq_of. Cheaper than this row used to\
  \ price it.\n     isDivRepClassify_pull isDivRepClassify_divRepPullValue (DivRepAffPullClause)\n\
  \   plus pull_classify, derived by the separation theorem.\n * THE REUSABLE TOOL,\
  \ independent of every chart family:\n     isDivRepClassify_of_forall_away -- IsDivRepClassify\
  \ is LOCAL ON THE BASE.\n   This is what collapses the tail: the clause quantifies\
  \ over tower tests, so both its\n   hypothesis data and its conclusion restrict\
  \ along a spanning family.\n * supporting: DivRepAffPullGlue (one factorization\
  \ glues), DivRepAffPullIndep\n   (factorization-independence), DivRepAwaySpanGlue\
  \ (the S5b instance pack at canonical away\n   carriers), DivRepAwayPush + specMap_awayMapa_comp\
  \ (the carrier square, both faces).\n\nTHE RESIDUE IS ONE STATEMENT: a producer\
  \ of DivRepChartFamily.IsChartClause for the\nuniversal family = U2 = the DDR9-U\
  \ epsilon-identity. See the u2 leaf.\n\nQUALIFICATION, and it has been the right\
  \ thing to repeat at every re-scope of this row:\nNOTHING HERE PROVES U2, and no\
  \ gate has cleared. Nobody can construct a DivRepAffinePullback\nyet. What changed\
  \ across this run is the SHAPE of the debt -- from \"two epsilon-gated\nobligations\
  \ plus naturality plus bookkeeping\" to \"one statement, stated once, with a producer\n\
  waiting on it\". Read it that way and not as progress toward L8, which is untouched\
  \ (see\ncritical-path 7.6: the campaign's real gate is local surjectivity of the\
  \ Abel map out of a\ntoo-small divisor functor, and it is arguably false as stated).\n"
