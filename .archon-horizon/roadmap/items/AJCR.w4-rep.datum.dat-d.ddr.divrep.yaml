summary: "DD-R divRep: affine classification, Zariski/global representability, and\
  \ consumer export.\n\nCORRECTED 2026-07-29 (run 0071 s0014, ajcr-divrep). THE s0012\
  \ BODY BELOW SAYS THE CLASS HALF IS\nALL THAT REMAINS AND NAMES cert-r2's divFamZarAff_of_swallowing_affineOpen\
  \ AS THE LIVE CANDIDATE.\ncert-r2 LANDED IT, AND IT STILL CANNOT FEED U2 -- and\
  \ the reason is not a certificate.\n\nU2's consumer IsChartClause (DivRepAffPullClause.lean:121)\
  \ is typed on the CHART-TYPED DivFamZar;\nthat producer gives a DivFamZarAff; no\
  \ map DivFamZarAff -> DivFamZar exists or can (ADDENDUM 3\ns2). So the route is\
  \ re-deriving the eps-value facts widened -- and the absence was that the\nWIDENED\
  \ CARRIER HAD NO THETA-LAYER AT ALL: divFamEps_eq_of_le rests on window-quotient\n\
  projectivity and rank, landed unconditionally on DivFam but ONLY via windowQuotEquiv,\
  \ whose\ntarget A.ThetaGlued a was defined solely on DivisorAdaptation. Of all files\
  \ naming AffAdaptation,\nZERO defined a theta arrow.\n\nLANDED: Picard/DivisorFamilyAffTheta.lean\
  \ -- the widened Theta-layer through LEFT EXACTNESS\n(AffAdaptation.ker_thetaGluedEval),\
  \ whose RHS is literally the chart-typed one's, so divisorWindow\nis the SAME submodule\
  \ on both carriers; plus the whole (c2) substrate and the side-uniform\nsections.\
  \ Sorry-free, rooted, kernel EXIT=0, axiom-clean vs a firing control. It was a PORT:\
  \ the\nchart-dependence is one Bool per piece and ChartTyping supplies exactly that.\n\
  \nSTILL OWED on this route, three items, detail on the u2 child row: thetaSectionSide_mem\
  \ (the\nfour-case cocycle argument -- REAL CONTENT, not re-indexing), then the widened\
  \ IsThetaPaired, then\nthe mechanical (c2) transports. IsThetaPaired is a named\
  \ Prop I do not prove and whose\nsatisfiability probe I have not run; that limit\
  \ is recorded, not hidden.\n\nNO GATE HAS CLEARED. A type obstruction was removed;\
  \ nothing produces an IsChartClause, and\ncritical-path 7.6 stands -- L8 remains\
  \ the real gate and is arguably FALSE as stated.\n\nFull write-up: informal/w4-rep-critical-path.md\
  \ section 7.13.\n\n--- the s0012 body follows; its \"the class half is all that\
  \ remains\" framing is corrected above ---\n\nDD-R divRep: affine classification,\
  \ Zariski/global representability, and consumer export.\n\nRE-PRICED 2026-07-29\
  \ (run 0071 s0012, ajcr-divrep). THE \"UNPRICED\" VERDICT AT THE TOP OF THE\nPREVIOUS\
  \ BODY IS SUPERSEDED FOR ONE OF ITS TWO HALVES. Full detail on the child row\n...divrep.u2;\
  \ the short form:\n\nU2 SPLITS, AND THE STANDING REFUTATION BITES ONLY ONE HALF.\n\
  \  epsilon-VALUE : d's window quotient is projective of constant rank g -- no-go-IMMUNE,\
  \ OPEN.\n  the CLASS     : a term of DivFamZar C R_Z pi g (a LOCALLY CERTIFIED family)\
  \ -- carries the\n                  WHOLE bite of I-0705.\n\nLANDED (Picard/DivRepChartClassUnivQuot.lean,\
  \ commit ae01cfcb2; sorry-free, rooted, lock-free\nscratch-olean check EXIT=0, zero\
  \ warnings): divisorWindow_eq_of_le_of_quotientData and\ndivFamEps_eq_of_le_of_quotientData\
  \ state the epsilon-projection identity with NO\nDivisorAdaptation, NO IsCertified,\
  \ no cover and no chart typing -- the input is three (in fact\ntwo: see the u2 row\
  \ on finiteness) module-theoretic facts about the window quotient of d alone.\n\
  The landed chart-typed statement is recovered as a COROLLARY, so the generalisation\
  \ is\nmachine-checked.\n\nWHY THE REFUTATION MISSES IT: forall_not_isCertified_of_straddling\
  \ proves its conclusion through\ncertificate clause (c1) -- finiteness of the CHART-LOCAL\
  \ COLENGTHS forces supportLeak = empty,\nhence chart confinement. A statement about\
  \ d's window quotient is not an instance of that\nforall.\n\nWHAT THIS DOES FOR\
  \ THE CERT-R2 SEAM: the epsilon layer needs NO AffAdaptation.IsCertified ->\nDivisorAdaptation.IsCertified\
  \ bridge. The type mismatch the previous body called \"the whole\ncritical path\"\
  \ is off the epsilon path; it survives only on the class half, where cert-r2's\n\
  divFamZarAff_of_swallowing_affineOpen (DivisorFamilyAffSeedGate.lean) is the live\
  \ candidate.\nPosted to cert-r2 on I-0494.\n\nTHE ENDPOINT IS UNCHANGED and is still\
  \ what consumers write against:\n  DivRepAffinePullback.representableBy (Picard/DivRepGlobalClassify.lean:306)\n\
  \  divFunctor_representableBy_of_chartClause (DivRepAffPullClause.lean)\n  divFunctor_representableBy_of_chartRange\
  \  (DivRepChartRange.lean:220)\nL10/L11 have zero remaining obligations.\n\nSTILL\
  \ BINDING: NO GATE HAS CLEARED. Nobody can construct a DivRepAffinePullback, because\n\
  nothing produces the class. The straddling probe is still unmeasured and now decides\
  \ only the\nclass half. critical-path 7.6 is untouched: L8 remains the campaign's\
  \ real gate and is arguably\nFALSE as stated.\n\n--- the previous body follows;\
  \ correct except that its \"unpriced\" verdict now applies only to\n--- the CLASS\
  \ half, and its \"type mismatch is the whole critical path\" is retracted ---\n\n\
  The certificate residue of this row was established (I-0705, CONFIRMED by the no-go's\
  \ own owner)\nto be possibly FALSE rather than open: forall_not_isCertified_of_straddling\n\
  (Picard/DivisorFamilyAffStrict.lean:127) is the negation of \"some adaptation is\
  \ certified\" at the\nsame binder, and because it quantifies over ALL A it equally\
  \ refutes the older spelling\n(D.divisorAdaptation hD).IsCertified g.\n\nTHE DECISIVE\
  \ UNMEASURED FACT, and it is cheap: is (univSeed ..).localEquations' supportLocus\n\
  preconnected with a point off V0 and a point off V1? NO file in the tree measures\
  \ it. WHICH WAY\nIT CUTS: if the universal seed straddles, R2 (protection I-0492)\
  \ is not an inconvenience for\ndivrep -- it is the ONLY route for the class half.\n\
  \nAlso landed earlier in this run and unaffected: windowBound_pos_of_genus_ne_zero\
  \ (the U2 scalar\nis a genus disjunction with a landed degenerate branch, DivRepChartClassUnivFree.lean);\n\
  HasCertifiedAdaptation plus the epsilon identity at an arbitrary certified adaptation\n\
  (DivRepChartClassUnivAny.lean); all three modules rooted, kernel-green in the 9270-job\
  \ root\nbuild of s0010, axiom-clean against a control that reports sorryAx.\n\n\n\
  VERIFICATION, FINAL AND MEASURED (appended at s0012 close, superseding the 'no full\
  \ lake build'\ncaveat above): lake build AlgebraicJacobian -> 'Build completed successfully\
  \ (9279 jobs)', EXIT=0,\nZERO errors and ZERO 'uses sorry' warnings in the whole\
  \ log. Neither new module appears anywhere\nin the log, so neither contributed an\
  \ error or a linter warning. Axiom probe with a CONTROL that\nfires (I-0661): AlgebraicGeometry.Jacobian\
  \ reports sorryAx, while all six new theorems report only\n[propext, Classical.choice,\
  \ Quot.sound]. Both modules rooted in AlgebraicJacobian.lean.\n\nTHE HONEST LIMIT\
  \ OF THIS ROW'S HEADLINE, added at s0012 close after ajcr-charts pointed out on\n\
  I-0494 that a reduction owes TWO probes and I had run only one on my own. 'The eps-half\
  \ is OPEN,\nnot false' is a claim about the NO-GO: forall_not_isCertified_of_straddling\
  \ does not bear on a\nhypothesis naming no adaptation. IT IS SILENT ABOUT SATISFIABILITY.\
  \ The mirror risk is real and\nUNMEASURED: if the window quotient at the universal\
  \ point can never be projective of constant\nrank g, then the eps-half has been\
  \ reduced to a FALSE hypothesis -- which passes every sorry\ncensus and every axiom\
  \ probe, because it is then a theorem.\n\nNote the asymmetry with the junk probe\
  \ that refuted DAT-J's Abel square: that residue was vacuous\nbecause its witness\
  \ was CONSUMER-CHOSEN. Here the window quotient is determined by d, so vacuity\n\
  is impossible and satisfiability is the only live failure mode. The 'not silently\
  \ stronger' probe\nIS discharged (divisorWindow_eq_of_le_of_isCertified_of_quotientData\
  \ recovers the landed\nchart-typed statement as a corollary); the satisfiability\
  \ probe is owed and is the cheapest next\nmeasurement on this row.\n\nSUPERSEDING\
  \ THE SATISFIABILITY CAVEAT ABOVE -- I RAN THE PROBE AND THE EPS-HALF IS DISCHARGED,\
  \ NOT\nMERELY OPEN (s0012 close, commit 32476f85a, root build 9280 jobs EXIT=0,\
  \ divFamEps_eq_of_le\naxiom-clean vs a control that fires sorryAx).\n\n  divFamEps_eq_of_le\
  \ (Picard/DivRepChartClassUnivQuot.lean)\n    the eps-pair identity at an ARBITRARY\
  \ F : DivFam C R pi g from THE TWO CONTAINMENTS ALONE --\n    no projectivity hypothesis,\
  \ no rank hypothesis, no certificate.\n\nWHY: Picard/DivSchemeFrameCover.lean ALREADY\
  \ carries DivFam.projective_window_quotient (:106) and\nDivFam.rankAtStalk_window_quotient\
  \ (:117) for EVERY F at EVERY window a >= windowM_choice,\ndischarged inside from\
  \ the representative's own certificate -- which DivFam has BY CONSTRUCTION,\nCertifiedDivisorFamily\
  \ being the triple (eqns, adaptation, certified). So the window-quotient facts\n\
  were not merely satisfiable: they were landed unconditionally, and this lane had\
  \ restated them as\nhypotheses.\n\nTHE SHARP READING, and it retracts this row's\
  \ own framing across five sessions: THE EPS-HALF OF U2\nWAS NEVER GATED ON A CERTIFICATE\
  \ AT ALL -- not on the original (D.divisorAdaptation hD).IsCertified\ng, and not\
  \ on the weakened HasCertifiedAdaptation this lane landed at s0010. What every re-scope\n\
  read as 'U2 needs a certificate' was the CLASS requirement leaking into the eps\
  \ statement THROUGH\nTHE CARRIER: one cannot WRITE divFamEps hpi g F without an\
  \ F, and every F carries a certificate.\nThe eps layer never asked for one beyond\
  \ that.\n\nSO THE PARTITION IS NOT 'eps open, class refuted'. It is: eps DISCHARGED,\
  \ and 100% of U2's\nremaining content is PRODUCING THE CLASS over the chart ring\
  \ -- exactly the face protection I-0492's\nwidening exists to supply, and cert-r2's\
  \ divFamZarAff_of_swallowing_affineOpen is the live\ncandidate. The straddling probe\
  \ now decides that and nothing else.\n\nMETHOD NOTE, worth more than the result:\
  \ this came from running the probe ajcr-charts named on\nI-0494 -- a reduction owes\
  \ BOTH 'not vacuous' and 'not silently stronger'. My hypothesis was\nDETERMINED\
  \ by the data rather than consumer-chosen, so the live risk was UNSATISFIABILITY\
  \ rather\nthan vacuity; checking it turned a caveat into a theorem and refuted my\
  \ own headline of an hour\nearlier."
