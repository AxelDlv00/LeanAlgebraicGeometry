summary: "CHART-RESTRICT: the fibre criterion at the RESTRICTED chart + the V-coupling.\
  \ ADVANCED, GATE NOT CLOSED (ajcr-p1, run 0087).\n\nWHY THIS ROW EXISTS. IsChartUniv\
  \ (antecedent 1 of pic0RepresentableByOfCharts) had exactly TWO routes in the tree\
  \ and BOTH pass through the UNRESTRICTED certificate that three headers call false:\
  \ isChartUniv_of_unrestricted (Pic0ChartPair.lean:191) takes it verbatim, and isChartUniv_of_isChartLocusFibre\
  \ (Pic0ChartUnivReduce.lean:170) implies it in ONE term because IsChartLocusFibre's\
  \ ChartFibrePresented has W as a FREE field and V never enters. Measured independently\
  \ by ajcr-p1 and review-ajcr; landed as Pic0ChartLocusFibreGuard.lean.\n\nLANDED\
  \ (Picard/Pic0ChartRestrictedFibre.lean, fe937438c + 5439077ad; sorry-free, lake\
  \ env lean EXIT=0 zero diagnostics, rooted, axiom-clean [propext, Classical.choice,\
  \ Quot.sound] against a control that fires sorryAx):\n * RestrictedChartFibre --\
  \ the datum at restrictChart (abelSigmaChart ..) V, so exists_factor factors only\
  \ test points OF V;\n * isChartUniv_of_restrictedChartFibre -- one application of\
  \ the existing criterion, no unrestricted certificate on the way in;\n * necessity_of_restrictedChartFibre\
  \ -- the restricted datum still forces injectivity of the RESTRICTED chart on every\
  \ test, so relative GAP-2 moved from D.left to V rather than vanishing;\n * pic0RepresentableBy_of_restrictedChartFibre\
  \ -- the V-coupled assembly (I-0861), consuming ajcr-p2's isLocallySurjective_restrictChart_of_pointwise\
  \ with its hV binder verbatim. hf and coverage are forced to share V by typing.\n\
  \nNO GATE CLOSED, and the two limits are explicit rather than left for a reviewer:\n\
  \ 1. NO SATISFIABILITY WITNESS at any V (I-0890). I ran the probe on my own class.\
  \ exists_factor at W := bot IS free, but sq is NOT: it needs Subsingleton ((pic0SigmaSheaf\
  \ C).1.obj (op S)) at an EMPTY test, and congr 1 reduces that exactly to Subsingleton\
  \ (pic0Subgroup C (Over.mk a1)) over an empty base -- triviality of picEt over the\
  \ empty scheme, true, separate, ABSENT. So I-0861's 'V = bot is free' holds per-CLAUSE\
  \ and not per-DATUM.\n 2. IsChartLocusFibre -> RestrictedChartFibre is NOT proved\
  \ (needs the r-preimage of V along W.iota, buys nothing). So the weakening is not\
  \ certified STRICT.\nrep, huniv and hcov all remain hypotheses with no producer.\n\
  \nNEXT, cheapest first: (a) the empty-test subsingleton above, which decides whether\
  \ this class is inhabited at all; (b) ajcr-p3's abel-noninj (I-0881) decides whether\
  \ the OLD route is dead or merely ungated."
