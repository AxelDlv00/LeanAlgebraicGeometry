summary: "*** REVIEWER AUDIT 2026-07-29 (review-ajcr, run 0082 s0006) OF ajcr-p1's V-INTERVAL RESULT\n\
  (commit e10665a70, Pic0ChartRestrictedFibreSat.lean). SOUND, CORRECTLY HEDGED, AND IT IS THE\nSTRONGEST\
  \ STRUCTURAL RESULT ON THIS SEAM THIS ROUND. It also RAISES this row's rank rather\nthan lowering it,\
  \ which is worth stating because a satisfiability result usually reads as\nbad news. ***\n\nWHAT IS\
  \ NOW PROVED, both endpoints of the V-interval, in one rooted sorry-free module:\n * V = bot: hf/RestrictedChartFibre\
  \ is FREE (restrictedChartFibre_bot :147, isChartUniv_bot :168)\n   and coverage's containment is IMPOSSIBLE\
  \ (not_coverageContainment_bot :193).\n * V = top: the containment conjunct is FREE (range_subset_range_top_iota\
  \ :224), but the\n   restricted datum gives back the UNRESTRICTED certificate\n   (isOpenImmersion_presheaf_abelSigmaChart_of_restrictedChartFibre_top\
  \ :250) -- i.e. exactly what\n   three headers assert is false for the Abel chart. Hence top is refuted\
  \ AS SOON AS the Abel\n   chart fails injectivity on some test (not_restrictedChartFibre_top_of_not_injective\
  \ :276).\n\nVERIFIED BY ME: file rooted (AlgebraicJacobian.lean:573), zero code sorries, and p1's own\
  \ hedge is\naccurate rather than decorative -- the top refutation is stated conditionally because the\n\
  non-injectivity is a HEADER CLAIM proved nowhere (the abel-noninj fork). That is the correct\nepistemic\
  \ status and p1 wrote it into the docstring at :273-275.\n\nWHY THIS RAISES THE RANK. The earlier costing\
  \ said the V-coupling is what lets antecedents 1 and 2\ncompose. That is now not just an organisational\
  \ claim but a proved constraint: neither endpoint\nworks, so any V that discharges the assembly is a\
  \ PROPER INTERMEDIATE open. Consequences a lane\nmust not miss:\n * NEITHER an hf lane NOR a coverage\
  \ lane can retreat to a convenient V. The \"free at V = bot\"\n   observation (which I published, and\
  \ ajcr-p1 correctly qualified in I-0890) is now bounded on\n   the other side too: cheapness at bot\
  \ buys nothing because coverage dies there.\n * CHART-U(b), the OPENNESS of the chart locus, is therefore\
  \ load-bearing rather than bookkeeping.\n   It is the only mechanism in the tree that produces an intermediate\
  \ V at all.\n * the abel-noninj fork is now the hinge for the top end as well. It was already unowned\
  \ and is\n   the thing whose resolution decides whether top is dead or merely unproved.\n\nSTILL NOT\
  \ DISCHARGED, and p1 says so in the commit: rep has no producer, hcov at an intermediate V\nhas no producer,\
  \ and no chart is built at any V other than bot. No antecedent of\npic0RepresentableByOfCharts is closed\
  \ by this. The three-antecedent verdict (I-0873) is unchanged.\n\nCHART-RESTRICT: the fibre criterion\
  \ at the RESTRICTED chart + the V-coupling. ADVANCED, GATE NOT CLOSED (ajcr-p1, run 0087).\n\nWHY THE\
  \ ROW EXISTS. IsChartUniv (antecedent 1 of pic0RepresentableByOfCharts) had exactly TWO routes and BOTH\
  \ pass through the UNRESTRICTED certificate three headers call false: isChartUniv_of_unrestricted (Pic0ChartPair.lean:191)\
  \ takes it verbatim; isChartUniv_of_isChartLocusFibre (Pic0ChartUnivReduce.lean:170) implies it in ONE\
  \ term, because IsChartLocusFibre's ChartFibrePresented has W FREE and V never enters. Measured independently\
  \ by ajcr-p1 and review-ajcr (Pic0ChartLocusFibreGuard.lean).\n\nLANDED: Picard/Pic0ChartRestrictedFibre.lean,\
  \ 7 declarations, sorry-free, lake build EXIT=0 (8892 jobs), ALL axiom-clean [propext, Classical.choice,\
  \ Quot.sound] vs a control firing sorryAx. Commits fe937438c, 5439077ad, 2327a0757.\n * RestrictedChartFibre\
  \ -- the datum at restrictChart (abelSigmaChart ..) V, so exists_factor factors only test points OF\
  \ V;\n * isChartUniv_of_restrictedChartFibre -- one application of the existing criterion, no unrestricted\
  \ certificate on the way in;\n * restrictedChartFibre_of_isChartLocusFibre -- THE HEADLINE RESULT, and\
  \ it was almost lost to my own mispricing.\n\n*** THE ONE THING TO CARRY OFF THIS ROW: hf's exists_factor\
  \ AND coverage's hV ARE THE SAME OBLIGATION. The transport's hypothesis hr : Set.range (r.base) subset\
  \ Set.range (V.i.base) is character-for-character the hV of Pic0ChartAtlasCoupling.liftPointwiseToOpens.\
  \ So the V-coupling is ONE range containment asked twice from opposite sides -- NOT two obligations.\
  \ chart-u and dat-b currently price them apart and should be corrected. ajcr-p2 predicted this (I-0871)\
  \ before it was measured.\n\nTHREE OF MY OWN CLAIMS WERE REFUTED by a fresh-context review and are corrected\
  \ in place:\n * I-0936: I priced the transport as 'needs a pushforward, real work, buys nothing'. It\
  \ is 12 lines via IsOpenImmersion.lift, and 'buys nothing' was false -- the old form reaches IsChartUniv\
  \ only through the false-gated certificate.\n * I-0937: necessity_of_restrictedChartFibre is NOT a non-vacuity\
  \ check (free at V = bot; at general V it is the pre-existing injective_of_isChartUniv composed with\
  \ the reduction).\n * I-0939: my Sigma return type weakened the conclusion; the assembly now yields\
  \ the NAMED representing object, with the coverage-fed form kept as ..._of_coverage.\n\nNO GATE CLOSED.\
  \ rep, huniv, hcov all remain unproduced. And NO SATISFIABILITY WITNESS exists for RestrictedChartFibre\
  \ at any V (I-0890): exists_factor at W := bot is free, but sq needs Subsingleton (pic0Subgroup C (Over.mk\
  \ a1)) over an empty base -- triviality of picEt over the empty scheme, true, separate, ABSENT. So I-0861's\
  \ 'V = bot is free' holds per-CLAUSE, not per-DATUM.\n\nNEXT, cheapest first: (a) that empty-base subsingleton,\
  \ which decides inhabitation; (b) ajcr-p4's eq_of_picClass_eq_of_deg_eq_of_subsingleton_hModule_one\
  \ (I-0887) is a direct input to exists_factor, not yet consumed; (c) review-ajcr's I-0927 part 1 says\
  \ honesty is discharged per factor at a CHART VALUE, so the residue must not be priced as one lump;\
  \ (d) ajcr-p3's abel-noninj (I-0881) decides whether the OLD route is dead or merely ungated."
