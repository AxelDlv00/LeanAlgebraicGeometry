summary: "CHART-RESTRICT: the fibre criterion at the RESTRICTED chart + the V-coupling.\
  \ ADVANCED, GATE NOT CLOSED (ajcr-p1, run 0087).\n\nWHY THE ROW EXISTS. IsChartUniv\
  \ (antecedent 1 of pic0RepresentableByOfCharts) had exactly TWO routes and BOTH\
  \ pass through the UNRESTRICTED certificate three headers call false: isChartUniv_of_unrestricted\
  \ (Pic0ChartPair.lean:191) takes it verbatim; isChartUniv_of_isChartLocusFibre (Pic0ChartUnivReduce.lean:170)\
  \ implies it in ONE term, because IsChartLocusFibre's ChartFibrePresented has W\
  \ FREE and V never enters. Measured independently by ajcr-p1 and review-ajcr (Pic0ChartLocusFibreGuard.lean).\n\
  \nLANDED: Picard/Pic0ChartRestrictedFibre.lean, 7 declarations, sorry-free, lake\
  \ build EXIT=0 (8892 jobs), ALL axiom-clean [propext, Classical.choice, Quot.sound]\
  \ vs a control firing sorryAx. Commits fe937438c, 5439077ad, 2327a0757.\n * RestrictedChartFibre\
  \ -- the datum at restrictChart (abelSigmaChart ..) V, so exists_factor factors\
  \ only test points OF V;\n * isChartUniv_of_restrictedChartFibre -- one application\
  \ of the existing criterion, no unrestricted certificate on the way in;\n * restrictedChartFibre_of_isChartLocusFibre\
  \ -- THE HEADLINE RESULT, and it was almost lost to my own mispricing.\n\n*** THE\
  \ ONE THING TO CARRY OFF THIS ROW: hf's exists_factor AND coverage's hV ARE THE\
  \ SAME OBLIGATION. The transport's hypothesis hr : Set.range (r.base) subset Set.range\
  \ (V.i.base) is character-for-character the hV of Pic0ChartAtlasCoupling.liftPointwiseToOpens.\
  \ So the V-coupling is ONE range containment asked twice from opposite sides --\
  \ NOT two obligations. chart-u and dat-b currently price them apart and should be\
  \ corrected. ajcr-p2 predicted this (I-0871) before it was measured.\n\nTHREE OF\
  \ MY OWN CLAIMS WERE REFUTED by a fresh-context review and are corrected in place:\n\
  \ * I-0936: I priced the transport as 'needs a pushforward, real work, buys nothing'.\
  \ It is 12 lines via IsOpenImmersion.lift, and 'buys nothing' was false -- the old\
  \ form reaches IsChartUniv only through the false-gated certificate.\n * I-0937:\
  \ necessity_of_restrictedChartFibre is NOT a non-vacuity check (free at V = bot;\
  \ at general V it is the pre-existing injective_of_isChartUniv composed with the\
  \ reduction).\n * I-0939: my Sigma return type weakened the conclusion; the assembly\
  \ now yields the NAMED representing object, with the coverage-fed form kept as ..._of_coverage.\n\
  \nNO GATE CLOSED. rep, huniv, hcov all remain unproduced. And NO SATISFIABILITY\
  \ WITNESS exists for RestrictedChartFibre at any V (I-0890): exists_factor at W\
  \ := bot is free, but sq needs Subsingleton (pic0Subgroup C (Over.mk a1)) over an\
  \ empty base -- triviality of picEt over the empty scheme, true, separate, ABSENT.\
  \ So I-0861's 'V = bot is free' holds per-CLAUSE, not per-DATUM.\n\nNEXT, cheapest\
  \ first: (a) that empty-base subsingleton, which decides inhabitation; (b) ajcr-p4's\
  \ eq_of_picClass_eq_of_deg_eq_of_subsingleton_hModule_one (I-0887) is a direct input\
  \ to exists_factor, not yet consumed; (c) review-ajcr's I-0927 part 1 says honesty\
  \ is discharged per factor at a CHART VALUE, so the residue must not be priced as\
  \ one lump; (d) ajcr-p3's abel-noninj (I-0881) decides whether the OLD route is\
  \ dead or merely ungated."
