summary: "TRIAGED 2026-07-26 (run 0048, build-reach lane). Import closure recomputed\
  \ from source with an\nindependent script; supersedes the earlier numbers on this\
  \ row and CORRECTS its staleness figure\nupward. No lake build was run; no module\
  \ was rooted; nothing was deleted.\n\nMEASUREMENT (re-derived, exact)\n  620 .lean\
  \ under the project (619 library modules + the root aggregator AlgebraicJacobian.lean)\n\
  \  526 reachable from the root       93 UNROOTED (20,302 lines, ~15% of the modules)\n\
  \  0 dangling imports, 0 import cycles.  `lake build AlgebraicJacobian` never elaborates\
  \ the 93.\n\nARTIFACT STATE OF THE 93 (lake-authoritative: .trace inputs' recorded\
  \ `:importAllArts` hashes\ncompared against the values the ROOTED build records\
  \ for the same modules, then propagated\nthrough the unrooted import graph).\n \
  \ 47 of 93 DIRTY or absent -- 5 never elaborated at all (no olean/trace: Pic0ThetaCocycle,\n\
  \     ScratchChartLocal, DivSchemeRedesignFlatIdealFibre / LocalIdealFibre / PointPrime),\n\
  \     6 with source newer than their olean, 3 carrying lake `.trace.nobuild` markers\n\
  \     (DivSchemeHighWindowKoszul, DivSchemeSeedUnivPulledDegree, DivSchemeRedesignKappaZFibre),\n\
  \     6 recording an import hash the rooted build disagrees with, + 27 transitively\
  \ downstream.\n  46 have a plausibly-current olean but are still checked by NOTHING\
  \ in the configured build.\n  For comparison: 0 of the 526 rooted modules fail the\
  \ same test.\n  Earlier estimate \">= 22 of 89 dirty\" was low by ~2x.\n\nCOST SIGNAL:\
  \ the 93 unrooted modules carry 551 raised `maxHeartbeats`/`synthInstance.maxHeartbeats`/\n\
  `maxRecDepth` options across 66 files; the 526 rooted modules carry 447 across 99.\
  \ Rooting the\nunrooted tree MORE THAN DOUBLES the project's heavy-elaboration surface.\
  \ Root in small batches.\n\nCONTAMINATED SURFACE: hgraph carries 627 nodes whose\
  \ `file:` is one of the 93; 626 are marked\n`lean_status: lean_ok`. That status\
  \ is auto-synced and is NOT evidence -- the configured build\nnever touched those\
  \ files. The LaTeX blueprint is CLEAN: 0 of 2047 `\\lean{}` names and 0 of 1866\n\
  `blueprint/lean_decls` entries point into an unrooted module.\n\nTHREE BUCKETS\n\
  \n(1) LIVE-UNROOTED -- 80 modules, 18,518 L. 22 of them (6,427 L, 12 dirty) are\
  \ NAMED by a recorded\n    claim; the other 58 (12,091 L, 24 dirty) sit only in\
  \ their import cones (rooting a named one\n    requires them, so the claim rests\
  \ on them transitively).\n    Named, with the claim at risk (module -> citing row/file:line):\n\
  \n    * DivSchemeSeedUnivPointwiseGenerator -- `...ddr.rdn` is DONE on \"PointwiseSeedRDN\
  \ is now\n      promoted to an unconditional ThetaGeneratorSeed.IsGenerator. Landed\
  \ endpoints:\n      pointwiseGeneratorSeed/isGenerator_pointwiseGeneratorSeed\"\
  \ (:258/:274). Those two\n      declarations exist ONLY here. The RD-N keystone\
  \ of the whole DD-R chain is unverified.\n    * DivSchemeSeedUnivPulledDegree (DIRTY)\
  \ -- `...ddr.certificate.cert-assemble` (PENDING):\n      \"hdeg is ALREADY PROVED\
  \ (deg_presentationDivisor_pulledEquations_pointwiseGeneratorSeed,\n      :354)\"\
  . Unrooted AND its olean predates its source AND lake marked it .trace.nobuild.\n\
  \    * DivSchemeSeedUnivPointwise -- `...ddr.rdn` (DONE) cites PointwiseSeedRDN\
  \ (:145);\n      `...cert-assemble` and `...chart-avoid` (DONE) cite pointwiseSide\
  \ (:88); spec-dd-r.md:502.\n    * DivSchemeHighWindowTransitionSaturation (DIRTY)\
  \ -- `...ddr.coefficient-saturation` is DONE\n      on \"the public endpoint is\n\
  \      exists_divUniversalHighWindowShiftedRelationTransitionOfLE_mem_relation_of_mem_readIdeal\"\
  \n      (:424).\n    * DivSchemeHighWindowQuotientBridge (DIRTY) + DivSchemeRedesignChartReadIdeal\
  \ --\n      `...ddr.quotient-bridge` is DONE on \"B/chartReadIdeal(seedK) flat on\
  \ both pinned charts\"\n      (chartReadIdeal, ChartReadIdeal:75).\n    * DivSchemeHighWindowRelationKoszulConjugacy\
  \ (DIRTY) + DivSchemeHighWindowFibreModelInduction\n      (DIRTY) -- `...ddr.koszul-flatness`\
  \ is DONE: \"Endpoints are in <both modules>\".\n    * DivSchemeHighWindowFibreModelBase\
  \ (DIRTY) -- `...ddr.seed-fibre-models` DONE.\n    * DivSchemeHighWindowFibreWindow\
  \ (DIRTY) -- `...ddr.hw-foundation` DONE: \"Evidence includes ...\".\n    * DivSchemeHighWindowSecondContainment\
  \ (DIRTY) -- the ACTIVE parent `...dat-d.ddr` claims\n      \"universal second-window\
  \ containment ... complete\"; it is proved only here (:79/:114).\n    * DivSchemeHighWindowPointwiseGenerator\
  \ (DIRTY), DivSchemeHighWindowPencilDivisor (DIRTY),\n      DivSchemeHighWindowFibreNormalization\
  \ (DIRTY) -- I-0309 (OPEN) records them as built green\n      and axiom-clean.\n\
  \    * EntryIdeal + DivSchemeFlatteningBridge -- `...ddr.flattening-fallback` (PENDING)\
  \ pins its\n      whole cheapest experiment on entryIdeal_le_prime_iff (:379), relMatrix_eq_zero_of_flat\n\
  \      (:245), exists_matrixPresentation_of_isLocalizedModule (:470); `...away-kerspan`\
  \ repeats it.\n    * DivSchemeRedesignRDNChart / RDN / SeedFinish -- informal/spec-dd4-fieldvanishing.md's\n\
  \      RECOMMENDED repair (:216, :251, :279) plans to \"reuse landed chartColengthModule_finite\"\
  \n      (RDNChart:119) and cites flat_chart_colength_divUniversalSeedK (RDN:94,\
  \ I-0302) and\n      chartColengthModuleBase_finite (SeedFinish:92) as landed.\n\
  \    * DivSchemeRedesignSeedUniv -- `...chart-avoid` (DONE) cites seedUniv' (:180);\
  \ spec-dd-r.md:501.\n    * DivSchemeRedesignFibreCut -- cited in the ROOTED file\
  \ DivSchemeRedesignHsub.lean:52.\n    * DivRepKit (DIRTY) -- `...ddr.divrep.lift`\
  \ (ACTIVE), `...cert-relocalize`, `...c9b` all cite\n      DivRepGlobalData (:68)\
  \ / representableBy (:113); informal/w4-rep-critical-path.md:48-50\n      already\
  \ flags it UNROOTED. ANOTHER LANE OWNS IT AND IS ROOTING IT -- do not touch.\n \
  \   * Pic0ThetaCocycle -- see bucket (3).\n\n    HEADLINE: the ACTIVE row `AJCR.w4-rep.datum.dat-d.ddr`\
  \ advertises \"High-window relations,\n    fibre models, nonreduced quotient flatness,\
  \ chart quotient transfer, pointwise RD-N, the\n    unconditional generator, universal\
  \ second-window containment ... and the pulled degree-g\n    identity are complete\"\
  , and `...dat-d` repeats it. EVERY one of those clauses is discharged\n    only\
  \ inside unrooted modules, most of them dirty. The DD-R foundation is source-level\
  \ only.\n\n(2) SUPERSEDED -- 11 modules (1,460 L), 9 of them dirty: the abandoned\
  \ kappa(p)/kappa(z)\n    base-fibre reduction branch. informal/spec-dd4-fieldvanishing.md\
  \ sec.0 rules it \"a dead end\"\n    and recommends abandoning it; the replacement\
  \ generation is the rooted-cited\n    DivSchemeSeedUnivPointwise* chain (`...ddr.rdn`'s\
  \ landed endpoints are pointwiseGeneratorSeed,\n    not isGenerator_seedUniv').\
  \ No open row, worksheet or inbox item names any declaration in them.\n      DivSchemeRedesignKappaZEquiv\
  \ / KappaZFibre / KappaZPurity / KappaZSeed,\n      DivSchemeRedesignFlatIdealFibre\
  \ / LocalIdealFibre / PointPrime (all three NEVER elaborated;\n      FlatIdealFibre's\
  \ own docstring says the sharp route uses RankOneFibre instead),\n      DivSchemeRedesignRankOneChart\
  \ / RankOneFibre / RangeFlatBridge,\n      DivSchemeSeedUnivSecondWindowMap (superseded\
  \ by the rooted DivSchemeSeedUnivSecondWindow /\n      SecondWindowBaseChange).\n\
  \n(3) SCRATCH/BROKEN -- 2 modules (324 L), both never elaborated.\n    * ScratchChartLocal\
  \ (52 L) -- no licence header, single decl `test_chart_local`, imports two\n   \
  \   of the never-elaborated superseded files. Pure scratch.\n    * Pic0ThetaCocycle\
  \ (272 L) -- NOT elaborable as written: I-0359 measured 34.1 GB RSS at 4:58\n  \
  \    still climbing (machine has 62 GB; I-0227 OOM). It holds the only real sorry\
  \ outside\n      Challenge.lean (:268). LIVE ANYWAY, and that is the danger: informal/w7-k1-worksheet.md\n\
  \      is the RATIFIED, mandated worksheet for the OPEN row AJCR.w7-functor.k1 and\
  \ claims at :114,\n      :371, :375 that `pic0Theta k k C = cocycleIdRHS k C` and\
  \ `pic0Theta k M C = cocycleRHS k L M C`\n      \"elaborate with zero errors\";\
  \ I-0224 calls picEtAffHom_congr and the Leg-1..3 reduction\n      \"GREEN\". Nothing\
  \ in the file has ever been checked by anything. Its header (:47-48) forbids\n \
  \     rooting until :268 closes. Budget a SPLIT, not a long run.\n\nRECOMMENDED\
  \ ROOTING ORDER (not executed here). Each step = one `lake build` green before the\
  \ next.\n  A. cheap + zero unrooted deps, highest claim value:\n     EntryIdeal\
  \ (634 L, cone = itself, Mathlib-only) and DivSchemeFlatteningBridge (128 L) --\n\
  \     they decide `...ddr.flattening-fallback`; if the experiment fails, DELETE\
  \ rather than root.\n     DivSchemeRedesignFibreCut (160 L), DivSchemeRedesignRDN\
  \ (112 L).\n     [DivRepKit (144 L) is in this class but is owned by another lane\
  \ right now.]\n  B. small cones (2-5 unrooted modules): RedesignRDNChart(2), RedesignChartReadIdeal(3),\n\
  \     RedesignSeedFinish(3), RedesignSeedUniv(4), HighWindowPencilDivisor(3, 3 dirty),\n\
  \     HighWindowFibreNormalization(4), HighWindowFibreWindow(5).\n  C. THE RD-N\
  \ KEYSTONE, do this before any further DD-R work is planned:\n     DivSchemeSeedUnivPointwise\
  \ (cone 12 / 2,430 L, all clean) then\n     DivSchemeSeedUnivPointwiseGenerator\
  \ (cone 16 / 3,183 L, all clean) then\n     DivSchemeSeedUnivPulledDegree (cone\
  \ 24 / 4,739 L, 1 dirty). These carry `...ddr.rdn` and\n     `...cert-assemble`;\
  \ the first two cones are artifact-clean so the risk is elaboration cost,\n    \
  \ not breakage.\n  D. the high-window tower, LAST and in stages, because it is where\
  \ the dirt is:\n     HighWindowTransitionSaturation (cone 26, 9 dirty) -> RelationKoszulConjugacy\
  \ (40, 22 dirty)\n     -> FibreModelInduction (42, 24) -> QuotientBridge (68, 32)\
  \ -> PointwiseGenerator (73, 33)\n     -> SecondContainment (74, 34).\n  E. DELETE\
  \ (no claim rests on them, superseded generation): the 11 of bucket (2) + ScratchChartLocal.\n\
  \     HUMAN DECISION: Pic0ThetaCocycle (split, or discard and rewrite -- W7-K1 must\
  \ not be planned\n     against it as written); and whether EntryIdeal is ported-with-consumers\
  \ or dropped.\n\nALSO OWED: an hgraph resync policy -- 626 `lean_ok` nodes over\
