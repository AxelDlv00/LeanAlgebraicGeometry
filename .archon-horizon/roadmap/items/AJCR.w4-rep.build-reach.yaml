summary: 'INTEGRITY ISSUE, not cosmetics (found 2026-07-25, run 0048 recon; partially
  addressed by fd46fcf83 for the Zar cert chain). About 95 modules — every DivRep*,
  HighWindow* and Redesign* file — are not reachable from lake''s default target,
  and DivRepAffKitZar.lean has no olean at all. Consequences: (i) their proofs are
  never kernel-checked by the configured final build, so a break there is invisible
  until someone opens the file; (ii) I-0320''s claim that ''no consumer needs a global
  certificate'' holds only modulo the UNBUILT DivRepAffKitZar — the root-reachable
  divRepPullAt (DivRepAffKit.lean:92) still demands a full CertifiedDivisorFamily
  over the chart ring. ACTION: add the missing imports to AlgebraicJacobian.lean in
  dependency order and fix whatever the build then reports. Cheap, and it is what
  makes the certificate relaxation actually load-bearing.'
