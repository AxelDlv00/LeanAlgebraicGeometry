summary: "Pic^0 is an abelian variety of dimension g (A.3 leg of Route A).\n\nWHERE\
  \ THE LEG STANDS after run 0067 r5. The abelian-variety ASSEMBLY is sorry-free\n\
  (Pic0.isAbelianVariety); every remaining obligation is a named leaf, and each of\
  \ the\nfour fronts has been reduced at least once this run.\n\n (a) tangent / H1\
  \ (AJC.pic0av.tangent): ONE open statement, the geometric cocycle\n     comparison\
  \ at Pic0AbelianVariety.lean:805 -- clause (iii), sending a dual-number\n     kernel\
  \ class to its transition unit. Clauses (i) and (ii) closed in r3/r4; the\n    \
  \ linearity bookkeeping is discharged (finrank_eq_of_addEquiv_of_bijective_smul),\n\
  \     and the SCALAR dimension identity dim T_0 = g is proved FROM it.\n\n (b) smooth\
  \ / proper (AJC.pic0av.structure): both are assemblies now. Smoothness\n     reduces\
  \ to GeometricallyReduced and thence to reducedness over k-bar ALONE\n     (smooth_of_isReduced_algebraicClosureBaseChange,\
  \ which also discharges the\n     geometricallyReduced sorry). Properness reduces\
  \ to UniversallyClosed -- and r6\n     REFUTED one of the three routes r3 listed\
  \ for it. NOT \"attackable three ways\":\n     the ambient route is DEAD, because\
  \ UniversallyClosed (PicScheme C).hom is FALSE,\n     not merely hard. Universal\
  \ closedness over an affine base implies CompactSpace of\n     the source (mathlib's\
  \ priority-900 instance to QuasiCompact -- which is why\n     IsProper has no quasi-compactness\
  \ field -- plus PrimeSpectrum.compactSpace), while\n     Pic_{C/k} is an infinite\
  \ disjoint union over deg in Z, the same th:main(1) clause\n     HasPicScheme bundles.\
  \ So universallyClosed_of_ambient and\n     proper_of_ambient_universallyClosed\
  \ are trap (c): true, axiom-clean, reducing\n     NOTHING. Kernel-checked at scheme\
  \ generality in Picard/AmbientPicNotProper.lean.\n     TWO routes remain, both about\
  \ Pic^0 itself (whose source IS quasi-compact): the\n     VALUATIVE criterion, needing\
  \ no quasi-projectivity vocabulary -- which is what\n     I-0074 Caveat 2 says mathlib\
  \ lacks -- and fpqc descent to k-bar. r5 asked\n     ajc-etale-pic to add a UniversallyClosed\
  \ conjunct to HasPicScheme; that ask is\n     WITHDRAWN on I-0493, since it would\
  \ have put a false statement in the shared\n     interface.\n\n (c) degree / dimension\
  \ (AJC.pic0av.identity): PicScheme.degree constructed (r4). The\n     dimension\
  \ statement is reduced to ONE uniform bound in r5, and in r6 the \"<=\" half\n \
  \    of that bound became AXIOM-CLEAN at Pic^0 and lost its [PerfectField k] binder\
  \ --\n     r5's \"genuinely absent\" verdict had measured the wrong invariant, since\n\
  \     ringKrullDim R <= finrank(m/m^2) holds for EVERY Noetherian local ring (Krull\n\
  \     height + Nakayama, both pinned-mathlib). See that child; the earlier\n   \
  \  \"no topologicalKrullDim API\" pricing was likewise a mis-measurement of the\
  \ API\n     surface rather than the definition. The >= half is REDUCED to front\
  \ (a) and nothing else --\n     but it REPORTS sorryAx, inherited from the open\
  \ cocycle comparison at\n     Pic0AbelianVariety.lean:805; only the dimension BRIDGE\
  \ underneath is axiom-clean.\n     An earlier version of this row said \"proved\"\
  ; retracted in 48eea9212.\n\n (d) AJC.rr.principal: CLOSED in r4 (principal_degree_zero,\
  \ at its original binders).\n\nMEASUREMENT DISCIPLINE for this node: smooth/proper\
  \ quantify over [HasPicScheme C],\nwhich the caller discharges, so they report CLEAN\
  \ axioms at the declaration. Measure at\na SYNTHESIS site (scripts/axiom-frontier.lean)\
  \ or the number is not true.\n"
