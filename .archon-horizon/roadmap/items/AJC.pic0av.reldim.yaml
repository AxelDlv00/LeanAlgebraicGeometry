  \ (run 0084 r2), NOT closed. Picard/Pic0EtRelativeDimension.lean, 9 declarations,\
  \ no sorry, rooted, all axiom-clean against controls that fire sorryAx. lake build\
  \ EXIT=0.\n\nWHAT SURVIVED A FRESH-CONTEXT AUDIT (I-1094/I-1095/I-1096, refutations\
  \ reproduced by me before accepting):\n\n(1) CONFIRMED -- obligation 4 IMPLIES obligation\
  \ 2 (Pic0Et.geometricallyReduced), via SmoothOfRelativeDimension.smooth then Smooth.geometricallyReduced\
  \ (geometricallyReduced_of_leafB, smooth_of_leafB). The headline's five are NOT\
  \ independent; distances must not be added. Also found independently by ajc-p3.\
  \ Does NOT make obligation 2 cheaper -- it is the weaker statement, and the kbar\
  \ route on AJC.pic0av.structure is still the right attack.\n\n(2) CONFIRMED -- the\
  \ LOCUS. What the leaf needs is Module.rank S Omega[S/k] = genus C on chart algebras;\
  \ the landed tangent chain gives a finrank at the IDENTITY. Different invariant\
  \ AND different locus. Nothing in the tree computes a chart.\n\nRETRACTED, all three\
  \ by the audit:\n * 'Leaf B is ONE obligation, the smooth half absorbed' -- FALSE.\
  \ leafB_of_chartwise is HasRingHomProperty.iff_appLE.mpr, the class definitionally\
  \ unfolded; the absorption lemma its docstring named is invoked by no declaration.\
  \ The two-input pricing (Pic0Et.smooth + the rank translation) is restored at all\
  \ three sites.\n * 'Homogeneity contributes nothing to the numeral' -- FALSE and\
  \ it inverted the advice. The class field is POINTWISE-existential and the class\
  \ IS IsLocalAtSource for zariskiPrecoverage, so translating charts is the LIVE route.\
  \ Also withdrawn: calling AJCR's smoothOfRelativeDimension_pointTranslationIso circular\
  \ -- its consumer's antecedent is a different composite (left-composed chart inclusion).\n\
  \ * 'Smooth does not carry Locally IsStandardSmooth' -- a synthesis result written\
  \ up as a mathematical one. inferInstance fails; the proposition is a mathlib iff.\n\
  \nWHERE THE NEXT LANE SHOULD AIM: leafB_of_pointwise (added r2 after the audit)\
  \ -- ONE affine chart pair per point of Pic0, owing RingHom.IsStandardSmoothOfRelativeDimension\
  \ without the Locally wrapper. Do NOT aim at leafB_iff_appLE's forall-over-all-chart-pairs\
  \ form: it is an iff but strictly harder than the class. Combine with homogeneity\
  \ (translate a chart at the identity) and the Zariski locality instance.\n\nNO ANTECEDENT\
  \ WITNESSED at any curve. Every declaration binds [HasPicSchemeEt C], whose instance\
  \ projects fgaPicardRepresentability: sorry-free as implications, sorryAx-reachable\
  \ at the use site."
