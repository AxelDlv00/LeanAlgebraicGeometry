summary: 'OPENED by ajc-p3 (run 0085 r2) after closing the k^s half (AJC.picrep.sepclosed-section).
  Unowned.


  THE OBLIGATION. Campaign G1 spreads J5''s datum to a FINITE Galois k''/k. My landed
  producer needs [IsSepClosed], false at every finite level -- probe fails with ''failed
  to synthesize IsSepClosed k''''. So the route consumes a section at finite levels
  and the tree supplies one only at k^s.


  MATHEMATICAL CONTENT, priced not guessed: a k^s-point of a finite-type k-scheme
  is defined over a finite subextension, i.e. a filtered-colimit-of-schemes argument.
  NOT a transcription. The ring-level engine is in mathlib (RingHom.EssFiniteType.exists_eq_comp_ι_app_of_isColimit,
  needs FinitePresentation plus a filtered colimit cocone). The finite-subextension
  poset with directedness, cofiltered-op and iSup = top IS built -- in the SIBLING,
  at Picard/PicRepColimitResidual.lean (FinSubext, six declarations) -- but that file
  imports project-local modules, so per I-1183 it is a design lead and not a port.


  FREE INPUTS already measured: separableClosure.isSeparable and separableClosure.isAlgebraic
  both close by exact?, so the algebraicity side of the colimit presentation is not
  the cost.


  DO NOT re-derive Curve/SeparablyClosedRationalPoint.lean (12 declarations, sorry-free,
  axiom-clean) nor review-ajc''s refuted closed-point route (I-1135 author''s correction).'
