id: AJCR.w4-rep.datum.dat-d.ddr.datum-tail.abel-quotient.etale-sheaf.sigma-comparison.big-etale-sheaf
title: Lift affine Pic0 descent to the big etale site
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: Landed the raw and universe-raised big-etale sheaf certificates for Pic0
  Sigma. Pic0SigmaEtaleSheaf proves pic0SigmaFunctor_isSheaf_etale by reducing propQC
  descent to Zariski descent plus arbitrary surjective etale singleton maps between
  affine schemes, with exact singleton theorem pic0SigmaFunctor_isSheafFor_etaleSingleton
  (16b072ea9e). Pic0SigmaEtaleSheafificationComparison then proves the literal Presieve
  theorem pic0SigmaFunctor_ulift_isSheaf_etale for pic0SigmaFunctor C composed with
  uliftFunctor (4ed731029d), under the exact endpoint hypotheses. Public declarations
  use only propext, Classical.choice, and Quot.sound; scoped and root builds are green.
  The canonical sheafification isomorphism is recorded separately in the sheafification-iso
  sibling, while quotient and Yoneda obligations remain open.
status: done
