summary: Source-faithful Milne frontier. The affine finite-group quotient core, stable
  affine neighborhoods, characteristic-free invariant localization, descended stable
  opens, and finite-cover reconstruction data are verified. This round adds fixed-localization
  cocycle laws, geometric basic-chart transition squares, actual structure-sheaf localization
  equivalences with restriction naturality, and identification of the affine quotient
  map on local sections with fixed-subring inclusion. Global finite quotients, symmetric
  powers, descent, and the remaining abelian-variety geometry remain downstream milestones.
