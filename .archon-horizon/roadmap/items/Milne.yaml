summary: Source-faithful Milne frontier. The affine finite-group quotient core, stable-localization/sheaf-topology
  substrate, and the conditional principal-chart open-immersion implication are verified.
  This round adds flat module and commutative-algebra equalizer descent for explicitly
  supplied descent data, functorial descended algebra maps, and affine Spec/over-category
  base-change effectivity. Global finite quotients still require fixed-localization
  bijectivity and quotient-open gluing/cocycles; finite-Galois, quasi-projective,
  and coherent-sheaf descent, symmetric-power existence, and remaining abelian-variety
  geometry remain pending. No source-node completion is claimed.
