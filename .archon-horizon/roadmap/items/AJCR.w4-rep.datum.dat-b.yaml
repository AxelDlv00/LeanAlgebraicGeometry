summary: "DAT-B: coverage + injectivity. Injectivity is LANDED (worksheet §0.4/§2,\
  \ consumed not proved).\nCoverage (COV-1 = B-5) is now ASSEMBLED over a general\
  \ test, 2026-07-28 run 0072 s0006.\n\nWHAT LANDED THIS PASS (five files, all sorry-free,\
  \ all axiom-clean measured against a sorryAx\ncontrol; Picard/Pic0Chart{TwistSplit,CoverageDegree,RationalGraph,CoverageFibre,CoverageTest}.lean):\n\
  \n  mem_chartLocus_of_drop -- for a point t of an ARBITRARY test T and any plus\
  \ class lam:\n  a splitting of the fibre class at kappa(t), a divisor W0 in the\
  \ twisted class over the\n  splitting field of degree g+e with vanishing H1, and\
  \ the admissible point oracle, give\n  t in chartLocus C m Z lam TOGETHER WITH the\
  \ h0 = 1 normalisation.\n\nSteps 1, 2, 4, 5, 6 of worksheet §1.2 are discharged.\
  \ The satisfiability of the hypothesis\npack was CHECKED (it instantiates at the\
  \ trivial splitting L := kappa(t) with every instance\nsynthesised), not assumed\
  \ -- this lane has shipped a vacuous statement before.\n\nWHAT REMAINS OF B-5 IS\
  \ STEP 3 ALONE: choosing the twist exponent m against the FIBRE'S OWN\nDAT-0a bound.\
  \ No formulation can produce it for the caller -- b_L is per-fibre and provably\n\
  does not transport across k -> kappa(t) (I-0204, worksheet §0.2.2) -- so it appears\
  \ as the\nhypothesis \"a W0 of degree g+e with h1 = 0 exists\". Honest rather than\
  \ hidden.\n\nTWO CORRECTIONS TO THE WORKSHEET, both in it now: step 6 hid a TYPING\
  \ gap (the chart index\nlives on the BASE curve, the drop's divisor over L), and\
  \ the natural repair was the wrong\nobligation. There is NO CurveDivisor base-change\
  \ operation anywhere in the tree, and none is\nneeded: everything downstream mentions\
  \ only the CLASS, and the class-level base change of a\nrational point's one-point\
  \ divisor is the landed graph square (Curve/GraphDivisor.lean:263 +\nRiemannRoch/GraphDegree.lean:422/:445).\
  \ Never transport a coefficient function.\n\nB-6 (the IsLocallySurjective instance\
  \ + DAT-glue handoff) still waits on divRep through C9b.\n"
