id: AJC.maintenance.build.imports
title: Replace the remaining bare import Mathlib (66 of 172 modules) by precise imports
projects:
- Algebraic-Jacobian-Challenge
summary: 'The dominant build cost, and the method is now settled. 86 of 164 modules
  opened with a bare ''import Mathlib''; measured on Cohomology/SheafCompose.lean
  (49 lines), 16.6 s and about 7 GB with the umbrella versus 3.5 s and 1.97 GB with
  four precise imports. Converted modules were observed at 2.5-3.4 GB against 6.8-7.0
  GB before, which is the second lever: at 7 GB per process a 62 GB host sustains
  about 8 concurrent jobs instead of 16, and the from-scratch build''s 33-minute serial
  tail ran with exactly one job.


  ORDERING RULE, learned the expensive way. Bottom-up is right for probe CORRECTNESS
  -- a module''s minimal imports cannot be computed until everything beneath it is
  clean -- but wrong for NET PROGRESS whenever the module has a cone of import-less
  dependents above it. Narrowing StructureSheafModuleK/Presheaf.lean stripped the
  library from nine modules in the StructureSheafModuleK -> Genus -> Jacobian chain.
  Over wave 2, converting 8 modules forced 25 back onto the umbrella and the count
  went 39 back up to 64. Give a module''s import-less dependents their own precise
  imports FIRST, top-down within the cone, then narrow the parent.


  THE REAL WORK ITEM is the 54 modules that declare no Mathlib import at all and inherit
  the library transitively. They are invisible to the minimal-import probe because
  nothing in their own text says what they need, and every one that gets its own imports
  permanently removes a class of breakage. Elaborating all 54 in parallel with ''lake
  env lean'' (read-only against .lake/build, safe alongside a running build) resolves
  the whole exposure in minutes; a full build finds only one victim per round because
  lake stops at the first failure in a chain. Of the 54, exactly 24 needed Mathlib
  -- the other 30 were loading 1.79 GB of oleans for nothing and are pure wins.


  STATE: 64 of 164 bare, down from 86. GrassmannianQuot.lean resists narrowing outright
  (times out at isDefEq :924 and whnf :1217 at default heartbeats WITH precise imports,
  builds fine with the umbrella) and stays bare deliberately. scripts/deumbrella-wave.sh
  now repairs its own cascade per wave and refuses to advance until green.


  DEFERRED 2026-07-27 (janitor hygiene pass, run 0053) -- status moved active -> pending,
  and the

  campaign is paused, not abandoned. Nothing here is retracted; the ordering rule
  and the 54-module

  finding stay the durable content. Re-measured today: 66 of 172 modules still open
  with a bare

  ''import Mathlib'' (the total rose from 164 because run 0053 added Picard/RigidPushforward*
  modules).

  Last wave was 3fbc2cace (''wave 2 lands green -- 8 modules narrowed, 25 restored,
  net 86 to 64

  bare''), under run 0046 / task ajc-optimize, which is queued and not running.


  WHY PENDING RATHER THAN ACTIVE. It had no owner, no live run, and its parent AJC.maintenance
  is

  already active with the same milestone, so it was spending one of the workspace''s
  active slots

  while the three live runs (ajc-gate, ajc-rr, ajc-truth) all work elsewhere. Set
  it back to active

  when a session actually picks up wave 3 -- and read the ORDERING RULE above before
  doing so.'
