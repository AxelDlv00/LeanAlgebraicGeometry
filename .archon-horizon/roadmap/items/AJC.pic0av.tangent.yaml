summary: "Identify the cotangent-space dual at the identity with the Cech H1 cokernel\
  \ and hence with\nH1(C,O_C), including linearity and the finrank comparison.\n\n\
  STATE (run 0067 r4). ONE sorry: semilinearComparison_cotangentSpaceDual_h1Cok\n\
  (Pic0AbelianVariety.lean:820). Its content is clause (iii), the cocycle map sending\
  \ a\ndual-number kernel class to its transition unit, as an ADDITIVE equivalence\
  \ plus the Mumford\nscaling intertwining. Clauses (i) and (ii) are closed, and the\
  \ relative-Picard quotient is out\nof the problem (OnePointRelPicCollapse, run 0067\
  \ r2).\n\nCLOSED THIS ROUND -- THE GENERATOR OBLIGATION, and it was open on BOTH\
  \ sides of the workspace.\nPicard/DualNumberChartTriviality.lean now carries, sorry-free\
  \ and axiom-clean:\n  Submodule.exists_sub_smul_mem_of_quotient_cyclic   M/N cyclic\
  \ => exists m with the binder\n  Submodule.quotient_cyclic_of_exists_sub_smul_mem\
  \   the CONVERSE\n  DualNumber.free_of_quotient_eps_cyclic             invertible\
  \ A[eps]-mod, cyclic M/(eps)M => free\nAJC's free_of_cyclic_mod_eps and AJCR's Opens.cechPicMap_iota_eq_one_of_dualNumberChart\
  \ both\ntook the generator m AND the binder (forall x, exists r, x - r*m in span{eps}*top)\
  \ as GIVEN,\nand both docstrings named \"produce m from L is trivial on C\" as the\
  \ residue -- character for\ncharacter the same obligation. It is not geometry: that\
  \ binder IS cyclicity of M/(eps)M written\nwithout naming the quotient, so m comes\
  \ from Submodule.Quotient.mk_surjective on the generator\nplus mk_eq_zero. Arbitrary\
  \ commutative ring, no finiteness, no cover, no scheme, no curve. The\nconverse\
  \ is included per I-0571, so this is a strict reduction and not a restatement.\n\
  \nMEASURED ABOUT THE SIBLING, and it corrects a reading this node encouraged: AJCR's\
  \ (iii-c2-aff)\nis NOT a sorry, it is a HYPOTHESIS BINDER (their worksheet SS0(4):\
  \ never register a staged\nfact). Correct discipline, but it makes their open content\
  \ invisible to a sorry census -- so\n\"AJCR is sorry-free here\" had been read as\
  \ \"AJCR has this\". They do not. Neither side had the\ngenerator until this round.\n\
  \nWHERE AJCR IS GENUINELY AHEAD, all sorry-free and scheme-general: (iii-a) twoChartClass,\n\
  (iii-b) its injectivity, (iii-c1) twoChartClassHom_mk_range, (iii-c2-Zar)\ntwoChartClassHom_surjOn_of_chartTrivial.\
  \ But all four are welded to X.CechPic over\nX.PointedCover, and AJC HAS NEITHER\
  \ -- zero occurrences. Not importable (no cross-project\ndependency), and porting\
  \ means first building the sheaf-side glue-from-a-transition-unit\ncomparison against\
  \ AJC's LineBundle.OnProduct setoid, where their Quot.ind-on-a-Cech-\nrepresentative\
  \ proof has nothing to land on. Genuinely portable instead:\nTangent/DualNumberCarrier.lean\
  \ and DualNumberCarrierReduction.lean -- clause (ii) ON UNITS in\nsheaf vocabulary,\
  \ where AJC has only the algebra-level baseChangeAlgEquiv.\n\nMATHLIB v4.31 HAS\
  \ NOTHING for the surjectivity half: there is no Picard group of a SCHEME at\nall\
  \ (zero hits in Mathlib/AlgebraicGeometry). Only ring-level CommRing.Pic, whose\
  \ one exact\nsequence is a localisation sequence. Mayer-Vietoris there is AddCommGrp-valued\
  \ so it cannot see\nO^times. AJCR's is the only implementation in either tree.\n\
  \nRESIDUE, in order of size: (1) the cocycle map itself, clause (iii) -- the sorry;\
  \ (2) within\nchart triviality, identifying \"L restricts trivially along eps ->\
  \ 0\" with \"M/(eps)M is cyclic\",\ni.e. freeness of the RESTRICTION, which is what\
  \ remains of (iii-c2-aff) now that the generator\nis closed.\n\nSTILL TRUE, do not\
  \ re-derive: finrank_eq_of_addEquiv_of_bijective_smul;\ncotangentSpaceDual_equiv_relPicKernel;\
  \ relPicKernelSMul and laws;\nDualNumber.truncExpCechKernelAddEquiv; residueFieldIso_of_section_over_field;\n\
  baseChangeAlgEquiv (clause ii); free_of_cyclic_mod_eps (clause i);\nrelPicDualKernelAddEquivAbsKernel.\
  \ No Hilbert 90, no henselian campaign.\n"
