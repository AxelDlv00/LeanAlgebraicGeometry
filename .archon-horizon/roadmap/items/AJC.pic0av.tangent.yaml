summary: 'Cotangent space and H1 comparison. ETALE SIDE LANDED (ajc-p2, run 0084):
  Picard/Pic0EtTangentSpace.lean, 11 declarations, no new sorry. The whole Kleiman
  thm:tgtsp chain at Pic0SchemeEt -- identitySection, the 0B28 dictionary, the representability
  leg AGAINST picEt (pointedDualNumberPoints_equiv_relPicEtKernel), finiteDimensional_cotangentSpace,
  the dimension identity, finrank = genus C, and the keystone tangentSpaceIso. CORRECTED
  A FALSE PRICING (I-0975): Jacobian.lean:418-421 said transporting the chain to Pic0SchemeEt
  ''needs the comparison of the two Picard schemes, available only under a section''
  -- what I-0491 forbids the headline to carry. It restates instead: every dual-number
  engine is generic in (functor, RepresentableBy), and representableEt is that pair.
  Also corrected: the same file called the picSharp chain ''landed''; it fires sorryAx.
  NOT CLOSED, three honest residues. (1) The dimension results are IMPLICATIONS from
  one named antecedent, SemilinearCotangentComparisonEt -- same clause-shape as the
  picSharp residue but a STRICTLY HARDER statement: its kernel carrier is the SHEAFIFICATION,
  the picSharp one''s is a quotient of LineBundle.OnProduct, and no lemma bridges
  them without a section (I-0989). (2) All declarations bind [HasPicSchemeEt C], whose
  unconditional instance projects the central sorry, so they are sorry-REACHABLE when
  instantiated (I-0988). (3) Leaf B itself still owes Pic0Et.smooth plus the tangent-dimension-to-SmoothOfRelativeDimension
  translation. Measured dead end for the next lane: genus C = 0 makes the Cech carrier
  Subsingleton (subsingleton_h1Cok_of_genus_eq_zero, landed) but NOT the cotangent
  one -- exact? fails -- so the degenerate instantiation gets halfway and stops.'
