id: AJC.pic0av.tangent
title: Cotangent space and H1 comparison
projects:
- Algebraic-Jacobian-Challenge
summary: "Identify the cotangent-space dual at the identity with the Cech H1 cokernel\
  \ and hence with\nH1(C,O_C), including the required linearity and finrank comparison.\n\
  \nSTATE (run 0067 round 2, ajc-pic0av, commits bec31ea23 + 2e5a71f57 + 6ea200abb).\n\
  THE RELATIVE QUOTIENT IS GONE FROM THE PROBLEM. Previously the residue was \"clause\
  \ (iii),\nthe cocycle identification\"; that clause silently also had to bridge\
  \ a carrier mismatch,\nbecause the Cech side computes with ABSOLUTE Picard classes\
  \ while the representability leg\ndelivers a class in the RELATIVE functor Pic/pi^*\
  \ Pic(T). That half is now closed.\n\nNEW, sorry-free and axiom-clean (Picard/OnePointRelPicCollapse.lean,\
  \ 8 decls, all\n[propext, Classical.choice, Quot.sound]; work-reviewer verified\
  \ independently this round):\n * LineBundle.IsLocallyTrivial.trivial_of_subsingleton\
  \ -- SCHEME-GENERAL, upstreamable: a\n   locally trivial module on a one-point scheme\
  \ is GLOBALLY trivial. Every nonempty open of a\n   one-point space is top, so the\
  \ chart trivialisation already IS global. Cover-free.\n * relPicQuotAddEquivAbs\
  \ : Pic(C x_S T)/pi_T^* Pic(T) =+ Pic(C x_S T) for Subsingleton T.\n * kerRelPresheafAddEquivKerAbs,\
  \ and its name in the tangent file\n   relPicDualKernelAddEquivAbsKernel : relPicDualKernel\
  \ C =+ ker((PicSharp C).map (eps->0)).\n   relPicDualKernel C is LITERALLY the domain,\
  \ not a lookalike (reviewer-checked).\n\nWHY IT WAS CHEAP, and this is the transferable\
  \ lesson (I-0544, I-0495): the collapse is\nTOPOLOGICAL. Both AJCR's t4 worksheet\
  \ and this project had priced it as commutative algebra --\n\"Pic of a finite product\
  \ of Artin local rings vanishes\", true, real algebra, and unnecessary.\nSearch\
  \ the shape of the OBJECT (a one-point space), not of the argument you expect.\n\
  \nCROSS-CARRIER NOTE: AJCR proved the same collapse in five lines because its relative\
  \ group is a\nQuotientGroup by an honest subgroup picFromBase. AJC's carrier is\
  \ a SETOID quotient of\nLineBundle.OnProduct with no subgroup to name, so it had\
  \ to be proved at the level of the\nRELATION (relPicRel_iff_iso_of_subsingleton,\
  \ both directions). The IDEA ported; the proof did not.\n\nRESIDUE, and it is now\
  \ genuinely one thing: the cocycle map itself, sending a kernel class to\nits transition\
  \ unit, statable directly against the ABSOLUTE kernel. ajcr-w5-av split it further\n\
  (I-0495): (iii-a) the two-chart Cech-units hom and (iii-b) its injectivity are LANDED\
  \ on the\nAJCR side for any scheme with a two-open cover; only (iii-c), surjectivity\
  \ onto the eps-kernel,\nis open. That is the joint residue of both developments.\n\
  \nCARRIER TRAP, recorded twice now in this lane: instance SYNTHESIS, not missing\
  \ structure.\nrelPicQuotAddEquivAbs is stated on bare Quotients; consumers see (relPresheaf\
  \ C).obj (op T),\nwhich is AddCommGrpCat.of of that Quotient. They agree but NOT\
  \ at instances transparency --\nAddMonoidHom.mem_ker against the raw Quotient fails\
  \ with a Membership INSTANCE mismatch, which\nreads like a missing simp lemma. Fix:\
  \ relPresheafObjAddEquivAbs, the same equivalence restated\nonce at the functor-object\
  \ carriers. Same genus as the subtype-vs-AddSubgroup trap on\nrelPicDualKernel last\
  \ round.\n\nSTILL TRUE, do not re-derive: finrank_eq_of_addEquiv_of_bijective_smul;\n\
  cotangentSpaceDual_equiv_relPicKernel; relPicKernelSMul and laws;\nDualNumber.truncExpCechKernelAddEquiv;\
  \ residueFieldIso_of_section_over_field;\nDualNumber.baseChangeAlgEquiv (clause\
  \ (ii)); free_of_cyclic_mod_eps (clause (i)).\nNo Hilbert 90 and no henselian campaign\
  \ -- the thickening is square-zero.\n"
