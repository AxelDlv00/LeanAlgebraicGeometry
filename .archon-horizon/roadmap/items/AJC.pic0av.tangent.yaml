id: AJC.pic0av.tangent
title: Cotangent space and H1 comparison
projects:
- Algebraic-Jacobian-Challenge
summary: "Identify the cotangent-space dual at the identity with the Cech H1 cokernel\
  \ and hence with\nH1(C,O_C), including the required linearity and finrank comparison.\n\
  \nSTATE (run 0067 round 1, ajc-pic0av, commits 22951397c + e1348449d). The residue\
  \ is now ONE of\nthe three clauses of the geometric middle. finrank_cotangentSpaceDual_eq_finrank_h1Cok\
  \ is not a\nsorry; the single named obligation is semilinearComparison_cotangentSpaceDual_h1Cok,\
  \ whose\ndocstring lists the middle as three clauses:\n\n (i)   an invertible sheaf\
  \ on C x_k Spec k[eps] trivial along eps -> 0 is trivial on the two\n       base-changed\
  \ charts;\n (ii)  Gamma(V x Spec k[eps], O) = Gamma(V, O)[eps] for affine V;\n (iii)\
  \ under those identifications a kernel element goes to its transition unit.\n\n\
  CLAUSE (i) IS CLOSED (run 0067 r1), sorry-free and axiom-clean, in two new files:\n\
  \ * Picard/NilpotentThickeningFree.lean -- an invertible module over a ring with\
  \ a NILPOTENT\n   ideal I, cyclic modulo I, is free. Mathlib-general, an upstreaming\
  \ candidate. Two things\n   make it work and both are worth knowing: (a) for INVERTIBLE\
  \ modules a surjection from the\n   ring is automatically bijective (mathlib Module.Invertible.bijective_of_surjective),\
  \ so\n   'generated by one element' gives Free outright -- false for general modules;\
  \ (b) the\n   Nakayama iteration N + I^n.M = M is proved WITHOUT any finiteness\
  \ hypothesis, unlike\n   mathlib's Submodule.le_of_le_smul_of_le_jacobson_bot which\
  \ needs N.FG and I <= jacobson bot.\n   (b) is not a nicety: affine charts of a\
  \ curve do NOT have finite-dimensional section spaces\n   over k, so a finitely-generated\
  \ version would be unusable here.\n * Picard/DualNumberChartTriviality.lean -- the\
  \ specialisation. ker(A[eps] -> A) is SQUARE-ZERO\n   (augIdeal_mul_self_eq_bot)\
  \ hence nilpotent, and equals (eps) (ker_fstHom_eq_span_eps, both\n   spellings\
  \ recorded since representability produces one and the cocycle side the other),\
  \ so\n   free_of_cyclic_mod_eps: an invertible A[eps]-module trivial along eps ->\
  \ 0 is free.\n\nCLAUSE (ii) WAS ALREADY LANDED and nobody had noticed: DualNumber.baseChangeAlgEquiv\n\
  (Picard/Pic0DualNumberCocycle.lean:1133), A tensor_k k[eps] = A[eps].\n\nSO THE\
  \ RESIDUE IS CLAUSE (iii) ALONE -- the cocycle-level identification. The square-zero-ness\n\
  that the cross-project note (I-0495) relies on for its 'no Hilbert 90, no henselian\
  \ brick'\nconclusion is now a theorem rather than an observation.\n\nSTILL TRUE,\
  \ do not re-derive: finrank_eq_of_addEquiv_of_bijective_smul (the finrank form of\n\
  rank_eq_of_equiv_equiv, correct instrument because kappa(e) and k are DIFFERENT\
  \ rings);\ncotangentSpaceDual_equiv_relPicKernel; relPicKernelSMul and laws;\nDualNumber.truncExpCechKernelAddEquiv;\
  \ residueFieldIso_of_section_over_field.\n\nCROSS-PROJECT (I-0495, ajcr-w5-av):\
  \ this leg needs NEITHER Hilbert 90 NOR a henselian\ncover-splitting brick; after\
  \ the trunc-exp linearisation the descent condition is ADDITIVE and\nAlgebra.FormallyEtale.comp_bijective\
  \ covers the square-zero thickening. Do not open a\nhenselian campaign. Also: Subspace.dual_finrank_eq\
  \ needs no finiteness side condition."
