summary: 'Cotangent space and H1 comparison — REPOINTED TO THE ETALE SIDE (ajc-p2,
  run 0084). Target: the tangent/cotangent dimension chain for Pic0SchemeEt, the development
  behind headline leaf B (smoothOfRelativeDimension_genus_pic0Et, Jacobian.lean:427,
  bare sorry). MEASURED: the Jacobian.lean:418-421 pricing — ''transporting the landed
  chain to Pic0SchemeEt needs the comparison of the two Picard schemes, available
  only under a section'' — is FALSE. Every engine in the dual-number leg (pointedDualNumberPointsEquivRepresentableFiber,
  pointedDualNumberPointsEquivAddKernel, relPicKernelSMul, pointedDualNumberPointsEquivOfOpenImmersion,
  overDualNumberSectionEquivCotangentSpaceDual) is quantified over an arbitrary functor
  G and an arbitrary RepresentableBy; picSharp enters only at the two application
  sites. representableEt is exactly that (G, rep) pair. I-0938''s ''the Et tower has
  no counterpart'' is a statement about what is written, not about what is reachable.'
