title: 'Finite-field avoidance: bound fibre support by g and avoid it after a large
  finite extension'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: '*** PROTECTION CONFLICT in this row''s REMAINING clause, flagged review-ajcr
  r7 (2026-07-30). This row is pending at HIGH priority, so it reads as the next thing
  to do -- and the work it names is forbidden. ***


  STATE: 2 of 3 children DONE. finite-field-avoid.cardinality (e602378af) proves the
  exact finite-cardinality P1 avoidance theorem under S.ncard + 2 <= card(k). finite-field-avoid.support-degree
  (d6c67f41d) builds the pointwise seed residue equations with no certificate and
  no hproj, and bounds their support by g points.


  THE REMAINING CLAUSE AS WRITTEN IS FORBIDDEN. It said the third child ''must choose
  a large finite Galois extension, transport P1 twists and fixed-twist divisor charts
  through scalar extension, and descend the semilinear outer atlas'', depending on
  the twist-atlas architecture. Human decision I-0492 clause 1 forbids both halves
  -- the GL_2(k)/Aut(P1) action on P1 (twistedP1Map = pi >> P1.autOfMatrix) and descent
  work whose only purpose is to rescue R1 -- and twist-atlas is REJECTED on exactly
  that ground. See the descent leaf for the full flag.


  WHAT IS ACTUALLY LEFT, and it is smaller than the clause implies: the descent leaf''s
  FIRST sentence only -- transport the residue support into P1(k), combine image-ncard
  injectivity with the ncard <= g bound and the (done) finite-cardinality theorem,
  and spread the fibre containment to a support tube. No twist, no Galois descent,
  and both its inputs are done.


  WHY THE PRICE MOVED IN THE GOOD DIRECTION: the twist quantifier this row was trying
  to absorb with an outer atlas simply does not occur on the widened carrier -- IsLocallyCertifiedAff,
  DivFamZarAff and divFunctorAff take (C, R, n) and no pi. So finite-field avoidance
  does not owe an atlas; it owes the endpoint assembly.


  Priority left high on the assembly, which is legitimate and unclaimed.'
