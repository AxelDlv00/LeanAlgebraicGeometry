summary: 'PENDING — WORKSHEET RATIFIED (informal/w5-t4-worksheet.md, route (ii): kernel-level
  cancellation over k, uniform in K/k). Two fears are dead: the Artin-local splitting
  needs NO henselian machinery (the thickening k[eps]->k is square-zero, so FormallyEtale.comp_bijective
  does the whole job, and mathlib has no henselian cover-splitting anyway), and the
  "Hilbert-90 cancellation" dissolves into the already-landed module-level Amitsur
  exactness (Descent/ModuleDescent.lean:247), because the trunc-exp linearisation
  happens BEFORE descent, making the descent condition additive. Five bricks T4-a..T4-e;
  T4-a and T4-c have NO gates and launch immediately.


  THE TARGET IS THE SEMILINEAR COMPARISON, NOT A BARE KERNEL BIJECTION (corrected
  2026-07-28, I-0513). A set bijection of eps-kernels does not transport finrank,
  so T5 hdim needs an ADDITIVE equivalence plus the intertwining law across kappa(e)
  ~+* k. The finrank bridge is now landed (JacobianData.finrank_eq_of_addEquiv_of_bijective_smul,
  commit e441cf715), so T4-e should be stated to output the additive/intertwining
  data, not just the bijection. Getting this wrong makes a perfect kernel computation
  still insufficient.


  THIS IS THE ONE REMAINING TARGET OF WAVE 5: the T5 numeral, S1-a and the S3 count
  are all consumers of this single computation.'
