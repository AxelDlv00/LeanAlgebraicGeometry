summary: 'T4 (WORKSHEET-FIRST, risk R1): the étale-plus/Zariski kernel crossing at
  $k[\varepsilon]$.


  **(3c) IS CLOSED (run 0073 r5)** — `Tangent/DualNumberUnitTransport.lean`, `lake
  env lean` EXIT=0.

  The monoidal-unit seam `Over.mk (\mathbb{1}) \cong \mathrm{overSpec}\ k\ k` is an
  **isomorphism**

  built from `Over.isoMk (Iso.refl _)`; the predecessor''s prescribed `eqToHom` is
  not needed, since the

  two objects share their underlying scheme by `rfl` and `Spec.map_id` is spent only
  on the

  structure-morphism triangle. Because it is an iso rather than a rewrite, a kernel
  statement crosses

  it in **both** directions — which is what the kernel comparison needs. Yields

  `(C \triangleleft \mathrm{overDualNumberZero}).left = \mathrm{transportLeft} \gg
  \mathrm{relCurveMap}`,

  the identification worksheet §6.24 named as the one link between the engine''s arrow
  and item (1)''s.


  **Also landed: the ring-theoretic bridge under (iii-c2-aff-geo)** —

  `Tangent/DualNumberFstKernel.lean`, `ker fstRingHom = span {\varepsilon}`, hence

  $A[\varepsilon]/(\varepsilon) \simeq A$. The two sides of that obligation named
  different

  constructions (a base change vs a quotient) and mathlib links them only via

  `QuotSMulTop.equivQuotTensor`, which needs $A$ to *be* the quotient ring. No curve,
  no field, no

  finiteness: portable to the AJC sibling verbatim.


  **RESIDUE, honestly sized.** (iii-c2-aff-geo) itself is still open: it lives at
  the level of a

  `CechPic` class on a chart of the thickened curve and owes the identification of

  `Opens.cechPicClass` of the restricted bundle with the base change of the class
  upstairs. Plus the

  two named consumer inputs ($V_0 \neq \bot \wedge V_0 \neq \top$, and `Surjective
  f.base` at

  $\varepsilon \mapsto 0$), both satisfiable and both still unwitnessed in the tree.


  **CROSS-PROJECT (I-0689 adjudicated).** `ajc-pic0av` reports the two-chart Čech
  machinery cannot

  close clause (iii) because `CechPic` reaches invertible sheaves only through an
  `[IsAffine]`-gated

  dictionary. That is **correct for AJC and does not transfer**: `LineBundle` occurs
  in zero AJCR

  files, `relPic` *is* a `CechPic` quotient by definition, and `cechPicEquivPic` has
  no call site in

  AJCR''s tangent chain. The missing arrow points the other way on each side.

  '
