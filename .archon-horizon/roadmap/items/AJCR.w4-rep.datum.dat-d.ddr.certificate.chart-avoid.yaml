summary: "THE GEOMETRIC INPUT OF THE CERTIFICATE, now known to be forced — but COMPONENTWISE,\
  \ not globally.\n\nTHE VERDICT (Picard/DivSchemeCertZarC1.lean + DivSchemeCertZarConn.lean,\
  \ both kernel-checked):\n  supportLocus_subset_chart_of_isCertified :\n    IsPreconnected\
  \ supportLocus -> A.IsCertified n -> supportLocus subset V_0 or supportLocus subset\
  \ V_1.\nThe (c1) half is now PROVED in both directions (supportLeak_eq_empty_iff_finite_colength),\
  \ so this\nis a statement about IsCertified itself, not merely about the landed\
  \ assemblers. Contrapositive: a\nCONNECTED divisor meeting both pi^{-1}(0) and pi^{-1}(infinity)\
  \ has NO certified adaptation, over any\nbase, after any Zariski shrink. Base localization\
  \ cannot evade it (Spec R[x]/(x^2-t) over k[t] is\nconnected over every basic open),\
  \ and DivEq re-spelling cannot (supportLocus is a germ-unit locus,\ninvariant under\
  \ unit rescaling — though no in-project lemma states that yet; worth adding).\n\n\
  SCOPE CORRECTION (work-reviewer, I-0339). The hypothesis is CONNECTEDNESS, and a\
  \ degree-g relative\ndivisor is typically DISCONNECTED: two disjoint sections, one\
  \ inside V_0 \\ V_1 and one inside\nV_1 \\ V_0, have both chart traces closed while\
  \ the divisor lies in neither chart and meets both\nfibres. So the honest necessary\
  \ condition is that EACH CONNECTED COMPONENT of the support is\nchart-confined,\
  \ not the whole support. Do not state this leaf as \"supp subset V_0 or supp subset\
  \ V_1\".\n\nWHAT THIS LEAF MUST NOW DECIDE. The DD-R chart contains NO fibre-avoidance\
  \ condition anywhere — the\nground checkpoint verified this across ThetaGeneratorSeed\
  \ (DivSchemeFamily.lean:74, whose `side`\nfield merely picks SOME chart containing\
  \ each point, so a point of pi^{-1}(0) is legal), IsGenerator,\nrelThetaSections,\
  \ FinCoverData, DivisorAdaptation, IsCertified, DivCarveChartRing, DivScheme and\n\
  DivSchemeAtlasFactor. The only occurrences of pi^{-1}(0)/pi^{-1}(infinity) in the\
  \ whole Lean tree are\ndoc comments in the run-0048 files. AND THE SPEC FORBIDS\
  \ ADDING ONE: informal/spec-dd-r.md\n§Discipline (2) and §1 ADJUDICATION A say \"\
  never a support condition supp D cap pi^{-1}(Gm) = empty\n... any DD-R prover writing\
  \ a support-separation hypothesis has left the route.\" Meanwhile ADDENDUM 1\nitem\
  \ 2 asserts the universal family \"is honestly certified over each Z(diamond)-chart\
  \ ring\", which no\nunconditional Lean theorem backs — every landed producer of\
  \ IsCertified takes hnoLeak,\nkernel-spanning or separation as a HYPOTHESIS.\n\n\
  So the spec and the landed mathematics now contradict each other, and this is NOT\
  \ a lemma to grind:\nit is carve-the-atlas, weaken-IsCertified, or re-scope. Escalated\
  \ to the human as inbox I-0333.\n"
