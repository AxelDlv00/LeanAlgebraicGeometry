id: AJCR.w4-rep.datum.dat-d.ddr.certificate.chart-avoid
title: 'Chart-avoid: ANSWERED — NO. The Z(diamond) chart does not confine its divisors;
  the binding constraint is FinCoverData'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'ANSWERED 2026-07-25 (run 0048 round 1). The answer is NO, on three independent
  grounds, and

  nothing downstream is blocked on a human any more. Deliverable of record: informal/spec-dd-r.md

  ADDENDUM 3, which supersedes ADDENDUM 2 §4 and ADDENDUM 1 item 2. Inbox I-0333 is
  answered.


  (a) THE SEED CARRIES NO EXACTNESS DATUM. ThetaGeneratorSeed (Picard/DivSchemeFamily.lean:74)

  has five fields, IsGenerator (:129) two; none mentions Theta, pole order or a chart.
  Every

  universal instantiation of `side` picks an ARBITRARY chart containing the point
  (seedUniv

  DivSchemeSeedUnivGen.lean:283, seedUniv'' DivSchemeRedesignSeedUniv.lean:180, pointwiseSide

  DivSchemeSeedUnivPointwise.lean:88), so a point of pi^-1(infinity) is legal everywhere.


  (b) ADDENDUM 2 §4''s "tractable half" IS A WHOLE DISJUNCT, AND ITS ARGUMENT IS CIRCULAR.
  Theta =

  fiberWeilDivisor pi is supported on V_0 \ V_1 (FLVFiberToolkit.lean:292/:311/:254),
  so

  set-theoretically Theta = V_1^c and "supportLocus cap pi^-1(infinity) = empty" IS
  the disjunct

  supportLocus subset V_1. And IsGenerator.dvd makes supportLocus the base locus of
  K, so "a

  generator of exact pole order a exists at y in Theta" holds iff the base locus misses
  y:

  premise = conclusion.


  (c) EXPLICIT COUNTEREXAMPLE, STABLE UNDER EVERY ZARISKI SHRINK. Over k[t] with C
  = P^1, pi = id,

  F = t X^2 + X Y + t Y^2 cuts a relative effective Cartier divisor, finite flat of
  degree 2

  (coefficients (t,1,t) generate the unit ideal). F(1,0) = F(0,1) = t, so the fibre
  at t = 0 is

  Z(XY) = {0, infinity}: it meets BOTH vertical fibres. In the chart Y = 1, F = t(x^2+1)
  + x is

  degree 1 in t with coprime coefficients, hence irreducible in k[x,t]; the only point
  over Y = 0

  is (infinity, 0), in the closure. So D is IRREDUCIBLE, D -> A^1_t is finite surjective,
  and over

  EVERY nonempty open of the base D stays irreducible hence preconnected. Every Zariski
  cover has

  a member containing t = 0. By supportLocus_subset_chart_of_isCertified this divisor
  is NOT

  IsLocallyCertified.


  CORRECTION TO THE RECORD: the witness this leaf previously cited, Spec R[x]/(x^2
  - t) over k[t],

  does NOT meet pi^-1(infinity) (its points x = +-sqrt t are always finite), so it
  is chart-confined

  and is not a witness. The conclusion stands; the witness above is the correct one.


  (d) THE OBSTRUCTION SURVIVES THE DivEq QUOTIENT (landed this round, kernel-checked,

  Picard/DivSchemeCertZarConfine.lean): DivEq.supportLocus_eq — the support locus
  is a divisor

  invariant — hence not_isCertified_of_divEq_of_isPreconnected_of_witnesses: NO representative
  of

  the class admits a certified adaptation. DivFamZar is a DivEq quotient, so DivFamZar
  is not the

  relative-divisor functor and divRep against it would represent the wrong object.


  THE BINDING CONSTRAINT is FinCoverData (DivisorFamily.lean:160-176), which hardwires

  h_0 : Fin m_0 -> Gamma(V_0), h_1 : Fin m_1 -> Gamma(V_1) with a partition of unity
  on EACH pinned

  chart. Not pi, not the cover''s fineness, not the submodule L, not the base. Any
  repair must

  introduce an adaptation piece NOT contained in a single pinned chart. Successor
  leaves: p1-aut,

  fibre-avoid, cert-relocalize, confine-open.

  '
