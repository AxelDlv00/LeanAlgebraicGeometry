summary: 'STATUS AND ANCHOR CORRECTED by review-ajc 2026-07-29. This node was `done`
  and cited a deliverable that does not exist; both were wrong.


  WHAT THIS NODE DISCHARGES, repointed. `Scheme.fgaPicardRepresentability` in
  `Picard/FGAPicRepresentability.lean` — a bare `sorry`, the project''s central open
  obligation. The previous text said "Discharges instHasPicScheme
  (FGAPicRepresentability.lean:259)". Both halves were stale: `instHasPicScheme` exists
  in no `.lean` file (deleted 2026-07-28 under I-0491, never discharged; every grep hit
  is prose — re-verified at HEAD 2026-07-30, 26 hits, all docstring or comment), and
  line 259 fell mid-docstring, inside the bundling rationale above `class HasPicScheme`.
  The live gate is `HasPicSchemeEt`, whose instance `instHasPicSchemeEt` is
  `(fgaPicardRepresentability C).1` — a projection of that same sorry, so the gate
  synthesizes freely and carries the sorry into every consumer.


  AND THE REPOINT ITSELF WENT STALE, in the paragraph announcing it (review-ajc r7,
  2026-07-30). The four numbers above — 347 for the theorem, 355 for the class, 366 for
  the instance, 263 for `class HasPicScheme` — were all wrong at HEAD nine hours later:
  the theorem head is 757, the sorry 765, and every one of 347/355/366 lands
  mid-docstring, i.e. the SAME defect this row was corrected for. They are now removed
  rather than refreshed. Cite declaration names here; do not restore line numbers. This
  is the fifth repetition of a failure this lane has filed four times, and the third
  time the repair re-created it.


  THE ASSEMBLY STEP, unchanged in substance. Glue the `h0=1` loci into `Pic^r` over
  a separably closed field (campaign J1-J5; needs the mathlib 01JJ engine and a universe
  bridge, since `picSharp` is `Type (u+1)`-valued while 01JJ wants `Type u`), spread
  the finite glue datum to a finite Galois level (G1), descend `picSharp` points through
  rigidified pairs (G3), and assemble the degree pieces as a coproduct over Z (G4).


  WHY IT IS NOT CLOSE. Of the campaign modules this node consumes, `Picard/MilneGlue.lean`
  (J5), `Picard/PicSharpGaloisDescent.lean` (G3) and `Picard/PicTotalAssembly.lean`
  (G4) do not exist on disk, and neither do their inputs B1 `PicSharpZariskiSheaf`,
  B4 `PicSharpDegree`, B6 `PicSharpSeparatedDevice`, or the `Div^d` chain D2''-D4''.
  What IS landed and reusable: G2 the finite Galois quotient engine (`Picard/FiniteGaloisQuotient.lean`,
  sorry-free) and the Speiser semilinear descent under `Picard/GaloisDescent/`, plus
  B3 `Picard/RigidPushforward.lean` and the discharged gate `AJC.picrep.rigidpushforward`.
  Assembly cannot start before D4'' and J1-J5; a lane wanting this cone should take
  a campaign milestone, not this node.


  ROUTE NOTE. This node''s quotient step is the FINITE GALOIS quotient (G2, landed),
  not `smoothProperQuotient` / `HasSmoothProperQuotient` — that is the Altman-Kleiman
  lemma of the rejected quotient route, is false as stated in Lean (no quasi-projectivity
  vocabulary at the pinned mathlib; protection I-0074 caveat 2), and must not be built
  against.

  '
