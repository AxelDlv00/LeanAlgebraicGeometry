summary: 'Assemble the Picard scheme on the committed Milne-Kollar route: glue the
  h0=1 loci into Pic^r over a separably closed field (needs the 01JJ engine and a
  universe bridge, since picSharp is Type (u+1)-valued), spread the finite glue datum
  to a finite Galois level, descend picSharp points through rigidified pairs, and
  assemble the degree pieces as a coproduct over Z. Discharges instHasPicScheme (FGAPicRepresentability.lean:259),
  which is currently the sole producer of HasPicScheme and sorry-bodied, so its axioms
  leak by synthesis into every consumer (measured: scripts/axiom-frontier.lean).


  Superseded description: this node previously read ''combine Quot representability
  and flattening stratification''. That was the Grothendieck/Kleiman quotient route,
  which the tree marks off-path -- see AJC.picrep.'
