summary: '**North star of the clean rebuild** (`Algebraic-Jacobian-Challenge-Rebuild`,
  mirrors `AJC.jacobian`). For a smooth proper geometrically-irreducible curve $C/k$,
  the Jacobian is an abelian variety representing the degree-$0$ relative Picard functor
  with the Abel–Jacobi / Albanese property:

  $$\mathrm{Pic}^{0}_{C/k}\ \text{representable},\qquad \dim_{k}\mathrm{Pic}^{0}_{C/k}=g,\qquad
  \forall\,(C,P)\to A\ \exists!\ \mathrm{Pic}^{0}\to A.$$

  Target pinned in `Challenge.lean` (`Jacobian`, `instGrpObj`, `ofCurve`, `comp_ofCurve`),
  currently a `⟨sorry⟩` scaffold. The rebuild re-derives the whole cone from scratch
  on mathlib v4.31; substrate is largely landed (238/259 blueprint nodes proved).

  '
