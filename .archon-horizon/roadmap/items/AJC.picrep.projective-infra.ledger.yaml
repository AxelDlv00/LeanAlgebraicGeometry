summary: DONE as phase-0 demand accounting and kept live as a consumer ledger. DemandLedger.lean
  retains exactly one intentional root sorry, PointedPicSharpQuasiProjectivePieces,
  which packages missing Picard representation rather than projective infrastructure.
  It now imports EffectiveCartierSupport and proves d3Support_locallyQuasiFinite_of_curve
  by synthesis, so the finite-fibre D3 input is spent in consumer closure; the whole-fibre
  ExistsUnique locus is explicitly still open. Closed Grassmannian rows point directly
  to the proved API, and the two deleted re-spelling wrapper nodes have been removed
  from hgraph. Relative Proj and ampleness remain absent because no elaborated Picard
  component demands them.
