id: AJC.pic0av.identity
title: Identity component and degree-zero points
projects:
- Algebraic-Jacobian-Challenge
summary: "Identity component and degree-zero points. The identity component itself\
  \ is DONE (Pic0Scheme,\nPic0Scheme.inclusion, isSection_comp_inclusion, all sorry-free).\
  \ Three open sorries remain in\nPicard/IdentityComponent.lean and each has a DIFFERENT\
  \ kind of blocker -- do not treat them as one.\n\n1 PicScheme.degree -- A STATEMENT\
  \ BUG, not a missing proof. Its domain is an ARBITRARY morphism\nSpec k -> Pic,\
  \ not a morphism over Spec k, so it never names a k-RATIONAL point and representability\n\
  says nothing about it. No total function of that type is constructible from the\
  \ Picard functor.\ndegreeOfSection / degreeOfSectionPinned are the same construction\
  \ on the correct domain and are total.\nRetained only because kPoints_iff_kerDegree\
  \ is pinned against it; consumers should migrate.\n\n2 THE DEGREE MAP -- residue\
  \ is now a CONSTRUCTION, not a characterisation (run 0067 r3).\nClassDegree was\
  \ found vacuous (zero homomorphism inhabits it; probed). I-0534 named the real input\
  \ as a\nCHARACTERISATION and suggested agreement with WeilDivisor.degree on O(D)\
  \ -- that form needs a relative\ndivisor-to-line-bundle comparison AJC does not\
  \ have. THE ABEL MAP IS THAT COMPARISON, already sorry-free\nand already carrying\
  \ the fibre-degree ledger. So:\n  ClassDegreePinned    classDegree (data) + classDegree_abel:\
  \ on the Abel image of a family of constant\n                       fibre degree\
  \ d, the value is d\n  classDegree_ne_zero_of_exists_pos_fiberDeg   the acceptance\
  \ test: the ZERO MAP IS REFUTED\n  degreeOfSectionPinned + its map_zero lemma\n\
  The refutation is CONDITIONAL on a producer of a nonzero-degree DivFamily over the\
  \ trivial test object,\nand AJC has no in-tree producer of any DivFamily. So what\
  \ remains is exhibiting one -- a construction.\nThat is a strictly better residue\
  \ than 'the class demands nothing', and the acceptance test now lives in\nthe tree\
  \ beside the class rather than in a session note.\n\n3 finrank_eq_genus -- blocked\
  \ on mathlib, NOT on the tangent identity. Even granting dim T_0 = g and\nsmoothness,\
  \ topologicalKrullDim has almost no API in v4.31 and nothing connects it to\nSmoothOfRelativeDimension\
  \ or to a tangent-space dimension. Consumers wanting only a dimension INDEX\nshould\
  \ target SmoothOfRelativeDimension (genus C) instead, which is cheaper.\n\n4 kPoints_iff_kerDegree\
  \ -- structural half CLOSED (Pic0Scheme.inclusion); the rest is blocked on (1).\n\
  degreeOfSection_eq_zero_of_factors is the restatement on the correct domain, with\
  \ its structural half\ndischarged."
