id: AJC.pic0av.identity
title: Identity component and degree-zero points
projects:
- Algebraic-Jacobian-Challenge
summary: "Construct the degree map, identify Pic0(k) with its kernel, prove the dimension\
  \ statement.\n\nSTATE (run 0067 round 1, ajc-pic0av, commit f820eff22). The degree\
  \ map HAS A ROUTE, and it is\nnot the Quot route. I am explicitly retracting my\
  \ own round-0 summary line 'no route found I\nwould stand behind'.\n\nTHE ROUTE,\
  \ and the transport half is landed sorry-free:\n * PicScheme.classOfSection (SORRY-FREE)\
  \ -- representability AT THE TRIVIAL TEST OBJECT\n   T = Spec k. A k-rational point\
  \ of Pic_{C/k} is a morphism Over.mk (id Spec k) -> PicScheme C,\n   and representable's\
  \ homEquiv sends it to a class in Pic(C x_k Spec k)/pi^* Pic(Spec k). This\n   is\
  \ the step the Quot route was going to perform by extracting a representing sheaf\
  \ and\n   forming its Hilbert polynomial; it is free, nothing is chosen.\n * PicScheme.degreeOfSection\
  \ (SORRY-FREE, TOTAL, given the one input) + the class\n   PicScheme.ClassDegree\
  \ (the one input: an additive Z-valued degree on relative Picard classes\n   over\
  \ the base) + degreeOfSection_eq_zero_of_class_eq_zero (map_zero -- the direction\
  \ of\n   kPoints_iff_kerDegree that additivity buys).\n * WHY THE INPUT IS CREDIBLE\
  \ rather than merely named: the sibling Rebuild has exactly this\n   homomorphism\
  \ sorry-free and WITHOUT Quot -- RiemannRoch/RelPicDegree.lean relPicDeg, descended\n\
  \   from classDeg because Spec K is a one-point space so its Cech Picard group is\
  \ trivial and\n   cannot contribute. Its own input is the closed chi-ledger (ChiLedger.lean),\
  \ 22 files / 5491\n   lines / ZERO sorry tokens, measured at HEAD. So the open work\
  \ is a CARRIER TRANSPORT, not a\n   theorem about degrees.\n\nA DEFECT IN THE PINNED\
  \ STATEMENT, and this is the finding that matters most in this lane.\nPicScheme.degree\
  \ takes an ARBITRARY morphism Spec k -> (PicScheme C).left, not a morphism OVER\n\
  Spec k. Such a morphism need not be a section of (PicScheme C).hom -- the goal\n\
  l >> hom = id is NOT derivable -- so it does not name a k-RATIONAL point and representability\n\
  says nothing about it. A total function of that type cannot be built from the Picard\
  \ functor at\nall; it would have to invent values off the sections. So that sorry\
  \ is a STATEMENT bug, not a\nmissing proof, and no amount of degree theory will\
  \ close it as stated. degreeOfSection is the\nsame construction on the correct domain.\
  \ Consumers should migrate. kPoints_iff_kerDegree is\npinned against the broken\
  \ form, which is why degree is retained rather than replaced --\nwhoever owns the\
  \ pin should decide.\n\nFINRANK_EQ_GENUS -- unchanged from round 0, and the diagnosis\
  \ stands: the blocker is NOT the\ntangent identity but a MISSING MATHLIB BRIDGE.\
  \ topologicalKrullDim has essentially no API in\nv4.31 (IsHomeomorph.topologicalKrullDim_eq,\
  \ two monotonicity lemmas,\nPrimeSpectrum.topologicalKrullDim_eq_ringKrullDim) and\
  \ nothing connects it to\nSmoothOfRelativeDimension or to a tangent-space dimension.\
  \ The available bridge is\nAlgebra.IsStandardSmoothOfRelativeDimension.iff_of_isStandardSmooth,\
  \ i.e. Module.rank of Kahler\ndifferentials, which needs (i) that rank identified\
  \ with the tangent-space dimension and (ii)\npassage from an affine-local presentation\
  \ to a scheme-level Krull dimension over a cover.\nCHEAPER TARGET for consumers\
  \ wanting a dimension INDEX: SmoothOfRelativeDimension (genus C).\n\nMEASURED with\
  \ a control, gate assumed not synthesised: probe_classOfSection and\nprobe_degreeOfSection\
  \ both [propext, Classical.choice, Quot.sound]; CONTROL probe_degree_bare\nstill\
  \ sorryAx."
