id: AJC.pic0av.identity
title: Identity component and degree-zero points
projects:
- Algebraic-Jacobian-Challenge
summary: "Construct the degree map, identify Pic0(k) with its kernel, and prove the\
  \ dimension statement for the\nidentity component.\n\nSTATE (run 0067, ajc-pic0av,\
  \ commits eeae6bb42 + c3a1e4d0e): three sorries remain in\nPicard/IdentityComponent.lean\
  \ (:1427 PicScheme.degree, :1514 finrank_eq_genus, :1547\nkPoints_iff_kerDegree).\
  \ One closed half was split out; the blocker of finrank_eq_genus was\nMISLOCATED\
  \ and is now identified. This lane advanced in diagnosis, not in proofs.\n\nLANDED:\
  \ Pic0Scheme.inclusion (sorry-free) -- the inclusion morphism Pic0_{C/k} -> Pic_{C/k}\
  \ over\nSpec k, from the sibling's IdentityComponent.isOpenSubgroupScheme. kPoints_iff_kerDegree\
  \ packaged TWO\nclaims (existence of that inclusion, and the degree-zero characterisation\
  \ of its k-points); only the\nsecond was ever open, and the docstring said otherwise.\
  \ Consumers who need only the inclusion (the\nAlbanese lane asked) can take it today.\n\
  \nFINRANK_EQ_GENUS -- THE BLOCKER IS NOT THE TANGENT IDENTITY. This is the correction\
  \ worth carrying\nforward. Even granting dim_k T_0 Pic0 = g (AJC.pic0av.tangent\
  \ has it down to one geometric\ncomparison) AND granting smoothness, reaching topologicalKrullDim\
  \ is a SEPARATE construction, because\nmathlib v4.31 gives that invariant almost\
  \ no API. The complete list of what exists:\nIsHomeomorph.topologicalKrullDim_eq,\
  \ IsInducing.topologicalKrullDim_le,\ntopologicalKrullDim_subspace_le, topologicalKrullDim_zero_of_discreteTopology,\
  \ and\nPrimeSpectrum.topologicalKrullDim_eq_ringKrullDim. NOTHING connects it to\
  \ SmoothOfRelativeDimension or\nto a tangent-space dimension.\n  The available bridge\
  \ runs through a DIFFERENT invariant, at the algebra level:\nAlgebra.IsStandardSmoothOfRelativeDimension.iff_of_isStandardSmooth\
  \ characterises relative dimension n\nas Module.rank S of the Kahler differentials\
  \ Omega[S/R]. So closing this needs (i) identifying that\nrank with the tangent-space\
  \ dimension at the identity -- dual to each other over a field, but the\nstatement\
  \ must be made and the rank/finrank mismatch is where it bites -- and (ii) passing\
  \ from an\naffine-local presentation statement to a scheme-level Krull dimension,\
  \ quantifying over an affine\ncover of Pic0 rather than over one point. The same\
  \ analysis is recorded at Jacobian.lean:395-410 for\nsmoothOfRelativeDimension_genus_pic0,\
  \ and is now in the finrank_eq_genus docstring too.\n  CHEAPER TARGET for consumers\
  \ needing a dimension INDEX rather than a Krull dimension:\nSmoothOfRelativeDimension\
  \ (genus C) (Pic0Scheme C).hom.\n\nPICSCHEME.DEGREE -- still unconstructed, and\
  \ no route was found this session that I would stand\nbehind. The intended construction\
  \ (extract a representing invertible sheaf from\nPicScheme.representable, form its\
  \ Hilbert polynomial, take the leading coefficient) runs through\nPicard/QuotScheme.lean,\
  \ and Quot is retained-not-revived per the standing project decision. Do NOT\nclose\
  \ this by giving degree a definition that merely typechecks -- kPoints_iff_kerDegree\
  \ and the\nAlbanese lane both consume its VALUE, so a wrong-but-total definition\
  \ would be worse than the sorry.\nThe honest alternatives to weigh next session:\
  \ (a) route the degree through the existing adelic\ndegK/degree layer, which is\
  \ what actually has theorems about degrees in this project, at the cost of\nthe\
  \ import direction; (b) state degree only where a representing sheaf is available\
  \ rather than for\nall k-points.\n"
