id: AJC.pic0av.identity
title: Identity component and degree-zero points
projects:
- Algebraic-Jacobian-Challenge
summary: 'Identity component and degree-zero points. The identity component itself
  is DONE (Pic0Scheme,

  Pic0Scheme.inclusion, isSection_comp_inclusion). Picard/IdentityComponent.lean is
  at TWO sorries

  (was three); run 0067 r4 closed the degree map.


  1 PicScheme.degree -- CLOSED 2026-07-28 (commit 23b263f3c), and the previous entry
  here was WRONG.

  This node used to say: ''A STATEMENT BUG, not a missing proof. No total function
  of that type is

  constructible from the Picard functor.'' The premise was right -- an arbitrary morphism

  Spec k -> Pic need not be a section, so representability says nothing about it --
  but the

  conclusion does not follow. That is a claim about which values are PINNED, not about
  TOTALITY,

  and a total function may invent values where nothing pins them. ''fun _ => 0'' already
  inhabited

  the type, so the impossibility verdict was refuted by a one-line probe nobody ran
  for three

  sessions.

  WHAT IS THERE NOW: degree splits on the section condition. On sections it IS

  degreeOfSectionPinned (the degree pinned against the Abel map), recorded as the
  equation

  degree_eq_degreeOfSectionPinned; off them it is 0, and the docstring states that
  no consumer may

  rely on that value. degree_eq_zero_of_class_eq_zero gives the direction additivity
  buys.

  The new [ClassDegreePinned C] binder is load-bearing: unpinned ClassDegree admits
  the zero

  homomorphism (probed vacuous in r2), so pinning is the difference between a degree
  and an

  arbitrary additive map. All three declarations axiom-clean, MEASURED WITH A CONTROL
  (the still

  open kPoints_iff_kerDegree in the same file reports sorryAx).


  2 THE DEGREE HOMOMORPHISM ITSELF -- residue unchanged and it is a CONSTRUCTION,
  not a

  characterisation. ClassDegreePinned needs a producer, and its acceptance test

  (classDegree_ne_zero_of_exists_pos_fiberDeg, refuting the zero map) is conditional
  on a

  nonzero-degree DivFamily over the trivial test object, of which AJC has no in-tree
  producer.

  Exhibiting one is the open work. AJCR''s relPicDeg (RiemannRoch/RelPicDegree.lean)
  is the

  sorry-free homomorphism to port against.


  3 finrank_eq_genus -- blocked on mathlib, NOT on the tangent identity. topologicalKrullDim
  has

  almost no API in v4.31 and nothing connects it to SmoothOfRelativeDimension or to
  a tangent-space

  dimension. Consumers wanting only a dimension INDEX should target

  SmoothOfRelativeDimension (genus C), which is cheaper.


  4 kPoints_iff_kerDegree -- structural half CLOSED (Pic0Scheme.inclusion). It now
  carries

  [ClassDegreePinned C] and is NO LONGER blocked on a declaration that could not exist:
  the

  remaining content is the degree characterisation itself, i.e. item 2.'
