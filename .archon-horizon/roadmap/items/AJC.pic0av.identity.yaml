summary: "Identity component and degree-zero points (AJC.pic0av.identity).\n\nSTATE\
  \ at run 0067 r5. IdentityComponent.lean carries 2 sorries: finrank_eq_genus\nand\
  \ kPoints_iff_kerDegree. PicScheme.degree is constructed (r4).\n\nDIMENSION LEG,\
  \ reduced to ONE uniform bound (r5, commits b9bfa997f / 476236c3b /\nb653ef4d6).\
  \ The recorded blocker -- \"mathlib v4.31 has almost no topologicalKrullDim\nAPI,\
  \ so the route must go through Algebra.IsStandardSmoothOfRelativeDimension and an\n\
  affine-local presentation\" -- was a mis-measurement: it read the API surface, not\
  \ the\nDEFINITION. topologicalKrullDim IS krullDim of the irreducible closeds; a\
  \ scheme is\nsober and T0, so irreducibleSetEquivPoints is an order iso onto the\
  \ carrier,\nkrullDim_eq_iSup_coheight applies, and the project's own ringKrullDim_stalk_eq_coheight\n\
  finishes. For ANY scheme: dim X = sup over z of dim O_{X,z}\n(Picard/SchemeKrullDimStalk.lean).\n\
  \nConsequences (Picard/Pic0Dimension.lean):\n * \"genus <= dim Pic^0\" is PROVED\
  \ from the tangent space at the IDENTITY ALONE, its\n   only side condition being\
  \ regularity of that one stalk -- and over a PERFECT base\n   field that follows\
  \ from smoothness of Pic^0, i.e. from AJC.pic0av.structure and\n   nothing else.\n\
  \ * the remaining open content is \"dim <= genus\": one UNIFORM bound\n   (forall\
  \ z, ringKrullDim (stalk z) <= genus C). It cannot come from one point,\n   since\
  \ the dimension is a supremum. finrank_eq_genus is now stated against exactly\n\
  \   that hypothesis as topologicalKrullDim_eq_genus_of_forall_ringKrullDim_stalk_le.\n\
  \   SmoothOfRelativeDimension (genus C) (Pic0Scheme C).hom would supply it.\n\n\
  SPIN-OFF, upstream of this node: stalks of a smooth scheme over a PERFECT field\
  \ are\nregular local rings, with no other hypothesis\n(Scheme.isRegularLocalRing_stalk_of_smooth_of_perfectField).\
  \ AJC had this only over\nk-bar and with five further binders (Albanese/CodimOneExtension);\
  \ the alg-closed form\nis unusable here because Pic^0_{C/k} lives over the given\
  \ k and stalk regularity\ndescends along Spec k-bar -> Spec k by no route in this\
  \ tree.\n\nkPoints_iff_kerDegree is untouched: its easy direction is landed\n(degreeOfSection_eq_zero_of_factors),\
  \ the converse -- that the degree separates the\ncomponents of Pic_{C/k} -- is the\
  \ open half.\n"
