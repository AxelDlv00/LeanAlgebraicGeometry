summary: "Identity component and degree-zero points. Two sorries in Picard/IdentityComponent.lean:\n\
  finrank_eq_genus (:1896) and kPoints_iff_kerDegree (:1939). The degree map itself\
  \ is BUILT\nand sorry-free (PicScheme.degree :1702, pinned via ClassDegreePinned\
  \ with a non-vacuity\ntest), the Pic^0 inclusion is BUILT, and the easy direction\
  \ of the kernel characterisation\nis landed (degree_eq_zero_of_class_eq_zero :1733);\
  \ the open half is the converse.\n\nTHE DIMENSION HALF IS NOW REDUCED TO TWO NAMED\
  \ INPUTS, NEITHER DIMENSION-THEORETIC\n(run 0067 r7, Picard/GroupSchemeHomogeneity.lean,\
  \ 11 declarations, 0 sorries, axiom-clean\nwith three firing controls):\n\nPic^0\
  \ is a GROUP scheme, so translations are automorphisms of the underlying scheme\
  \ and the\nembedding dimension is constant along a translate orbit. This kills the\
  \ \"uniform cotangent\nbound\" that three earlier rows (r5, r6) named as the <=\
  \ half's open content -- it was never\na separate piece of mathematics here. Since\
  \ the value at the identity is an EQUALITY, one\npoint serves both directions:\n\
  \n  topologicalKrullDim_eq_genus_of_homogeneous -- AXIOM-CLEAN, gives dim Pic^0\
  \ = g from\n  (i) the cotangent value at the identity, (ii) regularity of that one\
  \ stalk, (iii) the\n  orbit condition.\n\n  topologicalKrullDim_eq_genus_of_homogeneous_of_regular\
  \ -- discharges (i) from front (a)\n  verbatim, since genus C is DEFINED as the\
  \ H^1 finrank (Genus.lean:41). Reports sorryAx,\n  inherited from front (a) alone,\
  \ with the clean sibling above it as the control.\n\nSO WHAT IS OWED: front (a);\
  \ regularity at the identity (free over a perfect field via\nisRegularLocalRing_stalk_of_smooth_of_perfectField,\
  \ a hypothesis here so the statement stays\nover an arbitrary field per I-0491);\
  \ and the orbit condition \"every point of Pic^0 is a\nk-rational translate of the\
  \ identity\". The last is the honest gap and is a statement about\nPOINTS -- translations\
  \ are indexed by k-rational sections, and over a non-closed field there\nare points\
  \ none reaches.\n\nNOTE finrank_eq_genus HAS ZERO CONSUMERS and sits UPSTREAM of\
  \ the dimension machinery in the\nimport graph (IdentityComponent imports only FGAPicRepresentability/GeometricallyConnectedSection/\n\
  DivDegree/Genus). Closing it in place would need an import inversion; the live statement\
  \ of\nthe same mathematics is the Pic0Dimension/GroupSchemeHomogeneity pair. Do\
  \ not price it as the\nblocker.\n\nSEARCH DATUM worth reusing: mathlib v4.31 has\
  \ NO functoriality for IsLocalRing.CotangentSpace\n-- no map along a ring homomorphism\
  \ of any kind. Transport a cotangent dimension via\nSubmodule.spanFinrank (Ideal.spanRank_map_le\
  \ both ways + antisymmetry, no Noetherian needed)\nthen Nakayama. AJC's own spanFinrank_maximalIdeal_le_of_surjective\
  \ is `private`.\n"
