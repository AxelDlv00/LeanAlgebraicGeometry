summary: "HALF LANDED 2026-07-25 (run 0048, commit on Picard/DivSchemeCertZarChartPair.lean).\n\
  \nWHAT IS DONE. The coarse adaptation exists and its certificate obligations are\
  \ discharged:\n * chartPairCoverData — a legal FinCoverData with m_0 = m_1 = 1,\
  \ h = a = 1; the partition of unity\n   is 1*1 = 1 and Scheme.basicOpen_one identifies\
  \ each piece with its pinned chart\n   (chartPairCoverData_pieces_inl / _inr / _eq);\n\
  \ * DivisorAdaptation.ofChartPair — builds the adaptation from a CHART-PRINCIPALITY\
  \ datum via the\n   landed anchored constructor DivisorAdaptation.ofAnchors (DivisorFamily.lean:257):\
  \ for each pinned\n   chart, a member pt of d's cover with V_b <= d.cover.opens\
  \ (pt), the chart equation, and the\n   comparison unit;\n * forall_noLeak_of_pieces_eq_chart\
  \ and forall_finite_colength_of_pieces_eq_chart — for ANY\n   adaptation whose pieces\
  \ are the two pinned charts, a divisor with\n   supportLocus subset V_0 cap V_1\
  \ is swallowed by every piece, so the assembler's hnoLeak and\n   clause (c1)-finite\
  \ hold. No fibre, no tube, no packet idempotent.\nNone of the landed no-gos touches\
  \ this configuration: not_exists_unique_support_piece refutes ONE\nsupport-meeting\
  \ piece and this has TWO; supportLocus_disjoint_chart_inter_of_separated refutes\n\
  separation and this adaptation is maximally unseparated.\n\nWHAT REMAINS: the CHART-PRINCIPALITY\
  \ input, i.e. produce the (pt, eqn, unit) datum. It says the\ndivisor is cut by\
  \ a single equation on each pinned chart. Route: a theta section psi in K has\n\
  exactly two chart components (relThetaResSide a b), so ONE psi supplies both equations\
  \ at once;\ndiv(psi) = d + E with E disjoint from the support, so psi cuts d on\
  \ the open W = relCurve \\ supp(E).\nIf W is not a whole chart, fall back to the\
  \ FOUR-piece variant: a swallowing piece D(h_b) inside W\nplus a complementary piece\
  \ D(s_b) missing the support, obtained from comaximality of the disjoint\nclosed\
  \ sets supportLocus and V_b \\ W in the AFFINE V_b (sigma + tau = 1); the complementary\
  \ piece's\nequation is 1 and its colength VANISHES (subsingleton_colength_of_disjoint_supportLocus).\
  \ The\npointwise gate licenses shrinking the base first, which is what makes a line\
  \ bundle trivial on the\n(semilocal after localization) divisor scheme spread to\
  \ a Zariski neighbourhood.\n\nGATED ON chart-avoid: without supportLocus subset\
  \ V_0 cap V_1 the swallowing hypothesis is false.\n\nDISCHARGE/RELOCATION LINE,\
  \ added 2026-07-29 (run 0070 s0012, per I-0542). Read this node's `done`\nas RELOCATED,\
  \ not closed. The R2 widening (protection I-0492) makes chart principality unnecessary\n\
  -- exists_affAdaptation_of_isProper builds a widened adaptation with no chart input\
  \ at all -- but\nthe geometric input it substitutes, AffCoverData.SwallowedBy, is\
  \ an UNPROVEN HYPOTHESIS at every\nuse site, reduced (58412986d) to the subordinate\
  \ Stacks 0B8B input which I-0492 clause 2 says to\nUSE rather than derive. So the\
  \ \"WHAT REMAINS\" paragraph above is superseded in its route (no\nchart-principality\
  \ datum is owed, and the four-piece fallback is not to be built) but NOT in its\n\
  accounting: an obligation moved from the chart layer to the cover layer.\n"
