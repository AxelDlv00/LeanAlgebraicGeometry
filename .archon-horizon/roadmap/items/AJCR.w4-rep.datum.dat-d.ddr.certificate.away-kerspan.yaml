summary: "UNBLOCKED FOR THE COVERS R2 USES (2026-07-28, run 0070); still open in general.\
  \ Kept blocked rather than done, deliberately — read which case you are in before\
  \ consuming it.\n\nWHAT IS NOW PROVED. Picard/DivisorFamilyAffGlue.lean (395b9ca4c,\
  \ sorry-free, rooted). The blocking\nobligation of this leaf is flatness of the\
  \ DIAGONAL overlap colengths, forced by clause (c4) via the\nI-0340 degeneracy.\
  \ On a widened cover with a straddling piece (AffCoverData.SwallowedBy) that is\n\
  discharged: ovlColengthDiagEquiv identifies ovlColength i i with colength i, so\
  \ the required flatness\nIS (c1)-flatness, which the fibrewise-regularity input\
  \ already supplies. Endpoint:\n\n  AffAdaptation.isCertified_of_swallowedBy_of_c1\
  \ : SwallowedBy -> (c1)-finite -> (c1)-projective\n    -> hrank -> IsCertified n\
  \     (all seven clauses; the five glued hypotheses are gone)\n\nStraddling covers\
  \ are exactly the covers protection I-0492 directs the lane to use, so nothing on\
  \ the\nDD-R critical path needs this leaf any more.\n\nWHY IT STAYS BLOCKED RATHER\
  \ THAN DONE. The discharge is specific to the straddling shape: off the\ndiagonal\
  \ it needs every non-swallowing piece to miss the support, which makes deltaLeft\
  \ - deltaRight\nthe ZERO map. For an ARBITRARY adaptation over an arbitrary finite\
  \ cover — e.g. the\nexists_divisorAdaptation choice at DivSchemeFamily.lean:367,\
  \ about which nothing is known — the\nobligation is untouched and is still a genuine\
  \ relative-flatness statement over a possibly nonreduced\nbase. Anyone who needs\
  \ THAT case is not served by the new file.\n\nTHE I-0340 REFUTATION IS NOT RETIRED,\
  \ and should not be read as such. (c4) still implies flatness of\nthe diagonal overlap\
  \ colengths; that is a theorem. What changed is that the implication became\nharmless\
  \ in the case of interest, not false.\n\nFALLBACK FOR THE GENERAL CASE, unchanged:\
  \ the flattening route. ddr.flattening-fallback was rejected\n2026-07-23 with an\
  \ EMPTY note, two days before the route change that created this obligation, and\n\
  Picard/EntryIdeal.lean is present byte-identical as an unwired orphan. That rejection\
  \ is still worth\nrevisiting if the general case is ever needed."
