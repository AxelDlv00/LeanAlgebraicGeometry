id: AJCR.w4-rep.datum.dat-g.genus-chart-finite-descent.fpqc-descent.effectivity
title: Effect Pic descent by the finite-Galois quotient route
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'Generic scheme-valued fpqc effectivity is false: a descent datum may descend
  only to an algebraic space (the finite-group Hironaka obstruction), so no unconditional
  Scheme IsStack theorem belongs here. The true no-new-headline-hypothesis route is
  Pic-specific: (1) derive the semilinear Gal(L/k)-action canonically from the L-side
  RepresentableBy datum and theta coherence; (2) prove for this Pic^0 representative
  that finite Galois orbits lie in affine opens, via the intrinsic group-scheme/quasi-projectivity
  theorem rather than adding FiniteInAffine as a binder; (3) port/apply the sibling
  stable-affine quotient GlueData engine and its base-change isomorphism; (4) descend
  the universal property and geometric clauses. Landed substrate: 87774c546c commutative-algebra
  equalizer effectivity, 1ad88a2248 affine Spec/Over base-change effectivity, e5aac9e734
  functorial descent of algebra morphisms. The existing arbitrary-J scheme DescentData
  remains genuine input, but it is not itself an unconditional effectivity theorem.'
