summary: 'DONE (560403474e): $\chi(\mathcal{O}(D)) = 1 - g + \deg D$ on the challenge
  curve ($h^0(\mathcal{O}_C) = 1$ via the $k$-linear $\Gamma(C,\mathcal{O}) \cong
  k$, $\chi(\mathcal{O}_C) = 1 - g$ with $g = \mathrm{genus}\,C$ definitional); the
  Riemann inequality $\deg D + 1 - g \le h^0(\mathcal{O}(D))$ and $h^0(\mathcal{O}(n
  \cdot x))$ unbounded for any closed point (no rational point needed).'
