summary: "THE CRITICAL PATH TO Challenge.lean:99.  Re-framed round 4 as one ordered\
  \ chain; REFRAMED AGAIN\nround 5, because the round-4 framing put the gate in the\
  \ wrong place.  READ\ninformal/w4-rep-critical-path.md SECTION 7 FIRST -- it carries\
  \ the per-link evidence.\n\nTARGET.  AlgebraicGeometry.Jacobian (Challenge.lean:96-99,\
  \ a bare sorry).  archon-protected.yaml\nFREEZES the signature, so a hypothesis-carrying\
  \ restatement is forbidden -- in particular a\nrepresentability theorem valid only\
  \ over infinite fields is NOT a discharge.  The sanctioned\ndischarge is Jacobian\
  \ C := (jacobianData C).J.\n\nWHAT THE TARGET REDUCES TO TODAY, exactly.  Round\
  \ 5 landed JacobianData.ofCharts\n(Picard/JacobianDataCharts.lean:182) and JacobianData.ofChartsOfCompactSpace\
  \ -- the first producers\nof JacobianData, which had ZERO before (all ~25 occurrences\
  \ in the tree were consumers taking it as\na section variable).  Composing with\
  \ the frozen discharge, the target is now exactly\n\n    A ZARISKI ATLAS OF pic0SigmaFunctor\
  \ C: schemes X i and maps\n    f i : yoneda.obj (X i) -> pic0SigmaFunctor C such\
  \ that\n      (L7) each f i is a relatively representable open immersion   [roadmap\
  \ dat-c C9b]\n      (L8) Sigma.desc f is Zariski-locally surjective            \
  \  [roadmap dat-b B-6]\n      (L*) each chart is quasi-compact with locally-of-finite-type\
  \ structure morphism.\n\nEverything else above the atlas is DONE and kernel-checked:\
  \ the big-site sheaf condition, mathlib's\n01JJ gluing (pic0RepresentableByOfCharts,\
  \ Pic0SigmaSheaf.lean:161), the Sigma-descent, and BOTH\nfiniteness certificates\
  \ -- which are DERIVED from chart-level hypotheses, not assumed\n(locallyOfFiniteType_gluedHom\
  \ :154 via IsZariskiLocalAtSource.of_openCover;\nquasiCompact_gluedHom :164 via\
  \ HasAffineProperty.iff_of_isAffine).  A hypothesis scare was checked\nand closed:\
  \ Pic0SigmaSheaf.lean:79's [GeometricallyReduced C.hom] is redundant, supplied by\n\
  Curve/GeometricallyReduced.lean:130/:140 from smoothness (record: JacobianDataCharts.lean:210).\n\
  \nWHERE THE GATE ACTUALLY BITES -- THE ROUND-5 CORRECTION, and it changes what everyone\
  \ should work\non.  Inbox I-0365.  The old framing (\"the divrep tail is independent\
  \ of the certificate; the\ncertificate gates U2\") is FALSE, but not in the direction\
  \ the tree assumed.  DivFamZar is BY\nDEFINITION a quotient of LOCALLY CERTIFIED\
  \ families (DivisorFamilyZar.lean:224,:235), so\ncertificates are FREE on the consuming\
  \ side -- DivFamZar.exists_certChartCover\n(DivRepClassifyZarKit.lean:433) is a\
  \ landed theorem, unfolded by every classifier keystone\n(DivRepClassifyZar.lean:128/:176/:230,\
  \ DivRepClassifyZarSep.lean:361/:363), and IsDivRepClassify\n(:90) quantifies over\
  \ certified families as a HYPOTHESIS.  The bite is on the other side: the no-go\n\
  (DivSchemeCertZarC1.lean:30-31,:131) says DivFamZar is BLIND to connected divisors\
  \ meeting both\npinned fibres, so divFunctor C pi g is a PROPER SUBFUNCTOR of degree-g\
  \ relative divisors.\nRepresenting it is not the problem -- the L9-L13 tail does\
  \ that honestly.  The problem is that a\ntoo-small divisor functor CANNOT COVER\
  \ Pic^0: the Abel map out of it is not locally surjective,\nbecause the classes\
  \ whose only witnesses are the invisible divisors are never hit.  THE GATE IS L8.\n\
  Judge every proposed repair by whether it widens DivFamZar enough for L8, not by\
  \ whether it makes a\ncertificate easier to prove.  U2 and the affine package are\
  \ TAIL work, and they are nearly finished.\n\nSETTLED; DO NOT RE-LITIGATE.  (a)\
  \ No repair that keeps the pieces inside the preimages of a FIXED\nPAIR of points\
  \ of P^1 can work: refining the cover, shrinking the base, a cleverer submodule\
  \ L,\nre-spelling the equations, the joint-covering relaxation (leaf joint-cover,\
  \ rejected), and re-basing\non the Zariski-local certificate are all provably useless.\
  \  (b) The no-go is ON-STRATUM: a witness\nexists for every genus >= 2 (spec-dd-r\
  \ ADDENDUM 4; re-derived independently round 5, critical-path\nsection 7.3; an explicit\
  \ rational example is y^2 = x^5 - x + 1 with pi = [y-1 : y+1] of degree 5).\nThe\
  \ round-4 instruction on this row to \"settle that before costing p1-aut or R2\"\
  \ is STRUCK -- it was\nalready settled the same round, by this row's own child field-size.\
  \  (c) DO NOT formalise the\nwitness: it needs Sym^g C / Hilb^g, which mathlib lacks\
  \ and this tree has never built (ADDENDUM 4\nsection 4.5).\n\nTHE ONE LIVE DECISION:\
  \ R1 VERSUS R2, and it must be made with the descent half COSTED.\n * R1 (p1-aut\
  \ -> fibre-avoid -> cert-relocalize): quantify the certificate over a twist\n  \
  \ gamma in Aut(P^1_k).  PROVED CORRECT IFF |P^1(k)| >= g + 2 -- every infinite field,\
  \ and F_q for\n   q >= g + 1.  Since the target is stated over an ARBITRARY field,\
  \ R1 CANNOT DISCHARGE THE\n   CHALLENGE ALONE; it needs the descent lane dat-g behind\
  \ it.  Note what descent is required:\n   the sibling's ZariskiDescentRepresentability.lean\
  \ is ZARISKI descent and does NOT cross a field\n   extension; what is needed is\
  \ Galois/fppf descent, for which the sibling's GaloisDescent/\n   (semilinear algebras\
  \ and modules, sorry-free, built) is the substrate.\n * R2 (generalise FinCoverData's\
  \ piece type to arbitrary affine opens of the relative curve):\n   field-uniform,\
  \ and justified in one line -- supp D is finite over R, hence contained in a single\n\
  \   affine open (Stacks 0B8B), so a cover with one straddling piece always exists.\
  \  Blast radius\n   measured: FinCoverData is named in 28 files.\nThe honest comparison\
  \ is R1 + a Galois-descent campaign against R2 + a 28-file refactor.  The\np1-aut\
  \ leaf says \"do not attempt both\".\n\nTRUST, MEASURED THIS ROUND.  622 modules\
  \ on disk, 529 reachable from AlgebraicJacobian.lean, 93\nUNROOTED and therefore\
  \ never kernel-checked (lakefile.toml has no globs and defaultTargets is the\nroot,\
  \ so unrooted really does mean unverified).  CORRECTION to the round-4 census: Picard/DivRepKit.lean\n\
  is NO LONGER unrooted -- Picard/DivRepGlobalLift.lean imports it and the root imports\
  \ that -- so L9,\nthe divisor-representability endpoint, is kernel-checked.  Picard/DivRepAffKitZar.lean,\
  \ which round-4\nnotes cite as already performing the u2 interface weakening, NO\
  \ LONGER EXISTS (removed in 1e4ac5b52).\nThe count of sorries is not the measure\
  \ of what is verified.  Row AJCR.w4-rep.build-reach owns this.\n\nNO SHORTCUT NEXT\
  \ DOOR, WITH ONE EXCEPTION WORTH CHECKING.  The sibling MainProjects/Algebraic-Jacobian-Challenge\n\
  does NOT have representability: its Picard.FGAPicRepresentability.instHasPicScheme\
  \ (:313-317) is an\nexplicit <sorry> instance.  But it does hold one large verified\
  \ asset the Rebuild has never looked\nat -- GrassmannianQuot.lean:5607 declares\
  \ an UNCONDITIONAL (functor d r).RepresentableBy (scheme d r)\nin a 5631-line sorry-free\
  \ file, and both projects share the same toolchain and the same mathlib.\nAlso portable:\
  \ GaloisDescent/, GlueDescent.lean, ZariskiDescentRepresentability.lean (1372 L).\n\
  \nTOOLING WARNINGS, unchanged.  (a) Do not steer this subtree from `graph frontier`:\
  \ its top items are\n\\lean{} name-drift artifacts and the Rebuild cannot be graph-synced\
  \ (I-0318).  (b) MODULE DOCSTRINGS\nIN THIS TREE ANNOUNCE THEOREMS THE FILES DO\
  \ NOT DECLARE (I-0349), and roadmap rows have asserted the\nABSENCE of declarations\
  \ that exist.  Verify both directions with `horizon search` before briefing\nanyone\
  \ -- and check the ledger for files swept in by an `integrate` commit, which is\
  \ how round 4's\nown chain document came to call a landed file \"MISSING, never\
  \ attempted\"."
