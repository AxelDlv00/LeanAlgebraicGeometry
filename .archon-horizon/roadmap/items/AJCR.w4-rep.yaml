summary: "THE CRITICAL PATH TO Challenge.lean:99.  Re-audited 2026-07-25 (run 0048\
  \ round 1: six recon\nagents, each adversarially refuted) and UPDATED 2026-07-26\
  \ (round 2: five commits landed;\nthe refuters corrected several of round 1's own\
  \ claims).  Read this before choosing work.\n\nTARGET: AlgebraicGeometry.Jacobian\
  \ (Challenge.lean:96-99, a bare sorry).  Challenge.lean\nholds 15 sorries; the whole\
  \ rest of the tree holds exactly ONE (Pic0ThetaCocycle.lean:268).\narchon-protected.yaml\
  \ FREEZES the signature of `Jacobian`, so a hypothesis-carrying or\nconditional\
  \ restatement is FORBIDDEN: the only admissible discharge is\nJacobian C := (jacobianData\
  \ C).J, and `jacobianData` has no producer.  The blueprint's only\nrepresentability\
  \ node, def:pic0RepresentableByOfCharts (PicardEtale.tex:10678), is\nconditional\
  \ on a chart family no node produces; the blueprint owes about five nodes.\n\nSIX\
  \ INDEPENDENT MOUNTAINS, in dependency order.\n\n 1. ddr.certificate -- THE GATE\
  \ IS ANSWERED, NOT BLOCKED.  chart-avoid = NO, with an\n    explicit counterexample\
  \ (F = tX^2 + XY + tY^2 over k[t]); the obstruction is\n    DivEq-invariant so it\
  \ bites DivFamZar itself.  SHARP FORM (2026-07-26): no repair that\n    keeps FinCoverData's\
  \ pieces inside the preimages of a FIXED PAIR of points of P^1 can\n    work --\
  \ the pieces are TYPED into the two pinned charts (DivisorFamily.lean:166,:168,\n\
  \    :186), so I-0346's \"joint covering\" idea provably buys nothing (leaf joint-cover,\n\
  \    rejected).  Only two routes remain: R1 vary the pinned pair (p1-aut -> fibre-avoid\
  \ ->\n    cert-relocalize) or R2 generalize the piece type.  Do not attempt both.\n\
  \n 2. ddr.divrep -- MOVED THIS ROUND for the first time in the campaign.  The class\
  \ side of\n    the backward classification is PROVED and kernel-checked (leaf `sep`,\n\
  \    Picard/DivRepClassifyZarSep.lean): a morphism satisfying the characterizing\
  \ clause\n    determines the class, so with the landed hom side the clause is a\
  \ bijection on the\n    nose.  That retired ONE of DivRepAffinePullback's four obligations\
  \ WITHOUT U2 (leaf\n    `u2`, three-field constructor DivRepAffinePullback.ofPull).\
  \  Remaining: `pull` and\n    `isDivRepClassify_pull` need U2, which exists in NO\
  \ Lean declaration; `pull_naturality`\n    is U2-free and is the cheapest next move\
  \ on this row.\n\n 3. dat-c C9 -- SPLIT.  c9a is DONE: `chartLocus` now EXISTS (it\
  \ had zero code hits\n    tree-wide until 2026-07-26) as a class-indexed locus in\
  \ the parameter space, with its\n    OPENNESS proved, certificate-free and divRep-free.\
  \  c9b (f_c and the (f,hf) pair) is\n    CERT-Sigma-gated, not merely divRep-gated\
  \ -- and the four old dat-c comments calling the\n    remainder \"plumbing, no math\
  \ left\" are refuted for that half.  c9b CAN be developed\n    parametrically over\
  \ a section variable `(divRep : ....RepresentableBy DivOver)`, the\n    idiom landed\
  \ at DivRepKit.lean:113.\n\n 4. dat-b, 5. dat-g, 6. dat-j.  dat-g's upstream bricks\
  \ are portable from the sibling\n    read-only project (Galois-descent substrate,\
  \ identical toolchain), but the Rebuild\n    already has its own root-imported flat-descent\
  \ stack, so port the ALGEBRA half only.\n    dat-j owns the `jacobianData` producer\
  \ and is the true last link.\n\nWAVE 6 IS NO LONGER ENTIRELY DOWNSTREAM.  Two of\
  \ the three frozen Albanese gates now have\nPROVED datum-level avatars (AJCR.w6-albanese.aj-datum,\
  \ 2026-07-26): ofCurve and\ncomp_ofCurve are one-liners the moment DAT-J lands.\
  \  Only exists_unique_ofCurve_comp\n(Challenge.lean:141) has no avatar anywhere.\
  \  Work at the TOP of the mountain is available\nand had never been attempted --\
  \ prefer it to a sixth attempt at a blocked foothill.\n\nDO NOT LAUNCH A LANE AT:\
  \ Pic0PreservesFilteredBaseColimit (a bare `def : Prop`, zero\nproducers, its mathlib\
  \ avatars do not apply to the bespoke quotient tower);\ntube-fibre / leak-image\
  \ / separation / a cleverer submodule L (all refuted in Lean);\n`degAff_mapAlg`\
  \ and `mem_pic0Subgroup_overSpec_iff` (they are not sorries to close, they\nare\
  \ declarations that do not exist -- see the docstring warning below).\n\nBUILD REACH:\
  \ see AJCR.w4-rep.build-reach.  Five modules were rooted this round, each with a\n\
  green full default build (now 9084 jobs).  CORRECTION: Pic0ThetaCocycle.lean DOES\
  \ parse;\nits real defect is that it has no build artifacts at all.\n\nTOOLING WARNINGS.\
  \  (a) Do not steer this subtree from `graph frontier`: its top items are\n\\lean{}\
  \ name-drift artifacts and the Rebuild cannot be graph-synced (I-0318).  (b) THIS\n\
  CODEBASE'S MODULE DOCSTRINGS ANNOUNCE THEOREMS THE FILES DO NOT DECLARE.  Treat\
  \ a docstring\nbullet, a roadmap \"cheap item\", and an English \"hence\" as ZERO\
  \ evidence that a declaration\nexists; verify with `horizon search` before briefing\
  \ anyone.  This single habit is behind\nmost of the stale claims corrected in the\
  \ last two rounds.\n"
