  MEASURED, not inferred: lexical `(rep :)` binders remain 128 to 128. Expanding the
  three section binders gives 143 to 143 consumer declarations. Direct unconditional
  `.RepresentableBy` result headers remain 3 to 3; strict binder-clean, logically
  deduplicated facts remain 2 to 2. `divFunctorAffZeroRepresentableBy` is excluded
  because its result erases externally supplied `{pi}` and `[IsAffineHom pi]` while
  its body uses that map. The genus Sigma package and its `.2` projection count once.
  The conditional Pic0 Sigma endpoint requires `hdeg`, `hf`, and `hcov`, so it earns
  zero producer credit. Every current fleet lane is 0 producers / 0 rep consumers;
  no lane is net consumers.


  CORRECTED STRATEGY: `divFunctorAff_genus_representableBy` represents the widened
  divisor functor only at `genus C`. Positive genus has a strictly larger admissible
  coverage parameter. The raw admissible Abel map has positive-dimensional linear-system
  fibres, so it cannot itself be the open Pic0 chart. The `hf` and `hcov` assumptions
  in `pic0RepresentableByOfAffineGenusCharts` remain an honest inventory for that
  conditional raw-chart theorem, but they are not the active terminal route.


  ACTIVE GATES: first produce a binder-free widened divisor representer at `divRepAffAdmissibleParameter`;
  current HEAD has off-diagonal certified chart classes but no off-diagonal classifier/range/RepresentableBy
  endpoint. Then construct in schemes over `Spec k` the represented kernel relation
  of the concrete admissible Abel map, identify it with relative and etale-local linear
  equivalence including the `picFromBase` quotient, construct the actual quotient
  scheme, prove local surjectivity, identify its Yoneda sheaf with `pic0TypeFunctor
  C`, and return the binder-free `RepresentableBy`. Exact acceptance contract: child
  `datum-tail.abel-quotient`.


  IMPORT-CLOSURE AUDIT: `Pic0AtlasFromDivRepAffChallenge` does not import `DivSchemeQProj`,
  `Pic0ChartAbelForkReduce`, or Mathlib `CategoryTheory.EquivalenceRelation`; root-level
  sibling imports do not place those declarations in its closure. `DivFamZarAff` quotients
  local equations representing the same divisor, not equality of induced Picard class.
  No binder-free Pic0 quotient endpoint exists at this snapshot.


  VERIFICATION STATE: the frozen wrapper proved 9467/9467 at tree f1db764af4. A later
  run0110 integration swept eight parameter style-comment files, producing current
  tree 89a2503964, while PulledDegree remains a live style delta. Final counts, independent
  axiom/import probes, index-independent source census, and a fresh root build remain
  mandatory after all prover rounds and source freezes.'
