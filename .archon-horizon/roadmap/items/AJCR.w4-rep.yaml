summary: "THE CRITICAL PATH TO Challenge.lean:99.  Re-framed 2026-07-26 (run 0048\
  \ round 4) around a single\nordered chain instead of \"six independent mountains\"\
  .  READ informal/w4-rep-critical-path.md FIRST —\nit carries the per-link evidence\
  \ and this summary does not repeat it.\n\nTARGET.  AlgebraicGeometry.Jacobian (Challenge.lean:96-99,\
  \ a bare sorry).  archon-protected.yaml\nFREEZES the signature, so a hypothesis-carrying\
  \ restatement is forbidden; the only admissible\ndischarge is Jacobian C := (jacobianData\
  \ C).J, and jacobianData has no producer.\n\nTHE CHAIN, BACKWARDS.  L1 Jacobian\
  \ := (jacobianData C).J | L2 the producer jacobianData — MISSING |\nL3 structure\
  \ JacobianData + consumer API (Picard/JacobianData.lean:87-144) — LANDED | L4 its\
  \ rep\nfield | L5 descent of the representation from a separably closed stage to\
  \ k (dat-g, dat-glue DAT-G0)\n— MISSING | L6 pic0RepresentableByOfCharts (Picard/Pic0SigmaSheaf.lean:161-169)\
  \ — LANDED | L7 its\nchart family (f, hf) = dat-c C9b — MISSING | L8 its IsLocallySurjective\
  \ input = dat-b B-6 — MISSING |\nL9 (divFunctor C pi g).RepresentableBy DivOver\
  \ (Picard/DivRepKit.lean:114) — exists but UNROOTED |\nL10 a term of DivRepGlobalData\
  \ (DivRepKit.lean:69) — MISSING, ZERO producers | L11 the affine-to-\ngeneral lift\
  \ DivRepGlobalData.ofAffine — MISSING, NEVER ATTEMPTED | L12 DivRepAffinePullback\n\
  (DivRepAffKit.lean:167) — structure landed, no producer | L13 its pull / isDivRepClassify_pull\n\
  fields = U2 | L14 U2's gate, the certificate — BLOCKED.\n\nTWO THINGS THE OLD FRAMING\
  \ HID.\n\n 1. THE HARDEST-SOUNDING STEP IS ALREADY DONE.  L6, gluing local representability\
  \ into a scheme,\n    is landed: pic0RepresentableByOfCharts consumes mathlib's\
  \ 01JJ engine and returns exactly the\n    type of JacobianData.rep.  Everything\
  \ above it is assembly.\n\n 2. A WHOLE LINK WAS MISSING FROM THE PLAN.  DivRepGlobalData\
  \ occurs in NO file but its own, and\n    its docstring says the omission is deliberate:\
  \ \"The affine-to-general lift is intentionally not\n    assumed to exist implicitly.\"\
  \  So between the affine package and the divisor-representability\n    endpoint\
  \ sits a sheaf-theoretic descent that appeared in no roadmap row, because every\
  \ plan\n    folded it into \"divrep\" as bookkeeping.  Its main input is already\
  \ proved — divFamZar is a\n    Zariski sheaf on ARBITRARY tests (Picard/DivisorFamilyZarSheaf.lean:66,\
  \ :237).  Leaf\n    ...ddr.divrep.lift.\n\nTHE SHAPE OF THE WORK: ONE GATE, ONE\
  \ CONDITIONAL TAIL.  Milestones now carry this split — list them\nwith `roadmap\
  \ list --milestone w4-gate` and `--milestone w4-tail`.\n * w4-gate: the certificate\
  \ subtree and u2.  Genuinely blocked (below).\n * w4-tail: lift, c9b, chart-u, dat-b,\
  \ dat-glue, dat-g, dat-j, datum-tail.  Every one of these is a\n   CONDITIONAL statement\
  \ provable today over a section variable — the idiom the tree already uses,\n  \
  \ since DivRepKit.lean is written entirely against one.  Work here does not wait\
  \ on the gate.\n\nWHERE THE GATE ACTUALLY STANDS.  chart-avoid is answered NO and\
  \ the reasons are landed Lean:\nFinCoverData types its pieces into the two pinned\
  \ charts (DivisorFamily.lean:166,:168,:186), clause\n(c1)-finiteness is leak-freeness\
  \ so piece traces are clopen (DivSchemeCertZarConn.lean:98), hence a\nconnected\
  \ support lands in one chart (DivSchemeCertZarC1.lean:131), and the obstruction\
  \ is\nDivEq-invariant (Confine.lean:110) and shrink-stable (Transport.lean).  Provably\
  \ useless repairs, do\nnot retry: refining the cover, shrinking the base, a cleverer\
  \ submodule L, re-spelling the equations,\nthe joint-covering relaxation (leaf joint-cover,\
  \ rejected), and — established this round —\nRE-BASING ON THE ZARISKI-LOCAL CERTIFICATE.\
  \  The epsilon-identity really does consume IsCertified\nthrough only three Zariski-local\
  \ projections and can be re-proved from IsLocallyCertified by a\nsqueeze, but the\
  \ no-go is about PRODUCING a certificate and IsLocallyCertified fails for exactly\
  \ the\ndivisors IsCertified fails for (DivSchemeCertZarC1.lean:30-31, verbatim).\n\
  \nTHE ONE OPEN EXPERIMENT ON THE GATE, and it is cheap: the no-go's argument is\
  \ degree-agnostic but\nits only witness (tX^2 + XY + tY^2 over k[t], C = P^1) is\
  \ genus 0, off the stratum the functor pins.\nAt g = 0 the no-go is vacuous; at\
  \ g = 1 base shrink evades it; at g >= 2 NO WITNESS HAS EVER BEEN\nEXHIBITED.  Settle\
  \ that before costing p1-aut or R2.  Note also that R1 alone cannot suffice over\
  \ an\narbitrary field: the pointwise gate needs two kappa(p)-rational points of\
  \ P^1 off the fibre's support\nimage at every prime, which fails over small finite\
  \ residue fields — that is inbox I-0346's\nfield-size question, and it is the same\
  \ obstruction seen pointwise, not a separate one.\n\nTRUST CORRECTION AFFECTING\
  \ EVERY ROW HERE.  93 of the tree's 619 modules (20,302 of 169,135 lines,\n~12%)\
  \ are unreachable from AlgebraicJacobian.lean and are therefore NEVER kernel-checked\
  \ — including\nPicard/DivRepKit.lean, i.e. L9 itself, and Picard/DivRepAffKitZar.lean,\
  \ which already contains the\ninterface weakening the u2 row called \"the cheap\
  \ edit nobody has made\".  The count of sorries is not\nthe measure of what is verified.\
  \  See AJCR.w4-rep.build-reach.\n\nNO SHORTCUT NEXT DOOR.  The sibling project MainProjects/Algebraic-Jacobian-Challenge\
  \ does NOT have\nrepresentability: its Picard.FGAPicRepresentability.instHasPicScheme\
  \ is an explicit <sorry> instance,\n\"the single genuine FGA sorry\", i.e. existence\
  \ of the Picard scheme is ASSUMED there and everything\ndownstream is built on the\
  \ assumption.  What the sibling does have and IS worth porting:\nPicard/ZariskiDescentRepresentability.lean\
  \ (1372 L, Zariski descent of representability with a full\ntranslation layer),\
  \ GlueDescent.lean, GaloisDescent/ (semilinear algebras and modules — the substrate\n\
  dat-g needs), GrassmannianRepresentability.lean, QuotRepresentability.lean.\n\n\
  TOOLING WARNINGS, unchanged.  (a) Do not steer this subtree from `graph frontier`:\
  \ its top items are\n\\lean{} name-drift artifacts and the Rebuild cannot be graph-synced\
  \ (I-0318).  (b) MODULE DOCSTRINGS\nIN THIS TREE ANNOUNCE THEOREMS THE FILES DO\
  \ NOT DECLARE, and roadmap rows have asserted the ABSENCE\nof declarations that\
  \ exist.  Verify both directions with `horizon search` before briefing anyone.\n"
