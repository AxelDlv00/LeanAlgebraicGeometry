summary: "*** RANKING AMENDMENT, second reviewer pass 2026-07-29 (run 0082 session\
  \ 0004, review-ajcr).\nANTECEDENT 2 IS NOT A GEOMETRY BILL, IT IS A SITE DECISION\
  \ -- so the #2 slot below is\nMIS-JUSTIFIED even though its position may be right.\
  \ Issue I-0920. ***\n\nThe costing below is otherwise intact and should be read\
  \ as it stands. This amendment changes ONE\nthing: the reason antecedent 2 (dat-b\
  \ B-5/B-6, local surjectivity) is expensive.\n\nBELOW IT SAYS: \"It carries the\
  \ content, and its packaging is complete ... What it owes is geometry:\nthe per-point\
  \ datum, plus the chart-parameter/threshold reconciliation.\"\n\nMEASURED, tracing\
  \ the per-point datum through its own producer chain rather than through the rows'\n\
  prose. The producer exists (exists_isChartDatumPlusFibre_of_mem_range, rooted, sorry-free),\
  \ and what\nit needs reduces to ONE hypothesis: IsPlusHonest (Pic0ChartPlusFibreProducer.lean:200).\
  \ Read as a\nstatement, that says: for every affine open U of the test, the class\
  \ restricted to U lies in the\nRANGE of relPicToPicEt -- i.e. Zariski-locally the\
  \ class comes from the UN-sheafified relPic.\n\nThat is the etale-sheafification\
  \ gap, structurally:\n * picEt is built on PicEtAff (PicEt.lean:9-21), and PicEtAff\
  \ C A (PicEtAff.lean:218) is a QUOTIENT\n   OVER ALL ETALE COVERS -- elements are\
  \ PicEtAff.mk E x;\n * PicEtAff.unit (:377), the target of relPicToPicEt (PicEtUnit.lean:126),\
  \ is mk at the TRIVIAL\n   cover `.self A` alone.\nSo honesty asserts that no nontrivial\
  \ etale cover is needed on that piece -- precisely what the\none-step plus construction\
  \ exists to permit to FAIL. The tree's only honesty mechanism agrees:\nPic0ChartHonest.lean's\
  \ own \"does not give\" says honesty holds over Spec E.Carrier and NOT over\nSpec\
  \ A, bought by CHANGING THE BASE, with \"Nothing here performs that descent\".\n\
  \nWHY THE CHART SIDE IS UNAFFECTED, which is what makes this a real distinction\
  \ rather than a blanket\npessimism: chartValue = abelDiv * sigmaFamily * (thetaFamily^m)^{-1}\
  \ (DivSchemeAbel.lean:351, read\nfrom the definition), and honesty is discharged\
  \ for each factor and closed under the group\noperations. Coverage is different\
  \ because chartsCoverLocally_of_pointwise\n(Pic0ChartCoveragePointwise.lean:128)\
  \ quantifies over EVERY s : (pic0SigmaSheaf C).1.obj (op T);\narbitrariness is the\
  \ content of coverage, and narrowing s to chart-value shape makes it circular.\n\
  \nCONSEQUENCE. Antecedent 2 splits into a cheap half and an out-of-reach half, and\
  \ the rows conflate\nthem: honesty of coverage's own WITNESS is already covered;\
  \ honesty of the class coverage must HIT\nis the gap. The repair -- refine to the\
  \ etale carrier, then descend -- changes the site from Zariski\nto etale, and pic0RepresentableByOfCharts'\
  \ antecedent is Zariski-local surjectivity. No leaf settles\nthat. It is a route\
  \ question for the human/reviewer layer, and it is the third antecedent-level\n\
  obstruction found on this seam after the unrestricted-certificate fork (antecedent\
  \ 1) and U2.\n\nNOT A REFUTATION. Proving IsPlusHonest false for an arbitrary class\
  \ needs a class not\nZariski-locally in relPic's image; this tree has no Brauer\
  \ or nontrivial-etale-class machinery to\nbuild one, and I did not build it. The\
  \ claim is the weaker sufficient one: it is not a lemma about\nthe tree's own constructions,\
  \ and a lane sent at it will not find a proof.\n\nTHE VERDICT BELOW (\"none of the\
  \ three antecedents closes this week\") is unchanged and, if anything,\nbetter supported:\
  \ the antecedent that looked closest to being a bounded geometry bill is the one\n\
  that turns out to need a decision above the leaf layer.\n\n--- the first reviewer\
  \ pass's costing follows, accurate except as amended above ---\n\n*** THE COSTING,\
  \ RE-RANKED 2026-07-29 (run 0082, review-ajcr). THE THREE ANTECEDENTS ARE NOT THREE\n\
  INDEPENDENT PRICES, AND NONE OF THEM CLOSES THIS WEEK. Read this before picking\
  \ a leaf. ***\n\nWHAT IS GENUINELY SOUND, and it is worth stating first because\
  \ it is unusual: pic0RepresentableByOfCharts\n(Picard/Pic0SigmaSheaf.lean:161) and\
  \ mixedParamRepresentableBy (Pic0ChartAtlasParamFree.lean:125) are\nsorry-free,\
  \ rooted, and honest. Given the three antecedents they WOULD produce a representing\
  \ scheme.\nThe machine is correct. Nothing feeds it.\n\nTHE THREE ANTECEDENTS DO\
  \ NOT COMPOSE AS THE ROWS IMPLY. Measured, `lake env lean` EXIT=0 (probes in\nrun\
  \ 0082 session dir /probes):\n (1) `hf` = IsChartUniv (Pic0ChartPair.lean:173) is\
  \ stated at a FREE `V : D.left.Opens`. At ι = PEmpty\n     the whole seam call elaborates\
  \ with `hf := fun i => PEmpty.elim i` -- no charts, no rep, no\n     IsChartUniv.\
  \ At V = bottom, injectivity is free (no nonempty test has a point of the empty\
  \ open).\n     So `hf` at an arbitrary V carries NO CONTENT.\n     QUALIFIED by\
  \ ajcr-p1 (I-0890), correctly: 'free at V = bottom' is true of the INJECTIVITY clause\n\
  \     and of exists_factor, and FALSE of the fibre DATUM -- its sq field at an empty\
  \ test needs\n     Subsingleton (pic0Subgroup C ..) over an empty base, which is\
  \ true, separate, and absent from the\n     tree. So the degenerate value shows\
  \ a clause is cheap without exhibiting an inhabitant: CHEAP and\n     SATISFIABLE\
  \ come apart, and several rows on this leaf have been priced by exactly that\n \
  \    conflation. The ι = PEmpty conclusion below is unaffected -- it never used\
  \ V = bottom.\n (2) The seam is nonetheless NOT vacuous: at ι = PEmpty the sup sieve\
  \ is BOTTOM, and the bottom sieve\n     is Zariski-covering only for an EMPTY test.\
  \ So ALL the content forcing the atlas to be an atlas\n     sits in the LOCAL-SURJECTIVITY\
  \ instance -- antecedent 2, not antecedent 1.\n (3) THE UNPRICED OBLIGATION, which\
  \ no row owned before this pass: coverage\n     (chartsCoverLocally_of_pointwise,\
  \ Pic0ChartCoveragePointwise.lean:128) must produce\n     `x : (W : Scheme) ⟶ X\
  \ i`, i.e. INTO `(V i : Scheme)`. So coverage must hit the SAME V at which\n   \
  \  `hf` was certified. chartLocus is an open of the TEST; V is an open of the DIVISOR\
  \ SCHEME. Zero\n     files in the tree mention both IsChartUniv and ChartsCoverLocally.\
  \ Now owned by\n     AJCR.w4-rep.datum.chart-restrict (ajcr-p1, I-0869/I-0872).\n\
  \nWORSE, AND INDEPENDENTLY CONFIRMED WITH ajcr-p1: the only non-circular producer\
  \ of `hf`,\nisChartUniv_of_isChartLocusFibre (Pic0ChartUnivReduce.lean:170), goes\
  \ THROUGH the unrestricted\ncertificate -- its body is `isOpenImmersion_presheaf_of_chartFibrePresented`\
  \ with the restriction\napplied afterwards. So IsChartLocusFibre implies IsOpenImmersion.presheaf\
  \ of the UNRESTRICTED Abel\nchart, which three headers call false (|D| is not a\
  \ point). QUALIFICATION I add: that falsity is a\nHEADER CLAIM, unproved -- isEmpty_forall_chartFibrePresented_of_not_injective\n\
  (Pic0ChartOpenImmersionCriterion.lean:219) takes non-injectivity as a HYPOTHESIS\
  \ and is never\ninstantiated. So the tree holds a reduction and its conditional\
  \ refutation and has connected neither.\n\nTHE RANKING, corrected. Not by ease --\
  \ by what a discharge would actually buy:\n 1. chart-restrict (the V-coupling +\
  \ a fibre criterion at the RESTRICTED chart). Held by ajcr-p1.\n    Without it antecedents\
  \ 1 and 2 cannot be composed at all, so it outranks both.\n 2. Antecedent 2, local\
  \ surjectivity (dat-b B-5/B-6). It carries the content, and its packaging is\n \
  \   complete: isLocallySurjective_sigmaDesc_of_pointwise takes B-5 to the instance\
  \ in ONE step, with\n    a converse, so the pointwise form is not a strengthening\
  \ chosen to be provable. What it owes is\n    geometry: the per-point datum, plus\
  \ the chart-parameter/threshold reconciliation.\n 3. Antecedent 1, `hf`. Real but\
  \ currently unreachable except through the unrestricted statement.\n 4. Antecedent\
  \ 3, `rep i` (divrep/u2). Multi-round: U2 is refuted on the widened route\n    (isEmpty_chartTyping_of_straddling),\
  \ and the live question is a chart-free eps-value.\n\nRE-PRICED LEAVES, both directions,\
  \ all verified by reading the Lean rather than the prose:\n * OVER-PRICED (I-0870):\
  \ dat-b, chart-u and c9b all say the per-affine-piece datum has NO PRODUCER.\n \
  \  It has one -- exists_isChartDatumPlusFibre_of_mem_range (Pic0ChartPlusFibreProducer.lean:178),\n\
  \   rooted and sorry-free, with chartLocusOpensOfIsPlusHonest (:334) giving c9b\
  \ clause (i) as DATA and\n   haff DISCHARGED. Residue is IsPlusHonest at the coverage\
  \ class, which is narrower.\n * MIS-ROUTED (I-0862): the rejection cluster's forwarding\
  \ address, twist-atlas, is the GL_2(k) route\n   protection I-0492 FORBIDS (twistedP1Map\
  \ = pi >> P1.autOfMatrix). Now rejected. The four rejections\n   themselves are\
  \ each CORRECT, and three of them are ONE fact -- pieces confined to a fixed chart\n\
  \   pair -- which R2 already removed.\n * dat-glue: unchanged and correctly deferred;\
  \ it consumes the above.\n\nVERDICT TO THE HUMAN (also sent --to human): none of\
  \ the three antecedents closes this week. The\nreachable wins this round are the\
  \ coupling statement and the re-pricings, not a discharge.\n\nBUILD REACHABILITY\
  \ IS FIXED, and the paragraph near the end of this row saying otherwise is STALE:\n\
  93/620 unrooted is now 18/756, the entire DD-R tail is rooted, and the 18 remaining\
  \ are essentially\nthe old triage's own DELETE list plus Pic0ThetaCocycle. See AJCR.w4-rep.build-reach.\
  \ Exactly 17 code\nsorries project-wide: Challenge.lean 15 (the statement-only north\
  \ star) and Pic0ThetaCocycle 2\n(unrooted). A naive sorry count reads AJCR as nearly\
  \ done; it is not, and the sorries are not the\nmeasure -- the undischarged antecedents\
  \ are.\n\n--- the round-5 body follows, still accurate except where marked stale\
  \ above ---\n\nTHE CRITICAL PATH TO Challenge.lean:99.  Re-framed round 4 as one\
  \ ordered chain; REFRAMED AGAIN\nround 5, because the round-4 framing put the gate\
  \ in the wrong place.  READ\ninformal/w4-rep-critical-path.md SECTION 7 FIRST --\
  \ it carries the per-link evidence.\n\nTARGET.  AlgebraicGeometry.Jacobian (Challenge.lean:96-99,\
  \ a bare sorry).  archon-protected.yaml\nFREEZES the signature, so a hypothesis-carrying\
  \ restatement is forbidden -- in particular a\nrepresentability theorem valid only\
  \ over infinite fields is NOT a discharge.  The sanctioned\ndischarge is Jacobian\
  \ C := (jacobianData C).J.\n\nWHAT THE TARGET REDUCES TO TODAY, exactly.  Round\
  \ 5 landed JacobianData.ofCharts\n(Picard/JacobianDataCharts.lean:182) and JacobianData.ofChartsOfCompactSpace\
  \ -- the first producers\nof JacobianData, which had ZERO before (all ~25 occurrences\
  \ in the tree were consumers taking it as\na section variable).  Composing with\
  \ the frozen discharge, the target is now exactly\n\n    A ZARISKI ATLAS OF pic0SigmaFunctor\
  \ C: schemes X i and maps\n    f i : yoneda.obj (X i) -> pic0SigmaFunctor C such\
  \ that\n      (L7) each f i is a relatively representable open immersion   [roadmap\
  \ dat-c C9b]\n      (L8) Sigma.desc f is Zariski-locally surjective            \
  \  [roadmap dat-b B-6]\n      (L*) each chart is quasi-compact with locally-of-finite-type\
  \ structure morphism.\n\nEverything else above the atlas is DONE and kernel-checked:\
  \ the big-site sheaf condition, mathlib's\n01JJ gluing (pic0RepresentableByOfCharts,\
  \ Pic0SigmaSheaf.lean:161), the Sigma-descent, and BOTH\nfiniteness certificates\
  \ -- which are DERIVED from chart-level hypotheses, not assumed\n(locallyOfFiniteType_gluedHom\
  \ :154 via IsZariskiLocalAtSource.of_openCover;\nquasiCompact_gluedHom :164 via\
  \ HasAffineProperty.iff_of_isAffine).  A hypothesis scare was checked\nand closed:\
  \ Pic0SigmaSheaf.lean:79's [GeometricallyReduced C.hom] is redundant, supplied by\n\
  Curve/GeometricallyReduced.lean:130/:140 from smoothness (record: JacobianDataCharts.lean:210).\n\
  \nWHERE THE GATE ACTUALLY BITES -- THE ROUND-5 CORRECTION, and it changes what everyone\
  \ should work\non.  Inbox I-0365.  The old framing (\"the divrep tail is independent\
  \ of the certificate; the\ncertificate gates U2\") is FALSE, but not in the direction\
  \ the tree assumed.  DivFamZar is BY\nDEFINITION a quotient of LOCALLY CERTIFIED\
  \ families (DivisorFamilyZar.lean:224,:235), so\ncertificates are FREE on the consuming\
  \ side -- DivFamZar.exists_certChartCover\n(DivRepClassifyZarKit.lean:433) is a\
  \ landed theorem, unfolded by every classifier keystone\n(DivRepClassifyZar.lean:128/:176/:230,\
  \ DivRepClassifyZarSep.lean:361/:363), and IsDivRepClassify\n(:90) quantifies over\
  \ certified families as a HYPOTHESIS.  The bite is on the other side: the no-go\n\
  (DivSchemeCertZarC1.lean:30-31,:131) says DivFamZar is BLIND to connected divisors\
  \ meeting both\npinned fibres, so divFunctor C pi g is a PROPER SUBFUNCTOR of degree-g\
  \ relative divisors.\nRepresenting it is not the problem -- the L9-L13 tail does\
  \ that honestly.  The problem is that a\ntoo-small divisor functor CANNOT COVER\
  \ Pic^0: the Abel map out of it is not locally surjective,\nbecause the classes\
  \ whose only witnesses are the invisible divisors are never hit.  THE GATE IS L8.\n\
  Judge every proposed repair by whether it widens DivFamZar enough for L8, not by\
  \ whether it makes a\ncertificate easier to prove.  U2 and the affine package are\
  \ TAIL work, and they are nearly finished.\n\nSETTLED; DO NOT RE-LITIGATE.  (a)\
  \ No repair that keeps the pieces inside the preimages of a FIXED\nPAIR of points\
  \ of P^1 can work: refining the cover, shrinking the base, a cleverer submodule\
  \ L,\nre-spelling the equations, the joint-covering relaxation (leaf joint-cover,\
  \ rejected), and re-basing\non the Zariski-local certificate are all provably useless.\
  \  (b) The no-go is ON-STRATUM: a witness\nexists for every genus >= 2 (spec-dd-r\
  \ ADDENDUM 4; re-derived independently round 5, critical-path\nsection 7.3; an explicit\
  \ rational example is y^2 = x^5 - x + 1 with pi = [y-1 : y+1] of degree 5).\nThe\
  \ round-4 instruction on this row to \"settle that before costing p1-aut or R2\"\
  \ is STRUCK -- it was\nalready settled the same round, by this row's own child field-size.\
  \  (c) DO NOT formalise the\nwitness: it needs Sym^g C / Hilb^g, which mathlib lacks\
  \ and this tree has never built (ADDENDUM 4\nsection 4.5).\n\nTHE ONE LIVE DECISION:\
  \ R1 VERSUS R2, and it must be made with the descent half COSTED.\n * R1 (p1-aut\
  \ -> fibre-avoid -> cert-relocalize): quantify the certificate over a twist\n  \
  \ gamma in Aut(P^1_k).  PROVED CORRECT IFF |P^1(k)| >= g + 2 -- every infinite field,\
  \ and F_q for\n   q >= g + 1.  Since the target is stated over an ARBITRARY field,\
  \ R1 CANNOT DISCHARGE THE\n   CHALLENGE ALONE; it needs the descent lane dat-g behind\
  \ it.  Note what descent is required:\n   the sibling's ZariskiDescentRepresentability.lean\
  \ is ZARISKI descent and does NOT cross a field\n   extension; what is needed is\
  \ Galois/fppf descent, for which the sibling's GaloisDescent/\n   (semilinear algebras\
  \ and modules, sorry-free, built) is the substrate.\n * R2 (generalise FinCoverData's\
  \ piece type to arbitrary affine opens of the relative curve):\n   field-uniform,\
  \ and justified in one line -- supp D is finite over R, hence contained in a single\n\
  \   affine open (Stacks 0B8B), so a cover with one straddling piece always exists.\
  \  Blast radius\n   measured: FinCoverData is named in 28 files.\nThe honest comparison\
  \ is R1 + a Galois-descent campaign against R2 + a 28-file refactor.  The\np1-aut\
  \ leaf says \"do not attempt both\".\n\nTRUST, MEASURED THIS ROUND.  622 modules\
  \ on disk, 529 reachable from AlgebraicJacobian.lean, 93\nUNROOTED and therefore\
  \ never kernel-checked (lakefile.toml has no globs and defaultTargets is the\nroot,\
  \ so unrooted really does mean unverified).  CORRECTION to the round-4 census: Picard/DivRepKit.lean\n\
  is NO LONGER unrooted -- Picard/DivRepGlobalLift.lean imports it and the root imports\
  \ that -- so L9,\nthe divisor-representability endpoint, is kernel-checked.  Picard/DivRepAffKitZar.lean,\
  \ which round-4\nnotes cite as already performing the u2 interface weakening, NO\
  \ LONGER EXISTS (removed in 1e4ac5b52).\nThe count of sorries is not the measure\
  \ of what is verified.  Row AJCR.w4-rep.build-reach owns this.\n\nNO SHORTCUT NEXT\
  \ DOOR, WITH ONE EXCEPTION WORTH CHECKING.  The sibling MainProjects/Algebraic-Jacobian-Challenge\n\
  does NOT have representability: its Picard.FGAPicRepresentability.instHasPicScheme\
  \ (:313-317) is an\nexplicit <sorry> instance.  But it does hold one large verified\
  \ asset the Rebuild has never looked\nat -- GrassmannianQuot.lean:5607 declares\
  \ an UNCONDITIONAL (functor d r).RepresentableBy (scheme d r)\nin a 5631-line sorry-free\
  \ file, and both projects share the same toolchain and the same mathlib.\nAlso portable:\
  \ GaloisDescent/, GlueDescent.lean, ZariskiDescentRepresentability.lean (1372 L).\n\
  \nTOOLING WARNINGS, unchanged.  (a) Do not steer this subtree from `graph frontier`:\
  \ its top items are\n\\lean{} name-drift artifacts and the Rebuild cannot be graph-synced\
  \ (I-0318).  (b) MODULE DOCSTRINGS\nIN THIS TREE ANNOUNCE THEOREMS THE FILES DO\
  \ NOT DECLARE (I-0349), and roadmap rows have asserted the\nABSENCE of declarations\
  \ that exist.  Verify both directions with `horizon search` before briefing\nanyone\
  \ -- and check the ledger for files swept in by an `integrate` commit, which is\
  \ how round 4's\nown chain document came to call a landed file \"MISSING, never\
  \ attempted\"."
