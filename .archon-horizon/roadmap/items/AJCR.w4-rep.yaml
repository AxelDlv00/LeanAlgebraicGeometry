summary: "================================================================================\n\
  CURRENT STATE, READ THIS FIRST (review-ajcr r4, 2026-07-30). Everything below\n\
  this block is the audit HISTORY: five layers of correction and self-correction,\n\
  in which the actual costing does not appear until roughly halfway down. It is\n\
  kept because each retraction is evidence, but a lane picking a target should\nread\
  \ this block and then jump to the header \"THE COSTING, RE-RANKED\".\n================================================================================\n\
  \nTHE MACHINE IS SOUND AND HAS NOTHING TO FEED IT. pic0RepresentableByOfCharts\n\
  (Pic0SigmaSheaf.lean:161) and mixedParamRepresentableBy\n(Pic0ChartAtlasParamFree.lean:125)\
  \ are sorry-free, kernel-confirmed, non-circular,\nand WOULD produce a representing\
  \ scheme. All three antecedents are undischarged\nand no sorry-free witness exists\
  \ for any of them.\n\nTHE THREE ANTECEDENTS, ranked by measured cost, cheapest last:\n\
  \ 1. IsChartUniv (the per-index chart certificate, `hf`) -- CERT-Sigma-gated.\n\
  \    Refuted at V = top and free-but-useless at V = bot; whether the PAIR holds\
  \ at\n    any V strictly between is UNMEASURED at every V. Inhabitation at one concrete\n\
  \    V is the open question. Rows: chart-u, chart-restrict, atlas-coupling.\n 2.\
  \ Zariski-local surjectivity of Sigma.desc f (DAT-B coverage) -- the most\n    expensive,\
  \ and multi-round (told to the human as I-1090). Cannot be discounted\n    by restricting\
  \ the atlas: ajcr-p1's isLocallySurjective_sigmaDesc_mono carries\n    any V up\
  \ to top, where the inclusion is an iso. Restricted coverage is no\n    cheaper\
  \ than unrestricted -- and note only ONE direction is proved, so it is\n    as measured\
  \ STRICTLY STRONGER. Row: dat-b.\n 3. rep i (a representation of divFunctor at each\
  \ parameter) -- the divisor-\n    representability lane's target. Rows: ddr.divrep\
  \ (+ u2, abel-widened).\n\nRIDERS THAT ARE NOT SEPARATE OBLIGATIONS, both established\
  \ by retraction below:\n * hD (LocallyOfFiniteType) is a rider on antecedent 3,\
  \ proved via\n   rep.uniqueUpToIso -- unconditional, not contingent on the carrier\
  \ divRep\n   returns.\n * hcpt IS the JacobianData.quasiCompact field, so dat-glue\
  \ and dat-j name ONE\n   obligation. Qualification (r4, I-1162): the half carrying\
  \ that -- the mpr\n   direction -- has been the producer's own implementation since\
  \ 07-27\n   (JacobianDataCharts.lean:216); the new content is the mp direction,\
  \ which\n   shows the identification cannot be undone. hcl still has no producer,\
  \ so\n   nothing there is discharged.\n\nr4 REPRICING, DOWNWARD, one row: the chart\
  \ parameter n is pinned to the genus by\nchi_moduleKSheaf (RiemannRoch/ChiCurve.lean:148)\
  \ UNCONDITIONALLY, under instance\nbinders the chart files already carry. So abel-noninj\
  \ owes no \"we are at n = g\"\nargument and its n > g branch is unreachable -- the\
  \ fork is the carve question at\nONE degree. Do NOT quote the five-producer census\
  \ for this (I-1136); it is false\nat DivRepKit.lean:113, which carries no chi hypothesis.\
  \ See I-1152.\n\nSORRY COUNT IS NOT DEBT HERE: 17 sorries, all in Challenge.lean\
  \ (15, the\nstatement-only north star) and Pic0ThetaCocycle.lean (2). A naive count\
  \ reads\nAJCR as nearly done. It is not -- the gap is the three antecedents above,\
  \ none of\nwhich is a sorry.\n\nANSWER TO THE COSTING QUESTION, unchanged this round:\
  \ none of the three closes\nthis week (human-facing accounting at I-0984). The items\
  \ where a single round can\nstill produce a DECISIVE result rather than partial\
  \ progress are antecedent 1's\ninhabitation at one concrete V, and the abel-noninj\
  \ carve question now that its\ndegree is pinned.\n\n================================================================================\n\
  HISTORY FOLLOWS -- corrections in reverse chronological layers.\n================================================================================\n\
  \n*** hcpt CLAUSE RETRACTED 2026-07-29 (review-ajcr, run 0082 s0006), refuted by\
  \ ajcr-p4 (I-1007)\nwithin minutes of my writing it. THE DEGENERACY OBSERVATION\
  \ IS REAL; MY CAUSAL READING WAS\nCONFOUNDED. ***\n\nI wrote, in the self-correction\
  \ below, that \"hcpt is NOT an independent gate but a CONSEQUENCE of\ncoverage\"\
  , inferred from hcpt being free at iota := PEmpty while all content sat in the\n\
  IsLocallySurjective instance. p4's refutation is decisive and I verified its pivot\
  \ myself (EXIT=0):\nPEmpty IS FINITE. So freeness of hcpt there is explained by\
  \ the FINITE-INDEX route\n(JacobianData.ofCharts with per-chart compactness at an\
  \ empty cover), with coverage contributing\nnothing. A degenerate index attributes\
  \ to whichever hypothesis happens to vary, and I varied the\nwrong one.\n\nWHAT\
  \ p4 MEASURED, more useful than my claim was: feeding the openCover route directly,\n\
  (glueData hf).openCover.compactSpace fails on EXACTLY ONE goal --\nFinite (glueData\
  \ hf).openCover.I0. Not chart compactness, not the cover being a cover, not\ncoverage.\
  \ Add [Finite iota] plus per-chart CompactSpace and the same term closes. p4 also\
  \ applies my\nown I-0978 correctly: a failing synthesis measures the instance graph,\
  \ so this does NOT prove hcpt\nindependent of coverage -- it shows no route in scope\
  \ derives it, and the single gap on the\navailable route is INDEX FINITENESS, which\
  \ the class-indexed atlas provably lacks.\n\nCONSEQUENCE, and it strengthens the\
  \ item rather than weakening it: DO NOT schedule \"derive hcpt\nfrom coverage\"\
  . The two honest options are the ones the tree names -- a finite atlas, or the Abel\n\
  image (JacobianData.ofChartsOfAbelImage out of a quasi-compact DivScheme). The class-indexed\
  \ atlas\nneeds the second, and PRICING IT is the unowned work. Row AJCR.w4-rep.datum.dat-j\
  \ points there.\n\n*** SELF-CORRECTION 2026-07-29, SAME SESSION (review-ajcr, run\
  \ 0082 s0006, after a fresh-context\nreview of my OWN correction below). THE FOURTH\
  \ ITEM IS NOT AN ANTECEDENT AT ALL -- IT IS A RIDER\nON antecedent 3, AND I PROVED\
  \ IT RATHER THAN ARGUED IT. Read this before the arithmetic\ncorrection that follows;\
  \ that correction's CONCLUSION survives but its UNIT OF PRICING was wrong. ***\n\
  \nWHAT I GOT RIGHT AND WHAT I GOT WRONG. Right: the count was 3-of-3 where the goal\
  \ needs more, the\n\"derived, not assumed\" sentence was misleading, and ajcr-p4's\
  \ discharge is real. WRONG: I priced\nhD : forall i, LocallyOfFiniteType (D i).hom\
  \ as a FOURTH INDEPENDENT ANTECEDENT that p4 removed,\nand justified its cheapness\
  \ by the CARRIER the divRep lane happens to return today\n(locallyOfFiniteType_divSchemeOverHom).\
  \ That argument is CONTINGENT -- it would need re-measuring\nif divRep ever returned\
  \ a different object.\n\nTHE UNCONDITIONAL FACT, PROBED, `lake env lean` EXIT=0,\
  \ axioms [propext, Classical.choice,\nQuot.sound]: if divFunctor C pi n is representable\
  \ by D and by D', and D'.hom is locally of finite\ntype, then D.hom is. Three lines\
  \ -- e := rep.uniqueUpToIso rep', e.hom.left is IsIso via\nOver.comp_left on hom_inv_id,\
  \ then rw [<- Over.w e.hom] and infer_instance.\n\nSO hD IS AN INVARIANT OF THE\
  \ FUNCTOR AT THE PARAMETER, not a property of the chosen carrier. No\nproducer of\
  \ rep can choose a D that fails it, and none can be blamed for one that does. The\
  \ right\nplace for it on this board is as a RIDER ON THE rep ROW (divrep), not as\
  \ an item of its own -- a\nrow that lists it separately INFLATES the antecedent\
  \ count, which is the same error in the\nopposite direction from the one I was correcting.\n\
  \nTHE ANTECEDENT LIST OF THE GOAL, corrected again and now on unconditional grounds:\n\
  \ 1. hf = IsChartUniv. OPEN (chart-restrict, ajcr-p1).\n 2. Zariski-local surjectivity\
  \ of Sigma.desc. OPEN (dat-b, ajcr-p2).\n 3. rep i, divisor representability --\
  \ CARRYING hD as a rider that costs its producer nothing.\n    OPEN (divrep.u2).\n\
  \ 4. quasiCompact. OPEN, and see the degeneracy note below, which reprices it.\n\
  \nAND A DEGENERACY THAT REPRICES quasiCompact, measured on the same pass. At iota\
  \ := PEmpty EVERY\nexplicit input of jacobianDataOfMixedParamCharts is free -- hf/hdeg/V/hD/m/Z/nn\
  \ by PEmpty.elim,\nand hcpt free too because an empty family glues to an EMPTY space\
  \ (IsEmpty => CompactSpace by\ninferInstance). ALL the content sits in the single\
  \ IsLocallySurjective instance. The output is\nnevertheless NOT vacuous, and that\
  \ was also probed (EXIT=0, same axioms): that instance at PEmpty\nimplies False,\
  \ because JacobianData.rep yields a point of J over every test (homEquiv.symm 1)\n\
  while J.left is empty. TWO CONSEQUENCES: (a) the assembly is sound and falsifiable,\
  \ so nothing\nhere is a HasDivFunctor-style vacuity; (b) hcpt is NOT an independent\
  \ gate of this shape but a\nCONSEQUENCE of coverage -- and any future \"hcpt discharged\"\
  \ measured at a small atlas measures\nnothing at all.\n\nALSO CORRECTED, and it\
  \ is a false absolute I repeated from p4's file: \"the only declaration in\nPicard/\
  \ whose conclusion is LocallyOfFiniteType is locallyOfFiniteType_gluedHom\". There\
  \ are FIVE\nnon-local ones plus 38 local re-derivations; the omitted ones include\
  \ the very instance\n(DivSchemeQProj.lean:199) that Pic0AtlasFiniteType.lean imports\
  \ and cites to make hD free, so the\nabsolute is refuted by that file's own closing\
  \ section. THE DEFENSIBLE FORM, which is what a board\nrow should say: no producer\
  \ AT A CHART. Same absolute is live on row\nAJCR.w4-rep.datum.dat-glue.atlas-lft\
  \ (\"exactly ONE declaration\") -- narrow it there too.\n\n*** ARITHMETIC CORRECTION\
  \ 2026-07-29 (review-ajcr, run 0082 s0006). THE ANTECEDENT COUNT ON THIS\nROW WAS\
  \ THREE-OF-THREE WHERE THE GOAL NEEDS FOUR-OF-FOUR, AND ONE SENTENCE BELOW IS MISLEADING\n\
  IN THE DIRECTION THAT MATTERS. Audited ajcr-p4's finding (I-0967/I-0977); it is\
  \ CORRECT. ***\n\nTHE SENTENCE TO FIX IS MINE. Below, this row says the big-site\
  \ sheaf condition, the 01JJ gluing\nand \"BOTH finiteness certificates -- which\
  \ are DERIVED from chart-level hypotheses, not assumed\"\nare done and kernel-checked.\
  \ Read against the statements that is wrong in effect: they are derived\nfrom chart-level\
  \ hypotheses THAT NOTHING IN THE TREE PRODUCED, which is not the same as derived.\n\
  locallyOfFiniteType_gluedHom (JacobianDataCharts.lean:154) TAKES\nhlft : forall\
  \ i, LocallyOfFiniteType (chartHom C f i); it was, until 67c8d24d5, the only Picard/\n\
  declaration concluding LocallyOfFiniteType at a chart, so the certificate was an\
  \ assumption on\nevery route. PicRepDatum.lft (PicRepDatum.lean:100) is a structure\
  \ FIELD -- also an assumption --\nand toJacobianData (JacobianDataFromPicRepDatum.lean:87)\
  \ only carries it across. So a lane that\ndischarged all THREE tracked antecedents\
  \ would NOT have produced a JacobianData C, which is what\nChallenge.lean's frozen\
  \ Jacobian := (jacobianData C).J actually needs.\n\nNOW DISCHARGED, AND IT IS A\
  \ REAL DISCHARGE RATHER THAN A RELOCATION -- the part I checked hardest,\nbecause\
  \ \"reduces to X\" usually just moves the bill. Pic0AtlasFiniteType.lean (ajcr-p4)\
  \ proves\nlocallyOfFiniteType_chartHom_mixedParamChart: at the REAL atlas the certificate\
  \ follows from\nhD : forall i, LocallyOfFiniteType (D i).hom alone. And hD is FREE\
  \ at the carrier the\ndivisor-representability lane returns: PROBED, imports current,\
  \ `lake env lean` EXIT=0 --\nLocallyOfFiniteType (divSchemeOver k A B g r1 r2 b1\
  \ b2).hom closes by inferInstance ALONE at\nARBITRARY window data, via the global\
  \ instance locallyOfFiniteType_divSchemeOverHom\n(DivSchemeQProj.lean:199), and\
  \ DivOver (DivRepGlobalClassify.lean:113-116, :308) is an instance of\nexactly that\
  \ shape. So a lane producing rep supplies the fourth antecedent at the same moment\
  \ at\nzero cost.\n\nWHAT REPLACES THE THREE-ITEM LIST, as the antecedent list of\
  \ the GOAL:\n 1. hf = IsChartUniv. OPEN (chart-restrict, ajcr-p1).\n 2. Zariski-local\
  \ surjectivity of Sigma.desc. OPEN (dat-b, ajcr-p2).\n 3. rep i, divisor representability.\
  \ OPEN (divrep.u2, ajcr-p3).\n 4. hlft, chart finiteness. DISCHARGED at the real\
  \ atlas, free at the rep carrier.\n 5. quasiCompact. OPEN and GENUINELY A-POSTERIORI,\
  \ and this is the item to watch now that 4 is\n    gone. PER-CHART compactness is\
  \ free at the same carrier (compactSpace_divScheme); CompactSpace\n    of the GLUED\
  \ object is not, and for the class-indexed (infinite) atlas the finite route\n \
  \   JacobianData.ofCharts is unavailable, so it must come from the Abel image\n\
  \    (JacobianData.ofChartsOfAbelImage). Do not let the freeness of the per-chart\
  \ form be quoted\n    for the glued form -- that conflation is exactly what this\
  \ correction is about.\n\nTHE VERDICT IS UNCHANGED: none of the three OPEN antecedents\
  \ closes this week (I-0873). Item 4\nwas never on the list, so removing it does\
  \ not shorten the critical path; what it does is make\nthe remaining list the true\
  \ one. One caveat on the discharging file itself:\nPic0AtlasFiniteType.lean:65 claims\
  \ \"everything in it other than hf, the local-surjectivity\ninstance and rep is\
  \ now discharged\", while hcpt is an explicit hypothesis of the same definition\n\
  and the file's own :184-186 and :262-265 call it open. The :262 reading is the correct\
  \ one.\n\n*** SELF-CORRECTION 2026-07-29, SAME SESSION (review-ajcr, run 0082 s0004,\
  \ after a fresh-context\nreview of my own work). THE IsPlusHonest FINDING BELOW\
  \ IS OVERSTATED ON THE STEP THAT CARRIES IT.\nThe route-decision conclusion SURVIVES,\
  \ for a different and better-evidenced reason. ***\n\nWHAT I GOT WRONG. I argued:\
  \ relPicToPicEt lands in PicEtAff.unit, unit is mk at the TRIVIAL cover\n`.self\
  \ A` alone, therefore honesty asserts that no nontrivial etale cover is needed.\
  \ That step is\nFALSE. PicEtAff.unit_eq_mk (Picard/RelPicCoverInjective.lean:48)\
  \ proves a unit class is presented on\nEVERY cover E, not only on `.self` -- so\
  \ \"mk at the trivial cover\" describes one PRESENTATION, not\nthe RANGE, and nothing\
  \ follows about which classes the range contains.\n\nAND THE ABSOLUTE FORM IS REFUTED\
  \ BY A LANDED THEOREM IN THIS TREE:\nPicEtAff.unit_surjective_of_section (Picard/EffectivityClose.lean:141)\
  \ proves the unit SURJECTIVE\nover a field test K admitting a curve point sigma,\
  \ upgraded to a MulEquiv by\nPicEtAff.unitEquiv_of_section (:186). Over such tests\
  \ honesty is DISCHARGED OUTRIGHT -- vacuously\ntrue, no etale cover needed anywhere.\
  \ So \"IsPlusHonest is the sheafification gap asserted of an\narbitrary section\"\
  \ is wrong as an absolute.\n\nTHE CORRECTED CLAIM, which is narrower and better\
  \ supported. The gap is at a GENERAL AFFINE BASE\nWITH NO SECTION, and the tree\
  \ documents exactly why:\n * the field route closes only through etale-cover cofinality\
  \ in finite separable field extensions\n   (Algebra.EtaleCover.exists_finiteSeparableField_algHom,\
  \ EtaleCover.lean:287) -- there is NO\n   general-base analogue of that cofinality;\n\
  \ * EffectivityMoving.lean:41-48 states plainly that for a merely quasi-finite (non-finite)\
  \ etale\n   cover the moving statement is FALSE, with a counterexample sketch (B\
  \ = A_u x A_v over a\n   2-dimensional normal local A with nontrivial local class\
  \ group). So the [Module.Finite A B]\n   hypothesis in the effectivity layer is\
  \ load-bearing, not convenience.\n\nSO THE OBSTRUCTION IS BASE-SHAPE, NOT ARBITRARINESS\
  \ OF THE CLASS. Two consequences:\n 1. the split to hand a prover lane is NOT \"\
  chart value (cheap) vs arbitrary section (blocked)\" but\n    \"field test with\
  \ a section (FREE) vs general sectionless affine base (OPEN)\". The delta between\n\
  \    the chart side and the coverage side is NARROWER than I priced it;\n 2. antecedent\
  \ 2 still owes a route decision -- which site coverage is local for -- because the\n\
  \    repair still refines covers and descends, and Zariski-local surjectivity still\
  \ will not absorb\n    that. The conclusion stands; cite the module-finiteness counterexample,\
  \ NOT the trivial-cover\n    claim, when repeating it.\n\nAlso corrected, same review:\
  \ I called DivisorFamilyAffThetaTyping.lean UNROOTED. It is ROOTED --\nAlgebraicJacobian.lean:346\
  \ imports it at HEAD (commit 2b8cef366) and its .olean exists, so it IS\nkernel-checked.\
  \ Another lane rooted it while I was auditing it and I did not re-run the grep before\n\
  publishing. I-0941's step (i) is therefore already done; its step (ii) stands.\n\
  \n--- the original finding follows; read its trivial-cover reasoning as retracted\
  \ ---\n\n*** RANKING AMENDMENT, second reviewer pass 2026-07-29 (run 0082 session\
  \ 0004, review-ajcr).\nANTECEDENT 2 IS NOT A GEOMETRY BILL, IT IS A SITE DECISION\
  \ -- so the #2 slot below is\nMIS-JUSTIFIED even though its position may be right.\
  \ Issue I-0920. ***\n\nThe costing below is otherwise intact and should be read\
  \ as it stands. This amendment changes ONE\nthing: the reason antecedent 2 (dat-b\
  \ B-5/B-6, local surjectivity) is expensive.\n\nBELOW IT SAYS: \"It carries the\
  \ content, and its packaging is complete ... What it owes is geometry:\nthe per-point\
  \ datum, plus the chart-parameter/threshold reconciliation.\"\n\nMEASURED, tracing\
  \ the per-point datum through its own producer chain rather than through the rows'\n\
  prose. The producer exists (exists_isChartDatumPlusFibre_of_mem_range, rooted, sorry-free),\
  \ and what\nit needs reduces to ONE hypothesis: IsPlusHonest (Pic0ChartPlusFibreProducer.lean:200).\
  \ Read as a\nstatement, that says: for every affine open U of the test, the class\
  \ restricted to U lies in the\nRANGE of relPicToPicEt -- i.e. Zariski-locally the\
  \ class comes from the UN-sheafified relPic.\n\nThat is the etale-sheafification\
  \ gap, structurally:\n * picEt is built on PicEtAff (PicEt.lean:9-21), and PicEtAff\
  \ C A (PicEtAff.lean:218) is a QUOTIENT\n   OVER ALL ETALE COVERS -- elements are\
  \ PicEtAff.mk E x;\n * PicEtAff.unit (:377), the target of relPicToPicEt (PicEtUnit.lean:126),\
  \ is mk at the TRIVIAL\n   cover `.self A` alone.\nSo honesty asserts that no nontrivial\
  \ etale cover is needed on that piece -- precisely what the\none-step plus construction\
  \ exists to permit to FAIL. The tree's only honesty mechanism agrees:\nPic0ChartHonest.lean's\
  \ own \"does not give\" says honesty holds over Spec E.Carrier and NOT over\nSpec\
  \ A, bought by CHANGING THE BASE, with \"Nothing here performs that descent\".\n\
  \nWHY THE CHART SIDE IS UNAFFECTED, which is what makes this a real distinction\
  \ rather than a blanket\npessimism: chartValue = abelDiv * sigmaFamily * (thetaFamily^m)^{-1}\
  \ (DivSchemeAbel.lean:351, read\nfrom the definition), and honesty is discharged\
  \ for each factor and closed under the group\noperations. Coverage is different\
  \ because chartsCoverLocally_of_pointwise\n(Pic0ChartCoveragePointwise.lean:128)\
  \ quantifies over EVERY s : (pic0SigmaSheaf C).1.obj (op T);\narbitrariness is the\
  \ content of coverage, and narrowing s to chart-value shape makes it circular.\n\
  \nCONSEQUENCE. Antecedent 2 splits into a cheap half and an out-of-reach half, and\
  \ the rows conflate\nthem: honesty of coverage's own WITNESS is already covered;\
  \ honesty of the class coverage must HIT\nis the gap. The repair -- refine to the\
  \ etale carrier, then descend -- changes the site from Zariski\nto etale, and pic0RepresentableByOfCharts'\
  \ antecedent is Zariski-local surjectivity. No leaf settles\nthat. It is a route\
  \ question for the human/reviewer layer, and it is the third antecedent-level\n\
  obstruction found on this seam after the unrestricted-certificate fork (antecedent\
  \ 1) and U2.\n\nNOT A REFUTATION. Proving IsPlusHonest false for an arbitrary class\
  \ needs a class not\nZariski-locally in relPic's image; this tree has no Brauer\
  \ or nontrivial-etale-class machinery to\nbuild one, and I did not build it. The\
  \ claim is the weaker sufficient one: it is not a lemma about\nthe tree's own constructions,\
  \ and a lane sent at it will not find a proof.\n\nTHE VERDICT BELOW (\"none of the\
  \ three antecedents closes this week\") is unchanged and, if anything,\nbetter supported:\
  \ the antecedent that looked closest to being a bounded geometry bill is the one\n\
  that turns out to need a decision above the leaf layer.\n\n--- the first reviewer\
  \ pass's costing follows, accurate except as amended above ---\n\n*** THE COSTING,\
  \ RE-RANKED 2026-07-29 (run 0082, review-ajcr). THE THREE ANTECEDENTS ARE NOT THREE\n\
  INDEPENDENT PRICES, AND NONE OF THEM CLOSES THIS WEEK. Read this before picking\
  \ a leaf. ***\n\nWHAT IS GENUINELY SOUND, and it is worth stating first because\
  \ it is unusual: pic0RepresentableByOfCharts\n(Picard/Pic0SigmaSheaf.lean:161) and\
  \ mixedParamRepresentableBy (Pic0ChartAtlasParamFree.lean:125) are\nsorry-free,\
  \ rooted, and honest. Given the three antecedents they WOULD produce a representing\
  \ scheme.\nThe machine is correct. Nothing feeds it.\n\nTHE THREE ANTECEDENTS DO\
  \ NOT COMPOSE AS THE ROWS IMPLY. Measured, `lake env lean` EXIT=0 (probes in\nrun\
  \ 0082 session dir /probes):\n (1) `hf` = IsChartUniv (Pic0ChartPair.lean:173) is\
  \ stated at a FREE `V : D.left.Opens`. At ι = PEmpty\n     the whole seam call elaborates\
  \ with `hf := fun i => PEmpty.elim i` -- no charts, no rep, no\n     IsChartUniv.\
  \ At V = bottom, injectivity is free (no nonempty test has a point of the empty\
  \ open).\n     So `hf` at an arbitrary V carries NO CONTENT.\n     QUALIFIED by\
  \ ajcr-p1 (I-0890), correctly: 'free at V = bottom' is true of the INJECTIVITY clause\n\
  \     and of exists_factor, and FALSE of the fibre DATUM -- its sq field at an empty\
  \ test needs\n     Subsingleton (pic0Subgroup C ..) over an empty base, which is\
  \ true, separate, and absent from the\n     tree. So the degenerate value shows\
  \ a clause is cheap without exhibiting an inhabitant: CHEAP and\n     SATISFIABLE\
  \ come apart, and several rows on this leaf have been priced by exactly that\n \
  \    conflation. The ι = PEmpty conclusion below is unaffected -- it never used\
  \ V = bottom.\n (2) The seam is nonetheless NOT vacuous: at ι = PEmpty the sup sieve\
  \ is BOTTOM, and the bottom sieve\n     is Zariski-covering only for an EMPTY test.\
  \ So ALL the content forcing the atlas to be an atlas\n     sits in the LOCAL-SURJECTIVITY\
  \ instance -- antecedent 2, not antecedent 1.\n (3) THE UNPRICED OBLIGATION, which\
  \ no row owned before this pass: coverage\n     (chartsCoverLocally_of_pointwise,\
  \ Pic0ChartCoveragePointwise.lean:128) must produce\n     `x : (W : Scheme) ⟶ X\
  \ i`, i.e. INTO `(V i : Scheme)`. So coverage must hit the SAME V at which\n   \
  \  `hf` was certified. chartLocus is an open of the TEST; V is an open of the DIVISOR\
  \ SCHEME. Zero\n     files in the tree mention both IsChartUniv and ChartsCoverLocally.\
  \ Now owned by\n     AJCR.w4-rep.datum.chart-restrict (ajcr-p1, I-0869/I-0872).\n\
  \nWORSE, AND INDEPENDENTLY CONFIRMED WITH ajcr-p1: the only non-circular producer\
  \ of `hf`,\nisChartUniv_of_isChartLocusFibre (Pic0ChartUnivReduce.lean:170), goes\
  \ THROUGH the unrestricted\ncertificate -- its body is `isOpenImmersion_presheaf_of_chartFibrePresented`\
  \ with the restriction\napplied afterwards. So IsChartLocusFibre implies IsOpenImmersion.presheaf\
  \ of the UNRESTRICTED Abel\nchart, which three headers call false (|D| is not a\
  \ point). QUALIFICATION I add: that falsity is a\nHEADER CLAIM, unproved -- isEmpty_forall_chartFibrePresented_of_not_injective\n\
  (Pic0ChartOpenImmersionCriterion.lean:219) takes non-injectivity as a HYPOTHESIS\
  \ and is never\ninstantiated. So the tree holds a reduction and its conditional\
