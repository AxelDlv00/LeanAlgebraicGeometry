summary: 'Complete. The whole-project warning count went 1,174 -> 578 -> 262 -> 162
  -> 24 across this campaign, and every surviving head is a genuine ''declaration
  uses sorry''. The final pass (commit b0d13f686) cleared the last 102 mechanical
  warnings across 14 files: nine overlapping-instance binders in AuslanderBuchsbaum
  dropped where [IsRegularLocalRing R] already implies them, eight [Fintype][DecidableEq]
  weakened to [Finite] with classical + Fintype.ofFinite, deprecated push_neg and
  Ideal.minimalPrimes_isPrime replaced, and the usual show->change, omit [Inst] in,
  unused simp arguments and line wrapping elsewhere. No declaration statement changed
  beyond those linter-directed weakenings and no sorry moved. One documented exception:
  GlueDescent''s hC1 cannot be fixed with omit (include overrides omit) without changing
  two statements, so it is suppressed for that single declaration following the convention
  already used in FreePresheafComplex and CechBridge. The per-file cleanup history
  is in the ledger; the granular child nodes have been retired.'
