summary: 'Phase 0 is a typed demand ledger, not producer movement. PointedPicSharpQuasiProjectivePieces
  packages a representation witness inside H; the two H-taking adapters only typecheck
  conditional consumption into PointedPicSharpRep and fgaPicardRepresentability. Measured
  movement: sorry-free producers +0, seam reductions +0, strict representation-witness
  binders +0. Existing IsHQuasiProjective, carried O(1), FiniteInAffine aggregation,
  Over-coproduct assembly, and CurveProjectivity stay authoritative. Section-Proj
  remains disconnected from H, and no general relative-Proj or ample theory is authorized
  without a narrower consumer. Boundary I-1822; correction I-1826.'
