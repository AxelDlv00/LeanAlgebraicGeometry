  input is the subordinate Stacks 0B8B statement supplying an affine open containing
  the finite support; the remaining work is the widened consumer migration and the
  explicitly tracked certificate/divRep seams. The landed P1 avoidance lemmas are
  auxiliary results, not the chosen architecture.'
