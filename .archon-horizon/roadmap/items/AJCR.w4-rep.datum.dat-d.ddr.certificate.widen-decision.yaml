summary: 'DECIDED BY HUMAN PROTECTION I-0492: choose R2, widening DivFamZar to arbitrary
  affine-open pieces. R1 (the GL_2/Aut(P1) twist route) is not to be built, and no
  consumer may depend on a fixed pair of P1 charts.


