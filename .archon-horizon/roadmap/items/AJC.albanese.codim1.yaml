summary: 'Extend rational maps across codimension one. SORRY-FREE (run 0069, commit
  8a5dc2a66).


  Milne Lemma 3.3 (indeterminacy_pure_codim_one_into_grpScheme, Albanese/Milne33.lean)
  is proved and axiom-clean, so Z(f) = empty for group-variety targets and extend_to_av
  (Milne Theorem 3.2) is unconditional. Albanese/CodimOneExtension.lean carries no
  sorry.


  It lives DOWNSTREAM of CodimOneExtension.lean rather than in it: the difference-map
  / pole-purity / Hauptidealsatz-transport layers (Albanese/Milne33{Rows,Diagonal,RowSection,Pullback,CMEquidim,KernelGen,Transport,TransportLocal}.lean)
  import that file, so stating the keystone there is an import cycle. Ported sorry-free
  from the sibling Rebuild tree, which had developed the chain on the identical toolchain
  and mathlib pin; every algebra prerequisite already existed in AJC. Route and both
  implementation notes are on hgraph node ca0776c343e5.


  Caveat on the axiom claim: extend_to_av is unconditional GIVEN an abelian variety.
  A fresh-context review found no axiom-clean inhabitant of the AV instance package
  in this development today (a synthesis site at A := Jacobian C reports sorryAx,
  via the Picard seam upstream). That is not a defect in this leg, but the two claims
  are different.

  '
