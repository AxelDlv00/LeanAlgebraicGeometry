summary: "DAT-J: JacobianData assembly -- quasi-compactness via the Abel image of\
  \ Div^g-lite.\n\nSTATUS 2026-07-28 (run 0071 s0008, ajcr-divrep). STEP 3 IS A COMPATIBILITY\
  \ SQUARE, NOT A\nCONSTRUCTION -- because the fibrewise half was already built, rooted,\
  \ and had zero consumers.\n\nWHAT THE PREVIOUS RE-SCOPE GOT RIGHT: DAT-J's two inputs\
  \ are visible in one signature,\nPicRepDatum.toJacobianDataOfAbelLifts -- a PicRepDatum\
  \ k k C, and a per-point lift\n  hlift : forall y, exists q : Spec kappa(y) -->\
  \ DivScheme g, q >> abel = fromSpecResidueField y.\n\nWHAT IT GOT WRONG, OR AT LEAST\
  \ LEFT UNMEASURED: it recorded step 3 as \"the LIFT itself --\ndivRep-gated\", i.e.\
  \ as geometry blocked behind U2. The morphism half is NOT gated and is NOT\nmissing.\
  \ Picard/DivisorFamilyFieldSurj.lean (ROOTED, sorry-free) already carries:\n\n \
  \ DivisorAdaptation.isCertified_of_deg (:104)\n    Over a FIELD, an adaptation whose\
  \ presentation divisor has degree n is IsCertified n. All\n    seven clauses: projectivity\
  \ and both flat-cokernel clauses are Module.Free.of_divisionRing\n    instances,\
  \ (c1) finiteness is moduleFinite_colength, and the (c2) rank clause is the\n  \
  \  UNCONDITIONAL CRT identity deg_presentationDivisor read against the degree hypothesis.\
  \ No\n    support separation -- the file records that as a deviation of record,\
  \ since full support\n    separation is unachievable when a support point lies in\
  \ both charts' overlap.\n  exists_divFam_divFamDivisor_eq (:147)\n    hence every\
  \ effective degree-g divisor over K IS the divisor of a DivFam.\n  effectiveDivisorClassifyZar\
  \ (:217), spec at (:231)\n    and it classifies: overSpec k K --> divSchemeOver.\n\
  \nTHE STRATEGIC POINT, and it is the sharp form of critical-path 7.6's own argument:\
  \ the\nDivFamZar no-go is a purely RELATIVE phenomenon (over a field a divisor's\
  \ support is finitely\nmany closed points, so IsPreconnected supportLocus is vacuous).\
  \ The certificate difficulty that\nmakes U2 hard DOES NOT EXIST FIBREWISE. Any obligation\
  \ phrased over a residue field should be\npriced against DivisorFamilyFieldSurj,\
  \ not against the relative certificate machinery.\n\nSO WHAT REMAINS OF STEP 3 IS\
  \ ONE SQUARE. effectiveDivisorClassifyZar_spec says the morphism is\ndivRepClassifyZar\
  \ of a family presenting D. It says NOTHING about abel. Joining it to hlift needs\n\
  exactly that the classification, composed with abel, is the structural morphism\
  \ of the point.\nLanded this session as an interface in Picard/JacobianDataAbelSquare.lean:\n\
  \n  IsAbelClassifyCompatible hpi g hO hchi r1 r2 b1 b2 abel      -- the square,\
  \ named\n  exists_residueField_lift_of_abelCompatible                    -- square\
  \ + effectivity => hlift\n      verbatim in the shape ofAbelLifts / toJacobianDataOfAbelLifts\
  \ consume\n\nThis is the recorded \"groups agree /= maps agree\" shape (I-0525):\
  \ a correspondence between\ndivisor classes and DivScheme-points is unusable until\
  \ the square relating the two NAMED\nmorphisms lands.\n\nDAT-J NOW OWES, exactly\
  \ three things and no construction:\n 1. IsAbelClassifyCompatible for the campaign's\
  \ Abel morphism -- bookkeeping-shaped, but a real\n    statement, and nobody has\
  \ written it;\n 2. the fibrewise effectivity input heff -- Riemann-Roch over a field.\
  \ BINDING (w4-datj 0.5):\n    spell it with exists_effective_of_picClass / riemann_inequality\
  \ (FLVClass.lean:208/205),\n    NEVER riemann_inequality_curve (ChiCurve.lean:183),\
  \ which imports Challenge.lean and would\n    create an import cycle;\n 3. a PicRepDatum\
  \ k k C from DAT-G (still divRep-gated, unchanged).\n\nDJ-0 (compact-image qc) and\
  \ DJ-2 (packaging) remain landed. JacobianData has seven producers plus\nthe two\
  \ PicRepDatum entry points; the atlas is NOT finite, so aim at an ofCharts* form.\n\
  \nCAVEAT ON THE NEW FILE: JacobianDataAbelSquare.lean was written this session and\
  \ its kernel check\nwas still in flight when the session ended under a swap-bound\
  \ box (load 70, ~0G free, zero oleans\nproduced workspace-wide for 40 minutes).\
  \ Treat it as unverified until a green check is recorded.\n"
