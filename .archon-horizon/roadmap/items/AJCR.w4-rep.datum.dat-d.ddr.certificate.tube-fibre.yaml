summary: 'REJECTED 2026-07-25 (run 0048) — SUPERSEDED, not merely refuted-as-stated.


  The goal ("put the support inside a SINGLE adaptation piece") was already refuted
  in run 0047 r6

  (not_exists_unique_support_piece, Picard/DivSchemeCertZarSep.lean:257). Run 0048
  shows the intended

  reformulation ("per-piece, for each j the fibre of the closure of the piece trace
  stays in the

  piece") is EQUIVALENT to a statement with no pieces in it at all: the chart traces

  supportLocus cap V_b must be closed in the relative curve

  (isClosed_supportLocus_inter_chart_of_forall_noLeak, Picard/DivSchemeCertZarChartTrace.lean).
  So

  there is nothing left for this leaf to own; the obligation lives in chart-avoid
  and the production

  rule in chart-trace / swallow-adapt.


  WHAT SURVIVES AND IS STILL USED: exists_away_supportLocus_subset_of_fibre_subset
  and

  forall_noLeak_of_forall_supportLocus_subset (Picard/DivSchemeCertZarTube.lean) —
  spreading one-fibre

  containment in an OPEN to a basic-open base neighbourhood, and containment-to-hnoLeak.
  They are

  consumed by swallow-adapt with U the swallowing piece.

  '
