summary: 'CLOSED 2026-07-31. The Riemann--Roch cluster is rooted and all seven children
  are done.\n\nSingle-field results: the ledger proves chi(O(D)) = 1 - genus(C) +
  deg(D), bounded H1 vanishing on a degree half-space, exact Riemann--Roch and section
  drop above a bound, global generation, and degree zero for principal divisors.\n\nExtension-uniform
  result: FixedFiberDegree.lean chooses one finite dominant C -> P1 over the ground
  field, base-changes its source coordinate datum through every field extension, transports
  H1-vanishing and the H0 kernel, and proves the fixed divisor degree invariant by
  Riemann--Roch plus genus invariance. It produces UniformBaseDivisor and UniformVanishing
  under exactly the standard proper/smooth/geometrically-irreducible curve binders.
  No rational point, finite-extension, separability, perfectness, or algebraic-closedness
  assumption is added.\n\nRoot verification: lake build AlgebraicJacobian passed 8921
  jobs. Final endpoint axiom scans contain only propext, Classical.choice, Quot.sound
  and no sorry/axiom source occurrence. Deliverables: FiberCoordinateComplex repair
  80f073ffc0; rooted fixed-degree producer c93cfea0ed.'
