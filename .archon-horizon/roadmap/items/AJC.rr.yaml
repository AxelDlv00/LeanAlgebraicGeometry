summary: 'Riemann--Roch, divisors, and the adelic genus. Cluster-P items 1 and 3 (bounded
  H1 vanishing, global generation) and exact Riemann--Roch are CLOSED at AJC''s own
  curve under three curve binders (RiemannRoch/Ledger/FiberBound.lean). Item 2, extension-uniformity,
  remains OPEN and is now precisely decomposed rather than disclaimed (Ledger/ExtensionUniformity.lean,
  r5): the FREE half is witnessed at the base-changed curve C_kappa itself, not merely
  asserted of morphism classes -- one missing instance (GeometricallyIrreducible on
  Scheme.baseChangeField) was all that blocked every curve-level statement from re-firing
  at C_kappa by synthesis. The OPEN half needs TWO inputs, not one: (a) base-field
  invariance of the genus, and (b) a kappa-independent degree bound on a vanishing
  base divisor. An earlier reading collapsed these into (a) alone via a 2g-1 threshold;
  that is Serre duality, which exists nowhere in this workspace, and the claim is
  retracted in place. Input (a) is reachable: AJCR''s H1BaseFieldInvariance.lean proves
  it sorry-free and the base-change carriers agree by rfl (verified at AJC''s spelling
  with a negative control), but the cover carriers differ (AffineTwoCover vs AffineCoverMVSquare)
  so the port crosses a second boundary. AJC owns both SIDES of the genus comparison
  on transported covers and lacks the comparison map itself -- the termwise base change
  Gamma(C,V) tensor kappa = Gamma(C_kappa,V_kappa). Input (b) is genuinely open in
  both projects.'
