id: AJCR.w4-rep.datum.dat-d.ddr.certificate.field-size
title: 'Field-size: over a small finite field, what is DivFamZar? — the one remaining
  human decision'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: "THE ONE QUESTION THAT STILL NEEDS A HUMAN (2026-07-25, run 0048 r1). It\
  \ is NOT \"does the\nZ(diamond) chart confine its divisors\" — that is answered,\
  \ NO (see chart-avoid). It is:\n\n  OVER A SMALL FINITE FIELD, WHERE |P^1(k)| =\
  \ q + 1 < n + 2, WHAT IS DivFamZar SUPPOSED TO BE?\n\nWHY THE QUESTION IS FORCED.\
  \ Certifiability requires the support to sit inside the preimages of a\npinned PAIR\
  \ of points of P^1 (chart-avoid + confine-open). Every repair therefore needs, at\
  \ every\nbase point, two k-rational points of P^1 off pi(supp_s) — i.e. q + 1 >=\
  \ n + 2. And the\ncounterexample that kills chart-avoidance is FIELD-INDEPENDENT:\
  \ F = s X_0^2 + X_0 X_1 + s X_1^2\nis irreducible over F_2 exactly as over Q, because\
  \ s(x^2+1) + x is degree 1 in s with coprime\ncoefficients over any field. So enlarging\
  \ the field is not an escape and small fields are a real\nhole, not a footnote.\n\
  \nWHAT MAKES IT A HUMAN DECISION. Challenge.lean:96-99 states the Jacobian over\
  \ an ARBITRARY field,\nand there is no hypothesis on k stronger than [Field k] anywhere\
  \ in Picard/ or RiemannRoch/ (510\noccurrences of Field k; zero Infinite / IsAlgClosed\
  \ / PerfectField). The three options are not\ncomparable on mathematical grounds\
  \ alone:\n (a) accept |P^1(k)| >= n + 2 as a hypothesis, and RECORD that Challenge.lean:96-99\
  \ is then\n     unreachable for small q — i.e. the challenge as stated is not solved;\n\
  \ (b) plan a descent lane: divQProj (Picard/DivSchemeQProj.lean) is the right lever\
  \ for fpqc\n     descent from k'/k, so the Jacobian over k is obtained by descending\
  \ from a big enough k';\n (c) generalize the pinned charts from k-rational points\
  \ to closed points of degree d >= 2. This\n     costs the two facts the whole design\
  \ rests on — Gamma(P1 k, chartOpen k i) iso Polynomial k\n     (Curve/P1Charts.lean:234,239)\
  \ and isPrincipalIdealRing_chartSections (Curve/P1Points.lean:64)\n     — because\
  \ Cl(P^1 minus a degree-d point) = Z/d, not 0.\n\nSETTLE THIS BEFORE p1-aut. It\
  \ decides whether building the GL_2(k) action on P^1 is worth doing\nat all: under\
  \ (b) or (c) the twist may be unnecessary or insufficient.\n"
