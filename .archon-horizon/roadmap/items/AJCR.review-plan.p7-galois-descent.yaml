id: AJCR.review-plan.p7-galois-descent
title: 'Phase 7: finite-Galois descent to the original field'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
- Algebraic-Jacobian-Challenge
summary: Finite-stage affine glue, generic finite-Galois scheme descent, conditional
  representability descent, and conditional PicRepDatum/JacobianData packaging are
  present but do not close an acceptance edge. Commits 7fabbbdedd and 340206c19e add
  a pinned universal class on every finite atlas chart/overlap and a clean common
  finite-subextension theorem for finite dependent relPic families; both audit to
  [propext, Classical.choice, Quot.sound]. At ledger HEAD 16b35b635b, narrow native
  compilation has artifacts for GlueDataFace, GlueDataAssembly, and (from the active
  continuation) Pic0FiniteStageTransitionModels, while the source-rooted critical cone
  still lacks GluePackage, top PreSnd, OverlapIsoSnd, and GluedComparison artifacts. The
  active 0149 continuation has no newer committed source delta. Binder-free
  RepresentableBy P.gluedOver and exact-carrier projectivity/orbit-affineness remain blockers.
status: blocked
