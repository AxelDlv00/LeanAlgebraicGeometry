summary: "CORRECTED 2026-07-25 AFTER REVIEW (work-reviewer, I-0340). The original\
  \ claim on this leaf — that\n(c2)/(c3)/(c4) become FREE for a swallow-or-miss adaptation\
  \ — is WRONG, and the reason is worth\nknowing before anyone re-derives it.\n\n\
  WHY \"FREE\" IS FALSE. `A.toOvlLeft i i = A.toOvlRight i i` holds by `rfl` (proof\
  \ irrelevance makes\ninf_le_left and inf_le_right the same proof at pieces i inf\
  \ pieces i), so EVERY DIAGONAL COMPONENT of\ndeltaLeft - deltaRight is identically\
  \ zero, for every adaptation. Hence coker(delta) always retains\nprod_i ovlColength\
  \ i i iso prod_i colength i as a direct factor, and therefore\n\n  clause (c4) \
  \ ==>  Module.Flat R (A.colength i) for every i.\n\n(c4) can never be discharged\
  \ without flatness of the colengths. The off-diagonal image is the\nANTI-DIAGONAL\
  \ {(c, -c)}, not the whole off-diagonal block, so one copy of the overlap colength\n\
  survives in the cokernel too.\n\nTHE CORRECT, STILL-VALUABLE CLAIM. For a swallow-or-miss\
  \ adaptation the surviving factors are\nexactly: the colengths themselves, and one\
  \ leftover overlap colength isomorphic to them. All are\nfinite PROJECTIVE by (c1)\
  \ once the fibrewise-regularity input is supplied\n(projective_colength_of_forall_tmul_residueField),\
  \ hence flat. So\n\n  (c2)/(c3)/(c4) REDUCE TO (c1)-projectivity plus the constant-rank/degree\
  \ input hdeg.\n\nThat is a genuine reduction — it removes the relative-flatness-over-a-nonreduced-base\
  \ content that\naway-kerspan was stuck on — but it is a reduction, not a retirement.\
  \ away-kerspan stays blocked\nrather than rejected for exactly this reason.\n\n\
  THE ONE TECHNICAL LEMMA STILL NEEDED (unchanged): colength is invariant under shrinking\
  \ a piece to a\nsmaller open that still contains the trace, so the colength and\
  \ overlap-colength modules of the\nswallowing pieces are identified. Ring-level\
  \ core: if V(g) cap V(h) = empty then h is a UNIT mod (g)\n(1 lies in span{g,h}),\
  \ so Gamma(V)/(g) iso Gamma(V)_h/(g) = Gamma(D(h))/(g) via\nIsAffineOpen.isLocalization_basicOpen.\
  \ Watch the Opens-level `inf` bookkeeping — pieces i inf pieces j\nis not syntactically\
  \ symmetric in i and j.\n"
