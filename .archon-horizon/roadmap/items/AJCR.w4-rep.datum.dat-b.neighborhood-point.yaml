summary: 'OPEN after COVER-THRESHOLD. exists_uniform_admissibleCoverageChart_eq_univ
  gives one fixed legal (m,Z) whose unrestricted chart locus contains every fibre
  point of every pic^0 class. That membership alone does not instantiate the representability
  atlas. For every T, class s, and t, this row must produce an open W containing t,
  the corresponding restricted chart open V, and x : (W : Scheme) -> (V : Scheme),
  with the mixedParamChart value of x equal to s restricted to W; V must be the same
  open carrying RestrictedChartFibre/IsChartUniv. This is exactly the input shape
  of chartsCoverLocally_of_pointwise. A map only W -> D.left, or a lift through unrestricted
  abelSigmaChart, is insufficient because antecedent 1 fails there. The parameter
  is admissibleCoverageParameter and joins pic-d''s arbitrary-parameter representability
  route; the V-coupling joins chart-restrict.'
