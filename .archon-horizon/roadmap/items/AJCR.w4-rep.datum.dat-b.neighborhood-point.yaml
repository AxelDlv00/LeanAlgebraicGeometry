  high-parameter vanishing/coverage from the genus-parameter h0=1 uniqueness route,
  but does NOT refute a high-parameter same-V local lift. Honest next routes are relative
  spreading inside the high-parameter restricted chart, or a genus-parameter multi-index
  atlas. The parameter still joins pic-d arbitrary-parameter representability; the
  same-V condition joins chart-restrict.'
