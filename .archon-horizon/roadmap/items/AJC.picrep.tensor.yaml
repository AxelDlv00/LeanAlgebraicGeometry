summary: 'RE-MEASURED 2026-07-31 (pic-b, run 0099). This row has two clauses. The
  pullback comparison clause is closed; the affine tensor-section clause now has its
  algebraic localization layer but still lacks the geometric sheafification/basic-open
  identification.


  CLAUSE 1 -- DONE, SORRY-FREE, NO EXTRA GATE. `Scheme.Modules.pullbackTensorIsoOfLocallyTrivial`
  proves the two-sided locally-trivial comparison. The one-sided API is now unconditional:
  `pullbackTensorMap_isIso_of_right_unit` produces the right-unit comparison for arbitrary
  first factor, `pullbackTensorMap_isIso_of_right_locallyTrivial` transports along
  a displayed `Q ≅ O`, and `pullbackTensorIsoOfRightLocallyTrivial` packages the result.
  The stale `PullbackTensorRightUnit` class was deleted. These declarations are consumed
  throughout `Picard/RelPicFunctor.lean` and by `QuotFunctorDef.lean`. Landed in `8f237dfef9`;
  the attribution record is I-1741.


  CLAUSE 2 -- ALGEBRAIC LAYER DONE. `TensorSectionFormula.lean` now provides:


  * `localizedTensorProductEquiv`: `S⁻¹(M ⊗_R N) ≃ M_S ⊗_R N_S`;

  * `localizedTensorProductBaseChangeEquiv`: the exact target `M_S ⊗_{Localization
  S} N_S`;

  * named pure-tensor formulas for both equivalences;

  * `localizedTensorProductMap`: for any localization algebra `A` and arbitrary localized
  maps `f : M → M''`, `g : N → N''`, the canonical map `M ⊗_R N → M'' ⊗_A N''`;

  * `isLocalizedModule_localizedTensorProductMap`: that map is itself an `S`-localization
  whenever `f` and `g` are, with no additional hypothesis.


  The algebraic units are `962a43ff74`, `12e4f87420`, `6d082cdbe8`, and `995899019e`.
  All exposed declarations are axiom-clean modulo `propext`, `Classical.choice`, and
  `Quot.sound`.


  CLAUSE 2 -- GEOMETRIC LAYER OPEN. For quasi-coherent `A B : X.Modules`, identify
  the restriction map of `tensorPresheaf A B` from an affine `V` to `D(f)` with `localizedTensorProductMap`
  applied to the two section restrictions. Then use the basic-open tilde/sheafification
  engine to prove `tensorSectionHom A B V` is an isomorphism and obtain the `IsQuasicoherent
  (tensorObj A B)` instance through `isQuasicoherent_of_isLocalizedModule_basicOpen`.
  The algebraic target now exactly matches `Γ(X,V) → Γ(X,D(f))`; the remaining work
  is restriction coherence and sheafification, not localization algebra.


  This row supplies pullback/tensor infrastructure used by Picard and Hilbert/base-change
  consumers. It is not the missing producer for the FGA `rep` antecedent: `fgaPicardRepresentability`
  remains open elsewhere, so keep this row active and do not report Pic representability
  closed from these commits alone.

  '
