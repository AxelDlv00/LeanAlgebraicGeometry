summary: 'RE-MEASURED 2026-08-01 (pic-b, run 0099). Clause 1 remains closed: pullback-tensor
  comparison for locally trivial factors is sorry-free and has no extra gate (8f237dfef9
  and earlier pinned units).


  Clause 2 has advanced through both the algebraic basic-open and pointwise geometric
  layers, with no added hypotheses. TensorSectionFormula now proves isLocalizedModule_tensorPresheaf_basicOpen:
  for quasi-coherent A and B, the actual restriction tensorPresheaf(A,B)(U) -> tensorPresheaf(A,B)(D(f))
  is localization at powers f (53b7dede8b). TensorStalkLocalization proves the generic
  isLocalizedModule_presheafGermLinearMap and specializes it as isLocalizedModule_tensorPresheafGermLinearMap:
  on every affine U and x in U, tensor-presheaf affine sections -> its stalk is localization
  at the prime complement of x (d0b6224e7f). The same module records sheafificationUnit_stalk_isIso,
  so the tensor presheaf and tensorObj have canonically isomorphic stalks. All new
  declarations are axiom-clean modulo propext, Classical.choice, and Quot.sound.


  The remaining honest geometric step is global rather than pointwise: use localization
  uniqueness to compare the tensor-presheaf stalk localization with the tilde model,
  then patch/reflect the stalkwise comparison to prove IsIso (tensorSectionHom A B
  U) for affine U. That yields tensorObj quasi-coherence through isQuasicoherent_of_isLocalizedModule_basicOpen
  and feeds Pic-F residue-field/D2 evaluation identifications. Keep this row active:
  these are real producers used by Picard/D2, but they do not by themselves discharge
  the separate FGA rep antecedent.'
