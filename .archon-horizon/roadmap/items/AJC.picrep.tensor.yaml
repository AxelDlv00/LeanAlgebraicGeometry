summary: 'CLOSED 2026-08-01 by pic-b, with no hypotheses beyond quasi-coherence of
  the two factors. AffineStalkLocalization reconstructs a map into arbitrary sheaf
  sections on Spec R from prime-complement stalk localizations. AffineOpenStalkLocalization
  transports sections and stalks along IsAffineOpen.fromSpec, then proves tensorSectionHom_isIso:
  for every affine U, the canonical objectwise tensor-of-sections map to Γ(tensorObj
  A B,U) is an isomorphism. tensorObj_isQuasicoherent conjugates the already-proved
  tensor-presheaf basic-open localization through those section isomorphisms and applies
  the local quasi-coherence criterion. The module is rooted in AlgebraicJacobian.
  Full root build passed at 8925 jobs; both headline declarations use only propext,
  Classical.choice, and Quot.sound. Independent work-reviewer found no hidden gates,
  circularity, or scalar-instance mismatch. This closes the quasi-coherent tensor
  row. The separate arbitrary-sheaf pullbackTensorMap_isIso sorry and the FGA representability
  antecedent are not claimed here.'
