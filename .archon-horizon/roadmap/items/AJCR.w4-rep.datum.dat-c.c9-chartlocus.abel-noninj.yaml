id: AJCR.w4-rep.datum.dat-c.c9-chartlocus.abel-noninj
title: 'ABEL-NONINJ: is the unrestricted Abel chart a monomorphism? The fork that
  decides whether isChartUniv_of_isChartLocusFibre can ever fire'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'ABEL-NONINJ: THE FORK IS Mono D.hom. ADVANCED, NO SEAM ANTECEDENT CLOSED
  (pic-c, run 0092 r1).


  Picard/Pic0ChartSubsingletonCollapse.lean, rooted, sorry-free, build 8922 jobs,
  7 keystones axiom-clean vs Jacobian firing sorryAx.


  THE ANSWER, and it is far cheaper than the question looked. injective_abelSigmaChart_of_mono:
  the unrestricted Abel chart is injective on EVERY test as soon as Mono D.hom, in
  two lines, at ARBITRARY n, with no subsingleton, no divisor, no certificate. The
  Sigma-component of the chart at u is u >> D.hom, so cancel_mono is the entire proof.
  So the fork -- asserted by three headers and proved by nothing -- reduces to whether
  the representing object''s structure morphism is a monomorphism. A subsingleton-valued
  divFunctor is one sufficient condition (mono_hom_of_divFunctorObjSubsingleton places
  it STRICTLY BELOW Mono D.hom), and divFunctorObjSubsingleton_of_forall_ring bridges
  from the affine-ring form pic-g''s deg-zero row produces, using none of the curve
  geometry.


  WHAT IT BUYS THE SEAM. At a Mono parameter not_restrictedChartFibre_top_of_not_injective
  cannot fire (it CONSUMES non-injectivity), coverage dies at every proper V, bot
  is refuted, and by restrictedChartFibre_top_iff the hypothesis at top IS the unrestricted
  certificate. pic0RepresentableBy_of_isChartLocusFibre_of_coverage states the representation
  with NO V and NO containment in its hypothesis list, at arbitrary iota. So the V-coupling
  is IDLE there -- the restriction apparatus has no interior to work in.


  NOT CLOSED, and these are proved limits rather than hedges. Nothing exhibits an
  inhabitant of the (huniv, hcov) pair at ANY V, top included; elimination is not
  survival. And not_mem_chartLocus_of_two_le_genus_zero_param: at n = 0 with genus
  >= 2 the chart LOCUS is empty (pic-h''s h0 = n+1-g), so the locus-mediated route
  to the coverage half is dead at the one parameter where the subsingleton is landed.
  That is NOT a refutation of hcov, which never mentions the locus -- that stronger
  statement is open.


  A fresh-context audit refuted my first headline (I had priced the subsingleton as
  the content) and four supporting claims, including a sentence an imported file had
  already retracted and a limit stated stronger than its own theorem. All five repaired
  in a9895276bf; see the file header, which records each error rather than quietly
  fixing it.'
