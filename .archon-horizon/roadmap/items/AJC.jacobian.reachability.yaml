id: AJC.jacobian.reachability
title: Wire the headline to the infrastructure
projects:
- Algebraic-Jacobian-Challenge
summary: "The headline rests on the infrastructure it claims, and every number here\
  \ is measured rather than asserted. picardJacobianWitness is built from Scheme.Pic0Scheme,\
  \ so 98 of the project's modules are reachable from Jacobian.lean rather than the\
  \ 8 of the Genus-only import; the 98th arrived when leaf C was stated against the\
  \ landed Albanese universal property, which put the Albanese cone under the headline\
  \ for the first time.\n\nEVERY MODULE ON DISK IS ROOTED at AlgebraicJacobian.lean\
  \ -- 185 of 185 as of 2026-07-28, no exceptions -- which matters because an unrooted\
  \ module compiles green and is invisible BOTH to the root build and to the axiom\
  \ probe: #print axioms on its declarations cannot even be written against the root\
  \ import. The standing check is in the probe header and in I-0388. A module not\
  \ yet committed to the ledger must NOT be rooted (a clean checkout would fail);\
  \ that grace period ends at the commit.\n\nTHE OBLIGATION COUNT IS FIVE over a general\
  \ base field, and FOUR over an algebraically closed one. Pic0.smooth and Pic0.proper\
  \ are sorry-bodied upstream; three leaves are stated at the headline. Each leaf's\
  \ distance to the landed tree is now COMPILER-CHECKED rather than described, by\
  \ a companion theorem stated at the headline:\n\n  leaf A (rational point) -- FALSE\
  \ over a general k, so it must be REPLACED, not proved. Over an algebraically closed\
  \ field it is a THEOREM: hasRationalPoint_of_curve_of_isAlgClosed is axiom-clean\
  \ via Albanese.hasRationalPoint_of_isAlgClosed, and picardJacobianWitnessOfIsAlgClosed\
  \ assembles the witness over k-bar without it. This bounds I-0372's decision without\
  \ choosing a branch: what is undecided is what the project claims over an ARBITRARY\
  \ base field.\n  leaf B -- owes Pic0.smooth plus the passage from a tangent-space\
  \ dimension to Mathlib's presentation-based SmoothOfRelativeDimension; the dimension\
  \ count itself is landed (finrank_tangentSpace_pic0_eq_genus proves dim T_e Pic0\
  \ = genus C with no transport).\n  leaf C -- one basepoint condition plus two generalizations\
  \ away (isAlbanese_pic0_of_isAlgClosed proves the algebraically closed positive-genus\
  \ case).\n\nWHY THE KIND OF OBLIGATION MATTERS AND CANNOT BE READ OFF THE PROBE:\
  \ four of the five are unproved TRUE statements; leaf A over a general field is\
  \ FALSE, so the general witness rests on an inconsistent hypothesis and its consequences\
  \ are vacuously true. Both states report exactly the same sorryAx, so the distinction\
  \ has to be exhibited by a discharge rather than measured. That is why the alg-closed\
  \ witness is a separate definition.\n\nREPRODUCIBLE and independently re-measured\
  \ 2026-07-28 THROUGH THE ROOT PATH with lake build AlgebraicJacobian green at 8744\
  \ jobs: scripts/axiom-frontier.lean, 107 declarations, 70 clean and 37 carrying\
  \ sorryAx (the two new alg-closed lines take it to 109 probed); 26 sorry carriers\
  \ over 11 modules, matching the enumeration published in the probe's section 2 exactly\
  \ -- of those 26, exactly TWO are instances (instHasPicScheme, pullback_preservesFiniteLimits)\
  \ and therefore the only two reachable without being named; 98 modules reachable\
  \ from the headline of 185 on disk, zero unrooted. Count by output ENTRY, not by\
  \ line -- Lean wraps long axiom lists, and the naive per-line filter misclassifies\
  \ exactly the declarations whose lists are longest. Two earlier revisions of this\
  \ summary published 24 rather than 26; the build says 26 and the probe carries the\
  \ regenerating command so the number is checkable rather than asserted.\n"
