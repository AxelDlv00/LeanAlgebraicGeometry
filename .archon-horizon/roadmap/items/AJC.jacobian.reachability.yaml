id: AJC.jacobian.reachability
title: Wire the headline to the infrastructure
projects:
- Algebraic-Jacobian-Challenge
summary: 'The headline rests on the infrastructure it claims, and every number here
  is measured rather than asserted. picardJacobianWitness is built from Scheme.Pic0Scheme,
  so 98 of the project''s modules are reachable from Jacobian.lean rather than the
  8 of the Genus-only import; the 98th arrived when leaf C was stated against the
  landed Albanese universal property, which put the Albanese cone under the headline
  for the first time.  EVERY MODULE ON DISK IS ROOTED at AlgebraicJacobian.lean --
  185 of 185 as of 2026-07-28, no exceptions -- which matters because an unrooted
  module compiles green and is invisible BOTH to the root build and to the axiom probe:
  #print axioms on its declarations cannot even be written against the root import.
  The standing check is in the probe header and in I-0388. A module not yet committed
  to the ledger must NOT be rooted (a clean checkout would fail); that grace period
  ends at the commit.  THE OBLIGATION COUNT IS FIVE, not three: Pic0.smooth and Pic0.proper
  are sorry-bodied upstream, and three leaves are stated at the headline. Their distances
  to the landed tree are unequal and now COMPILER-CHECKED rather than described, each
  by a companion theorem stated at the headline: leaf A is FALSE as stated and must
  be replaced, not proved; leaf B owes Pic0.smooth plus the passage from a tangent-space
  dimension to Mathlib''s presentation-based SmoothOfRelativeDimension, since the
  dimension count itself is landed (finrank_tangentSpace_pic0_eq_genus proves dim
  T_e Pic0 = genus C with no transport); leaf C is one basepoint condition plus two
  generalizations away (isAlbanese_pic0_of_isAlgClosed proves the algebraically closed
  positive-genus case).  REPRODUCIBLE and re-measured 2026-07-28 THROUGH THE ROOT
  PATH with lake build AlgebraicJacobian green at 8744 jobs: scripts/axiom-frontier.lean,
  107 declarations, 70 clean and 37 carrying sorryAx; 26 sorry carriers over 11 modules,
  matching the enumeration published in the probe''s section 2 exactly; 98 modules
  reachable from the headline of 185 on disk, zero unrooted. With the two reachability
  measurements in its header. Count by output ENTRY, not by line -- Lean wraps long
  axiom lists, and the naive per-line filter misclassifies exactly the declarations
  whose lists are longest. Section 2 now also carries the EXHAUSTIVE sorry-carrier
  list: 24 sorry-bodied declarations, of which exactly two are instances (instHasPicScheme,
  pullback_preservesFiniteLimits) and therefore the only two reachable without being
  named.'
