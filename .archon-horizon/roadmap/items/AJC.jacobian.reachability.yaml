id: AJC.jacobian.reachability
title: Wire the headline to the infrastructure
projects:
- Algebraic-Jacobian-Challenge
summary: 'The headline rests on the infrastructure it claims. picardJacobianWitness
  is built from Scheme.Pic0Scheme, so 97 of the project''s 173 modules are reachable
  from Jacobian.lean rather than the 8 of the Genus-only import. Every module on disk
  is now rooted at AlgebraicJacobian.lean, which matters because an unrooted module
  compiles green and is invisible both to the root build and to the axiom probe.


  The obligation count is five, not three, and that is now stated wherever the witness
  is described: Pic0.smooth and Pic0.proper are sorry-bodied upstream, and three leaves
  are stated at the headline. Reproducible with scripts/axiom-frontier.lean (61 declarations,
  ~8s warm) and the two reachability measurements in its header.'
