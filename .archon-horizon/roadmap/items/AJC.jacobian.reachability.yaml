summary: "Wire the headline to the infrastructure, and publish the true axiom frontier.\n\
  \nHEADLINE WIRING: DONE (run 0054, commit c7e7f5acc). picardJacobianWitness was\
  \ a bare sorry in a file whose only project import was Genus.lean, so its transitive\
  \ closure was 8 modules and nothing in the Picard/cohomology/Riemann-Roch/Albanese\
  \ development was reachable from it. It is now built from Scheme.Pic0Scheme C, with\
  \ four of six witness fields supplied directly by Picard/Pic0AbelianVariety.lean\
  \ (grpObj, proper, smooth, geometricallyIrreducible). Reachability 8 -> 96 modules.\
  \ lake build of Jacobian + AbelJacobi green (8654 jobs).\n\nREMAINING, now three\
  \ named leaves in Jacobian.lean rather than one opaque sorry, each pinned at the\
  \ strength the assembly consumes:\n - hasRationalPoint_and_geometricallyIntegral:\
  \ geometric integrality needs only Smooth => GeometricallyReduced, absent from mathlib\
  \ v4.31 but PROVED in the sibling AJCR (Curve/GeometricallyReduced.lean, mathlib-generality,\
  \ upstreaming candidate) -- a portable brick. The k-rational point does NOT follow\
  \ from the challenge hypotheses; this is where the I-0372 decision lands.\n - smoothOfRelativeDimension_genus_pic0:\
  \ Pic0.smooth gives bare smoothness; the witness needs relative dimension genus\
  \ C. Verified nothing upstream supplies the refinement.\n - isAlbanese_pic0: Albanese.Pic0.albanese_universal_property\
  \ covers only the algebraically closed, positive-genus case; the witness needs arbitrary\
  \ k and every marked point, genus 0 included (Mumford section 4 rigidity).\n\nAXIOM\
  \ FRONTIER: published and reproducible at scripts/axiom-frontier.lean (lake env\
  \ lean, ~12s warm, 51 declarations). The substantive finding is that 'axiom-clean'\
  \ was being claimed for theorems that merely QUANTIFY over a sorry-bodied gate:\
  \ Pic0.geometricallyIrreducible, Pic0.isSeparated and Pic0.locallyOfFiniteType report\
  \ clean axioms as stated, but pick up sorryAx as soon as a call site must synthesise\
  \ HasPicScheme, whose sole producer instHasPicScheme is sorry-bodied. Three leakProbe_*\
  \ declarations force that synthesis so the leak is measured, not inferred. Same\
  \ for pullback_preservesFiniteLimits, which taints PreservesFiniteLimits for flat\
  \ pullback even along an identity. Genuinely clean, measured: the whole adelic genus\
  \ lane (Adelic.instModuleFiniteHModuleOne, chi_unit_eq_one_sub_genus, h1_unit_eq_genus,\
  \ hModuleOneEquivH1Cok_curve), degree-1 affine vanishing, and cech_computes_higherDirectImage."
