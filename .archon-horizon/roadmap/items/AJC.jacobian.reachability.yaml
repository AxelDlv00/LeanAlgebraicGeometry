id: AJC.jacobian.reachability
title: Wire the headline to the infrastructure
projects:
- Algebraic-Jacobian-Challenge
summary: 'The headline rests on the infrastructure it claims, and the claim is measured
  rather than asserted. picardJacobianWitness is built from Scheme.Pic0Scheme, so
  98 of the project''s modules are reachable from Jacobian.lean rather than the 8
  of the Genus-only import; the 98th arrived when leaf C was stated against the landed
  Albanese universal property, which put the Albanese cone under the headline for
  the first time (previously the two were disjoint).  EVERY MODULE ON DISK IS ROOTED
  at AlgebraicJacobian.lean, which matters because an unrooted module compiles green
  and is invisible BOTH to the root build and to the axiom probe -- #print axioms
  on its declarations cannot even be written against the root import. 184 on disk,
  183 rooted as of 2026-07-27; the single exception is another team''s untracked mid-flight
  file, and rooting an untracked module would break a clean checkout. The standing
  check is in the probe header and in I-0388.  THE OBLIGATION COUNT IS FIVE, not three:
  Pic0.smooth and Pic0.proper are sorry-bodied upstream, and three leaves are stated
  at the headline. Their distances to the landed tree are unequal and now known: leaf
  C is one basepoint condition plus two generalizations away from a landed theorem
  (isAlbanese_pic0_of_isAlgClosed proves the case, so the distance is compiler-checked);
  leaf A is FALSE as stated and must be replaced, not proved; leaf B presupposes Pic0.smooth,
  so it rests on an obligation rather than reducing one.  REPRODUCIBLE: scripts/axiom-frontier.lean,
  95 declarations, 59 clean and 36 carrying sorryAx, with the two reachability measurements
  in its header. Count by output ENTRY, not by line -- Lean wraps long axiom lists,
  and the naive per-line filter misclassifies exactly the declarations whose lists
  are longest.'
