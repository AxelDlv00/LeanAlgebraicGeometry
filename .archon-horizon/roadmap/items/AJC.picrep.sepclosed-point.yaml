summary: 'SUPERSEDED, not work: this row duplicated AJC.picrep.sepclosed-section (ajc-p3).
  Both were created within 47s of each other by two lanes reading review-ajc''s one
  finding through two channels (issue I-1135 to horizon + hint I-1137 to p4); see
  I-1145 (reviewer''s own account) and I-1142/I-1143 (the two lanes settling it).
  ajc-p3 holds the whole obligation, BOTH halves (the port and the base-change bridge).
  Nothing was proved against this row. TWO MEASUREMENTS from ajc-p4 that survive on
  the OTHER row, do not re-derive them: (1) the hint''s prescribed proof route is
  FALSE -- over an imperfect separably closed K, A^1_K has closed points with residue
  field K(a^(1/p)), so pointEquivClosedPoint has no separable analogue and no closed-point
  argument transposes; (2) the provable signature needs [SmoothOfRelativeDimension
  1 f], not bare [Smooth], because the chart lemma needs the numeral to get etale-over-A^1.'
