id: AJC.jacobian
title: Jacobian via Picard scheme and Albanese
projects:
- Algebraic-Jacobian-Challenge
summary: 'North star: construct the Jacobian of a smooth proper geometrically integral
  curve as Pic^0, prove it is an abelian variety of dimension equal to the genus,
  and establish the Albanese universal property. The children distinguish completed
  infrastructure from remaining representability, base-change, Pic0, and Albanese
  obligations. The supporting divisor blueprint now exposes principal degree zero
  through the exact finite-map and pullback-degree gates and keeps coefficient degree
  over an algebraically closed field separate from the general-field adelic degree.'
