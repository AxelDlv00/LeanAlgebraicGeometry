  references, zero multiply-defined labels, zero renderer errors. Printable debt is
  747 overfull boxes and 100 missing-glyph notices. The hgraph resyncs clean against
  blueprint AND Lean -- note that syncing with --blueprint alone leaves the Lean side
  empty and emits thousands of bogus pin warnings; the real count is 33 classified
  unresolved pins, all pre-existing.


  Open work: residual journal cleanup, those 33 pins, and the printable debt.'
