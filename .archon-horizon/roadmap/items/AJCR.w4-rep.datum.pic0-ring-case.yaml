title: The pic0 vanishing at a general test RING, via the landed datum rigid engine
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'RE-SPELLED AND SUBSTRATE BUILT; THE OBLIGATION DID NOT SHRINK (pic-c). Owner:
  pic-c (live, run 0106 r2); the active plus-to-Cech/Laurent comparison work is a
  supporting route, not a closed gate.


  At genus zero, hvan and the fibrewise rigidity predicate are equivalent spellings.
  The rigid engine and the unit-equation lemma are genuine, sorry-free infrastructure,
  but hrigAff still has no producer over a general non-field test algebra. Field-point
  separation does not imply the affine statement.


  The zero ring is not an unchecked refutation site: its antecedent is vacuous and
  PicEtAff.subsingleton_of_subsingleton proves the conclusion there. It is therefore
  only a vacuous non-counterexample; inhabitability on nonempty spectra remains open.


  The remaining bridge is a real degree-zero/triviality producer for arbitrary test
  rings (or the needed cohomology-and-base-change theorem), not a repricing of the
  degree condition. Do not read the supporting Cech/Laurent work as a RepresentableBy
  producer.

  '
