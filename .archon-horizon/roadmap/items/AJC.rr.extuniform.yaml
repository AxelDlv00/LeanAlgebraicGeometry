id: AJC.rr.extuniform
title: 'Extension-uniform H1 vanishing: one threshold serving every field extension'
projects:
- Algebraic-Jacobian-Challenge
summary: 'MAJOR PROGRESS 2026-07-31 (pic-b, run 0093 r4), with no new hypotheses.


  CLOSED: the stabilization-index obstruction. FiberLattice.fiberLattice_stable proves
  that one plateau propagates. Quantitative quotient stabilization therefore reaches
  the top by the initial quotient dimension, giving H1(O(D + h1(O(D))*F)) = 0. At
  D=0 this produces the explicit base divisor h1(O)*F, and on every base-changed challenge
  curve GenusFieldInvariance.subsingleton_genus_smul_fiber_perFieldFiniteMapToP1_curve
  exposes the witness exactly as genus(C)*F_pi_kappa.


  CLOSED: choosing one map before the extension. MapToP1FieldBaseChange.fixedFiniteMapToP1
  chooses one finite dominant C -> P1(k), and fixedFiniteMapToP1BaseChange constructs
  its cartesian base change over every kappa. Finiteness and surjectivity, hence dominance,
  are proved after base change.


  OPEN, exact: transport the fixed map source-side two-chart coordinate datum along
  baseChangeFieldFst and prove invariance of the resulting fiber-divisor degree. The
  preferred route is local section equivalences plus two-term kernel base change;
  no full isomorphism between the pullback target and the separate Ledger P1(kappa)
  model is required. Once deg_kappa(D_kappa) = deg_k(D) for D = genus(C)*F, take d
  := deg_k(D) to produce UniformBaseDivisor C d and then uniform H1 vanishing.


  DO NOT CITE the previous n0(kappa) or strictness gap: both are now closed. Remaining
  variable: deg_kappa(F) only.


  Verification: lake builds through GenusFieldInvariance (8702 jobs); all new declarations
  have only propext, Classical.choice, Quot.sound and no sorryAx.'
