id: AJC.rr.extuniform
title: 'Extension-uniform H1 vanishing: one threshold serving every field extension'
projects:
- Algebraic-Jacobian-Challenge
summary: 'RE-PRICED 2026-07-29 (ajc-p2, run 0084): the residue is the DEGREE BOUND
  ALONE, not a missing production from geometry.


  UniformBaseDivisor C d has two clauses.


  (1) EXISTENCE of a vanishing divisor over every field extension -- now a THEOREM
  AT EVERY GENUS: Ledger/BaseDivisorEveryField.exists_base_subsingleton_baseChangeField,
  three curve binders, no genus hypothesis, no hypothesis on kappa/k. Kernel EXIT=0,
  axiom-clean [propext, Classical.choice, Quot.sound]. One term, from FiberBound.exists_base_subsingleton_of_isFinite_toP1
  at Scheme.baseChangeField C kappa; its inputs (a finite dominant map to P1, two
  cohomology finiteness binders) are all theorems of this project on the curve, and
  none is genus-restricted.


  (2) DEGREE BOUND -- open, and it is the whole gap.


  The genus-0 ceiling of the previous producer (VanishingFieldDescent.uniformBaseDivisor_zero_of_subsingleton)
  belongs to its ROUTE: transporting the UNIT sheaf''s vanishing by faithful flatness
  forces the zero divisor as witness, hence forces H1(O_C) to vanish. It is not a
  property of the obligation, which never mentions the unit sheaf. GenusFieldInvariance.lean''s
  index said otherwise and is corrected (6618d6979); the upstream ExtensionUniformity
  docstring had it right all along. Filed as I-0897.


  REMAINING OBLIGATION, exact: a uniform bound on n0(kappa) * deg_kappa F_kappa, where
  n0 is the Noetherian fibre-lattice stabilisation index (FiberVanishing.lean) re-run
  at each base field. Split at the type level by uniformBaseDivisor_of_exists_deg_le,
  so the next attempt need not re-derive the existence half.


  NOT free from the in-tree theorems: DegreeVanishing.subsingleton_hModule_one_of_deg_ge''s
  threshold is deg D0 + 1 - chi(O), stated relative to a base divisor ALREADY IN HAND,
  so bounding deg D0 by it is circular. Two candidate routes: (a) an absolute large-degree
  vanishing (Serre duality''s deg >= 2g-1) -- ABSENT from both projects, searched;
  (b) a bound on n0 in terms of genus C, which is base-field-invariant (genus_baseChangeField_curve).
  (b) is untried and is where the next lane should start. Caveat measured this round:
  the fibre-lattice chain need not STRICTLY increase, so finite-dimensionality of
  H1 alone does not bound n0 -- a strictness argument is needed too.

  '
