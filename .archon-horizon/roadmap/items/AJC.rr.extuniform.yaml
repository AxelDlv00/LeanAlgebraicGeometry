id: AJC.rr.extuniform
title: 'Extension-uniform H1 vanishing: one threshold serving every field extension'
projects:
- Algebraic-Jacobian-Challenge
summary: 'RE-PRICED 2026-07-29 (ajc-p2, run 0084): the residue is the DEGREE BOUND
  ALONE. Read the novelty caveat at the bottom -- it is part of the finding.


  UniformBaseDivisor C d has two clauses.


  (1) EXISTENCE of a vanishing divisor over every field extension -- a THEOREM AT
  EVERY GENUS: Ledger/BaseDivisorEveryField.exists_base_subsingleton_baseChangeField,
  three curve binders, no genus hypothesis, no hypothesis on kappa/k. Kernel EXIT=0,
  axiom-clean. CARRIER VERIFIED BY MACHINE: UniformBaseDivisor C d is derivable from
  it plus a hypothesis with NO vanishing content, only deg kappa D0 <= d -- so the
  carriers are the same object, not similar spellings.


  (2) DEGREE BOUND -- open, and it is the whole gap.


  WHY THE OLD PRICING WAS WRONG. The genus-0 ceiling of the previous producer (VanishingFieldDescent.uniformBaseDivisor_zero_of_subsingleton)
  belongs to its ROUTE: transporting the UNIT sheaf''s vanishing by faithful flatness
  forces the zero divisor as witness, hence forces H1(O_C) to vanish. It is not a
  property of the obligation, which never mentions the unit sheaf. GenusFieldInvariance.lean''s
  index said otherwise and is corrected (6618d6979). The UPSTREAM ExtensionUniformity
  docstring had it right all along -- when two docstrings about one gap disagree,
  the one nearer the definition tends to be right. Filed as I-0897; lesson as I-0906.


  NOVELTY CAVEAT, from a fresh-context audit (I-0914) whose points I re-verified and
  accepted (8decce128). The PRICING is right; the THEOREMS add no new mathematics.
  Both existence statements derive at the parent commit with no new lemma, instance
  or import; the proof body is FiberBound''s exists_bound_subsingleton_hModule_one_curve
  with one ''exact'' renamed; and uniformBaseDivisor_of_exists_deg_le is the IDENTITY
  (its hypothesis is definitionally its conclusion, Iff.rfl closes it). One audit
  clause was refuted: the pre-existing threshold form does NOT imply these without
  exists_deg_ge, whose hypothesis (a non-generic point of positive residue degree)
  is not free on C -- so they are incomparable inputs, not a chain.


  REMAINING OBLIGATION, exact: a uniform bound on n0(kappa) * deg_kappa F_kappa, where
  n0 is the Noetherian fibre-lattice stabilisation index (FiberVanishing.lean) re-run
  at each base field.


  WHERE TO START, measured this round: finrank_stabilisationAmbient_eq_h1 (fd811e5fd)
  shows the quotient in which n0 is chosen has dimension h1(O(D + n*F)), so at D =
  0 it is the GENUS -- base-field-invariant. A bound n0 <= genus C would close the
  clause with d := genus C * deg_kappa F_kappa. The missing step is STRICTNESS: a
  monotone chain in a g-dimensional space may repeat a term without reaching the top,
  so bounded dimension alone bounds nothing. n0 <= genus MUST NOT be cited as available.


  DEAD END: absolute large-degree vanishing (Serre duality deg >= 2g-1) is absent
  from BOTH projects -- searched. And DegreeVanishing''s threshold is deg D0 + 1 -
  chi(O), stated relative to a base divisor already in hand, so bounding deg D0 by
  it is circular.


  ALSO RELEVANT (I-0908, reviewer): closing P5 does not close the seam. fgaPicardRepresentability
  clause (1) is about picEt, while every Milne-Kollar milestone targets picSharp;
  the gap is tracked at AJC.picrep.etale-rep and needs a human decision.

  '
