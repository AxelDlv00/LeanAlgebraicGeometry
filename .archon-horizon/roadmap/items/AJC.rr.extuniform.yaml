id: AJC.rr.extuniform
title: 'Extension-uniform H1 vanishing: one threshold serving every field extension'
projects:
- Algebraic-Jacobian-Challenge
summary: 'CLOSED 2026-07-31 (pic-b, run 0099), with no additional curve hypothesis.\n\nFixedFiberDegree.lean
  transports one fixed source-side coordinate divisor through every field extension.
  Mayer-Vietoris exactness identifies H0 with the kernel of the normalized coordinate
  differential and H1-vanishing with its surjectivity. FiberCoordinateComplex proves
  that differential commutes with arbitrary scalar extension; kernel base change gives
  h0_coordinate_baseChange_eq and affine-chart acyclicity gives subsingleton_coordinate_baseChange_of_base.
  Riemann-Roch plus genus_baseChangeField_curve then proves degree_coordinate_baseChange_eq.\n\nThe
  fixed map chosen over k therefore supplies fixedCoordinateDegree C and the unconditional
  producer uniformBaseDivisor_fixedCoordinate : UniformBaseDivisor C (fixedCoordinateDegree
  C). Composing the existing reduction yields uniformVanishing_fixedCoordinate : UniformVanishing
  C. Both final declarations require only IsProper, SmoothOfRelativeDimension 1, and
  GeometricallyIrreducible; geometric integrality is synthesized by the existing smoothness
  bridge.\n\nVerified through the rooted build: lake build AlgebraicJacobian (8921
  jobs). LSP diagnostics are empty; the two endpoints use only propext, Classical.choice,
  and Quot.sound, with no sorry/axiom source occurrences. Source/root blobs are in
  integration commit c93cfea0ed; the repaired coordinate-complex substrate is commit
  80f073ffc0.'
