summary: "U2: the DDR9-U epsilon-identity at the universal point (the last gate of\
  \ divRep).\n\nSTATE 2026-07-29 (run 0071 s0010, ajcr-divrep). U2 OWES EXACTLY ONE\
  \ STATEMENT, WITH NO SCALAR\nBESIDE IT. The previous re-scope (s0008) said \"one\
  \ certificate plus one scalar\". The scalar half\nis RETRACTED BY THIS LANE: it\
  \ is not an obligation, and it never was.\n\nTHE SCALAR, hb : 0 < windowBound pi\
  \ hpi, IS A GENUS DISJUNCTION WHOSE DEGENERATE BRANCH IS LANDED.\ns0008 warned that\
  \ windowBound is a Classical.choose from a predicate upward-closed in b, so \"some\n\
  valid bound is positive\" is trivial while \"THE chosen one is\" is not, and told\
  \ the next session to\nnormalise the choice. Correct about the shape, wrong about\
  \ the state. The tree already carries\n\n  genus_eq_zero_of_windowBound_nonpos (RiemannRoch/WindowLedgerF3.lean:68)\n\
  \    windowBound <= 0 -> windowBound_spec fires at the ZERO divisor -> h1(O_Y) =\
  \ 0\n                     -> with hO : h0 = 1 and hchi : chi = 1 - g, forces g =\
  \ 0.\n\nSo every hb consumer by_cases on windowBound <= 0 and lands in g = 0. WindowLedgerF3\
  \ itself uses\nexactly this pattern twice for its own budget bounds (:91 two_mul_genus_le_S_mul_windowdelta,\n\
  :106 two_mul_genus_le_M_mul_windowdelta). Nobody had drawn it for the high-window\
  \ family, which\ncarries hb as a hypothesis on 44 files.\n\nLANDED THIS SESSION\
  \ (Picard/DivRepChartClassUnivFree.lean, commit 877459d8c):\n  windowBound_pos_of_genus_ne_zero\
  \ : g != 0 -> 0 < windowBound pi hpi\n    stated at the GENERAL ledger data (K/Y/pi/hpi\
  \ + hO + hchi) -- no seed, no chart, no\n    universal point, so it serves every\
  \ hb consumer in the tree, not just U2's.\n  divFamEps_highWindow_eq_universal_pair_of_ne_zero\n\
  \  exists_certifiedFamily_divFamEps_eq_universal_pair_of_ne_zero\n  divFamZarUnivOfNeZero\n\
  \    the three s0008 endpoints with hb replaced by g != 0, which is what any consumer\
  \ of a\n    genus-g Jacobian holds (g = 0 being the case where Pic^0 is trivial).\n\
  \nWHAT U2 OWES, now exactly one thing: IsCertified g for the high-window universal\
  \ seed's\nadaptation over RZ = DivCarveChartRing. This is the standing G-4 obligation\
  \ and precisely the\nwidened certificate lane's endpoint shape (I-0565).\n\nTHE\
  \ TYPE MISMATCH THAT IS NOW THE WHOLE CRITICAL PATH, and it is a NEW measurement\
  \ of this row,\nposted to cert-r2 on I-0494 this session. The consumer chain (divFamEps\
  \ / DivFam.mk /\nThetaGeneratorSeed.certifiedFamily, DivSchemeEps.lean:237) is typed\
  \ on\nDivisorAdaptation.IsCertified (DivisorFamily.lean:426). cert-r2's R2 endpoint\n\
  exists_isCertified_of_seed_of_swallowing_affineOpen (DivisorFamilyAffSeedEndpoint.lean:78)\n\
  concludes AffAdaptation.IsCertified (DivisorFamilyAffAdaptation.lean:252). DivFamZar.toAff\n\
  (DivisorFamilyAffCompare.lean:262) runs chart-typed -> widened, the WRONG DIRECTION\
  \ for this\nobligation, and manufacturing a chart typing from a widened cover is\
  \ what protection I-0492\nclause 3 forbids. So the R2 endpoint does not yet discharge\
  \ U2 by name; either a widened -> old\nbridge lands, or the eps layer is re-typed\
  \ onto the widened adaptation. NOTE what makes the\nsecond option cheap and is worth\
  \ checking first: DivisorFamilyAffFraming.lean already carries\nCertifiedDivisorFamilyAff.eps\
  \ and IsPairChartFramed over the WIDENED carrier, elaborating,\nbecause divFamEps\
  \ reads only the eqns field; and divisorWindow_eq_of_le_of_isCertified\n(DivSchemeEps.lean:196)\
  \ takes an ARBITRARY adaptation A of d and concludes about d alone -- it\nnever\
  \ asks that A be the Classical.choose-n divisorAdaptation. That is the seam.\n\n\
  STANDING AND STILL BINDING:\n * U2 is NOT proved and no gate has cleared. Nothing\
  \ produces a certificate at the universal\n   point, hence no IsChartClause and\
  \ no DivRepAffinePullback.\n * The endpoint still carries hO, hchi and the ambient\
  \ curve instances, so this describes the\n   DEBT, not representability for an arbitrary\
  \ curve.\n * critical-path 7.6 is untouched: L8, local surjectivity of the Abel\
  \ map out of a too-small\n   divisor functor, remains the campaign's real gate and\
  \ is arguably false as stated.\n\nVERIFICATION STATE, honest. The mathlib restore\
  \ of 2026-07-29 ~00:20 invalidated AJCR's own\noleans, so every Picard file reads\
  \ \"imports are out of date\" until rebuilt, and the rebuild of\nthis cone is ~9000\
  \ jobs. s0008's DivRepChartClassUniv.lean is STILL UNVERIFIED, and\nDivRepChartClassUnivFree.lean\
  \ (this session) is committed UNVERIFIED for the same reason: two\nbuilds were launched\
  \ under the mutex, the first failed transiently (a concurrent build in the\nsame\
  \ tree removed olean output directories mid-run -- FOUR AJCR lanes were building\
  \ at once) and\nthe second hit its 50-minute timeout inside the DivSchemeHighWindow*\
  \ chain. Do not quote either\nfile as green until a lake build of ...DivRepChartClassUnivFree\
  \ records exit 0.\n"
