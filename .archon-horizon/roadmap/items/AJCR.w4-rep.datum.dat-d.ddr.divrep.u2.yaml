summary: "U2: the DDR9-U epsilon-identity at the universal point (the last gate of\
  \ divRep).\n\nRE-SCOPED A FIFTH TIME, 2026-07-28 (run 0071 s0006, ajcr-divrep).\
  \ U2 IS NOW AN EQUATION BETWEEN\nTWO MORPHISMS THAT ALREADY EXIST, and the reduction\
  \ is proved in BOTH DIRECTIONS.\n\nPicard/DivRepChartRange.lean (sorry-free, kernel\
  \ exit 0, rooted, axiom-clean measured against a\ncontrol that still reports sorryAx):\n\
  \n 1. isDivRepClassify_iff_divRepClassifyZar_left_eq\n      IsDivRepClassify F0\
  \ v  <->  (divRepClassifyZar ... F0).left = v\n    WHY, and this is the whole content:\
  \ divRepClassifyZar is TOTAL -- defined for every locally\n    certified class over\
  \ every affine test, with no hypotheses beyond the ambient ones -- and\n    isDivRepClassify_unique\
  \ makes it the UNIQUE morphism satisfying the clause. So the clause is\n    not\
  \ a property one verifies of v; it says v IS the classifier. Forward is uniqueness,\n\
  \    backward is a rewrite. The statement names NO chart family and NO universal\
  \ point, so it is\n    reusable by anyone holding an IsDivRepClassify obligation.\n\
  \n 2. DivRepChartFamily.isChartClause_iff_forall_classify_eq\n      IsChartClause\
  \ U  <->  forall i j, (divRepClassifyZar (U i j)).left = ChartMap i j\n    STATED\
  \ AS AN IFF ON PURPOSE. I-0571 records that a restatement is only a reduction if\
  \ the\n    converse is proved; both directions are proved here, so this is not a\
  \ renaming. Consequence:\n    U2 carries NO residual quantifier over tower tests\
  \ or over framings. It is a per-chart\n    equation between two morphisms Spec R_Z(i,j)\
  \ --> DivScheme g, both of which are landed terms.\n\n 3. divFunctor_representableBy_of_chartRange\n\
  \      (forall i j, exists F, (divRepClassifyZar F).left = ChartMap i j)\n     \
  \   -> (divFunctor C pi g).RepresentableBy DivOver\n    Since divRepClassifyZar\
  \ is injective on classes (eq_of_isDivRepClassify), representability of\n    divFunctor\
  \ is EQUIVALENT to surjectivity of the classifier at every affine test. What is\
  \ new\n    is that surjectivity AT THE CHART RINGS ALONE suffices. So the remaining\
  \ debt is a preimage\n    under a landed map at glueData-many points, not a submodule\
  \ computation.\n\nSO WHAT A PRODUCER OWES has changed shape, not size: exhibit,\
  \ for each pair chart, a locally\ncertified class over R_Z(i,j) whose backward classifier\
  \ is that chart's own map to DivScheme.\n\nSTANDING, unchanged and still binding:\n\
  \ * U2 is NOT proved. Nothing in the tree produces a term of DivFamZar C (DivCarveChartRing\
  \ ...) pi g.\n * The endpoint still carries hO, hchi and the ambient curve instances,\
  \ so \"one equation\"\n   describes the DEBT, not representability for an arbitrary\
  \ curve.\n * per the previous re-scope, U2 remains gated on the G-4 certificate\
  \ discharge. BUT see the\n   note below: that gate should be re-measured rather\
  \ than quoted.\n\nA GATE WORTH RE-MEASURING BEFORE QUOTING IT AGAIN. This row has\
  \ quoted a stale blocker once\nalready (the I-0234 windowS strengthening, which\
  \ was DONE). Two facts suggest the G-4 quote\ndeserves the same scrutiny:\n * Picard/DivSchemeCertZarSeed.lean\
  \ already lands the relaxation: its docstring states that\n   NOTHING downstream\
  \ of DivFamZar asks for a certificate over R itself, and\n   ThetaGeneratorSeed.divFamZar_of_forall_away_certified\
  \ (:132) produces the DivFamZar class from\n   AWAY-LOCAL certificates only. The\
  \ global IsCertified over the chart ring that this row cites\n   (ThetaGeneratorSeed.certifiedFamily,\
  \ DivSchemeEps.lean:237) is exactly what that file was\n   written to avoid needing.\n\
  \ * I-0602 (cert-r2, machine-measured) establishes the general form of the trap:\
  \ the chart-typing\n   that divRepClassifyZar's signature APPEARS to require is\
  \ not what its body consumes --\n   divFamEps reads only the eqns field, through\
  \ divisorWindow, and the framing clause mentions no\n   cover, no piece and no chart\
  \ typing.\nNeither fact PROVES the gate is stale, and this row does not claim it\
  \ is. What it says is:\nmeasure it in Lean before spending another session treating\
  \ it as a wall.\n\nADDENDUM, SAME SESSION, CORRECTING THE PARAGRAPH ABOVE BEFORE\
  \ ANYONE ACTS ON IT. I checked the\n\"measure the G-4 gate\" suggestion myself rather\
  \ than leaving it as an invitation, and the answer\nis mostly NEGATIVE. Recording\
  \ it so the next session does not spend a round on it.\n\nThe two relaxed producers\
  \ do exist and do avoid a global IsCertified:\n  ThetaGeneratorSeed.divFamZar_of_forall_away_certified\
  \        (DivSchemeCertZarSeed.lean:132)\n  ThetaGeneratorSeed.divFamZar_of_forall_prime_away_certified\
  \  (DivSchemeCertZarPointwise.lean:181)\nBUT BOTH TAKE (hD : D.IsGenerator) AS WELL,\
  \ and at the universal seed that is NOT free:\n  isGenerator_seedUniv' (DivSchemeRedesignSeedUniv.lean:205)\
  \ is gated on TWO hypotheses --\n  hrdn : SeedUnivRDN, and a per-point fibre-nonvanishing\
  \ hfib.\n  SeedUnivRDN's own producer (seedUnivRDN_of_forall_germ_mem_span,\n  DivSchemeRedesignKappaZSeed.lean:96)\
  \ needs germ divisibility AT EVERY POINT of the relative\n  curve over the seed\
  \ chart ring.\nSo the relaxation MOVES the obligation from a global certificate\
  \ to (germ divisibility + fibre\nnonvanishing + away-local certificates). That is\
  \ a different statement, plausibly easier, and it\nis NOT bookkeeping: the germ-divisibility\
  \ input is the recorded honest geometric wall (I-0302\nresidual 2b/2c). No away-local\
  \ certificate producer at the chart ring was found either.\n\nNET: the G-4 quote\
  \ is not simply stale. What IS true, and is the part worth carrying forward, is\n\
  that U2 does not need a certificate over the WHOLE chart ring -- the pointwise gate\
  \ is a strictly\nweaker sufficient condition and nobody has tried to discharge it.\
  \ Anyone taking that route owes\ngerm divisibility first. Anyone quoting \"global\
  \ IsCertified\" as THE gate should say \"or the\npointwise gate, which is weaker\
  \ and equally unattempted\".\n"
