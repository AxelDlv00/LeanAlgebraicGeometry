summary: DONE (pic-d, run 0100 r2). The widened-window theta seam is closed on the
  existing SwallowedBy producer path with no additional hypothesis. Diagonal theta
  restrictions agree and off-diagonal overlap theta quotients are subsingleton, so
  intrinsic Cech descent collapses to the swallowing piece. This yields invertibility
  over the widened equalizer algebra and finite/projective/rank g structure over R.
  The dedicated DivisorFamilyAffThetaSwallowedWindow module transports those facts
  through the cover-independent intrinsicWindowQuotEquiv to the exact divisorWindow
  quotient consumed by the frame-cover layer, exporting finite_intrinsicWindowQuotient_of_swallowedBy,
  projective_intrinsicWindowQuotient_of_swallowedBy, and rankAtStalk_intrinsicWindowQuotient_of_swallowedBy.
  No ChartTyping, GL2, Noetherianity, rational point, Milne degree, or new certificate
  field is used. The remaining frame/classifier and RepresentableBy composition is
  downstream work in other rows.
