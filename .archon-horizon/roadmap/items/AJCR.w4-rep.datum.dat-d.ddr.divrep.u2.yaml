summary: "U2: the DDR9-U epsilon-identity at the universal point (the last gate of\
  \ divRep).\n\nRE-SCOPED A THIRD TIME, 2026-07-28 (run 0071, ajcr-divrep). The previous\
  \ summary said the\naffine package is \"U2 + choice bookkeeping\". THE BOOKKEEPING\
  \ HALF IS NOW LANDED, AND IT WAS\nNEVER U2-GATED. So this leaf is smaller than it\
  \ has been described, and it is no longer\nBLOCKED in the sense of having nothing\
  \ to pick up.\n\nWHAT U2 IS (informal/w4-ddr9-worksheet.md 3.1): at the universal\
  \ point the pair-chart\ntautological submodules ARE the coordinate images of divFamEps\
  \ of the universal family.\nStill exists in no Lean declaration.\n\nWHAT LANDED\
  \ THIS RUN, and why it removes the bookkeeping from this leaf:\n * DivRepAffPullGlue.lean\
  \ -- the chart pulls of ONE atlas factorization glue\n   (exists_divRepPullGlue)\
  \ and the glued class is the UNIQUE one restricting to the pieces\n   (existsUnique_divRepPullGlue).\n\
  \ * DivRepAffPullIndep.lean -- divRepPullGlue_eq_of_chartFactors: two DIFFERENT\n\
  \   factorizations of the same morphism give the SAME class. This is w4-ddr9 3.4s\n\
  \   \"choice-independence of the factorization\", and it consumes NO epsilon-identity.\n\
  \ * DivRepAwaySpanGlue.lean -- the instance pack of the S5b gluing keystone at canonical\n\
  \   away carriers, which was the mechanical obstruction to all of the above.\n\n\
  WHY THE INDEPENDENCE WAS FREE, recorded so nobody re-derives it the hard way:\n\
  divRepPullAt_mapAlgHom_eq_of_chartFactor (DivRepAffChartOverlap.lean:126) compares\
  \ ANY TWO\nchart presentations of the SAME morphism v, over any two carriers, restricted\
  \ to any common\ntower ring. It never requires the two presentations to come from\
  \ one factorization. So the\ncross-refinement of two factorizations is handled by\
  \ exactly the lemma that handles a single\nfactorizations own overlaps.\n\nWHAT\
  \ IS ACTUALLY LEFT ON THIS LEAF, both genuinely needing the epsilon-identity:\n\
  \ 1. isDivRepClassify_pull -- the glued pulled class satisfies IsDivRepClassify\
  \ for the\n    morphism it came from. This is the second of ofPulls three fields.\n\
  \ 2. DivRepChartFamily.IsCompatible for the universal family. Per\n    isCompatible_of_isDivRepClassify_divRepPullAt\
  \ (DivRepAffPullbackReduce.lean:98) this\n    reduces to the per-chart clause, i.e.\
  \ to U2 itself.\nAlso still open but not U2-gated: pull_naturality, which is the\
  \ same glue machinery as\npull.\n\nSTANDING CORRECTIONS, both verified this run:\n\
  \ * the I-0234 windowS blocker this row used to quote is DONE (windowS_spec_three,\n\
  \   RiemannRoch/WindowLedger.lean:157). Do not quote it again.\n * the \"cheap edit\
  \ nobody has made\" (retype divRepPullAt at DivFamZar) is ALSO done --\n   DivRepAffKit.lean:99-104\
  \ already takes DivFamZar.\n * U2 remains gated on the G-4 certificate discharge:\
  \ ThetaGeneratorSeed.certifiedFamily\n   (DivSchemeEps.lean:237) demands a GLOBAL\
  \ IsCertified over the chart ring. Note the R2\n   widening (protection I-0492)\
  \ landed a parallel predicate IsLocallyCertifiedAff, but\n   cert-r2 explicitly\
  \ did NOT land the comparison CertifiedDivisorFamily ->\n   CertifiedDivisorFamilyAff,\
  \ so that widening does not yet reach this obligation.\n"
