summary: "THE LAST GATE OF THE divRep MOUNTAIN (re-scoped twice on 2026-07-26, run\
  \ 0048 round 2; the\nsecond rescope corrects a STALE BLOCKER this lane had been\
  \ quoting).\n\nWHAT U2 IS (informal/w4-ddr9-worksheet.md §3.1): at the universal\
  \ point, the pair-chart\ntautological submodules ARE the coordinate images of divFamEps\
  \ of the universal family.  It\nexists in NO Lean declaration; `divUniversalFamily`\
  \ greps empty; there is no\nDivSchemeEpsUniv.lean.\n\nWHAT THE F5/F6 INTERFACE NOW\
  \ COSTS, after this round:\n  pull_classify   -- RETIRED.  Derived from isDivRepClassify_pull;\
  \ use the three-field\n                     constructor DivRepAffinePullback.ofPull.\n\
  \  IsCompatible U  -- RETIRED AS A SEPARATE OBLIGATION.  Its docstring promised\
  \ a proof \"from\n                     the epsilon identity AND the total mono theorem\"\
  ; the mono leg is gone\n                     (isCompatible_of_isDivRepClassify_divRepPullAt).\
  \  What remains of it IS\n                     the per-chart clause, i.e. U2.\n\
  \  §3.4 overlap    -- DISCHARGED (divRepPullAt_mapAlgHom_eq_of_chartFactor), U2-free.\n\
  \  DDR-9.F1        -- ALREADY LANDED and unnoticed: divScheme_exists_chartFactor\n\
  \                     (DivSchemeAtlasFactor.lean:382).\nSo the affine package is\
  \ now U2 + choice bookkeeping (glue with\nDivFamZar.exists_glue_of_away_compat,\
  \ then factorization-independence).  Nothing else.\n\n**STALE BLOCKER, CORRECTED.**\
  \  This row previously said U2 is \"gated on the I-0234 windowS\nstrengthening (b+2g\
  \ -> b+3g) and its full-rebuild window\".  THAT IS DONE.\n`windowS_choice` satisfies\
  \ `windowS_spec_three : windowBound + 3g <= (s-1)*delta`\n(RiemannRoch/WindowLedger.lean:157,\
  \ with `windowS_spec` kept at 2g only for byte\ncompatibility), and I-0234 is archived.\
  \  Do not quote the I-0234 clause again; the same stale\nclause is still in informal/w4-ddr9-worksheet.md\
  \ around :334-338 and should be struck there.\n\nWHAT U2 IS ACTUALLY GATED ON, per\
  \ the round's ground review: the G-4 certificate discharge --\ni.e. mountain 1.\
  \  `ThetaGeneratorSeed.certifiedFamily` (DivSchemeEps.lean:237) demands\n`(D.divisorAdaptation\
  \ hD).IsCertified g`, a GLOBAL certificate over the chart ring R_Z.  The\nseed itself\
  \ exists (DivSchemeSeedUnivGen.lean:283) and the fibrewise keystone is PROVED\n\
  (existsUnique_effective_divisor_divUniversalFibre, DivSchemeSeedUnivAssembleKappa.lean:417\n\
  and :481).  So `ddr.divrep` is NOT independent of `ddr.certificate`, contrary to\
  \ the old\n\"six independent mountains\" framing.\n\nCHEAP EDIT NOBODY HAS MADE,\
  \ and it is what would let I-0320's IsCertified relaxation actually\nreach U1: `divRepPullAt`'s\
  \ body is `DivFamZar.mapAlgHom omega (DivFam.mk (U i j)).toZar` --\nit only ever\
  \ uses the `toZar` image.  Retype `U : forall i j, DivFamZar C (ChartRing i j) pi\
  \ g`.\nStrictly weaker hypothesis; divRepPullAt_id / _comp / IsCompatible survive\
  \ verbatim.\n\nNOT a next move: `pull_naturality` is ILL-POSED as a standalone item\
  \ (it is a field quantified\nover another field that has no producer), and its algebraic\
  \ content is already landed as\n`divRepPullAt_comp` (DivRepAffKit.lean:111).\n"
