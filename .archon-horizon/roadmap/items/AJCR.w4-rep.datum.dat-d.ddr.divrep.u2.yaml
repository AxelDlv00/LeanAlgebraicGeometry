summary: "U2: the DDR9-U epsilon-identity at the universal point (the last gate of\
  \ divRep).\n\nRE-SCOPED A SIXTH TIME, 2026-07-28 (run 0071 s0008, ajcr-divrep).\
  \ THE EPSILON-IDENTITY HALF OF U2\nIS NO LONGER AN OBLIGATION. It is a corollary\
  \ of the certificate, and the reason nobody had seen\nthat is a 44-file sorry-free\
  \ family that no root import reaches.\n\nWHAT THIS ROW GOT WRONG FOR THREE SESSIONS,\
  \ including my own addendum below. The row (and inbox\nI-0512, and my thread post\
  \ C-0052) said the seed route relocates U2 onto germ divisibility at every\npoint\
  \ of the relative curve -- SeedUnivRDN, the recorded honest geometric wall of I-0302\
  \ residual\n2b/2c. That was measured off isGenerator_seedUniv' (DivSchemeRedesignSeedUniv.lean:205),\
  \ which\ngenuinely IS gated on SeedUnivRDN plus a per-point hfib.\n\nIT IS NOT THE\
  \ ONLY GENERATOR OVER THE CHART RING:\n\n  PointwiseAchiever.isGenerator_highWindowPointwiseGeneratorSeed\n\
  \    (Picard/DivSchemeHighWindowPointwiseGenerator.lean:89)\n\nis a ThetaGeneratorSeed.IsGenerator\
  \ at K = divUniversalSeedK over RZ = DivCarveChartRing -- exactly\nU2's ring and\
  \ exactly U2's seed module -- from hO, hchi and hb : 0 < windowBound pi hpi ONLY.\
  \ No germ\ndivisibility, no SeedUnivRDN, and no separate hfib: isGenerator_pointwiseGeneratorSeed\
  \ (:274) takes\nPointwiseSeedRDN alone, and pointwiseSeedRDN_of_highWindow (DivSchemeHighWindowQuotientBridge.lean:119)\n\
  discharges THAT from hb. Two different seeds over the same ring, and only one of\
  \ them is gated. That\ndistinction is the whole content of this re-scope.\n\nTHE\
  \ COMPOSITION, landed this session as Picard/DivRepChartClassUniv.lean:\n\n  PointwiseAchiever.divFamEps_highWindow_eq_universal_pair\n\
  \    : IsCertified g -> divFamEps (DivFam.mk (certifiedFamily ...))\n        = (divUniversalFstWindow.toSubmodule,\
  \ divUniversalSndWindow.toSubmodule)\n\ni.e. epsilon of the certified family of\
  \ the high-window universal seed IS the universal tautological\npair. All four non-certificate\
  \ inputs of the landed epsilon-projection identity\n(ThetaGeneratorSeed.divFamEps_certifiedFamily,\
  \ DivSchemeEps.lean:312) are available at the universal\npoint:\n * the generator\
  \ clause, as above;\n * the second-window containment, divUniversalSndWindow_le_highWindow_divisorWindow\n\
  \   (DivSchemeHighWindowSecondContainment.lean:114) -- for that SAME seed, same\
  \ three hypotheses;\n * BOTH thetaGluedEval surjectivities from the certificate\
  \ itself, via\n   DivisorAdaptation.IsCertified.thetaGluedEval_surjective (DivisorThetaFibreData.lean:271);\
  \ the\n   second window M + s is >= M, so the ledger H1 input is the landed relThetaPairH1_windowMS.\n\
  The instantiation needs no transport: divUniversalSeedK (DivSchemeSeedUniv.lean:186)\
  \ is\nSYNTACTICALLY the submodule the epsilon-identity asks for at x1 = divUniversalFstWindow\
  \ -- both are\nSubmodule.map (relThetaWindowEquiv ... (relThetaPairH1_windowM ...)).toLinearMap\
  \ x1.toSubmodule.\n\nAlso landed in the same file: exists_certifiedFamily_divFamEps_eq_universal_pair\
  \ (the existential a\nchart-class producer consumes) and divFamZarUniv (the DivFamZar\
  \ class over RZ that U2 asks a producer\nto exhibit, via CertifiedDivisorFamily.isLocallyCertified\
  \ -- a global certificate is a local one\nthrough the trivial one-member cover,\
  \ so no Zariski shrinking).\n\nWHY IT WAS INVISIBLE, and this is the transferable\
  \ part. The DivSchemeHighWindow* family is 44 files,\nZERO sorries, and has ZERO\
  \ occurrences in AlgebraicJacobian.lean; nothing outside the family imports\nits\
  \ two endpoint files, and its oleans dated from four days earlier. So no root-target\
  \ build ever\nelaborated it, no sorry census counted it, and no axiom probe measured\
  \ it. This is inbox I-0362\n(unrooted = not measured) at 44-file scale, sitting\
  \ on the critical path. Rootedness must be checked\nSEPARATELY from sorry-freeness:\
  \ grep -c <module> AlgebraicJacobian.lean = 0 means \"not measured\", not\n\"not\
  \ proved\".\n\nWHAT U2 STILL OWES, exactly one thing plus a scalar:\n 1. IsCertified\
  \ g for the high-window universal seed's adaptation over RZ. This is the standing\
  \ G-4\n    obligation and it is precisely the widened certificate lane's endpoint\
  \ shape (I-0565,\n    exists_isCertified_of_swallowing_affineOpen); it is NOT a\
  \ new statement.\n 2. hb : 0 < windowBound pi hpi. A scalar side condition, used\
  \ only to get 0 < windowS_choice\n    (windowS_choice_pos_of_windowBound_pos, DivSchemeHighWindowChartExhaustion.lean:54).\
  \ Note\n    windowBound is a Classical.choose from an existence statement whose\
  \ predicate is upward closed in\n    b (UniformVanishing.lean:71), so \"some valid\
  \ bound is positive\" is trivial while \"THE chosen one\n    is\" is not -- if this\
  \ ever blocks, normalise the choice rather than proving positivity of it.\n\nSTANDING\
  \ AND STILL BINDING:\n * U2 is NOT proved and no gate has cleared. Nothing produces\
  \ a certificate at the universal point,\n   hence no IsChartClause and no DivRepAffinePullback.\n\
  \ * The endpoint still carries hO, hchi and the ambient curve instances, so this\
  \ describes the DEBT,\n   not representability for an arbitrary curve.\n * critical-path\
  \ 7.6 is untouched: L8, local surjectivity of the Abel map out of a too-small divisor\n\
  \   functor, remains the campaign's real gate and is arguably false as stated. The\
  \ tail shrinking is\n   NOT progress toward it.\n\nTHE PRIOR ADDENDUM ON THIS ROW\
  \ IS SUPERSEDED where it says the relaxation \"moves the obligation to\ngerm divisibility\
  \ + fibre nonvanishing + away-local certificates\". That is true of the\ndivFamZar_of_forall_away_certified\
  \ route through seedUniv'. It is NOT the only route, and the\nhigh-window route\
  \ needs none of those three.\n\nVERIFICATION CAVEAT, AND IT IS A WORKSPACE OUTAGE\
  \ NOT A LANE FAILURE (2026-07-29 ~00:05).\nDivRepChartClassUniv.lean is committed\
  \ but UNVERIFIED. Two separate causes, in order:\n 1. Its transitive dependency\
  \ DivSchemeWindowMulGeneral.lean had NEVER been compiled in this tree\n    (no .olean\
  \ at all, source dated Jul 21). It DID build successfully at 21:41 once the mutex\
  \ was\n    held and threads capped -- so that half is now fixed and the module has\
  \ an olean.\n 2. Then the SHARED MATHLIB PACKAGE DISAPPEARED. At .lake-packages/mathlib:\
  \ .lake/build/ gone,\n    mathlib olean count ZERO, Mathlib/ source ZERO .lean files,\
  \ git rev-parse HEAD failing. lake\n    reports the repo 'may be corrupt'. Filed\
  \ as I-0645 (--to human) and announced to all AJCR lanes.\n    Window: mathlib was\
  \ working at 21:41, gone by 23:58.\nSo NOTHING in the workspace can be kernel-checked\
  \ until mathlib is restored. Per-project build trees\nsurvive, so already-built\
  \ modules can still be read.\nNEXT SESSION: restore mathlib first, then (a) lake\
  \ build the HighWindow closure, (b) lake env lean\nDivRepChartClassUniv.lean. Only\
  \ then is the eps-reduction above a measured fact rather than a\ncommitted claim.\
  \ Do not quote it as verified before that.\n"
