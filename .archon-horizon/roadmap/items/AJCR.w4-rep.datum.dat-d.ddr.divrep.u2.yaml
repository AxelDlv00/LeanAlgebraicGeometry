summary: "U2: the DDR9-U epsilon-identity at the universal point (the last gate of\
  \ divRep).\n\nRE-PRICED 2026-07-29 (run 0071 s0012, ajcr-divrep), REPLACING THE\
  \ \"UNPRICED\" VERDICT AT THE TOP\nOF THE PREVIOUS BODY. That verdict came from\
  \ I-0705: forall_not_isCertified_of_straddling\n(Picard/DivisorFamilyAffStrict.lean:127)\
  \ concludes forall (A : DivisorAdaptation ..) (n), NOT\nA.IsCertified n, which negates\
  \ HasCertifiedAdaptation at the same binder, so the row's residue\nmight be FALSE\
  \ rather than open. That was correct about the CLASS half and wrong about the\n\
  EPSILON half, and the two are now separated in Lean.\n\nLANDED (Picard/DivRepChartClassUnivQuot.lean,\
  \ commit ae01cfcb2; sorry-free, rooted, lock-free\nscratch-olean check EXIT=0, zero\
  \ warnings):\n\n  divisorWindow_eq_of_le_of_quotientData\n    a Grassmannian point\
  \ x contained in the window submodule K_a(d) EQUALS it as soon as the\n    window\
  \ quotient (R (x)_k H_a) / K_a(d) is projective over R of constant fibre rank g.\n\
  \    No DivisorAdaptation, no IsCertified, no cover, no chart typing.\n  divFamEps_eq_of_le_of_quotientData\n\
  \    the epsilon-PAIR identity at an ARBITRARY F : DivFam C R pi g, from window-quotient\
  \ data at\n    the two pinned windows. Feedable from EITHER carrier.\n  divisorWindow_eq_of_le_of_isCertified_of_quotientData\n\
  \    the landed chart-typed statement recovered as a COROLLARY, so the generalisation\
  \ is\n    machine-checked rather than asserted in prose.\n\nWHY THE REFUTATION MISSES\
  \ THE EPSILON HALF. The no-go's proof runs through certificate clause\n(c1): finiteness\
  \ of the CHART-LOCAL COLENGTH modules forces supportLeak = empty, hence\nsupportLocus_subset_chart_of_isCertified,\
  \ hence confinement to one pinned chart. A hypothesis\nabout d's WINDOW QUOTIENT\
  \ quantifies over no adaptation, so it is not an instance of that\nforall. The epsilon\
  \ half is OPEN, not false.\n\nTHE HONEST PARTITION OF U2, which is what this row\
  \ should now be read as:\n  epsilon-VALUE : d's window quotient is projective of\
  \ constant rank g -- no-go-IMMUNE, open.\n  the CLASS     : a term of DivFamZar\
  \ C R_Z pi g (a LOCALLY CERTIFIED family) -- this carries\n                  the\
  \ WHOLE bite of I-0705, and it is precisely the face protection I-0492's\n     \
  \             widening (R2) exists to supply.\n\nCONSEQUENCE FOR THE CERT-R2 SEAM,\
  \ posted on I-0494: the epsilon layer needs NO\nAffAdaptation.IsCertified -> DivisorAdaptation.IsCertified\
  \ bridge. The type mismatch this row\nrecorded on 2026-07-28 as \"the whole critical\
  \ path\" is off the epsilon path entirely; it remains\nrelevant only to the class\
  \ half, where cert-r2's divFamZarAff_of_swallowing_affineOpen\n(DivisorFamilyAffSeedGate.lean)\
  \ is the live candidate.\n\nONE FREE SUB-FINDING, measured not assumed: FINITENESS\
  \ OF THE WINDOW QUOTIENT IS NOT AN INPUT.\nThe rank engine Submodule.eq_of_le_of_rankAtStalk_quotient_eq\
  \ (DivSchemeEps.lean:115) takes its\nModule.Finite slot at the GRASSMANNIAN POINT's\
  \ quotient, which grFunctorAff carries as a field;\nso the window side owes only\
  \ projectivity plus the rank equation. Caught by the unusedVariables\nlinter on\
  \ the first elaboration -- I had written finiteness in by analogy with the landed\n\
  statement, which threads finiteness of A.ThetaGlued for its own reasons.\n\nSTANDING\
  \ AND STILL BINDING:\n * U2 IS NOT PROVED AND NO GATE HAS CLEARED. Nothing produces\
  \ a DivFamZar term over the chart\n   ring, hence no IsChartClause and no DivRepAffinePullback.\n\
  \ * The straddling probe (is (univSeed ..).localEquations' supportLocus preconnected\
  \ while\n   meeting both pinned fibres?) is STILL UNMEASURED. It now decides only\
  \ the class half.\n * The endpoint still carries hO, hchi and the ambient curve\
  \ instances, so this describes the\n   DEBT, not representability for an arbitrary\
  \ curve.\n * critical-path 7.6 is untouched: L8, local surjectivity of the Abel\
  \ map out of a too-small\n   divisor functor, remains the campaign's real gate and\
  \ is arguably FALSE as stated. Two\n   spellings collapsing is not progress toward\
  \ it.\n\n--- the previous body follows; its \"unpriced\" verdict is superseded for\
  \ the epsilon half only ---\n\nWHAT SURVIVES from the earlier scoping: the epsilon-layer\
  \ reduction is sound and kernel-checked\n-- the identity genuinely does not care\
  \ WHICH adaptation carries the certificate\n(HasCertifiedAdaptation, DivRepChartClassUnivAny.lean),\
  \ and now does not care whether there is\nan adaptation at all. The scalar is discharged:\
  \ windowBound_pos_of_genus_ne_zero\n(DivRepChartClassUnivFree.lean) reduces hb to\
  \ a genus disjunction whose degenerate branch is\ngenus_eq_zero_of_windowBound_nonpos\
  \ (RiemannRoch/WindowLedgerF3.lean:68). The generator clause\nis free over R_Z (isGenerator_highWindowPointwiseGeneratorSeed,\n\
  DivSchemeHighWindowPointwiseGenerator.lean:89).\n\nMethodological error of s0010\
  \ recorded as I-0707: that session crossed its new existential\nagainst the certificate\
  \ lane's PRODUCERS and never against the tree's REFUTATIONS. The\ncomplement, recorded\
  \ this session: it then accepted the refutation without asking which CLAUSE\nof\
  \ IsCertified the refutation's proof consumes.\n\n\nVERIFICATION, FINAL AND MEASURED\
  \ (appended at s0012 close, superseding the 'no full lake build'\ncaveat above):\
  \ lake build AlgebraicJacobian -> 'Build completed successfully (9279 jobs)', EXIT=0,\n\
  ZERO errors and ZERO 'uses sorry' warnings in the whole log. Neither new module\
  \ appears anywhere\nin the log, so neither contributed an error or a linter warning.\
  \ Axiom probe with a CONTROL that\nfires (I-0661): AlgebraicGeometry.Jacobian reports\
  \ sorryAx, while all six new theorems report only\n[propext, Classical.choice, Quot.sound].\
  \ Both modules rooted in AlgebraicJacobian.lean.\n\nTHE HONEST LIMIT OF THIS ROW'S\
  \ HEADLINE, added at s0012 close after ajcr-charts pointed out on\nI-0494 that a\
  \ reduction owes TWO probes and I had run only one on my own. 'The eps-half is OPEN,\n\
  not false' is a claim about the NO-GO: forall_not_isCertified_of_straddling does\
  \ not bear on a\nhypothesis naming no adaptation. IT IS SILENT ABOUT SATISFIABILITY.\
  \ The mirror risk is real and\nUNMEASURED: if the window quotient at the universal\
  \ point can never be projective of constant\nrank g, then the eps-half has been\
  \ reduced to a FALSE hypothesis -- which passes every sorry\ncensus and every axiom\
  \ probe, because it is then a theorem.\n\nNote the asymmetry with the junk probe\
  \ that refuted DAT-J's Abel square: that residue was vacuous\nbecause its witness\
  \ was CONSUMER-CHOSEN. Here the window quotient is determined by d, so vacuity\n\
  is impossible and satisfiability is the only live failure mode. The 'not silently\
  \ stronger' probe\nIS discharged (divisorWindow_eq_of_le_of_isCertified_of_quotientData\
  \ recovers the landed\nchart-typed statement as a corollary); the satisfiability\
  \ probe is owed and is the cheapest next\nmeasurement on this row."
