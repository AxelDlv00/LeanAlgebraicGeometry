title: 'Widened window quotient: intrinsic theta restriction and projectivity'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'LIVE TARGET (R2, no new hypotheses): prove that the cover-independent widened
  window quotient is finite projective of constant stalk rank g, then feed the widened
  frame/classifier route to (divFunctorAff C g).RepresentableBy. The old chart-typed
  universal-epsilon description is obsolete and must not be rebuilt.\n\nVERIFIED PRODUCERS:
  29f746e25b gives widened fibre degree and the N(a)-d_p Picard/H1 witness; b8c18b13a4
  gives surjective theta evaluation through an auxiliary chart presentation and an
  equivalence from the cover-independent quotient, without certifying that chart adaptation;
  f9da5c6ad6 computes every field fibre dimension as g by Phi/Riemann-Roch; 80ce9e83b2
  proves that the intrinsic cocycle-glued theta sheaf has invertible sections on every
  arbitrary affine piece by finite basic refinement and faithfully flat descent. No
  producer assumes ChartTyping, Noetherianity, or a rational point.\n\nNEXT PRODUCER:
  restrict those intrinsic invertible section modules to each finite divisor piece,
  glue them over the widened equalizer algebra, and identify the result with the window
  quotient. InvertibleModuleTransfer then supplies finite/projective/stalk-rank data
  from the existing certificate. After that, prove widened window base change, the
  frame cover, epsilon carve/classifier separation, and the RepresentableBy endpoint.
  ThetaTrivData at positive exponent and the obsolete fixed-pair chart route are not
  substitutes for this seam.'
