title: 'Widened window quotient: intrinsic theta restriction and projectivity'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'LIVE TARGET (R2, no new hypotheses): prove that the cover-independent widened
  window quotient is finite projective of constant stalk rank g, then feed the widened
  frame/classifier route to (divFunctorAff C g).RepresentableBy. The old chart-typed
  universal-epsilon description is obsolete and must not be rebuilt.


  VERIFIED PRODUCERS: 29f746e25b gives widened fibre degree and the N(a)-d_p Picard/H1
  witness; b8c18b13a4 gives surjective theta evaluation and a cover-independent window-quotient
  equivalence without certifying its auxiliary chart presentation; f9da5c6ad6 computes
  dimension g for every pulled-equations field quotient; 80ce9e83b2 proves intrinsic
  theta sections invertible on every arbitrary affine piece; 80363e8b32 base-changes
  those sections to every certified colength algebra, proving invertibility over that
  algebra and finiteness/projectivity over R. No producer assumes ChartTyping, Noetherianity,
  or a rational point.


  NEXT PRODUCER: glue the landed ThetaPieceRestriction modules across overlap colength
  algebras into an invertible module over the widened equalizer algebra, and identify
  it with the window quotient. InvertibleModuleTransfer then supplies global finite/projective/stalk-rank
  data from the existing certificate. After that, prove widened window base change,
  the frame cover, epsilon carve/classifier separation, and the RepresentableBy endpoint.
  ThetaTrivData at positive exponent and the obsolete fixed-pair chart route are not
  substitutes for this seam.'
