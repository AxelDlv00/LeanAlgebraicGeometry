summary: 'CLOSED (run 0053 s0006, commit f4a56a754). Adelic.rigidPushforwardGammaBaseChange_proved
  supplies the Gamma-level statement; rigidPushforwardBaseChange_of_gamma lifts it
  to the field. The non-affine case -- the whole content, since every IsIso theorem
  for the adjoint mate in this tree wants IsAffineHom on the family while q : C_A
  -> Spec A is proper -- is handled by replacing affineness with the two-term Cech
  complex of the preimage cover: exists_gammaBaseChange_of_kerPure sandwiches exists_kerChartTensorEquiv
  between globalSectionsEquivKerModuleSectionDiffBase on both sides and pushforwardTopEquivBaseSections
  at the two tops. Cech purity comes from surjectivity (the P1 engine''s first conjunct,
  which transports to C_A by ''exact'' -- moduleSectionDiff_pushforward is rfl and
  Surjective sees only the underlying function, so no congruence helper was needed)
  plus flatness of the overlap sections (free from CoherentSheafFlat q L). Axiom-clean.'
