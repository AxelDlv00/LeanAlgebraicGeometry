summary: 'The baseChange gate field -- THE ONLY REMAINING GATE LEAF, and reduced (run
  0053 s0004). Picard/RigidPushforwardAffineDescent.lean descends it to ONE module-level
  statement, Adelic.RigidPushforwardGammaBaseChange: bijectivity of Gamma(Spec A'')
  tensor_{Gamma(Spec A)} Gamma(C_A,L) -> Gamma(C_{A''}, g''^*L). Both sides of the
  adjunction mate are quasi-coherent on the affine Spec A'', and such a map is iso
  iff bijective on global sections (Stacks 01I8). NOT a Beck-Chevalley theorem: with
  no cartesian hypothesis all the content sits in the supplied bijectivity. What remains
  is classical H0 base change: generalise FiberChart sections 5-7 from the fibre embedding
  Spec kappa(t) -> Spec A to an arbitrary Spec A'' -> Spec A. FOUR corrections to
  the naive route are recorded in that module''s docstring -- read them before starting.'
