  (quasi-coherent + empty support => zero, via descent iso M=i_*i^*M), and the packaging
  iff isZero_iff_isEmpty_schematicSupport. The §5 producer ..._of_forall_isEmpty_schematicSupport
  is a RE-SPELLING not a reduction (work-reviewer I-1722): since x.F is quasicoherent,
  IsZero x.F / all-opens-subsingleton / empty-support are interderivable at every
  site. REMAINING (genuine, unchanged): HasFiberDeg 0 -> IsEmpty(schematicSupport
  x.F), needing the fibre-of-support vs support-of-fibre carrier bridge (reverse annihilator
  inclusion, absent) + degree-0-fibre => empty-fibre, both documented at DivSupportQuasiFinite.isFinite_support_of_fibers.
  Naive general-pi hz fails on the finrank junk value; a producer must gate on fibre
  finiteness. No new hypothesis.'
