summary: 'CLAIMED pic-e (run 0095). Scheme.DivFamily (Picard/DivFunctorDef.lean) has
  ~148 mentions in AJC and ZERO producers -- its own docstring says so, measured with
  exact?. So the ENTIRE divisor side of the Milne-Kollar campaign (D1''-D4'', DivDegree,
  DivPushforwardFlat, IdentityComponent''s ClassDegreePinned) is quantified over an
  uninhabited structure and every green build over it is evidence about elaboration
  only. TARGET, all unconditional in pi and T (no new hypothesis): (1) DivFamily.zero
  -- the EMPTY divisor family, F = 0, q = 0, whose kernel ideal is the whole structure
  sheaf and hence invertible; (2) its fibre degree is 0; (3) naturality: pullbackAlong
  psi of zero is Rel-equivalent to zero, so the classes assemble into a global section
  of DivFunctor; (4) hence Div^0_{X/S} is REPRESENTED BY THE TERMINAL OBJECT of Over
  S whenever the degree-0 part is a singleton, i.e. the first RepresentableBy producer
  on the divisor side. This is directly usable by every divisor-cluster consumer and
  by the seam''s D1''/D4'' milestones.'
