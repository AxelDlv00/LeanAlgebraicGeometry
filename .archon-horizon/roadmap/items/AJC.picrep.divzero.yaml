summary: 'Div0 producer reduced to EMPTY SUPPORT (pic-e 0105 r3, commits 64348cf522,
  4f6a122ab9, DivFamilyZero.lean, axiom-clean, lake env lean EXIT=0). New reusable
  bricks: isZero_of_isEmpty (module on empty scheme is zero) and isZero_of_isEmpty_schematicSupport
  (quasi-coherent sheaf with empty schematic support is zero, via descent iso M=i_*i^*M)
  -- converses of the landed isEmpty_schematicSupport_of_isZero. Producer divFunctorDegZero_representableByTerminal_of_forall_isEmpty_schematicSupport:
  Div0 represented once every degree-0 divisor has empty support. REMAINING (open):
  HasFiberDeg 0 -> IsEmpty(schematicSupport x.F). Two sub-obligations, both documented
  in DivSupportQuasiFinite.lean: (a) the fibre-of-support vs support-of-fibre carrier
  bridge (reverse annihilator inclusion, absent in tree), (b) degree-0 fibre => empty
  fibre under quasi-finiteness. general-pi hz is UNPROVABLE due to finrank junk value;
  producer must gate on fibre finiteness. No new hypothesis added.'
