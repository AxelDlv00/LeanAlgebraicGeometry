id: AJC.picrep.divzero
title: 'Div-zero: the first DivFamily producer, and Div^0 representable by the terminal
  object'
projects:
- Algebraic-Jacobian-Challenge
summary: 'ADVANCED, NOT CLOSED. Commits 0d465e95d9, aa38db9d26, 10d411758b, 38e102eef6,
  and 692b3fe104 add a rooted, axiom-clean terminal bridge, the IsZero-from-sections
  converse, and three conditional Div0 RepresentableBy constructors. The sharp remaining
  antecedent is hss: for every test T and degree-zero x, every open V has Subsingleton
  Gamma(x.F,V), which implies IsZero x.F and terminal representability. HasFiberDeg
  0 alone does not syntactically provide hss: it is a finrank of fibre sections, while
  hss needs a support/finiteness and finite-dimensionality bridge. Do not use a generic
  sheaf example such as O(-1) on P1 as a DivFamily counterexample without checking
  the carrier epimorphism q. Whether the required bridge holds for the DivFamily carrier
  remains unproved, so no instantiated producer is claimed. PicEt and fgaPicardRepresentability
  remain untouched.'
