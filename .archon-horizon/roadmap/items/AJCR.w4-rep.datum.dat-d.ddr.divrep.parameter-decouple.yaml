summary: REAL REMAINING REPRESENTABILITY JOIN. The rooted producer divFunctorAff_genus_representableBy
  represents divFunctorAff C (genus C). The unconditional Pic0 coverage theorem is
  indexed instead by admissibleCoverageParameter hpi (genus C), and genus_lt_admissibleCoverageParameter_of_ne_zero
  proves these parameters differ in positive genus. The current widened divisor-family
  and universal-window tower uses one Nat simultaneously for the curve Euler-characteristic
  normalization chi(O_C) = 1 - g and for the divisor-family degree/rank. Generalize
  that substrate to separate a curve-genus parameter gamma from a divisor-degree parameter
  n, recover the existing API on the diagonal n = gamma, then instantiate n = admissibleCoverageParameter
  hpi gamma and feed abelSigmaChartAff. No rational point, IsDivisorDegree genus,
  new certificate field, or assumed RepresentableBy witness is permitted.
