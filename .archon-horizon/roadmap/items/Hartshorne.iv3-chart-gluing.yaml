summary: 'Commits 2ef2333cdb, c68c6bf54c, and ffcbb833f7 close the fixed finite-basis
  chart-producing route: every non-generic point gets a basis coordinate with nonzero
  jump and exact divisor order, an exact-order LocalRatioOpen, a LocalRatioRegularization,
  and the selected opens form an indexed cover under an explicit Nonempty NonGenericPoint
  hypothesis; the compatible family now feeds gluedFromOpen and yields a projective
  morphism over Spec k. Remaining source-facing work: derive non-generic-point existence
  from the smooth proper curve hypotheses, connect the numerical BasePointFreeLinearSystem
  predicate to geometric fiber/evaluation base-point-freeness, and prove the very-ample
  two-point/tangent criterion. The IV.3.1 blueprint node remains empty.'
