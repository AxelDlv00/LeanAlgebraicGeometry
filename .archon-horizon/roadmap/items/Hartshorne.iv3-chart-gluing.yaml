title: IV.3.1 local-ratio chart restriction and gluing
projects:
- Hartshorne
summary: 'Commits ae79789974 and 248dcf8a16 add a kernel-checked non-generic-point
  witness for integral smooth curves, an unconditional fixed-basis local-ratio cover
  and glued-map interface (unconditional only with respect to the prior Nonempty NonGenericPoint
  input; a finite basis and the existing numerical BasePointFreeLinearSystem hypothesis
  are still supplied), and numerical one-point criteria equivalent to nonzero local
  jumps, rank-one surjectivity, and nonzero normalized stalk residues. Focused and
  umbrella project builds plus standard-axiom checks pass. The source-facing IV.3.1
  node remains empty: the scheme-theoretic fiber/evaluation/base-locus meaning, two-point/tangent
  very-ampleness criterion, and final canonical chart/gluing theorem are still outstanding.'
