summary: 'Commits a68f3b1066 and c2aa15dec6 add a canonical ordinary Scheme.Modules
  stalk-fiber/evaluation API and lift the bounded-rational-function divisor sheaf
  to an actual O_X-module; d49f7a0921 corrects the IV.3.1 proof''s surjectivity polarity.
  The 8,681-job umbrella build passes with standard axioms only. These are independent
  intrinsic producers: the ordinary fiber has not yet been identified with jumpModule/jumpProj,
  divisorModule is not yet proved locally invertible, and the geometric base-locus,
  first-jet/tangent, closed-immersion, and final source IV.3.1 bridges remain open.
  Existing local-ratio gluing remains explicit and choice-dependent.'
