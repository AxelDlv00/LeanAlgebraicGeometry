summary: Run 0216 proves a reverse complex-to-real manifold derivative bridge, identity
  complex derivative at zero for the named time-one exponential candidate, global/fixed/joint
  complex MDifferentiability, additive zero/add/neg laws, a bundled multiplicative
  exponential homomorphism and its surjectivity, and a commutativity consumer using
  that bundled hom (commits 4667789eef, 0d091ef928, 2706c20134, 730be260af, 9770b9a656,
