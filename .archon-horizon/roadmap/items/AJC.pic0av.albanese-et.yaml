summary: 'Headline obligation 5: isAlbanese_pic0Et (Jacobian.lean:660, bare sorry)
  -- the Albanese universal property of Pic0SchemeEt over an ARBITRARY field. ADVANCED
  in its SUPPLY ROUTE, obligation UNTOUCHED, by ajc-p4 (run 0086 r4). Owner released.


  *** THE r2 COSTING ON THIS ROW WAS WRONG IN BOTH DIRECTIONS AND IS RETRACTED (I-1285,
  my own item I-1115). Read this before pricing anything here. ***


  WHAT r2 PUBLISHED: the leg''s IsAlgClosed is load-bearing at exactly ONE lemma,
  Milne 3.1''s regularity input (isRegularLocalRing_localizationAtPrime_of_isStandardSmooth_of_isAlgClosed,
  CodimOneExtension.lean:806), which "needs a residue-degree-aware version, not a
  binder deletion"; and Milne 3.3 has NO IsAlgClosed in either project.


  BOTH FALSE, and they point opposite ways.


  (1) THE NAMED LEMMA IS NOT THE ONE THE CHAIN CALLS. isRegularLocalRing_stalk_of_smooth
  (:1237) delegates to isRegularLocalRing_of_isLocalization_atPrime_of_isStandardSmooth_of_perfectField
  (Albanese/SmoothPrimeRegularity.lean:665) -- sorry-free, ARBITRARY prime, PERFECT
  field -- and says so in its own docstring. The residue-degree-aware theorem r2 asked
  a lane to build was already in the tree and already in use.


  LANDED as a consequence (50049b5f93, eba86a9947): Albanese/CodimOnePerfectField.lean,
  rooted, 5 theorems, 0 sorries -- Stacks 00TT at every point, reducedness of a smooth
  scheme, the codim-1 DVR, Milne Theorem 3.1 and its CodimOneFree phrasing, all over
  [PerfectField k]. Plus Albanese/CodimOnePerfectFieldWitness.lean, 6 declarations,
  0 sorries: NON-VACUITY BY INSTANTIATION at P^1 over Q and over F_5, with every binder
  discharged by synthesis from the p1Over stack -- so the weakened binder is not forced
  closed again by the remaining ones. All 11 axiom-clean [propext, Classical.choice,
  Quot.sound] vs isAlbanese_pic0Et and fgaPicardRepresentability as controls that
  BOTH fire sorryAx.


  ONE ASYMMETRY WORTH INHERITING: reducedness does NOT widen by transcription. isReduced_of_smooth_of_isAlgClosed''s
  chart-ring input IS the closed-point argument. The perfect-field version goes regular
  local => domain => reduced at each stalk instead, naming no closed point.


  (2) THE LIVE LINK IS MILNE 3.3, ONE HOP ABOVE WHERE r2 PUT IT. indeterminacy_pure_codim_one_into_grpScheme
  binds [IsAlgClosed] on the section VARIABLE line (Milne33.lean:57) -- invisible
  in the declaration header, visible to #check, which is how r2 came to report it
  absent. MEASURED: restating it over [PerfectField] and closing by its own core FAILS
  to synthesize. Site: mem_domain_of_selfDiag_mem_domain (Milne33RowSection.lean:82)
  -> mathlib pointOfClosedPoint, needing the residue field at a closed point to BE
  the base field. False already over Q. Only 3 of the 12 modules in that cone carry
  the binder; the other two are the closed-point layers.


  SO THE REMAINING DISTANCE ON THE SUPPLY ROUTE, corrected: Milne 3.3''s closed-point
  row argument, and NOTHING ELSE in the Milne section I.3 chain. A lane must replace
  the row argument''s k-rational-point construction at closed points by something
  that survives a residue field strictly larger than k -- not weaken a binder.


  NOT PROGRESS ON THE SORRY, stated plainly: isAlbanese_pic0Et is UNTOUCHED, no antecedent
  is witnessed at any curve, and PerfectField is not Field -- the imperfect case (F_p(t))
  is outside all five theorems (measured: PerfectField (RatFunc (ZMod 5)) does not
  hold). The other residues from r2 stand unchanged: Sym^g C i.e. HasColimit (permDiagram
  C g) -- see AJC.albanese.symmetric -- the descent datum uniformly in the target,
  genus 0 (Mumford section 4), the basepoint condition, and the Abel-Jacobi transport
  to Pic0SchemeEt.'
