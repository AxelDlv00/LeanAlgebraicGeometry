id: AJC.rr.ledger
title: The AJCR chi-ledger, ported into AJC and unconditional at a curve
projects:
- Algebraic-Jacobian-Challenge
summary: 'RiemannRoch/Ledger/, 41 files, 9877 lines, sorry-free (re-measured at HEAD
  by the janitor

  pass of run 0074; the earlier "38 files, ~9.4k" was a mid-session count). PORT of
  the AJCR

  chi-ledger cone (proof bodies byte-identical bar named adaptations) plus four AJC-native

  rederivations.


  LANDED: chi(O(D)) = 1 - genus C + deg D on AJC''s OWN frozen genus, binders

  [IsProper][SmoothOfRelativeDimension 1][GeometricallyIrreducible] only -- both Module.Finite

  cohomology binders are SYNTHESISED, not assumed, measured at a synthesis site rather
  than at

  the declaration. Plus riemann_inequality, h0 unbounded along n*x, deg_divOf.


  AJC-NATIVE (not ports, no producer existed in either project): ledgerGenus_eq_genus
  (the

  universe gap is an annotation, discharged via chgUnivLinearEquiv); residueDeg =
  1 over kbar,

  which collapses the residue weighting to the bare coefficient sum; divOf agrees
  with

  WeilDivisor.principal coefficient-wise INCLUDING SIGNS.


  NOT DONE: the port is rootable (co-importability verified after fixing three name
  collisions,

  I-0576) but is imported by NOTHING -- AlgebraicJacobian.lean carries no RiemannRoch.Ledger

  import and nothing outside Ledger/ references it, re-confirmed at HEAD. So the root
  target

  elaborates none of the cone and the standing axiom probe never sees it. The root
  roll-up is

  outside this lane''s write scope; tracked as issue I-0600. Extension-uniformity
  and global

  generation remain untouched; single-field bounded vanishing is not supplied by this
  ledger.

  '
