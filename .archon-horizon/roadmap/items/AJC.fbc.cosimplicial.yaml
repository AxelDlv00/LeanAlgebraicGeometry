summary: "THE TWO LEAVES ARE NOT THE SAME OBLIGATION, and only one of them is still\
  \ a naturality problem (run 0068 r2; both children were rewritten with this finding,\
  \ verified by rfl). This item's previous summary -- \"split the remaining degreewise\
  \ Cech base-change naturality into the pushforward comparison and twisted-nerve\
  \ compatibility obligations\" -- mis-describes the state and is replaced.\n\n *\
  \ AJC.fbc.cosimplicial.pushforward -- NATURALITY IS GONE. cech_pushforward_baseChange_natIso_of_isIso\
  \ rebuilds the same cosimplicial isomorphism by whiskering cechOuterBC; both sides\
  \ are defeq to N >> (a composite), so coface compatibility IS the mate's own naturality.\
  \ What remains is one IsIso per index tuple, IsIso (cechOuterBC.app (pushPullObj\
  \ F (Over.mk j_sigma))), with the trap named in the child (an iso with those endpoints\
  \ is not IsIso of a given map). Route identified: mateEquiv_vcomp plus the sorry-free\
  \ openImmersion_beckChevalley. DO THIS LEAF FIRST.\n\n * AJC.fbc.cosimplicial.twisted\
  \ -- WHISKERING DOES NOT APPLY. Its RHS is the nerve of the BASE-CHANGED cover (degree-n\
  \ backbone in Over X', not Over X), so there is no natural transformation to whisker.\
  \ Its content is a comparison of TWO NERVES: that coverInterOpen_baseChange_eq is\
  \ compatible with the index-omission maps. HARDER than the sibling despite lighter\
  \ hypotheses.\n\nConsequence for pricing: do not treat these as one obligation or\
  \ estimate them together. Read each child.\n"
