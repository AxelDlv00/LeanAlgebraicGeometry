summary: 'Part 1 is closed: CurveProjectivity is explicitly imported and term-used
  at the FGA/Pic0 Kleiman boundaries, with import-only probes. The reusable FiniteInAffine,
  H-quasi-projective, carried-O(1), open-image, component, Cech, and scheme-fibre
  Euler substrate remains landed. Round 7 instantiates the campaign two-term finite
  replacement for every finite-type affine family line bundle after finite pushforward
  to P^1_A (a81f6efaec), and H0 semicontinuity now consumes that exported producer
  (80e43977a6). One global replacement also gives local constancy of the intrinsic
  finite-pushforward fibre Euler index; run0111 authored and verified that +55-line
  theorem, while automatic run0114 commit 3c20d01ba5 is only its durable carrier.
  The pointwise Euler wrapper is interface composition and earns zero Euler or Riemann--Roch
  movement. The 8708-job narrow build and import-only axiom probe pass with only propext,
  Classical.choice, and Quot.sound. Classification remains arbitrary-field PicEt producers
  +0, strict rep consumers +0, PicEt seam +0; fgaPicardRepresentability is untouched.
  Still open: compare finite-pushforward H1 and Euler back to the original curve family,
  prove Riemann--Roch degree, quotient and etale descent with pullback naturality,
  arbitrary-test Abel pin, intrinsic Pic^d carriers, and actual very-ample/FiniteInAffine
  Picard-piece assembly.'
