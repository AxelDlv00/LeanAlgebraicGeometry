summary: 'Part 1 is closed: CurveProjectivity is explicitly imported and term-used
  at the FGA/Pic0 Kleiman boundaries, with import-only probes. The reusable FiniteInAffine/H-quasi-projective/carried-O(1),
  open-image, identity-component, and section-translated-open substrate remains landed.
  Rounds 4-5 established intrinsic fibre Euler indices, derived/two-chart comparison,
  finite two-term virtual rank/local constancy, and the family-to-fibre Cech complex
  equivalence. Round 6 closes both scalar-dialect joins: the coherent Rank/H0 subset
  of foreign sweep b814b201c2 factors kernel transport and adds semilinear quotient-by-range
  transport; 38686217d3 adds SchemeEulerIndex, identifies the intrinsic fibre index
  with the signed base-changed family Cech index at the transported Spec point, and
  consumes an explicit TwoTermFiniteReplacement; 045d179a75 roots the module. Narrow
  builds, literal #print axioms, independent import-only review, and the 8934/8934
  umbrella build pass with only propext, Classical.choice, and Quot.sound on new declarations.
  Classification remains arbitrary-field PicEt producers +0, strict rep consumers
  +0, PicEt seam +0; fgaPicardRepresentability is untouched. Still open: instantiate
  the finite replacement for the campaign object (Noetherianity, section-module flatness,
  finite kernel/cokernel), prove finite-pushforward H1/Euler transfer and Riemann-Roch
  degree, quotient/etale descent plus pullback/local constancy, arbitrary-test Abel
  pin, intrinsic Pic^d carriers, and actual very-ample/FiniteInAffine Picard-piece
  assembly.'
