title: 'Picard degree pieces: FiniteInAffine and very-ample substrate'
projects:
- Algebraic-Jacobian-Challenge
summary: 'Part 1 is closed: CurveProjectivity is explicitly imported and term-used
  at the FGA/Pic0 Kleiman boundaries, with import-only probes. The reusable FiniteInAffine/H-quasi-projective/carried-O(1),
  open-image, identity-component, and section-translated-open substrate remains landed.
  Round 4 added the sheaf-module functorial Euler-index layer and finite two-term
  virtual-rank/local-constancy substrate. Round 5 added the derived-to-two-chart Euler
  comparison (7482b93e54), generic kernel/cokernel transport across two-term equivalences
  (9c17cf054d), and the substantive residue-field-linear family-to-fibre Cech complex
  comparison with H0-kernel and H1-quotient consequences (820538b96d). FiberEulerIndex
  now genuinely consumes the derived comparison on any two-affine fibre cover (38863e8c3d);
  this is API/import-closure credit only, not assembly of the family comparison. Follow-up
  commit 3d902798c7 gives the Cech complex comparison a single upstream owner in RigidPushforwardFiberChart,
  rewires surjectivity plus the Rank kernel/cokernel results as consumers, and removes
  duplicated high-heartbeat elaboration. Narrow builds and literal axiom probes are
  green with only propext, Classical.choice, and Quot.sound. Arbitrary-field PicEt
  producers +0, strict rep consumers +0, and fgaPicardRepresentability remains untouched.
  Still open: transport between residue-field and Spec-global-section scalar dialects
  to join the scheme index to Unit 3, finite replacements/finiteness and Riemann-Roch
  degree, quotient/etale descent and pullback/local constancy, arbitrary-test Abel
  pin, intrinsic Pic^d carriers, and actual very-ample/FiniteInAffine Picard-piece
  assembly.'
