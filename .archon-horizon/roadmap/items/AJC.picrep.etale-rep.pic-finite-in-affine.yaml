summary: 'Verified substrate: H-quasi-projective finite-projective-space immersions
  with carried O(1), stability and FiniteInAffine transport/aggregation are in 9c60b37643
  and 5edfb3ad09; curve projectivity is executable in both Kleiman consumers via 8c0f0550e6.
  Commit ec949eb9ac32 adds exactly three adapters: source-isomorphism transport, an
  Over-base open-image isomorphism built from mathlib Scheme.Hom.isoImage, and carried
  very-ampleness transport to that image. It is adapter progress, not producer progress.
  Still open: intrinsic Pic^d carriers, actual Picard-piece H-quasi-projective/very-ample
  witnesses, degree-shift/translation and coproduct assembly, and an arbitrary-field
  PicEt producer. The central fgaPicardRepresentability sorry is unchanged; no rep
  consumer was added.'
