summary: 'Verified substrate now also exposes the Picard identity-component open (9ebdbf9dc5)
  and, for any global k-section, its translated open component together with the carrier
  equality and Over isomorphism to Pic0 (668f93de3c). Both narrow builds and import-only
  axiom probes are green with exactly propext, Classical.choice, and Quot.sound. Classification
  is API exposure plus section-indexed component substrate/adapters, not a PicEt producer;
  strict rep-binder and RepresentableBy metrics are unchanged. The honest next unit
  is the intrinsic etale-natural family-degree morphism from relPresheaf to locally
  constant integer functions, including quotient invariance, additivity, base-change
  naturality, and local constancy. A standalone target wrapper would duplicate mathlib
  continuousMapPresheafAb infrastructure and is not enough. Still open: intrinsic
  Pic^d carriers, degree-shift/cover assembly, actual Picard-piece H-quasi-projective/very-ample
  witnesses, and an arbitrary-field PicEt producer. The central fgaPicardRepresentability
  sorry is unchanged and no rep consumer was added.'
