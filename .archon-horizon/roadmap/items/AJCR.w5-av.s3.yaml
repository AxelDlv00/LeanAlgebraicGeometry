summary: 'S3 (WORKSHEET-FIRST, risk R3): $\mathrm{SmoothOfRelativeDimension}\ (g)$
  assembly — the frozen numeral.


  **The CRITERION is landed and R3''s last named risk is dissolved (run 0073 r5)**
  —

  `AbelianVariety/RelativeDimensionLocal.lean`, `lake env lean` EXIT=0. `SmoothOfRelativeDimension
  n`

  is `IsLocalAtSource` at the Zariski precoverage (verified by `inferInstance`, with
  `Smooth` as a

  control), so `IsLocalAtSource.of_zeroHypercover` applies: the obligation is **"cover
  `d.J.left` by

  opens on which the count holds"**, not "exhibit a chart at every scheme point".
  The `k`-rational

  translates of the identity chart therefore need only **cover** — precisely the weaker
  demand

  worksheet §3''s caveat feared they could not meet.


  Landed: `smoothOfRelativeDimension_comp_iso` (the source-iso transport, named because

  `infer_instance` does *not* find it — the instance is on the property, not the composite),

  `smoothOfRelativeDimension_of_zeroHypercover` plus its `iff` form, and the two Jacobian
  shapes

  `JacobianData.smoothOfRelativeDimension_of_translation_cover` /

  `..._pointTranslationIso` (the X2 bridge at the level the criterion consumes).


  **TWO INPUTS REMAIN, and the file names both rather than hiding them.** (1) The
  **numeral**:

  $n = g$ at the identity is T5, itself conditional on the T3/T4 $\varepsilon$-kernel
  count, so S3''s

  numeral is still gated on T4. (2) The **cover**: that translated identity charts
  cover `d.J.left`,

  carried as the `hcov` hypothesis. If (2) fails, worksheet §3''s $\bar{k}$ route
  plus the t4-§5

  codescent brick is the documented contingency — **this work does not retire that
  brick**, it only

  removes the third input (pointwise reachability).


  Method note worth keeping (inbox `I-0695`): the caveat was a *correct* reading of
  the class''s

  unfolded statement that priced a consequence the statement does not have. Unfolding
  a class says

  what must be **produced**; it says nothing about the machinery available to produce
  it.

  '
