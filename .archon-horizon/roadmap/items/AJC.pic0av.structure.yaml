id: AJC.pic0av.structure
title: Smoothness, properness, and irreducibility
projects:
- Algebraic-Jacobian-Challenge
summary: "Smoothness, properness, and irreducibility of Pic^0. Irreducibility and\
  \ the group structure are DONE\n(Pic0.geometricallyIrreducible, Pic0.grpObj). The\
  \ two open conjuncts each now have ONE residue, and run\n0067 r3 REPLACED BOTH with\
  \ statements the pinned mathlib has vocabulary for.\n\nSMOOTHNESS -- residue is\
  \ IsReduced of ONE scheme, over kbar.\n  Pic0.smooth_of_isReduced_algebraicClosureBaseChange\
  \ (Picard/Pic0AbelianVariety.lean)\ntakes IsReduced (Pic0 x_{Spec k} Spec kbar)\
  \ and nothing else. Previously the residue was the CLASS\nGeometricallyReduced,\
  \ which quantifies over every field base change and has no producer here; the\n\
  converse implication (kbar => all fields) is the transcendental half, absent from\
  \ mathlib v4.31 and\nmachine-confirmed absent by both projects (I-0495). So this\
  \ is a STRICTLY weaker hypothesis.\n\nHow it became available: mathlib reduces to\
  \ the kbar case internally but through a PRIVATE lemma.\nBoth projects had recorded\
  \ 'make smooth_of_grpObj_of_isAlgClosed public' as an upstream PR. Not needed\n\
  -- private hides the name, not the proof, and the proof uses only public API. Re-derived\
  \ in\nPicard/GroupSchemeSmoothAlgClosed.lean (sorry-free, rooted, one mathlib import,\
  \ portable to AJCR).\nMEASURED at a probe site with the HasPicScheme gate ASSUMED\
  \ not synthesised: probe axiom-clean,\ncontrol Pic0.smooth reports sorryAx.\n\n\
  PROPERNESS -- residue is a LIFTING statement, not quasi-projectivity.\n  Pic0.proper_of_valuativeCriterion\n\
  gets IsProper from ValuativeCriterion.Existence ALONE. The other three conjuncts\
  \ are theorems of the\nfile: isSeparated, locallyOfFiniteType, quasiCompact (the\
  \ last was filed 'not needed for the proper\nassembly' -- it is exactly what this\
  \ route consumes).\nThis retires the standing caveat I-0074 Caveat 2, that Kleiman\
  \ th:qpp&p argues via quasi-projectivity\nand mathlib v4.31 has no such vocabulary.\
  \ The valuative criterion (Stacks 01KF) is mathlib's\nUniversallyClosed.of_valuativeCriterion.\
  \ Through representability the lifting condition IS 'an\ninvertible sheaf on C x_k\
  \ Spec K extends over the valuation ring' -- the classical content of\nproperness,\
  \ and the same species of statement as this chapter's DualNumber.free_of_cyclic_mod_eps.\n\
  \nSTILL OPEN, and neither is claimed proved: reducedness over kbar; the valuative\
  \ existence half.\nEarlier routes retained beside the new ones (smooth_of_forall_isReduced,\
  \ universallyClosed_of_ambient,\nuniversallyClosed_of_baseChange). ajc-etale-pic's\
  \ Pic0Et.smooth/.proper carry the same two residues and\nboth reductions apply verbatim\
  \ there -- their file, not edited."
