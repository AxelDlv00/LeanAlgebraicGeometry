title: Smoothness, properness, and irreducibility
projects:
- Algebraic-Jacobian-Challenge
summary: "Prove Pic0 is smooth and proper; combine these with the completed geometric-irreducibility\
  \ and\ngroup-object infrastructure to obtain the abelian-variety structure.\n\n\
  STATE (run 0067, ajc-pic0av, commit 082109747): BOTH structural sorries are now\
  \ assemblies over\nstrictly smaller named obligations, and the discharged parts\
  \ are PROVED rather than asserted. The\npinned statements smooth / proper / isAbelianVariety\
  \ keep their types verbatim.\n\nSMOOTHNESS -- fully reduced to GeometricallyReduced\
  \ (Pic0Scheme C).hom, and nothing else.\nPic0.smooth_of_geometricallyReduced is\
  \ PROVED from mathlib's smooth_of_grpObj\n(AlgebraicGeometry/Group/Smooth.lean:64),\
  \ which ALREADY CONTAINS the two things the old docstring\ndescribed as remaining\
  \ work: the propagation of smoothness from the identity by the translation\nisomorphisms\
  \ GrpObj.mulRight, and the descent to a non-closed base field by\nMorphismProperty.of_pullback_snd_of_descendsAlong\
  \ along Spec kbar -> Spec k. So neither translation\nnor the tangent space is owed\
  \ here. Its two structural inputs are landed in the file:\nPic0.locallyOfFiniteType,\
  \ and Pic0.grpObj keyed at the Over.mk spelling (Over.mk X.hom is X by\nstructure\
  \ eta for Comma, so the letI ascription is pure defeq; instance SEARCH alone will\
  \ not unfold\nOver.mk, which is why it is written out).\n  The single open input,\
  \ Pic0.geometricallyReduced, is a genuine theorem and NOT a synthesis step:\nSmooth.geometricallyReduced\
  \ (Curve/GeometricallyReduced.lean) is the CONVERSE direction and using it\nwould\
  \ be circular, and no other producer exists in the import closure for a scheme not\
  \ already known\nsmooth. The mathematics is Cartier's theorem in characteristic\
  \ zero (Kleiman 5 Cor cor:ch0) and, in\ncharacteristic p, the curve-specific H^2(C,O_C)\
  \ = 0 making the deformation functor unobstructed\n(Kleiman 5 Cor cor:sm, Ex ex:jac).\
  \ H^2 vanishes on a curve for dimension reasons, which is why the\ncurve case holds\
  \ in EVERY characteristic unlike the general Picard scheme (Igusa's surface).\n\
  \  This confirms in Lean the assessment recorded at Jacobian.lean:377-394.\n\nPROPERNESS\
  \ -- reduced to UniversallyClosed alone.\nPic0.proper_of_universallyClosed is PROVED:\
  \ mathlib's IsProper is the three-field structure\nIsSeparated + UniversallyClosed\
  \ + LocallyOfFiniteType (Morphisms/Proper.lean; quasi-compactness is\nNOT a field,\
  \ being implied by universal closedness), and TWO OF THE THREE were already theorems\
  \ of\nthis file -- Pic0.isSeparated and Pic0.locallyOfFiniteType. They are now used\
  \ rather than merely\npresent.\n  The single open input, Pic0.universallyClosed,\
  \ is additionally attackable through the already-proved\nPic0.universallyClosed_of_baseChange\
  \ (Stacks 02KS fpqc descent), which reduces it to the algebraically\nclosed case\
  \ where Kleiman's projectivity argument lives. Note the standing caveat of inbox\
  \ I-0074\n(Caveat 2): PicScheme.smoothProperQuotient is weaker than Kleiman lm:qt\
  \ and unprovable as stated\nbecause mathlib v4.31 has no quasi-projectivity vocabulary\
  \ -- which is exactly the vocabulary\nKleiman's first conclusion needs. So expect\
  \ this to be discharged by base change, NOT by formalising\nquasi-projectivity from\
  \ scratch.\n\nMEASUREMENT CAVEAT, per the human's standing warning on inbox I-0493:\
  \ smooth and proper report CLEAN\naxioms as stated only because they quantify over\
  \ [HasPicScheme C] and the caller discharges it. Do not\nquote a declaration-level\
  \ axiom check here as a completeness claim; measure at a synthesis site with\nscripts/axiom-frontier.lean.\n"
