title: Smoothness, properness, and irreducibility
projects:
- Algebraic-Jacobian-Challenge
summary: "Smoothness, properness and irreducibility of Pic^0. Irreducibility and the\
  \ group structure are\nDONE (Pic0.geometricallyIrreducible, Pic0.grpObj). TWO sorries\
  \ remain in\nPicard/Pic0AbelianVariety.lean: geometricallyReduced (:1102) and universallyClosed\
  \ (:1332).\nNOT ADVANCED in run 0067 r4 -- that session closed AJC.rr.principal,\
  \ the degree map, and the\ntangent lane's generator obligation instead. The state\
  \ below is r3's and was re-read, not\nre-derived.\n\nSMOOTHNESS -- residue is IsReduced\
  \ of ONE scheme over kbar, and it discharges TWO obligations.\n  Pic0.smooth_of_isReduced_algebraicClosureBaseChange\n\
  \  Pic0.geometricallyReduced_of_isReduced_algebraicClosureBaseChange\nBoth axiom-clean.\
  \ The single hypothesis IsReduced (Pic0 x_{Spec k} Spec kbar) gives smoothness\n\
  AND the class GeometricallyReduced (via the in-tree instance Smooth.geometricallyReduced),\
  \ so it\nalso discharges this file's own open sorry Pic0.geometricallyReduced. Compare\n\
  smooth_of_forall_isReduced, which asks one reducedness statement PER field extension.\n\
  Available because mathlib reduces to the kbar case through a PRIVATE lemma; both\
  \ projects had\nrecorded \"make smooth_of_grpObj_of_isAlgClosed public\" as an upstream\
  \ PR, which is not needed --\nprivate hides the name, not the proof, and that proof\
  \ uses only public API. Re-derived in\nPicard/GroupSchemeSmoothAlgClosed.lean (sorry-free,\
  \ rooted, single mathlib import).\n\nCORRECTION KEPT ON THE RECORD: the criterion\
  \ is NOT strictly weaker than mathlib's, it is a\nRESTATEMENT. IsReduced-over-kbar\
  \ => GeometricallyReduced is absent from mathlib but PRESENT in\nAJC (Smooth.geometricallyReduced),\
  \ so at these binders the two are interprovable. The error was\nmeasuring \"absent\"\
  \ in the edited file's 99-module cone instead of the root's 215. Still worth\nhaving:\
  \ interprovable is not equally attackable, and GeometricallyReduced has no non-circular\n\
  producer here.\n\nTHE MATHEMATICS STILL OWED, for whoever takes it: in characteristic\
  \ zero this is Cartier -- every\ngroup scheme locally of finite type over a field\
  \ of characteristic zero is reduced. In\ncharacteristic p it is curve-specific,\
  \ and the input is H^2(C,O_C) = 0, which holds for dimension\nreasons on a curve;\
  \ that is why Pic^0 of a CURVE is smooth in every characteristic while\nPic_{X/k}\
  \ of a surface need not be (Igusa).\n\nPROPERNESS -- residue is a LIFTING statement,\
  \ not quasi-projectivity.\n  Pic0.proper_of_valuativeCriterion       IsProper from\
  \ ValuativeCriterion.Existence ALONE\n  Pic0.universallyClosed_of_valuativeCriterion\
  \   its universal-closedness half\nThe other three conjuncts are theorems of the\
  \ file: isSeparated, locallyOfFiniteType,\nquasiCompact. This retires I-0074 Caveat\
  \ 2, that Kleiman th:qpp&p argues via quasi-projectivity\nand mathlib v4.31 has\
  \ no such vocabulary. Through representability the lifting condition IS \"an\ninvertible\
  \ sheaf on C x_k Spec K extends over the valuation ring\".\nA SECOND, INDEPENDENT\
  \ reduction is also in the tree and is worth trying first:\nPic0.universallyClosed_of_ambient\
  \ moves the obligation off the identity component entirely --\nPic^0 -> Pic is a\
  \ CLOSED immersion (the clopen conjunct of isOpenSubgroupScheme), so universal\n\
  closedness of Pic_{C/k} suffices, and that is where Kleiman's theorem actually speaks.\n\
  Caveat from review: mathlib carries the valuative criterion as an EQUALITY, so that\
  \ hypothesis is\ninterprovable with the sorry it replaces. Change of shape, not\
  \ of strength -- but the shape is\nwhat is attackable.\n\nSTILL OPEN, neither claimed\
  \ proved: reducedness of Pic0 x_k Spec kbar; the valuative existence\nhalf (equivalently\
  \ universal closedness of the ambient Pic). Earlier routes retained beside the\n\
  new ones (smooth_of_forall_isReduced, universallyClosed_of_ambient,\nuniversallyClosed_of_baseChange).\
  \ ajc-etale-pic's Pic0Et.smooth/.proper carry the same two\nresidues and both reductions\
  \ apply verbatim there -- their file, not edited.\n\nMEASUREMENT DISCIPLINE for\
  \ this node: smooth/proper quantify over [HasPicScheme C] and report\nCLEAN axioms\
  \ as stated. Measure at a SYNTHESIS SITE with a control, or the completeness number\
  \ is\nnot true.\n"
