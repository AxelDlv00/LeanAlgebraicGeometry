id: AJC.pic0av.structure
title: Smoothness, properness, and irreducibility
projects:
- Algebraic-Jacobian-Challenge
summary: "Smoothness, properness, and irreducibility. TWO sorries in Picard/Pic0AbelianVariety.lean:\n\
  geometricallyReduced (:1135) and universallyClosed (:1373). Both are fully reduced\
  \ -- the\nstructural assembly is discharged and each is now a single named geometric\
  \ input. Geometric\nirreducibility and the GrpObj structure are already THEOREMS,\
  \ not obligations.\n\nSMOOTHNESS: one hypothesis suffices, and it is a statement\
  \ about a SINGLE scheme. IsReduced of\nPic^0 x_k Spec kbar gives smoothness (smooth_of_isReduced_algebraicClosureBaseChange,\
  \ resting on\nmathlib's smooth_of_grpObj which already contains BOTH the translation\
  \ argument and the descent\nalong Spec kbar -> Spec k) AND it discharges geometricallyReduced\
  \ itself\n(geometricallyReduced_of_isReduced_algebraicClosureBaseChange, via Smooth.geometricallyReduced).\n\
  So the two apparently independent obligations collapse to one. Do not state a version\
  \ quantified\nover all field extensions: GeometricallyReduced has NO MorphismProperty.DescendsAlong\
  \ instance in\nmathlib v4.31 (checked here and independently by AJCR, I-0495), so\
  \ the general->kbar reduction is\nnot available from mathlib -- but this project\
  \ owns the converse through\nCurve/GeometricallyReduced.lean, which is what makes\
  \ the single-scheme form legitimate.\nMathematics owed: Kleiman section 5 cor:sm\
  \ -- H^2(C,O_C) = 0 on a curve makes the deformation\nfunctor of an invertible sheaf\
  \ unobstructed. Characteristic-free BECAUSE dim C = 1 (Pic_{X/k} can\nbe non-smooth\
  \ in char p for surfaces -- Igusa).\n\nPROPERNESS HAS EXACTLY ONE LIVE ROUTE, and\
  \ two are refuted:\n * LIVE: universallyClosed_of_valuativeCriterion. Needs ValuativeCriterion.Existence\
  \ of\n   (Pic0Scheme C).hom; the QuasiCompact side condition mathlib's criterion\
  \ wants is already a\n   theorem here. Through representability a Spec R-point IS\
  \ a relative Picard class, so the\n   lifting statement is the concrete assertion\
  \ that an invertible sheaf on C x_k Spec K extends\n   over the valuation ring --\
  \ the classical content of properness, and the same species as\n   DualNumber.free_of_cyclic_mod_eps.\n\
  \ * REFUTED, do not retry: the ambient route. Universal closedness of Pic_{C/k}\
  \ is not merely hard,\n   it is FALSE -- it forces CompactSpace on an infinite disjoint\
  \ union over deg in Z\n   (Picard/AmbientPicNotProper.lean, 5 declarations, axiom-clean).\
  \ This does NOT affect the\n   Pic^0 statement: Pic^0 is quasi-compact, Pic is not.\n\
  \ * REFUTED on vocabulary: the quasi-projectivity route (Kleiman th:qpp&p). Mathlib\
  \ v4.31 has no\n   quasi-projectivity API at all, which is also why smoothProperQuotient\
  \ is unprovable as stated\n   (I-0074 Caveat 2 -- and do NOT reintroduce a global\
  \ instance for it).\n\nMEASURE AT A SYNTHESIS SITE. smooth/proper and all their\
  \ reductions quantify over\n[HasPicScheme C] and therefore report CLEAN axioms at\
  \ the declaration while the caller's\nsynthesis supplies sorryAx. Every clean claim\
  \ in this leg has been probed against controls that\nDO fire sorryAx; keep that\
  \ discipline or the completeness number is fiction.\n"
