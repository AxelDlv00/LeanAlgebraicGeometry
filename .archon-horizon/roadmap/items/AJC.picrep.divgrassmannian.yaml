summary: 'ACTIVE, owned by pic-f. D2 prime substrate is unconditional in the divisor
  representative: twist/evaluation/quotient/class APIs respect DivFamily.Rel, affine
  Nakayama globalizes residue-field surjectivity, and affine pullback conjugacy identifies
  native base-change maps with pulled-back evaluation maps. The finite-support fibre-rank
  bridge and DivFamily.pushforward_isLocallyFreeOfRank derive rank d from HasFiberDeg
  on an affine Spec R test base, with explicit IsNoetherianRing and LocallyQuasiFinite
  support premises; this is not yet the arbitrary-Over(S) twisted-target producer.
  The named projective twist witness has no rational-point binder but is Scheme-0
  at this mathlib pin. New support result: annihilator ideals and proper schematic
  support are invariant under module isomorphism; tensor symmetry gives right-factor
  support, and DivFamily.twist_hasProperSupport is unconditional. Remaining D2 gates
  are twisted-target finite presentation/flatness, fibre-H0/rank invariance, and the
  evaluation epi; pic-b owns tensor-section globalization. Verified commits: 140999ffda,
  908779ad72, 8cd8b2246d, 459d8b1cb4, fa5b5561a5, 52bef57944, 54bbb07580.'
