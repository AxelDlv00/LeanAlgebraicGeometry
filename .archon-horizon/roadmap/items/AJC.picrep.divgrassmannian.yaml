id: AJC.picrep.divgrassmannian
title: 'D2'': Grassmannian comparison for the degree-d divisor functor'
projects:
- Algebraic-Jacobian-Challenge
summary: 'ACTIVE, partial. 30ddedbbc0 constructs an actual Grassmannian quotient over
  a noetherian affine test on a smooth proper geometrically integral curve over any
  field: canonical flat base change and kernel Ext1 lifting give evaluation epi, and
  the curve rank producer gives local freeness. 4fc01fd80e proves canonical base-change
  pasting and evaluation compatibility for arbitrary test morphisms, consuming the
  prior twisted-quotient naturality theorem. Next: identify the existing finite-support
  base-change isomorphism with canonicalBaseChangeMap, then derive quotient-class
  naturality. The finite-support geometry is already proved; Flat of the transition
  is not needed. Also open: positive-degree DivFamily construction, uniform kernel
  Ext1 vanishing and the cohomology-carrier comparison (I-2327), monicity and a representing
  Grassmannian object. Narrow builds and standard-axiom audits pass. No representing
  scheme or PicEt producer is claimed; fgaPicardRepresentability remains open with
  no rational-point binder.'
