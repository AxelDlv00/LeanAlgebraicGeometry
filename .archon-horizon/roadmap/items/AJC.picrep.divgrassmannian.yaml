summary: 'ACTIVE. D2'' substrate landed without a rational-point or representability
  binder: unconditional twist/evaluation/quotient/class APIs with DivFamily.Rel descent;
  arbitrary base change and fibre-rank/H0 for finite schematic support; and DivFamily.pushforward_isLocallyFreeOfRank,
  deriving rank d from HasFiberDeg d on an affine Spec R test base. The rank bridge
  is explicitly conditional on [IsNoetherianRing R] and LocallyQuasiFinite support,
  so it is not the arbitrary-Over(S) twisted-target producer. The named projective
  twist/local-triviality witness has no rational-point binder but is Scheme-0 only
  at this mathlib pin. Remaining D2 gates are twisted-target finite-presentation/flatness,
  right-factor support, fibre-H0 invariance, and the evaluation epi; pic-b owns the
  tensor-section substrate. Row released/unowned; commits a912ea5325 and a166dd4ef6
  are pinned.'
