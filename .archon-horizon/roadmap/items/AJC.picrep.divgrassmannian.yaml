title: 'D2'': Grassmannian comparison for the degree-d divisor functor'
projects:
- Algebraic-Jacobian-Challenge
summary: 'ACTIVE, partial. Constructed quasi-coherent O(D) and identified its underlying
  field sheaf (166ffb5790, 38b0530ce0); the degree bound transports uniformly across
  field extensions (957552a1c4). Restriction of scalars preserves kernels and epimorphisms,
  giving global-section lifting (ebef25f77d) and D2 evaluation epimorphy from total-pullback
  kernel HModule H1 (d5a1557fb9). Prior canonical base-change/naturality and candidate
  epi results remain available. Next: construct D_x from local Cartier generators,
  identify kernel(x.q) with O(-D_x) and its twist with O(A-D_x), prove deg(D_x)=d,
  and pass fibrewise vanishing to the relative family. I-2327, D2, and fgaPicardRepresentability
  remain open; no PicEt representing scheme was produced.'
