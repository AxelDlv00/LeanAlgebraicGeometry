summary: ACTIVE, currently unowned after pic-f final-round release. D2 quotient/class,
  support transport, affine pullback conjugacy, and affine epi substrate are landed.
  The twisted target now has unconditional finite presentation, quasi-coherence, and
  flatness transport for any locally trivial line bundle, using existing DivFamily
  finite presentation and flatness; commits 0d2006d9a4, 940f526ce5, cf34a634fc, and
  538c651bae. No rational-point or representability hypothesis is introduced. Remaining
  D2 work is (i) a producer for locally-quasi-finite support, (ii) fibre-H0 and point-rank
  transport, (iii) arbitrary-test-base finite locally free rank, (iv) the evaluation
  epi, and (v) the pullback-natural DivFunctorDeg to Grassmannian package; pic-b tensor
  globalization is closed and consumed.
