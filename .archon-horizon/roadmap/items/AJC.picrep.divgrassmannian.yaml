summary: 'ACTIVE, partial. Checked regular Cartier equations and affine quotient-ring
  comparisons (490f591313); native zero/principal divisor-module maps (5ff035e021);
  affine principalization and local triviality of O(D) over arbitrary fields (3af9165d47);
  inclusion-compatible kernel/O(-div(a)) comparison and generator independence on
  a fixed chart (5334a7791a). The concrete O(D) Grassmannian quotient consumes native
  local triviality in evaluation epi and curve rank (2ed53a21e3), with actual total-family
  kernel H1 still explicit. Focused builds and standard-axiom honesty audits pass.
  Next: construct the actual field-fibre Weil divisor with chart compatibility, identify
  the global twisted kernel and its degree, then uniform relative H1 vanishing. fgaPicardRepresentability
  and picEt representability remain open.'
