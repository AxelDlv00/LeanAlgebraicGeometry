title: 'C9a-0: the class-indexed witness locus over an affine base (transport 0, untwisted)'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'DONE 2026-07-26 (run 0048 round 2), commits e47d57de1 + 503a50905,

  Picard/Pic0ChartLocusClass.lean.  RESCOPED the same round after a fresh-context
  audit: this

  is NOT CHART-U(b), and the declaration was renamed to give the reserved name back.


  WHAT LANDED: `cechWitnessLocus pi c : Set (PrimeSpectrum B)` -- over an AFFINE base,
  for an

  UNTWISTED CechPic class, the set of points where the fibre class has an effective
  witness

  divisor with vanishing H^1 -- with `mem_cechWitnessLocus_iff_of_datum` (any one
  presenting

  datum is a sound and complete test), `mem_cechWitnessLocus_iff_exists`, and

  `isOpen_cechWitnessLocus`.  Certificate-free, divRep-free, axioms clean.


  WHY IT MATTERS ANYWAY: it is the first datum-choice-free openness statement in the
  campaign.

  The landed engine (BasicOpenCocycleDatum.isOpen_setOf_exists_witness_h1_vanishing)
  is stated

  for a CHOSEN datum, and a locus indexed by a Picard class may not depend on a presentation.

  Call it transport (0); both of DAT-B''s §1.6 amendments presuppose it and neither
  states it.


  WHAT IT IS NOT, and this matters because two lanes co-signed the name: `chartLocus
  c lambda`

  (w4-datc §3.3 CHART-U(a)) lives over a GENERAL TEST, is indexed by a PLUS CLASS,
  and reads

  the TWISTED fibre class lambda_t . theta^m . (-Sigma); w4-datb §1.6 amends it to
  the SPLIT

  predicate over a finite separable L/kappa(t); and `isOpen_chartLocus` is dat-b row
  B-4''s

  ASSEMBLY.  Three of its four inputs are still missing -- see leaf `chart-u`.

  '
