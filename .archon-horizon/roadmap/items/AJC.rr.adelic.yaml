id: AJC.rr.adelic
title: Adelic Riemann--Roch and cohomological finiteness
projects:
- Algebraic-Jacobian-Challenge
summary: 'Sorry-free. The adelic model of H^0 and H^1 for a smooth proper curve: a
  nonconstant map to P^1, its finiteness, the P^1 base case and chart data, the adelic
  cokernel, the Euler-characteristic ledger, and unconditional finiteness of the genus.
  Modules: RiemannRoch/CohomologyKit and the RiemannRoch/Adelic package (Substrate,
  NonconstantToP1, FiniteMapToP1, FinitenessP1, P1BaseCase, P1ChartData, Cokernel,
  ChiLedger, CechAcyclicInstance, CechComparisonGate, GateInstances, GenusFiniteness,
  GenusUnconditional).'
