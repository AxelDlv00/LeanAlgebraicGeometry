id: AJC.picrep.projectivity
title: Smooth proper curves over a field are projective
projects:
- Algebraic-Jacobian-Challenge
summary: 'Constructed, without new hypotheses, a relative morphism C -> P(J; Spec
  k) from the Laurent two-chart finite map: normalized coordinates algebra-generate
  both source charts, the local maps glue globally, and the composite to Spec k is
  C.hom. Remaining: identify arbitrary coordinate charts D_+(X_i) with affine space,
  transport the local factors, apply the landed generator-to-closed-immersion theorem,
  then use target-local immersion and proper + immersion => projective.'
