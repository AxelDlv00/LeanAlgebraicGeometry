- Algebraic-Jacobian-Challenge-Rebuild
summary: 'The general per-K/per-lambda producer and its Pic0 specialization are complete:
  finite-separable splitting, the positive FLV twist, actual rational-point-image
  support, residue degree one, baseSubtraction, and IsSplitWitness now additionally
  expose translator degree genus and finite-support/residue-one/exact descended-class
  compatibility for the same subtraction divisor. Commit 7decac68b5 roots these APIs
  in Pic0CriticalPath and 42b53cf822 registers their lean_ok graph nodes. The remaining
  blocker is a production arbitrary-affine presentation family: cartesian pushforward/base-change
  control plus tied H0/H1/rank data and coherent native presentations on every affine
  pullback, sufficient to feed PicRankOneOpen/FibrePresented. The native line-bundle
  piece already exists; no fieldwise substitute, high-degree Abel quotient, or Galois
  descent route is used. Blocked on AJCR.review-plan.p4-family-producer.'
