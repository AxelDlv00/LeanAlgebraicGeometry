title: Abel-Jacobi and symmetric-power factorisation
projects:
- Algebraic-Jacobian-Challenge
summary: "Abel-Jacobi and symmetric-power factorisation. Milne's argument over the\
  \ symmetric power\nis PROVED (Albanese/AlbaneseFromData.lean, axiom-clean); the\
  \ residue is the OBJECT\nSym^g C, equivalently the single instance HasColimit (permDiagram\
  \ C g)\n(SymPowColimit.hasColimit_permDiagram_iff -- an equivalence, so the reduction\
  \ is lossless).\n\nRoute: explicit Scheme.GlueData from affine charts. The bill\
  \ is four items; 2 are supplied\nas of run 0069 r6, and BOTH of the two closed this\
  \ round had been recorded by earlier\nsessions of this same lane as genuine walls:\n\
  \n 1. DONE. G-stable affine open neighbourhoods for a finite group acting by automorphisms\n\
  \    (Albanese/StableAffineCoverGroup.lean), plus its S_n instantiation\n    exists_stable_affineOpen_perm.\
  \ The instantiation was blocked only by a universe binder\n    copied from the Galois\
  \ source (G : Type u tied to Scheme.{u}, excluding\n    Equiv.Perm (Fin n) : Type\
  \ 0); the prime-avoidance lemma was already index-polymorphic.\n 2. DONE. The Aut-valued\
  \ S_n-action MonObj.permAutHom (Albanese/GrpObjFoldSum.lean).\n    Recorded for\
  \ three rounds as \"not free\" because permAut was never shown invertible;\n   \
  \ permAut sigma-inverse is a two-sided inverse, since permAut is a HOMOMORPHISM\
  \ for\n    composition. The inverse in SymPowColimit.permEnd is an artefact of End's\
  \ reversed\n    multiplication, not a fact about permAut.\n 3. DONE. The n-ary coproduct-of-commutative-algebras\
  \ = n-fold tensor power comparison,\n    WITH its permutation action matched to\
  \ permAlgHom (Albanese/TensorPowerCoproduct.lean:\n    coprodLift, existsUnique_coprodLift,\
  \ coprodLift_permAlgHom). Previously recorded as\n    absent from mathlib on the\
  \ basis of the binary pushout; in fact both halves were in\n    mathlib unbundled\
  \ -- uniqueness IS PiTensorProduct.algHom_ext, existence is one\n    liftAlgHom.\
  \ Note the equivariance is on f . e-inverse, not f . e (permAlgHom is an\n    ANTI-homomorphism,\
  \ unlike permAut).\n 4. OPEN, and genuinely geometric: the overlap/cocycle agreement\
  \ of the chart quotients,\n    and OrbitsInAffineOpen FOR THE CURVE -- where quasi-projectivity\
  \ enters and mathlib has\n    no such vocabulary at this pin. This is the honest\
  \ remaining wall.\n\nAlbaneseUP.lean's six pinned sorries are unchanged and should\
  \ stay so: they are stated\nagainst a sorry-bodied SymmetricPower, so discharging\
  \ them would establish nothing.\nabelJacobi is blocked EARLIER than any Pic0 fact\
  \ -- O(Delta - {P0}xC - Cx{P0}) on CxC is\nconstructed nowhere, and no lane produces\
  \ a DivFamily to feed PicScheme.abelMap.\n"
