summary: "Abel-Jacobi and symmetric-power factorisation. UNBLOCKED 2026-07-28 (run\
  \ 0069, ajc-albanese):\nthe obligation was mis-sized, not hard.\n\nThe gap had been\
  \ \"inhabit SymPowData C n for n >= 2\", priced at 2400-3800 lines\n(analogies/m3-route-audit.md)\
  \ as a scheme quotient by a finite group action. Albanese/\nSymPowColimit.lean identifies\
  \ that object instead: SymPowData C n TOGETHER WITH its symmetry\nhypothesis IS\
  \ a colimit of the S_n-action on C^n, in both directions\n(symPowOfColimit / SymPowData.isColimit;\
  \ hasColimit_permDiagram_iff states the equivalence, so\nthe reduction is lossless\
  \ rather than a relocation into something harder).\n\nLanded, all axiom-clean:\n\
  \ * the symmetry hypothesis -- the half that previously had only an n = 1 witness\
  \ -- is now\n   colimit.w, free at every n;\n * the AFFINE case of Milne III.3 Prop\
  \ 3.1 is PROVED at every n (symPowData_affine, on affine\n   k-schemes (Under k)^op)\
  \ with no construction written; mem_sections_singleObj_iff names the\n   carrier\
  \ as Spec of the invariant subring of the n-fold tensor power, i.e. Milne's\n  \
  \ (A^{tensor n})^{S_n};\n * the trivial witness (proj := 1) is REFUTED in-tree at\
  \ n = 2 (permAut_swap_ne_id), which the\n   interface header had only asserted;\n\
  \ * Albanese/AlbaneseFromColimit.lean states Milne III.6.1 with NO SymPowData and\
  \ NO hproj\n   argument.\n\nREMAINING, and it is one instance rather than a subproject:\n\
  HasColimitsOfShape (SingleObj (Equiv.Perm (Fin g))) Scheme -- the gluing half of\
  \ III.3.1. Note\nit is a statement about Scheme with no base and no curve in it:\
  \ Over.forget creates colimits, so\nthe over-category layer does not exist (symPowData_over_of_scheme_colimits).\n\
  \nAlso still open and NOT part of this node's debt: Milne III.5.1(a) birationality\
  \ of f^(g), whose\ninputs sit downstream of the Picard seam.\n"
