summary: "Abel-Jacobi and symmetric-power factorisation. Milne's argument over the\
  \ symmetric power\nis PROVED (Albanese/AlbaneseFromData.lean, axiom-clean); the\
  \ residue is the OBJECT\nSym^g C, equivalently the single instance HasColimit (permDiagram\
  \ C g)\n(SymPowColimit.hasColimit_permDiagram_iff -- an equivalence, so the reduction\
  \ is lossless).\n\nRoute: explicit Scheme.GlueData from affine charts. The bill\
  \ is four items. As of run 0069 r7:\n3 SUPPLIED, 1 OPEN. The authoritative count\
  \ lives in StableAffineCoverGroup.lean's header --\nthis row is a pointer to it,\
  \ not a second source of truth (a review found the two disagreeing).\nRead the change\
  \ from r6's \"2 supplied, 1 partial, 1 open\" as item 3 completing, NOT as\nvindicating\
  \ an older row that said \"3 of 4\" for a different and wrong reason.\n\n 1. DONE.\
  \ G-stable affine open neighbourhoods for a finite group acting by automorphisms\n\
  \    (Albanese/StableAffineCoverGroup.lean) plus exists_stable_affineOpen_perm{,_over}.\n\
  \ 2. DONE. The Aut-valued S_n-action MonObj.permAutHom (Albanese/GrpObjFoldSum.lean).\n\
  \ 3. DONE (r7). Algebra level: TensorPowerCoproduct.lean (existsUnique_coprodLift,\n\
  \    coprodLift_permAlgHom, permAlgHom_comp_singleAlgHom). The Cofan/IsColimit packaging\
  \ that\n    was the missing half: TensorPowerCofan.lean (tensorPowerCofanIsColimit,\
  \ plus\n    tensorPowerFanIsLimit for the (Under k)-op variance and tensorPowerCofan_inj_permAlgHom\n\
  \    for equivariance on the coprojections). The one trap, measured: CommRingCat.toAlgHom\
  \ is\n    typed over the algebra instance REBUILT from the structure morphism, not\
  \ the ambient one,\n    so it does not unify -- algHomOfMkUnderHom is the version\
  \ over the ambient instance\n    (proof: Under.w plus a congrArg; both round trips\
  \ rfl).\n 4. OPEN, and genuinely geometric: the overlap/cocycle agreement of the\
  \ chart quotients, and\n    OrbitsInAffineOpen FOR THE CURVE -- where quasi-projectivity\
  \ enters and mathlib has no\n    such vocabulary at this pin. THIS IS THE WHOLE\
  \ REMAINING RESIDUE of the affine-and-glue\n    route.\n\nBEYOND THE BILL, r7 also\
  \ named the affine carrier, which three files had recorded as expected\nbut unproved:\n\
  \ * SymPowAffineCarrier.tensorPowerOpIsoPiObj -- the n-fold product in (Under k)-op\
  \ that\n   permDiagram is BUILT ON is op (mkUnder k (tensor power)), i.e. (Spec_k\
  \ A)^n = Spec_k A^{⊗n},\n   with permAut_eq_op_permAlgHom matching the actions (and\
  \ it carries e-inverse; the kernel\n   forced that -- the wrong variance leaves\
  \ a goal true only at an involution).\n * SymPowAffineQuotient.colimitPermDiagramIsoFixed\
  \ -- the QUOTIENT:\n   colimit (permDiagram (op (mkUnder k A)) n) is iso to op (fixedUnder\
  \ ... (tensor power)),\n   Milne III.3 Prop 3.1's affine half with the object identified.\
  \ SymPowColimit §5's bold\n   caveat \"the carrier is not named in Lean\" is discharged\
  \ and deleted.\n\nTWO HONEST LIMITS ON THAT, both measured this round rather than\
  \ assumed:\n (a) The accompanying HasColimit (permDiagram (op (mkUnder k A)) n)\
  \ is NOT a new fact --\n     infer_instance discharges it from cocompleteness. Only\
  \ the ISO is new. An earlier draft\n     offered an existence restatement as the\
  \ payoff; it was vacuous, because naming an object\n     needs a statement that\
  \ MENTIONS the object.\n (b) The SECOND bridge of Milne's affine half -- that (Under\
  \ k)-op IS the category of affine\n     k-schemes, via Over.opEquivOpUnder and AffineScheme.equivCommRingCat\
  \ -- is still unbuilt.\n     So all of the above is k-ALGEBRA language, not Spec-language,\
  \ and symPowData_affineAlgebra\n     was not rewritten to consume the named carrier.\n\
  \nCONSUMPTION, checked by grep not asserted: SymPowAffineCarrier.lean consumes the\
  \ Cofan layer in\nproof bodies (:138, :150, :184) and SymPowAffineQuotient consumes\
  \ that -- the first consumer of\nanything this lane has built in five rounds. But\
  \ AlbaneseUP / AlbaneseFromData /\nAlbaneseFromColimit mention NONE of these names\
  \ (zero hits). This is a consumer inside the\naffine story, not integration with\
  \ the capstone; item 4 is what stands between.\n\nAlbaneseUP.lean's six sorries\
  \ are UNCHANGED and albanese_universal_property still reports\nsorryAx. All six\
  \ are stated against the sorry-BODIED SymmetricPower, so they remain\nundischargeable\
  \ as stated rather than merely unproved.\n"
