summary: "Abel-Jacobi and symmetric-power factorisation. Milne's argument is PROVED\
  \ over the symmetric\npower taken as an interface (Albanese/AlbaneseFromData.lean);\
  \ what is missing is the object.\nAlbaneseUP.lean's six sorries are UNCHANGED and\
  \ albanese_universal_property still reports\nsorryAx (measured, with firing controls)\
  \ -- they are stated against a sorry-BODIED\nSymmetricPower, so discharging them\
  \ would establish nothing.\n\nLANDED run 0069 r5, all sorry-free and rooted (they\
  \ were outside the root import cone until\nthis round -- I-0659):\n * SymPowTensorAction.lean\
  \ -- the S_n-action on the n-fold tensor power of a commutative RING.\n   Mathlib\
  \ has factor permutation only as a LINEAR equiv, so MulSemiringAction did not\n\
  \   synthesize and FixedPoints.subring could not be APPLIED; Milne's (A^{tensor\
  \ n})^{S_n} was\n   not expressible. permAlgHom (an ALGEBRA hom via liftAlgHom on\
  \ the domDomCongr'd tprod),\n   permMulSemiringAction (sigma acts as permAlgHom\
  \ sigma-inverse, since permAlgHom is an\n   ANTI-hom), permSMulCommClass. Characteristic-free:\
  \ nothing averages, no g! inverted.\n * SymPowInvariantsUnder.lean -- the invariants\
  \ ARE the limit in Under k, dually a colimit in\n   (Under k)^op. Cheaper by restating\
  \ than by transporting across Over.opEquivOpUnder, since\n   FixedPoints.subalgebra\
  \ is already a k-algebra.\n * StableAffineCoverGroup.lean -- every point has a G-STABLE\
  \ affine open neighbourhood, for a\n   BARE finite group acting by automorphisms.\
  \ Not new mathematics: the same proof as\n   Picard/StableAffineCover.lean:193,\
  \ whose SemilinearGalAction binder its body never touches\n   (compat is never mentioned;\
  \ FiniteDimensional buys only a Fintype). Verified by porting the\n   body verbatim\
  \ with the binder replaced.\n\nTHE GLUING RESIDUE IS FOUR ITEMS, NOT THREE -- corrected\
  \ by a fresh-context review after I\npublished three:\n 1. DONE -- the G-stable\
  \ affine cover (above).\n 2. An Aut-valued S_n action: there is NO Equiv.Perm (Fin\
  \ n) to* Aut (C^n) in the tree.\n    MonObj.permAut is a bare morphism never shown\
  \ invertible; permEnd lands in End, not Aut.\n    So item 1 has the right hypotheses\
  \ and no producer.\n 3. THE BLOCKING ONE. symPowData_affineAlgebra builds its diagram\
  \ from the n-fold COPRODUCT of\n    algebras in Under k; the invariants work above\
  \ is about the tensor power. Identifying them\n    needs the n-ary coproduct-vs-tensor-power\
  \ comparison plus matching its permutation action\n    to permAlgHom. Mathlib has\
  \ only the BINARY case (Algebra/Category/Ring/Constructions.lean);\n    AJC has\
  \ nothing. So r5 fixed r4's CATEGORY mismatch and the same shape reappeared one\
  \ level\n    down at the OBJECT.\n 4. Cocycle/overlap agreement of the chart quotients,\
  \ and OrbitsInAffineOpen FOR THE CURVE --\n    where quasi-projectivity enters,\
  \ and mathlib has no quasi-projectivity vocabulary at this\n    pin.\n\nNEXT ROUND\
  \ IS NOT THE GLUING: items 2 and 3, both cheap, both prerequisites to anything\n\
  consuming this layer. Zero consumers is three rounds deep now.\n\nAvailability at\
  \ this pin, so nobody re-searches: HasCoproducts Scheme YES, HasCoequalizers /\n\
  HasPushouts Scheme NO, Scheme.GlueData YES.\n"
