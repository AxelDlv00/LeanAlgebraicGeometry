id: AJC.albanese.symmetric
title: Abel-Jacobi and symmetric-power factorisation
projects:
- Algebraic-Jacobian-Challenge
summary: "Abel-Jacobi and symmetric-power factorisation. Milne's argument is PROVED\
  \ over the\nsymmetric power taken as an interface (Albanese/AlbaneseFromData.lean);\
  \ what is missing\nis the object. As of run 0069 r5 the affine half of Milne III.3\
  \ Proposition 3.1 has a\nNAMED carrier with a proved quotient property, over the\
  \ base:\n\n * SymPowTensorAction.lean -- the S_n-action on the n-fold tensor power\
  \ of a commutative\n   RING. Mathlib had factor permutation only as a LINEAR equiv,\
  \ so MulSemiringAction did\n   not synthesize and FixedPoints.subring could not\
  \ be STATED at a tensor power; Milne's\n   (A^{tensor n})^{S_n} was not expressible.\
  \ permAlgHom (an ALGEBRA hom, via liftAlgHom on\n   the domDomCongr'd tprod) plus\
  \ permMulSemiringAction and permSMulCommClass fix that.\n   Characteristic-free:\
  \ nothing averages, so no g! is inverted.\n * SymPowInvariantsUnder.lean -- the\
  \ invariants ARE the limit in Under k, and dually a\n   colimit in (Under k)^op:\
  \ the consumer's category AND variance. Cheaper by restating\n   than by transporting\
  \ across Over.opEquivOpUnder, since FixedPoints.subalgebra is\n   already a k-algebra.\n\
  \ * Index-category step: Functor.op yields a diagram over (SingleObj G)^op, NOT\
  \ over\n   SingleObj G. hasColimit_singleObj_of_op transports along Groupoid.invEquivalence,\
  \ with\n   the reindexing exactly sigma -> sigma-inverse (rfl).\n\nTHE RESIDUE IS\
  \ THE GLUING, unchanged: HasColimit (permDiagram C g) in Over (Spec kbar)\nfor the\
  \ proper curve. SymPowColimit.lean section 6 has the availability table measured\
  \ at\nthis pin -- HasCoproducts Scheme yes, HasCoequalizers/HasPushouts Scheme NO,\n\
  Scheme.GlueData yes -- so the route is explicit glue data plus overlap cocycles.\n\
  \nTWO LEADS NOT YET SPENT, both in this project and both sorry-free: Picard/StableAffineCover\n\
  .lean proves exists_stable_affineOpen_of_orbitsInAffineOpen (a Gamma-STABLE affine\
  \ cover via\nthe norm trick) and Picard/FiniteGaloisQuotientAffine.lean proves isGaloisQuotient_spec\n\
  unconditionally. Those are the two hardest inputs a glue-data assembly needs, built\
  \ for\nsemilinear Galois actions rather than S_n; whether the S_n case can consume\
  \ them is the\nnext question to settle, and it was NOT settled this round.\n\nAlbaneseUP.lean's\
  \ six sorries are UNCHANGED and albanese_universal_property still reports\nsorryAx\
  \ -- they are stated against a sorry-bodied SymmetricPower, so discharging them\
  \ would\nestablish nothing.\n"
