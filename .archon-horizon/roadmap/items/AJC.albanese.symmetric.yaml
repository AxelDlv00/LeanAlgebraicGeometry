title: Abel-Jacobi and symmetric-power factorisation
projects:
- Algebraic-Jacobian-Challenge
summary: 'Abel-Jacobi and symmetric-power factorisation. BLOCKED ON A SUBPROJECT,
  sized run 0069.


  Five of the six AlbaneseUP.lean sorries are downstream of Sym^g C, which does not
  exist: mathlib has no quotient of a scheme by a finite group action (its SymmetricPower
  is modules only). analogies/m3-route-audit.md scopes the construction at ~2400-3800
  LOC: group-action typeclass, affine quotient Spec(A^{S_g}) with universal property,
  glued global quotient, and smoothness of Sym^g C for a curve. Treat as a subproject,
  not a step.


  LANDED run 0069 (commit a1dd46a99): the INPUT the quotient''s universal property
  consumes. MonObj.powSum (the g-fold sum C^g -> A) and MonObj.powSum_perm (its S_g-invariance
  -- Milne''s "clearly this is symmetric"), axiom-clean, in Albanese/GrpObjFoldSum.lean.
  Only the factorisation through pi : C^g -> Sym^g C is now missing, not the symmetry
  that licenses it. Also added MonObj.preHom (precomposition as a MonoidHom on hom-sets),
  which mathlib lacked.


  abelJacobi is separately blocked: it wants PicScheme.degree / Pic0(k) = ker degree,
  and ajc-pic0av reports degree unconstructed with no route it is confident in (I-0493,
  run 0067).


  AND THE INPUT IS NOW APPLICABLE AT AN ABELIAN VARIETY (commit f7391b281, later in
  run 0069). MonObj.powSum requires [IsCommMonObj A], which the project''s AV package
  did NOT supply -- a fresh-context review caught that the g-fold sum, though correct
  and general, did not elaborate at its intended target. Closed at the root: isCommMonObj_of_isProper_smooth
  (Albanese/AVCommutative.lean, Milne I.1 Corollary 1.4) proves an abelian variety
  over k-bar is a commutative group object, axiom-clean, via pointed inversion being
  a homomorphism by the Rigidity Lemma. Deliberately not an instance -- the three
  (A tensor A)-side hypotheses are not synthesised from the AV package, so consumers
  thread letI := isCommMonObj_of_isProper_smooth (A := A), per GrpObjFoldSum.lean''s
  header. Verified by probe that powSum and powSum_perm both elaborate at the AV binder
  set.

  '
