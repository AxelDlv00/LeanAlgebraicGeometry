summary: 'REPLACE THE DECLARATION, DO NOT PROVE THE SQUARE (run 0068 r2, verified
  in Lean).


  r1 recorded this leaf as PROBED AND CONFIRMED HARD, needing per-sigma projection
  lemmas nobody has built, because Pi.hom_ext cannot fire through the buried sigma-decomposition.
  That is right about the DEGREEWISE CONSTRUCTION, and the construction is the mistake.


  LANDED, sorry-free: cech_pushforward_baseChange_natIso_of_isIso builds the SAME
  cosimplicial isomorphism by whiskering the natural transformation cechOuterBC (=
  openImmersion_bareBC at the OUTER square; that lemma needs no open immersion and
  no flatness despite its name). Both sides are DEFEQ to N >> (a composite), rfl-checked
  both ways, so Functor.whiskerLeft gives the map and its coface compatibility IS
  the mate''s own naturality. NO NATURALITY OBLIGATION. Then isIso_app_pi_of_isIso_app
  (landed) reduces the residue to one IsIso per index tuple.


  WHAT IS OPEN, with the trap named: IsIso (cechOuterBC.app (pushPullObj F (Over.mk
  j_sigma))). The file HAS an iso with those endpoints (pushPullObj_coverInter_baseChange)
  but an iso between two objects is NOT IsIso of a specific map -- the recorded groups-agree-vs-maps-agree
  error.


  ROUTE, identified not built: mateEquiv_vcomp splits the mate of a vertically composed
  square. Stack the inner square over U_sigma on the outer square h: the composite
  is the square for j_sigma >> f : U_sigma -> S, between AFFINE schemes, where flat
  base change is the sorry-free affinePushforwardPullbackBaseChange; the inner factor
  is openImmersion_beckChevalley, already sorry-free.


  DO THIS LEAF FIRST, before the twisted sibling.'
