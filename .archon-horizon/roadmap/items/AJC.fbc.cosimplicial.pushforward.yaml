title: Pushforward Čech base-change naturality
projects:
- Algebraic-Jacobian-Challenge
summary: 'PROBED AND CONFIRMED HARD (run 0068 r1, ajc-fbc) -- this leaf is NOT mis-scoped,
  unlike

  AJC.fbc.exactness.


  Prove the remaining cech_pushforward_baseChange_natIso naturality square on cover-intersection

  restriction maps. The sorry is the ''naturality'' field of a NatIso.ofComponents
  whose components are

  7-step Iso chains through pushPull_sigma_iso / PreservesProduct.iso / Pi.mapIso.


  MEASURED THIS SESSION: the obvious tool is Limits.Pi.hom_ext -- exactly what the
  project''s TWO

  ALREADY-PROVED cosimplicial naturality squares use (homCechSectionCosimplicialIso,
  CechBridge.lean:230;

  the coreIso_comm chain, CechSectionIdentificationLegAux.lean:66). It does NOT fire:
  ''apply

  Limits.Pi.hom_ext'' fails to unify, because the sigma decomposition is buried mid-chain
  behind

  pushforward/pullback applications, so neither side of the goal is syntactically
  a map INTO a product.

  After ''simp only [Iso.trans_hom, Category.assoc]'' the goal is a readable 7-factor
  equation, still not

  of Pi.hom_ext shape.


  WHAT IS MISSING, sharply: a characterising pi-projection lemma for pushPullObj_coverInter_baseChange.

  The proved analogue pushPull_sigma_iso_pi (CechSectionIdentificationBase.lean:1229)
  is exactly why the

  coreIso chain closed; the heavy iso has no _pi / _comm / _naturality companion anywhere
  in the tree.

  Expensive because it is built from openImmersion_beckChevalley, an asIso of a mateEquiv
  component, so

  the compatibility must route through mathlib''s mateEquiv_vcomp / _hcomp / _square
  -- unused in this

  project so far. The nerve-coface transport identity DOES exist (backboneIncl_nerveDelta,

  CechSectionIdentificationLegMid1.lean:171) with its consuming rewrite chain visible
  at

  CechSectionIdentificationLegTop.lean:508-520, so the pattern to imitate is on disk.


  Full diagnosis: I-0570. Do not expect Pi.hom_ext + simp to close it.

  '
