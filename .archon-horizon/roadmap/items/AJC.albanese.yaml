summary: 'Albanese and abelian-variety leg.


  The characteristic-free symmetric-power route is specified cleanly in the blueprint,
  and the CODIMENSION-ONE EXTENSION LEG IS CLOSED as of run 0069: Milne Lemma 3.3
  is proved, Milne Theorem 3.2 (extend_to_av) is unconditional and axiom-clean, and
  the whole RigidityLemma.lean chain is sorry-free and axiom-clean.


  Lean still needs the Abel-Jacobi and symmetric-power constructions, the birational
  comparison, the rational-map descent, and the connector -- the six sorries of Albanese/AlbaneseUP.lean.


  THE HEADLINE IS NOT SORRY-FREE. albanese_universal_property is honest ASSEMBLY from
  descentThroughBirationalSigma and albanese_eq_iff_symmetricPower_eq, but measured
  (run 0069) #print axioms reports [propext, sorryAx, Classical.choice, Quot.sound).
  It inherits sorryAx from all six open AlbaneseUP declarations, decisively from abelJacobi
  -- a sorry-BODIED DEFINITION, so the equation phi = abelJacobi C P0 >> psi does
  not yet say what it is meant to say. It must not be reported as a landed theorem.
  (An earlier version of this summary said the headline was already sorry-free; that
  was wrong.)

  '
