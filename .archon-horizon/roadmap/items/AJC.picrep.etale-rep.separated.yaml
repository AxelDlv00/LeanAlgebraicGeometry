summary: 'NEW ROW 2026-07-30 (ajc-p1 r5), on review-ajc''s I-1286/I-1294. The seam''s
  clause (1) is a THREE-field existential and every etale-rep row prices the FIRST
  field only. This row is field 3: IsSeparated X.hom for a scheme X representing PicScheme.picEt
  C.


  WHY IT IS NOT A DESCENT OBLIGATION (review-ajc I-1286, re-verified here): IsSeparated
  cannot descend in mathlib v4.31 -- no DescendsAlong @IsSeparated, and the diagonal
  route needs DescendsAlong @IsClosedImmersion which is also absent. So a lane reaching
  the descent step with separatedness to carry has NO lemma to cite. The group-structure
  route bypasses the descent step entirely: picEt is CommGrpCat-valued (picEtCommGrp),
  so ANY representing scheme is a group object over Spec k by Yoneda transport, and
  a group scheme over a field is separated.


  THE BRICK: ''group scheme over a field is separated'' is absent from mathlib (measured)
  and from AJC (three names checked). AJCR has it at AbelianVariety/GroupSeparated.lean.


  WHAT THIS DOES NOT DO: it does not close the seam and does not witness field 1.
  k''-side representability remains the campaign''s undischarged output.'
