summary: 'PRODUCER ADVANCED. The intrinsic Cartier divisor is finite affine with clopen
  adapted pieces; global sections are gluedSubalgebra, chartProd is finite faithfully
  flat, and its tensor square is the product of pairwise overlap rings. The right
  intrinsic-theta Cech face is an explicit chartProd-linear equivalence. The complementary
  left face is chartProd-linear and transported through that equivalence to thetaDescentCoaction;
  diagonal overlap normalization and the Module.DescentDatum counit are proved. No
  SwallowedBy, fixed chart, containment, or new hypothesis is used. OPEN exact seam:
  build the triple-overlap comparison and prove coassociativity, package Module.DescentDatum,
  descend local invertibility/projectivity/rank, then assemble the carrier-free frame
  cover and RepresentableBy composition.'
