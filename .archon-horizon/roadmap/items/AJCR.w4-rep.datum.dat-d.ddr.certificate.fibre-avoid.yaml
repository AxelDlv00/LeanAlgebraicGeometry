summary: 'DONE FOR INFINITE k, commit c6a47016f. P1.exists_matrix_finite_subset_chartInter
  proves that one GL2 twist puts any finite subset of P1 inside the two twisted standard
  charts. DivSchemeCertZarFibreAvoid derives finite residue support from regular local
  equations on a smooth integral proper curve, maps that support into P1, chooses
  the twist, and spreads confinement over a Zariski neighbourhood by properness. The
  ThetaGeneratorSeed theorem is noncircular: its fibre_regular field supplies residue-pullback
  regularity before colength, projectivity, or certification is used. SCOPE LIMIT:
  every avoidance theorem that chooses two scalars assumes Infinite k. This row therefore
  closes exactly the infinite-field branch, not the arbitrary-field gate. The missing
  finite-field degree bound and finite-cardinality variant are tracked by finite-field-avoid.'
