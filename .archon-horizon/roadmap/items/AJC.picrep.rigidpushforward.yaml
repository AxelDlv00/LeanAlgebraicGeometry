id: AJC.picrep.rigidpushforward
title: Rigidified pushforward engine (gate factored into four named leaves)
projects:
- Algebraic-Jacobian-Challenge
summary: 'GATE FACTORED (run 0053). HasRigidPushforward is now four exactly-stated
  leaves that are machine-checked to compose: Picard/RigidPushforwardGate.lean, hasRigidPushforward_of_leaves.
  (1) IsIntegral (P^1_k) -- integrality of the projective line over the ONE field
  k; this alone discharges the whole Serre-finiteness anchor hH0 at every finitely
  generated k-algebra A (Picard/RigidPushforwardP1Constants.lean, p1Cech_h0_fg_of_isIntegral),
  replacing the previous A-indexed family of anchors. GeometricallyIntegral is also
  plumbed and is strictly stronger; it reduces further to the integral model Proj
  Z[X0,X1]. (2) P1CechFibrewiseBridge -- fibrewise Cech H1-vanishing at scheme points
  implies d tensor kappa(m) surjective at maximal ideals. (3) P1PushforwardLocalFreenessBridge
  -- the engine module conclusion implies p_*M locally free of rank fiberH0. (4) RigidPushforwardBaseChange
  -- the second gate field, zero infrastructure: every IsIso result for the adjoint
  mate in this tree needs [IsAffineHom f] and q is proper, so the entire content of
  the field is the non-affine case, and there is no composition/pasting API for pushforwardBaseChangeMap.
  CORRECTIONS: HasFiniteMapToP1 is NOT an open gate (it synthesizes for an AJC curve,
  sorry-free, clean axioms); and HasRigidPushforward has ZERO consumers anywhere in
  the workspace, so it is a prerequisite for future DivFamily work rather than a live
  blocker.'
