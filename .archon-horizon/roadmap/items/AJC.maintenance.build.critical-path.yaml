id: AJC.maintenance.build.critical-path
title: Split the heaviest links of the build critical path
projects:
- Algebraic-Jacobian-Challenge
summary: 'The from-scratch wall clock is critical-path bound: 113 of 165 modules finish
  inside 10 minutes and the remaining 33 minutes are an almost serial chain through
  GlueDescent -> SerreTwist / GrassmannianQuot / QuotFunctorDef / RigidPushforward
  -> Adelic. The chain''s heaviest links are single oversized modules -- QuotScheme
  6,354 lines and 804s, TensorObjSubstrate 3,745 lines and 538s, GlueDescent 3,391
  lines and 504s. QuotScheme in particular is a dozen mutually independent sections
  each headed ''Project-local Mathlib supplement'' (annihilator ideal sheaf, localisation
  of annihilators, quasi-coherent sections on a basic open, the over-site sheaf equivalence,
  the slice-to-geometric bridge, presentation descent, section-localization descent);
  splitting them into separate modules would let them elaborate in parallel and would
  shorten every downstream rebuild. Do this after the import-hygiene campaign, so
  each split module can be given precise imports from the start.'
