summary: "FLAT BASE CHANGE: the endpoint now needs NO side hypotheses, and the residue\
  \ is ONE kind of statement.\n\nLANDED run 0068 r2 (all kernel-checked, lake build\
  \ 2896 jobs exit 0, file still exactly 3 sorries):\n * cech_flatBaseChange_qcoh\
  \ -- the cech_flatBaseChange conclusion with the flat-exactness leaf ABSENT from\
  \ the proof term and with NO extra hypotheses. THE FORM TO CONSUME.\n * isQuasicoherent_cechComplex_X\
  \ -- every degree term of the relative Cech complex is quasi-coherent; this discharges\
  \ the h2/h3 that the previous best form had to assume. Built on isQuasicoherent_pushforward_specMap\
  \ (four lines from mathlib's isIso_fromTildeGamma_pushforward), its isoSpec-conjugated\
  \ form, and isQuasicoherent_pi_of_isAffine.\n * cechOuterBC + cech_pushforward_baseChange_natIso_of_isIso\
  \ + isIso_app_pi_of_isIso_app -- the cosimplicial comparison as a WHISKERED MATE,\
  \ which removes the cosimplicial naturality obligation from the S-level leaf entirely\
  \ and reduces it to one IsIso per index tuple.\n\nREMAINING, exactly: the two cosimplicial\
  \ naturality sorries, and they are NOT the same obligation.\n (a) cech_pushforward_baseChange_natIso\
  \ -- REPLACE, do not prove. Naturality is free via whiskering; what is open is the\
  \ per-sigma IsIso OF THE MATE'S COMPONENT. The file has an iso with those endpoints\
  \ but that is not IsIso of a given map. Route: mateEquiv_vcomp splits it into the\
  \ affine mate over U_sigma -> S plus the landed openImmersion_beckChevalley.\n (b)\
  \ twisted_cech_nerve_iso -- whiskering does NOT apply (verified: its RHS is the\
  \ nerve of the base-changed cover, not a whiskering of N). Its naturality is a comparison\
  \ of two nerves: coverInterOpen_baseChange_eq compatible with the index-omission\
  \ maps. HARDER than (a) despite lighter hypotheses.\n\nDo (a) first. pullback_preservesMonomorphisms\
  \ stays a monument -- no consumer needs it."
