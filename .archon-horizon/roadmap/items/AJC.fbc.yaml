summary: "Flat base change for higher direct images along a flat g (Stacks 02KG/02KH).\
  \ ONE open obligation,\nnamed, and the mate is out of it (run 0068 r5).\n\nSTATE,\
  \ measured each round and not inherited: cech_flatBaseChange_oneLeaf reports sorryAx\
  \ and NO\npreviously-contaminated declaration has become clean. That is the honest\
  \ headline; what has moved is\nthe shape of the single residue.\n\n * .exactness\
  \ -- NOT on the critical path, and the \"sorry-bodied instance leak\" the task brief\
  \ calls\n   THE priority does not exist (zero sorry-bodied instances project-wide;\
  \ the declaration is not an\n   instance). Details and the quasi-coherent bypass\
  \ on that row; measurement in I-0756.\n * .cosimplicial.pushforward -- DONE (r3):\
  \ cech_pushforward_baseChange_natIso_flat is sorry-free,\n   via cechOuterBC being\
  \ definitionally canonicalBaseChangeMap.\n * .cosimplicial.twisted -- the one live\
  \ row. r4 left TWO items; r5 wrote the wiring, so ONE remains:\n   half (a), naturality\
  \ of the restricted-square Beck-Chevalley iso in the SQUARE. Now a named Prop\n\
  \   (BcSquareNaturality) with two equivalent restatements, the weakest being BcSquareCounitSide.\n\
  \nTHE r5 UNLOCK, and it retracts this cone's own three-round pricing: half (a) was\
  \ called walled\nbecause \"nothing relates the mate across a change of square\"\
  . True, and irrelevant -- the mate need\nnot be related across squares, because\
  \ under p^* and past the counit IT IS NOT A MATE.\nbareBC_pullback_counit gets that\
  \ from mathlib's mateEquiv_counit in one rw, with no open immersion,\nno flatness\
  \ and not even cartesianness. The blocker previously recorded (\"pushPullMap is\
  \ the\ndegenerate-square mate\", typechecks but not rfl) is sidestepped, not solved.\n\
  \nWHAT IS ACTUALLY LEFT, measured and deliberately not softened: the elimination\
  \ fires on the RHS only\n(mate and counit at the same sigma). On the LHS the mate\
  \ sits at sigma-composed-with-delta-k while\nthe counit is at sigma, and closing\
  \ that is NOT plain counit naturality -- that lemma moves only maps\nalready of\
  \ the form p_*(psi), whereas this one's SOURCE is a pushforward along a different\
  \ morphism.\nSo: a comparison of the counits of two different adjunctions along\
  \ the slice map wmap.\n\nMEASUREMENT: scripts/axiom-frontier.lean sections 6d/6g/6h/6i.\
  \ Section 6i is seven declarations clean\nagainst two controls (twisted_cech_nerve_iso,\
  \ cech_flatBaseChange_oneLeaf) that must and do still\nreport sorryAx.\n"
