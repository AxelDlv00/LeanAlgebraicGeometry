id: AJCR.w4-rep.datum.dat-d.ddr.datum-tail.abel-quotient
title: Admissible divisor quotient represents Pic0 (corrected Altman-Kleiman)
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'Prove the single endpoint `noncomputable def pic0AdmissibleAbelQuotientRepresenter
  {k : Type u} [Field k] (C : Over (Spec (.of k))) [SmoothOfRelativeDimension 1 C.hom]
  [IsProper C.hom] [GeometricallyIrreducible C.hom] : Sigma fun Q : Over (Spec (.of
  k)) => (pic0TypeFunctor C).RepresentableBy Q`. Its proof must internally consume
  the unconditional admissible-parameter divisor representer, choose the Abel datum,
  construct the sheaf quotient by equality of induced degree-zero Picard class, identify
  the kernel pair with linear equivalence, prove local surjectivity, and prove the
  quotient is represented by Q. Establish the needed quasi-projectivity or a concrete
  project-local embedding of the divisor representer. No RepresentableBy, IsRepresentable,
  HasSmoothProperQuotient, chart-coverage, rational-point, or quotient-datum binders
  are permitted. The raw admissible Abel map only feeds this quotient: its positive-dimensional
  linear-system fibres prevent it from being the open Pic0 atlas.'
