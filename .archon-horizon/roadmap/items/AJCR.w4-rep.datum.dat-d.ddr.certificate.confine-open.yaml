summary: "LANDED 2026-07-25 (run 0048 round 1), Picard/DivSchemeCertZarConfine.lean,\
  \ 6 declarations,\n0 sorries, axioms exactly [propext, Classical.choice, Quot.sound],\
  \ in the default build.\n\nWHY IT MATTERS. spec-dd-r §Discipline (2) forbids a support-separation\
  \ HYPOTHESIS, and is right\nto: assuming supp D cap pi^-1({0,infinity}) = empty\
  \ about an arbitrary divisor assumes the\nconclusion. The repair does something\
  \ different — the ATLAS RECORDS which vertical fibres its\ndivisors avoid — and\
  \ this leaf proves that is legitimate, because the recorded condition is OPEN\n\
  on the base:\n\n* isOpen_setOf_fibre_subset_chartInter — the base points whose support\
  \ fibre lies in V_0 inf V_1\n  form an OPEN subset of Spec R (support closed + relative\
  \ curve proper over the test ring).\n* exists_opens_supportLocus_subset_chartInter\
  \ — confinement at ONE fibre spreads to a Zariski\n  neighbourhood of that base\
  \ point (the chart instance of the landed exists_supportTube).\n* supportLocus_subset_of_forall_fibre\
  \ — fibrewise confinement at every base point IS the global\n  hypothesis forall_finite_colength_of_pieces_eq_chart\
  \ wants, so (c1) can be discharged fibre by\n  fibre from the seed's fibrewise geometry.\n\
  * DivEq.unitLocus_eq / DivEq.supportLocus_eq and\n  not_isCertified_of_divEq_of_isPreconnected_of_witnesses\
  \ — the no-go is about the divisor class,\n  not a representative.\n\nWHAT IT DOES\
  \ NOT SUPPLY: that the carved opens COVER. With the two pinned charts fixed once\
  \ and\nfor all they provably do not (chart-avoid (c)). Covering is what p1-aut +\
  \ fibre-avoid buy.\n"
