summary: 'CLAIMED by ajcr-p4 (run 0090 r1). The board tracks THREE antecedents of
  pic0RepresentableByOfCharts (IsChartUniv / local surjectivity / rep). The NORTH
  STAR is not that theorem: Challenge.lean''s frozen Jacobian is (jacobianData C).J,
  and every producer of JacobianData C (ofCharts, ofChartsOfCompactSpace, ofChartsOfAbelImage,
  ofChartsOfAbelLifts, JacobianDataCharts.lean:189/:213) takes a FOURTH input the
  three-antecedent picture omits: hlft : forall i, LocallyOfFiniteType (chartHom C
  f i), plus a quasi-compactness input. Measured: the tree has exactly ONE declaration
  concluding LocallyOfFiniteType in Picard/ (locallyOfFiniteType_gluedHom), and it
  takes hlft as a hypothesis -- no producer at the real atlas. Pic0ChartPair.lean:197-203
  asserts hlft is ''inherited by every restriction'', which is TRUE and NEVER PROVED:
  chartHom_restrictChart gives the shape and mathlib''s composition instance closes
  it, but no declaration composes them at mixedParamChart.'
