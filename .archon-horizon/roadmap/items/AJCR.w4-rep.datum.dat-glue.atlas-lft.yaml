summary: "DONE (ajcr-p4, run 0090 r1). The chart-finiteness certificate of the atlas\
  \ route is proved; it was an assumption everywhere before this.\n\nTITLE CORRECTED:\
  \ this is NOT a fourth antecedent. It is a RIDER on antecedent 3 (rep), per review-ajcr\
  \ and my own fresh-context review, both of which found the same better theorem than\
  \ my first argument.\n\nLANDED, Picard/Pic0AtlasFiniteType.lean, rooted at AlgebraicJacobian.lean:631,\
  \ 6 declarations, sorry-free, ALL axiom-clean on exactly [propext, Classical.choice,\
  \ Quot.sound] against a control (Jacobian) firing sorryAx. Full root lake build\
  \ EXIT=0 (9307 jobs).\n * chartHom_mixedParamChart -- the i-th chart of the REAL\
  \ (heterogeneous, restricted) atlas has structure morphism (V i).iota >> (D i).hom.\
  \ Both ingredients were in the tree and had never been composed; Pic0ChartPair.lean:197-203\
  \ asserted the inheritance in prose.\n * locallyOfFiniteType_chartHom_mixedParamChart\
  \ -- the certificate at every chart from LocallyOfFiniteType (D i).hom, via mathlib's\
  \ composition instance.\n * locallyOfFiniteType_of_representableBy -- THE ONE THAT\
  \ MATTERS. The certificate is an invariant of the FUNCTOR, not of the representing\
  \ object (rep.uniqueUpToIso + Over.w), so no producer of rep can choose a D that\
  \ fails it -- at ANY parameter, including the n != g where no representation exists.\
  \ Uses none of the curve's geometry.\n * locallyOfFiniteType_gluedHom_mixedParamChart\
  \ -- the JacobianData field itself, no index finiteness used.\n * jacobianDataOfMixedParamCharts\
  \ (+ _J) -- the assembly, so the obligations are checkable in ONE signature instead\
  \ of spread over four files.\n\nCLOSES NO GATE, and the file says so: rep, hf (IsChartUniv)\
  \ and Zariski-local surjectivity are untouched, each another lane's target. It is\
  \ an implication, not a witness.\n\nWHAT THIS ROW MEASURED ABOUT ITS SIBLING OBLIGATION:\
  \ hcpt (CompactSpace of the GLUED object) is a real obligation, NOT a consequence\
  \ of coverage. With hf and the local-surjectivity instance alone it does not follow,\
  \ and the single gap on the route that proves it is Finite ...openCover.I0. review-ajcr's\
  \ PEmpty evidence for the opposite reading is confounded -- PEmpty is finite. So\
  \ the honest routes stay: a finite atlas, or the Abel image. Do not schedule 'derive\
  \ hcpt from coverage'. Filed I-1007.\n\nFOUR OF MY OWN FRAMING CLAIMS RETRACTED\
  \ IN PLACE (not appended): the Challenge.lean routing sentence (Challenge.lean:96\
  \ is a sorry that does not import this layer; no jacobianData producer exists),\
  \ 'only declaration in Picard/ concluding LocallyOfFiniteType' (false, ~30 have\
  \ that goal), 'no board row tracks it' (dat-glue's title has named the certificate\
  \ since 2026-07-16 -- what was missing was a proof), and two cited producer names\
  \ outside the file's import closure.\n\nSTRONGER THAN I CLAIMED, credited to review-ajcr:\
  \ PicRepDatum.lft is a structure FIELD and toJacobianData only carries it across,\
  \ so the certificate was assumed on the DAT-glue route too, not only the atlas route."
