summary: "CLOSED AS AN IMPLICATION by ajc-p2 run 0084 r6: the GOAL now exists, crosses\
  \ the descent step, and its converse is proved so it is coordinates rather than\
  \ a discount. Seam sorry untouched; NO antecedent of fgaPicardRepresentability witnessed\
  \ for any curve.\n\nLANDED, do not redo. Picard/PicEtDescentRepresentability.lean,\
  \ rooted at AlgebraicJacobian.lean, 24 declarations (COUNTED by declaration keyword,\
  \ not recalled -- I first wrote 14 on this row and it was wrong), ZERO code sorries\
  \ (the three `sorry` string hits are docstring prose), ALL axiom-clean [propext,\
  \ Classical.choice, Quot.sound] against fgaPicardRepresentability firing sorryAx\
  \ in the same probe file. lake build of the module EXIT=0 (8692 jobs) with oleans\
  \ rebuilt BEFORE every probe.\n * representableBy_of_coverCompatibleEquiv -- THE\
  \ THEOREM the other lanes' items are antecedents OF, on the class side. A k-scheme\
  \ Y whose points are naturally the cover-COMPATIBLE picEt C-classes on T_{k'} REPRESENTS\
  \ picEt C over k. Takes data over the cover, concludes over k -- unlike representableByRestrict_of_baseChange,\
  \ refuted at I-1312 for restating one side. No picEt C representation in any hypothesis,\
  \ so not P -> P.\n * representableBy_of_galInvariantEquiv -- the same in ajc-p1's\
  \ twistTest spelling, composing their r7 bridge. hcov carried as an explicit per-test\
  \ antecedent, undischarged.\n * restrictCompatEquiv -- restriction along the cover\
  \ is a BIJECTION onto the cover-compatible classes (my r5 ExistsUnique plus PicEtDescentAssembly's\
  \ injectivity), and it is NATURAL: coverRestrictNat is whiskerRight (NatTrans.op\
  \ counit) (picEt C).\n * coverCompatibleEquiv_of_representableBy -- THE CONVERSE,\
  \ both fields including naturality. So representing picEt C and representing the\
  \ cover-compatible-classes functor are INTER-DERIVABLE. A repricing, not a discount.\n\
  \nTHREE MEASUREMENTS THAT CHANGE OTHER LANES' PLANS:\n * coverMap IS the counit\
  \ of Over.map |- Over.pullback (coverMap_eq_counit, by simp). The cover is Mathlib's\
  \ Over.pullback ; Over.map, so its functoriality and the naturality square are free.\n\
  \ * BOTH directions of coverCompatible <-> galInvariant are free of Module.Finite\
  \ AND IsSeparable (omit, linter-confirmed on both). In this cluster those binders\
  \ are consumed at exactly ONE place: covering-sieve membership.\n * hcov carries\
  \ NO etale-site obligation (I-1458): etaleTopology_generate_of_openCover makes any\
  \ OpenCover's sieve an etale covering sieve in one line, and isOpenImmersion_sigmaiota\
  \ shows a coproduct inclusion IS an open immersion though inferInstance fails.\n\
  \nCORRECTION ON RECORD against my own file, accepted from I-1454: I repeated \"\
  hcov satisfiable, hence not vacuous\". Reproduced clause 1 (Mono forces every gamma\
  \ to be the identity) before editing; the only exhibited model trivialises the consequent\
  \ too. In-file wording is now \"satisfiable, but no exhibited model separates the\
  \ two projections\".\n\nWHAT REMAINS: the Equiv family from a k'-side representation\
  \ and its Galois quotient (p4's galois-action row, p3's G2(c)); hcov at a nontrivial\
  \ Galois level; k'-side representability itself."
