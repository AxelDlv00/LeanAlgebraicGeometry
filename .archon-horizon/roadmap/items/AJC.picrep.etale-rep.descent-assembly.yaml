summary: "ADVANCED by ajc-p2 run 0084 r4. The GOAL now exists; its class-level half\
  \ is CLOSED; the seam sorry is untouched.\n\nWHY THE ROW WAS CREATED. The repair's\
  \ four inputs each had a lane or were landed, and NOTHING STATED THE THEOREM THEY\
  \ FEED. Measured at HEAD, re-measured independently by review-ajc (I-1256): the\
  \ seam's conclusion shape Nonempty ((PicScheme.picEt C).RepresentableBy X) occurs\
  \ at exactly three sites -- the HasPicSchemeEt class field, the sorry itself, and\
  \ hasPicSchemeEt_of_picSharp_representability -- and all three are SAME-FIELD. None\
  \ takes a k'-side representation.\n\nLANDED, do not redo. Picard/PicEtDescentAssembly.lean,\
  \ rooted, 6 declarations, 0 sorries, all axiom-clean [propext, Classical.choice,\
  \ Quot.sound] vs fgaPicardRepresentability as a control that correctly fires sorryAx.\
  \ lake build EXIT=0 (8869 jobs) with oleans rebuilt BEFORE every probe (I-1057).\n\
  \ * picEt_injective_restrict_baseTest -- restriction along the SINGLE morphism T\
  \ x_k Spec k' -> T is injective on picEt-classes, arbitrary field, arbitrary finite\
  \ separable k'/k, arbitrary test. The genuinely new step: the reduction from picEt_ext_of_pullback_agrees's\
  \ sieve-indexed hypothesis to one morphism, via a factorisation lifted to the slice\
  \ over Spec k.\n * existsUnique_amalgamation_picEt_fieldCover -- a COMPATIBLE FAMILY\
  \ has a UNIQUE amalgamation, so the class-level descent is COMPLETE, both halves\
  \ free from sheafification.\n * representableByRestrict_of_baseChange -- the k'-side\
  \ input transported, free from picEt_crossBaseIso.\n\nTWO CORRECTIONS ON RECORD,\
  \ both to claims made this session:\n * MINE (I-1280): I first called surjectivity-of-restriction\
  \ 'the sharp remaining class-level statement'. Too pessimistic -- amalgamation fires\
  \ at EVERY covering sieve, top included. Corrected in-file.\n * review-ajc's steer,\
  \ withdrawn (I-1256): it proposed aiming the assembly at the picSharp endpoint over\
  \ k. not_exists_representing_picSharp_of_not_isIso refutes exactly that -- the endpoint\
  \ is admissible as an INPUT over a field where picSharp is representable, never\
  \ as an OUTPUT over arbitrary k.\n\nWHAT REMAINS, neither sheaf-theoretic: (1) producing\
  \ the compatible family from a Galois-INVARIANT k'-class -- the invariance content\
  \ of G1; (2) the SCHEME-level G2 quotient, gated on HasGaloisQuotient, affine half\
  \ only (ajc-p1 r4) while the descended object is glued. NEXT LANE: budget those\
  \ two and nothing for existence or uniqueness of the descended class.\n\nNO sorry\
  \ closed, NO antecedent of fgaPicardRepresentability witnessed for any curve. Deliberately\
  \ contains no P -> P implication and no class-valued conclusion (instHasPicSchemeEt\
  \ is unconditional, so such a conclusion is discharged by instance search projecting\
  \ the seam sorry -- I-1251)."
