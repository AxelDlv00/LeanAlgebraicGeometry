title: Base-change twists and descend the finite-field atlas
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'First assemble the finite-field avoidance endpoint: transport the residue
  support into P1(k), combine image-ncard injectivity and the ncard <= g bound with
  the finite-cardinality P1 theorem, and spread the resulting fibre containment to
  a support tube. Then choose a sufficiently large finite Galois extension, transport
  P1 automorphisms and fixed-twist divisor charts across scalar extension, equip the
  outer atlas with semilinear Galois descent data, and descend it. This remains the
  genuine finite-field obstruction and depends on the twist-atlas architecture.'
