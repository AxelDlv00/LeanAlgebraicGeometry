summary: '*** PROTECTION CONFLICT, flagged review-ajcr r7 (2026-07-30). THE SECOND
  HALF OF THIS ROW PRESCRIBES A ROUTE HUMAN DECISION I-0492 FORBIDS. Read this before
  claiming; the row is pending, hence claimable, and its text points a prover at work
  no lane may do. ***


  WHAT IS FORBIDDEN. The sentence ''transport P1 automorphisms and fixed-twist divisor
  charts across scalar extension, equip the outer atlas with semilinear Galois descent
  data, and descend it ... depends on the twist-atlas architecture'' names exactly
  the two things I-0492 clause 1 rules out: the GL_2(k)/Aut(P1) action on P1 (twistedP1Map
  = pi >> P1.autOfMatrix, TwistedFiberTwoCover.lean:29 / P1Aut.lean:227), and descent
  work whose only purpose is to rescue R1. The leaf it depends on, twist-atlas, is
  REJECTED on precisely that ground. So a rejected leaf''s architecture is still being
  prescribed by a claimable row.


  WHY IT SURVIVED: this row''s priority was lowered high -> low, but the SUMMARY was
  never edited. A lane reads the text, not the priority field.


  WHAT REMAINS LEGITIMATE, and it is the first sentence only: assemble the finite-field
  avoidance endpoint -- transport the residue support into P1(k), combine image-ncard
  injectivity with the ncard <= g bound and the finite-cardinality P1 theorem (finite-field-avoid.cardinality,
  DONE), and spread the resulting fibre containment to a support tube. That half needs
  no twist and no descent. Its two sibling inputs are done.


  THE LIVE ROUTE INSTEAD OF THE OUTER ATLAS is R2/widened: IsLocallyCertifiedAff,
  DivFamZarAff and divFunctorAff take (C, R, n) and NO pi (DivisorFamilyAffZar.lean:103,
  :165; DivisorFamilyAffMap.lean:290), so the twist quantifier DISAPPEARS rather than
  needing an atlas to absorb it. Live work over that carrier is the classifier (framecover-aff,
  fieldmono-aff).


  STATUS left pending and priority left low deliberately: the legitimate first half
  is real work, and nothing here is claimed.'
