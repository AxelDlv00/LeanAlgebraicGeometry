id: AJC.picrep.projective-infra.grassmannian
title: 'D4'': field Grassmannian H-quasi-projectivity'
projects:
- Algebraic-Jacobian-Challenge
summary: DONE. The Plucker chain constructs normalized maximal-minor charts, proves
  overlap compatibility, glues the absolute morphism, proves local coordinate-ring
  surjectivity and global IsImmersion, lifts to relative projective space over Spec
  Z, and combines existing properness with immersion to prove Grassmannian.isProjective_toSpecZ
  and isHQuasiProjective_toSpecZ. Projective/Grassmannian.lean consumes the latter
  to prove the chosen field representer H-quasi-projective. No Fin reindex is needed
  because the current predicates accept any finite coordinate type. D3 still owes
  its actual locus/map; the generic D4 composition adapter does not claim that construction.
