id: AJCR.picard.c2.rigid
title: 'Rigidification along a section: $\sigma^* L = 1$, lm:idn, lm:aut, and the
  unit $\mathrm{relPic} \to \mathrm{Pic}^{\mathrm{ét}}$'
projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: LANDED (8cd9ab33f). Every relative class has a rigidified representative
  $L \cdot (p^* \sigma^* L)^{-1}$ and rigidified representatives of equal classes
  are equal on the nose (lm:idn both directions); a rigidified representative of a
  descent class satisfies its descent equation $u_1^* L = u_2^* L$ as an honest equality
  in $\mathrm{Pic}(C_{B \otimes_A B})$; pullback of global units along the section
  of the projection is bijective (lm:aut); and the sheafification unit $\mathrm{relPicFunctor}
  \to \mathrm{picEtFunctor}$ in full.
