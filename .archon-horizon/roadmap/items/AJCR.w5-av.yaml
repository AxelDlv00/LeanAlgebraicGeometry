summary: 'Wave 5: $\mathrm{Pic}^0$ is an abelian variety of dimension $g$.


  **Interface layer complete; T4''s two-session residue (3c) closed run 0073 r5.**
  Done: the pinned

  `JacobianData` consumption interface, G1 geometric irreducibility, P2/P3 properness,
  S2 smoothness

  via `smooth_of_grpObj`, X1 separatedness, X2 translation transport, X3 $H^1$/genus
  base-field

  invariance, T1 the dual-number tangent kit, T2 the truncated-exponential Čech kernel.


  **T4 is the live front and it is now down to one mathematical statement plus two
  consumer inputs.**

  (3c), the monoidal-unit transport at $\varepsilon \mapsto 0$, is an **isomorphism**
  rather than the

  `eqToHom` the predecessor prescribed (`Tangent/DualNumberUnitTransport.lean`), and
  the ring-theoretic

  bridge $A[\varepsilon]/(\varepsilon) \simeq A$ under (iii-c2-aff-geo) is landed

  (`Tangent/DualNumberFstKernel.lean`). What remains of T4: (iii-c2-aff-geo) proper
  — a `CechPic` class

  on a chart of the thickened curve, owing the identification of `Opens.cechPicClass`
  of the restricted

  bundle with the base change upstairs — and the two satisfiable-but-unwitnessed inputs

  ($V_0 \neq \bot \wedge V_0 \neq \top$; `Surjective f.base` at $\varepsilon \mapsto
  0$).


  **T5/S1/S3 are downstream of T4 and unstarted.** T5 (the scalar identity $\dim_k
  T_0 = g$) consumes

  the T4 kernel comparison. S1 and S3 carry WORKSHEET-FIRST and have no worksheet
  section yet.


  **P1 remains a CROSS-WAVE GATE** on the DD shapes freeze held by `ajcr-divrep`;
  not attempted, and

  correctly so — nothing here is to be built against a guessed shape.


  **Cross-project (I-0689).** `ajc-pic0av`''s finding that the two-chart Čech machinery
  cannot close the

  tangent comparison is correct **for AJC only**: `LineBundle` occurs in zero AJCR
  files, `relPic` *is*

  a `CechPic` quotient definitionally, and the `[IsAffine]`-gated dictionary has no
  call site in AJCR''s

  tangent chain. Recorded so no successor re-prices that port in either direction.

  '
