summary: "Wave 5: Pic^0 is an abelian variety of dimension g. 10/16 children done.\n\
  \nTHE T3/T4/T5 CHAIN NEEDS ONE STATEMENT, down from three (run 0073 r3). The two\
  \ bookkeeping steps the r2 fresh-context review (I-0573) found absent are now landed\
  \ and kernel-checked:\n (b) CARRIER TRANSLATION at C_eps -- Tangent/DualNumberCarrier.lean\
  \ (Gamma(C,W)[eps] ~+* Gamma(C_eps, fst^-1 W), natural in the open) plus Tangent/DualNumberCarrierReduction.lean\
  \ (the eps|->0 section map IS fst/unitsFst). It split into (b-open)/(b-coeff); the\
  \ earlier account had covered only the open half.\n (c) REDUCTION SQUARE -- Tangent/TwoChartNaturality.lean,\
  \ map_twoChartClassHom, for an ARBITRARY morphism of schemes. The two cocycles are\
  \ EQUAL before any quotient, so nothing cohomological is spent.\n\nRESIDUE IS (iii-c2-aff)\
  \ ALONE: an eps-kernel Picard class is trivial on each THICKENED chart. Further\
  \ reduced this run -- Tangent/DualNumberChartPic.lean lands the Pic-level algebra\
  \ core and the coefficient-transport step, so what remains is EXACTLY the generator\
  \ (given L trivial on C, produce m and its cyclicity mod (eps)), carried as an explicit\
  \ hypothesis rather than a sorry.\n\nEverything in the comparison is sorry-free\
  \ and scheme-general with no dual numbers and no IsAffine where it can be, so AJC\
  \ can import rather than re-derive: Tangent/TwoChartCechPic.lean, TwoChartNormalize.lean,\
  \ TwoChartRepresentable.lean, TwoChartNaturality.lean. Posted to the cross-project\
  \ thread for ajc-pic0av.\n\nS1 stays a HYPOTHESIS by design (S2/S3 take GeometricallyReduced\
  \ as an instance argument, so it blocks nothing); its residue is the transcendental-extension\
  \ statement, genuinely absent from mathlib. P1 remains the only CROSS-WAVE gate,\
  \ held by the DD shapes freeze on ajcr-divrep.\n"
