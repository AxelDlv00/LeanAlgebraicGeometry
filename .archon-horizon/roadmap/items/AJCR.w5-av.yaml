summary: "Wave 5: Pic^0 is an abelian variety of dimension g. STATE at run 0073 r8:\
  \ 11 of 16 children done. Open: T3's COMPOSITE, T5's numeral, S1, S3, and the DD-gated\
  \ P1.\n\nTHE T-CHAIN IS COMPLETE EXCEPT FOR THE COMPOSITION, and r8 closed the last\
  \ named non-composite residue. Landed statements: (T3-1) h1AddEquivTruncExpCechKernel,\
  \ (T3-2) EpsArrowIdentification, (T3-3) TwoChartKernelComparison (twoChartClass\
  \ is a BIJECTION of the two kernels), (T3-4) CechPicIsoTransport, (T3-5) CollapseCechH1,\
  \ (T3-6a) EpsReductionSquare (the section equation plus the opens/family transport),\
  \ and hchart DISCHARGED at the Wave-5 charts (EpsChartTrivialInstance). Composing\
  \ them into H1(C,O) ~+ ker(CechPic(C_eps) -> CechPic(C)) is written nowhere and\
  \ is T3's entire residue.\n\nTHE STRUCTURAL LESSON OF THIS WAVE, and r8 is the fourth\
  \ session to meet it: rows repeatedly say 'the pieces are landed, what remains is\
  \ assembly' while the ARROWS between the pieces are absent. The one-second test\
  \ is a CONSUMER GREP -- count occurrences of each landed carrier OUTSIDE its defining\
  \ file. Run over the whole Wave-5 surface at r8: EIGHT landed declarations with\
  \ ZERO external consumers (the four S3 lemmas, twoChartKernelEquiv, collapseCechH1Equiv,\
  \ cechPicMapEquivOfIso, appLE_dualNumberSections), and the hchart producer with\
  \ FOUR external occurrences that were ALL PROSE. A level check comparing CARRIERS\
  \ cannot see this; only a consumer grep can. I-0711 / I-0630.\n\nAND THE SECOND\
  \ HALF, sharpened by r8 into a rule about MEASUREMENT rather than about naming.\
  \ r7 established: a residue named accurately is not thereby measured -- write the\
  \ Lean statement and read the leftover goals before writing a size. r8 establishes\
  \ the limit of that method: READING THE LEFTOVER GOALS MEASURES THE DIFFICULTY BUT\
  \ DOES NOT ENUMERATE THE INGREDIENTS. r7's 7.8 read the goal text, reported '[S],\
  \ NO MISSING INPUT IDENTIFIED', and was right about the content and wrong about\
  \ the list: its square spelled one open in relCurve C k's own form, so a non-rfl\
  \ transport (relCurveMap ^-1 fst_{k[eps]} ^-1 W vs fst_k ^-1 W) sat inside the elaborated\
  \ TYPE and never surfaced as a goal. Probe the equalities a statement ASSUMES, not\
  \ only the goals it LEAVES.\n\nA THIRD METHOD POINT, new at r8 and cheap to miss:\
  \ a rw that changes nothing and reports no error is a wrong DEFINITION, not a failing\
  \ tactic. An open-equality transport built as h |> RingEquiv.refl typechecks and\
  \ then silently blocks every rewrite (lean_goal identical before and after, no error\
  \ message). Build transports from the API's own restriction maps -- resHom at le_of_eq\
  \ -- as Cohomology/RelThetaTransportCore.presheafCongr already does.\n\nCHILD STATE,\
  \ one line each:\n * .data .g1 .p2 .p3 .x1 .x2 .x3 .t1 .t2 .t4 .s2 -- done.\n *\
  \ .t3 -- seven arrows landed (r8 added the section equation and hchart's instantiation);\
  \ residue is the COMPOSITION only, plus the separate question of whether it comes\
  \ out ADDITIVE. Two cautions in the row: the elaborated square's cost is UNMEASURED\
  \ (the timeouts were under load ~60 with swap exhausted), and MulEquiv.toAdditive\
  \ does not give the intertwining law.\n * .t5 -- ACTIVE. Spine landed. Conditional\
  \ on hdim, which needs the SEMILINEAR comparison (AddEquiv + intertwining across\
  \ kappa(e) ~+* k). A bare kernel bijection does NOT give it. Same residue AJC isolated\
  \ as semilinearComparison_cotangentSpaceDual_h1Cok.\n * .s1 -- pending, a HYPOTHESIS\
  \ by design: S2/S3 take GeometricallyReduced as an instance argument, so keeping\
  \ S1 open blocks nothing.\n * .s3 -- pending. Criterion landed (the obligation is\
  \ a COVER, not a chart at every point). CORRECTED r8: BOTH remaining inputs cost\
  \ something. The numeral is T5; and hcov is a genuine open input, not bookkeeping\
  \ -- X2 gives the count on each translated chart but NOT that they cover, and ajc-pic0av\
  \ has since shown the natural route (rational translates exhausting the points)\
  \ is CONTRADICTORY for g >= 1. The ZeroHypercover/opens shape is what makes the\
  \ S3 criterion survive that; do not restate it over points.\n * .p1 -- BLOCKED,\
  \ cross-wave gate on the DD shapes freeze. Not attempted, not built against a guessed\
  \ shape.\n\nCRITICAL PATH TO THE PARENT: T3's composition -> T5's numeral -> S3's\
  \ assembly. S1 is off it; P1 is gated elsewhere; nothing in the T-chain waits on\
  \ the DD freeze."
