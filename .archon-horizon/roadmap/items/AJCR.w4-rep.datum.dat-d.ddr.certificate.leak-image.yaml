projects:
- Algebraic-Jacobian-Challenge-Rebuild
summary: 'REJECTED 2026-07-25 (run 0048) — both of its two candidate routes are settled,
  in opposite ways.


  Route (a) "show the leak image is empty for the seed''s pieces, i.e. the piece traces
  are already

  closed" IS CORRECT and is now the leaf chart-avoid: by

  isClosed_supportLocus_inter_chart_of_forall_noLeak (Picard/DivSchemeCertZarChartTrace.lean)
  the

  per-piece statement is equivalent to closedness of the two CHART traces, which is
  a property of the

  system and the pinned charts alone.


  Route (b) "at a prime inside the leak image, REFINE the adaptation over a neighbourhood"
  IS DEAD.

  Refinement cannot help: the chart-b pieces always cover V_b, so the union of their
  traces is the

  fixed set supportLocus cap V_b, and a finite union of closed sets is closed — a
  finer cover only

  imposes MORE closed-trace constraints on the same union. Shrinking the base does
  not move the

  condition either; it restates it over the smaller base.


  THE LANDED HALF REMAINS VALID AND USEFUL: exists_basicOpen_supportLeak_eq_empty
  (no-leak on the open

  complement of the leak locus'' closed base image, with no fibre analysis) and

  forall_fibre_closure_subset_of_supportLeak_inter_eq_empty, plus the clopen identification

  isClopen_trace_of_supportLeak_eq_empty / supportLeak_eq_empty_of_isClopen_trace
  which shows the

  assembler clause IS I-0209''s Z-clopen principle. All in Picard/DivSchemeCertZarLeak.lean.

  '
