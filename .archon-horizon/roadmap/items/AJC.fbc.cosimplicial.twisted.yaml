summary: 'NOW THE ONLY OBSTRUCTION for flat base change (run 0068 r3). Its sibling
  leaf is closed, so this square alone stands between the tree and Stacks 02KG/02KH;
  the one-leaf endpoint is cech_flatBaseChange_oneLeaf. Whiskering does NOT apply
  here (verified by two rfl probes in run 0068 r2): the RHS is the nerve of the BASE-CHANGED
  cover, a different cosimplicial object, so there is no natural transformation to
  whisker and the mate trick that closed the S-level leaf cannot be reused. The residue
  is a two-nerve comparison: that the isoOfRangeEq slice identifications used per
  sigma in twisted_cech_nerve_per_sigma (landed, axiom-clean) commute with the inclusions
  U_tau subset U_sigma for sigma a subtuple of tau. That is a statement about the
  cover base-change identification coverInterOpen_baseChange_eq, not about modules.

