summary: "Twisted Cech nerve compatibility. ONE item remains, and it is the mathematics\
  \ (run 0068 r5).\n\nr4 left TWO items: (i) wiring, mechanical and unwritten; (ii)\
  \ half (a), the mathematics. (i) IS NOW\nWRITTEN. So this row's residue is exactly\
  \ one named Prop.\n\nITEM (i), CLOSED (r5, commit 09f2d8798, kernel EXIT=0):\n *\
  \ twistedComponent / twistedComponent_eq -- the degreewise component factored through\
  \ the\n   sigma-product, and the proof that it IS twisted_cech_nerve_iso's own component.\n\
  \ * twistedComponent_δ_square -- the coface square at the NERVE'S OWN spelling (target\
  \ the\n   base-changed nerve's degree object, not a Pi product), from TwistedPerSigmaDeltaCompat\
  \ alone.\n * THE BRIDGE was that the SAME sigma-coordinate coface formula applies\
  \ to the BASE-CHANGED cover:\n   cechNerve_backbone_δ_sigma at the bc cover gives\
  \ its nerve's coface as reindex-then-restrict,\n   exactly the Pi.lift shape r4's\
  \ square produces. No transport: the index types agree on the nose\n   (baseChangedCover_I₀).\
  \ bcNerve_drop_δ_sigma + sigmaAssembled_δ_square_cancel are the two bricks.\n\n\
  ITEM (ii), THE ONLY RESIDUE, now NAMED (r5, content in HEAD via 00aeff0e6; RECORD\
  \ 4fff36452):\n * BcSquareNaturality -- half (a) as a citable Prop, verbatim the\
  \ hBC binder of\n   twistedPerSigmaCompat_of_bcNaturality. Naming it is not cosmetic:\
  \ an obligation existing only as\n   a binder cannot be cited, probed, or reduced.\n\
  \ * BcSquarePullbackSide -- the same with the target pushforward cancelled (both\
  \ sides land in\n   pV_* pV^*(g'^*F), so eq_of_map_eq_of_adjunction reflects the\
  \ equality down from pV^*). Mentions\n   NO pushforward, so pullbackComp/pullbackCongr\
  \ and unit_mateEquiv apply to it directly.\n * bcSquareNaturality_iff_pullbackSide\
  \ -- BOTH directions, so this is a change of VOCABULARY and\n   NOT a weakening.\
  \ Stated up front because a reduction whose converse fails may have discarded\n\
  \   what made the statement true.\n * twistedPerSigmaCompat_of_pullbackSide -- the\
  \ whole residue in one name.\n\nSHAPE OF WHAT IS LEFT, measured by unfolding bcv\
  \ at r5: both sides are\n  asIso (openImmersion_bareBC ... .app (ι U_sigma ^* F))\
  \ followed by\n  (pushforward (pullback.fst g' (ι U_sigma))).mapIso (openImmersion_bc_telescope\
  \ ...).symm,\ncompared across the change of sigma. So half (a) is a statement about\
  \ openImmersion_bareBC and\nopenImmersion_bc_telescope across a change of square.\
  \ mateEquiv_vcomp remains the other candidate\nroute and is still blocked on \"\
  pushPullMap is the degenerate-square mate\" -- typechecks, NOT rfl,\nnot closed\
  \ by simp.\n\nMEASUREMENT: axiom-frontier section 6i. Four probes clean; TWO controls\
  \ (twisted_cech_nerve_iso,\ncech_flatBaseChange_oneLeaf) must and do still report\
  \ sorryAx. NOTHING previously contaminated\nbecame clean this round -- no endpoint\
  \ moved.\n"
