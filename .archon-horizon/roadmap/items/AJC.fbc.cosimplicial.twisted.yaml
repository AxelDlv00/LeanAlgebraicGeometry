summary: 'NOW THE ONLY OBSTRUCTION for flat base change (run 0068 r3, reviewer-verified
  at eed54636d). Its sibling leaf is closed, so this square alone stands between the
  tree and Stacks 02KG/02KH; the one-leaf endpoint is cech_flatBaseChange_oneLeaf,
  and a reviewer proved the "exactly one" claim rather than inferring it from absence
  (restate the endpoint with the twisted-nerve iso as an explicit hypothesis and the
  same term is axiom-clean).


  WHY THE MATE TRICK DOES NOT TRANSFER, verified by two rfl probes: this leaf''s RHS
  is drop.obj (CechNerve U'' (g''^* F)), the nerve of the BASE-CHANGED cover -- a
  different cosimplicial object, not a whiskering of the same N. So there is no natural
  transformation to whisker. The residue is a two-nerve comparison: that the isoOfRangeEq
  slice identifications used per sigma in twisted_cech_nerve_per_sigma (landed, axiom-clean)
  commute with the inclusions U_tau subset U_sigma for sigma a subtuple of tau. That
  is about coverInterOpen_baseChange_eq, not about modules.


  DECISION OWED TO A FUTURE SESSION (reviewer observation, not a defect): the r3 route
  leaves roughly 55 in-module declarations off the live path -- the whole pushPullObj_coverInter_baseChange
  / _spec / tilde-bridge chain that the superseded natIso consumed. All sorry-free
  and still compiling, so this is not churn, but decide whether that layer is retained
  deliberately or is maintenance-only before extending it.

  '
