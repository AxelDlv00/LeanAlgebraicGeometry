summary: "Twisted Cech nerve compatibility. BOTH BECK-CHEVALLEY MATES ARE NOW ELIMINATED;\
  \ what remains is a\npullback-pseudofunctor coherence identity (run 0068 r6).\n\n\
  THE FRONTIER THIS ROW RECORDED FOR FOUR ROUNDS IS GONE, and not by finding what\
  \ it asked for.\nr4/r5 said: \"nothing in the tree relates the mate across a change\
  \ of square -- not in the project,\nnot in mathlib\", and priced the leaf on that.\
  \ Correct diagnosis, wrong conclusion. A mate need not be\nRELATED across squares\
  \ if it can be REMOVED. r5 removed one (mateEquiv_counit). r6 removed the other.\n\
  \nWHY r5 GOT ONLY ONE SIDE, and how r6 got the second. r5's honest limit: on the\
  \ other side the mate\nsits at sigma'-o-delta^k while the counit sits at sigma',\
  \ separated by pushPullMap (wmap ...), and\nr5 correctly ruled out counit_naturality\
  \ for that step. The fix was to ask what the OBSTRUCTION is\nbuilt from: rawPushPullMap\
  \ is itself a UNIT (eta^a, pushforwardComp, pullbackComp). So the same\nmove applies\
  \ to it -- under p^* past the counit its unit dies by the left triangle.\n\nLANDED\
  \ r6, all axiom-clean, kernel EXIT=0, sorry count UNCHANGED at 3:\n * counit_comp_decomp\
  \ -- counit of (a >> p1) via pullbackComp-inv and the two single counits.\n * rawPushPullMap_pullback_counit_self\
  \ / rawPushPullMap_pullback_counit (general over-triangle).\n * bcv_hom_eq (by rfl)\
  \ + bcv_pullback_counit -- bcv's adjunct in CLOSED MATE-FREE form: pure\n   pullbackComp/pullbackCongr\
  \ coherence plus ONE counit of the open inclusion U_sigma -> X.\n * bcAdjFree, BcSquareCoherence,\
  \ bcSquareCounitSide_of_coherence, twistedPerSigmaCompat_of_coherence.\n\nMEASURED,\
  \ and this is the row's headline: the goal left by bcSquareCounitSide_of_coherence's\
  \ chain\ncontains ZERO occurrences of openImmersion_bareBC, bcv, or mateEquiv. Everything\
  \ in it is\npullbackComp / pullbackCongr / ppTel / openImmersion_bc_telescope plus\
  \ two counits of OPEN INCLUSIONS\nand the restriction map pushPullMap (interLegHom\
  \ ...).\n\nWHAT IS LEFT, stated so it is not mispriced in either direction: BcSquareCoherence\
  \ is NOT proved and\nis NOT free. It is a real identity about how the pullback pseudofunctor's\
  \ coherence isomorphisms\ninteract with the cover-intersection inclusion U_{sigma'}\
  \ subset U_{sigma'-o-delta^k}. But it needs\nno mate, no flatness, no quasi-coherence\
  \ and no open-immersion property, so the tools for it\n(pseudofunctor_associativity\
  \ / _left_unitality / _right_unitality, pullbackCongr, ppTel naturality)\nDO exist\
  \ here and in mathlib -- which was exactly what the old frontier lacked.\n\nCHAIN\
  \ TO CITE: BcSquareCoherence -> bcSquareCounitSide_of_coherence -> bcSquareNaturality_of_counitSide\n\
  -> twistedPerSigmaCompat_of_counitSide -> TwistedPerSigmaDeltaCompat -> twistedCechComplexIsoOfCompat.\n\
  Equivalently twistedPerSigmaCompat_of_coherence in one step.\n\nMEASUREMENT: five/eight\
  \ new decls report [propext, Classical.choice, Quot.sound] against TWO controls\n\
  (twisted_cech_nerve_iso, cech_flatBaseChange_oneLeaf) which must and do still report\
  \ sorryAx. NOTHING\npreviously contaminated became clean; no endpoint moved.\n\n\
  CAVEAT: r5 and r6 have had NO independent review -- 4/4 review subagent dispatches\
  \ stalled (I-0797).\nAll verification is self-verification: kernel EXIT=0, axiom\
  \ probes with firing controls, and\nconsumer-application probes.\n"
