summary: "Twisted Cech nerve compatibility. ONE named residue, everything around it\
  \ discharged (run 0068 r4).\n\nSTATE. twisted_cech_nerve_iso's naturality sorry\
  \ is still in the file, but the obligation is now\nreduced to a single equation\
  \ with no cosimplicial vocabulary in it, and the reduction is proved:\n\n * alternatingCofaceComplexIsoOfDelta\
  \ -- the consumer (alternatingCofaceMapComplex) has differential\n   sum (-1)^i\
  \ delta_i and never mentions a codegeneracy, so a complex isomorphism needs only\
  \ COFACE\n   compatibility, not the general-phi naturality NatIso.ofComponents demands.\
  \ This is load-bearing:\n   this tree's sigma-coordinate lemmas exist for delta\
  \ ONLY, and no general-phi analogue exists here\n   or in mathlib, so the wide interface\
  \ was unprovable from what we have.\n * cechNerve_backbone_δ_sigma / cechNerve_drop_δ_sigma\
  \ -- the coface in sigma-coordinates is\n   'reindex by delta^k, then restrict'.\
  \ One rw over four pre-existing lemmas that were merely\n   OUTSIDE the consumer's\
  \ import cone; three sessions had priced their absence as mathematics.\n * sigmaAssembled_δ_square\
  \ + twistedNerve_δ_square{,_concrete} -- the coface square FOLLOWS from the\n  \
  \ per-sigma compatibility. Pi.hom_ext does fire; the earlier 'it cannot' was true\
  \ only of the\n   obligation as posed, before the coordinate formula was available.\n\
  \nTHE RESIDUE, and it is the honest one: TwistedPerSigmaDeltaCompat --\nbase-change-then-restrict\
  \ = restrict-then-base-change for the per-sigma Beck-Chevalley isos\ntwisted_cech_nerve_per_sigma\
  \ and the intersection-open inclusions interLegHom. Both sides are\ncomposites of\
  \ landed sorry-free declarations. Equivalently: twisted_cech_nerve_per_sigma is\
  \ built\nper-sigma, and what is missing is its NATURALITY in the over-object --\
  \ a Y-natural Beck-Chevalley for\npush-pull, which a workspace-wide search found\
  \ nowhere (pushPullFunctor has no API beyond being\nwhiskered once).\n\nNEXT. Either\
  \ prove TwistedPerSigmaDeltaCompat directly (unfold twisted_cech_nerve_per_sigma:\
  \ an\nopenImmersion_beckChevalley composed with a pushPullObjCongr along an isoOfRangeEq\
  \ slice iso; the\ncontent is that both are induced by the same inclusions), or build\
  \ the Y-natural mate once and get\nit as a component. The second is more work and\
  \ more reusable.\n\nSeven new declarations measured axiom-clean; controls (twisted_cech_nerve_iso,\n\
  cech_flatBaseChange_oneLeaf, pullback_preservesMonomorphisms) still sorryAx, correctly.\n"
