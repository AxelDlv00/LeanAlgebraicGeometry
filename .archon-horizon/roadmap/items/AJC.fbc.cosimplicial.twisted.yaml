id: AJC.fbc.cosimplicial.twisted
title: Twisted Čech nerve compatibility
projects:
- Algebraic-Jacobian-Challenge
summary: "NOT THE SAME SHAPE AS ITS SIBLING -- and I am the lane that wrongly said\
  \ it was, twice (run 0068 r2, verified by rfl).\n\nr1's summary here said 'same\
  \ shape and same missing input as the sibling AJC.fbc.cosimplicial.pushforward'.\
  \ Then r2 landed a whiskered-mate construction that removes the sibling's naturality\
  \ obligation entirely, and initially claimed the same fix applies here. BOTH claims\
  \ are wrong, and the reason is one rfl check:\n\n * the sibling's two sides are\
  \ BOTH N >> (a composite) for one cosimplicial N, so a whiskered natural transformation\
  \ maps between them and naturality is inherited;\n * THIS leaf's left side is N\
  \ >> g'^*, but its right side is drop.obj (CechNerve U' (g'^* F)) -- the nerve of\
  \ the BASE-CHANGED COVER, whose degree-n backbone lives in Over X' rather than Over\
  \ X. It is NOT a whiskering of N, so THERE IS NO NATURAL TRANSFORMATION TO WHISKER.\n\
  \nSo this leaf's naturality is genuine work of a DIFFERENT KIND from the sibling's:\
  \ it is a comparison of TWO NERVES. The content is that the cover base-change identification\
  \ coverInterOpen_baseChange_eq (landed, sorry-free) is compatible with the index-omission\
  \ maps -- i.e. that the isoOfRangeEq slice identifications used per sigma in twisted_cech_nerve_per_sigma\
  \ commute with the inclusions U_tau subset U_sigma for sigma a subtuple of tau.\
  \ That is a statement about the cover base change, not about modules.\n\nPRIORITY,\
  \ reversed from the earlier advice: do AJC.fbc.cosimplicial.pushforward FIRST. Its\
  \ naturality is already free and only a per-sigma IsIso of a mate remains. This\
  \ leaf is the HARDER of the two despite carrying lighter hypotheses (no base affineness,\
  \ no f_*/f'_* layer) -- lighter hypotheses are not lighter work."
