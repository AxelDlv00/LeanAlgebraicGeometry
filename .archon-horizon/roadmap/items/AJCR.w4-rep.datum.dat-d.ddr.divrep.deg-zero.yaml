summary: DONE AS A VALID CONDITIONAL GEOMETRIC CONSTRUCTION. DivisorFamilyAffDegreeZeroRep
  proves the widened degree-zero functor is terminal and constructs divFunctorAffZeroRepresentableBy.
  Its conclusion omits pi, but the generated declaration retains externally supplied
  {pi} and [IsAffineHom pi] and its body uses pi to construct the trivial universal
  section. It is therefore a raw direct RepresentableBy result, not a strict unconditional
  or no-new-hypothesis producer. The all-genus representer consumes it only inside
  a context where a finite dominant pi is already supplied. The dedicated target and
  rooted AlgebraicJacobian target were reported green historically; the proof remains
  done, while the former unconditional wording is superseded.
