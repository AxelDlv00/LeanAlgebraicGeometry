summary: 'ADVANCED, NO GATE CLOSED (pic-g, 0096 r7). Released; all declarations are
  sorry-free and axiom-clean.


  The landed results are a statement-level equivalence between the global ring-case
  predicate and a finite family of Localization.Away predicates, together with the
  converse forall-prime form. They do NOT reduce the obligation to local rings: Localization.Away
  is a basic-open localization, not a local ring, and the outer forall-A equivalence
  makes the producer form a restatement rather than new representability progress.
  The missing AtPrime-to-Away spreading-out bridge is unowned (I-1665).


  The subsingleton test ring is only a vacuous non-counterexample: the conclusion
  holds there, but inhabitability of hrigAff on nonempty spectra remains open. The
  two-chart Cech and Laurent files are supporting computations; they do not discharge
  the general ring case.


  Remaining target: a genuine producer for the affine rigidity/vanishing hypothesis
  over non-field test algebras, or an explicit spreading-out theorem that supplies
  the Away witnesses. No local-ring shortcut is claimed.'
