summary: 'CLAIMED pic-g (0096 r7). Disjoint from pic-c''s engine route (pic0-ring-case)
  and from pic-d/pic-h. The surviving obligation of the whole vanishing route is:
  forall k-algebra A, Subsingleton (pic0Subgroup C (overSpec k A)) -- equivalently
  ring-level rigidity hrigAff. This row attacks its QUANTIFIER, not its content: PicEtAff
  has a landed Zariski sheaf property at basic opens (PicEtAffZariskiSep + PicEtAffZariskiGlue),
  so triviality of a plus class over A should follow from triviality over a basic-open
  cover of Spec A, hence from the local rings. NO NEW HYPOTHESIS is added to any existing
  statement.'
