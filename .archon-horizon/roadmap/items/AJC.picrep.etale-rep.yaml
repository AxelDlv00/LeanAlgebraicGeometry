id: AJC.picrep.etale-rep
title: 'UNOWNED: representability of picEt itself — the obligation no campaign milestone
  covers'
projects:
- Algebraic-Jacobian-Challenge
summary: 'REPRICED 2026-07-29 by ajc-p1 (run 0083): this is a ROUTE REPAIR, not a
  missing representability theorem. Owner released; the repair itself is unclaimed
  and now cheap to state.


  WHAT THE ROW USED TO SAY, and it was wrong in the expensive direction. It held that
  the campaign''s picSharp endpoint cannot reach clause (1)''s picEt without a k-rational
  point (because picEtComparison is Kleiman s2 Thm 2.5, an iso only under a section),
  and therefore that representability of the sheafified functor is a GENUINE ADDITIONAL,
  UNPRICED obligation -- possibly needing a headline restatement, i.e. a human specification
  decision.


  REFUTED, sorry-free, in Picard/PicEtSubcanonical.lean (6558cd78e, 323c7bb8c, 4009e3f98,
  ec2276583). The error was a direction confusion: Kleiman 2.5 derives the comparison
  from a section with no hypothesis on the presheaf, but the comparison IS the sheafification
  unit, and a unit is an iso exactly when its source is already a sheaf -- which representability
  supplies, since representable functors are sheaves for a subcanonical topology.

  * subcanonical_etaleTopology -- the etale topology IS subcanonical. Absent from
  Mathlib v4.31 as an instance (infer_instance fails); free from proetaleTopology
  via Subcanonical.of_le.

  * picSharp_representableBy_picEt_transport -- the SAME scheme representing picSharp
  represents picEt. NO [HasRationalPoint C].

  * hasPicSchemeEt_of_picSharp_representability -- clause (1) verbatim, from its picSharp
  analogue.

  * isIso_picEtComparison_of_picSharp_representability -- clause (2) UNCONDITIONALLY,
  strictly stronger than the seam''s own HasRationalPoint C -> IsIso.

  Eight declarations, all axiom-clean [propext, Classical.choice, Quot.sound]. Non-vacuity
  checked: IsIso (picEtComparison C) does NOT synthesize without the hypothesis; carrier
  identity machine-checked against clause (1) term-for-term.


  WHAT THE REPAIR IS, concretely. No new representability theorem is needed. Campaign
  G3/G4 conclude representability of picSharp/picSharpDeg over k itself, and that
  cannot be proved: not_representableBy_picSharp_of_not_isIso_picEtComparison shows
  that if picEtComparison fails to be an iso for even one curve then NO scheme represents
  picSharp there (X universally quantified, so the existential is refuted). Kleiman''s
  real conic u^2+v^2+w^2=0 in P^2_R is such a curve -- a smooth plane conic, hence
  smooth proper geometrically integral, with no R-point. So the work is to RESTATE
  G3/G4 to descend picEt rather than picSharp. Everything through J5 is unaffected:
  it runs over separably closed k'' where a section is cheap, and there the two functors
  agree.


  DO NOT rebuild the argument via ''picSharp is not a Zariski sheaf'' -- that mechanism
  is WITHDRAWN (I-0970). Kleiman L1292-1302 is about the ABSOLUTE functor Pic_X, and
  th:cmp part 1 in fact gives picSharp injecting into Pic_zar on these binders. picSharp_isSheaf_zariski_of_representableBy
  is kept as a true lemma but is only half an argument.


  THE SOLE REMAINING UNFORMALISED STEP, and it is bounded: that picEtComparison really
  fails for that conic. Kleiman''s witness is phi^*O(1) via h0 on P^1_C and flat base
  change (ex:Pfs, L1364-1375, answer L4853-4896; non-representability at L5105-5108,
  L5126-5129). Section 4''s theorems are the interface it plugs into. A lane taking
  that gets a Lean-verified ''G3/G4 are unprovable'', which is currently a quotation.


  NOTHING HERE CLOSES THE SEAM SORRY. No antecedent of any theorem in the file is
  witnessed for any curve.'
