id: AJC.rr.principal
title: Principal divisors have degree zero
projects:
- Algebraic-Jacobian-Challenge
summary: 'Principal divisors have degree zero. STILL OPEN (sorry at RiemannRoch/WeilDivisor.lean:1194,

  deliberately in place). Both items of the old two-item residue are now closed; what
  remains is

  ONE input, and it is a one-point local statement rather than a global identity.


  ITEM 1, residueDeg = 1: DISCHARGED (run 0055 s0006, Adelic/ResidueField.lean,

  residueDeg_eq_one_of_isAlgClosed_curve). For a prime divisor of a curve C : Over
  (Spec kbar) with

  kbar algebraically closed, under [IsIntegral] [IsLocallyNoetherian] [IsRegularInCodimensionOne]

  [LocallyOfFiniteType] [SmoothOfRelativeDimension 1] -- all carried by the project''s
  headline

  curve, LocallyOfFiniteType because mathlib''s IsProper extends it structurally (NOT
  from

  smoothness: that bridge is outside the module''s import closure, machine-checked).
  Route: mathlib''s

  residueFieldIsoBase gets integrality of kappa(x) from LocallyOfFiniteType via the
  Jacobson-space

  criterion, so the residue-finiteness gate is AVOIDED, not built. Bonus: node N14''s
  residue

  finiteness gate fell with it.


  ITEM 2, THE CLOSED LEDGER: DISCHARGED (run 0055 s0008, Adelic/LedgerClosure.chi_eq_of_bump).

  chi(D) = chi(0) + deg_k D at EVERY Weil divisor from the one-point bump alone. The
  previous

  summary recorded the extension past the effective cone as the substantive open half,
  needing

  ''an input the lane does not have'', with a correct-but-irrelevant obstruction argument
  (chi is not

  additive; D is not linearly equivalent to D+). No transport was needed: hbump admits
  an ARBITRARY

  base divisor, so the telescope runs onto the base D rather than up from 0.


  WHAT REMAINS, precisely: the leaf needs the BUMP for a 2-affine cover of C -- one
  application of

  chi_add_eq_residueDeg per step, which consumes the ledger exact sequence''s connecting
  and

  surjectivity data plus the strong-approximation input hsurj. So the leaf is open,
  but its open

  input is now a single one-point local statement.


  The sorry stays in place deliberately: substituting

  Adelic.degree_principal_eq_zero_of_isAlgClosed_curve (which proves the UNWEIGHTED
  deg(div g) = 0

  on curve hypotheses from the ledger alone) would make a theorem whose statement
  mentions no

  hypotheses depend silently on the bump. Adelic.degK_eq_degree_of_isAlgClosed_curve
  gives

  deg_k = deg with no open input whatsoever.'
