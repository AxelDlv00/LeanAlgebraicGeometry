summary: "Principal divisors have degree zero. STILL OPEN (sorry at RiemannRoch/WeilDivisor.lean,\
  \ non-constant branch\nof principal_degree_zero). But the position changed substantially\
  \ on 2026-07-28 and BOTH obstructions this\nnode recorded are now retired.\n\nOBSTRUCTION\
  \ 1 (IMPORT DIRECTION) IS DEAD. This node called it \"decisive on its own\": the\
  \ adelic endpoint\nproving the conclusion sits strictly downstream of the leaf,\
  \ so substituting it is an import inversion.\nThat argument was about the ADELIC\
  \ route. ajc-rr has since ported the AJCR chi-ledger INTO AJC\n(RiemannRoch/Ledger/,\
  \ 35 files, 9104L, 0 sorries, axiom-clean), and deg_divOf lives there.\nMEASURED\
  \ (ajc-pic0av, run 0067 r3): the Ledger.ChiLedger cone is 22 files / 5491 lines\
  \ and contains\nNEITHER WeilDivisor nor Genus nor CoheightBridge -- so WeilDivisor.lean\
  \ CAN import it. No inversion.\n\nOBSTRUCTION 2 (THE BUMP) IS NOT ON THIS ROUTE\
  \ AT ALL. deg_divOf comes from the devissage/skyscraper\nchi-ledger, not from the\
  \ adelic bump, and its two Module.Finite HModule binders discharge from\n[IsProper][Smooth\
  \ 1][GeomIrred] alone (moduleFinite_hModule_zero/one). So the hbump/hledger question\
  \ --\nwhose refutations are in any case vacuous at a curve (I-0548) -- is irrelevant\
  \ here.\n\nWHAT ACTUALLY REMAINS, ajc-rr gap list minus what has landed:\n 1. RESIDUE\
  \ WEIGHTING -- CLOSED over kbar. Ledger deg weights by residueDeg; WeilDivisor.degree\
  \ is a bare\n    coefficient sum. Ledger/ResidueOneAlgClosed.lean (fe4ab9411): residueDeg_eq_one_of_isAlgClosed\
  \ and\n    deg_eq_sum_of_isAlgClosed. principal_degree_zero carries [IsAlgClosed\
  \ kbar], so this is DISCHARGED,\n    not assumed. (I derived the same lemma independently\
  \ and deleted it as a duplicate.)\n 2. INDEX SET -- CLOSED both directions: PrimeDivisor.equivNonGeneric\
  \ (ajc-rr) plus\n    CurveDivisorIndexBridge.degree_eq_sum_nonGeneric, degree-preservingly.\n\
  \ 3. divOf vs this file principal -- OPEN, unchecked. Both are \"order of vanishing\
  \ at each point\", so this\n    is expected to be a definitional-agreement lemma\
  \ rather than mathematics.\n 4. A ROOTING BLOCKER, and it is the real one (measured,\
  \ ajc-pic0av run 0067 r3, filed as I-0576):\n    RiemannRoch/Ledger/ is imported\
  \ by NOTHING outside itself, so none of its 547 declarations is\n    elaborated\
  \ by the root target. Attempting to root it fails --\n      Ledger.OverOpen vs Cohomology.StructureSheafModuleK.SectionsBridge\
  \ both declare\n      CategoryTheory.Abelian.Ext.linearEquiv0_mk0_comp, with different\
  \ binders.\n    Full scan: 3 real collisions (that Ext lemma, HomogeneousLocalization.algebraMap_val,\n\
  \    val_fromZeroRingHom). So the ledger port is green ON ITS OWN PATH and does\
  \ not yet survive co-rooting.\n    That must be fixed by its owner (ajc-rr) before\
  \ this leaf can consume it.\n\nSO THE ROUTE IS: fix the collisions, root the ledger,\
  \ import it into WeilDivisor.lean, then close the\nbranch with deg_divOf + deg_eq_sum_of_isAlgClosed\
  \ + the index bridge + one divOf/principal agreement\nlemma. No adelic input, no\
  \ bump, no cover search.\n\nSTILL TRUE FROM EARLIER SUMMARIES: residueDeg = 1 for\
  \ the ADELIC residueDeg is separately discharged\n(Adelic/ResidueField.lean) --\
  \ note that is a DIFFERENT definition from the ledger one, same name.\nAdelic.degK_eq_degree_of_isAlgClosed_curve\
  \ needs no open input."
