summary: "Principal divisors have degree zero. STILL OPEN (sorry at RiemannRoch/WeilDivisor.lean:1333,\
  \ non-constant\nbranch of principal_degree_zero). Everything the leaf needs is now\
  \ PROVED in this project -- and the leaf\nstill cannot consume it, for one import\
  \ edge. That is the whole state.\n\nWHAT IS PROVED (ajc-rr, 2026-07-28, all sorry-free\
  \ and axiom-clean):\n * the chi-ledger ported into AJC: RiemannRoch/Ledger/, 35\
  \ files, unconditional at a curve. deg_divOf\n   comes from devissage/skyscraper,\
  \ NOT from the refuted adelic bump, and its two Module.Finite HModule\n   binders\
  \ discharge from [IsProper][Smooth 1][GeomIrred] alone.\n * Ledger/ResidueOneAlgClosed.lean\
  \ -- residueDeg_eq_one_of_isAlgClosed, deg_eq_sum_of_isAlgClosed: over\n   kbar\
  \ the ledger's residue weighting is a no-op, so its weighted deg agrees with the\
  \ bare coefficient\n   sum of WeilDivisor.degree. principal_degree_zero carries\
  \ [IsAlgClosed], so this is DISCHARGED.\n * Ledger/PrincipalTransport.lean:142 --\
  \ degree_principal_eq_zero_curve, whose conclusion is LITERALLY\n   the open branch's:\
  \ Scheme.WeilDivisor.degree (principal g) = 0, at the curve binders plus a coheight\n\
  \   bound and [IsAlgClosed].\n * the index comparison, both directions and degree-preservingly\
  \ (PrimeDivisor.equivNonGeneric +\n   CurveDivisorIndexBridge.degree_eq_sum_nonGeneric).\n\
  \nWHY THE LEAF IS STILL BLOCKED -- OBSTRUCTION 1 SURVIVES, and an earlier version\
  \ of this summary said it\nwas dead. CORRECTED (ajc-pic0av, run 0067 r3, measured):\
  \ PrincipalTransport imports\nCurveDivisorIndexBridge, whose cone (50 files) CONTAINS\
  \ RiemannRoch/WeilDivisor.lean. So the theorem with\nthe leaf's conclusion sits\
  \ strictly DOWNSTREAM of the leaf, and substituting it is an import inversion --\n\
  exactly what this node originally called \"decisive on its own\".\n\nThe distinction\
  \ that misled me, worth keeping: the Ledger.ChiLedger cone alone is 22 files and\
  \ contains\nNEITHER WeilDivisor nor Genus, so WeilDivisor.lean genuinely CAN import\
  \ the chi-ledger proper. But the\ntheorem proving the leaf's statement is not in\
  \ ChiLedger -- it is two layers up, past the index bridge,\nwhich necessarily reads\
  \ WeilDivisor. The importable part of the ledger and the proving part differ.\n\n\
  OBSTRUCTION 2 (the adelic bump) IS NOT ON THIS ROUTE AT ALL: deg_divOf does not\
  \ use it. The hbump/hledger\nrefutations -- themselves vacuous at a curve (I-0548)\
  \ -- are irrelevant here.\n\nTHE DECISION THE LEAF NEEDS, and it is a boundary decision\
  \ rather than mathematics (posted on I-0493):\n 1. drop the sorried branch at WeilDivisor.lean:1333\
  \ and let degree_principal_eq_zero_curve BE the\n    project's statement of the\
  \ result. ajc-pic0av leans this way.\n 2. split CurveDivisorIndexBridge so the transport\
  \ needs only its WeilDivisor-free half, then import\n    upward into the leaf.\n\
  \ 3. leave both in place with cross-referencing docstrings.\nOwner of WeilDivisor.lean\
  \ is ajc-pic0av; owner of Ledger/ is ajc-rr, so (2) is theirs.\n\nSECONDARY, and\
  \ it blocks nothing at the leaf but does mean the ledger is UNVERIFIED against the\
  \ rest of\nthe project: RiemannRoch/Ledger/ is imported by nothing outside itself,\
  \ so none of its 547 declarations is\nelaborated by the root target (I-0362). Rooting\
  \ it currently FAILS on a duplicate declaration --\nLedger/OverOpen.lean:79 and\
  \ Cohomology/StructureSheafModuleK/SectionsBridge.lean:91 both declare\nCategoryTheory.Abelian.Ext.linearEquiv0_mk0_comp\
  \ with different binders. Full scan: 3 real collisions.\nFiled as I-0576."
