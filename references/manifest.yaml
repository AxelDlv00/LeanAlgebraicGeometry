      (commutativity), Corollary 3 (linearity of pointed Hom on complete
      varieties), and the start of the Appendix to Section 4. Cite as
      mumford-abelian-varieties:page-0054, mumford-abelian-varieties:page-0055.
      PAGES 57-66 (book pp. 46-55, ALL of Section II.5 "Cohomology and base
      change"; page 66 = book p. 55 also opens II.6) transcribed 2026-07-16 via
      vision from rendered pages (no OCR), one self-contained LaTeX file per
      page under mumford-abelian-varieties/tex/. Statement map -- p. 46
      (page-0057): unnumbered assumed THEOREM (f proper, locally noetherian
      preschemes, F coherent => R^p f_*(F) coherent); definition of "flat over
      Y"/f-flat; unnumbered MAIN THEOREM (the Grothendieck complex, cited
      elsewhere as II.5.1): Y = Spec A, F coherent flat over Y => finite
      complex K^. of f.g. projective A-modules with H^p(X x_Y Spec B,
      F (x)_A B) ~= H^p(K^. (x)_A B) functorially in A-algebras B; proof opens
      with the alternating Cech complex C^. of a finite affine cover. p. 47
      (page-0058): the identification H^p(X x_Y Spec B, F (x) B) ~=
      H^p(C^. (x)_A B) functorial in B; LEMMA 1 (noetherian A, C^. with f.g.
      cohomologies concentrated in [0,n] => quasi-isomorphic complex K^. of
      f.g. modules, free in degrees 1..n, and K^0 A-flat when the C^p are);
      proof by descending induction with conditions (i)-(iv). p. 48
      (page-0059): the inductive construction K^m = K'^m (+) K''^m for
      m >= 0; the m = -1 step replacing K^0 by K^0/(ker d^0 cap Ker phi_0);
      the mapping-cylinder complex L^p = K^p (+) C^{p-1} and the exact
      cohomology sequence forcing H^p(L^.) = (0). p. 49 (page-0060): end of
      Lemma 1 (K^0 A-flat, hence A-projective); LEMMA 2 (a quasi-isomorphism
      of finite complexes of flat A-modules stays one after (x)_A B) with full
      proof (flat kernels Z^p, exactness of L^. (x) B); fiber notation X_y,
      F_y = F (x)_{O_Y} k(y) introduced. p. 50 (page-0061): unnumbered
      COROLLARY, cited on pp. 52/54 as "Corollary 1": (a) y -> dim_{k(y)}
      H^p(X_y, F_y) upper semicontinuous, (b) y -> chi(F_y) locally constant;
      proof = the (*) dimension count plus lower semicontinuity of rho_p(y) =
      dim Im(d^p (x) k(y)) via the exterior-power maps d_r^p; start of
      COROLLARY 2 (Y reduced connected). p. 51 (page-0062): Corollary 2's
      equivalence (i) y -> dim H^p(X_y, F_y) constant <=> (ii) R^p f_*(F)
      locally free with R^p f_*(F) (x) k(y) -> H^p(X_y, F_y) iso, plus the
      supplement (then the degree p-1 base-change map is an iso too); inner
      LEMMA 1 (Y reduced, coherent F with constant fibre dimension r =>
      locally free of rank r) with proof -- NB this is a SECOND local lemma
      numbering, distinct from the Lemma 1/2 of pp. 47-49. p. 52 (page-0063):
      inner LEMMA 2 (splitting lemma: map phi of locally free sheaves with
      locally constant fibre rank of the image splits as
      [[0, isom.],[0, 0]]) with proof; the splitting of K_{p-1} -> K_p ->
      K_{p+1} into projective summands finishing (i) => (ii); [sic] note
      (smudged k(y) printed like h(y)). p. 53 (page-0064): COROLLARY 3
      (H^p(X_y, F_y) = (0) for all y, Y not necessarily reduced =>
      R^{p-1} f_*(F) (x) k(y) -> H^{p-1}(X_y, F_y) iso for all y) with full
      proof; COROLLARY 4 (R^k f_*(F) = (0) for k > k_0 => H^k(X_y, F_y) = (0)
      for k > k_0), by Corollary 3 and descending induction; start of
      COROLLARY 5. p. 54 (page-0065): COROLLARY 5 (B flat over A =>
      H^p(X x_Y Spec B, F (x)_A B) ~= H^p(X, F) (x)_A B) with proof;
      COROLLARY 6 (SEESAW THEOREM, provisional form: X complete variety, T
      any variety, L line bundle on X x T => T_1 = {t : L|_{X x {t}} trivial}
      closed in T, and L|_{X x T_1} ~= p_2^* M for a line bundle M on T_1)
      with most of its proof (triviality criterion dim H^0(M) > 0 and
      dim H^0(M^{-1}) > 0); [sic] note ("(kt)" misprint for k(t), arrow
      printed leftward). p. 55 (page-0066): conclusion of the Corollary 6
      proof (p_2^*(M) -> L iso) ends II.5; then Section II.6 "The theorem of
      the cube: I" opens with its unnumbered THEOREM (L on X x Y x Z trivial
      on the three base-point slices => trivial) and the Remark defining
      functors of ORDER n via the natural splitting T(X_0 x ... x X_n) =
      Im alpha (+) Ker beta (so Pic is quadratic); [sic] note on the printed
      beta subscripts 0,2,...,n. Spot-checked 2026-07-16 against fresh 150 dpi
      pdftoppm renders of PDF pages 57/60/65: verbatim match including the
      recorded misprints. NOTE: the ten files' "% retrieved: 2026-07-11"
      header line is a copied template artifact; the transcription date is
      2026-07-16. Cite as mumford-abelian-varieties:page-0057 ...
      mumford-abelian-varieties:page-0066.
