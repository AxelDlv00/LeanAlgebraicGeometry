# Archon Horizon references manifest.
#
# Restored 2026-07-03 from the sibling workspace ../LeanAlgebraicGeometry, whose
# references were stored per-project; consolidated here into the single
# workspace-root references/ that this workspace expects. Scope = core
# critical-path projects (AJC, Albanese, Line-Bundle-Comparison-Iso,
# Cech-Cohomology, GR-Quot-Closure, MR0555258). Files are kept at the flat paths
# the blueprint provenance comments already cite (references/<file>), not under
# references/<slug>/, so existing citations resolve unchanged.
#
# Per-project retrieval notes that would have collided on merge are preserved
# under references/_project-notes/<project>/ (AJC's own summary.md / retrieval
# notes are the canonical ones at the root).

