    read: >-
      Text-extractable PDF, 15 pp. PRIMARY open surrogate for Stichtenoth GTM 254
      Ch. 1 (adele / Weil-differential proof of Riemann-Roch over an arbitrary
      constant field). Author states the exposition is "inspired by the treatment
      in Stichtenoth's [ST] (=Alg. Function Fields and Codes) and Iwasawa's [IW]
      books"; part 2 follows Rosen [RO]. Section map: 1.1 valuations / valuation
      rings / places; 1.2 Weak Approximation Theorem; 1.3 divisors, dim D = ell(D),
      genus g; 1.4 THE adelic RR proof -- Def 1.11 adele space A_F and A_F(D),
      Weil differentials Omega_F, Thm 1.18 (adelic preliminary formula
      dim D = deg D + 1 - g + i(D)),
      Lemma 1.21/1.22, Thm 1.23 dim_F Omega_F = 1, Thm 1.25 (divisor
      scaling (x omega) = (x) + (omega) and canonical equivalence), Thm 1.26
      (duality i(D) = dim(W-D)), Thm 1.27 (Riemann-Roch),
      Cor 1.28 canonical divisor W has deg 2g-2 and dim g, Cor 1.29 RR sharp for
      deg D >= 2g-1. Section 2 = Hurwitz genus formula + arithmetic theory. Cite
      by its own Thm/Def numbers (they do NOT match Stichtenoth's). PAGES 3-7
      transcribed 2026-07-14 via AI vision (no OCR) from the rendered pages
      (pdftoppm 300 DPI; images kept under papaioannou-algebraic-rr/pages/),
      one self-contained LaTeX file per page under
      papaioannou-algebraic-rr/tex/page-NNNN.tex; cite as
      papaioannou-algebraic-rr:page-0003 ... papaioannou-algebraic-rr:page-0007
      (printed page numbers coincide with PDF pages here; page 1 = title). Pages
      3-4 cover VALUATIONS and PLACES -- Def 1.3 (a place P = the maximal ideal
      of a valuation ring O of F/K, parameter t, place set P_F), Def 1.4 (a
      valuation v : F* ->> Z, surjective homomorphism, trivial on K*, satisfying
      the triangle inequality, v(0)=infinity), the v_P construction, and the
      DEGREE OF A PLACE = the residue degree [F_P : K] of the residue field over
      the constant field (Thm 1.5: deg P <= [F : K(x)] < infinity). Page 5 =
      Def 1.5 (zeroes/poles), Thm 1.6, Cor 1.7-1.8. Pages 6-7 cover DIVISORS --
      Div(F) is the free abelian group on the places (Def 1.6), i.e. the
      finitely-supported Z-indexed family D = sum n_P P over P in P_F with finite
      support; v_P : Div(F) -> Z reads off the P-coefficient; partial order and
      effectivity; and the DEGREE HOMOMORPHISM deg(D) = sum_P v_P(D)*deg(P),
      Div(F) -> Z, with Def 1.7-1.10 (zero/pole/principal divisors, class group
      Class(F)=Div(F)/Princ(F), L(D), genus g=sup{deg D - dim D + 1}). Source
      typos were transcribed verbatim (e.g. the "L(A)" misprint in Def 1.9).
      PAGES 8-12 transcribed 2026-07-26 via AI vision (no OCR) at 300 DPI, with
      rendered images retained and standalone LaTeX under the same directories;
      cite as papaioannou-algebraic-rr:page-0008 ...
      papaioannou-algebraic-rr:page-0012. Page 8 gives Lemma 1.13 (L(D) subset
      L(E) and the dimension/degree bound), Lemma 1.14 (finite-dimensionality of
      L(D)), and Thm 1.15 (principal divisors have degree zero, with zero and
      pole degrees [F:K(x)]). Page 9 gives Cor 1.16, Thm 1.17 (finite genus),
      and Def 1.11 (adeles). Page 10 gives Def 1.12 (A_F(D)), Thm 1.18 (the
      adelic preliminary Riemann-Roch formula), and Lemmas 1.19-1.21. Page 11
      completes Thm 1.18, gives Def 1.13 (Weil differentials and Omega_F(D)),
      Lemma 1.22 (dim Omega_F(D) = i(D)), and begins Thm 1.23. Page 12 completes
      Thm 1.23 (dim_F Omega_F = 1), gives Lemma 1.24 and Def 1.14 (the divisor
      of a differential and regularity), and Thm 1.25 ((x omega) = (x) +
      (omega), hence canonical divisors are equivalent). Visible source typos
      on these pages are likewise retained verbatim.
      PAGES 13-15 transcribed 2026-07-26 via AI vision (no OCR) at 300 DPI,
      with rendered images retained and standalone LaTeX under the same
      directories; cite as papaioannou-algebraic-rr:page-0013 ...
      papaioannou-algebraic-rr:page-0015. Page 13 gives Thm 1.26 (duality:
      L(W-D) is isomorphic to Omega_F(D), so i(D) = dim(W-D)), Thm 1.27
      (Riemann-Roch), Cor 1.28-1.29 (deg W = 2g-2, dim W = g, and the
      high-degree formula for deg D >= 2g-1), and Conj 2.1 (ABC I). Page 14
      gives Conj 2.2 (height form of ABC II), Thm 2.1 (function-field ABC),
      Thm 2.2 (Hurwitz formula and the tame-ramification equality criterion),
      and the closing arithmetic discussion. Page 15 is the complete reference
      list [AM], [HA], [IW], [LA], [RO], [TA], [ST], [WE]. Visible source typos
      on these pages are retained verbatim.
