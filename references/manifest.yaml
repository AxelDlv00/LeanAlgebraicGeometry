  - slug: MR0555258-compactifying-picard
    title: "Compactifying the Picard Scheme"
    authors: [Allen B. Altman, Steven L. Kleiman]
    year: 1980
    source: "Advances in Mathematics 35 (MR0555258)"
    retrieved: 2026-06-17
    status: ok
    files:
      - { path: MR0555258-compactifying-picard.pdf, format: pdf }
      - { path: MR0555258-compactifying-picard/tex/page-0018.tex, format: tex }
      - { path: MR0555258-compactifying-picard/tex/page-0019.tex, format: tex }
      - { path: MR0555258-compactifying-picard/tex/page-0020.tex, format: tex }
      - { path: MR0555258-compactifying-picard/tex/page-0021.tex, format: tex }
      - { path: MR0555258-compactifying-picard/tex/page-0022.tex, format: tex }
    read: >-
      See _project-notes/MR0555258-Compactifying-Picard/ for retrieval notes
      and summary. PDF only; page_offset: printed page N -> PDF index N-50.
      Pages 18-22 (printed pp. 68-72) transcribed 2026-08-04 via vision from
      rendered pages (pdftoppm 200dpi, no OCR). Theorem (2.9) starts on
      page-0020, its statement finishes on page-0021, and its proof finishes
      on page-0022. It proves effectivity and strong quasi-projectivity of the
      quotient of a strongly quasi-projective scheme by a flat, finitely
      presented, proper equivalence relation under the stated finite-Hilbert-
      polynomial hypothesis. Cite as
      MR0555258-compactifying-picard:page-0018 through
      MR0555258-compactifying-picard:page-0022.
    topics: [picard-scheme, compactification, related-paper]

  - slug: hartshorne-algebraic-geometry
    title: "Algebraic Geometry"
    authors: [Robin Hartshorne]
    year: 1977
    source: "Springer GTM 52"
    retrieved: 2026-06-17
    status: ok
    files:
      - { path: hartshorne-algebraic-geometry.pdf, format: pdf }
      - { path: hartshorne-algebraic-geometry.md, format: md }
      - { path: hartshorne-algebraic-geometry/tex/page-0147.tex, format: tex }
      - { path: hartshorne-algebraic-geometry/tex/page-0148.tex, format: tex }
      - { path: hartshorne-algebraic-geometry/tex/page-0154.tex, format: tex }
      - { path: hartshorne-algebraic-geometry/tex/page-0155.tex, format: tex }
      - { path: hartshorne-algebraic-geometry/tex/page-0242.tex, format: tex }
      - { path: hartshorne-algebraic-geometry/tex/page-0243.tex, format: tex }
      - { path: hartshorne-algebraic-geometry/tex/page-0316.tex, format: tex }
    read: >-
      PDF; blueprints cite e.g. II Ex 5.17. NOTE: some blueprints cite the
      stale alias references/hartshorne-ag.md which does not exist -- use
      hartshorne-algebraic-geometry.md. Pages 147-148 (printed pp. 130-131,
      page_offset: printed page N -> PDF page N+17) transcribed 2026-07-26
      via vision from the rendered scans (pdftoppm 200dpi, no OCR): the
      opening of II.6 "Weil Divisors"; regularity in codimension one and
      condition (*); prime divisors and Weil divisors as finite integer sums
      of codimension-one integral closed subschemes; the associated DVR
      valuations; Lemma II.6.1 proving that v_Y(f) is nonzero for only
      finitely many prime divisors; principal divisors (f); and linear
      equivalence with divisor class group Cl X, followed by the statement
      of Proposition II.6.2. Cite as
      hartshorne-algebraic-geometry:page-0147,
      hartshorne-algebraic-geometry:page-0148. Pages 242-243 (doc pp. 225-226,
      Theorem III.5.1 and its proof, "The Cohomology of Projective Space")
      transcribed 2026-07-11 via vision from the rendered scanned pages
      (PyMuPDF render, no OCR): the Cech complex of the standard affine
      cover $U_i = D_+(x_i)$ of $X = \mathbf{P}^r_A$, with
      $H^r(X,\mathcal F)$ computed as the cokernel of
      $\prod_k S_{x_0\cdots\hat x_k\cdots x_r} \to S_{x_0\cdots x_r}$, a
      free module on the "negative monomials" $\{x_0^{l_0}\cdots x_r^{l_r}
      : l_i<0 \text{ for each } i\}$. For $r=1$ (the two-chart cover
      $D_+(x_0), D_+(x_1)$ of $\mathbf P^1$) this is exactly the classical
      ancestor of the two-lattice/monomial-ladder finiteness argument:
      $Q_0 = $ image of $S_{x_0}$ (monomials with the $x_1$-exponent
      $\ge 0$), $Q_1 = $ image of $S_{x_1}$, and the quotient is spanned by
      the finite window of monomials surviving modulo both. Cite as
      hartshorne-algebraic-geometry:page-0242,
      hartshorne-algebraic-geometry:page-0243. RE-READ 2026-07-11 (same
      project, Cohomology.tex finiteness slice) and REUSED on
      AlgebraicGeometry.moduleFinite_hModule_one_of_isFinite_toP1
      (finiteness of H^1 along a finite map to P^1): the pages are the
      ANCESTOR, not the identical statement -- they prove the P^1 case
      (pi = id: H^1 of P^1 as the two-chart cokernel, finite/free on the
      negative-monomial window); the blueprint node generalizes S to a
      module finite over it via a finite morphism, with the monomial
      bookkeeping abstracted into the two-lattice ladder of the Algebra
      chapter (which cites the same pages).
      PAGES 154-155 AND 316 (printed pp. 137-138 and 299; page_offset: printed
      page N -> PDF page N+17, re-verified on the printed page numbers this
      pass) transcribed 2026-07-17 via vision from rendered pages (pdftoppm
      200dpi, no OCR), one self-contained LaTeX file per page under
      hartshorne-algebraic-geometry/tex/ (Wave-7 E-v gate: the classical
      degree-of-pullback statement, w7-ev-worksheet.md section 4). Statement
      map -- p. 137 (page-0154), II.6 "Divisors": tail of the proof of
      Proposition 6.7 ((i)=>(ii) by (4.9); closed points of a complete
      nonsingular curve in 1-1 correspondence with the DVRs of K/k, X ~=
      t(C_K); (iii)=>(i) by (I, 6.9)); PROPOSITION II.6.8 (X complete
      nonsingular curve over k, Y any curve, f : X -> Y a morphism => either
      (1) f(X) = a point, or (2) f(X) = Y; in case (2), K(X) is a finite
      extension field of K(Y), f is a FINITE morphism, and Y is also
      complete) with full proof (integral closure A of B in K(X) is a finite
      B-module (I, 3.9A), Spec A ~= open U of X (I, 6.7), U = f^{-1}V);
      DEFINITION of the degree of a finite morphism of curves =
      [K(X):K(Y)]; the divisors-on-curves paragraph (D = sum n_i P_i,
      deg D = sum n_i); DEFINITION of f^* : Div Y -> Div X via a local
      parameter t at Q (t in K(Y), v_Q(t) = 1): f^*Q = sum_{f(P)=Q}
      v_P(t) . P -- a finite sum since f is finite -- WELL-DEFINED
      (independent of t: t' = ut with u a unit in O_Q, hence a unit in each
      O_P, so v_P(t) = v_P(t')), extended by linearity; f^* preserves linear
      equivalence, inducing f^* : Cl Y -> Cl X. p. 138 (page-0155):
      PROPOSITION II.6.9 (f : X -> Y finite morphism of nonsingular curves
      => for any divisor D on Y, deg f^*D = deg f . deg D) with full proof
      (reduce to D = Q closed point; localize B and its integral closure A
      at S = B - m_Q to get O_Q -> A' finitely generated, torsion-free of
      rank r = [K(X):K(Y)], hence A' free of rank r = deg f and dim_k A'/tA'
      = r for t a local parameter; the P_i over Q correspond 1-1 to the
      maximal ideals m_i of A' with A'_{m_i} = O_{P_i}; tA' = intersect_i
      (tA'_{m_i} cap A') and the Chinese remainder theorem splits dim_k
      A'/tA' = sum_i dim_k A'/(tA'_{m_i} cap A') with each summand
      = dim_k O_{P_i}/tO_{P_i} = v_{P_i}(t), and f^*Q = sum v_{P_i}(t).P_i);
      COROLLARY II.6.10 (a principal divisor on a complete nonsingular curve
      has degree zero; deg : Cl X -> Z surjective) with proof (f not in k
      gives phi : X -> P^1, a morphism by (I, 6.12), finite by (6.8), and
      (f) = phi^*({0} - {infty})); EXAMPLE 6.10.1 (X rational iff there are
      two distinct points P ~ Q). p. 299 (page-0316), IV.2 "Hurwitz's
      Theorem" opening: Exercise 1.10 tail; recall deg f = [K(X):K(Y)]
      (II, section 6); DEFINITION of the ramification index e_P = v_P(t)
      via f^# : O_Q -> O_P; ramified/branch point/unramified (consistent
      with (III, Ex. 10.3) since k algebraically closed; unramified
      everywhere => etale, flat by (III, 9.7)); tame/wild; Figure 13;
      recall f^*(Q) = sum_{P -> Q} e_P . P (II, section 6) and the
      compatibility f^*(L(D)) ~= L(f^*D) -- printed citation is
      "(II, Ex. 6.8)" -- making f^* on divisors compatible with
      f^* : Pic Y -> Pic X. CHAPTER-IV ALTERNATE for the degree statement
      ("II.6.9/IV"): there is NO separately numbered Chapter-IV degree
      proposition; IV.2 recalls the II.6 machinery on printed p. 299
      (transcribed as page-0316) and degree multiplicativity is consumed in
      the proof of COROLLARY IV.2.4 (Hurwitz: 2g(X) - 2 = n(2g(Y) - 2)
      + deg R, n = deg f), printed p. 301 = PDF page 318, whose proof cites
      "f^* multiplies degrees by n (II, 6.9)" verbatim (located this pass,
      NOT transcribed -- named follow-up if IV.2.3/IV.2.4 text is ever
      needed; PROPOSITION IV.2.3 K_X ~ f^*K_Y + R sits on the same printed
      p. 301). Cite as hartshorne-algebraic-geometry:page-0154,
      hartshorne-algebraic-geometry:page-0155,
      hartshorne-algebraic-geometry:page-0316.
    topics: [schemes, sheaves, cohomology, curves, divisors, projective-space, cech-cohomology, two-lattice, monomial-ladder, finite-morphism, degree-of-divisor, pullback-of-divisors, ramification, hurwitz]

