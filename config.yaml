workspace:
  name: JacobianChallenge
  state_dir: .archon-horizon
  rounds: 8
  horizon_agent:
    harness: codex
  scheduler:
    max_parallel_sessions: 5
external_libraries:
- name: mathlib
  rev: v4.31.0
  path: .lake-packages/mathlib
references:
  transcription: null
harnesses:
  ground-default:
    kind: claude-code
    model: claude-opus-4-8
    options:
      effort: default
  horizon-default:
    kind: claude-code
    model: claude-opus-4-8
    options:
      effort: ultracode
  horizon-fable5:
    kind: claude-code
    model: claude-fable-5
    options:
      effort: ultracode
  horizon-opus-ultra:
    kind: claude-code
    model: claude-opus-4-8
    options:
      effort: ultracode
  codex:
    kind: codex
    model: gpt-5.6-sol
    options:
      effort: ultra
github:
  enabled: true
  repo: AxelDlv00/LeanAlgebraicGeometry-Horizon
projects:
  Algebraic-Jacobian-Challenge:
    path: MainProjects/Algebraic-Jacobian-Challenge
    type: lean
    vcs:
      enabled: true
      git_dir: .archon-horizon/vcs/Algebraic-Jacobian-Challenge.git
    build:
      command: lake build
  Line-Bundle-Comparison-Iso:
    path: SubProjects/Line-Bundle-Comparison-Iso
    type: lean
    vcs:
      enabled: true
      git_dir: .archon-horizon/vcs/Line-Bundle-Comparison-Iso.git
    build:
      command: lake build
  Albanese:
    path: SubProjects/Albanese
    type: lean
    vcs:
      enabled: true
      git_dir: .archon-horizon/vcs/Albanese.git
    build:
      command: lake build
  Cech-Cohomology:
    path: SubProjects/Cech-Cohomology
    type: lean
    vcs:
      enabled: true
      git_dir: .archon-horizon/vcs/Cech-Cohomology.git
    build:
      command: lake build
  GR-Quot-Closure:
    path: SubProjects/GR-Quot-Closure
    type: lean
    vcs:
      enabled: true
      git_dir: .archon-horizon/vcs/GR-Quot-Closure.git
    build:
      command: lake build
  MR0555258-Compactifying-Picard:
    path: SubProjects/RelatedPapersFormalisation/MR0555258-Compactifying-Picard
    type: lean
    vcs:
      enabled: true
      git_dir: .archon-horizon/vcs/MR0555258-Compactifying-Picard.git
    build:
      command: lake build
  Picard-IdentityComponent:
    path: SubProjects/Picard-IdentityComponent
    type: lean
    vcs:
      enabled: true
      git_dir: .archon-horizon/vcs/Picard-IdentityComponent.git
    build:
      command: lake build
  Algebraic-Jacobian-Challenge-Rebuild:
    path: MainProjects/Algebraic-Jacobian-Challenge-Rebuild
    type: lean
    vcs:
      enabled: true
      git_dir: .archon-horizon/vcs/Algebraic-Jacobian-Challenge-Rebuild.git
    build:
      command: lake build
