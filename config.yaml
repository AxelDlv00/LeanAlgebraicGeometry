workspace:
  name: JacobianChallenge
  state_dir: .archon-horizon
  rounds: 8
  delegation:
    allow_launch_tasks: true
    allow_launch_runs: true
    max_parallel_sessions: 14
    accounts:
    - name: codex-temp
      harness: codex
      config_dir: /home/axel/.codex-temp
      notes: Use for the AJCR review lanes; keep full project builds serialized.
    - name: codex-frenzy
      harness: codex-frenzy
      config_dir: /home/axel/.codex-frenzy
      notes: Use for an isolated parallel AJCR lane; keep full project builds serialized.
  horizon_agent:
    harness: codex
  scheduler:
    max_parallel_sessions: 14
external_libraries:
- name: mathlib
  rev: v4.31.0
  path: .lake-packages/mathlib
references:
  transcription: null
harnesses:
  ground-default:
    kind: claude-code
    model: claude-opus-4-8
    options:
      effort: default
  horizon-default:
    kind: claude-code
    model: claude-opus-4-8
    options:
      effort: ultracode
  horizon-fable5:
    kind: claude-code
    model: claude-fable-5
    options:
      effort: ultracode
      config_dir: /home/axel/.claude-zeming
  horizon-opus-ultra:
    kind: claude-code
    model: claude-opus-4-8
    options:
      effort: ultracode
  opus5:
    kind: claude-code
    model: claude-opus-5
    options:
      effort: ultracode
      config_dir: /home/axel/.claude-api
  codex:
    kind: codex
    model: gpt-5.6-sol
    options:
      effort: ultra
      config_dir: /home/axel/.codex-temp
  codex-frenzy:
    kind: codex
    model: gpt-5.6-sol
    options:
      effort: ultra
      config_dir: /home/axel/.codex-frenzy
github:
  enabled: true
  repo: AxelDlv00/LeanAlgebraicGeometry-Horizon
