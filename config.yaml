workspace:
  name: JacobianChallenge
  state_dir: .archon-horizon
  rounds: 8
  horizon_agent:
    harness: codex
  scheduler:
    max_parallel_sessions: 14
external_libraries:
- name: mathlib
  rev: v4.31.0
  path: .lake-packages/mathlib
references:
  transcription: null
harnesses:
  ground-default:
    kind: claude-code
    model: claude-opus-4-8
    options:
      effort: default
  horizon-default:
    kind: claude-code
    model: claude-opus-4-8
    options:
      effort: ultracode
  horizon-fable5:
    kind: claude-code
    model: claude-fable-5
    options:
      effort: ultracode
  horizon-opus-ultra:
    kind: claude-code
    model: claude-opus-4-8
    options:
      effort: ultracode
  opus5:
    kind: claude-code
    model: claude-opus-5
    options:
      effort: ultracode
  codex:
    kind: codex
    model: gpt-5.6-sol
    options:
      effort: ultra
github:
  enabled: true
  repo: AxelDlv00/LeanAlgebraicGeometry-Horizon
projects:
  Algebraic-Jacobian-Challenge-Rebuild:
    path: MainProjects/Algebraic-Jacobian-Challenge-Rebuild
    type: lean
    vcs:
      enabled: true
      git_dir: .archon-horizon/vcs/Algebraic-Jacobian-Challenge-Rebuild.git
    build:
      command: lake build
  Algebraic-Jacobian-Challenge:
    path: MainProjects/Algebraic-Jacobian-Challenge
    type: lean
    vcs:
      enabled: true
      git_dir: .archon-horizon/vcs/Algebraic-Jacobian-Challenge.git
    build:
      command: lake build
